        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getFeedback(score, total) {
            const p = score / total;
            if (p >= 0.9) return "Redo för provet! Fantastiskt bra!";
            if (p >= 0.7) return "Bra jobbat! Öva lite till på de du missade.";
            if (p >= 0.5) return "Halvvägs! Fortsätt träna.";
            return "Öva lite till – du är på rätt väg!";
        }

        function FlashcardView() {
            const total = concepts.length;
            const [deck, setDeck] = useState(() => shuffleArray([...concepts]));
            const [deckIdx, setDeckIdx] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [kudeInte, setKudeInte] = useState([]);
            const [kunde, setKunde] = useState([]);
            const [phase, setPhase] = useState('playing');

            const restartAll = () => {
                setDeck(shuffleArray([...concepts]));
                setDeckIdx(0);
                setIsFlipped(false);
                setKudeInte([]);
                setKunde([]);
                setPhase('playing');
            };

            const sort = (pile) => {
                const card = deck[deckIdx];
                const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
                const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
                const nextIdx = deckIdx + 1;
                setKudeInte(newKudeInte);
                setKunde(newKunde);
                setIsFlipped(false);
                if (nextIdx >= deck.length) {
                    setDeckIdx(nextIdx);
                    setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
                } else {
                    setDeckIdx(nextIdx);
                }
            };

            const nextRound = () => {
                setDeck(shuffleArray([...kudeInte]));
                setDeckIdx(0);
                setIsFlipped(false);
                setKudeInte([]);
                setPhase('playing');
            };

            if (phase === 'allDone') return (
                <div className="flex flex-col items-center gap-6">
                    <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
                        <div className="text-5xl mb-4">🎉</div>
                        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
                        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
                        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>Börja om med alla</button>
                    </div>
                </div>
            );

            if (phase === 'roundEnd') return (
                <div className="flex flex-col items-center gap-6">
                    <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
                        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
                        <div className="flex justify-center gap-8 mb-6">
                            <div className="text-center">
                                <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
                                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
                            </div>
                            <div className="text-center">
                                <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
                                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
                            </div>
                        </div>
                        <div className="flex flex-col gap-3">
                            <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
                                Öva på Kunde inte ({kudeInte.length} kort) →
                            </button>
                            <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                                Börja om med alla
                            </button>
                        </div>
                    </div>
                </div>
            );

            const card = deck[deckIdx];
            const remaining = deck.length - deckIdx;

            return (
                <div className="flex flex-col items-center">
                    <div className="flex gap-3 mb-5 w-full max-w-sm">
                        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
                            <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
                            <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
                        </div>
                        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
                            <p className="text-xl font-bold text-slate-400">{remaining}</p>
                            <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
                        </div>
                        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
                            <p className="text-xl font-bold text-green-500">{kunde.length}</p>
                            <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
                        </div>
                    </div>
                    <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
                        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
                            <div className="flip-card-front">
                                <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
                                <div className="absolute bottom-6 animate-pulse">
                                    <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
                                </div>
                            </div>
                            <div className="flip-card-back">
                                <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
                                <div className="absolute bottom-6">
                                    <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    {isFlipped && (
                        <div className="flex gap-3 w-full max-w-sm mb-4">
                            <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
                                ✗ Kunde inte
                            </button>
                            <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
                                ✓ Kunde
                            </button>
                        </div>
                    )}
                    <div className="flex flex-col items-center gap-2 mt-1">
                        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
                        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
                    </div>
                </div>
            );
        }

        function LucktextView() {
            const [inputs, setInputs] = useState(concepts.map(() => ''));
            const [attempts, setAttempts] = useState(concepts.map(() => 0));
            const [statuses, setStatuses] = useState(concepts.map(() => null));
            const [done, setDone] = useState(false);

            const normalize = s => s.trim().toLowerCase();

            const submit = (i) => {
                if (statuses[i] === 'correct' || statuses[i] === 'wrong-final') return;
                if (normalize(inputs[i]) === normalize(concepts[i].term)) {
                    const s = [...statuses]; s[i] = 'correct'; setStatuses(s);
                } else {
                    const a = [...attempts]; a[i]++; setAttempts(a);
                    const s = [...statuses]; s[i] = a[i] >= 2 ? 'wrong-final' : 'wrong-once'; setStatuses(s);
                }
            };

            const rättaAlla = () => { setStatuses(statuses.map(s => s === 'correct' ? 'correct' : 'wrong-final')); setDone(true); };
            const börjaOm = () => { setInputs(concepts.map(() => '')); setAttempts(concepts.map(() => 0)); setStatuses(concepts.map(() => null)); setDone(false); };

            const correctCount = statuses.filter(s => s === 'correct').length;
            const allDone = done || statuses.every(s => s === 'correct' || s === 'wrong-final');

            return (
                <div>
                    <div className="mb-6 p-4 bg-white rounded-2xl shadow-sm border border-slate-200">
                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Begreppsbank</p>
                        <div className="flex flex-wrap gap-2">
                            {concepts.map((c, i) => (
                                <span key={i} className={`px-3 py-1 rounded-full text-sm font-medium border transition-all ${statuses[i] === 'correct' ? 'line-through text-slate-400 bg-green-50 border-green-200' : 'bg-yellow-50 border-yellow-300 text-yellow-800'}`}>{c.term}</span>
                            ))}
                        </div>
                    </div>
                    <div className="grid gap-4">
                        {concepts.map((c, i) => {
                            const parts = c.sentence.split('_____');
                            const st = statuses[i];
                            return (
                                <div key={i} className={`bg-white p-5 rounded-2xl shadow-sm border-l-8 transition-all ${st === 'correct' ? 'border-green-500' : st === 'wrong-final' ? 'border-red-400' : 'border-yellow-400'}`}>
                                    <p className="text-slate-700 mb-3 leading-relaxed">{parts[0]}<span className="font-bold text-yellow-600">[_____]</span>{parts[1]}</p>
                                    {st === 'correct' ? (
                                        <div className="flex flex-wrap items-center gap-2 text-green-600"><span className="font-bold">✓ {c.term}</span><span className="text-sm font-normal text-slate-500">– {c.definition}</span></div>
                                    ) : st === 'wrong-final' ? (
                                        <div><p className="text-red-500 text-sm">Rätt svar: <span className="font-bold">{c.term}</span></p><p className="text-slate-500 text-sm mt-1">{c.definition}</p></div>
                                    ) : (
                                        <div>
                                            <div className="flex gap-2">
                                                <input type="text" value={inputs[i]} onChange={e => { const v = [...inputs]; v[i] = e.target.value; setInputs(v); }} onKeyDown={e => e.key === 'Enter' && submit(i)} placeholder="Skriv begreppet och tryck Enter..." className="flex-1 border-2 border-slate-200 rounded-xl px-4 py-2 focus:outline-none focus:border-yellow-400 text-sm" style={{fontFamily:'Fredoka,sans-serif'}} />
                                                <button onClick={() => submit(i)} className="text-yellow-900 px-4 py-2 rounded-xl font-bold hover:opacity-80 transition-colors" style={{background: PRIMARY}}>→</button>
                                            </div>
                                            {st === 'wrong-once' && <p className="text-orange-500 text-sm mt-2 font-medium">Är du säker att du stavat rätt?</p>}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    <div className="mt-8 flex justify-between items-center">
                        <button onClick={börjaOm} className="text-slate-500 hover:text-slate-700 font-medium transition-colors">↺ Börja om</button>
                        {!allDone && <button onClick={rättaAlla} className="bg-slate-800 text-white px-6 py-3 rounded-2xl font-bold hover:bg-slate-700 transition-colors">Rätta alla</button>}
                    </div>
                    {allDone && (
                        <div className="mt-8 border-2 rounded-3xl p-8 text-center" style={{background:'#fef9c3', borderColor: PRIMARY}}>
                            <p className="text-5xl font-bold mb-2" style={{color: PRIMARY}}>{correctCount}/{concepts.length}</p>
                            <p className="text-xl font-bold text-slate-800 mb-4">{getFeedback(correctCount, concepts.length)}</p>
                            <button onClick={börjaOm} className="text-yellow-900 px-8 py-3 rounded-2xl font-bold hover:opacity-80 transition-colors" style={{background: PRIMARY}}>Börja om</button>
                        </div>
                    )}
                </div>
            );
        }

        function ScenarioView() {
            const [shuffledIdxs] = useState(() => shuffleArray(concepts.map((_, i) => i)));
            const [current, setCurrent] = useState(0);
            const [answered, setAnswered] = useState(null);
            const [selected, setSelected] = useState(null);
            const [score, setScore] = useState(0);
            const [done, setDone] = useState(false);
            const [termOptions, setTermOptions] = useState(() => shuffleArray(concepts.map(c => c.term)));

            const conceptIdx = shuffledIdxs[current];
            const concept = concepts[conceptIdx];

            const handleSelect = (term) => {
                if (answered !== null) return;
                setSelected(term);
                const isCorrect = term === concept.term;
                setAnswered(isCorrect ? 'correct' : 'wrong');
                if (isCorrect) setScore(s => s + 1);
            };

            const next = () => {
                if (current + 1 >= concepts.length) { setDone(true); return; }
                setCurrent(c => c + 1);
                setAnswered(null);
                setSelected(null);
                setTermOptions(shuffleArray(concepts.map(c => c.term)));
            };

            const reset = () => {
                setCurrent(0); setAnswered(null); setSelected(null); setScore(0); setDone(false);
                setTermOptions(shuffleArray(concepts.map(c => c.term)));
            };

            if (done) return (
                <div className="text-center">
                    <div className="border-2 rounded-3xl p-8 mb-6" style={{background:'#fef9c3', borderColor: PRIMARY}}>
                        <p className="text-5xl font-bold mb-2" style={{color: PRIMARY}}>{score}/{concepts.length}</p>
                        <p className="text-xl font-bold text-slate-800 mb-4">{getFeedback(score, concepts.length)}</p>
                        <button onClick={reset} className="text-yellow-900 px-8 py-3 rounded-2xl font-bold hover:opacity-80 transition-colors" style={{background: PRIMARY}}>Börja om</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-2xl mx-auto">
                    <div className="flex justify-between items-center mb-3">
                        <span className="font-bold" style={{color:'#92400e'}}>Poäng: {score}</span>
                        <span className="text-slate-400 text-sm">{current + 1} / {concepts.length}</span>
                    </div>
                    <div className="w-full bg-slate-200 rounded-full h-2 mb-6">
                        <div className="h-2 rounded-full transition-all" style={{background: PRIMARY, width: `${((current + 1) / concepts.length) * 100}%`}}></div>
                    </div>
                    <div className="bg-white p-6 rounded-3xl shadow-lg mb-6">
                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Vilket begrepp beskrivs?</p>
                        <p className="text-lg text-slate-800 leading-relaxed italic">"{concept.scenario}"</p>
                    </div>
                    <div className="grid grid-cols-2 gap-3 mb-6">
                        {termOptions.map((term, i) => (
                            <button key={i} onClick={() => handleSelect(term)} disabled={answered !== null}
                                className={`p-4 rounded-2xl font-bold border-2 text-left transition-all text-sm ${
                                    answered === null ? 'bg-white border-slate-200 hover:bg-yellow-50' :
                                    term === concept.term ? 'bg-green-50 border-green-500 text-green-700' :
                                    term === selected ? 'bg-red-50 border-red-500 text-red-700' :
                                    'bg-white border-slate-100 text-slate-300'
                                }`}
                                style={answered === null ? {borderColor:'#e2e8f0'} : undefined}
                                onMouseEnter={e => { if (answered === null) e.currentTarget.style.borderColor = PRIMARY; }}
                                onMouseLeave={e => { if (answered === null) e.currentTarget.style.borderColor = '#e2e8f0'; }}>
                                {term}
                            </button>
                        ))}
                    </div>
                    {answered !== null && (
                        <div>
                            <div className={`p-4 rounded-2xl text-sm font-medium mb-4 ${answered === 'correct' ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'}`}>
                                {answered === 'correct' ? `✓ Rätt! ${concept.definition}` : `✗ Fel. Rätt svar: ${concept.term} – ${concept.definition}`}
                            </div>
                            <button onClick={next} className="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-slate-800 transition-all">
                                {current + 1 >= concepts.length ? 'Se resultat' : 'Nästa scenario →'}
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function IckeExempelView() {
            const makeOpts = (c) => {
                const flip = Math.random() > 0.5;
                return flip
                    ? [{ text: c.ickeExempel.korrekt, isCorrect: true }, { text: c.ickeExempel.icke, isCorrect: false }]
                    : [{ text: c.ickeExempel.icke, isCorrect: false }, { text: c.ickeExempel.korrekt, isCorrect: true }];
            };
            const freshState = () => {
                const ord = shuffleArray(concepts.map((_, i) => i));
                return { ord, cur: 0, opts: makeOpts(concepts[ord[0]]), answered: null, selIdx: null, score: 0, done: false };
            };
            const [s, setS] = useState(freshState);
            const concept = concepts[s.ord[s.cur]];

            const handleSelect = (idx) => {
                if (s.answered !== null) return;
                const isCorrect = s.opts[idx].isCorrect;
                setS(prev => ({ ...prev, answered: isCorrect ? 'correct' : 'wrong', selIdx: idx, score: prev.score + (isCorrect ? 1 : 0) }));
            };

            const next = () => {
                const nextCur = s.cur + 1;
                if (nextCur >= concepts.length) { setS(prev => ({ ...prev, done: true })); return; }
                setS(prev => ({ ...prev, cur: nextCur, opts: makeOpts(concepts[prev.ord[nextCur]]), answered: null, selIdx: null }));
            };

            const reset = () => setS(freshState);

            if (s.done) return (
                <div className="text-center">
                    <div className="border-2 rounded-3xl p-8 mb-6" style={{background:'#fef9c3', borderColor: PRIMARY}}>
                        <p className="text-5xl font-bold mb-2" style={{color: PRIMARY}}>{s.score}/{concepts.length}</p>
                        <p className="text-xl font-bold text-slate-800 mb-4">{getFeedback(s.score, concepts.length)}</p>
                        <button onClick={reset} className="text-yellow-900 px-8 py-3 rounded-2xl font-bold hover:opacity-80 transition-colors" style={{background: PRIMARY}}>Börja om</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-2xl mx-auto">
                    <div className="flex justify-between items-center mb-3">
                        <span className="font-bold" style={{color:'#92400e'}}>Poäng: {s.score}</span>
                        <span className="text-slate-400 text-sm">{s.cur + 1} / {concepts.length}</span>
                    </div>
                    <div className="w-full bg-slate-200 rounded-full h-2 mb-6">
                        <div className="h-2 rounded-full transition-all" style={{background: PRIMARY, width: `${((s.cur + 1) / concepts.length) * 100}%`}}></div>
                    </div>
                    <div className="bg-white p-6 rounded-3xl shadow-lg mb-6">
                        <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Vilket är rätt tillämpning?</p>
                        <h2 className="text-2xl font-bold" style={{color:'#92400e'}}>{concept.term}</h2>
                        <p className="text-sm text-slate-500 mt-1 leading-relaxed">{concept.definition}</p>
                    </div>
                    <div className="grid gap-3 mb-6">
                        {s.opts.map((opt, i) => (
                            <button key={i} onClick={() => handleSelect(i)} disabled={s.answered !== null}
                                className={`p-4 rounded-2xl border-2 text-left transition-all ${
                                    s.answered === null ? 'bg-white border-slate-200 hover:bg-yellow-50' :
                                    opt.isCorrect ? 'bg-green-50 border-green-500 text-green-700' :
                                    i === s.selIdx ? 'bg-red-50 border-red-500 text-red-700' :
                                    'bg-white border-slate-100 text-slate-300'
                                }`}
                                style={s.answered === null ? {borderColor:'#e2e8f0'} : undefined}
                                onMouseEnter={e => { if (s.answered === null) e.currentTarget.style.borderColor = PRIMARY; }}
                                onMouseLeave={e => { if (s.answered === null) e.currentTarget.style.borderColor = '#e2e8f0'; }}>
                                <span className="font-bold mr-2">{i === 0 ? 'A' : 'B'}.</span>{opt.text}
                            </button>
                        ))}
                    </div>
                    {s.answered !== null && (
                        <div>
                            <div className={`p-4 rounded-2xl text-sm mb-4 ${s.answered === 'correct' ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'}`}>
                                <p className="font-bold mb-1">{s.answered === 'correct' ? '✓ Rätt!' : '✗ Fel!'}</p>
                                <p>{concept.ickeExempel.forklaring}</p>
                            </div>
                            <button onClick={next} className="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-slate-800 transition-all">
                                {s.cur + 1 >= concepts.length ? 'Se resultat' : 'Nästa begrepp →'}
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [view, setView] = useState('list');

            const activeTab = 'text-yellow-900 font-bold shadow-sm';
            const inactiveTab = 'text-slate-500';

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="max-w-2xl mx-auto mb-8 flex items-center justify-between">
                        <a href="index.html" className="text-slate-500 hover:text-yellow-600 transition-colors flex items-center gap-2 font-medium text-sm">← Tillbaka till startsidan</a>
                        <h1 className="text-2xl md:text-3xl font-bold text-center">Internationella relationer</h1>
                        <div className="w-36"></div>
                    </header>

                    <div className="max-w-2xl mx-auto mb-10 flex bg-white p-1 rounded-full shadow-md border border-slate-200 overflow-x-auto gap-0.5">
                        {[['list','Lista'],['flashcards','Flashcards'],['lucktext','Lucktext'],['scenario','Scenario'],['icke','Icke-ex.']].map(([key, label]) => (
                            <button key={key} onClick={() => setView(key)} className={`flex-1 py-2 px-2 rounded-full transition-all duration-300 text-xs whitespace-nowrap ${view === key ? activeTab : inactiveTab}`}
                                style={view === key ? {background: PRIMARY} : {}}>
                                {label}
                            </button>
                        ))}
                    </div>

                    <main className="max-w-2xl mx-auto">
                        {view === 'list' && (
                            <div className="grid gap-4">
                                {concepts.map((item, index) => (
                                    <div key={index} className="bg-white p-5 rounded-2xl border-l-8 shadow-sm hover:shadow-md transition-shadow" style={{borderColor: PRIMARY}}>
                                        <div className="flex items-center gap-3 mb-1">
                                            <span className="text-xs font-bold px-2 py-1 rounded-lg" style={{background:'#fef9c3', color:'#78350f'}}>{index + 1}</span>
                                            <h3 className="text-lg font-bold">{item.term}</h3>
                                        </div>
                                        <p className="text-slate-600 leading-relaxed ml-10">{item.definition}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                        {view === 'flashcards' && <FlashcardView />}
                        {view === 'lucktext' && <LucktextView />}
                        {view === 'scenario' && <ScenarioView />}
                        {view === 'icke' && <IckeExempelView />}
                    </main>

                    <footer className="mt-12 text-center text-slate-400 text-sm italic pb-8">Källa: Samhällskunskap – Internationella relationer begreppslista</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="feedback-widget.js" defer></script>
    <script data-goatcounter="https://johnblixt.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
