function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function FlashcardsView() {
  const total = concepts.length;
  const [deck, setDeck] = React.useState(() => shuffle([...concepts]));
  const [deckIdx, setDeckIdx] = React.useState(0);
  const [isFlipped, setIsFlipped] = React.useState(false);
  const [kudeInte, setKudeInte] = React.useState([]);
  const [kunde, setKunde] = React.useState([]);
  const [phase, setPhase] = React.useState('playing');

  const restartAll = () => {
    setDeck(shuffle([...concepts]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffle([...kudeInte]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ backgroundColor: PRIMARY }}>
          Börja om med alla
        </button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ backgroundColor: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
        </div>
      </div>

      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner${isFlipped ? ' flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ backgroundColor: PRIMARY }}>
            <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back bg-white" style={{ border: `3px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.def}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>

      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>

            ✓ Kunde

      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function LucktextView() {
  const initStates = () => lucktextData.map(() => ({ input: '', status: 'idle' }));
  const [states, setStates] = React.useState(initStates);
  const [finished, setFinished] = React.useState(false);

  const correctCount = states.filter(s => s.status === 'correct').length;

  React.useEffect(() => {
    if (states.length > 0 && states.every(s => s.status === 'correct' || s.status === 'revealed')) {
      setFinished(true);
    }
  }, [states]);

  function updateState(i, patch) {
    setStates(prev => {
      const next = [...prev];
      next[i] = { ...next[i], ...patch };
      return next;
    });
  }

  function handleSubmit(i) {
    const s = states[i];
    if (s.status === 'correct' || s.status === 'revealed') return;
    const answer = s.input.trim();
    const term = lucktextData[i].term;
    if (answer.toLowerCase() === term.toLowerCase()) {
      updateState(i, { status: 'correct' });
    } else if (s.status === 'idle') {
      updateState(i, { status: 'warn' });
    } else {
      updateState(i, { status: 'error' });
    }
  }

  function rattaAlla() {
    setStates(prev => prev.map(s => s.status === 'correct' ? s : { ...s, status: 'revealed' }));
    setFinished(true);
  }

  function borjaOm() {
    setStates(initStates());
    setFinished(false);
  }

  function grade() {
    const pct = correctCount / lucktextData.length;
    if (pct === 1) return 'Perfekt! Du kan alla begreppen!';
    if (pct >= 0.8) return 'Bra jobbat! Öva lite till på de du missade.';
    if (pct >= 0.6) return 'Godkänt — fortsätt öva så sitter det snart!';
    return 'Fortsätt öva — du lär dig mer för varje gång!';
  }

  return (
    <div className="flex flex-col gap-5">
      <div className="bg-white rounded-xl shadow-sm p-4">
        <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {lucktextData.map((item, i) => (
            <span
              key={i}
              className="text-sm px-2 py-0.5 rounded-full transition-all"
              style={{
                backgroundColor: states[i].status === 'correct' ? LIGHT_BG : '#f3f4f6',
                color: states[i].status === 'correct' ? DARK_TEXT : '#9ca3af',
                textDecoration: states[i].status === 'correct' ? 'line-through' : 'none',
              }}
            >
              {item.term}
            </span>
          ))}
        </div>
      </div>

      {lucktextData.map((item, i) => {
        const st = states[i];
        const parts = item.sentence.split('___');
        const def = concepts.find(b => b.term === item.term)?.def ?? '';

        let borderColor = '#e5e7eb';
        if (st.status === 'correct')  borderColor = '#16a34a';
        if (st.status === 'revealed') borderColor = '#dc2626';
        if (st.status === 'warn')     borderColor = '#f97316';
        if (st.status === 'error')    borderColor = '#dc2626';

        return (
          <div key={i} className="bg-white rounded-xl shadow-sm px-5 py-4" style={{ border: `2px solid ${borderColor}` }}>
            <p className="text-gray-700 leading-relaxed">
              {parts[0]}
              {st.status === 'correct'  && <strong style={{ color: '#16a34a' }}>{item.term}</strong>}
              {st.status === 'revealed' && <strong style={{ color: '#dc2626' }}>{item.term}</strong>}
              {st.status !== 'correct' && st.status !== 'revealed' && (
                <input
                  type="text"
                  value={st.input}
                  onChange={e => updateState(i, { input: e.target.value })}
                  onKeyDown={e => e.key === 'Enter' && handleSubmit(i)}
                  className="border-b-2 border-gray-300 focus:border-amber-400 outline-none px-1 mx-1 text-gray-800 font-semibold bg-transparent"
                  style={{ width: `${Math.max(item.term.length * 0.65, 8)}em` }}
                  placeholder="..."
                />
              )}
              {parts[1]}
            </p>
            {st.status === 'warn'     && <p className="text-sm font-semibold mt-2" style={{ color: '#f97316' }}>Är du säker att du stavat rätt?</p>}
            {st.status === 'error'    && <p className="text-sm font-semibold mt-2 text-red-600">Fel svar — fortsätt försöka eller tryck "Rätta alla".</p>}
            {st.status === 'correct'  && <p className="text-sm text-gray-500 mt-2">✓ {def}</p>}
            {st.status === 'revealed' && <p className="text-sm text-gray-500 mt-2">{def}</p>}
          </div>
        );
      })}

      {!finished && (
        <button onClick={rattaAlla} className="mx-auto px-6 py-2.5 rounded-full font-semibold text-white bg-slate-900 hover:bg-slate-700 transition-colors">
          Rätta alla
        </button>
      )}

      {finished && (
        <div className="bg-white rounded-xl shadow-sm p-6 text-center">
          <p className="text-4xl font-bold mb-2" style={{ color: DARK_TEXT }}>{correctCount} / {lucktextData.length} rätt</p>
          <p className="text-gray-600 mb-5">{grade()}</p>
          <button onClick={borjaOm} className="px-6 py-2.5 rounded-full font-semibold text-white" style={{ backgroundColor: PRIMARY }}>
            Börja om
          </button>
        </div>
      )}
    </div>
  );
}

function ScenarioView() {
  const allTerms = scenarioData.map(d => d.term);

  const buildQuestions = () =>
    shuffle(scenarioData).map(item => ({
      ...item,
      options: shuffle([item.term, ...shuffle(allTerms.filter(t => t !== item.term)).slice(0, 3)]),
    }));

  const [questions, setQuestions] = React.useState(buildQuestions);
  const [current, setCurrent] = React.useState(0);
  const [score, setScore] = React.useState(0);
  const [selected, setSelected] = React.useState(null);
  const [done, setDone] = React.useState(false);

  const q = questions[current];

  const handleAnswer = (term) => {
    if (selected !== null) return;
    setSelected(term);
    if (term === q.term) setScore(s => s + 1);
  };

  const next = () => {
    if (current + 1 >= questions.length) { setDone(true); }
    else { setCurrent(c => c + 1); setSelected(null); }
  };

  const restart = () => {
    setQuestions(buildQuestions());
    setCurrent(0); setScore(0); setSelected(null); setDone(false);
  };

  const grade = (s) => {
    const pct = s / questions.length;
    if (pct === 1)   return 'Perfekt! Du känner igen alla begrepp i deras sammanhang!';
    if (pct >= 0.8)  return 'Bra jobbat! Du behärskar de flesta scenarier.';
    if (pct >= 0.6)  return 'Godkänt — öva lite till på de du missade.';
    return 'Fortsätt öva — varje runda stärker din förståelse!';
  };

  if (done) return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{ borderColor: PRIMARY }}>
        <div className="text-5xl mb-4">🎯</div>
        <p className="text-3xl font-bold mb-2" style={{ color: DARK_TEXT }}>{score} / {questions.length}</p>
        <p className="text-gray-600 mb-6">{grade(score)}</p>
        <button onClick={restart} className="w-full text-white px-8 py-3 rounded-2xl font-bold" style={{ backgroundColor: PRIMARY }}>Börja om</button>
      </div>
    </div>
  );

  return (
    <div className="flex flex-col gap-5 max-w-2xl mx-auto">
      <div className="flex items-center justify-between text-sm font-medium text-gray-500">
        <span>Scenario {current + 1} av {questions.length}</span>
        <span className="px-3 py-1 rounded-full" style={{ backgroundColor: LIGHT_BG, color: DARK_TEXT }}>{score} rätt</span>
      </div>
      <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div className="h-full rounded-full transition-all" style={{ width: `${(current / questions.length) * 100}%`, backgroundColor: PRIMARY }} />
      </div>
      <div className="bg-white rounded-2xl shadow-sm p-6" style={{ borderLeft: `6px solid ${PRIMARY}` }}>
        <p className="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3">Vilket begrepp beskrivs?</p>
        <p className="text-gray-800 text-lg leading-relaxed">{q.scenario}</p>
      </div>
      <div className="flex flex-col gap-3">
        {q.options.map((opt, i) => {
          let style = { border: '2px solid #e5e7eb', background: '#fff', color: '#1f2937' };
          if (selected !== null) {
            if (opt === q.term)     style = { border: '2px solid #16a34a', background: '#f0fdf4', color: '#14532d' };
            else if (opt === selected) style = { border: '2px solid #dc2626', background: '#fef2f2', color: '#7f1d1d' };
            else                    style = { border: '2px solid #e5e7eb', background: '#f9fafb', color: '#9ca3af' };
          }
          return (
            <button key={i} onClick={() => handleAnswer(opt)} disabled={selected !== null}
              className="rounded-xl px-5 py-3 text-left font-semibold transition-all hover:shadow-sm disabled:cursor-default"
              style={style}>
              {opt}
            </button>
          );
        })}
      </div>
      {selected !== null && (
        <div className="flex flex-col gap-3 items-center">
          {selected === q.term
            ? <p className="font-semibold text-green-700">✓ Rätt!</p>
            : <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-center w-full">
                <p className="text-red-700 font-semibold">✗ Fel — rätt svar: <span className="underline">{q.term}</span></p>
              </div>
          }
          <button onClick={next} className="text-white px-8 py-3 rounded-2xl font-bold" style={{ backgroundColor: PRIMARY }}>
            {current + 1 >= questions.length ? 'Se resultat' : 'Nästa scenario →'}
          </button>
        </div>
      )}
    </div>
  );
}

    setSelected(option);
    if (option === q.correctOption) setScore(s => s + 1);

    if (current + 1 >= questions.length) { setDone(true); }

    if (pct >= 0.8) return 'Bra jobbat! Du behärskar de flesta begreppen.';
    if (pct >= 0.6) return 'Godkänt — öva lite till på de du missade.';

  if (done) return (

    <div className="flex flex-col gap-5 max-w-2xl mx-auto">
      <div className="flex items-center justify-between text-sm font-medium text-gray-500">
        <span>Begrepp {current + 1} av {questions.length}</span>
        <span className="px-3 py-1 rounded-full" style={{ backgroundColor: LIGHT_BG, color: DARK_TEXT }}>{score} rätt</span>
      </div>
      <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div className="h-full rounded-full transition-all" style={{ width: `${(current / questions.length) * 100}%`, backgroundColor: PRIMARY }} />
      </div>
      <div className="bg-white rounded-2xl shadow-sm p-6" style={{ borderLeft: `6px solid ${PRIMARY}` }}>
        <p className="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Vilket alternativ stämmer?</p>
        <p className="text-2xl font-bold" style={{ color: DARK_TEXT }}>{q.term}</p>
      </div>
      <div className="flex flex-col gap-3">
        {['A', 'B'].map(opt => (
          <button
            key={opt}
            onClick={() => handleSelect(opt)}
            disabled={selected !== null}
            className="rounded-xl px-5 py-4 text-left font-medium transition-all hover:shadow-sm disabled:cursor-default"
            style={getOptionStyle(opt)}
          >
            <span className="font-bold mr-2">{opt}.</span>
            {opt === 'A' ? q.optionA : q.optionB}
          </button>
        ))}
      </div>
      {selected !== null && (
        <div className="flex flex-col gap-3 items-center">
          <div className={`w-full rounded-xl px-4 py-3 ${selected === q.correctOption ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
            <p className={`font-semibold mb-1 ${selected === q.correctOption ? 'text-green-700' : 'text-red-700'}`}>
              {selected === q.correctOption ? '✓ Rätt!' : '✗ Fel — rätt alternativ var ' + q.correctOption + '.'}
            </p>
            <p className="text-gray-700 text-sm">{q.explanation}</p>
          </div>
          <button onClick={next} className="text-white px-8 py-3 rounded-2xl font-bold" style={{ backgroundColor: PRIMARY }}>
            {current + 1 >= questions.length ? 'Se resultat' : 'Nästa begrepp →'}
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
