<style>
  :root {

    --pl: #f0fdf4;

  .wrap { max-width: 74rem; margin: 0 auto; padding: 1.6rem 1.25rem 4rem; }

  /* ── Tillbaka ── */
  .back {
    display:inline-flex; align-items:center; gap:.35rem; font-family:'Fredoka',sans-serif;
    font-size:.88rem; color:#94a3b8; text-decoration:none; transition:color .15s;
  }
  .back:hover { color: var(--p-deep); }

  /* ── Header ── */
  .head { text-align:center; margin: 1.8rem 0 1.6rem; }
  .eyebrow {
    font-family:'Fredoka',sans-serif; font-size:.72rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.22em; color:var(--p-deep); margin:0 0 .5rem;
  }
  .head h1 {
    font-size: clamp(2rem, 6vw, 2.9rem); font-weight:700; font-style:italic;
    color:#0f172a; margin:0; line-height:1.1;
  }

  .lead { font-size:1rem; color:#64748b; max-width:34rem; margin:0 auto; line-height:1.7; }
  .lead strong { color:var(--p-deep); font-weight:700; }

  /* ── Toggle ── */
  .pill-toggle {
    display:flex; gap:.3rem; justify-content:center; background:#fff; border:1px solid #e2e8f0;
    border-radius:999px; padding:.3rem; width:fit-content; margin:0 auto .6rem;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .pill-toggle button {
    padding: .5rem 1.4rem; border-radius: 999px; font-family:'Fredoka',sans-serif;
    font-weight: 600; font-size: .95rem; transition: all .2s; border: none; cursor: pointer;
  }
  .pill-toggle button.active   { background: var(--p); color: var(--pd); box-shadow:0 2px 8px rgba(74,222,128,.4); }
  .pill-toggle button.inactive { background: transparent; color: #94a3b8; }
  .mode-note {
    text-align:center; font-family:'Fredoka',sans-serif; font-size:.82rem; color:#94a3b8;
    margin:0 0 1rem;
  }

  /* ── Färgkoder: ämnesord = gult, bindeord = grönt ── */
  .amne  { background:#fef08a; color:#713f12; font-weight:700; padding:0 .2em; border-radius:.3em;
           -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .binde { background:#bbf7d0; color:#14532d; font-weight:700; padding:0 .2em; border-radius:.3em;
           -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .legend {
    display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; justify-content:center; align-items:center;
    font-family:'Fredoka',sans-serif; font-size:.85rem; color:#64748b; margin:0 auto 1.8rem;
  }
  .legend .amne, .legend .binde { font-weight:600; }

  /* ── Layout: sticky innehållsförteckning + innehåll ── */
  .layout { display:grid; grid-template-columns: 16.5rem minmax(0,1fr); gap:2rem; align-items:start; }
  .toc {
    position:sticky; top:1rem; max-height:calc(100vh - 2rem); overflow-y:auto;
    background:#fff; border:1px solid #e2e8f0; border-radius:1.2rem;
    padding:.9rem .8rem; box-shadow:0 1px 3px rgba(0,0,0,.05);

  .toc-h {
    font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; color:var(--p-deep); margin:.2rem .3rem .5rem;
  }
  .toc-del {
    font-family:'Fredoka',sans-serif; font-size:.74rem; font-weight:600; color:#64748b;
    margin:.8rem .4rem .25rem; line-height:1.35;
  }
  .toc-del:first-child { margin-top:.2rem; }
  .toc-btn { display:none; }
  .toc-list a {
    display:flex; align-items:center; gap:.6rem; padding:.45rem .6rem; border-radius:.75rem;
    color:#334155; text-decoration:none; transition:background .15s; line-height:1.3; font-size:.98rem;
  }
  .toc-list a:hover { background: var(--pl); }
  .toc-list a.active { background: var(--p-badge); color:var(--pd); font-weight:700; }
  .toc-n {
    flex:none; min-width:2.1rem; height:1.6rem; padding:0 .35rem; border-radius:999px; background:var(--p-badge); color:var(--pd);
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:.78rem;
    display:flex; align-items:center; justify-content:center;
  }
  .toc-list a.active .toc-n { background:var(--p); }
  .toc-t { flex:1; }

  /* ── Delar och avsnitt ── */
  .del-head {
    font-size:1.05rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em;
    color:var(--p-deep); margin:2.6rem 0 1rem; padding-bottom:.4rem; border-bottom:2px solid var(--p-badge);
    scroll-margin-top:1rem;
  }
  .del-head:first-child { margin-top:0; }
  .sec { margin-bottom: 2.4rem; scroll-margin-top: 1rem; }
  .sec-head {
    display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
    background:#fff; border-left:8px solid var(--p);
    border-radius:1rem; padding:1.1rem 1.2rem; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .sec-nr {
    flex:none; background:var(--p-badge); color:var(--pd); font-family:'Fredoka',sans-serif;
    font-weight:700; font-size:.95rem; border-radius:999px; padding:.2rem .65rem;
  }
  .sec-title { flex:1; font-size:1.45rem; font-weight:600; color:#0f172a; line-height:1.25; margin:0; }
  .sec-sida { flex:none; font-family:'Fredoka',sans-serif; font-size:.8rem; color:#64748b;
              background:#f1f5f9; border-radius:999px; padding:.2rem .7rem; }

  /* ── Brödtext ── */
  .block { padding: .2rem .3rem 0; }
  .block p.ll { margin:1rem 0 .5rem; line-height:1.95; color:#334155; font-size:1.12rem; }

  .fdj {
    background:#fff; border:1px solid var(--p-badge); border-left:4px solid var(--p);
    border-radius:0 1rem 1rem 0; padding:.9rem 1.1rem .7rem; margin:1.2rem 0;

  .fdj li::before { content:'→'; position:absolute; left:0; color:var(--p-deep); font-weight:700; }

  /* ── Inbyggda diagram (SVG) ── */
  .diagram { margin:1.4rem 0; background:#fff; border:1px solid #e2e8f0; border-radius:1.2rem; padding:1rem 1rem .8rem; }
  .diagram svg { display:block; width:100%; height:auto; max-width:30rem; margin:0 auto; }
  .diagram svg text { font-family:'Fredoka',sans-serif; }
  .diagram figcaption { font-size:.95rem; color:#475569; line-height:1.6; margin-top:.6rem; text-align:center; }
  .diagram figcaption b { font-family:'Fredoka',sans-serif; color:var(--pd); }

  .to-top { text-align:center; margin:1rem 0 .2rem; }
  .to-top a { font-family:'Fredoka',sans-serif; font-size:.8rem; color:#94a3b8; text-decoration:none; }
  .to-top a:hover { color:var(--p-deep); }

  /* ── Öva vidare ── */
  .next {
    background:#fff; border-top:8px solid var(--p); border-radius:1.5rem;
    padding:1.4rem 1.4rem 1.5rem; margin-top:2.4rem; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .next h2 { font-size:1.3rem; font-weight:600; margin:0 0 .3rem; color:#0f172a; }
  .next p { margin:0 0 1rem; color:#64748b; line-height:1.6; }
  .next-btn {
    display:flex; align-items:center; gap:.6rem; padding:.85rem 1rem; border-radius:1rem;
    font-family:'Fredoka',sans-serif; font-weight:600; text-decoration:none; transition:transform .15s;
    background:var(--p); color:var(--pd);
  }
  .next-btn:hover { transform:translateY(-2px); }

  /* ── Footer ── */
  .foot { text-align:center; margin-top:3rem; color:#94a3b8; font-size:.85rem; line-height:1.7; }
  .foot .by { font-style:italic; }

  /* ── Mobil ── */
  @media (max-width: 767px) {
    body { font-size: 1rem; }
    .wrap { padding: 1.2rem .9rem 3rem; }
    .layout { display:block; }
    .toc { position:sticky; top:0; z-index:30; max-height:none; overflow:visible;
           border-radius:0 0 1rem 1rem; margin:0 -.9rem 1.4rem; padding:.5rem .9rem;
           border-top:none; border-left:none; border-right:none; }
    .toc-h { display:none; }
    .toc-btn { display:flex; width:100%; align-items:center; justify-content:space-between; gap:.6rem;
               background:var(--p-badge); color:var(--pd); border:none; border-radius:.8rem; padding:.6rem .9rem;
               font-family:'Fredoka',sans-serif; font-weight:600; font-size:.95rem; cursor:pointer; text-align:left; }
    .toc-btn-t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .toc-list { display:none; max-height:60vh; overflow-y:auto; padding-top:.4rem; }
    .toc.open .toc-list { display:block; }
    .sec, .del-head { scroll-margin-top: 4.2rem; }
    .sec-title { font-size: 1.2rem; }
    .sec-head { padding: .85rem .9rem; gap:.5rem .65rem; border-left-width:6px; }
    .block p.ll { font-size:1.05rem; line-height:1.85; }
    .pill-toggle button { padding:.45rem 1.05rem; font-size:.88rem; }
    .fdj { padding:.8rem .85rem .6rem; }
    .diagram { padding:.7rem .4rem .6rem; }
    .legend { font-size:.8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior:auto !important; }
  }
</style>

      "DNA är rullat kring proteiner som kallas **histoner**. DNA och histoner kallas **kromatin**. Kromatinet är tätast packat __när__ cellen delar sig. __Då__ syns kromosomerna i ljusmikroskop efter infärgning (s. 52).",

/* ---------- Textformatering: **ord** -> ämnesord (gult), __ord__ -> bindeord (grönt) ---------- */
function fmt(text) {
  const parts = String(text).split(/(\*\*.+?\*\*|__.+?__)/g);
  return parts.map((part, i) => {
    if (part.startsWith('**') && part.endsWith('**') && part.length > 4)
      return <mark key={i} className="amne">{part.slice(2, -2)}</mark>;
    if (part.startsWith('__') && part.endsWith('__') && part.length > 4)
      return <mark key={i} className="binde">{part.slice(2, -2)}</mark>;
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
}

  const steg = ['Plasmid klipps upp', 'Insulingen isoleras', 'Genen klistras in', 'Bakterien odlas i en bioreaktor', 'Insulinet utvinns', 'Insulinet är klart'];
  const icon = (i, cx, cy) => {
    if (i === 0) return <path d={`M${cx + 14} ${cy - 10} A18 18 0 1 1 ${cx + 14} ${cy + 10}`} fill="none" stroke={C.T} strokeWidth="5" strokeLinecap="round" />;
    if (i === 1) return <rect x={cx - 16} y={cy - 5} width="32" height="10" rx="5" fill={C.red} />;
    if (i === 2) return (
      <g>
        <circle cx={cx} cy={cy} r="18" fill="none" stroke={C.T} strokeWidth="5" />
        <path d={`M${cx + 14} ${cy - 11} A18 18 0 0 1 ${cx + 14} ${cy + 11}`} fill="none" stroke={C.red} strokeWidth="6" />
      </g>
    );
    if (i === 3) return (
      <g>
        <rect x={cx - 15} y={cy - 18} width="30" height="36" rx="6" fill="#e0f2fe" stroke="#0369a1" strokeWidth="2.5" />
        <rect x={cx - 15} y={cy - 2} width="30" height="20" rx="6" fill="#7dd3fc" />
        <circle cx={cx - 5} cy={cy + 6} r="2.5" fill="#0369a1" /><circle cx={cx + 6} cy={cy + 10} r="2.5" fill="#0369a1" />
      </g>
    );
    if (i === 4) return <path d={`M${cx} ${cy - 18} C${cx + 14} ${cy}, ${cx + 14} ${cy + 16}, ${cx} ${cy + 16} C${cx - 14} ${cy + 16}, ${cx - 14} ${cy}, ${cx} ${cy - 18} z`} fill="#fbbf24" stroke="#b45309" strokeWidth="2" />;
    return <path d={`M${cx - 14} ${cy} l9 10 l19 -20`} fill="none" stroke={C.green} strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" />;
  };
  return (
    <svg viewBox="0 0 440 540" role="img" aria-labelledby="in-t in-d">
      <title id="in-t">Insulin i sex steg</title>
      <desc id="in-d">Så tillverkar bakterier mänskligt insulin. Steg 1: plasmid klipps upp. Steg 2: insulingen isoleras. Steg 3: genen klistras in. Steg 4: bakterien odlas i en bioreaktor. Steg 5: insulinet utvinns. Steg 6: insulinet är klart.</desc>
      <defs><Arrow id="in-a" color={C.mute} /></defs>
      <text x="220" y="28" fontSize="20" fontWeight="700" textAnchor="middle" fill={C.dark}>Insulin i sex steg</text>
      {steg.map((t, i) => {
        const y = 46 + i * 82;
        const last = i === steg.length - 1;
        return (
          <g key={i}>
            <rect x="20" y={y} width="400" height="62" rx="14" fill={last ? C.greenL : '#fff'} stroke={last ? C.green : C.line} strokeWidth="2" />
            <circle cx="52" cy={y + 31} r="18" fill={C.green} />
            <text x="52" y={y + 38} fontSize="19" fontWeight="700" textAnchor="middle" fill="#fff">{i + 1}</text>
            <text x="82" y={y + 38} fontSize="18" fontWeight="600" fill={C.ax}>{t}</text>
            {icon(i, 384, y + 31)}
            {!last && <line x1="52" y1={y + 64} x2="52" y2={y + 80} stroke={C.mute} strokeWidth="2.5" markerEnd="url(#in-a)" />}
          </g>
        );
      })}
    </svg>
  );
}

/* (7) Flödesschema för genterapi (s. 95) */
function FlodesschemaSVG() {
  return (
    <svg viewBox="0 0 440 430" role="img" aria-labelledby="fl-t fl-d">
      <title id="fl-t">Flödesschema för genterapi</title>
      <desc id="fl-d">Flödesschemat på sidan 95. Om vi använder tekniken och den fungerar finns risker som kapprustning och ökade klyftor. Om vi inte använder den föds fortfarande barn med svåra sjukdomar.</desc>
      <defs><Arrow id="fl-a" color={C.ax} /></defs>
      <rect x="90" y="16" width="260" height="62" rx="16" fill={C.greenL} stroke={C.green} strokeWidth="2.5" />
      <text x="220" y="54" fontSize="19" fontWeight="700" textAnchor="middle" fill={C.dark}>Använder vi tekniken?</text>
      <path d="M160 80 L110 128" stroke={C.ax} strokeWidth="3" fill="none" markerEnd="url(#fl-a)" />
      <path d="M280 80 L330 128" stroke={C.ax} strokeWidth="3" fill="none" markerEnd="url(#fl-a)" />
      <text x="116" y="102" fontSize="17" fontWeight="700" textAnchor="end" fill={C.green}>Ja</text>
      <text x="324" y="102" fontSize="17" fontWeight="700" fill={C.red}>Nej</text>
      <rect x="16" y="134" width="196" height="62" rx="14" fill="#fff" stroke={C.line} strokeWidth="2" />
      <text x="114" y="171" fontSize="17" fontWeight="600" textAnchor="middle" fill={C.ax}>… och den fungerar</text>
      <line x1="114" y1="198" x2="114" y2="240" stroke={C.ax} strokeWidth="3" markerEnd="url(#fl-a)" />
      <rect x="16" y="246" width="196" height="150" rx="14" fill={C.redL} stroke={C.red} strokeWidth="2" />
      <text x="114" y="280" fontSize="17" fontWeight="700" textAnchor="middle" fill={C.red}>Risker:</text>
      <Lines x={114} y={316} lines={['kapprustning', 'ökade klyftor']} size={18} lh={1.6} anchor="middle" weight={600} />
      <rect x="228" y="134" width="196" height="150" rx="14" fill={C.redL} stroke={C.red} strokeWidth="2" />
      <Lines x={326} y={176} lines={['Barn med svåra', 'sjukdomar föds', 'fortfarande']} size={18} lh={1.4} anchor="middle" weight={600} />
    </svg>
  );
}

const DIAGRAMS = {
  dna:          { Comp: DnaSVG,          cap: '**DNA** är en dubbelspiral, som en vriden repstege. A passar bara ihop med T. C passar bara ihop med G.' },
  kromosomer:   { Comp: KromosomerSVG,   cap: 'Människan har **46 kromosomer i 23 par**. Hälften kommer från mamma och hälften från pappa. Kroppsceller har 46 kromosomer, könsceller har 23.' },
  korsning:     { Comp: KorsningSVG,     cap: '**Korsningsschema Aa × Aa** (s. 60): AA, Aa, Aa och aa. 3 av 4 bruna och 1 av 4 vit. Om båda föräldrarna är bärare är risken 25 % att barnet blir sjukt.' },
  protein:      { Comp: ProteinSVG,      cap: '**Proteinsyntesen** i två steg: transkription i cellkärnan, translation vid ribosomen.' },
  bjorkmatare:  { Comp: BjorkmatareSVG,  cap: '**Naturligt urval** hos björkmätare (s. 76). Svarta fjärilar syntes dåligt och överlevde oftare.' },
  insulin:      { Comp: InsulinSVG,      cap: '**Insulin i sex steg** (s. 84). Nu görs nästan allt insulin av transgena bakterier.' },
  flodesschema: { Comp: FlodesschemaSVG, cap: '**Flödesschemat** (s. 95): använder vi tekniken och den fungerar finns risker som kapprustning och ökade klyftor. Använder vi den inte föds fortfarande barn med svåra sjukdomar.' }
};

function Diagram({ id }) {
  const d = DIAGRAMS[id];
  if (!d) return null;
  return (
    <figure className="diagram">
      <d.Comp />
      <figcaption>{fmt(d.cap)}</figcaption>
    </figure>
  );
}

/* ===================== AVSNITT ===================== */

function Section({ sec, mode }) {
  return (
    <section id={sec.id} className="sec">
      <div className="sec-head">
        <span className="sec-nr">{sec.nr}</span>
        <h3 className="sec-title">{sec.rubrik}</h3>
        <span className="sec-sida">{sec.sida}</span>
      </div>

      <div className="block">
        <p className="ll">{fmt(sec.lattlast)}</p>

        {sec.diagram.map(id => <Diagram key={id} id={id} />)}

        {mode === 'fordjupning' && (
          <div className="fdj">
            <div className="fdj-h">🔬 Fördjupning</div>
            <ul>{sec.fordjupning.map((t, i) => <li key={i}>{fmt(t)}</li>)}</ul>
          </div>
        )}

        <div className="to-top">
          <a href="#toppen" onClick={(e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }}>↑ Till toppen</a>
        </div>
      </div>
    </section>
  );
}

/* ===================== APP ===================== */

function App() {
  /* Läget sparas bara i sessionStorage under egen nyckel – påverkar inget annat. */
  const [mode, setMode] = useState(() => {
    try {
      const saved = sessionStorage.getItem(PAGE.storeKey);
      if (saved === 'lattlast' || saved === 'fordjupning') return saved;
    } catch (e) {}
    return 'lattlast';
  });
  const [active, setActive] = useState(ALLA[0].id);
  const [tocOpen, setTocOpen] = useState(false);

  useEffect(() => {
    try { sessionStorage.setItem(PAGE.storeKey, mode); } catch (e) {}
  }, [mode]);

  /* Markera aktuellt avsnitt i innehållsförteckningen. */
  useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(entries => {
      const vis = entries.filter(en => en.isIntersecting)
                         .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis.length) setActive(vis[0].target.id);
    }, { rootMargin: '-15% 0px -70% 0px' });
    ALLA.forEach(s => { const el = document.getElementById(s.id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);

  /* Djuplänk: scrolla till avsnittet i URL:ens hash när sidan laddats. */
  useEffect(() => {
    const id = decodeURIComponent((window.location.hash || '').replace('#', ''));
    if (!id) return;
    window.setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ block: 'start' });
    }, 150);
  }, []);

  const goto = (e, id) => {
    e.preventDefault();
    setTocOpen(false);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { history.replaceState(null, '', '#' + id); } catch (err) {}
  };

  const activeSec = ALLA.find(s => s.id === active) || ALLA[0];

  return (
    <div className="wrap" id="toppen">

      <a href="nk1a2_genteknik.html" className="back" onClick={smartBack}>
        ← Tillbaka till startsidan
      </a>

      <header className="head">
        <p className="eyebrow">{PAGE.eyebrow}</p>
        <h1>{PAGE.titel}</h1>
        <div className="rule"></div>
        <p className="lead">
          Pluggmaterial i {DELAR.length} delar och {ALLA.length} avsnitt. <strong>Lättläst</strong> visar grundtexten.
          {' '}<strong>Fördjupning</strong> visar samma text plus extra fakta för dig som vill veta mer.
        </p>
      </header>

      <div className="pill-toggle" role="tablist" aria-label="Välj läge">
        <button role="tab" aria-selected={mode === 'lattlast'}
                className={mode === 'lattlast' ? 'active' : 'inactive'}
                onClick={() => setMode('lattlast')}>Lättläst</button>
        <button role="tab" aria-selected={mode === 'fordjupning'}
                className={mode === 'fordjupning' ? 'active' : 'inactive'}
                onClick={() => setMode('fordjupning')}>Fördjupning</button>
      </div>
      <p className="mode-note">
        {mode === 'lattlast'
          ? 'Lättläst: grundtexten för varje avsnitt.'
          : 'Fördjupning: grundtexten + en punktlista med extra fakta och sidhänvisningar.'}
      </p>

      <div className="legend" aria-label="Färgkoder i texten">
        <span><mark className="amne">gult</mark> = ämnesord</span>
        <span><mark className="binde">grönt</mark> = bindeord</span>
      </div>

      <div className="layout">
        <nav className={'toc' + (tocOpen ? ' open' : '')} aria-label="Innehåll">
          <button className="toc-btn" onClick={() => setTocOpen(o => !o)} aria-expanded={tocOpen}>
            <span className="toc-btn-t">☰ {activeSec.nr} {activeSec.rubrik}</span>
            <span aria-hidden="true">{tocOpen ? '▲' : '▼'}</span>
          </button>
          <div className="toc-h">Innehåll</div>
          <div className="toc-list">
            {DELAR.map(d => (
              <React.Fragment key={d.titel}>
                <div className="toc-del">{d.titel}</div>
                {d.avsnitt.map(s => (
                  <a href={'#' + s.id} key={s.id} onClick={(e) => goto(e, s.id)}
                     className={s.id === active ? 'active' : ''}>
                    <span className="toc-n">{s.nr}</span>
                    <span className="toc-t">{s.rubrik}</span>
                  </a>
                ))}
              </React.Fragment>
            ))}
          </div>
        </nav>

        <main>
          {DELAR.map(d => (
            <React.Fragment key={d.titel}>
              <h2 className="del-head">{d.titel}</h2>
              {d.avsnitt.map(s => <Section key={s.id} sec={s} mode={mode} />)}
            </React.Fragment>
          ))}

          <section className="next" aria-label="Öva vidare">
            <h2>Öva vidare</h2>
            <p>Har du läst klart? Testa dig själv på områdets begrepp.</p>
            <a className="next-btn" href="nk1a2_genteknik_begrepp.html">📖 Öva på begrepp</a>
          </section>

          <footer className="foot">
            <p>Källa: {PAGE.kalla}</p>
            <p className="by">Designad av John</p>
          </footer>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script src="feedback-widget.js" defer></script>

        async src="//gc.zgo.at/count.js"></script>
</body>
