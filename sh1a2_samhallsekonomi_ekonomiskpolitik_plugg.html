<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --p:  #fb923c;
    --pl: #ffedd5;
    --pd: #7c2d12;
    --p-deep: #c2410c;
  }
  * { box-sizing: border-box; }
  body { font-family: 'EB Garamond', serif; font-size: 1.08rem; background:#f8fafc; color:#1e293b; margin:0; }
  h1,h2,h3,h4,.fredoka { font-family: 'Fredoka', sans-serif; }

  .wrap { max-width: 74rem; margin: 0 auto; padding: 1.6rem 1.25rem 4rem; }

  /* ── Tillbaka ── */
  .back {
    display:inline-flex; align-items:center; gap:.35rem; font-family:'Fredoka',sans-serif;
    font-size:.88rem; color:#94a3b8; text-decoration:none; transition:color .15s;
  }
  .back:hover { color: var(--p-deep); }

  /* ── Header ── */
  .head { text-align:center; margin: 1.8rem 0 1.6rem; }
  .eyebrow {
    font-family:'Fredoka',sans-serif; font-size:.72rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.22em; color:var(--p-deep); margin:0 0 .5rem;
  }
  .head h1 {
    font-size: clamp(2rem, 6vw, 2.9rem); font-weight:700; font-style:italic;
    color:#0f172a; margin:0; line-height:1.1;
  }
  .rule { height:.25rem; width:5rem; border-radius:999px; background:var(--p); margin:.9rem auto 1.1rem; }
  .lead { font-size:1rem; color:#64748b; max-width:34rem; margin:0 auto; line-height:1.7; }
  .lead strong { color:var(--p-deep); font-weight:700; }

  /* ── Toggle ── */
  .pill-toggle {
    display:flex; gap:.3rem; justify-content:center; background:#fff; border:1px solid #e2e8f0;
    border-radius:999px; padding:.3rem; width:fit-content; margin:0 auto .6rem;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .pill-toggle button {
    padding: .5rem 1.4rem; border-radius: 999px; font-family:'Fredoka',sans-serif;
    font-weight: 600; font-size: .95rem; transition: all .2s; border: none; cursor: pointer;
  }
  .pill-toggle button.active   { background: var(--p); color: var(--pd); box-shadow:0 2px 8px rgba(251,146,60,.35); }
  .pill-toggle button.inactive { background: transparent; color: #94a3b8; }
  .mode-note {
    text-align:center; font-family:'Fredoka',sans-serif; font-size:.82rem; color:#94a3b8;
    margin:0 0 1.6rem;
  }

  /* ── Layout: sticky innehållsförteckning + innehåll ── */
  .layout { display:grid; grid-template-columns: 15.5rem minmax(0,1fr); gap:2rem; align-items:start; }
  .toc {
    position:sticky; top:1rem; max-height:calc(100vh - 2rem); overflow-y:auto;
    background:#fff; border:1px solid #e2e8f0; border-radius:1.2rem;
    padding:.9rem .8rem; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .toc-h {
    font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; color:var(--p-deep); margin:.2rem .3rem .5rem;
  }
  .toc-btn { display:none; }
  .toc-list a {
    display:flex; align-items:center; gap:.6rem; padding:.5rem .6rem; border-radius:.75rem;
    color:#334155; text-decoration:none; transition:background .15s; line-height:1.3; font-size:.98rem;
  }
  .toc-list a:hover { background: var(--pl); }
  .toc-list a.active { background: var(--pl); color:var(--pd); font-weight:700; }
  .toc-n {
    flex:none; width:1.6rem; height:1.6rem; border-radius:50%; background:var(--pl); color:var(--pd);
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:.78rem;
    display:flex; align-items:center; justify-content:center;
  }
  .toc-list a.active .toc-n { background:var(--p); }
  .toc-t { flex:1; }

  /* ── Avsnitt ── */
  .sec { margin-bottom: 2.4rem; scroll-margin-top: 1rem; }
  .sec-head {
    display:flex; align-items:center; gap:.9rem;
    background:#fff; border-left:8px solid var(--p);
    border-radius:1rem; padding:1.1rem 1.2rem; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .sec-emoji { flex:none; font-size:1.6rem; line-height:1; }
  .sec-title { font-size:1.45rem; font-weight:600; color:#0f172a; line-height:1.25; margin:0; }
  .ingress {
    margin:.9rem .3rem 0; padding:.7rem 1rem; background:#fff; border:1px solid #fed7aa;
    border-radius:.9rem; color:#475569; line-height:1.65; font-size:1rem;
  }
  .ingress b { font-family:'Fredoka',sans-serif; color:var(--p-deep); font-weight:600; font-size:.78rem;
               text-transform:uppercase; letter-spacing:.1em; display:block; margin-bottom:.15rem; }

  /* ── Citat ur källan ── */
  .citat {
    margin:1.2rem 0; padding:1rem 1.2rem 1rem 3rem; background:#fff; border-radius:1rem;
    border:1px solid #e2e8f0; position:relative; color:#1e293b; font-style:italic; line-height:1.75;
  }
  .citat::before { content:'\201D'; position:absolute; left:.8rem; top:.2rem; font-size:3rem;
                   color:var(--p); font-family:Georgia,serif; font-style:normal; line-height:1; }
  .citat-k { display:block; margin-top:.4rem; font-style:normal; font-family:'Fredoka',sans-serif;
             font-size:.78rem; color:#64748b; }

  /* ── Inbyggda diagram (SVG) ── */
  .diagram { margin:1.4rem 0; background:#fff; border:1px solid #e2e8f0; border-radius:1.2rem; padding:1rem 1rem .8rem; }
  .diagram svg { display:block; width:100%; height:auto; max-width:40rem; margin:0 auto; }
  .diagram svg text { font-family:'Fredoka',sans-serif; }
  .diagram figcaption { font-size:.92rem; color:#475569; line-height:1.6; margin-top:.6rem; text-align:center; }
  .diagram figcaption b { font-family:'Fredoka',sans-serif; color:var(--pd); }

  /* ── Siffror ur källan ── */
  .stat {
    margin:1rem 0; padding:.8rem 1rem; background:#fff7ed; border:1px solid #fed7aa; border-radius:.9rem;
    color:#7c2d12; line-height:1.65; font-size:.97rem;
  }
  .stat-h { font-family:'Fredoka',sans-serif; font-weight:700; font-size:.78rem; text-transform:uppercase;
            letter-spacing:.1em; color:var(--p-deep); margin-bottom:.2rem; }
  .stat ul { list-style:none; padding:0; margin:.3rem 0 0; }
  .stat li { padding:.1rem 0; }

  /* ── Brödtext ── */
  .block { padding: .2rem .3rem 0; }
  .block h3 {
    font-size:1.12rem; font-weight:600; color:var(--pd);
    margin:1.6rem 0 .15rem;
  }
  .block p { margin:.5rem 0; line-height:1.85; color:#334155; }
  .block .term { color:var(--p-deep); font-weight:700; }
  .block ul { list-style:none; padding:0; margin:.6rem 0; }
  .block ul li { position:relative; padding:.22rem 0 .22rem 1.5rem; color:#334155; line-height:1.7; }
  .block ul li::before { content:'→'; position:absolute; left:0; color:var(--p); font-weight:700; }

  .ex {
    background:#fff; border:1px solid var(--pl); border-left:4px solid var(--p);
    border-radius:0 .8rem .8rem 0; padding:.7rem 1rem; margin:.8rem 0;
    font-size:.97rem; color:#7c2d12; line-height:1.7;
  }
  .ex .term { color:var(--p-deep); }

  .fundera {
    background:#fff; border:2px dashed var(--p); border-radius:1rem;
    padding:.8rem 1.1rem; margin:1.2rem 0; color:#334155; line-height:1.7;
  }
  .fundera-h { font-family:'Fredoka',sans-serif; font-weight:700; color:var(--p-deep); font-size:.9rem; margin-bottom:.2rem; }

  .komihag {
    background:var(--pl); border:2px solid var(--p); border-radius:1.2rem;
    padding:1.1rem 1.3rem; margin:1.8rem 0 .4rem;
  }
  .komihag-h {
    font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:700;
    color:var(--pd); margin-bottom:.5rem;
  }
  .komihag ul { list-style:none; padding:0; margin:0; }
  .komihag li { position:relative; padding:.28rem 0 .28rem 1.6rem; color:var(--pd); line-height:1.65; }
  .komihag li::before { content:'✓'; position:absolute; left:0; font-weight:700; color:var(--p-deep); }
  .komihag .term { font-weight:700; color:var(--p-deep); }

  /* ── Bildplats ── */
  .bildplats {
    border:2px dashed #cbd5e1; background:#f8fafc; border-radius:1.2rem;
    padding:1rem 1.2rem; margin:1.4rem 0; display:flex; gap:.8rem; align-items:flex-start;
  }
  .bildplats-i { flex:none; font-size:1.5rem; line-height:1; }
  .bildplats-t {
    font-family:'Fredoka',sans-serif; font-size:.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.12em; color:#64748b; margin-bottom:.25rem;
  }
  .bildplats-d { font-size:.92rem; color:#475569; line-height:1.6; }

  /* ── Tabell ── */
  .tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:.8rem 0; }
  .tbl { border-collapse:collapse; width:100%; font-size:.95rem; background:#fff; border-radius:.8rem; overflow:hidden; }
  .tbl th, .tbl td { padding:.55rem .7rem; text-align:left; border-bottom:1px solid #e2e8f0; vertical-align:top; line-height:1.5; }
  .tbl th { font-family:'Fredoka',sans-serif; font-size:.75rem; text-transform:uppercase;
            letter-spacing:.06em; color:var(--pd); background:var(--pl); }
  .tbl tr:last-child td { border-bottom:none; }

  .to-top { text-align:center; margin:1rem 0 .2rem; }
  .to-top a { font-family:'Fredoka',sans-serif; font-size:.8rem; color:#94a3b8; text-decoration:none; }
  .to-top a:hover { color:var(--p-deep); }

  /* ── Öva vidare ── */
  .next {
    background:#fff; border-top:8px solid var(--p); border-radius:1.5rem;
    padding:1.4rem 1.4rem 1.5rem; margin-top:2.4rem; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .next h2 { font-size:1.3rem; font-weight:600; margin:0 0 .3rem; color:#0f172a; }
  .next p { margin:0 0 1rem; color:#64748b; line-height:1.6; }
  .next-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.7rem; }
  .next-btn {
    display:flex; align-items:center; gap:.6rem; padding:.85rem 1rem; border-radius:1rem;
    font-family:'Fredoka',sans-serif; font-weight:600; text-decoration:none; transition:transform .15s, background .15s;
  }
  .next-btn:hover { transform:translateY(-2px); }
  .next-btn.primary { background:var(--p); color:var(--pd); }
  .next-btn.ghost { background:var(--pl); color:var(--pd); border:1px solid #fed7aa; }
  .next-btn.wide { grid-column:1 / -1; }

  /* ── Footer ── */
  .foot { text-align:center; margin-top:3rem; color:#94a3b8; font-size:.85rem; line-height:1.7; }
  .foot .by { font-style:italic; }

  /* ── Mobil ── */
  @media (max-width: 767px) {
    body { font-size: 1rem; }
    .wrap { padding: 1.2rem .9rem 3rem; }
    .layout { display:block; }
    .toc { position:sticky; top:0; z-index:30; max-height:none; overflow:visible;
           border-radius:0 0 1rem 1rem; margin:0 -.9rem 1.4rem; padding:.5rem .9rem;
           border-top:none; border-left:none; border-right:none; }
    .toc-h { display:none; }
    .toc-btn { display:flex; width:100%; align-items:center; justify-content:space-between; gap:.6rem;
               background:var(--pl); color:var(--pd); border:none; border-radius:.8rem; padding:.6rem .9rem;
               font-family:'Fredoka',sans-serif; font-weight:600; font-size:.95rem; cursor:pointer; text-align:left; }
    .toc-btn-t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .toc-list { display:none; max-height:60vh; overflow-y:auto; padding-top:.4rem; }
    .toc.open .toc-list { display:block; }
    .sec { scroll-margin-top: 4.2rem; }
    .sec-title { font-size: 1.2rem; }
    .sec-head { padding: .85rem .9rem; gap:.65rem; border-left-width:6px; }
    .sec-emoji { font-size:1.35rem; }
    .block h3 { font-size: 1.05rem; }
    .block p  { line-height: 1.75; }
    .pill-toggle button { padding:.45rem 1.05rem; font-size:.88rem; }
    .next-grid { grid-template-columns:1fr; }
    .bildplats { padding:.85rem .9rem; }
    .tbl { font-size:.88rem; }
    .citat { padding:.9rem 1rem .9rem 2.4rem; }
    .citat::before { left:.5rem; font-size:2.4rem; }
    .diagram { padding:.7rem .4rem .6rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

var SECTIONS = [

{
  id: "tillvaxt-och-konjunkturer",
  rubrik: "Tillväxt och konjunkturer",
  emoji: "📈",
  ingress: "ska du kunna förklara vad ekonomisk tillväxt och konjunkturer är, vad som händer i hög- och lågkonjunktur och vad som driver tillväxten.",
  lattlast: [
    { h: null, p: [
      "Ekonomin har ofta problem. Ibland blir många arbetslösa. Ibland används naturen för hårt. Ibland blir skillnaden mellan rika och fattiga för stor.",
      "Det staten gör för att ekonomin ska fungera bra kallas **ekonomisk politik**.",
      "**Ekonomisk tillväxt** betyder att landet producerar mer än förut. Man jämför BNP ett år med BNP ett annat år.",

      "Men ekonomin går i vågor. Ibland går det snabbt uppåt. Ibland går det långsamt eller till och med nedåt. Vågorna kallas **konjunkturer**.",

    { h: "Högkonjunktur", p: [
      "**Högkonjunktur** betyder att ekonomin växer snabbt.",
      "Människor handlar mycket. Företagen tillverkar mer och anställer fler.",
      "Fler får jobb och lön. Då handlar de ännu mer.",

    { h: "Lågkonjunktur", p: [
      "**Lågkonjunktur** betyder att ekonomin växer långsamt.",
      "Människor köper mindre. Företagen har mindre att göra och säger upp personal.",

    { h: "Tillväxtens drivkrafter", p: [
      "Det finns två sätt att producera mer.",
      "Man kan använda mer råvaror, mer arbete och fler maskiner.",

      "Tre saker är extra viktiga för produktiviteten:"

    { h: "Tillväxt och välfärd", p: [
      "När produktiviteten ökar tjänar samhället mer pengar. Pengarna kan användas på olika sätt.",

      "En del pengar bör investeras igen. Då kan det gå ännu bättre i framtiden.",
      "Tillväxt betyder inte att *alla* får det bättre. I många länder går pengarna mest till de rika."

  ],
  fordjupning: [
    { h: null, p: [
      "Samhällsekonomin drabbas ständigt av utmaningar: svängningar i konjunkturen påverkar sysselsättningen, naturresurser överutnyttjas och marknadsmekanismen leder ibland till orimliga skillnader i inkomster och levnadsvillkor. För att ekonomin ska växa på ett stabilt, rättvist och hållbart sätt krävs politisk styrning. De åtgärder staten vidtar för att samhällsekonomin ska fungera väl kallas **ekonomisk politik**.",

    }
  },
  komihag: [
    "Tre mål: **hållbar tillväxt**, **samhällsekonomisk balans** och **rättvis inkomstfördelning** – med **tillväxt-**, **stabiliserings-** och **fördelningspolitik** som verktyg.",
    "Stabiliseringspolitiken är **kontracyklisk**: **penningpolitik** (Riksbanken, räntan) och **finanspolitik** (regeringen, statsbudgeten).",
    "**Inflationsmålet** är 2 %. Höjd **styrränta** → dyrare lån → lägre efterfrågan → lägre inflation."
  ]
}

];

<script>
  /* Smart tillbaka-navigering: history.back() inom samma domän,
     annars fallback till områdessidan (aldrig hårdkodat index.html). */
  function smartBack(e) {
    if (e && e.preventDefault) e.preventDefault();
    try {
      if (document.referrer &&
          new URL(document.referrer).hostname === window.location.hostname) {
        history.back();
        return;
      }
    } catch (err) {}
    window.location.href = 'sh1a2_samhallsekonomi.html';
  }
</script>

<script type="text/babel">
const { useState, useEffect } = React;

/* ---------- Textformatering: **term** -> markerad fackterm, *ord* -> kursiv ---------- */
function fmt(text) {
  const parts = String(text).split(/(\*\*.+?\*\*|\*[^*\s][^*]*?\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith('**') && part.endsWith('**') && part.length > 4)
      return <strong key={i} className="term">{part.slice(2, -2)}</strong>;
    if (part.startsWith('*') && part.endsWith('*') && part.length > 2)
      return <em key={i}>{part.slice(1, -1)}</em>;
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
}

/* ===================== INBYGGDA DIAGRAM (SVG) ===================== */

const C = { p: '#fb923c', pd: '#7c2d12', deep: '#c2410c', ax: '#334155', mute: '#94a3b8', blue: '#0369a1' };

function Arrowheads() {
  return (
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill={C.ax} />
      </marker>
      <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill={C.deep} />
      </marker>
      <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill={C.blue} />
      </marker>
    </defs>
  );
}

/* Konjunkturcykel: vågrörelse kring en stigande tillväxttrend. */
function KonjunkturSVG() {
  const x0 = 70, x1 = 580, yA = 250, yB = 95, amp = 40, cykler = 2.25;
  const trend = x => yA - (x - x0) * (yA - yB) / (x1 - x0);
  const fas = x => (x - x0) / (x1 - x0) * cykler * 2 * Math.PI;
  const pts = [];
  for (let x = x0; x <= x1; x += 4) pts.push([x, trend(x) - amp * Math.sin(fas(x))]);
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
  const xAt = k => x0 + k / (cykler * 2) * (x1 - x0);   // k i halvperioder
  const toppar = [0.5, 2.5].map(xAt), dalar = [1.5, 3.5].map(xAt);
  return (
    <svg viewBox="0 0 620 330" role="img" aria-labelledby="kj-t kj-d">
      <title id="kj-t">Konjunkturcykeln</title>
      <desc id="kj-d">BNP växer längs en stigande tillväxttrend. Den verkliga produktionen svänger i vågor runt trenden: topparna är högkonjunktur och dalarna lågkonjunktur.</desc>
      <Arrowheads />
      <line x1={x0} y1="290" x2={x0} y2="28" stroke={C.ax} strokeWidth="2" markerEnd="url(#ah)" />
      <line x1={x0} y1="290" x2="600" y2="290" stroke={C.ax} strokeWidth="2" markerEnd="url(#ah)" />
      <text x="22" y="160" fontSize="14" fill={C.ax} transform="rotate(-90 22 160)" textAnchor="middle">BNP (produktion)</text>
      <text x="596" y="314" fontSize="14" fill={C.ax} textAnchor="end">Tid</text>
      <line x1={x0} y1={yA} x2={x1} y2={yB} stroke={C.mute} strokeWidth="2.5" strokeDasharray="8 6" />
      <text x={x1 - 4} y={yB - 50} fontSize="14" fill="#475569" textAnchor="end">Tillväxttrend</text>
      <line x1={x1 - 40} y1={yB - 44} x2={x1 - 8} y2={trend(x1 - 8) - 4} stroke={C.mute} strokeWidth="1.2" />
      <path d={d} fill="none" stroke={C.p} strokeWidth="4" strokeLinecap="round" />
      {toppar.map((x, i) => (
        <g key={'t' + i}>
          <circle cx={x} cy={trend(x) - amp} r="5" fill={C.deep} />
          <text x={x} y={trend(x) - amp - 14} fontSize="14" fontWeight="600" fill={C.deep} textAnchor="middle">Högkonjunktur</text>
        </g>
      ))}
      {dalar.map((x, i) => (
        <g key={'d' + i}>
          <circle cx={x} cy={trend(x) + amp} r="5" fill={C.blue} />
          <text x={x} y={trend(x) + amp + 24} fontSize="14" fontWeight="600" fill={C.blue} textAnchor="middle">Lågkonjunktur</text>
        </g>
      ))}
    </svg>
  );
}

/* Utbud och efterfrågan: jordgubbsmarknaden med jämviktspris, överskott och brist. */
function UtbudSVG() {
  const O = [80, 320];                                   // origo
  const e = [[120, 60], [540, 290]], u = [[120, 290], [540, 60]];
  const xOn = (L, y) => L[0][0] + (y - L[0][1]) * (L[1][0] - L[0][0]) / (L[1][1] - L[0][1]);
  const J = [330, 175];                                  // skärningspunkt
  const yHog = 100, yLag = 250;
  return (
    <svg viewBox="0 0 620 370" role="img" aria-labelledby="ue-t ue-d">
      <title id="ue-t">Utbud och efterfrågan på jordgubbar</title>
      <desc id="ue-d">Efterfrågekurvan e lutar nedåt och utbudskurvan u lutar uppåt. Där de korsas finns jämviktspriset. Vid ett för högt pris blir det överskott, vid ett för lågt pris blir det brist.</desc>
      <Arrowheads />
      <line x1={O[0]} y1={O[1]} x2={O[0]} y2="28" stroke={C.ax} strokeWidth="2" markerEnd="url(#ah)" />
      <line x1={O[0]} y1={O[1]} x2="600" y2={O[1]} stroke={C.ax} strokeWidth="2" markerEnd="url(#ah)" />
      <text x="30" y="40" fontSize="15" fontWeight="600" fill={C.ax}>Pris</text>
      <text x="596" y="350" fontSize="15" fontWeight="600" fill={C.ax} textAnchor="end">Mängd jordgubbar</text>

      {/* Överskott vid för högt pris */}
      <line x1={xOn(e, yHog)} y1={yHog} x2={xOn(u, yHog)} y2={yHog} stroke={C.deep} strokeWidth="2" strokeDasharray="5 4" />
      <text x={(xOn(e, yHog) + xOn(u, yHog)) / 2} y={yHog - 8} fontSize="13" fill={C.deep} textAnchor="middle">För högt pris → överskott</text>
      {/* Brist vid för lågt pris */}
      <line x1={xOn(u, yLag)} y1={yLag} x2={xOn(e, yLag)} y2={yLag} stroke={C.blue} strokeWidth="2" strokeDasharray="5 4" />
      <text x={(xOn(u, yLag) + xOn(e, yLag)) / 2} y={yLag + 20} fontSize="13" fill={C.blue} textAnchor="middle">För lågt pris → brist och köer</text>

      <line x1={e[0][0]} y1={e[0][1]} x2={e[1][0]} y2={e[1][1]} stroke={C.blue} strokeWidth="4" strokeLinecap="round" />
      <line x1={u[0][0]} y1={u[0][1]} x2={u[1][0]} y2={u[1][1]} stroke={C.p} strokeWidth="4" strokeLinecap="round" />
      <text x={e[1][0] + 8} y={e[1][1] + 5} fontSize="18" fontWeight="700" fill={C.blue}>e</text>
      <text x={u[1][0] + 8} y={u[1][1] + 5} fontSize="18" fontWeight="700" fill={C.deep}>u</text>

      <line x1={O[0]} y1={J[1]} x2={J[0]} y2={J[1]} stroke={C.mute} strokeWidth="1.5" strokeDasharray="4 4" />
      <line x1={J[0]} y1={J[1]} x2={J[0]} y2={O[1]} stroke={C.mute} strokeWidth="1.5" strokeDasharray="4 4" />
      <circle cx={J[0]} cy={J[1]} r="7" fill="#fff" stroke={C.pd} strokeWidth="3" />
      <text x={J[0] + 14} y={J[1] + 5} fontSize="14" fontWeight="600" fill={C.pd}>Jämvikt</text>
      <text x={O[0] - 6} y={J[1] - 6} fontSize="12" fill={C.pd} textAnchor="end">Jämvikts-</text>
      <text x={O[0] - 6} y={J[1] + 9} fontSize="12" fill={C.pd} textAnchor="end">pris</text>
    </svg>
  );
}

/* Det ekonomiska kretsloppet: hushåll och företag möts på marknaden. */
function KretsloppSVG() {
  const box = (x, y, w, h, fill, stroke, rubrik, rad) => (
    <g>
      <rect x={x} y={y} width={w} height={h} rx="16" fill={fill} stroke={stroke} strokeWidth="2.5" />
      <text x={x + w / 2} y={y + h / 2 - 4} fontSize="17" fontWeight="700" fill={C.pd} textAnchor="middle">{rubrik}</text>
      <text x={x + w / 2} y={y + h / 2 + 16} fontSize="12" fill="#475569" textAnchor="middle">{rad}</text>
    </g>
  );
  return (
    <svg viewBox="0 0 620 340" role="img" aria-labelledby="kl-t kl-d">
      <title id="kl-t">Det ekonomiska kretsloppet mellan hushåll och företag</title>
      <desc id="kl-d">Hushållen ger företagen arbetskraft och får löner tillbaka. Hushållens efterfrågan och företagens utbud möts på marknaden.</desc>
      <Arrowheads />
      {box(20, 120, 150, 90, '#fff7ed', C.p, 'Hushåll', 'behov · konsumtion')}
      {box(450, 120, 150, 90, '#fff7ed', C.p, 'Företag', 'resurser · produktion')}
      {box(245, 128, 130, 74, '#ffedd5', C.deep, 'Marknaden', 'här möts e och u')}

      {/* Mitten: efterfrågan och utbud möts på marknaden */}
      <line x1="172" y1="165" x2="241" y2="165" stroke={C.blue} strokeWidth="3" markerEnd="url(#ahb)" />
      <text x="206" y="155" fontSize="13" fontWeight="600" fill={C.blue} textAnchor="middle">efterfrågan (e)</text>
      <line x1="448" y1="165" x2="379" y2="165" stroke={C.deep} strokeWidth="3" markerEnd="url(#ahp)" />
      <text x="414" y="155" fontSize="13" fontWeight="600" fill={C.deep} textAnchor="middle">utbud (u)</text>

      {/* Övre båge: arbetskraft från hushåll till företag */}
      <path d="M95,118 C95,30 525,30 525,116" fill="none" stroke={C.ax} strokeWidth="2.5" markerEnd="url(#ah)" />
      <text x="310" y="46" fontSize="14" fontWeight="600" fill={C.ax} textAnchor="middle">Arbetskraft</text>
      {/* Nedre båge: löner från företag till hushåll */}
      <path d="M525,212 C525,305 95,305 95,214" fill="none" stroke={C.ax} strokeWidth="2.5" markerEnd="url(#ah)" />
      <text x="310" y="300" fontSize="14" fontWeight="600" fill={C.ax} textAnchor="middle">Löner (inkomster)</text>
    </svg>
  );
}

const DIAGRAMS = {
  konjunktur: { Comp: KonjunkturSVG, cap: '**Konjunkturcykeln.** Den streckade linjen är **tillväxttrenden** – den stadiga ökningen av BNP. Den orange kurvan är den verkliga produktionen, som svänger mellan **högkonjunktur** och **lågkonjunktur** runt trenden.' },
  utbud:      { Comp: UtbudSVG,      cap: '**Jordgubbsmarknaden.** Efterfrågekurvan (**e**) lutar nedåt: ju lägre pris, desto mer vill konsumenterna köpa. Utbudskurvan (**u**) lutar uppåt: ju högre pris, desto mer vill odlarna sälja. Där kurvorna möts finns **jämviktspriset**.' },
  kretslopp:  { Comp: KretsloppSVG,  cap: '**Hushåll och företag.** Hushållen ger företagen arbetskraft och får löner. Hushållens **efterfrågan** och företagens **utbud** möts på **marknaden**.' }
};

function Diagram({ id }) {
  const d = DIAGRAMS[id];
  if (!d) return null;
  return (
    <figure className="diagram">
      <d.Comp />
      <figcaption>{fmt(d.cap)}</figcaption>
    </figure>
  );
}

/* ===================== INNEHÅLLSKOMPONENTER ===================== */

/* Citat (extra.citat) placeras direkt efter blockets första stycken, som i källan,
   så att texten som kommenterar citatet hamnar efter det. */
function Citat({ list }) {
  return (list || []).map((c, i) => (
    <blockquote className="citat" key={"c" + i}>
      {c.text}
      {c.kalla && <span className="citat-k">— {c.kalla}</span>}
    </blockquote>
  ));
}

function Block({ b, x }) {
  return (
    <div>
      {b.h && <h3>{b.h}</h3>}
      {(b.p || []).map((t, i) => <p key={i}>{fmt(t)}</p>)}
      <Citat list={x && x.citat} />
      {(b.mellan || []).map((t, i) => <p key={"m" + i}>{fmt(t)}</p>)}
      {b.lista && (
        <ul>
          {b.lista.map((t, i) => <li key={i}>{fmt(t)}</li>)}
        </ul>
      )}
      {(b.p2 || []).map((t, i) => <p key={'p2' + i}>{fmt(t)}</p>)}
      {b.tabell && (
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>{b.tabell.huvud.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
            <tbody>
              {b.tabell.rader.map((r, i) => (
                <tr key={i}>{r.map((c, j) => <td key={j}>{fmt(c)}</td>)}</tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {b.stat && (
        <div className="stat">
          <div className="stat-h">📊 {b.stat.h}</div>
          <ul>{b.stat.lista.map((t, i) => <li key={i}>{fmt(t)}</li>)}</ul>
        </div>
      )}
      {b.ex && <div className="ex">{fmt(b.ex)}</div>}
    </div>
  );
}

function Extra({ x }) {
  if (!x) return null;
  return (
    <>
      {x.diagram && <Diagram id={x.diagram} />}
      {(x.bild || []).map((bp, i) => (
        <div className="bildplats" role="note" key={'b' + i}>
          <span className="bildplats-i" aria-hidden="true">🖼️</span>
          <div>
            <div className="bildplats-t">[BILDPLATS] {bp.titel}</div>
            <div className="bildplats-d">{bp.text}</div>
          </div>
        </div>
      ))}
      {(x.fundera || []).map((f, i) => (
        <div className="fundera" key={'f' + i}>
          <div className="fundera-h">🤔 Fundera</div>
          {f}
        </div>
      ))}
    </>
  );
}

function Section({ sec, mode, nr }) {
  const blocks = mode === 'lattlast' ? sec.lattlast : sec.fordjupning;
  const extra = sec.extra || {};
  return (
    <section id={sec.id} className="sec">
      <div className="sec-head">
        <span className="sec-emoji" aria-hidden="true">{sec.emoji}</span>
        <h2 className="sec-title">{nr}. {sec.rubrik}</h2>
      </div>
      <p className="ingress"><b>Efter det här avsnittet</b>{fmt(sec.ingress)}</p>

      <div className="block">
        {blocks.map((b, i) => (
          <React.Fragment key={i}>
            <Block b={b} x={extra[b.h || ""]} />
            <Extra x={extra[b.h || '']} />
          </React.Fragment>
        ))}

        <div className="komihag">
          <div className="komihag-h">💡 Kom ihåg</div>
          <ul>{sec.komihag.map((t, i) => <li key={i}>{fmt(t)}</li>)}</ul>
        </div>

        <div className="to-top">
          <a href="#toppen" onClick={(e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }}>↑ Till toppen</a>
        </div>
      </div>
    </section>
  );
}

/* ===================== APP ===================== */

function App() {
  /* Läget sparas bara i sessionStorage under egen nyckel – påverkar inget annat. */
  const [mode, setMode] = useState(() => {
    try {
      const saved = sessionStorage.getItem(PAGE.storeKey);
      if (saved === 'lattlast' || saved === 'fordjupning') return saved;
    } catch (e) {}
    return 'lattlast';
  });
  const [active, setActive] = useState(SECTIONS[0].id);
  const [tocOpen, setTocOpen] = useState(false);

  useEffect(() => {
    try { sessionStorage.setItem(PAGE.storeKey, mode); } catch (e) {}
  }, [mode]);

  /* Markera aktuellt avsnitt i innehållsförteckningen. */
  useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(entries => {
      const vis = entries.filter(en => en.isIntersecting)
                         .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis.length) setActive(vis[0].target.id);
    }, { rootMargin: '-15% 0px -70% 0px' });
    SECTIONS.forEach(s => { const el = document.getElementById(s.id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);

  /* Djuplänk: scrolla till avsnittet i URL:ens hash när sidan laddats. */
  useEffect(() => {
    const id = decodeURIComponent((window.location.hash || '').replace('#', ''));
    if (!id) return;
    window.setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ block: 'start' });
    }, 150);
  }, []);

  const goto = (e, id) => {
    e.preventDefault();
    setTocOpen(false);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { history.replaceState(null, '', '#' + id); } catch (err) {}
  };

  const activeIdx = Math.max(0, SECTIONS.findIndex(s => s.id === active));

  return (
    <div className="wrap" id="toppen">

      <a href="sh1a2_samhallsekonomi.html" className="back" onClick={smartBack}>
        ← Tillbaka till Samhällsekonomi
      </a>

      <header className="head">
        <p className="eyebrow">{PAGE.eyebrow}</p>
        <h1>{PAGE.titel}</h1>
        <div className="rule"></div>
        <p className="lead">
          Pluggmaterial i {SECTIONS.length} avsnitt. Välj <strong>Lättläst</strong> för korta meningar och exempel
          från vardagen, eller <strong>Fördjupning</strong> för resonemang, orsak–verkan och samband.
        </p>
      </header>

      <div className="pill-toggle" role="tablist" aria-label="Välj läge">
        <button role="tab" aria-selected={mode === 'lattlast'}
                className={mode === 'lattlast' ? 'active' : 'inactive'}
                onClick={() => setMode('lattlast')}>Lättläst</button>
        <button role="tab" aria-selected={mode === 'fordjupning'}
                className={mode === 'fordjupning' ? 'active' : 'inactive'}
                onClick={() => setMode('fordjupning')}>Fördjupning</button>
      </div>
      <p className="mode-note">
        {mode === 'lattlast'
          ? 'Lättläst: korta meningar, en tanke i taget och exempel från vardagen.'
          : 'Fördjupning: samma rubriker, men med resonemang, orsak–verkan och samband.'}
      </p>

      <div className="layout">
        <nav className={'toc' + (tocOpen ? ' open' : '')} aria-label="Innehåll">
          <button className="toc-btn" onClick={() => setTocOpen(o => !o)} aria-expanded={tocOpen}>
            <span className="toc-btn-t">☰ {activeIdx + 1}. {SECTIONS[activeIdx].rubrik}</span>
            <span aria-hidden="true">{tocOpen ? '▲' : '▼'}</span>
          </button>
          <div className="toc-h">Innehåll</div>
          <div className="toc-list">
            {SECTIONS.map((s, i) => (
              <a href={'#' + s.id} key={s.id} onClick={(e) => goto(e, s.id)}
                 className={s.id === active ? 'active' : ''}>
                <span className="toc-n">{i + 1}</span>
                <span className="toc-t">{s.rubrik}</span>
              </a>
            ))}
          </div>
        </nav>

        <main>
          {SECTIONS.map((s, i) => <Section key={s.id} sec={s} mode={mode} nr={i + 1} />)}

          <section className="next" aria-label="Öva vidare">
            <h2>Öva vidare</h2>
            <p>Har du läst klart? Testa dig själv på områdets begrepp och quiz.</p>
            <div className="next-grid">
              <a className="next-btn ghost" href="sh_ekonomibegrepp.html">📖 Öva på begrepp</a>
              <a className="next-btn primary" href="sh_ekonomi.html">🎯 Starta quizet</a>
              <a className="next-btn ghost wide" href={PAGE.andra.href}>📚 {PAGE.andra.label}</a>
            </div>
          </section>

          <footer className="foot">
            <p>Källa: {PAGE.kalla}</p>
            <p className="by">Designad av John</p>
          </footer>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
