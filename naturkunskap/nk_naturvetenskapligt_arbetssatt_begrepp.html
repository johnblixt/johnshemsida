<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naturvetenskapligt arbetssätt – Begrepp</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'EB Garamond', serif; background: #f9fafb; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const PRIMARY       = '#22c55e';
    const PRIMARY_LIGHT = '#dcfce7';
    const PRIMARY_TEXT  = '#14532d';

    const concepts = [
      { id:  1, term: 'Den vetenskapliga revolutionen',   def: 'Perioden efter medeltiden i Europa då man började använda systematiska undersökningsmetoder och experiment istället för att söka svar i antika skrifter eller kyrkans lära.' },
      { id:  2, term: 'Frågeställning',                   def: 'En specifik och avgränsad fråga som preciserar syftet med en undersökning.' },
      { id:  3, term: 'Hypotes',                          def: 'Ett påstående som ger ett möjligt svar på frågeställningen. När en hypotes föreslås vet man inte om den är sann eller falsk.' },
      { id:  4, term: 'Testbar hypotes',                  def: 'En hypotes som går att undersöka genom experiment och observationer.' },
      { id:  5, term: 'Falsifierbar hypotes',             def: 'En hypotes som är möjlig att motbevisa, exempelvis genom att resultaten motsäger den.' },
      { id:  6, term: 'Repeterbart experiment',           def: 'Ett experiment som kan upprepas och kontrolleras av andra.' },
      { id:  7, term: 'Observationer',                    def: 'Att samla in resultat genom att iaktta, exempelvis inom astronomin där man inte kan göra experiment.' },
      { id:  8, term: 'Experiment',                       def: 'En undersökning där man avsiktligt ändrar en variabel för att undersöka effekten på något annat.' },
      { id:  9, term: 'Simuleringar',                     def: 'Datorberäkningar som används för att förutsäga förlopp, exempelvis framtida temperaturförändringar i klimatforskningen.' },
      { id: 10, term: 'Den vetenskapliga metoden',        def: 'Uttryck för en bestämd ordning av steg i forskning; i praktiken finns ingen enda metod som alla naturvetare följer.' },
      { id: 11, term: 'Den hypotetisk-deduktiva metoden', def: 'Arbetsgång där en frågeställning leder till en hypotes, en förutsägelse, en undersökning och slutligen en slutsats.' },
      { id: 12, term: 'Förutsägelse',                     def: 'Ett påstående om vad man förväntar sig ska hända om hypotesen stämmer.' },
      { id: 13, term: 'Slutsats',                         def: 'Tolkning av resultaten för att avgöra om förutsägelsen inträffat. Inträffar den får hypotesen stöd; annars motbevisas (falsifieras) den.' },
      { id: 14, term: 'Vetenskaplig teori',               def: 'En väl underbyggd förklaringsmodell för hur något i omvärlden är uppbyggt eller fungerar. Långt mer än en gissning.' },
      { id: 15, term: 'Paradigmskifte',                   def: 'När en vetenskaplig teori ersätts av en annan.' },
      { id: 16, term: 'Naturvetenskapens begränsningar',  def: 'Naturvetenskapen kan bara undersöka sådant som går att testa och kan inte besvara moraliska frågor om vad som är rätt och fel.' },
      { id: 17, term: 'Forskningsetik',                   def: 'Vägledning från etikprövningsmyndighet och etiska kommittéer för att forskning ska utföras på ett etiskt och objektivt sätt.' },
      { id: 18, term: 'Forskningsfusk',                   def: 'Att plagiera, förfalska eller undanhålla resultat från sin forskning.' },
      { id: 19, term: 'Etikprövning',                     def: 'Prövning som i regel krävs innan experiment får utföras på bläckfiskar, ryggradsdjur och människor.' },
      { id: 20, term: 'Oberoende variabel',               def: 'Det som ändras i ett experiment, och som antas orsaka en förändring.' },
      { id: 21, term: 'Beroende variabel',                def: 'Det som mäts, och som antas påverkas av den oberoende variabeln.' },
      { id: 22, term: 'Kontrollerade variabler',          def: 'Faktorer som hålls så konstanta som möjligt för att de inte ska påverka resultatet.' },
      { id: 23, term: 'Störvariabler',                    def: 'Andra faktorer som kan påverka resultatet och därför måste hållas konstanta.' },
      { id: 24, term: 'Kontrollgrupp',                    def: 'En jämförelsegrupp som inte utsätts för behandlingen eller det verksamma ämnet, vilket minskar risken att andra variabler påverkar slutsatsen.' },
      { id: 25, term: 'Experimentgrupp',                  def: 'Den grupp som utsätts för behandlingen eller det verksamma ämne som undersöks.' },
      { id: 26, term: 'Slumpen',                          def: 'Slumpmässiga variationer; ju fler försökspersoner eller upprepningar, desto mindre risk att resultatet beror på slumpen.' },
      { id: 27, term: 'Blindstudie',                      def: 'Studie där försökspersonerna inte vet om de får en aktiv substans eller inte, för att utesluta placeboeffekten.' },
      { id: 28, term: 'Placeboeffekten',                  def: 'Påverkan på ett behandlingsresultat som beror på att försökspersonen förväntar sig att bli bättre, trots att ingen verksam medicin getts.' },
      { id: 29, term: 'Medelvärde',                       def: 'Det beräknade genomsnittet av flera mätvärden, ofta redovisat per försöksgrupp.' },
      { id: 30, term: 'Trendlinje',                       def: 'En linje i ett diagram som visar den övergripande tendensen i mätvärdena.' },
      { id: 31, term: 'Samvariation (korrelation)',       def: 'När två variabler varierar tillsammans.' },
      { id: 32, term: 'Orsakssamband',                    def: 'När en variabel faktiskt orsakar förändring i en annan. Samvariation behöver inte betyda orsakssamband.' },
      { id: 33, term: 'Vetenskaplig rapport',             def: 'Skriftlig redovisning av ett experiment med delarna inledning, material och metod, resultat, diskussion och källförteckning.' },
      { id: 34, term: 'Riskbedömning',                    def: 'Bedömning av risker som görs innan det praktiska arbetet i exempelvis en laboration påbörjas.' },
      { id: 35, term: 'Farosymboler',                     def: 'Märkning av hälso- och brandfarliga produkter, t.ex. skadlig, brandfarlig, frätande, hälsofarlig, miljöfarlig och giftig.' },
      { id: 36, term: 'Vetenskapligt förhållningssätt',   def: 'Att ha ett kritiskt tänkande, vara opartisk, vara öppen för nya idéer och basera sina slutsatser på välgrundade fakta.' },
      { id: 37, term: 'Källkritik',                       def: 'Att systematiskt granska och bedöma källors trovärdighet.' },
      { id: 38, term: 'Källkritikens ABC',                def: 'Frågorna man ställer om en källa: är den äkta, aktuell, beroende, tendensiös och granskad?' },
      { id: 39, term: 'Primärkälla',                      def: 'Källa som bygger på egen data, t.ex. vetenskapliga artiklar baserade på observationer och experiment. Mer tillförlitlig.' },
      { id: 40, term: 'Sekundärkälla',                    def: 'Källa som hämtar sin information från andra källor. Mindre pålitlig eftersom den är beroende av att ursprungskällan är korrekt.' },
      { id: 41, term: 'Tendensiös (vinklad) källa',       def: 'En källa med underliggande politiska, ekonomiska eller ideologiska intressen, vilket gör den mindre trovärdig.' },
      { id: 42, term: 'Peer review',                      def: 'Granskning av en vetenskaplig rapport av minst två oberoende forskare innan publicering; ett sätt att garantera kvaliteten.' },
      { id: 43, term: 'Desinformation',                   def: 'Felaktig information som sprids medvetet för att lura eller vilseleda.' },
      { id: 44, term: 'Propaganda',                       def: 'Kommunikation som syftar till att påverka den allmänna opinionen och undergräva motståndare. Räknas som desinformation när den medvetet sprider falsk information.' },
      { id: 45, term: 'Deepfakes',                        def: 'Falska bilder, videor och ljudinspelningar av personer som skapats med hjälp av AI.' },
      { id: 46, term: 'Konspirationsteorier',             def: 'Föreställningar om att hemliga grupper i en sammansvärjning arbetar för att uppnå dolda mål.' },
      { id: 47, term: 'Faktaresistens',                   def: 'När en person håller fast vid sin övertygelse trots att fakta talar emot.' },
      { id: 48, term: 'Ekokammare',                       def: 'En miljö, t.ex. på sociala medier, där en grupps åsikter förstärks genom att användarna ständigt bekräftar varandra.' },
      { id: 49, term: 'Filterbubblor',                    def: 'När algoritmer på sociala medier anpassar innehållet efter en persons profil, så att man främst möter information som bekräftar den egna världsbilden.' },
      { id: 50, term: 'Bekräftelsebias',                  def: 'Tendensen att ha högre tilltro till information som redan stämmer med de egna uppfattningarna.' },
      { id: 51, term: 'Kognitiv dissonans',               def: 'Den inre konflikt som uppstår av motstridiga fakta, vilket kan få personer att förneka fakta snarare än att ändra uppfattning.' },
      { id: 52, term: 'Pseudovetenskap',                  def: 'Läror som gör anspråk på att vara vetenskapliga utan att ha vetenskapligt stöd, t.ex. astrologi.' },
    ];

    const TABS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];

    function App() {
      const [view, setView] = React.useState('Lista');

      return (
        <div className="min-h-screen">
          {/* Header */}
          <header className="bg-white shadow-sm">
            <div className="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
              <a
                href="../index.html"
                className="text-sm font-medium text-gray-500 hover:text-green-600 transition-colors"
              >
                ← Tillbaka till startsidan
              </a>
              <h1 className="text-2xl font-bold text-center tracking-wide" style={{ color: PRIMARY_TEXT }}>
                Naturvetenskapligt arbetssätt
              </h1>
              <div className="w-40" />
            </div>
          </header>

          {/* Toggle */}
          <div className="max-w-3xl mx-auto px-4 pt-6 pb-2">
            <div className="flex bg-white rounded-full shadow-sm border border-gray-200 p-1 gap-1 w-fit mx-auto">
              {TABS.map(tab => (
                <button
                  key={tab}
                  onClick={() => setView(tab)}
                  className="px-4 py-1.5 rounded-full text-sm font-semibold transition-colors"
                  style={
                    view === tab
                      ? { backgroundColor: PRIMARY, color: '#fff' }
                      : { color: '#6b7280', backgroundColor: 'transparent' }
                  }
                >
                  {tab}
                </button>
              ))}
            </div>
          </div>

          {/* Content */}
          <main className="max-w-3xl mx-auto px-4 py-6">
            {view === 'Lista' && (
              <div className="flex flex-col gap-3">
                {concepts.map(c => (
                  <div
                    key={c.id}
                    className="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow"
                    style={{ borderLeft: `8px solid ${PRIMARY}` }}
                  >
                    <div className="px-5 py-4 flex gap-4 items-start">
                      <span
                        className="text-sm font-bold rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0 mt-0.5"
                        style={{ backgroundColor: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
                      >
                        {c.id}
                      </span>
                      <div>
                        <p className="font-bold text-gray-800">{c.term}</p>
                        <p className="text-gray-500 text-sm mt-0.5">{c.def}</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {view !== 'Lista' && (
              <div className="text-center py-24 text-gray-400 text-lg italic">
                Kommer snart…
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="text-center py-6 text-sm italic text-gray-400">
            Källa: Naturkunskap 1a1 — Naturvetenskapligt arbetssätt
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
