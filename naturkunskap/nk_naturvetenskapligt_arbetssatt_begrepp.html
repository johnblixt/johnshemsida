    const EASY_DATA = [

      { def: 'Den vetenskapliga revolutionen skedde på 1500–1600-talet i Europa. Då slutade folk fråga kyrkan och gamla böcker om svar. Istället började de göra egna experiment och mätningar.', scenario: 'En grupp tänkare tyckte inte att det räckte att fråga prästen varför äpplet föll mot marken. De vägde, mätte och upprepade försök tills de hade ett svar.', ickeExempelOptions: ['Galileo använde teleskop och experiment. Han frågade inte kyrkan eller gamla skrifter. Det är just det den vetenskapliga revolutionen handlar om.', 'En nutida fysiker som utmanar en teori med ett nytt experiment gör vanlig vetenskap. Det är inget historiskt skifte – den vetenskapliga revolutionen skedde för 500 år sedan.'] },

      { def: 'Faktaresistens är när en person inte ändrar sin uppfattning trots att fakta visar att de har fel.', scenario: 'Röntgenbilden visar tydligt att knäet är skadat. Men personen insisterar på att det inte kan stämma. Inga bevis ändrar deras uppfattning.', ickeExempelOptions: ['Läkaren visar röntgenbilder som bevisar skadan. Ändå insisterar patienten på att bilderna måste vara fel. Det är faktaresistens.', 'Eleven tror att svaret är C men ändrar sig direkt när läraren visar att svaret är A. Det är det motsatta av faktaresistens.'] },
      // 27 – Ekokammare
      { def: 'En ekokammare är en grupp, till exempel på sociala medier, där alla bekräftar varandra. Åsikterna förstärks och andra perspektiv stängs ute.', scenario: 'På forumet håller alla med varandra. De som tänker annorlunda utesluts direkt. Åsikterna förstärks av att gruppen hela tiden bekräftar sig själv.', ickeExempelOptions: ['I gruppen bekräftar alla varandra och de med avvikande åsikter utestängs eller ignoreras. Det är en ekokammare.', 'En algoritm visar dig mer anpassat innehåll baserat på vad du klickat på. Det är en filterbubbla, inte en ekokammare.'] },
      // 28 – Filterbubblor
      { def: 'Filterbubblor uppstår när en algoritm anpassar vad du ser på nätet utifrån vad du klickat på tidigare. Du ser mer av det du redan tror på.', scenario: 'Appen registrerar varje klick du gör och anpassar vad du ser. Utan att du märker det visar en algoritm dig allt mer ensidigt innehåll.', ickeExempelOptions: ['Algoritmerna registrerar dina klick och visar dig allt mer ensidigt innehåll utan att du märker det. Det är filterbubblor.', 'En sluten Facebook-grupp där alla delar samma åsikter och aldrig lyfter in motargument. Det är en ekokammare – skapad av social dynamik, inte av algoritmer.'] },
      // 29 – Pseudovetenskap
      { def: 'Pseudovetenskap ser ut som vetenskap men har inget riktigt vetenskapligt stöd. Det saknas kontrollerade experiment.', scenario: 'Påståendet ser ut som vetenskap och använder ord som "studier visar". Men när man granskar det finns inga riktiga kontrollerade experiment bakom det.', ickeExempelOptions: ['Astrologin påstår sig förutsäga personlighet baserat på födelsetidpunkten. Det saknas kontrollerade experiment. Det är pseudovetenskap.', 'En ny behandling med lovande preliminära studier väntar på godkännande. Det är vetenskap under prövning – det är inte pseudovetenskap.'] },
    ];

    // Helper: hämtar enkel-text för ett begrepp.
    // idx = 0-baserat index i concepts[] (= c.id - 1).
    // field = 'def' | 'scenario' | 'ickeExempelOptions'
    // Generisk nog att byggas ut med fler språk.
    function getEasy(idx, field) {
      return EASY_DATA[idx] ? EASY_DATA[idx][field] : undefined;
    }

    function shuffleArray(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ════════════════════════════════════════════════════════════
    // PROGRESS- OCH RANK-SYSTEM (sessionStorage, ingen backend)
    // ════════════════════════════════════════════════════════════
    const VIEWS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];
    const VIEW_LABELS = { 'Scenario': 'Test 1', 'Icke-ex.': 'Test 2' };
    const ACTIVE_VIEWS = { 'Lista': true, 'Flashcards': true, 'Lucktext': true, 'Scenario': true, 'Icke-ex.': true };
    const SCORE_VIEWS = ['Lucktext', 'Scenario', 'Icke-ex.'];
    const PROGRESS_KEY = 'nva_progress';
    const RANK_SALT = 'nvanaturvetenskapligtarbetssattsakerhet';
    const RANK_ORDER = { D: 1, C: 2, B: 3, A: 4, S: 5 };

    function loadProgress() {
      try {
        const raw = sessionStorage.getItem(PROGRESS_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { completed: {}, best: {} };
    }

    function saveProgress(progress) {
      try {
        sessionStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
      } catch (e) {}
    }

    function computeRank(progress) {
      const completedCount = VIEWS.filter(v => progress.completed[v]).length;
      if (completedCount === 0) return null;
      if (completedCount === 5) {
        const allPerfect = SCORE_VIEWS.every(v => (progress.best[v] || 0) >= 100);
        return allPerfect ? 'S' : 'A';
      }
      if (completedCount === 4) return 'A';
      if (completedCount === 3) return 'B';
      if (completedCount === 2) return 'C';
      return 'D';
    }

    function computeVerificationCode(progress, rank) {
      const d = new Date();
      const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      const completedViews = VIEWS.filter(v => progress.completed[v]).sort().join(',');
      const input = dateStr + '|' + completedViews + '|' + (rank || '-') + '|' + RANK_SALT;
      let hash = 0;
      for (let i = 0; i < input.length; i++) {
        hash = (hash + input.charCodeAt(i) * (i + 1)) % 1679616; // 36^4
      }
      return 'NVA-' + hash.toString(36).toUpperCase().padStart(4, '0');
    }

    function FlashcardView({ onComplete, easyMode }) {
      const total = concepts.length;
      const [deck, setDeck] = React.useState(() => shuffleArray(concepts.map((c, i) => ({ term: c.term, definition: c.def, easyDef: EASY_DATA[i].def }))));
      const [deckIdx, setDeckIdx] = React.useState(0);
      const [isFlipped, setIsFlipped] = React.useState(false);
      const [kudeInte, setKudeInte] = React.useState([]);
      const [kunde, setKunde] = React.useState([]);
      const [phase, setPhase] = React.useState('playing');

      const restartAll = () => {
        setDeck(shuffleArray(concepts.map((c, i) => ({ term: c.term, definition: c.def, easyDef: EASY_DATA[i].def }))));
        setDeckIdx(0);
        setIsFlipped(false);
        setKudeInte([]);
        setKunde([]);
        setPhase('playing');
      };

      const sort = (pile) => {
        const card = deck[deckIdx];
        const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
        const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
        const nextIdx = deckIdx + 1;
        setKudeInte(newKudeInte);
        setKunde(newKunde);
        setIsFlipped(false);
        if (nextIdx >= deck.length) {
          setDeckIdx(nextIdx);
          setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
          onComplete();
        } else {
          setDeckIdx(nextIdx);
        }
      };

      const nextRound = () => {
        setDeck(shuffleArray([...kudeInte]));
        setDeckIdx(0);
        setIsFlipped(false);
        setKudeInte([]);
        setPhase('playing');
      };

      if (phase === 'allDone') return (
        <div className="flex flex-col items-center gap-6">
          <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
            <div className="text-5xl mb-4">🎉</div>
            <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
            <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
            <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>Börja om med alla</button>
          </div>
        </div>
      );

      if (phase === 'roundEnd') return (
        <div className="flex flex-col items-center gap-6">
          <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
            <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
            <div className="flex justify-center gap-8 mb-6">
              <div className="text-center">
                <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
              </div>
              <div className="text-center">
                <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
              </div>
            </div>
            <div className="flex flex-col gap-3">
              <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
                Öva på Kunde inte ({kudeInte.length} kort) →
              </button>
              <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                Börja om med alla
              </button>
            </div>
          </div>
        </div>
      );

      const card = deck[deckIdx];
      const remaining = deck.length - deckIdx;

      return (
        <div className="flex flex-col items-center">
          <div className="flex gap-3 mb-5 w-full max-w-sm">
            <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
              <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
            </div>
            <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-slate-400">{remaining}</p>
              <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
            </div>
            <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-green-500">{kunde.length}</p>
              <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
            </div>
          </div>
          <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
            <div className={`flip-card-inner ${isFlipped ? 'flipped' : ''}`}>
              <div className="flip-card-front" style={{background: PRIMARY}}>
                <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
                <div className="absolute bottom-6 animate-pulse">
                  <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
                </div>
              </div>
              <div className="flip-card-back" style={{background: '#fff', border: `2px solid ${PRIMARY}`}}>
                <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{easyMode ? card.easyDef : card.definition}</p>
                <div className="absolute bottom-6">
                  <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
                </div>
              </div>
            </div>
          </div>
          {isFlipped && (
            <div className="flex gap-3 w-full max-w-sm mb-4">
              <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
                ✗ Kunde inte
              </button>
              <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
                ✓ Kunde
              </button>
            </div>
          )}
          <div className="flex flex-col items-center gap-2 mt-1">
            <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
            <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
          </div>
        </div>
      );
    }

    function LucktextView({ onComplete }) {
      const data = React.useMemo(() => concepts.map(c => ({
        term: c.term, def: c.def, sentence: c.lucktext
      })), []);
      const total = data.length;

      const [inputs, setInputs] = React.useState(() => data.map(() => ''));
      const [states, setStates] = React.useState(() => data.map(() => 'unanswered'));
      const [allDone, setAllDone] = React.useState(false);
      const [reported, setReported] = React.useState(false);

      const normalize = (s) => s.trim().toLowerCase().replace(/\s+/g, ' ');

      const handleChange = (idx, val) => {
        if (states[idx] === 'correct' || states[idx] === 'revealed') return;
        const ni = [...inputs]; ni[idx] = val; setInputs(ni);
      };

      const handleKey = (e, idx) => {
        if (e.key !== 'Enter') return;
        const st = states[idx];
        if (st === 'correct' || st === 'revealed') return;
        const ns = [...states];
        if (normalize(inputs[idx]) === normalize(data[idx].term)) {
          ns[idx] = 'correct';
        } else if (st === 'unanswered') {
          ns[idx] = 'warn';
        } else {
          ns[idx] = 'wrong';
        }
        setStates(ns);
      };

      const handleRattaAlla = () => {
        setStates(states.map(s => (s === 'correct' ? 'correct' : 'revealed')));
        setInputs(inputs.map((v, i) => (states[i] === 'correct' ? v : data[i].term)));
        setAllDone(true);
      };

      const handleReset = () => {
        setInputs(data.map(() => ''));
        setStates(data.map(() => 'unanswered'));
        setAllDone(false);
        setReported(false);
      };

      const correctCount = states.filter(s => s === 'correct').length;
      const answeredCount = states.filter(s => s === 'correct' || s === 'revealed').length;
      const isFinished = allDone || states.every(s => s === 'correct' || s === 'revealed');

      React.useEffect(() => {
        if (isFinished && !reported) {
          setReported(true);
          onComplete(Math.round((correctCount / total) * 100));
        }
      }, [isFinished]);

      const borderCol = (st) =>
        st === 'correct' ? '#16a34a' : st === 'revealed' ? '#94a3b8' :
        st === 'warn'    ? '#f97316' : st === 'wrong'    ? '#dc2626' : '#e5e7eb';
      const bgCol = (st) =>
        st === 'correct' ? '#dcfce7' : st === 'revealed' ? '#f1f5f9' :
        st === 'warn'    ? '#fff7ed' : st === 'wrong'    ? '#fee2e2' : '#fff';

      return (
        <div>
          <div className="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-gray-100">
            <p className="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3">Begreppsbank – alla begrepp</p>
            <div className="flex flex-wrap gap-2">
              {data.map((item, idx) => (
                <span key={idx} className="text-xs px-2 py-1 rounded-full font-medium transition-all"
                  style={states[idx] === 'correct' || states[idx] === 'revealed'
                    ? { background: '#f1f5f9', color: '#94a3b8', textDecoration: 'line-through' }
                    : { background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}>
                  {item.term}
                </span>
              ))}
            </div>
          </div>

          <div className="flex items-center justify-between mb-4">
            <p className="text-sm text-gray-500">{answeredCount} av {total} besvarade</p>
            {!isFinished && (
              <button onClick={handleRattaAlla}
                className="text-sm px-4 py-1.5 rounded-xl bg-slate-800 text-white font-semibold hover:bg-slate-700 transition-colors">
                Rätta alla
              </button>
            )}
          </div>

          {data.map((item, idx) => {
            const st = states[idx];
            const parts = item.sentence.split('___');
            const isLocked = st === 'correct' || st === 'revealed';
            return (
              <div key={idx} className="bg-white rounded-xl shadow-sm p-4 mb-3"
                style={{ borderLeft: `6px solid ${borderCol(st)}` }}>
                <div className="flex flex-wrap items-center gap-x-1 gap-y-1 text-gray-800 text-sm leading-relaxed">
                  <span className="font-semibold text-xs text-gray-400 mr-1 flex-shrink-0">{idx + 1}.</span>
                  <span>{parts[0]}</span>
                  <input
                    type="text"
                    value={inputs[idx]}
                    disabled={isLocked}
                    onChange={(e) => handleChange(idx, e.target.value)}
                    onKeyDown={(e) => handleKey(e, idx)}
                    placeholder="Skriv begrepp och tryck Enter…"
                    className="rounded-lg px-2 py-0.5 text-sm font-medium border-2 outline-none transition-colors"
                    style={{
                      width: Math.max(220, item.term.length * 11) + 'px',
                      background: bgCol(st),
                      borderColor: borderCol(st),
                      color: isLocked ? (st === 'correct' ? '#15803d' : '#475569') : '#1e293b',
                      opacity: isLocked ? 1 : 1
                    }}
                  />
                  <span>{parts[1] || ''}</span>
                </div>
                {st === 'warn' && (
                  <p className="text-orange-500 text-xs font-semibold mt-2">
                    ⚠️ Är du säker att du stavat rätt? Försök igen och tryck Enter.
                  </p>
                )}
                {st === 'wrong' && (
                  <p className="text-red-600 text-xs font-semibold mt-2">
                    ✗ Fel svar. Fältet är kvar – försök igen eller klicka på Rätta alla.
                  </p>
                )}
                {(st === 'correct' || st === 'revealed') && (
                  <p className="text-xs mt-2 italic leading-snug"
                    style={{ color: st === 'correct' ? '#15803d' : '#475569' }}>
                    {st === 'revealed' && <strong>Rätt svar: {item.term} — </strong>}
                    {item.def}
                  </p>
                )}
              </div>
            );
          })}

          {isFinished && (
            <div className="mt-6 bg-white rounded-2xl shadow p-6 text-center border-2" style={{ borderColor: PRIMARY }}>
              <p className="text-4xl font-bold mb-2" style={{ color: PRIMARY_TEXT }}>{correctCount} / {total} rätt</p>
              <p className="text-gray-500 mb-5 text-sm">
                {correctCount === total
                  ? '🏆 Perfekt! Du kan alla begrepp!'
                  : correctCount >= Math.round(total * 0.8)
                  ? '🌟 Mycket bra jobbat!'
                  : correctCount >= Math.round(total * 0.6)
                  ? '👍 Bra kämpat – öva lite till!'
                  : '📚 Fortsätt träna så sitter det snart!'}
              </p>
              <button onClick={handleReset}
                className="px-6 py-2 rounded-xl text-white font-bold transition-colors"
                style={{ background: PRIMARY }}>
                Börja om
              </button>
            </div>
          )}
        </div>
      );
    }

    function ScenarioView({ onComplete, easyMode }) {
      const total = concepts.length;

      const buildOptions = (currentIdx, currentItems) => {
        const correct = currentItems[currentIdx];
        const others = shuffleArray(currentItems.filter((_, i) => i !== currentIdx)).slice(0, 3);
        return shuffleArray([correct, ...others]);
      };

      const [items, setItems] = React.useState(() => shuffleArray([...concepts]));
      const [idx, setIdx] = React.useState(0);
      const [options, setOptions] = React.useState(() => buildOptions(0, items));
      const [selected, setSelected] = React.useState(null);
      const [score, setScore] = React.useState(0);
      const [done, setDone] = React.useState(false);

      const handleSelect = (opt) => {
        if (selected !== null) return;
        setSelected(opt.id);
        if (opt.id === items[idx].id) setScore(s => s + 1);
      };

      const handleNext = () => {
        const nextIdx = idx + 1;
        if (nextIdx >= total) {
          setDone(true);
          onComplete(Math.round((score / total) * 100));
        } else {
          setIdx(nextIdx);
          setOptions(buildOptions(nextIdx, items));
          setSelected(null);
        }
      };

      const handleRestart = () => {
        const newItems = shuffleArray([...concepts]);
        setItems(newItems);
        setIdx(0);
        setOptions(buildOptions(0, newItems));
        setSelected(null);
        setScore(0);
        setDone(false);
      };

      if (done) {
        const pct = Math.round((score / total) * 100);
        return (
          <div className="flex flex-col items-center gap-6 py-8">
            <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{borderColor: PRIMARY}}>
              <div className="text-5xl mb-4">{pct === 100 ? '🏆' : pct >= 80 ? '🌟' : pct >= 60 ? '👍' : '📚'}</div>
              <p className="text-3xl font-bold mb-1" style={{color: PRIMARY_TEXT}}>{score} / {total}</p>
              <p className="text-gray-500 text-sm mb-6">
                {pct === 100 ? 'Perfekt! Du känner igen alla scenarier!' :
                 pct >= 80 ? 'Mycket bra! Du hanterar de flesta begreppen.' :
                 pct >= 60 ? 'Bra kämpat – öva lite till!' : 'Fortsätt träna så sitter det snart!'}
              </p>
              <button onClick={handleRestart} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                Börja om
              </button>
            </div>
          </div>
        );
      }

      const current = items[idx];
      const isAnswered = selected !== null;
      const progress = (idx / total) * 100;

      return (
        <div className="flex flex-col gap-4 max-w-xl mx-auto">
          <div className="flex items-center gap-3">
            <div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
              <div className="h-full rounded-full transition-all duration-300" style={{width: `${progress}%`, background: PRIMARY}} />
            </div>
            <span className="text-xs text-gray-500 font-medium whitespace-nowrap">{idx + 1} / {total}</span>
          </div>

          <div className="flex justify-end">
            <span className="text-sm font-semibold px-3 py-1 rounded-full" style={{background: PRIMARY_LIGHT, color: PRIMARY_TEXT}}>
              {score} rätt
            </span>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <p className="text-xs font-bold uppercase tracking-widest mb-3" style={{color: PRIMARY}}>Vilket begrepp beskrivs?</p>
            <p className="text-gray-800 text-base leading-relaxed">{easyMode ? getEasy(current.id - 1, 'scenario') : current.scenario}</p>
          </div>

          <div className="flex flex-col gap-2">
            {options.map(opt => {
              const isCorrect = opt.id === current.id;
              const isSelected = selected === opt.id;
              let borderStyle = '2px solid #e5e7eb';
              let bgColor = '#fff';
              let textColor = '#1f2937';
              if (isAnswered) {
                if (isCorrect) { borderStyle = '2px solid #4ade80'; bgColor = '#f0fdf4'; textColor = '#14532d'; }
                else if (isSelected) { borderStyle = '2px solid #f87171'; bgColor = '#fef2f2'; textColor = '#7f1d1d'; }
                else { textColor = '#9ca3af'; }
              }
              return (
                <button
                  key={opt.id}
                  onClick={() => handleSelect(opt)}
                  disabled={isAnswered}
                  className="rounded-xl px-4 py-3 text-left font-semibold text-sm transition-all"
                  style={{border: borderStyle, background: bgColor, color: textColor, cursor: isAnswered ? 'default' : 'pointer'}}
                >
                  {isAnswered && isCorrect && '✓ '}
                  {isAnswered && isSelected && !isCorrect && '✗ '}
                  {opt.term}
                </button>
              );
            })}
          </div>

          {isAnswered && (
            <div className="flex flex-col gap-3">
              <div className="rounded-xl p-4 text-sm leading-relaxed" style={
                selected === current.id
                  ? {background: '#f0fdf4', color: '#14532d'}
                  : {background: '#fef2f2', color: '#7f1d1d'}
              }>
                {selected === current.id
                  ? <span><strong>Rätt!</strong> {concepts.find(c => c.term === current.term)?.def}</span>
                  : <span><strong>Fel.</strong> Rätt svar är <em>{current.term}</em>. {concepts.find(c => c.term === current.term)?.def}</span>
                }
              </div>
              <button onClick={handleNext} className="w-full text-white py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                {idx + 1 >= total ? 'Se resultat →' : 'Nästa →'}
              </button>
            </div>
          )}
        </div>
      );
    }

    function IckeExempelView({ onComplete, easyMode }) {
      const [items, setItems] = React.useState(() =>
        shuffleArray(concepts.map((c, cIdx) => ({ id: c.id, term: c.term, options: shuffleArray(c.ickeExempel.options.map((opt, oIdx) => ({ ...opt, easyText: EASY_DATA[cIdx].ickeExempelOptions[oIdx] }))), explanation: c.ickeExempel.explanation })))
      );
      const [idx, setIdx] = React.useState(0);
      const [selected, setSelected] = React.useState(null);
      const [score, setScore] = React.useState(0);
      const [done, setDone] = React.useState(false);
      const total = items.length;

      const restart = () => {
        setItems(shuffleArray(concepts.map((c, cIdx) => ({ id: c.id, term: c.term, options: shuffleArray(c.ickeExempel.options.map((opt, oIdx) => ({ ...opt, easyText: EASY_DATA[cIdx].ickeExempelOptions[oIdx] }))), explanation: c.ickeExempel.explanation }))));
        setIdx(0);
        setSelected(null);
        setScore(0);
        setDone(false);
      };

      const handleSelect = (optIdx) => {
        if (selected !== null) return;
        setSelected(optIdx);
        if (items[idx].options[optIdx].correct) setScore(s => s + 1);
      };

      const handleNext = () => {
        if (idx + 1 >= total) {
          setDone(true);
          onComplete(Math.round((score / total) * 100));
        } else {
          setIdx(i => i + 1);
          setSelected(null);
        }
      };

      if (done) {
        const pct = Math.round((score / total) * 100);
        return (
          <div className="flex flex-col items-center gap-6 py-8">
            <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{borderColor: PRIMARY}}>
              <div className="text-5xl mb-4">{pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':'📚'}</div>
              <p className="text-3xl font-bold mb-1" style={{color: PRIMARY_TEXT}}>{score} / {total}</p>
              <p className="text-gray-500 text-sm mb-6">
                {pct===100 ? 'Perfekt! Du kan skilja rätt tillämpning från fällan!' :
                 pct>=80   ? 'Mycket bra! Du hanterar de flesta begreppen korrekt.' :
                 pct>=60   ? 'Bra kämpat – öva lite till!' : 'Fortsätt träna så sitter det snart!'}
              </p>
              <button onClick={restart} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                Börja om
              </button>
            </div>
          </div>
        );
      }

      const current = items[idx];
      const isAnswered = selected !== null;
      const progress = (idx / total) * 100;

      return (
        <div className="flex flex-col gap-4 max-w-xl mx-auto">
          <div className="flex items-center gap-3">
            <div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
              <div className="h-full rounded-full transition-all duration-300" style={{width: `${progress}%`, background: PRIMARY}} />
            </div>
            <span className="text-xs text-gray-500 font-medium whitespace-nowrap">{idx+1} / {total}</span>
          </div>

          <div className="flex justify-end">
            <span className="text-sm font-semibold px-3 py-1 rounded-full" style={{background: PRIMARY_LIGHT, color: PRIMARY_TEXT}}>
              {score} rätt
            </span>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <p className="text-xs font-bold uppercase tracking-widest mb-2" style={{color: PRIMARY}}>Vilket alternativ är en korrekt tillämpning?</p>
            <p className="text-lg font-bold text-gray-800">{current.term}</p>
          </div>

          <div className="flex flex-col gap-3">
            {current.options.map((opt, i) => {
              const label = i === 0 ? 'A' : 'B';
              let border = '2px solid #e5e7eb';
              let bg = '#fff';
              let textCol = '#1f2937';
              if (isAnswered) {
                if (opt.correct) { border = '2px solid #4ade80'; bg = '#f0fdf4'; textCol = '#14532d'; }
                else if (i === selected) { border = '2px solid #f87171'; bg = '#fef2f2'; textCol = '#7f1d1d'; }
                else { textCol = '#9ca3af'; }
              }
              return (
                <button
                  key={i}
                  onClick={() => handleSelect(i)}
                  disabled={isAnswered}
                  className="rounded-xl px-4 py-4 text-left text-sm transition-all"
                  style={{border, background: bg, color: textCol, cursor: isAnswered ? 'default' : 'pointer'}}
                >
                  <span className="font-bold mr-2">{label}.</span>
                  {isAnswered && opt.correct && '✓ '}
                  {isAnswered && i === selected && !opt.correct && '✗ '}
                  {easyMode ? opt.easyText : opt.text}
                </button>
              );
            })}
          </div>

          {isAnswered && (
            <div className="flex flex-col gap-3">
              <div className="rounded-xl p-4 text-sm leading-relaxed"
                style={current.options[selected].correct
                  ? {background: '#f0fdf4', color: '#14532d'}
                  : {background: '#fef2f2', color: '#7f1d1d'}}>
                <strong>{current.options[selected].correct ? 'Rätt!' : 'Fel.'}</strong>{' '}{current.explanation}
              </div>
              <button onClick={handleNext} className="w-full text-white py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                {idx + 1 >= total ? 'Se resultat →' : 'Nästa begrepp →'}
              </button>
            </div>
          )}
        </div>
      );
    }

    function ListView({ onComplete, easyMode }) {
      const sentinelRef = React.useRef(null);

      React.useEffect(() => {
        const el = sentinelRef.current;
        if (!el) return;
        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) onComplete();
        }, { threshold: 1.0 });
        observer.observe(el);
        return () => observer.disconnect();
      }, [onComplete]);

      return (
        <div className="flex flex-col gap-3">
          {concepts.map(c => (
            <div
              key={c.id}
              className="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow"
              style={{ borderLeft: `8px solid ${PRIMARY}` }}
            >
              <div className="px-5 py-4 flex gap-4 items-start">
                <span
                  className="text-sm font-bold rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0 mt-0.5"
                  style={{ backgroundColor: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
                >
                  {c.id}
                </span>
                <div>
                  <p className="font-bold text-gray-800">{c.term}</p>
                  <p className="text-gray-500 text-sm mt-0.5">{easyMode ? getEasy(c.id - 1, 'def') : c.def}</p>
                </div>
              </div>
            </div>
          ))}
          <div ref={sentinelRef} style={{ height: 1 }} />
        </div>
      );
    }

    // ════════════════════════════════════════════════════════════
    // HEADER + NAVIGERING
    // ════════════════════════════════════════════════════════════
    function Header({ activeView, setActiveView, progress, rank, completedCount, code }) {
      return (
        <header className="bg-white shadow-sm">
          <div className="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <a
              href="../nk1a1_naturvetenskap.html"
              onClick={(e) => { e.preventDefault(); smartBack('../nk1a1_naturvetenskap.html'); }}
              className="text-sm font-medium text-gray-500 hover:text-green-600 transition-colors"
            >
              ← Tillbaka till startsidan
            </a>
            <h1 className="text-2xl font-bold text-center tracking-wide" style={{ color: PRIMARY_TEXT }}>
              Naturvetenskapligt arbetssätt
            </h1>
            <div className="w-40 hidden sm:block" />
          </div>

          {/* Progress + rank */}
          <div className="max-w-3xl mx-auto px-4 pb-4">
            <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
              <span className="text-sm font-semibold text-gray-600">{completedCount}/5 avsnitt klara</span>
              {rank && (
                <span
                  className="text-xs font-bold px-2.5 py-1 rounded-full"
                  style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
                >
                  Rank: {rank} · Kod: {code}
                </span>
              )}
            </div>
            <div className="w-full bg-gray-200 rounded-full h-1.5">
              <div className="h-1.5 rounded-full transition-all" style={{ width: `${(completedCount / 5) * 100}%`, background: PRIMARY }} />
            </div>
          </div>

          {/* Toggle */}
          <div className="max-w-3xl mx-auto px-4 pb-4">
            <div className="flex flex-wrap bg-white rounded-full shadow-sm border border-gray-200 p-1 gap-1 w-fit mx-auto">
              {VIEWS.map(tab => {
                const active = ACTIVE_VIEWS[tab];
                return (
                  <button
                    key={tab}
                    disabled={!active}
                    onClick={() => active && setActiveView(tab)}
                    className="px-4 py-1.5 rounded-full text-sm font-semibold transition-colors"
                    style={
                      activeView === tab
                        ? { backgroundColor: PRIMARY, color: '#fff' }
                        : { color: '#6b7280', backgroundColor: 'transparent' }
                    }
                  >
                    {VIEW_LABELS[tab] || tab}
                    {progress.completed[tab] && (
                      <span className="ml-1" style={{ color: activeView === tab ? '#fff' : '#16a34a' }}>✓</span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>
        </header>
      );
    }

    function App() {
      const [activeView, setActiveView] = React.useState('Lista');
      const [progress, setProgress] = React.useState(loadProgress);
      const [celebrateRank, setCelebrateRank] = React.useState(null);
      const prevRankRef = React.useRef(computeRank(loadProgress()));

      const EASY_KEY = 'nva_easy';
      const [easyMode, setEasyMode] = React.useState(() => {
        try { return sessionStorage.getItem(EASY_KEY) === '1'; } catch(e) { return false; }
      });
      React.useEffect(() => {
        try { sessionStorage.setItem(EASY_KEY, easyMode ? '1' : '0'); } catch(e) {}
      }, [easyMode]);

      React.useEffect(() => {
        saveProgress(progress);
      }, [progress]);

      const markComplete = React.useCallback((view, pct) => {
        setProgress(prev => {
          const nextCompleted = { ...prev.completed };
          const nextBest = { ...prev.best };
          let changed = false;

          if (typeof pct === 'number' && !(nextBest[view] >= pct)) {
            nextBest[view] = pct;
            changed = true;
          }

          const thresholdMet = typeof pct === 'number' ? pct >= 80 : true;
          if (thresholdMet && !nextCompleted[view]) {
            nextCompleted[view] = true;
            changed = true;
          }

          return changed ? { completed: nextCompleted, best: nextBest } : prev;
        });
      }, []);

      const completeLista = React.useCallback(() => markComplete('Lista'), [markComplete]);
      const completeFlashcards = React.useCallback(() => markComplete('Flashcards'), [markComplete]);
      const completeLucktext = React.useCallback((pct) => markComplete('Lucktext', pct), [markComplete]);
      const completeScenario = React.useCallback((pct) => markComplete('Scenario', pct), [markComplete]);
      const completeIckeEx = React.useCallback((pct) => markComplete('Icke-ex.', pct), [markComplete]);

      const rank = computeRank(progress);
      const completedCount = VIEWS.filter(v => progress.completed[v]).length;
      const code = computeVerificationCode(progress, rank);

      React.useEffect(() => {
        const prevOrder = prevRankRef.current ? RANK_ORDER[prevRankRef.current] : 0;
        const newOrder = rank ? RANK_ORDER[rank] : 0;
        if (newOrder > prevOrder) {
          setCelebrateRank(rank);
          const t = setTimeout(() => setCelebrateRank(null), 2500);
          prevRankRef.current = rank;
          return () => clearTimeout(t);
        }
        prevRankRef.current = rank;
      }, [rank]);

      return (
        <div className="min-h-screen">
          <Header
            activeView={activeView}
            setActiveView={setActiveView}
            progress={progress}
            rank={rank}
            completedCount={completedCount}
            code={code}
          />

          {/* Enkel svenska-knapp – dold i Lucktext-vyn */}
          {activeView !== 'Lucktext' && (
            <button
              aria-pressed={easyMode}
              onClick={() => setEasyMode(m => !m)}
              style={{
                position: 'fixed', top: '1rem', right: '1rem', zIndex: 9999,
                padding: '6px 16px', borderRadius: '9999px',
                fontFamily: 'EB Garamond, serif', fontSize: '14px',
                fontWeight: '600', cursor: 'pointer',
                border: easyMode ? 'none' : '2px solid #16a34a',
                background: easyMode ? '#16a34a' : '#fff',
                color: easyMode ? '#fff' : '#16a34a',
                boxShadow: '0 1px 4px rgba(0,0,0,0.1)',
                transition: 'all 0.15s'
              }}
            >
              📖 {easyMode ? 'Enkel svenska ✓' : 'Enkel svenska'}
            </button>
          )}

          {/* Content */}
          <main className="max-w-3xl mx-auto px-4 py-6">
            {activeView === 'Lista' && <ListView onComplete={completeLista} easyMode={easyMode} />}
            {activeView === 'Flashcards' && <FlashcardView key="flashcards" onComplete={completeFlashcards} easyMode={easyMode} />}
            {activeView === 'Lucktext' && <LucktextView key="lucktext" onComplete={completeLucktext} />}
            {activeView === 'Scenario' && <ScenarioView key="scenario" onComplete={completeScenario} easyMode={easyMode} />}
            {activeView === 'Icke-ex.' && <IckeExempelView key="ickeex" onComplete={completeIckeEx} easyMode={easyMode} />}
          </main>

          {/* Footer */}
          <footer className="text-center py-6 text-sm italic text-gray-400">
            Källa: Naturkunskap 1a1 — Naturvetenskapligt arbetssätt
          </footer>

          {/* Rank celebration overlay */}
          {celebrateRank && (
            <div
              className="fixed inset-0 flex items-center justify-center z-50 px-4"
              style={{ background: 'rgba(15, 23, 42, 0.55)' }}
              onClick={() => setCelebrateRank(null)}
            >
              <div className="bg-white rounded-3xl px-10 py-8 text-center shadow-2xl">
                <div className="text-5xl mb-3">{celebrateRank === 'S' ? '🎉🏆🎉' : '🎉'}</div>
                <p className="text-3xl font-bold" style={{ color: PRIMARY_TEXT }}>{celebrateRank}-RANK!</p>
                <p className="text-gray-400 text-sm mt-2">Ny rank uppnådd</p>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
