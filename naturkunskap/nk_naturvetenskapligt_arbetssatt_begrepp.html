<!DOCTYPE html>

<head>

  <style>
    body { font-family: 'EB Garamond', serif; background: #f9fafb; }

    .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .flipped { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .flip-card-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const PRIMARY       = '#22c55e';
    const PRIMARY_LIGHT = '#dcfce7';
    const PRIMARY_TEXT  = '#14532d';

    const concepts = [
      { id:  1, term: 'Den vetenskapliga revolutionen',   def: 'Perioden efter medeltiden i Europa då man började använda systematiska undersökningsmetoder och experiment istället för att söka svar i antika skrifter eller kyrkans lära.' },
      { id:  2, term: 'Frågeställning',                   def: 'En specifik och avgränsad fråga som preciserar syftet med en undersökning.' },
      { id:  3, term: 'Hypotes',                          def: 'Ett påstående som ger ett möjligt svar på frågeställningen. När en hypotes föreslås vet man inte om den är sann eller falsk.' },
      { id:  4, term: 'Testbar hypotes',                  def: 'En hypotes som går att undersöka genom experiment och observationer.' },
      { id:  5, term: 'Falsifierbar hypotes',             def: 'En hypotes som är möjlig att motbevisa, exempelvis genom att resultaten motsäger den.' },
      { id:  6, term: 'Repeterbart experiment',           def: 'Ett experiment som kan upprepas och kontrolleras av andra.' },
      { id:  7, term: 'Observationer',                    def: 'Att samla in resultat genom att iaktta, exempelvis inom astronomin där man inte kan göra experiment.' },
      { id:  8, term: 'Experiment',                       def: 'En undersökning där man avsiktligt ändrar en variabel för att undersöka effekten på något annat.' },
      { id:  9, term: 'Simuleringar',                     def: 'Datorberäkningar som används för att förutsäga förlopp, exempelvis framtida temperaturförändringar i klimatforskningen.' },
      { id: 10, term: 'Den vetenskapliga metoden',        def: 'Uttryck för en bestämd ordning av steg i forskning; i praktiken finns ingen enda metod som alla naturvetare följer.' },
      { id: 11, term: 'Den hypotetisk-deduktiva metoden', def: 'Arbetsgång där en frågeställning leder till en hypotes, en förutsägelse, en undersökning och slutligen en slutsats.' },
      { id: 12, term: 'Förutsägelse',                     def: 'Ett påstående om vad man förväntar sig ska hända om hypotesen stämmer.' },
      { id: 13, term: 'Slutsats',                         def: 'Tolkning av resultaten för att avgöra om förutsägelsen inträffat. Inträffar den får hypotesen stöd; annars motbevisas (falsifieras) den.' },
      { id: 14, term: 'Vetenskaplig teori',               def: 'En väl underbyggd förklaringsmodell för hur något i omvärlden är uppbyggt eller fungerar. Långt mer än en gissning.' },
      { id: 15, term: 'Paradigmskifte',                   def: 'När en vetenskaplig teori ersätts av en annan.' },
      { id: 16, term: 'Naturvetenskapens begränsningar',  def: 'Naturvetenskapen kan bara undersöka sådant som går att testa och kan inte besvara moraliska frågor om vad som är rätt och fel.' },
      { id: 17, term: 'Forskningsetik',                   def: 'Vägledning från etikprövningsmyndighet och etiska kommittéer för att forskning ska utföras på ett etiskt och objektivt sätt.' },
      { id: 18, term: 'Forskningsfusk',                   def: 'Att plagiera, förfalska eller undanhålla resultat från sin forskning.' },
      { id: 19, term: 'Etikprövning',                     def: 'Prövning som i regel krävs innan experiment får utföras på bläckfiskar, ryggradsdjur och människor.' },
      { id: 20, term: 'Oberoende variabel',               def: 'Det som ändras i ett experiment, och som antas orsaka en förändring.' },
      { id: 21, term: 'Beroende variabel',                def: 'Det som mäts, och som antas påverkas av den oberoende variabeln.' },
      { id: 22, term: 'Kontrollerade variabler',          def: 'Faktorer som hålls så konstanta som möjligt för att de inte ska påverka resultatet.' },
      { id: 23, term: 'Störvariabler',                    def: 'Andra faktorer som kan påverka resultatet och därför måste hållas konstanta.' },
      { id: 24, term: 'Kontrollgrupp',                    def: 'En jämförelsegrupp som inte utsätts för behandlingen eller det verksamma ämnet, vilket minskar risken att andra variabler påverkar slutsatsen.' },
      { id: 25, term: 'Experimentgrupp',                  def: 'Den grupp som utsätts för behandlingen eller det verksamma ämne som undersöks.' },
      { id: 26, term: 'Slumpen',                          def: 'Slumpmässiga variationer; ju fler försökspersoner eller upprepningar, desto mindre risk att resultatet beror på slumpen.' },
      { id: 27, term: 'Blindstudie',                      def: 'Studie där försökspersonerna inte vet om de får en aktiv substans eller inte, för att utesluta placeboeffekten.' },
      { id: 28, term: 'Placeboeffekten',                  def: 'Påverkan på ett behandlingsresultat som beror på att försökspersonen förväntar sig att bli bättre, trots att ingen verksam medicin getts.' },
      { id: 29, term: 'Medelvärde',                       def: 'Det beräknade genomsnittet av flera mätvärden, ofta redovisat per försöksgrupp.' },
      { id: 30, term: 'Trendlinje',                       def: 'En linje i ett diagram som visar den övergripande tendensen i mätvärdena.' },
      { id: 31, term: 'Samvariation (korrelation)',       def: 'När två variabler varierar tillsammans.' },
      { id: 32, term: 'Orsakssamband',                    def: 'När en variabel faktiskt orsakar förändring i en annan. Samvariation behöver inte betyda orsakssamband.' },
      { id: 33, term: 'Vetenskaplig rapport',             def: 'Skriftlig redovisning av ett experiment med delarna inledning, material och metod, resultat, diskussion och källförteckning.' },
      { id: 34, term: 'Riskbedömning',                    def: 'Bedömning av risker som görs innan det praktiska arbetet i exempelvis en laboration påbörjas.' },
      { id: 35, term: 'Farosymboler',                     def: 'Märkning av hälso- och brandfarliga produkter, t.ex. skadlig, brandfarlig, frätande, hälsofarlig, miljöfarlig och giftig.' },
      { id: 36, term: 'Vetenskapligt förhållningssätt',   def: 'Att ha ett kritiskt tänkande, vara opartisk, vara öppen för nya idéer och basera sina slutsatser på välgrundade fakta.' },
      { id: 37, term: 'Källkritik',                       def: 'Att systematiskt granska och bedöma källors trovärdighet.' },
      { id: 38, term: 'Källkritikens ABC',                def: 'Frågorna man ställer om en källa: är den äkta, aktuell, beroende, tendensiös och granskad?' },
      { id: 39, term: 'Primärkälla',                      def: 'Källa som bygger på egen data, t.ex. vetenskapliga artiklar baserade på observationer och experiment. Mer tillförlitlig.' },
      { id: 40, term: 'Sekundärkälla',                    def: 'Källa som hämtar sin information från andra källor. Mindre pålitlig eftersom den är beroende av att ursprungskällan är korrekt.' },
      { id: 41, term: 'Tendensiös (vinklad) källa',       def: 'En källa med underliggande politiska, ekonomiska eller ideologiska intressen, vilket gör den mindre trovärdig.' },
      { id: 42, term: 'Peer review',                      def: 'Granskning av en vetenskaplig rapport av minst två oberoende forskare innan publicering; ett sätt att garantera kvaliteten.' },
      { id: 43, term: 'Desinformation',                   def: 'Felaktig information som sprids medvetet för att lura eller vilseleda.' },
      { id: 44, term: 'Propaganda',                       def: 'Kommunikation som syftar till att påverka den allmänna opinionen och undergräva motståndare. Räknas som desinformation när den medvetet sprider falsk information.' },
      { id: 45, term: 'Deepfakes',                        def: 'Falska bilder, videor och ljudinspelningar av personer som skapats med hjälp av AI.' },
      { id: 46, term: 'Konspirationsteorier',             def: 'Föreställningar om att hemliga grupper i en sammansvärjning arbetar för att uppnå dolda mål.' },
      { id: 47, term: 'Faktaresistens',                   def: 'När en person håller fast vid sin övertygelse trots att fakta talar emot.' },
      { id: 48, term: 'Ekokammare',                       def: 'En miljö, t.ex. på sociala medier, där en grupps åsikter förstärks genom att användarna ständigt bekräftar varandra.' },
      { id: 49, term: 'Filterbubblor',                    def: 'När algoritmer på sociala medier anpassar innehållet efter en persons profil, så att man främst möter information som bekräftar den egna världsbilden.' },
      { id: 50, term: 'Bekräftelsebias',                  def: 'Tendensen att ha högre tilltro till information som redan stämmer med de egna uppfattningarna.' },
      { id: 51, term: 'Kognitiv dissonans',               def: 'Den inre konflikt som uppstår av motstridiga fakta, vilket kan få personer att förneka fakta snarare än att ändra uppfattning.' },
      { id: 52, term: 'Pseudovetenskap',                  def: 'Läror som gör anspråk på att vara vetenskapliga utan att ha vetenskapligt stöd, t.ex. astrologi.' },
    ];

    function shuffleArray(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function FlashcardView() {
      const total = concepts.length;
      const [deck, setDeck] = React.useState(() => shuffleArray(concepts.map(c => ({ term: c.term, definition: c.def }))));
      const [deckIdx, setDeckIdx] = React.useState(0);
      const [isFlipped, setIsFlipped] = React.useState(false);
      const [kudeInte, setKudeInte] = React.useState([]);
      const [kunde, setKunde] = React.useState([]);
      const [phase, setPhase] = React.useState('playing');

      const restartAll = () => {
        setDeck(shuffleArray(concepts.map(c => ({ term: c.term, definition: c.def }))));
        setDeckIdx(0);
        setIsFlipped(false);
        setKudeInte([]);
        setKunde([]);
        setPhase('playing');
      };

      const sort = (pile) => {
        const card = deck[deckIdx];
        const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
        const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
        const nextIdx = deckIdx + 1;
        setKudeInte(newKudeInte);
        setKunde(newKunde);
        setIsFlipped(false);
        if (nextIdx >= deck.length) {
          setDeckIdx(nextIdx);
          setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
        } else {
          setDeckIdx(nextIdx);
        }
      };

      const nextRound = () => {
        setDeck(shuffleArray([...kudeInte]));
        setDeckIdx(0);
        setIsFlipped(false);
        setKudeInte([]);
        setPhase('playing');
      };

      if (phase === 'allDone') return (
        <div className="flex flex-col items-center gap-6">
          <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
            <div className="text-5xl mb-4">🎉</div>
            <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
            <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
            <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>Börja om med alla</button>
          </div>
        </div>
      );

      if (phase === 'roundEnd') return (
        <div className="flex flex-col items-center gap-6">
          <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
            <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
            <div className="flex justify-center gap-8 mb-6">
              <div className="text-center">
                <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
              </div>
              <div className="text-center">
                <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
              </div>
            </div>
            <div className="flex flex-col gap-3">
              <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
                Öva på Kunde inte ({kudeInte.length} kort) →
              </button>
              <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                Börja om med alla
              </button>
            </div>
          </div>
        </div>
      );

      const card = deck[deckIdx];
      const remaining = deck.length - deckIdx;

      return (
        <div className="flex flex-col items-center">
          <div className="flex gap-3 mb-5 w-full max-w-sm">
            <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
              <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
            </div>
            <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-slate-400">{remaining}</p>
              <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
            </div>
            <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-green-500">{kunde.length}</p>
              <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
            </div>
          </div>
          <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
            <div className={`flip-card-inner ${isFlipped ? 'flipped' : ''}`}>
              <div className="flip-card-front" style={{background: PRIMARY}}>
                <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
                <div className="absolute bottom-6 animate-pulse">
                  <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
                </div>
              </div>
              <div className="flip-card-back" style={{background: '#fff', border: `2px solid ${PRIMARY}`}}>
                <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
                <div className="absolute bottom-6">
                  <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
                </div>
              </div>
            </div>
          </div>
          {isFlipped && (
            <div className="flex gap-3 w-full max-w-sm mb-4">
              <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
                ✗ Kunde inte
              </button>
              <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
                ✓ Kunde
              </button>
            </div>
          )}
          <div className="flex flex-col items-center gap-2 mt-1">
            <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
            <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
          </div>
        </div>
      );
    }

    const LUCKTEXT_SENTENCES = [
      'Under ___ på 1500–1600-talet började Galileo och Kepler använda experiment och observationer istället för att lita på kyrkan och Aristoteles.',
      'Innan Emma startade sin undersökning formulerade hon en tydlig ___ som preciserade exakt vad hon ville ta reda på.',
      'Forskaren ställde upp en ___ om att solljus påverkar tillväxten hos växter.',
      'En ___ är en hypotes som faktiskt kan undersökas med experiment, till skillnad från påståendet att skönhet är subjektivt.',
      'Karl Poppers krav på att varje vetenskapligt påstående måste vara en ___ innebär att det måste gå att motbevisa.',

      'Efter att ha analyserat alla mätdata kunde Maria dra en ___ om huruvida hennes hypotes fick stöd eller falsifierades.',

      'Övergången från att tro att solen kretsar runt jorden till att förstå att det är tvärtom kallas ett ___.',

      'Projektet som involverade 50 frivilliga studenter krävde en fullständig ___ av den regionala myndigheten.',
      'I solljusexperimentet var ljusets intensitet den ___ – den faktor som forskarna medvetet varierade.',
      'Plantornas höjd var den ___ som mättes varje dag för att se om ljusexponeringen hade någon effekt.',
      'För att experimentet skulle bli rättvist hölls temperatur, jordmängd och vattning som ___ under hela studien.',
      'Forskarna noterade att luftdraget från ventilationssystemet var en möjlig ___ som de behövde eliminera.',
      'Hälften av försöksdjuren fick sockerlösning utan verksamt ämne och bildade en ___ som de behandlade djuren jämfördes mot.',
      'Den andra hälften av råttorna som faktiskt fick antibiotikan utgjorde ___.',
      'Eftersom bara tre försökspersoner testade proteindrycken kunde resultaten bero på ___ snarare än på drycken i sig.',

      'Trots att månlandningen dokumenterades av tusentals tekniker och vetenskapsmän tror vissa att det handlar om ___.',
      'Trots att läkaren presenterade tydliga röntgenbilder vägrade patienten ändra sin uppfattning – ett tydligt exempel på ___.',
      'På forumet bildade användarna en ___ där alla bekräftade varandra och aldrig ifrågasatte gruppens gemensamma övertygelse.',
      'Eftersom algoritmerna bara visade Sara videor om vegankost hamnade hon i ___ och fick aldrig se kritiska perspektiv.',
      'Erik letade bara upp artiklar som stödde hans åsikt om träning – ett typiskt tecken på ___.',
      'Att ta del av bevis som motstrider ens världsbild skapar ___, vilket ibland leder till att man förnekar fakta.',
      'Astrologin påstår sig förutsäga personlighet baserat på födelsetidpunkten men saknar vetenskapligt stöd och räknas som ___.',
    ];

    function LucktextView() {
      const data = React.useMemo(() => concepts.map((c, i) => ({
        term: c.term, def: c.def, sentence: LUCKTEXT_SENTENCES[i]
      })), []);
      const total = data.length;

      const [inputs, setInputs] = React.useState(() => data.map(() => ''));
      const [states, setStates] = React.useState(() => data.map(() => 'unanswered'));
      const [allDone, setAllDone] = React.useState(false);

      const normalize = (s) => s.trim().toLowerCase().replace(/\s+/g, ' ');

      const handleChange = (idx, val) => {
        if (states[idx] === 'correct' || states[idx] === 'revealed') return;
        const ni = [...inputs]; ni[idx] = val; setInputs(ni);
      };

      const handleKey = (e, idx) => {
        if (e.key !== 'Enter') return;
        const st = states[idx];
        if (st === 'correct' || st === 'revealed') return;
        const ns = [...states];
        if (normalize(inputs[idx]) === normalize(data[idx].term)) {
          ns[idx] = 'correct';
        } else if (st === 'unanswered') {
          ns[idx] = 'warn';
        } else {
          ns[idx] = 'wrong';
        }
        setStates(ns);
      };

      const handleRattaAlla = () => {
        setStates(states.map(s => (s === 'correct' ? 'correct' : 'revealed')));
        setInputs(inputs.map((v, i) => (states[i] === 'correct' ? v : data[i].term)));
        setAllDone(true);
      };

      const handleReset = () => {
        setInputs(data.map(() => ''));
        setStates(data.map(() => 'unanswered'));
        setAllDone(false);
      };

      const correctCount = states.filter(s => s === 'correct').length;
      const answeredCount = states.filter(s => s === 'correct' || s === 'revealed').length;

                  <input

                    style={{

              <p className="text-4xl font-bold mb-2" style={{ color: PRIMARY_TEXT }}>{correctCount} / {total} rätt</p>

                style={{ background: PRIMARY }}>

              </button>
            </div>
          )}
        </div>
      );
    }

    function ScenarioView() {
      const total = SCENARIOS.length;
      const [items, setItems] = React.useState(() => shuffleArray([...SCENARIOS]));
      const [idx, setIdx] = React.useState(0);
      const [options, setOptions] = React.useState(() => {
        const correct = SCENARIOS[0];
        const others = shuffleArray(SCENARIOS.filter((_, i) => i !== 0)).slice(0, 3);
        return shuffleArray([correct, ...others]);
      });
      const [selected, setSelected] = React.useState(null);
      const [score, setScore] = React.useState(0);
      const [done, setDone] = React.useState(false);

      const buildOptions = (currentIdx, currentItems) => {
        const correct = currentItems[currentIdx];
        const others = shuffleArray(currentItems.filter((_, i) => i !== currentIdx)).slice(0, 3);
        return shuffleArray([correct, ...others]);
      };

      const handleSelect = (opt) => {
        if (selected !== null) return;
        setSelected(opt.id);
        if (opt.id === items[idx].id) setScore(s => s + 1);
      };

      const handleNext = () => {
        const nextIdx = idx + 1;
        if (nextIdx >= total) {
          setDone(true);
        } else {
          setIdx(nextIdx);
          setOptions(buildOptions(nextIdx, items));
          setSelected(null);
        }
      };

      const handleRestart = () => {
        const newItems = shuffleArray([...SCENARIOS]);
        setItems(newItems);
        setIdx(0);
        setOptions(buildOptions(0, newItems));
        setSelected(null);
        setScore(0);
        setDone(false);
      };

      if (done) {
        const pct = Math.round((score / total) * 100);
        return (
          <div className="flex flex-col items-center gap-6 py-8">
            <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{borderColor: PRIMARY}}>
              <div className="text-5xl mb-4">{pct === 100 ? '🏆' : pct >= 80 ? '🌟' : pct >= 60 ? '👍' : '📚'}</div>
              <p className="text-3xl font-bold mb-1" style={{color: PRIMARY_TEXT}}>{score} / {total}</p>
              <p className="text-gray-500 text-sm mb-6">
                {pct === 100 ? 'Perfekt! Du känner igen alla scenarier!' :
                 pct >= 80 ? 'Mycket bra! Du hanterar de flesta begreppen.' :
                 pct >= 60 ? 'Bra kämpat – öva lite till!' : 'Fortsätt träna så sitter det snart!'}
              </p>
              <button onClick={handleRestart} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                Börja om
              </button>
            </div>
          </div>
        );
      }

      const current = items[idx];
      const isAnswered = selected !== null;
      const progress = (idx / total) * 100;

      return (
        <div className="flex flex-col gap-4 max-w-xl mx-auto">
          <div className="flex items-center gap-3">
            <div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
              <div className="h-full rounded-full transition-all duration-300" style={{width: `${progress}%`, background: PRIMARY}} />
            </div>
            <span className="text-xs text-gray-500 font-medium whitespace-nowrap">{idx + 1} / {total}</span>
          </div>

          <div className="flex justify-end">
            <span className="text-sm font-semibold px-3 py-1 rounded-full" style={{background: PRIMARY_LIGHT, color: PRIMARY_TEXT}}>
              {score} rätt
            </span>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <p className="text-xs font-bold uppercase tracking-widest mb-3" style={{color: PRIMARY}}>Vilket begrepp beskrivs?</p>
            <p className="text-gray-800 text-base leading-relaxed">{current.scenario}</p>
          </div>

          <div className="flex flex-col gap-2">
            {options.map(opt => {
              const isCorrect = opt.id === current.id;
              const isSelected = selected === opt.id;
              let borderStyle = '2px solid #e5e7eb';
              let bgColor = '#fff';
              let textColor = '#1f2937';
              if (isAnswered) {
                if (isCorrect) { borderStyle = '2px solid #4ade80'; bgColor = '#f0fdf4'; textColor = '#14532d'; }
                else if (isSelected) { borderStyle = '2px solid #f87171'; bgColor = '#fef2f2'; textColor = '#7f1d1d'; }
                else { textColor = '#9ca3af'; }
              }
              return (
                <button
                  key={opt.id}
                  onClick={() => handleSelect(opt)}
                  disabled={isAnswered}
                  className="rounded-xl px-4 py-3 text-left font-semibold text-sm transition-all"
                  style={{border: borderStyle, background: bgColor, color: textColor, cursor: isAnswered ? 'default' : 'pointer'}}
                >
                  {isAnswered && isCorrect && '✓ '}
                  {isAnswered && isSelected && !isCorrect && '✗ '}
                  {opt.term}
                </button>
              );
            })}
          </div>

          {isAnswered && (
            <div className="flex flex-col gap-3">
              <div className="rounded-xl p-4 text-sm leading-relaxed" style={
                selected === current.id
                  ? {background: '#f0fdf4', color: '#14532d'}
                  : {background: '#fef2f2', color: '#7f1d1d'}
              }>
                {selected === current.id
                  ? <span><strong>Rätt!</strong> {concepts.find(c => c.term === current.term)?.def}</span>
                  : <span><strong>Fel.</strong> Rätt svar är <em>{current.term}</em>. {concepts.find(c => c.term === current.term)?.def}</span>
                }
              </div>
              <button onClick={handleNext} className="w-full text-white py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                {idx + 1 >= total ? 'Se resultat →' : 'Nästa scenario →'}
              </button>
            </div>
          )}
        </div>
      );
    }

          { text: '"Kärlek är det viktigaste i livet" – ett påstående som inte kan undersökas med experiment.', correct: false }
        ],
        explanation: 'En testbar hypotes måste kunna undersökas med mätningar. "Kärlek är det viktigaste" är ett värdeomdöme som inte är möjligt att testa naturvetenskapligt.' },
      { id:  5, term: 'Falsifierbar hypotes',
        options: [
          { text: '"Alla metallföremål sjunker i vatten" – ett enda flytande metallföremål motbevisar det.', correct: true },
          { text: '"Universum skapades för ett syfte" – ett påstående som inga observationer kan motbevisa.', correct: false }
        ],
        explanation: 'Falsifierbarhet kräver att det är möjligt att hitta bevis MOT påståendet. "Universum skapades för ett syfte" är inte falsifierbart.' },
      { id:  6, term: 'Repeterbart experiment',
        options: [
          { text: 'Tre oberoende laboratorier i olika länder genomför exakt samma försök och jämför resultaten.', correct: true },
          { text: 'En forskare upprepar sitt eget experiment fem gånger i rad för att kontrollera sin precision.', correct: false }
        ],
        explanation: 'Repeterbarhet handlar om att ANDRA kan genomföra och bekräfta experimentet. Att en forskare upprepar sina egna mätningar handlar om reliabilitet, inte vetenskaplig repeterbarhet.' },
      { id:  7, term: 'Observationer',
        options: [
          { text: 'Astronomen noterar var Jupiter befinner sig varje kväll – hon kan inte flytta himlakropparna.', correct: true },
          { text: 'Biologen förändrar mängden näring i vattnet och noterar hur snabbt algerna växer.', correct: false }
        ],
        explanation: 'Observationer innebär att man iakttar utan att experimentellt manipulera. Att ändra näring och mäta effekten är ett experiment.' },
      { id:  8, term: 'Experiment',
        options: [
          { text: 'Kemisten ändrar pH-värdet i lösningen och mäter hur reaktionshastigheten förändras.', correct: true },
          { text: 'Geologen studerar fossiler i bergsskikten och noterar vilka arter som förekommer i olika lager.', correct: false }
        ],
        explanation: 'I ett experiment avsiktligt ändrar man en variabel. Att studera fossiler utan att manipulera är observation, inte experiment.' },
      { id:  9, term: 'Simuleringar',
        options: [
          { text: 'Klimatforskare matar in CO₂-nivåer i ett datorprogram för att beräkna hur klimatet kan se ut 2100.', correct: true },
          { text: 'Meteorologen samlar in temperaturmätningar från 500 väderstationer runt om i Sverige.', correct: false }
        ],
        explanation: 'Simuleringar använder datorberäkningar för att förutsäga förlopp. Att samla in riktiga mätdata är datainsamling, inte simulering.' },
      { id: 10, term: 'Den vetenskapliga metoden',
        options: [
          { text: 'En geolog och en biolog arbetar båda vetenskapligt men deras tillvägagångssätt skiljer sig markant.', correct: true },
          { text: 'Alla naturvetare följer samma bestämda femstegsmodell: observation, fråga, hypotes, experiment, slutsats.', correct: false }
        ],
        explanation: 'Det finns inte en enda universell vetenskaplig metod – det är en vanlig missuppfattning. Tillvägagångssättet varierar beroende på ämne och frågeställning.' },
      { id: 11, term: 'Den hypotetisk-deduktiva metoden',
        options: [
          { text: 'Forskaren formulerar en hypotes, härleder en förutsägelse, testar den och drar en slutsats.', correct: true },
          { text: 'Forskaren samlar in massvis med data och försöker sedan hitta mönster som kan förklara dem.', correct: false }
        ],
        explanation: 'Den hypotetisk-deduktiva metoden börjar med en hypotes. Det andra alternativet beskriver induktiv metod – man startar med data och arbetar sig mot en förklaring.' },
      { id: 12, term: 'Förutsägelse',
        options: [
          { text: '"Om min hypotes stämmer borde fröna i mörkret inte ha grott alls efter tre dagar."', correct: true },
          { text: '"Fröna grodde inte i mörkret, precis som hypotesen föreslog." – skrivet efter experimentet.', correct: false }
        ],
        explanation: 'En förutsägelse formuleras INNAN experimentet. Det andra alternativet beskriver resultaten efteråt – det är en slutsats.' },
      { id: 13, term: 'Slutsats',
        options: [
          { text: 'Resultaten jämförs med förutsägelsen: stämde de ger hypotesen stöd, stämde de inte falsifieras den.', correct: true },
          { text: 'Forskaren beskriver vad hon förväntar sig att se – formulerat innan experimentet är avslutat.', correct: false }
        ],
        explanation: 'En slutsats dras EFTER att resultaten analyserats och jämförts med förutsägelsen. Det andra alternativet är en förutsägelse.' },
      { id: 14, term: 'Vetenskaplig teori',
        options: [
          { text: 'Evolutionsteorin stöds av fossiler, DNA-analys och observationer – long ifrån en lös gissning.', correct: true },
          { text: '"Jag har en teori om varför min chef alltid är på dåligt humör på måndagar."', correct: false }
        ],
        explanation: 'En vetenskaplig teori är en välunderbyggd förklaringsmodell stödd av systematisk forskning. I vardagsspråk kan "teori" betyda en gissning – en vanlig missuppfattning.' },
      { id: 15, term: 'Paradigmskifte',
        options: [
          { text: 'Heliocentrism ersätter geocentrism när observationer och beräkningar motbevisar den gamla modellen.', correct: true },
          { text: 'En ny studie visar att ett visst kosttillskott inte har de positiva effekter man tidigare trodde.', correct: false }
        ],
        explanation: 'Ett paradigmskifte kräver att en hel förklaringsmodell byts ut. Att en studie reviderar ett specifikt påstående är ingen paradigmförändring.' },
      { id: 16, term: 'Naturvetenskapens begränsningar',
        options: [
          { text: 'Vetenskapen kan mäta ett ämnes giftighet men kan inte avgöra om det är rätt att använda det som vapen.', correct: true },
          { text: 'Vetenskapen kan inte undersöka dåtiden eftersom det är omöjligt att göra experiment på historiska händelser.', correct: false }
        ],
        explanation: 'Naturvetenskapens begränsning handlar om etiska frågor (rätt/fel). Det andra alternativet är fel – vetenskapen undersöker dåtiden via t.ex. fossil och isotoper.' },
      { id: 17, term: 'Forskningsetik',
        options: [
          { text: 'En oberoende etikkommitté granskar studiens plan för att säkerställa att den bedrivs objektivt och utan skada.', correct: true },
          { text: 'Forskaren väljer att inte publicera negativa resultat för att skydda sin karriär.', correct: false }
        ],
        explanation: 'Forskningsetik handlar om vägledning och kontroll för korrekt forskning. Det andra alternativet beskriver oetiskt beteende – undanhållande av resultat.' },
      { id: 18, term: 'Forskningsfusk',
        options: [
          { text: 'Forskaren kopierar en kollegas tabell utan källhänvisning och lägger till mätpunkter som aldrig samlades in.', correct: true },
          { text: 'Forskaren väljer att inte aktivt marknadsföra ett negativt resultat och publicerar en positiv uppföljning.', correct: false }
        ],
        explanation: 'Forskningsfusk innebär plagiering, förfalskning eller undanhållande av resultat. Att inte marknadsföra ett negativt resultat är tveksamt men kräver aktiv förfalskning för att räknas som fusk.' },
      { id: 19, term: 'Etikprövning',
        options: [
          { text: 'Universitetet ansöker om tillstånd från en statlig myndighet innan de börjar använda möss i ett läkemedelsförsök.', correct: true },
          { text: 'Läraren ber föräldrar skriva under ett informationsbrev om att deras barn deltar i ett enkätprojekt.', correct: false }
        ],
        explanation: 'Etikprövning krävs vid försök på ryggradsdjur, bläckfiskar och människor och sker via en statlig myndighet. En enkel enkät i skolan kräver inte formell etikprövning.' },
      { id: 20, term: 'Oberoende variabel',
        options: [
          { text: 'Mängden gödning som tillsätts – det som forskaren aktivt väljer att ändra i experimentet.', correct: true },
          { text: 'Plantornas höjd, som mäts och registreras varje dag under hela experimentet.', correct: false }
        ],
        explanation: 'Den oberoende variabeln är det som ÄNDRAS aktivt av forskaren. Plantornas höjd är det man mäter – det är den beroende variabeln.' },
      { id: 21, term: 'Beroende variabel',
        options: [
          { text: 'Musornas reaktionstid, som mäts efter att de exponerats för olika mängder koffein.', correct: true },
          { text: 'Mängden koffein som injiceras i varje grupp av möss.', correct: false }
        ],
        explanation: 'Den beroende variabeln är det som MÄTS och antas påverkas. Koffeinmängden är det man ändrar – den oberoende variabeln.' },
      { id: 22, term: 'Kontrollerade variabler',
        options: [
          { text: 'Temperatur, luftfuktighet och jordmängd hålls exakt lika för alla grupper under hela experimentet.', correct: true },
          { text: 'Forskaren noterar och registrerar alla faktorer som varierar naturligt mellan grupperna.', correct: false }
        ],
        explanation: 'Kontrollerade variabler ska hållas KONSTANTA – inte bara registreras. Det andra alternativet beskriver mätning av variation, inte kontroll av den.' },
      { id: 23, term: 'Störvariabler',
        options: [
          { text: 'Luftdraget från ventilationssystemet kan oavsiktligt påverka reaktionshastigheten i laboratoriet.', correct: true },
          { text: 'Temperaturen i laboratoriet, som aktivt ändras av forskaren för att undersöka dess effekt.', correct: false }
        ],
        explanation: 'Störvariabler är faktorer man INTE planerat att ändra men som ändå kan snedvrida resultaten. Om man medvetet ändrar temperaturen är det en oberoende variabel.' },
      { id: 24, term: 'Kontrollgrupp',
        options: [
          { text: 'En grupp råttor som inte får någon behandling alls – de används enbart som jämförelsegrupp.', correct: true },
          { text: 'En grupp råttor som får den lägsta dosen av det läkemedel som testas.', correct: false }
        ],
        explanation: 'Kontrollgruppen ska inte utsättas för den behandling som undersöks. En grupp som får lägst dos är fortfarande del av experimentet.' },
      { id: 25, term: 'Experimentgrupp',
        options: [
          { text: 'De patienter som faktiskt fick det nya läkemedlet under studien.', correct: true },
          { text: 'De patienter som fick sockerpiller och visade stark förbättring tack vare placeboeffekten.', correct: false }
        ],
        explanation: 'Experimentgruppen utsätts för behandlingen som undersöks. De som fick sockerpiller ingår i kontrollgruppen – deras förbättring är placeboeffekten.' },
      { id: 26, term: 'Slumpen',
        options: [
          { text: 'Alla tre i testgruppen råkade vara ovanligt friska individer – resultaten kan bero på det, inte på ämnet.', correct: true },
          { text: 'Forskaren slumpmässigt delar in försökspersoner i kontroll- och experimentgrupp.', correct: false }
        ],
        explanation: 'Slumpen som begrepp handlar om oväntade variationer som kan förklara resultaten. Slumpmässig indelning är en metod för att minska bias – inte ett exempel på slumpens inverkan.' },
      { id: 27, term: 'Blindstudie',
        options: [
          { text: 'Deltagarna vet inte om de fått det aktiva läkemedlet eller ett sockerpiller.', correct: true },
          { text: 'Forskaren vet inte vem i studien som tillhör experimentgruppen respektive kontrollgruppen.', correct: false }
        ],
        explanation: 'I en blindstudie är det DELTAGARNA som hålls ovetande. Om FORSKAREN hålls ovetande kallas det dubbelblind studie – ett relaterat men annat begrepp.' },
      { id: 28, term: 'Placeboeffekten',
        options: [
          { text: 'Patienter som fick sockerpiller rapporterade minskad smärta – de trodde att de fått riktig medicin.', correct: true },
          { text: 'Läkemedlet fungerade bättre för äldre patienter eftersom deras immunsystem reagerade annorlunda.', correct: false }
        ],
        explanation: 'Placeboeffekten uppstår när förväntan – inte ämnet – skapar förbättring. Att äldre reagerar annorlunda handlar om biologiska skillnader, inte om placebo.' },
      { id: 29, term: 'Medelvärde',
        options: [
          { text: 'De fem mätningarna adderas och delas med fem för att få ett representativt tal för gruppen.', correct: true },
          { text: 'Det mätvärde som förekommer flest gånger i datamängden väljs för att representera gruppen.', correct: false }
        ],
        explanation: 'Medelvärdet är summan delat på antalet mätningar. Det vanligast förekommande värdet kallas typvärde – inte medelvärde.' },
      { id: 30, term: 'Trendlinje',
        options: [
          { text: 'En linje ritas i diagrammet som visar att temperaturerna generellt ökat 50 år, trots enstaka kalla år.', correct: true },
          { text: 'Varje enskilt uppmätt temperaturvärde markeras med en punkt i diagrammet.', correct: false }
        ],
        explanation: 'En trendlinje visar den ÖVERGRIPANDE tendensen, inte enskilda datapunkter. Att markera enskilda mätvärden är ett punktdiagram, inte en trendlinje.' },
      { id: 31, term: 'Samvariation (korrelation)',
        options: [
          { text: 'Glasskonsumtion och drunkningsolyckor ökar båda på sommaren – de rör sig parallellt.', correct: true },
          { text: 'Rökning orsakar lungcancer – det finns ett direkt biologiskt samband som förklarar kopplingen.', correct: false }
        ],
        explanation: 'Samvariation innebär att två variabler varierar tillsammans utan att det ena nödvändigtvis orsakar det andra. Rökning och lungcancer är ett orsakssamband, inte bara samvariation.' },
      { id: 32, term: 'Orsakssamband',
        options: [
          { text: 'Cigarettrökning leder faktiskt till lungcancer – det finns ett direkt biologiskt förklaringssätt.', correct: true },
          { text: 'Länder med hög chokladkonsumtion har fler nobelpristagare – båda ökar med välstånd.', correct: false }
        ],
        explanation: 'Orsakssamband kräver att den ena faktorn verkligen framkallar den andra. Choklad och nobelpris samvarierar pga välstånd – ett klassiskt exempel på samvariation utan orsakssamband.' },
      { id: 33, term: 'Vetenskaplig rapport',
        options: [
          { text: 'Rapporten innehåller inledning, material och metod, resultat, diskussion och källförteckning i rätt ordning.', correct: true },
          { text: 'Forskaren sammanfattar de viktigaste slutsatserna i ett email till sin handledare.', correct: false }
        ],
        explanation: 'En vetenskaplig rapport har en specifik struktur med bestämda delar. Ett email till handledaren är informell kommunikation.' },
      { id: 34, term: 'Riskbedömning',
        options: [
          { text: 'Eleven listar möjliga risker och skyddsåtgärder INNAN syraförsöket påbörjas.', correct: true },
          { text: 'Eleven skriver i rapporten efteråt att syran var starkare än väntat och att skyddsglasögon var nödvändiga.', correct: false }
        ],
        explanation: 'Riskbedömning görs INNAN det praktiska arbetet. Att notera risker efteråt i rapporten är reflektion, inte riskbedömning.' },
      { id: 35, term: 'Farosymboler',
        options: [
          { text: 'En orange romb med en flamma på flaskan visar att innehållet är brandfarligt.', correct: true },
          { text: 'Etiketten på produkten listar alla ingående kemikalier och deras procentuella koncentrationer.', correct: false }
        ],
        explanation: 'Farosymboler är standardiserade grafiska varningssymboler. En lista på kemikalier och koncentrationer är en innehållsförteckning, inte en farosymbol.' },
      { id: 36, term: 'Vetenskapligt förhållningssätt',
        options: [
          { text: 'Du tar del av en studie som talar emot din uppfattning och funderar öppet på om dina slutsatser håller.', correct: true },
          { text: 'Du söker aktivt efter bevis som stödjer det du redan tror för att bygga ett starkare argument.', correct: false }
        ],
        explanation: 'Vetenskapligt förhållningssätt innebär att vara öppen, kritisk och opartisk. Det andra alternativet beskriver bekräftelsebias – man söker bara information som bekräftar det man tror.' },
      { id: 37, term: 'Källkritik',
        options: [
          { text: 'Du granskar vem som skrivit artikeln, när den publicerades och om avsändaren kan ha ett intresse av att vinkla.', correct: true },
          { text: 'Du väljer enbart att använda källor från välkända, stora medier som SVT och DN.', correct: false }
        ],
        explanation: 'Källkritik innebär systematisk granskning – inte att automatiskt lita på välkända medier. Även stora medier kan ha vinklade artiklar.' },
      { id: 38, term: 'Källkritikens ABC',
        options: [
          { text: 'Du ställer dig frågorna: Är källan äkta, aktuell, beroende, tendensiös och granskad?', correct: true },
          { text: 'Du kontrollerar att källan är publicerad i en vetenskaplig tidskrift för att garantera trovärdigheten.', correct: false }
        ],
        explanation: 'Källkritikens ABC är ett ramverk med specifika frågor om äkthet, aktualitet och tendens. Att enbart kontrollera om källan är vetenskaplig är ofullständigt – även sådana kan vara vinklade.' },
      { id: 39, term: 'Primärkälla',
        options: [
          { text: 'En vetenskaplig artikel som presenterar egna experiment och observationer som forskargruppen genomfört.', correct: true },
          { text: 'En välrenommerad lärobok som sammanfattar forskning inom ett ämne.', correct: false }
        ],
        explanation: 'En primärkälla bygger på egna insamlade data. En lärobok sammanfattar andras forskning – det är en sekundärkälla.' },
      { id: 40, term: 'Sekundärkälla',
        options: [
          { text: 'En bok som tolkar och sammanfattar resultaten från tre olika studier utan att samla in egna data.', correct: true },
          { text: 'En rapport baserad på intervjuer och enkäter som forskargruppen själv administrerade.', correct: false }
        ],
        explanation: 'En sekundärkälla hämtar information från andra källor. En rapport baserad på egna intervjuer är en primärkälla – forskargruppen samlade in data själva.' },
      { id: 41, term: 'Tendensiös (vinklad) källa',
        options: [
          { text: 'En hälsorapport om sockrets risker finansierad av sockerindustrin – ekonomiska intressen påverkar slutsatserna.', correct: true },
          { text: 'En ensamforskares artikel som inte granskat av kollegor och därför kan innehålla metodfel.', correct: false }
        ],
        explanation: 'En tendensiös källa har ett underliggande intresse som påverkar innehållet. En ogranskat källa kan ha fel av slarv men är inte nödvändigtvis tendensiös – tendens kräver ett avsiktligt syfte.' },
      { id: 42, term: 'Peer review',
        options: [
          { text: 'Artikeln läses igenom och godkänns av minst två oberoende experter inom fältet innan den publiceras.', correct: true },
          { text: 'Artikeln publiceras på ett öppet vetenskapsforum där vem som helst kan lämna kommentarer.', correct: false }
        ],
        explanation: 'Peer review innebär granskning av kvalificerade oberoende experter INNAN publicering. Öppen kommentering på ett forum är inte formell granskning.' },
      { id: 43, term: 'Desinformation',
        options: [
          { text: 'En nyhetssajt sprider medvetet en falsk historia om att ett vaccin orsakar allvarliga biverkningar.', correct: true },
          { text: 'En journalist publicerar ett faktafel som sedan rättas efter påpekanden från läsare.', correct: false }
        ],
        explanation: 'Desinformation är falsk information spridd med AVSIKT att vilseleda. En journalist som gör ett misstag och rättar det sprider inte desinformation – det saknas det avsiktliga inslaget.' },
      { id: 44, term: 'Propaganda',
        options: [
          { text: 'Under kriget sprids planscher för att påverka befolkningens syn på fienden och stärka stödet för ledarna.', correct: true },
          { text: 'En AI-genererad video sprids för att ge sken av att en politiker sagt saker de aldrig sagt.', correct: false }
        ],
        explanation: 'Propaganda syftar till att vinkla opinion och kan innehålla sanningsenliga påståenden – det är det medvetna syftet som definierar det. En AI-fabricerad video med falskt innehåll är desinformation.' },
      { id: 45, term: 'Deepfakes',
        options: [
          { text: 'En AI-genererad video visar en känd politiker säga saker de aldrig sagt – skapad med maskininlärning.', correct: true },
          { text: 'En fotoshoppad bild som tar bort rynkor från ett ansikte för att personen ska se yngre ut.', correct: false }
        ],
        explanation: 'Deepfakes skapas med AI för att skapa realistiska falska video- eller ljudmaterial av riktiga personer. Enkel bildmanipulering med Photoshop är inte ett deepfake.' },
      { id: 46, term: 'Konspirationsteorier',
        options: [
          { text: 'Trots att tusentals NASA-anställda dokumenterade månlandningen tror en del att en hemlig grupp planerade allt som en bluff.', correct: true },
          { text: 'En journalist avslöjar med dokument att ett läkemedelsföretag aktivt dolde information om biverkningar.', correct: false }
        ],
        explanation: 'Konspirationsteorier saknar empiriskt stöd och handlar om hemliga grupper med dolda mål. Journalistens avslöjande bygger på bevis – det är investigativ journalistik, inte konspirationsteori.' },
      { id: 47, term: 'Faktaresistens',
        options: [
          { text: 'Läkaren visar röntgenbilder som dokumenterar skadan, men patienten insisterar på att bilderna måste vara fel.', correct: true },
          { text: 'Eleven tror att svaret är C men ändrar sig direkt när läraren visar att svaret faktiskt är A.', correct: false }
        ],
        explanation: 'Faktaresistens innebär att hålla fast vid övertygelse trots motbevis. Det andra alternativet beskriver det MOTSATTA – eleven tar till sig fakta och ändrar uppfattning.' },
      { id: 48, term: 'Ekokammare',
        options: [
          { text: 'I gruppen bekräftar alla varandra och de som framför avvikande åsikter utestängs eller ignoreras direkt.', correct: true },
          { text: 'En algoritm visar dig allt mer anpassat innehåll baserat på vad du tidigare klickat på.', correct: false }
        ],
        explanation: 'Ekokammare handlar om social dynamik där åsikter förstärks inom en grupp. Det andra alternativet beskriver filterbubblor – ett algoritmbaserat fenomen.' },
      { id: 49, term: 'Filterbubblor',
        options: [
          { text: 'Algoritmerna registrerar dina klick och visar dig allt mer ensidigt innehåll utan att du märker det.', correct: true },
          { text: 'En sluten Facebook-grupp där alla delar samma politiska åsikter och aldrig lyfter in motargument.', correct: false }
        ],
        explanation: 'Filterbubblor skapas av algoritmer. En sluten grupp med likasinnade är en ekokammare – skapad av social dynamik, inte av algoritmer.' },
      { id: 50, term: 'Bekräftelsebias',
        options: [
          { text: 'Du klickar bara på artiklar som verkar bekräfta din uppfattning och ignorerar dem som talar emot.', correct: true },
          { text: 'Du läser en artikel med ett öppet sinne, hittar den övertygande och ändrar faktiskt uppfattning.', correct: false }
        ],
        explanation: 'Bekräftelsebias innebär att selektivt söka information som bekräftar det man redan tror. Det andra alternativet är tvärtom kritiskt tänkande – man kan ändra åsikt efter ny information.' },
      { id: 51, term: 'Kognitiv dissonans',
        options: [
          { text: 'Du har alltid trott att ett kosttillskott är nyttigt, men en studie visar det motsatta – du börjar ifrågasätta studien.', correct: true },
          { text: 'Du vet att rökning är farligt men röker ändå – det är svårt att bryta beroendet.', correct: false }
        ],
        explanation: 'Kognitiv dissonans är den inre konflikt som uppstår när fakta och övertygelse krockar och kan leda till att man förnekar fakta. Det andra alternativet handlar om beroendeproblematik, inte kognitiv dissonans.' },
      { id: 52, term: 'Pseudovetenskap',
        options: [
          { text: 'Astrologin påstår sig förutsäga personlighet baserat på födelsetidpunkten men saknar kontrollerade experiment.', correct: true },
          { text: 'En ny behandling som ännu inte godkänts av Läkemedelsverket men visar lovande preliminära studieresultat.', correct: false }
        ],
        explanation: 'Pseudovetenskap gör anspråk på vetenskaplig status utan faktiskt vetenskapligt stöd. En behandling med lovande preliminära studier som inväntar godkännande är under vetenskaplig prövning – inte pseudovetenskap.' },
    ];

    function IckeExempelView() {
      const [items, setItems] = React.useState(() =>
        shuffleArray(ICKE_EXEMPEL.map(item => ({ ...item, options: shuffleArray([...item.options]) })))
      );
      const [idx, setIdx] = React.useState(0);
      const [selected, setSelected] = React.useState(null);
      const [score, setScore] = React.useState(0);
      const [done, setDone] = React.useState(false);
      const total = items.length;

      const restart = () => {
        setItems(shuffleArray(ICKE_EXEMPEL.map(item => ({ ...item, options: shuffleArray([...item.options]) }))));
        setIdx(0);
        setSelected(null);
        setScore(0);
        setDone(false);
      };

      const handleSelect = (optIdx) => {
        if (selected !== null) return;
        setSelected(optIdx);
        if (items[idx].options[optIdx].correct) setScore(s => s + 1);
      };

      const handleNext = () => {
        if (idx + 1 >= total) { setDone(true); }
        else { setIdx(i => i + 1); setSelected(null); }
      };

      if (done) {
        const pct = Math.round((score / total) * 100);
        return (
          <div className="flex flex-col items-center gap-6 py-8">
            <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{borderColor: PRIMARY}}>
              <div className="text-5xl mb-4">{pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':'📚'}</div>
              <p className="text-3xl font-bold mb-1" style={{color: PRIMARY_TEXT}}>{score} / {total}</p>
              <p className="text-gray-500 text-sm mb-6">
                {pct===100 ? 'Perfekt! Du kan skilja rätt tillämpning från fällan!' :
                 pct>=80   ? 'Mycket bra! Du hanterar de flesta begreppen korrekt.' :
                 pct>=60   ? 'Bra kämpat – öva lite till!' : 'Fortsätt träna så sitter det snart!'}
              </p>
              <button onClick={restart} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                Börja om
              </button>
            </div>
          </div>
        );
      }

      const current = items[idx];
      const isAnswered = selected !== null;
      const progress = (idx / total) * 100;

      return (
        <div className="flex flex-col gap-4 max-w-xl mx-auto">
          <div className="flex items-center gap-3">
            <div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
              <div className="h-full rounded-full transition-all duration-300" style={{width: `${progress}%`, background: PRIMARY}} />
            </div>
            <span className="text-xs text-gray-500 font-medium whitespace-nowrap">{idx+1} / {total}</span>
          </div>

          <div className="flex justify-end">
            <span className="text-sm font-semibold px-3 py-1 rounded-full" style={{background: PRIMARY_LIGHT, color: PRIMARY_TEXT}}>
              {score} rätt
            </span>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <p className="text-xs font-bold uppercase tracking-widest mb-2" style={{color: PRIMARY}}>Vilket alternativ är en korrekt tillämpning?</p>
            <p className="text-lg font-bold text-gray-800">{current.term}</p>
          </div>

          <div className="flex flex-col gap-3">
            {current.options.map((opt, i) => {
              const label = i === 0 ? 'A' : 'B';
              let border = '2px solid #e5e7eb';
              let bg = '#fff';
              let textCol = '#1f2937';
              if (isAnswered) {
                if (opt.correct) { border = '2px solid #4ade80'; bg = '#f0fdf4'; textCol = '#14532d'; }
                else if (i === selected) { border = '2px solid #f87171'; bg = '#fef2f2'; textCol = '#7f1d1d'; }
                else { textCol = '#9ca3af'; }
              }
              return (
                <button
                  key={i}
                  onClick={() => handleSelect(i)}
                  disabled={isAnswered}
                  className="rounded-xl px-4 py-4 text-left text-sm transition-all"
                  style={{border, background: bg, color: textCol, cursor: isAnswered ? 'default' : 'pointer'}}
                >
                  <span className="font-bold mr-2">{label}.</span>
                  {isAnswered && opt.correct && '✓ '}
                  {isAnswered && i === selected && !opt.correct && '✗ '}
                  {opt.text}
                </button>
              );
            })}
          </div>

          {isAnswered && (
            <div className="flex flex-col gap-3">
              <div className="rounded-xl p-4 text-sm leading-relaxed"
                style={current.options[selected].correct
                  ? {background: '#f0fdf4', color: '#14532d'}
                  : {background: '#fef2f2', color: '#7f1d1d'}}>
                <strong>{current.options[selected].correct ? 'Rätt!' : 'Fel.'}</strong>{' '}{current.explanation}
              </div>
              <button onClick={handleNext} className="w-full text-white py-3 rounded-2xl font-bold transition-colors" style={{background: PRIMARY}}>
                {idx + 1 >= total ? 'Se resultat →' : 'Nästa begrepp →'}
              </button>
            </div>
          )}
        </div>
      );
    }

    const TABS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];

    function App() {
      const [view, setView] = React.useState('Lista');

      return (
        <div className="min-h-screen">
          {/* Header */}
          <header className="bg-white shadow-sm">
            <div className="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
              <a
                href="../index.html"
                className="text-sm font-medium text-gray-500 hover:text-green-600 transition-colors"
              >
                ← Tillbaka till startsidan
              </a>
              <h1 className="text-2xl font-bold text-center tracking-wide" style={{ color: PRIMARY_TEXT }}>
                Naturvetenskapligt arbetssätt
              </h1>
              <div className="w-40" />
            </div>
          </header>

          {/* Toggle */}
          <div className="max-w-3xl mx-auto px-4 pt-6 pb-2">
            <div className="flex bg-white rounded-full shadow-sm border border-gray-200 p-1 gap-1 w-fit mx-auto">
              {TABS.map(tab => (
                <button
                  key={tab}
                  onClick={() => setView(tab)}
                  className="px-4 py-1.5 rounded-full text-sm font-semibold transition-colors"
                  style={
                    view === tab
                      ? { backgroundColor: PRIMARY, color: '#fff' }
                      : { color: '#6b7280', backgroundColor: 'transparent' }
                  }
                >
                  {tab}
                </button>
              ))}
            </div>
          </div>

          {/* Content */}
          <main className="max-w-3xl mx-auto px-4 py-6">
            {view === 'Lista' && (
              <div className="flex flex-col gap-3">
                {concepts.map(c => (
                  <div
                    key={c.id}
                    className="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow"
                    style={{ borderLeft: `8px solid ${PRIMARY}` }}
                  >
                    <div className="px-5 py-4 flex gap-4 items-start">
                      <span
                        className="text-sm font-bold rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0 mt-0.5"
                        style={{ backgroundColor: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
                      >
                        {c.id}
                      </span>
                      <div>
                        <p className="font-bold text-gray-800">{c.term}</p>
                        <p className="text-gray-500 text-sm mt-0.5">{c.def}</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {view === 'Flashcards' && <FlashcardView />}

            {view === 'Lucktext' && <LucktextView />}
            {view === 'Scenario' && <ScenarioView />}
            {view === 'Icke-ex.' && <IckeExempelView />}
          </main>

          {/* Footer */}
          <footer className="text-center py-6 text-sm italic text-gray-400">
            Källa: Naturkunskap 1a1 — Naturvetenskapligt arbetssätt
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
