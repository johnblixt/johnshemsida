const PRIMARY = '#22c55e';

const begrepp = [
  { term: 'Den vetenskapliga revolutionen', def: 'Perioden efter medeltiden i Europa då man började använda systematiska undersökningsmetoder och experiment istället för att söka svar i antika skrifter eller kyrkans lära.' },
  { term: 'Frågeställning', def: 'En specifik och avgränsad fråga som preciserar syftet med en undersökning.' },
  { term: 'Hypotes', def: 'Ett påstående som ger ett möjligt svar på frågeställningen. När en hypotes föreslås vet man inte om den är sann eller falsk.' },
  { term: 'Testbar hypotes', def: 'En hypotes som går att undersöka genom experiment och observationer.' },
  { term: 'Falsifierbar hypotes', def: 'En hypotes som är möjlig att motbevisa, exempelvis genom att resultaten motsäger den.' },
  { term: 'Repeterbart experiment', def: 'Ett experiment som kan upprepas och kontrolleras av andra.' },
  { term: 'Observationer', def: 'Att samla in resultat genom att iaktta, exempelvis inom astronomin där man inte kan göra experiment.' },
  { term: 'Experiment', def: 'En undersökning där man avsiktligt ändrar en variabel för att undersöka effekten på något annat.' },
  { term: 'Simuleringar', def: 'Datorberäkningar som används för att förutsäga förlopp, exempelvis framtida temperaturförändringar i klimatforskningen.' },
  { term: 'Den vetenskapliga metoden', def: 'Uttryck för en bestämd ordning av steg i forskning; i praktiken finns ingen enda metod som alla naturvetare följer.' },
  { term: 'Den hypotetisk-deduktiva metoden', def: 'Arbetsgång där en frågeställning leder till en hypotes, en förutsägelse, en undersökning och slutligen en slutsats.' },

  { term: 'Slutsats', def: 'Tolkning av resultaten för att avgöra om förutsägelsen inträffat. Inträffar den får hypotesen stöd; annars motbevisas (falsifieras) den.' },
  { term: 'Vetenskaplig teori', def: 'En väl underbyggd förklaringsmodell för hur något i omvärlden är uppbyggt eller fungerar. Långt mer än en gissning.' },
  { term: 'Paradigmskifte', def: 'När en vetenskaplig teori ersätts av en annan.' },
  { term: 'Naturvetenskapens begränsningar', def: 'Naturvetenskapen kan bara undersöka sådant som går att testa och kan inte besvara moraliska frågor om vad som är rätt och fel.' },

  { term: 'Forskningsfusk', def: 'Att plagiera, förfalska eller undanhålla resultat från sin forskning.' },
  { term: 'Etikprövning', def: 'Prövning som i regel krävs innan experiment får utföras på bläckfiskar, ryggradsdjur och människor.' },

  { term: 'Beroende variabel', def: 'Det som mäts, och som antas påverkas av den oberoende variabeln.' },
  { term: 'Kontrollerade variabler', def: 'Faktorer som hålls så konstanta som möjligt för att de inte ska påverka resultatet.' },

  { term: 'Slumpen', def: 'Slumpmässiga variationer; ju fler försökspersoner eller upprepningar, desto mindre risk att resultatet beror på slumpen.' },

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function FlashcardsView() {
  const [deck, setDeck] = React.useState(() => shuffle(begrepp));
  const [index, setIndex] = React.useState(0);
  const [flipped, setFlipped] = React.useState(false);

  function next() {
    setFlipped(false);
    setTimeout(() => {
      if (index + 1 < deck.length) {
        setIndex(i => i + 1);
      } else {
        const last = deck[deck.length - 1];
        let newDeck = shuffle(begrepp);
        if (newDeck[0].term === last.term && newDeck.length > 1) {
          [newDeck[0], newDeck[1]] = [newDeck[1], newDeck[0]];
        }
        setDeck(newDeck);
        setIndex(0);
      }
    }, 300);
  }

  const card = deck[index];

  return (
    <div className="flex flex-col items-center gap-6 py-4">
      <div className="flip-card" onClick={() => setFlipped(f => !f)}>
        <div className={`flip-card-inner${flipped ? ' flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ backgroundColor: PRIMARY }}>
            <p className="text-3xl font-bold text-white">{card.term}</p>
            <p className="text-white text-sm mt-auto animate-pulse">Klicka för svar</p>
          </div>
          <div className="flip-card-back bg-white" style={{ border: `3px solid ${PRIMARY}` }}>
            <p className="text-lg text-gray-700">{card.def}</p>
            <p className="text-sm mt-auto" style={{ color: PRIMARY }}>Klicka för att vända</p>
          </div>
        </div>
      </div>

      <button
        onClick={next}
        className="bg-slate-900 text-white px-6 py-2.5 rounded-full font-semibold hover:bg-slate-700 transition-colors"
      >
        Nästa begrepp →
      </button>

      <span
        className="text-sm font-semibold px-4 py-1.5 rounded-full"
        style={{ backgroundColor: LIGHT_BG, color: DARK_TEXT }}
      >
        {index + 1} av {deck.length}
      </span>
    </div>
  );
}

function IckeExempelView() {
  const buildQuestions = () =>
    shuffle(ickeExempelData).map(item => {
      const correctIsA = Math.random() < 0.5;
      return {
        ...item,
        optionA: correctIsA ? item.correct : item.falla,
        optionB: correctIsA ? item.falla : item.correct,
        correctOption: correctIsA ? 'A' : 'B',
      };
    });

  const [questions, setQuestions] = React.useState(buildQuestions);
  const [current, setCurrent] = React.useState(0);
  const [score, setScore] = React.useState(0);
  const [selected, setSelected] = React.useState(null);
  const [done, setDone] = React.useState(false);

  const q = questions[current];

  const handleSelect = (option) => {
    if (selected !== null) return;
    setSelected(option);
    if (option === q.correctOption) setScore(s => s + 1);
  };

  const next = () => {
    if (current + 1 >= questions.length) {
      setDone(true);
    } else {
      setCurrent(c => c + 1);
      setSelected(null);
    }
  };

  const restart = () => {
    setQuestions(buildQuestions());
    setCurrent(0);
    setScore(0);
    setSelected(null);
    setDone(false);
  };

  const grade = (s) => {
    const pct = s / questions.length;
    if (pct === 1) return 'Perfekt! Du kan skilja rätt tillämpning från fällan på alla begrepp!';
    if (pct >= 0.8) return 'Bra jobbat! Du behärskar de flesta begreppen.';
    if (pct >= 0.6) return 'Godkänt — öva lite till på de du missade.';
    return 'Fortsätt öva — varje runda stärker din förståelse!';
  };

  if (done) return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{ borderColor: PRIMARY }}>
        <div className="text-5xl mb-4">🎯</div>
        <p className="text-3xl font-bold mb-2" style={{ color: DARK_TEXT }}>{score} / {questions.length}</p>
        <p className="text-gray-600 mb-6">{grade(score)}</p>
        <button onClick={restart} className="w-full text-white px-8 py-3 rounded-2xl font-bold" style={{ backgroundColor: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  const getOptionStyle = (option) => {
    if (selected === null) return { border: '2px solid #e5e7eb', background: '#fff', color: '#1f2937' };
    if (option === q.correctOption) return { border: '2px solid #16a34a', background: '#f0fdf4', color: '#14532d' };
    if (option === selected) return { border: '2px solid #dc2626', background: '#fef2f2', color: '#7f1d1d' };
    return { border: '2px solid #e5e7eb', background: '#f9fafb', color: '#9ca3af' };
  };

  return (
    <div className="flex flex-col gap-5 max-w-2xl mx-auto">
      <div className="flex items-center justify-between text-sm font-medium text-gray-500">
        <span>Begrepp {current + 1} av {questions.length}</span>
        <span className="px-3 py-1 rounded-full" style={{ backgroundColor: LIGHT_BG, color: DARK_TEXT }}>{score} rätt</span>
      </div>
      <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div className="h-full rounded-full transition-all" style={{ width: `${(current / questions.length) * 100}%`, backgroundColor: PRIMARY }} />
      </div>

      <div className="bg-white rounded-2xl shadow-sm p-6" style={{ borderLeft: `6px solid ${PRIMARY}` }}>
        <p className="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Vilket alternativ stämmer?</p>
        <p className="text-2xl font-bold" style={{ color: DARK_TEXT }}>{q.term}</p>
      </div>

      <div className="flex flex-col gap-3">
        {['A', 'B'].map(opt => (
          <button
            key={opt}
            onClick={() => handleSelect(opt)}
            disabled={selected !== null}
            className="rounded-xl px-5 py-4 text-left font-medium transition-all hover:shadow-sm disabled:cursor-default"
            style={getOptionStyle(opt)}
          >
            <span className="font-bold mr-2">{opt}.</span>
            {opt === 'A' ? q.optionA : q.optionB}
          </button>
        ))}
      </div>

      {selected !== null && (
        <div className="flex flex-col gap-3 items-center">
          <div className={`w-full rounded-xl px-4 py-3 ${selected === q.correctOption ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}`}>
            <p className={`font-semibold mb-1 ${selected === q.correctOption ? 'text-green-700' : 'text-red-700'}`}>
              {selected === q.correctOption ? '✓ Rätt!' : '✗ Fel — rätt alternativ var ' + q.correctOption + '.'}
            </p>
            <p className="text-gray-700 text-sm">{q.explanation}</p>
          </div>
          <button
            onClick={next}
            className="text-white px-8 py-3 rounded-2xl font-bold"
            style={{ backgroundColor: PRIMARY }}
          >
            {current + 1 >= questions.length ? 'Se resultat' : 'Nästa begrepp →'}
          </button>
        </div>
      )}
    </div>
  );
}

function ScenarioView() {
  const allTerms = scenarioData.map(d => d.term);

  const buildQuestions = () =>
    shuffle(scenarioData).map(item => ({
      ...item,
      options: shuffle([item.term, ...shuffle(allTerms.filter(t => t !== item.term)).slice(0, 3)]),
    }));

  const [questions, setQuestions] = React.useState(buildQuestions);
  const [current, setCurrent] = React.useState(0);
  const [score, setScore] = React.useState(0);
  const [selected, setSelected] = React.useState(null);
  const [done, setDone] = React.useState(false);

  const q = questions[current];

  const handleAnswer = (term) => {
    if (selected !== null) return;
    setSelected(term);
    if (term === q.term) setScore(s => s + 1);
  };

  const next = () => {
    if (current + 1 >= questions.length) {
      setDone(true);
    } else {
      setCurrent(c => c + 1);
      setSelected(null);
    }
  };

  const restart = () => {
    setQuestions(buildQuestions());
    setCurrent(0);
    setScore(0);
    setSelected(null);
    setDone(false);
  };

  const grade = (s) => {
    const pct = s / questions.length;
    if (pct === 1) return 'Perfekt! Du känner igen alla begrepp i deras sammanhang!';
    if (pct >= 0.8) return 'Bra jobbat! Du behärskar de flesta scenarier.';
    if (pct >= 0.6) return 'Godkänt — öva lite till på de du missade.';
    return 'Fortsätt öva — varje runda stärker din förståelse!';
  };

  if (done) return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{ borderColor: PRIMARY }}>
        <div className="text-5xl mb-4">🎯</div>
        <p className="text-3xl font-bold mb-2" style={{ color: DARK_TEXT }}>{score} / {questions.length}</p>
        <p className="text-gray-600 mb-6">{grade(score)}</p>
        <button onClick={restart} className="w-full text-white px-8 py-3 rounded-2xl font-bold" style={{ backgroundColor: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  return (
    <div className="flex flex-col gap-5 max-w-2xl mx-auto">
      <div className="flex items-center justify-between text-sm font-medium text-gray-500">
        <span>Scenario {current + 1} av {questions.length}</span>
        <span className="px-3 py-1 rounded-full" style={{ backgroundColor: LIGHT_BG, color: DARK_TEXT }}>{score} rätt</span>
      </div>
      <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div className="h-full rounded-full transition-all" style={{ width: `${(current / questions.length) * 100}%`, backgroundColor: PRIMARY }} />
      </div>

      <div className="bg-white rounded-2xl shadow-sm p-6" style={{ borderLeft: `6px solid ${PRIMARY}` }}>
        <p className="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3">Vilket begrepp beskrivs?</p>
        <p className="text-gray-800 text-lg leading-relaxed">{q.scenario}</p>
      </div>

      <div className="flex flex-col gap-3">
        {q.options.map((opt, i) => {
          let style = { border: '2px solid #e5e7eb', background: '#fff', color: '#1f2937' };
          if (selected !== null) {
            if (opt === q.term) style = { border: '2px solid #16a34a', background: '#f0fdf4', color: '#14532d' };
            else if (opt === selected) style = { border: '2px solid #dc2626', background: '#fef2f2', color: '#7f1d1d' };
            else style = { border: '2px solid #e5e7eb', background: '#f9fafb', color: '#9ca3af' };
          }
          return (
            <button
              key={i}
              onClick={() => handleAnswer(opt)}
              disabled={selected !== null}
              className="rounded-xl px-5 py-3 text-left font-semibold transition-all hover:shadow-sm disabled:cursor-default"
              style={style}
            >
              {opt}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <div className="flex flex-col gap-3 items-center">
          {selected === q.term
            ? <p className="font-semibold text-green-700">✓ Rätt!</p>
            : <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-center w-full">
                <p className="text-red-700 font-semibold">✗ Fel — rätt svar: <span className="underline">{q.term}</span></p>
              </div>
          }
          <button
            onClick={next}
            className="text-white px-8 py-3 rounded-2xl font-bold"
            style={{ backgroundColor: PRIMARY }}
          >
            {current + 1 >= questions.length ? 'Se resultat' : 'Nästa scenario →'}
          </button>
        </div>
      )}
    </div>
  );
}

function LucktextView() {
  const initStates = () => lucktextData.map(() => ({ input: '', status: 'idle' }));
  const [states, setStates] = React.useState(initStates);
  const [finished, setFinished] = React.useState(false);

  const correctCount = states.filter(s => s.status === 'correct').length;

  React.useEffect(() => {
    if (states.length > 0 && states.every(s => s.status === 'correct' || s.status === 'revealed')) {
      setFinished(true);
    }
  }, [states]);

  function updateState(i, patch) {
    setStates(prev => {
      const next = [...prev];
      next[i] = { ...next[i], ...patch };
      return next;
    });
  }

  function handleSubmit(i) {
    const s = states[i];
    if (s.status === 'correct' || s.status === 'revealed') return;
    const answer = s.input.trim();
    const term = lucktextData[i].term;
    if (answer.toLowerCase() === term.toLowerCase()) {
      updateState(i, { status: 'correct' });
    } else if (s.status === 'idle') {
      updateState(i, { status: 'warn' });
    } else {
      updateState(i, { status: 'error' });
    }
  }

  function rattaAlla() {
    setStates(prev => prev.map(s =>
      s.status === 'correct' ? s : { ...s, status: 'revealed' }
    ));
    setFinished(true);
  }

  function borjaOm() {
    setStates(initStates());
    setFinished(false);
  }

  function grade() {
    const pct = correctCount / lucktextData.length;
    if (pct === 1) return 'Perfekt! Du kan alla begreppen!';
    if (pct >= 0.8) return 'Bra jobbat! Öva lite till på de du missade.';
    if (pct >= 0.6) return 'Godkänt — fortsätt öva så sitter det snart!';
    return 'Fortsätt öva — du lär dig mer för varje gång!';
  }

  return (
    <div className="flex flex-col gap-5">
      {/* Begreppsbank */}
      <div className="bg-white rounded-xl shadow-sm p-4">
        <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {lucktextData.map((item, i) => (
            <span
              key={i}
              className="text-sm px-2 py-0.5 rounded-full transition-all"
              style={{
                backgroundColor: states[i].status === 'correct' ? LIGHT_BG : '#f3f4f6',
                color: states[i].status === 'correct' ? DARK_TEXT : '#9ca3af',
                textDecoration: states[i].status === 'correct' ? 'line-through' : 'none',
              }}
            >
              {item.term}
            </span>
          ))}
        </div>
      </div>

      {/* Meningar */}
      {lucktextData.map((item, i) => {
        const st = states[i];
        const parts = item.sentence.split('___');
        const def = begrepp.find(b => b.term === item.term)?.def ?? '';

        let borderColor = '#e5e7eb';
        if (st.status === 'correct') borderColor = '#16a34a';
        else if (st.status === 'revealed') borderColor = '#dc2626';
        else if (st.status === 'warn') borderColor = '#f97316';
        else if (st.status === 'error') borderColor = '#dc2626';

        return (
          <div
            key={i}
            className="bg-white rounded-xl shadow-sm px-5 py-4"
            style={{ border: `2px solid ${borderColor}` }}
          >
            <p className="text-gray-700 leading-relaxed">
              {parts[0]}
              {st.status === 'correct' && (
                <strong style={{ color: '#16a34a' }}>{item.term}</strong>
              )}
              {st.status === 'revealed' && (
                <strong style={{ color: '#dc2626' }}>{item.term}</strong>
              )}
              {st.status !== 'correct' && st.status !== 'revealed' && (
                <input
                  type="text"
                  value={st.input}
                  onChange={e => updateState(i, { input: e.target.value })}
                  onKeyDown={e => e.key === 'Enter' && handleSubmit(i)}
                  className="border-b-2 border-gray-300 focus:border-green-500 outline-none px-1 mx-1 text-gray-800 font-semibold bg-transparent"
                  style={{ width: `${Math.max(item.term.length * 0.65, 8)}em` }}
                  placeholder="..."
                />
              )}
              {parts[1]}
            </p>

            {st.status === 'warn' && (
              <p className="text-sm font-semibold mt-2" style={{ color: '#f97316' }}>
                Är du säker att du stavat rätt?
              </p>
            )}
            {st.status === 'error' && (
              <p className="text-sm font-semibold mt-2 text-red-600">
                Fel svar — fortsätt försöka eller tryck "Rätta alla".
              </p>
            )}
            {st.status === 'correct' && (
              <p className="text-sm text-gray-500 mt-2">✓ {def}</p>
            )}
            {st.status === 'revealed' && (
              <p className="text-sm text-gray-500 mt-2">{def}</p>
            )}
          </div>
        );
      })}

      {!finished && (
        <button
          onClick={rattaAlla}
          className="mx-auto px-6 py-2.5 rounded-full font-semibold text-white bg-slate-900 hover:bg-slate-700 transition-colors"
        >
          Rätta alla
        </button>
      )}

      {finished && (
        <div className="bg-white rounded-xl shadow-sm p-6 text-center">
          <p className="text-4xl font-bold mb-2" style={{ color: DARK_TEXT }}>
            {correctCount} / {lucktextData.length} rätt
          </p>
          <p className="text-gray-600 mb-5">{grade()}</p>
          <button
            onClick={borjaOm}
            className="px-6 py-2.5 rounded-full font-semibold text-white"
            style={{ backgroundColor: PRIMARY }}
          >
            Börja om
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
