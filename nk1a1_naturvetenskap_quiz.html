<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naturvetenskapligt arbetssätt – Quiz | NK 1a1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0891b2;
      --primary-light: #ecfeff;
      --primary-dark: #0e7490;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #16a34a;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'EB Garamond', Georgia, serif; background: #f0f9ff; min-height: 100vh; color: #1e293b; }

    a.back-btn {
      display: inline-block; padding: 8px 16px; color: var(--primary);
      text-decoration: none; font-size: 0.95rem; position: fixed;
      top: 14px; left: 14px; z-index: 200; border-radius: 8px; transition: background 0.2s;
    }
    a.back-btn:hover { background: var(--primary-light); }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Start ── */
    #screen-start { max-width: 560px; margin: 0 auto; padding: 90px 24px 40px; text-align: center; }
    .badge {
      display: inline-block; background: var(--primary-light); color: var(--primary);
      padding: 4px 14px; border-radius: 20px; font-size: 0.82rem;
      letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 20px;
    }
    #screen-start h1 { font-size: 2.4rem; font-weight: 600; font-style: italic; color: #0f172a; margin-bottom: 8px; }
    #screen-start .subtitle { font-size: 1.05rem; color: #64748b; margin-bottom: 32px; }
    .info-cards { display: flex; gap: 12px; justify-content: center; margin-bottom: 36px; flex-wrap: wrap; }
    .info-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 16px 20px; text-align: center; flex: 1; min-width: 100px; max-width: 140px;
    }
    .info-card .num { font-size: 1.7rem; font-weight: 600; color: var(--primary); }
    .info-card .lbl { font-size: 0.78rem; color: #94a3b8; margin-top: 2px; }

    /* ── Quiz ── */
    #screen-quiz { max-width: 700px; margin: 0 auto; padding: 70px 20px 60px; }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .timer {
      background: white; border: 1px solid #e2e8f0; border-radius: 20px;
      padding: 5px 14px; font-size: 0.92rem; color: #475569; font-variant-numeric: tabular-nums;
    }
    .score-pill { background: var(--primary-light); color: var(--primary-dark); border-radius: 20px; padding: 5px 14px; font-size: 0.92rem; font-weight: 600; }
    .progress-wrap { background: #e2e8f0; border-radius: 4px; height: 6px; overflow: hidden; margin-bottom: 6px; }
    .progress-bar { background: var(--primary); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .q-counter { font-size: 0.82rem; color: #94a3b8; text-align: right; margin-bottom: 22px; }
    .q-text { font-size: 1.25rem; font-weight: 600; line-height: 1.55; color: #0f172a; margin-bottom: 22px; }
    .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .opt-btn {
      background: white; border: 2px solid #e2e8f0; border-radius: 12px;
      padding: 13px 18px; text-align: left; font-size: 1rem; font-family: inherit;
      cursor: pointer; transition: border-color 0.15s, background 0.15s; line-height: 1.45;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); font-weight: 600; }
    .opt-btn.wrong   { background: var(--wrong-bg);   border-color: var(--wrong-border);   color: var(--wrong-text); }
    .opt-btn.dimmed  { opacity: 0.4; }
    .nav-row { display: flex; gap: 12px; align-items: center; }
    .btn-back { background: white; border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px 20px; font-family: inherit; font-size: 0.9rem; color: #64748b; cursor: pointer; }
    .btn-back:hover { border-color: #94a3b8; }
    .btn-next { background: var(--primary); border: none; border-radius: 10px; padding: 10px 28px; font-family: inherit; font-size: 0.9rem; font-weight: 600; color: white; cursor: pointer; margin-left: auto; transition: background 0.15s; }
    .btn-next:hover { background: var(--primary-dark); }

    /* ── Modal ── */
    #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
    #modal-overlay.hidden { display: none; }
    .modal-box { background: white; border-radius: 20px; padding: 32px; max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal-icon    { font-size: 2.6rem; margin-bottom: 10px; }
    .modal-verdict { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; }
    .modal-verdict.c { color: var(--correct-text); }
    .modal-verdict.w { color: var(--wrong-text); }
    .modal-expl { font-size: 0.98rem; color: #475569; line-height: 1.7; margin-bottom: 24px; }

    /* ── Result ── */
    #screen-result { max-width: 700px; margin: 0 auto; padding: 80px 20px 80px; }
    .res-header { text-align: center; margin-bottom: 30px; }
    .score-ring { width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 18px; }
    .score-ring .rnum { font-size: 2rem; font-weight: 600; color: var(--primary); line-height: 1; }
    .score-ring .rlbl { font-size: 0.72rem; color: #94a3b8; }
    .res-title  { font-size: 1.8rem; font-weight: 600; font-style: italic; margin-bottom: 6px; }
    .res-msg    { font-size: 1rem; color: #64748b; margin-bottom: 4px; }
    .res-time   { font-size: 0.85rem; color: #94a3b8; margin-bottom: 28px; }
    .stats-row  { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-box   { flex: 1; min-width: 80px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; text-align: center; }
    .stat-box .snum { font-size: 1.6rem; font-weight: 600; }
    .stat-box .slbl { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
    .stat-box.cs .snum { color: var(--correct-text); }
    .stat-box.ws .snum { color: var(--wrong-text); }
    .section-hd { font-size: 1.05rem; font-weight: 600; color: #0f172a; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
    .missed-section { margin-bottom: 32px; }
    .missed-item { background: var(--wrong-bg); border-left: 4px solid var(--wrong-border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.92rem; }
    .facit-item { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .facit-item.fc { border-left: 4px solid var(--correct-border); }
    .facit-item.fw { border-left: 4px solid var(--wrong-border); }
    .fi-num { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .fi-q   { font-size: 0.93rem; font-weight: 600; color: #0f172a; margin-bottom: 8px; line-height: 1.4; }
    .fi-row { font-size: 0.88rem; padding: 2px 0; }
    .fi-row .lbl { color: #94a3b8; }
    .fi-row.ya-ok  { color: var(--correct-text); }
    .fi-row.ya-bad { color: var(--wrong-text); }
    .fi-row.ra     { color: var(--correct-text); font-weight: 600; margin-top: 2px; }

    .btn-primary { display: inline-block; background: var(--primary); color: white; border: none; border-radius: 12px; padding: 13px 36px; font-size: 1.05rem; font-family: inherit; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: none; }

    @media (max-width: 500px) {
      #screen-start h1 { font-size: 1.85rem; }
      .q-text { font-size: 1.1rem; }
    }
    /* ── Textläge: Svenska / 📖 Enkel svenska ── */
    .top-controls {
      position: fixed; top: 14px; right: 14px; z-index: 200;
      display: flex; gap: 8px; align-items: center;
    }
    .lang-switch {
      display: flex; gap: 2px; background: white; border: 2px solid #16a34a;
      border-radius: 999px; padding: 2px;
    }
    .easy-toggle {
      background: transparent; border: none; color: #16a34a;
      padding: 5px 14px; border-radius: 999px; font-family: inherit;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .easy-toggle:hover { background: #dcfce7; }
    .easy-toggle[aria-pressed="true"] { background: #16a34a; color: white; }
    .easy-toggle[aria-pressed="true"]:hover { background: #15803d; }

    @media (max-width: 768px) {
      a.back-btn { top: 10px; left: 8px; padding: 6px 10px; font-size: 0.88rem; }
      .top-controls { top: 10px; right: 8px; }
      .easy-toggle { padding: 5px 10px; font-size: 0.8rem; }
    }
    /* Smal skärm: textläget flyttas till en egen rad under tillbaka-länken */
    @media (max-width: 640px) {
      .top-controls { top: 46px; left: 50%; right: auto; transform: translateX(-50%); }
      .lang-switch { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      #screen-start  { padding-top: 110px; }
      #screen-quiz   { padding-top: 100px; }
      #screen-result { padding-top: 110px; }
    }
    @media (max-width: 380px) {
      .easy-toggle { padding: 5px 8px; font-size: 0.76rem; }
    }
  </style>
</head>
<body>

<a href="nk1a1_naturvetenskap.html" class="back-btn">← Tillbaka till området</a>
<div class="top-controls">
  <div class="lang-switch" role="group" aria-label="Textläge">
    <button class="easy-toggle" type="button" data-mode="sv"   aria-pressed="true"  onclick="setMode('sv')">Svenska</button>
    <button class="easy-toggle" type="button" data-mode="easy" aria-pressed="false" onclick="setMode('easy')" id="btn-easy">📖 Enkel svenska</button>
  </div>
</div>

<!-- ═══════════ START ═══════════ -->
<div id="screen-start" class="screen active">
  <div class="badge">Naturkunskap nivå 1a1 · Naturvetenskapligt arbetssätt</div>
  <h1>Quiz</h1>
  <p class="subtitle">30 frågor om vetenskaplig metod, experiment och källkritik</p>
  <div class="info-cards">
    <div class="info-card"><div class="num">30</div><div class="lbl">Frågor</div></div>
    <div class="info-card"><div class="num">A1–A3</div><div class="lbl">Avsnitt</div></div>
    <div class="info-card"><div class="num">4</div><div class="lbl">Alternativ</div></div>
  </div>
  <button class="btn-primary" onclick="startQuiz()">Starta Quiz →</button>
</div>

<!-- ═══════════ QUIZ ═══════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <div class="timer" id="timer">⏱ 0:00</div>
    <div class="score-pill" id="score-pill">Poäng: 0</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
  <div class="q-counter" id="q-counter">Fråga 1 av 30</div>
  <div class="q-text" id="q-text"></div>
  <div class="opts" id="opts"></div>
  <div class="nav-row">
    <button class="btn-back" id="btn-back" onclick="goBack()" style="display:none">← Bakåt</button>
    <button class="btn-next" id="btn-next" onclick="goNext()" style="display:none">Nästa →</button>
  </div>
</div>

<!-- ═══════════ MODAL ═══════════ -->
<div id="modal-overlay" class="hidden">
  <div class="modal-box">
    <div class="modal-icon"    id="modal-icon"></div>
    <div class="modal-verdict" id="modal-verdict"></div>
    <div class="modal-expl"    id="modal-expl"></div>
    <button class="btn-primary" id="modal-next" onclick="closeModal()">Nästa fråga →</button>
  </div>
</div>

<!-- ═══════════ RESULT ═══════════ -->
<div id="screen-result" class="screen">
  <div class="res-header">
    <div class="score-ring">
      <div class="rnum" id="r-score"></div>
      <div class="rlbl">poäng</div>
    </div>
    <div class="res-title" id="r-title"></div>
    <div class="res-msg"   id="r-msg"></div>
    <div class="res-time"  id="r-time"></div>
  </div>
  <div class="stats-row">
    <div class="stat-box cs"><div class="snum" id="s-correct">0</div><div class="slbl">Rätt</div></div>
    <div class="stat-box ws"><div class="snum" id="s-wrong">0</div><div class="slbl">Fel</div></div>
    <div class="stat-box"><div class="snum" id="s-pct">0%</div><div class="slbl">Andel rätt</div></div>
  </div>
  <div class="missed-section" id="missed-section"></div>
  <div class="section-hd" id="facit-hd">Fullständigt facit</div>
  <div id="facit-list"></div>
  <div style="text-align:center;margin-top:32px">
    <button class="btn-primary" id="btn-restart" onclick="restartQuiz()">↺ Gör om quizet</button>
  </div>
</div>

<script src="nk1a1_naturvetenskap_questions.js"></script>
<script>

// ════════════════════════════════════════════════════════════
// ENKEL SVENSKA — samma ordning som QUESTIONS i
// nk1a1_naturvetenskap_questions.js. optsEnkel[i] motsvarar
// alltid opts[i], så QUESTIONS[n].correct pekar på rätt svar
// i båda versionerna. Begreppen behålls, bara språket runt
// omkring förenklas.
// ════════════════════════════════════════════════════════════
const ENKEL = [
  // A1
  {
    qEnkel: 'Vad var den vetenskapliga revolutionen?',
    optsEnkel: [
      'På 1500-talet slutade man lita blint på kyrkan och gamla böcker. Man testade idéer med experiment.',
      'Galileo Galilei byggde ett teleskop. Då kunde man för första gången titta noga på stjärnorna.',
      'Under antiken började grekiska filosofer med naturvetenskap. Det var den allra första vetenskapen.',
      'På 1800-talet kom fabrikerna. Då byggde man nya laboratorier och hittade nya sätt att forska.'
    ],
    expEnkel: 'Den vetenskapliga revolutionen började på 1500-talet. Förut letade man svar i kyrkans lära och i gamla böcker. Nu började forskare testa sina idéer. De gjorde experiment och tittade noga. Två kända forskare är Copernicus och Galileo Galilei.'
  },
  {
    qEnkel: 'Vad är en frågeställning när man forskar?',
    optsEnkel: [
      'En tydlig fråga. Den visar exakt vad undersökningen ska ta reda på.',
      'Ett påstående. Det säger vad man tror att man kommer att hitta.',
      'En kort text. Den berättar vad man kom fram till efter experimentet.',
      'En idé om hur världen fungerar. Man ska bevisa den med mätningar.'
    ],
    expEnkel: 'En frågeställning är en tydlig fråga. Till exempel: "Vad beror det här på?" En hypotes är något annat. Hypotesen är ett möjligt svar på frågan. Den skrivs som ett påstående.'
  },
  {
    qEnkel: 'Vad är en hypotes?',
    optsEnkel: [
      'Ett påstående som är ett möjligt svar på frågan. Man vet inte än om det stämmer.',
      'Ett säkert svar. Man har fått fram det genom att göra experimentet många gånger.',
      'En tydlig fråga. Den visar exakt vad man ska ta reda på i undersökningen.',
      'Något man har sett under experimentet. Forskaren behöver förklara varför det hände.'
    ],
    expEnkel: 'En hypotes är ett påstående. Den är ett möjligt svar på frågeställningen. Man ska kunna testa den. Man ska också kunna visa att den är fel. När man skriver hypotesen vet man inte om den stämmer.'
  },
  {
    qEnkel: 'En vetenskaplig undersökning har tre krav. Vilka är de?',
    optsEnkel: [
      'Hypotesen ska vara testbar och falsifierbar. Experimentet ska vara repeterbart.',
      'Hypotesen ska bygga på en teori. En etikkommitté ska godkänna den. Resultatet ska vara tydligt.',
      'Hypotesen ska bevisas sann. Två forskare ska skriva den. Den ska publiceras i en tidskrift.',
      'Experimentet ska vara enkelt och billigt. Alla människor ska kunna förstå det.'
    ],
    expEnkel: 'Det finns tre krav. Testbar: man ska kunna undersöka hypotesen med ett experiment. Falsifierbar: man ska kunna visa att hypotesen är fel. Repeterbar: andra ska kunna göra om experimentet och se om de får samma resultat.'
  },
  {
    qEnkel: 'Vad betyder det att en hypotes är falsifierbar?',
    optsEnkel: [
      'Det ska gå att visa att hypotesen är fel. Till exempel om resultatet säger emot den.',
      'Hypotesen är skriven så att inget experiment någonsin kan visa att den är fel.',
      'Hypotesen räknas som fel direkt om man inte kan testa den i ett laboratorium.',
      'Tre olika grupper av forskare måste testa hypotesen innan den blir godkänd.'
    ],
    expEnkel: 'Falsifierbar betyder att det ska gå att visa att hypotesen är fel. Tänk dig en hypotes som inget resultat kan säga emot. Då är den inte vetenskaplig.'
  },
  {
    qEnkel: 'Den hypotetisk-deduktiva metoden har fem steg. Vilken ordning är rätt?',
    optsEnkel: [
      'Frågeställning → Hypotes → Förutsägelse → Undersökning → Slutsats',
      'Hypotes → Frågeställning → Undersökning → Förutsägelse → Slutsats',
      'Observation → Slutsats → Frågeställning → Hypotes → Experiment',
      'Frågeställning → Undersökning → Hypotes → Förutsägelse → Slutsats'
    ],
    expEnkel: 'Stegen kommer i den här ordningen. 1. Frågeställning: vad vill du veta? 2. Hypotes: vad tror du är svaret? 3. Förutsägelse: vad borde hända om du har rätt? 4. Undersökning: du gör experimentet. 5. Slutsats: stämde hypotesen eller inte?'
  },
  {
    qEnkel: 'Vad är en vetenskaplig teori?',
    optsEnkel: [
      'En förklaring som har starkt stöd. Den bygger på resultat från många noggranna experiment.',
      'En smart gissning om hur något fungerar. Ingen har testat den i ett experiment än.',
      'En slutsats från ett enda experiment. Resultatet blev tydligt och gick att göra om.',
      'En tanke om naturens lagar. En känd och viktig person inom ämnet har kommit på den.'
    ],
    expEnkel: 'En teori är mycket mer än en gissning. Den är en förklaring som många experiment stödjer. En teori kan ändå ändras. Det händer om nya bevis visar något annat.'
  },
  {
    qEnkel: 'Vad är ett paradigmskifte?',
    optsEnkel: [
      'En gammal teori byts ut mot en ny. Det händer när bevisen visar att den gamla är fel.',
      'Ett experiment misslyckas. Därför måste man lägga till nya variabler i undersökningen.',
      'En grupp forskare slutar med sitt ämne. De börjar forska om något helt annat.',
      'En ny teknik kommer. Den gör att gamla experiment går snabbare och blir mer exakta.'
    ],
    expEnkel: 'Vid ett paradigmskifte byts en teori ut mot en ny. Förr trodde man att jorden var i mitten av allt. Sedan visade bevisen att jorden och planeterna går runt solen. Att teorier byts ut visar att vetenskapen fungerar.'
  },
  {
    qEnkel: 'Vad räknas som forskningsfusk?',
    optsEnkel: [
      'Att kopiera andras arbete, hitta på resultat eller gömma resultat man inte gillar.',
      'Att använda en metod som inte är testad nog och publicera utan peer review.',
      'Att göra experiment på djur utan att först göra en etikprövning.',
      'Att byta hypotes mitt i experimentet utan att börja om från början.'
    ],
    expEnkel: 'Forskningsfusk är att plagiera (kopiera andras arbete), förfalska (hitta på) eller gömma resultat. Fusk skadar forskningen. Människor slutar också lita på forskare. På Karolinska fanns ett fall med fusk där patienter dog.'
  },
  {
    qEnkel: '"Är klimatförändringar dåliga?" Varför kan naturvetenskapen inte svara på den frågan?',
    optsEnkel: [
      'Det är en fråga om värderingar. Vetenskapen kan mäta, men inte säga vad som är rätt eller fel.',
      'Klimatet är för krångligt. Det går inte att undersöka och mäta med vetenskapliga metoder.',
      'Svaret beror på vad politikerna bestämmer. Därför hör frågan inte till naturvetenskapen.',
      'Vetenskapen har inte samlat in tillräckligt med data än. Därför finns inget säkert svar.'
    ],
    expEnkel: 'Naturvetenskapen kan bara svara på sådant som går att testa. Frågan om något är "bra" eller "dåligt" handlar om värderingar. Den går inte att testa. Naturvetenskapen kan beskriva och mäta klimatförändringarna. Men den kan inte säga om de är rätt eller fel.'
  },
  // A2
  {
    qEnkel: 'Vad är den oberoende variabeln i ett experiment?',
    optsEnkel: [
      'Det som du själv ändrar på i experimentet. Du vill se om det påverkar något annat.',
      'Det som du mäter. Du vill se om det har ändrats av det du gjorde i experimentet.',
      'Det som är likadant i alla grupper. Då kan inget annat störa experimentet.',
      'Det som du inte kan styra över. Det kan störa resultatet i experimentet.'
    ],
    expEnkel: 'Den oberoende variabeln är det du själv ändrar på. Exempel: du ger lökplantor olika mycket ljus. Ljuset är den oberoende variabeln. Du tror att ljuset påverkar den beroende variabeln.'
  },
  {
    qEnkel: 'Vad är en beroende variabel?',
    optsEnkel: [
      'Det som du mäter. Du tror att det påverkas av det du ändrar i experimentet.',
      'Något som inte kan ändras. Det är likadant under hela experimentet.',
      'Något som påverkar experimentet utan att forskaren märker det alls.',

// Original + enkel text i samma frågeobjekt (samma struktur som mr_quiz.html)
const QS = QUESTIONS.map((q, i) => Object.assign({}, q, ENKEL[i]));

const UI_ENKEL = {

  restartBtn:       '↺ Gör om'
};
const UI_ORIG = {
  missedHd:         'Missade frågor',
  facitHd:          'Fullständigt facit',
  yourAnswerLbl:    'Ditt svar: ',
  correctAnswerLbl: 'Rätt svar: ',
  notAnswered:      '— (inte besvarad)',

// ── State ──────────────────────────────────────────────────
// Blandning sker på INDEX: order[] = visad plats → index i q.opts/q.optsEnkel.
// chosen/correct är index i q.opts, så rättningen är oberoende av textläge.
let shuffled = [];
let states   = []; // { order:number[], chosen:number|null, correct:number, answered:bool }
let cur      = 0;
let score    = 0;
let timerInterval = null;
let startTime = 0;
let elapsedMs = 0;
let modalOpen = false;

// ── Textläge ──
// mode: 'sv' (original) eller 'easy' (Enkel svenska). Sparas i sessionStorage.
const MODES    = ['sv', 'easy'];
const LANG_KEY = 'nk1a1_nvq_sprak';
const OLD_EASY_KEY = 'nk1a1_nvq_easy'; // äldre nyckel för Enkel svenska
let mode = 'sv';
try {
  const saved = sessionStorage.getItem(LANG_KEY);
  if (MODES.includes(saved)) mode = saved;
  else if (sessionStorage.getItem(OLD_EASY_KEY) === '1') mode = 'easy';
} catch (e) {}

const ui = key => (mode === 'easy' ? UI_ENKEL : UI_ORIG)[key];
const $ = id => document.getElementById(id);

const warned = new Set();
function warnMissing(q, field) {
  const key = QS.indexOf(q) + ':' + field;
  if (warned.has(key)) return;
  warned.add(key);
  console.warn('Enkel svenska saknas (' + field + ') för fråga: ' + q.q + ' – visar originalet.');
}

// Svensk text enligt textläge (Enkel svenska faller tillbaka på originalet).
function qText(q) {
  if (mode !== 'easy') return q.q;
  if (q.qEnkel) return q.qEnkel;
  warnMissing(q, 'qEnkel'); return q.q;
}
function optText(q, i) {
  if (mode !== 'easy') return q.opts[i];
  if (q.optsEnkel && q.optsEnkel.length === q.opts.length && q.optsEnkel[i]) return q.optsEnkel[i];
  warnMissing(q, 'optsEnkel'); return q.opts[i];
}
function explText(q) {
  if (mode !== 'easy') return q.expl;
  if (q.expEnkel) return q.expEnkel;
  warnMissing(q, 'expEnkel'); return q.expl;
}

function updateControls() {
  document.querySelectorAll('.lang-switch [data-mode]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false'));
}
updateControls();

// Ritar om aktiv skärm utan att röra poäng, timer, aktuell fråga, svar eller blandning.
// Scrollen hålls kvar: elementet överst i bild ska stå på samma plats efteråt.
const ANCHORS = '.q-text, .opt-btn, .nav-row, .res-header, .stats-row, .section-hd, .missed-item, .facit-item';
function rerender() {
  const screen = document.querySelector('.screen.active');
  const before = screen ? [...screen.querySelectorAll(ANCHORS)] : [];
  const idx = before.findIndex(el => el.getBoundingClientRect().bottom > 0);
  const top = idx >= 0 ? before[idx].getBoundingClientRect().top : 0;

  if ($('screen-quiz').classList.contains('active')) {
    renderQuestion();
    if (modalOpen) renderModal();
  }
  if ($('screen-result').classList.contains('active')) renderResult();

  if (idx >= 0) {
    const after = screen.querySelectorAll(ANCHORS)[idx];
    if (after) window.scrollBy(0, after.getBoundingClientRect().top - top);
  }
}

function setMode(m) {
  if (!MODES.includes(m) || m === mode) return;
  mode = m;
  try { sessionStorage.setItem(LANG_KEY, mode); } catch (e) {}
  updateControls();
  rerender();
}

// ════════════════════════════════════════════════════════════
// FISHER-YATES SHUFFLE
// ════════════════════════════════════════════════════════════
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

// ════════════════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════════════════
function startQuiz() {
  shuffled = shuffleArray([...QS]);
  states   = shuffled.map(q => ({
    order:    shuffleArray(q.opts.map((_, i) => i)),
    chosen:   null,
    correct:  q.correct,
    answered: false
  }));
  cur   = 0;
  score = 0;
  modalOpen = false;
  clearInterval(timerInterval);
  startTime = Date.now();
  $('timer').textContent = '⏱ 0:00';
  timerInterval = setInterval(() => {
    $('timer').textContent = '⏱ ' + fmtTime(Date.now() - startTime);
  }, 500);
  show('screen-quiz');
  renderQuestion();
}

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
function renderQuestion() {
  const q  = shuffled[cur];
  const st = states[cur];
  const n  = shuffled.length;

  $('q-counter').textContent = 'Fråga ' + (cur + 1) + ' av ' + n;
  $('q-text').textContent = qText(q);
  $('progress-bar').style.width = ((cur / n) * 100) + '%';
  $('score-pill').textContent = 'Poäng: ' + score;

  const container = $('opts');
  container.innerHTML = '';
  st.order.forEach(origIdx => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = optText(q, origIdx);
    if (st.answered) {
      btn.disabled = true;
      if (origIdx === st.correct)     btn.classList.add('correct');
      else if (origIdx === st.chosen) btn.classList.add('wrong');
      else                            btn.classList.add('dimmed');
    } else {
      btn.onclick = () => answerQuestion(origIdx);
    }
    container.appendChild(btn);
  });

  const back = $('btn-back');
  const next = $('btn-next');
  back.textContent = ui('backBtn');
  next.textContent = cur === n - 1 ? ui('resultBtn') : ui('nextBtn');
  back.style.display = cur > 0 ? 'inline-block' : 'none';
  next.style.display = st.answered ? 'inline-block' : 'none';
}

// ════════════════════════════════════════════════════════════
// ANSWER
// ════════════════════════════════════════════════════════════
function answerQuestion(chosenIdx) {
  const st = states[cur];
  if (st.answered) return;

  const isCorrect = chosenIdx === st.correct;
  st.chosen   = chosenIdx;
  st.answered = true;
  if (isCorrect) score++;

  renderQuestion();

  // Hoppa över modalen om eleven redan gått vidare — annars stegar
  // modalens "Nästa fråga →" fram en gång till och en fråga hoppas över.
  const answeredAt = cur;
  setTimeout(() => {
    if (cur !== answeredAt || !$('screen-quiz').classList.contains('active')) return;
    modalOpen = true;
    renderModal();
    $('modal-overlay').classList.remove('hidden');
  }, 600);
}

// ════════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════════
function renderModal() {
  const st = states[cur];
  const isCorrect = st.chosen === st.correct;
  const verdict = $('modal-verdict');
  $('modal-icon').textContent = isCorrect ? '✅' : '❌';
  verdict.textContent = isCorrect ? 'Rätt svar!' : 'Fel svar';
  verdict.className = 'modal-verdict ' + (isCorrect ? 'c' : 'w');
  $('modal-expl').textContent = explText(shuffled[cur]);
  $('modal-next').textContent = ui('modalNextBtn');
}
function closeModal() {
  $('modal-overlay').classList.add('hidden');
  modalOpen = false;
  goNext();
}

// ════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════
function goBack() { if (cur > 0) { cur--; renderQuestion(); } }
function goNext() {
  $('modal-overlay').classList.add('hidden');
  modalOpen = false;
  if (cur < shuffled.length - 1) { cur++; renderQuestion(); }
  else endQuiz();
}

// ════════════════════════════════════════════════════════════
// RESULTS
// ════════════════════════════════════════════════════════════
function endQuiz() {
  clearInterval(timerInterval);
  elapsedMs = Date.now() - startTime;
  show('screen-result');
  renderResult();
}

function renderResult() {
  const n     = shuffled.length;
  const pct   = Math.round(score / n * 100);

  $('r-score').textContent   = score + '/' + n;
  $('s-correct').textContent = score;
  $('s-wrong').textContent   = n - score;
  $('s-pct').textContent     = pct + '%';
  $('r-time').textContent    = 'Tid: ' + fmtTime(elapsedMs);

  let title, msg;
  if (pct >= 90)      { title = '🏆 Utmärkt!';          msg = 'Du behärskar naturvetenskapligt arbetssätt på hög nivå.'; }
  else if (pct >= 75) { title = '✅ Redo för provet!';   msg = 'Bra resultat – du har koll på det centrala.'; }
  else if (pct >= 55) { title = '📖 Öva lite till';      msg = 'Du är på rätt spår men behöver repetera en del.'; }
  else                { title = '💡 Fortsätt repetera'; msg = 'Gå igenom pluggmaterialet och försök igen.'; }
  $('r-title').textContent = title;
  $('r-msg').textContent   = msg;

  // Missade frågor
  const missedEl = $('missed-section');
  missedEl.innerHTML = '';
  const missedIdx = states.map((st, i) => i).filter(i => states[i].answered && states[i].chosen !== states[i].correct);
  if (missedIdx.length) {
    const hd = document.createElement('div');
    hd.className = 'section-hd';
    hd.textContent = ui('missedHd') + ' (' + missedIdx.length + ')';
    missedEl.appendChild(hd);
    missedIdx.forEach(idx => {
      const item = document.createElement('div');
      item.className = 'missed-item';
      item.textContent = (idx + 1) + '. ' + qText(shuffled[idx]);
      missedEl.appendChild(item);
    });
  }

  // Fullständigt facit
  $('facit-hd').textContent    = ui('facitHd');
  $('btn-restart').textContent = ui('restartBtn');
  const facitEl = $('facit-list');
  facitEl.innerHTML = '';
  states.forEach((st, i) => {
    const q    = shuffled[i];
    const ok   = st.answered && st.chosen === st.correct;
    const item = document.createElement('div');
    item.className = 'facit-item ' + (!st.answered ? '' : ok ? 'fc' : 'fw');

    const num = document.createElement('div');
    num.className = 'fi-num';
    num.textContent = 'Fråga ' + (i + 1);

    const qEl = document.createElement('div');
    qEl.className = 'fi-q';
    qEl.textContent = qText(q);

    const ya = document.createElement('div');
    ya.className = 'fi-row' + (!st.answered ? '' : ok ? ' ya-ok' : ' ya-bad');
    if (st.answered) ya.appendChild(document.createTextNode(ok ? '✓ ' : '✗ '));
    const yaLbl = document.createElement('span');
    yaLbl.className = 'lbl';
    yaLbl.textContent = ui('yourAnswerLbl');
    ya.appendChild(yaLbl);
    ya.appendChild(document.createTextNode(st.answered ? optText(q, st.chosen) : ui('notAnswered')));

    item.appendChild(num);
    item.appendChild(qEl);
    item.appendChild(ya);

    if (!ok) {
      const ra = document.createElement('div');
      ra.className = 'fi-row ra';
      const raLbl = document.createElement('span');
      raLbl.className = 'lbl';
      raLbl.textContent = ui('correctAnswerLbl');
      ra.appendChild(raLbl);
      ra.appendChild(document.createTextNode(optText(q, st.correct)));
      item.appendChild(ra);
    }

    facitEl.appendChild(item);
  });
}

function restartQuiz() {
  clearInterval(timerInterval);
  show('screen-start');
}
