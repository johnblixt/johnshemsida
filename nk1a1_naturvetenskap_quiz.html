<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naturvetenskapligt arbetssätt – Quiz | NK 1a1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0891b2;
      --primary-light: #ecfeff;
      --primary-dark: #0e7490;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #16a34a;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'EB Garamond', Georgia, serif; background: #f0f9ff; min-height: 100vh; color: #1e293b; }

    a.back-btn {
      display: inline-block; padding: 8px 16px; color: var(--primary);
      text-decoration: none; font-size: 0.95rem; position: fixed;
      top: 14px; left: 14px; z-index: 200; border-radius: 8px; transition: background 0.2s;
    }
    a.back-btn:hover { background: var(--primary-light); }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Start ── */
    #screen-start { max-width: 560px; margin: 0 auto; padding: 90px 24px 40px; text-align: center; }
    .badge {
      display: inline-block; background: var(--primary-light); color: var(--primary);
      padding: 4px 14px; border-radius: 20px; font-size: 0.82rem;
      letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 20px;
    }
    #screen-start h1 { font-size: 2.4rem; font-weight: 600; font-style: italic; color: #0f172a; margin-bottom: 8px; }
    #screen-start .subtitle { font-size: 1.05rem; color: #64748b; margin-bottom: 32px; }
    .info-cards { display: flex; gap: 12px; justify-content: center; margin-bottom: 36px; flex-wrap: wrap; }
    .info-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 16px 20px; text-align: center; flex: 1; min-width: 100px; max-width: 140px;
    }
    .info-card .num { font-size: 1.7rem; font-weight: 600; color: var(--primary); }
    .info-card .lbl { font-size: 0.78rem; color: #94a3b8; margin-top: 2px; }

    /* ── Quiz ── */
    #screen-quiz { max-width: 700px; margin: 0 auto; padding: 70px 20px 60px; }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .timer {
      background: white; border: 1px solid #e2e8f0; border-radius: 20px;
      padding: 5px 14px; font-size: 0.92rem; color: #475569; font-variant-numeric: tabular-nums;
    }
    .score-pill { background: var(--primary-light); color: var(--primary-dark); border-radius: 20px; padding: 5px 14px; font-size: 0.92rem; font-weight: 600; }
    .progress-wrap { background: #e2e8f0; border-radius: 4px; height: 6px; overflow: hidden; margin-bottom: 6px; }
    .progress-bar { background: var(--primary); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .q-counter { font-size: 0.82rem; color: #94a3b8; text-align: right; margin-bottom: 22px; }
    .q-text { font-size: 1.25rem; font-weight: 600; line-height: 1.55; color: #0f172a; margin-bottom: 22px; }
    .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .opt-btn {
      background: white; border: 2px solid #e2e8f0; border-radius: 12px;
      padding: 13px 18px; text-align: left; font-size: 1rem; font-family: inherit;
      cursor: pointer; transition: border-color 0.15s, background 0.15s; line-height: 1.45;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); font-weight: 600; }
    .opt-btn.wrong   { background: var(--wrong-bg);   border-color: var(--wrong-border);   color: var(--wrong-text); }
    .opt-btn.dimmed  { opacity: 0.4; }
    .nav-row { display: flex; gap: 12px; align-items: center; }
    .btn-back { background: white; border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px 20px; font-family: inherit; font-size: 0.9rem; color: #64748b; cursor: pointer; }
    .btn-back:hover { border-color: #94a3b8; }
    .btn-next { background: var(--primary); border: none; border-radius: 10px; padding: 10px 28px; font-family: inherit; font-size: 0.9rem; font-weight: 600; color: white; cursor: pointer; margin-left: auto; transition: background 0.15s; }
    .btn-next:hover { background: var(--primary-dark); }

    /* ── Modal ── */
    #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
    #modal-overlay.hidden { display: none; }
    .modal-box { background: white; border-radius: 20px; padding: 32px; max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal-icon    { font-size: 2.6rem; margin-bottom: 10px; }
    .modal-verdict { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; }
    .modal-verdict.c { color: var(--correct-text); }
    .modal-verdict.w { color: var(--wrong-text); }
    .modal-expl { font-size: 0.98rem; color: #475569; line-height: 1.7; margin-bottom: 24px; }

    /* ── Result ── */
    #screen-result { max-width: 700px; margin: 0 auto; padding: 80px 20px 80px; }
    .res-header { text-align: center; margin-bottom: 30px; }
    .score-ring { width: 120px; height: 120px; border-radius: 50%; border: 5px solid var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 18px; }
    .score-ring .rnum { font-size: 2rem; font-weight: 600; color: var(--primary); line-height: 1; }
    .score-ring .rlbl { font-size: 0.72rem; color: #94a3b8; }
    .res-title  { font-size: 1.8rem; font-weight: 600; font-style: italic; margin-bottom: 6px; }
    .res-msg    { font-size: 1rem; color: #64748b; margin-bottom: 4px; }
    .res-time   { font-size: 0.85rem; color: #94a3b8; margin-bottom: 28px; }
    .stats-row  { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-box   { flex: 1; min-width: 80px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; text-align: center; }
    .stat-box .snum { font-size: 1.6rem; font-weight: 600; }
    .stat-box .slbl { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
    .stat-box.cs .snum { color: var(--correct-text); }
    .stat-box.ws .snum { color: var(--wrong-text); }
    .section-hd { font-size: 1.05rem; font-weight: 600; color: #0f172a; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
    .missed-section { margin-bottom: 32px; }
    .missed-item { background: var(--wrong-bg); border-left: 4px solid var(--wrong-border); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.92rem; }
    .facit-item { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .facit-item.fc { border-left: 4px solid var(--correct-border); }
    .facit-item.fw { border-left: 4px solid var(--wrong-border); }
    .fi-num { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .fi-q   { font-size: 0.93rem; font-weight: 600; color: #0f172a; margin-bottom: 8px; line-height: 1.4; }
    .fi-row { font-size: 0.88rem; padding: 2px 0; }
    .fi-row .lbl { color: #94a3b8; }
    .fi-row.ya-ok  { color: var(--correct-text); }
    .fi-row.ya-bad { color: var(--wrong-text); }
    .fi-row.ra     { color: var(--correct-text); font-weight: 600; margin-top: 2px; }

    .btn-primary { display: inline-block; background: var(--primary); color: white; border: none; border-radius: 12px; padding: 13px 36px; font-size: 1.05rem; font-family: inherit; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: none; }

    @media (max-width: 500px) {
      #screen-start h1 { font-size: 1.85rem; }
      .q-text { font-size: 1.1rem; }
    }
    /* ── Enkel svenska ── */
    .easy-pill {
      position: fixed; top: 14px; right: 14px; z-index: 200;
      background: #16a34a; color: white; border: none; border-radius: 20px;
      padding: 8px 16px; font-size: 0.88rem; font-family: 'EB Garamond', Georgia, serif;
      cursor: pointer; transition: background 0.2s;
    }
    .easy-pill[aria-pressed="true"] { background: #15803d; outline: 2px solid #86efac; outline-offset: 2px; }
    .easy-pill:hover { background: #15803d; }
    .easy-line { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(0,0,0,0.08); font-size: 0.85em; color: #64748b; line-height: 1.5; }
    .easy-badge { display: inline-block; font-size: 10px; background: rgba(0,0,0,0.06); border-radius: 4px; padding: 1px 5px; margin-right: 4px; }
  </style>
</head>
<body>

<a href="nk1a1_naturvetenskap.html" class="back-btn">← Tillbaka till området</a>
<button id="easy-btn" class="easy-pill" onclick="toggleEasyMode()" aria-pressed="false">📖 Enkel svenska</button>

<!-- ═══════════ START ═══════════ -->
<div id="screen-start" class="screen active">
  <div class="badge">Naturkunskap nivå 1a1 · Naturvetenskapligt arbetssätt</div>
  <h1>Quiz</h1>
  <p class="subtitle">30 frågor om vetenskaplig metod, experiment och källkritik</p>
  <div class="info-cards">
    <div class="info-card"><div class="num">30</div><div class="lbl">Frågor</div></div>
    <div class="info-card"><div class="num">A1–A3</div><div class="lbl">Avsnitt</div></div>
    <div class="info-card"><div class="num">4</div><div class="lbl">Alternativ</div></div>
  </div>
  <button class="btn-primary" onclick="startQuiz()">Starta Quiz →</button>
</div>

<!-- ═══════════ QUIZ ═══════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <div class="timer" id="timer">⏱ 0:00</div>
    <div class="score-pill" id="score-pill">Poäng: 0</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
  <div class="q-counter" id="q-counter">Fråga 1 av 30</div>
  <div class="q-text" id="q-text"></div>
  <div class="opts" id="opts"></div>
  <div class="nav-row">
    <button class="btn-back" id="btn-back" onclick="goBack()" style="display:none">← Bakåt</button>
    <button class="btn-next" id="btn-next" onclick="goNext()" style="display:none">Nästa →</button>
  </div>
</div>

<!-- ═══════════ MODAL ═══════════ -->
<div id="modal-overlay" class="hidden">
  <div class="modal-box">
    <div class="modal-icon"    id="modal-icon"></div>
    <div class="modal-verdict" id="modal-verdict"></div>
    <div class="modal-expl"    id="modal-expl"></div>
    <button class="btn-primary" onclick="closeModal()">Nästa fråga →</button>
  </div>
</div>

<!-- ═══════════ RESULT ═══════════ -->
<div id="screen-result" class="screen">
  <div class="res-header">
    <div class="score-ring">
      <div class="rnum" id="r-score"></div>
      <div class="rlbl">poäng</div>
    </div>
    <div class="res-title" id="r-title"></div>
    <div class="res-msg"   id="r-msg"></div>
    <div class="res-time"  id="r-time"></div>
  </div>
  <div class="stats-row">
    <div class="stat-box cs"><div class="snum" id="s-correct">0</div><div class="slbl">Rätt</div></div>
    <div class="stat-box ws"><div class="snum" id="s-wrong">0</div><div class="slbl">Fel</div></div>
    <div class="stat-box"><div class="snum" id="s-pct">0%</div><div class="slbl">Andel rätt</div></div>
  </div>
  <div class="missed-section" id="missed-section"></div>
  <div class="section-hd">Fullständigt facit</div>
  <div id="facit-list"></div>
  <div style="text-align:center;margin-top:32px">
    <button class="btn-primary" onclick="restartQuiz()">↺ Gör om quizet</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
// ENKEL SVENSKA — platshållare, samma ordning som QUESTIONS
// a = rätt svar, i[] = fel svar i opts-ordning (exkl. correct)
// ════════════════════════════════════════════════════════════
const EASY_Q = [
  // A1
  {
    q: '[ENKEL: Vad menas med den vetenskapliga revolutionen?]',
    a: '[ENKEL: Det skifte på 1500-talet då man slutade förlita sig på auktoriteter och istället började testa teorier med experiment och observationer]',
    i: [
      '[ENKEL: Den period då Galileo Galilei uppfann teleskopet och möjliggjorde systematiska astronomiska observationer]',
      '[ENKEL: Det vetenskapliga genombrott som skedde under antiken då grekiska filosofer grundade naturvetenskapen]',
      '[ENKEL: Den omvandling under 1800-talet då industrialiseringen ledde till nya vetenskapliga metoder och laboratorier]'
    ],
    expl: '[ENKEL: Den vetenskapliga revolutionen inleddes i slutet av 1500-talet. Istället för att söka svar i kyrkans lära eller antika skrifter började man använda systematiska undersökningar och experiment – t.ex. Copernicus och Galileo Galilei.]'
  },
  {
    q: '[ENKEL: Vad är en frågeställning i en vetenskaplig undersökning?]',
    a: '[ENKEL: En specifik och avgränsad fråga som preciserar syftet med undersökningen]',
    i: [
      '[ENKEL: En hypotes formulerad som ett påstående om vad man förväntar sig hitta]',
      '[ENKEL: En sammanfattning av de resultat som uppnåtts efter att experimentet genomförts]',
      '[ENKEL: En teori om hur världen fungerar som ska bevisas stämma med hjälp av data]'
    ],
    expl: '[ENKEL: En frågeställning är en specifik och avgränsad fråga – t.ex. "Vad beror det här på?" Det skiljer sig från hypotesen, som är ett möjligt svar formulerat som ett påstående.]'
  },
  {
    q: '[ENKEL: Vad är en hypotes?]',
    a: '[ENKEL: Ett testbart påstående som ger ett möjligt svar på frågeställningen – vi vet inte om det är sant eller falskt]',
    i: [
      '[ENKEL: En bekräftad slutsats som dragits efter att ett experiment upprepats ett stort antal gånger]',
      '[ENKEL: En fråga om vad som ska undersökas, formulerad på ett specifikt och avgränsat sätt]',
      '[ENKEL: En observation som gjorts under ett experiment och som behöver förklaras av forskaren]'
    ],
    expl: '[ENKEL: En hypotes är ett påstående – ett möjligt svar på frågeställningen. Den ska vara testbar och falsifierbar. När den formuleras vet vi ännu inte om den är sann.]'
  },
  {
    q: '[ENKEL: Vilka tre krav måste en vetenskaplig undersökning uppfylla?]',
    a: '[ENKEL: Hypotesen ska vara testbar och falsifierbar, och experimentet ska vara repeterbart]',
    i: [
      '[ENKEL: Hypotesen ska baseras på befintlig teori, godkännas av en etikkommitté och ge signifikanta resultat]',
      '[ENKEL: Hypotesen ska bevisas sann, formuleras av minst två oberoende forskare och publiceras i en tidskrift]',
      '[ENKEL: Experimentet ska vara enkelt, billigt att genomföra och förståeligt för en bred allmänhet]'
    ],
    expl: '[ENKEL: En vetenskaplig undersökning kräver att hypotesen är testbar (kan undersökas experimentellt), falsifierbar (kan motbevisas) och att experimentet är repeterbart (kan upprepas och kontrolleras av andra).]'
  },
  {
    q: '[ENKEL: Vad menas med att en hypotes är falsifierbar?]',
    a: '[ENKEL: Att det måste vara möjligt att motbevisa hypotesen – t.ex. om experimentets resultat strider mot den]',
    i: [
      '[ENKEL: Att hypotesen är formulerad på ett sådant sätt att den aldrig kan motbevisas av experiment]',
      '[ENKEL: Att hypotesen automatiskt förklaras som falsk om den inte kan testas i ett laboratorium]',
      '[ENKEL: Att hypotesen måste testas av minst tre oberoende forskargrupper för att godkännas]'
    ],
    expl: '[ENKEL: Falsifierbarhet innebär att det måste vara möjligt att visa att hypotesen är fel. Om inga tänkbara resultat kunde motbevisa den är den inte vetenskaplig.]'
  },
  {
    q: '[ENKEL: Vilka är stegen i den hypotetisk-deduktiva metoden i rätt ordning?]',
    a: '[ENKEL: Frågeställning → Hypotes → Förutsägelse → Undersökning → Slutsats]',
    i: [
      '[ENKEL: Hypotes → Frågeställning → Undersökning → Förutsägelse → Slutsats]',
      '[ENKEL: Observation → Slutsats → Frågeställning → Hypotes → Experiment]',
      '[ENKEL: Frågeställning → Undersökning → Hypotes → Förutsägelse → Slutsats]'
    ],
    expl: '[ENKEL: Den hypotetisk-deduktiva metoden: 1) Frågeställning, 2) Hypotes, 3) Förutsägelse (vad förväntar vi oss?), 4) Undersökning (experiment), 5) Slutsats (stöds eller falsifieras hypotesen?).]'
  },
  {
    q: '[ENKEL: Vad är en vetenskaplig teori?]',
    a: '[ENKEL: En väl underbyggd förklaringsmodell baserad på data från många noggranna och systematiska experiment]',
    i: [
      '[ENKEL: En kvalificerad gissning om hur något fungerar som ännu inte testats i ett experiment]',
      '[ENKEL: En slutsats som dragits utifrån ett enskilt experiment med entydiga och reproducerbara resultat]',
      '[ENKEL: En filosofisk tanke om naturens lagar som presenteras av en erkänd auktoritet inom området]'
    ],
    expl: '[ENKEL: En vetenskaplig teori är långt mer än en gissning – det är en väl underbyggd förklaringsmodell som stöds av data från många experiment. Teorier är öppna för revidering om nya bevis dyker upp.]'
  },
  {
    q: '[ENKEL: Vad innebär ett paradigmskifte?]',
    a: '[ENKEL: Att en etablerad vetenskaplig teori ersätts av en ny när tillräckliga bevis visar att den gamla är felaktig]',
    i: [
      '[ENKEL: Att ett experiment misslyckas och att nya variabler måste introduceras i undersökningen]',
      '[ENKEL: Att en forskargrupp byter inriktning och börjar forska inom ett helt nytt ämnesområde]',
      '[ENKEL: Att en ny teknisk metod gör att gamla experiment kan genomföras snabbare och mer precist]'
    ],
    expl: '[ENKEL: Ett paradigmskifte är när en teori ersätts av en annan. Exempel: den geocentriska världsbilden (jorden i centrum) ersattes av den heliocentriska (planeterna kretsar runt solen). Att teorier byts ut är ett tecken på att vetenskapen fungerar.]'
  },
  {
    q: '[ENKEL: Vad räknas som forskningsfusk?]',
    a: '[ENKEL: Att plagiera, förfalska eller undanhålla resultat från sin forskning]',
    i: [
      '[ENKEL: Att använda en otillräckligt testad metod och publicera resultaten utan peer review]',
      '[ENKEL: Att utföra experiment på ryggradsdjur utan att genomföra en etikprövning i förväg]',
      '[ENKEL: Att byta hypotes mitt i ett experiment utan att börja om hela undersökningen från grunden]'
    ],
    expl: '[ENKEL: Forskningsfusk innebär att plagiera, förfalska data eller undanhålla resultat. Det skadar både forskning och förtroende. Kända fall har lett till allvarliga konsekvenser – t.ex. ett fall på Karolinska där patienter dog.]'
  },
  {
    q: '[ENKEL: Varför kan naturvetenskapen inte svara på frågan "Är klimatförändringar dåliga?"]',
    a: '[ENKEL: Det är en värderingsfråga – naturvetenskapen kan beskriva och mäta fenomenet men inte avgöra om det är rätt eller fel]',
    i: [
      '[ENKEL: Klimatförändringar är ett för komplext fenomen för att kunna undersökas med vetenskapliga metoder]',
      '[ENKEL: Frågans svar är beroende av politiska beslut och faller därmed utanför naturvetenskapens område]',
      '[ENKEL: Naturvetenskapen saknar ännu tillräckliga data för att ge ett tillförlitligt svar på frågan]'
    ],
    expl: '[ENKEL: Naturvetenskapen är begränsad till det som kan testas. Frågor om vad som är "bra" eller "dåligt" är värderingsfrågor – de faller utanför ämnets räckvidd. Naturvetenskapen kan beskriva klimatförändringarna men inte avgöra om de är moraliskt acceptabla.]'
  },
  // A2
  {
    q: '[ENKEL: Vad menas med den oberoende variabeln i ett experiment?]',
    a: '[ENKEL: Den variabel som den som utför experimentet medvetet ändrar för att undersöka dess effekt på något annat]',
    i: [
      '[ENKEL: Den variabel som mäts och registreras för att se om den påverkats av förändringen i experimentet]',
      '[ENKEL: Den variabel som hålls konstant i alla försöksgrupper för att eliminera störningar från omgivningen]',
      '[ENKEL: Den variabel som är omöjlig att kontrollera och som riskerar att påverka experimentets resultat]'
    ],
    expl: '[ENKEL: Den oberoende variabeln är det som forskaren aktivt ändrar – t.ex. belysningsstyrkan i ett lökexperiment. Den antas orsaka en förändring i den beroende variabeln.]'
  },
  {
    q: '[ENKEL: Vad är en beroende variabel?]',
    a: '[ENKEL: Det som mäts i experimentet och som antas påverkas av förändringen i den oberoende variabeln]',
    i: [
      '[ENKEL: En variabel som inte kan ändras och som alltid hålls konstant under hela experimentet]',
      '[ENKEL: En variabel som påverkar experimentet utan att den som forskar är medveten om det]',
      '[ENKEL: Det som aktivt förändras av forskaren för att undersöka dess effekt på ett annat fenomen]'
    ],
    expl: '[ENKEL: Den beroende variabeln är det man mäter – t.ex. tillväxten (biomassa) hos lökplantor. Den "beror" på den oberoende variabeln (belysningsstyrkan).]'
  },

// Enkel-läge — persists i session, inte localStorage
let easyMode = sessionStorage.getItem('nk1a1_nvq_easy') === '1';

// ────────────────────────────────────────────────────────────
// mapOpt(variant, qState, optStr)
// Returnerar det alternativ i variant som motsvarar optStr
// i originalet. qState måste ha .opts, .correct och .origIdx.
// ────────────────────────────────────────────────────────────
function mapOpt(variant, qState, optStr) {
  if (variant !== 'sv_enkel') return null;
  const eq = EASY_Q[qState.origIdx];
  if (!eq) return null;
  if (optStr === qState.opts[qState.correct]) return eq.a;
  const incorrects = qState.opts.filter((_, i) => i !== qState.correct);
  const iIdx = incorrects.indexOf(optStr);
  return iIdx >= 0 ? eq.i[iIdx] : null;
}

function toggleEasyMode() {
  easyMode = !easyMode;
  sessionStorage.setItem('nk1a1_nvq_easy', easyMode ? '1' : '0');
  document.getElementById('easy-btn').setAttribute('aria-pressed', String(easyMode));
  const quizActive = document.getElementById('screen-quiz').classList.contains('active');
  const resActive  = document.getElementById('screen-result').classList.contains('active');
  if (quizActive) render();
  else if (resActive) showResults();
}

// Skapar en .easy-line-div och lägger den i parentEl
function addEasyLine(parentEl, text) {
  const line  = document.createElement('div');
  line.className = 'easy-line';
  const badge = document.createElement('span');
  badge.className = 'easy-badge';
  badge.textContent = '📖';
  line.appendChild(badge);
  line.appendChild(document.createTextNode(' ' + text));
  parentEl.appendChild(line);
}

// ════════════════════════════════════════════════════════════
// FISHER-YATES SHUFFLE
// ════════════════════════════════════════════════════════════
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
let qs = [];
let cur = 0;
let score = 0;
let elapsed = 0;
let timerID = null;

function buildState() {
  const shuffled = shuffleArray([...QUESTIONS]);
  qs = shuffled.map(q => ({
    ...q,
    origIdx: QUESTIONS.indexOf(q),
    shuffledIdx: shuffleArray(q.opts.map((_, i) => i)),
    selectedDisplay: null,
    answered: false
  }));
}

// ════════════════════════════════════════════════════════════
// SCREENS
// ════════════════════════════════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ════════════════════════════════════════════════════════════
// TIMER
// ════════════════════════════════════════════════════════════
function fmt(s) {
  return '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function startTimer() {
  elapsed = 0;
  timerID = setInterval(() => { elapsed++; document.getElementById('timer').textContent = fmt(elapsed); }, 1000);
}
function stopTimer() { clearInterval(timerID); }

// ════════════════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════════════════
function startQuiz() {
  buildState();
  cur = 0;
  score = 0;
  show('screen-quiz');
  startTimer();
  render();
}

// ════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════
function render() {
  const q = qs[cur];
  const total = qs.length;

  document.getElementById('progress-bar').style.width = (cur / total * 100) + '%';
  document.getElementById('q-counter').textContent = 'Fråga ' + (cur + 1) + ' av ' + total;
  document.getElementById('score-pill').textContent = 'Poäng: ' + score;

  const qTextEl = document.getElementById('q-text');
  qTextEl.textContent = q.q;
  if (easyMode && EASY_Q[q.origIdx]) addEasyLine(qTextEl, EASY_Q[q.origIdx].q);

  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';

  q.shuffledIdx.forEach((origIdx, displayPos) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    // Klickhanteraren skickar alltid displayPos (originalbaserad index),
    // aldrig den visade enkla texten — rättningslogiken påverkas inte.
    btn.textContent = q.opts[origIdx];
    if (easyMode) {
      const easyText = mapOpt('sv_enkel', q, q.opts[origIdx]);
      if (easyText) addEasyLine(btn, easyText);
    }
    btn.disabled = q.answered;

    if (q.answered) {
      const correctDisplay = q.shuffledIdx.indexOf(q.correct);
      if (displayPos === correctDisplay)         btn.classList.add('correct');
      else if (displayPos === q.selectedDisplay) btn.classList.add('wrong');
      else                                       btn.classList.add('dimmed');
    } else {
      btn.addEventListener('click', () => handleAnswer(displayPos));
    }
    optsEl.appendChild(btn);
  });

  document.getElementById('btn-back').style.display = cur > 0 ? 'inline-block' : 'none';
  document.getElementById('btn-next').style.display = q.answered ? 'inline-block' : 'none';
  document.getElementById('btn-next').textContent = cur === total - 1 ? 'Se resultat →' : 'Nästa →';
}

// ════════════════════════════════════════════════════════════
// ANSWER
// ════════════════════════════════════════════════════════════
function handleAnswer(displayPos) {
  const q = qs[cur];
  if (q.answered) return;

  q.answered = true;
  q.selectedDisplay = displayPos;

  const correctDisplay = q.shuffledIdx.indexOf(q.correct);
  const isCorrect = displayPos === correctDisplay;
  if (isCorrect) score++;

  document.querySelectorAll('.opt-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctDisplay)          btn.classList.add('correct');
    else if (i === displayPos)         btn.classList.add('wrong');
    else                               btn.classList.add('dimmed');
  });

  document.getElementById('btn-next').style.display = 'inline-block';
  document.getElementById('btn-next').textContent = cur === qs.length - 1 ? 'Se resultat →' : 'Nästa →';
  document.getElementById('score-pill').textContent = 'Poäng: ' + score;

  setTimeout(() => showModal(isCorrect, q.expl), 600);
}

// ════════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════════
function showModal(isCorrect, expl) {
  document.getElementById('modal-icon').textContent    = isCorrect ? '✅' : '❌';
  document.getElementById('modal-verdict').textContent = isCorrect ? 'Rätt svar!' : 'Fel svar';
  document.getElementById('modal-verdict').className   = 'modal-verdict ' + (isCorrect ? 'c' : 'w');
  const explEl = document.getElementById('modal-expl');
  explEl.textContent = expl;
  if (easyMode && EASY_Q[qs[cur].origIdx]) addEasyLine(explEl, EASY_Q[qs[cur].origIdx].expl);
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  goNext();
}

// ════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════
function goBack() { if (cur > 0) { cur--; render(); } }
function goNext() {
  document.getElementById('modal-overlay').classList.add('hidden');
  if (cur < qs.length - 1) { cur++; render(); }
  else showResults();
}

// ════════════════════════════════════════════════════════════
// RESULTS
// ════════════════════════════════════════════════════════════
function showResults() {
  stopTimer();
  show('screen-result');

  const total = qs.length;
  const wrong = total - score;
  const pct   = Math.round(score / total * 100);

  document.getElementById('r-score').textContent   = score + '/' + total;
  document.getElementById('s-correct').textContent = score;
  document.getElementById('s-wrong').textContent   = wrong;
  document.getElementById('s-pct').textContent     = pct + '%';

  const m = Math.floor(elapsed / 60), s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('r-time').textContent = 'Tid: ' + m + ':' + s;

  let title, msg;
  if (pct >= 90)      { title = '🏆 Utmärkt!';          msg = 'Du behärskar naturvetenskapligt arbetssätt på hög nivå.'; }
  else if (pct >= 75) { title = '✅ Redo för provet!';   msg = 'Bra resultat – du har koll på det centrala.'; }
  else if (pct >= 55) { title = '📖 Öva lite till';      msg = 'Du är på rätt spår men behöver repetera en del.'; }
  else                { title = '💡 Fortsätt repetera'; msg = 'Gå igenom pluggmaterialet och försök igen.'; }

  document.getElementById('r-title').textContent = title;
  document.getElementById('r-msg').textContent   = msg;

  // Missed
  const missedEl = document.getElementById('missed-section');
  const missed = qs.filter(q => q.answered && q.shuffledIdx.indexOf(q.correct) !== q.selectedDisplay);
  if (missed.length) {
    missedEl.innerHTML = '<div class="section-hd">Missade frågor (' + missed.length + ')</div>';
    missed.forEach(q => {
      const d = document.createElement('div');
      d.className = 'missed-item';
      d.textContent = q.q;
      missedEl.appendChild(d);
    });
  } else {
    missedEl.innerHTML = '';
  }

  // Full facit
  const facitEl = document.getElementById('facit-list');
  facitEl.innerHTML = '';
  qs.forEach((q, i) => {
    const correctDisplay = q.shuffledIdx.indexOf(q.correct);
    const isCorrect   = q.answered && q.selectedDisplay === correctDisplay;
    const notAnswered = !q.answered;
    const correctText  = q.opts[q.correct];
    const selectedText = q.answered ? q.opts[q.shuffledIdx[q.selectedDisplay]] : null;
    const eq = easyMode ? EASY_Q[q.origIdx] : null;

    const div = document.createElement('div');
    div.className = 'facit-item ' + (notAnswered ? '' : isCorrect ? 'fc' : 'fw');

    // Frågenummer
    const numEl = document.createElement('div');
    numEl.className = 'fi-num';
    numEl.textContent = 'Fråga ' + (i + 1);
    div.appendChild(numEl);

    // Frågetext
    const qEl = document.createElement('div');
    qEl.className = 'fi-q';
    qEl.textContent = q.q;
    if (eq) addEasyLine(qEl, eq.q);
    div.appendChild(qEl);

    if (notAnswered) {
      const r1 = document.createElement('div'); r1.className = 'fi-row';
      r1.innerHTML = '<span class="lbl">Ditt svar: </span>— (inte besvarad)';
      div.appendChild(r1);
      const r2 = document.createElement('div'); r2.className = 'fi-row ra';
      r2.innerHTML = '<span class="lbl">Rätt svar: </span>';
      r2.appendChild(document.createTextNode(correctText));
      if (eq) addEasyLine(r2, eq.a);
      div.appendChild(r2);
    } else if (isCorrect) {
      const r1 = document.createElement('div'); r1.className = 'fi-row ya-ok';
      r1.innerHTML = '✓ <span class="lbl">Ditt svar: </span>';
      r1.appendChild(document.createTextNode(selectedText));
      if (eq) addEasyLine(r1, mapOpt('sv_enkel', q, selectedText));
      div.appendChild(r1);
    } else {
      const r1 = document.createElement('div'); r1.className = 'fi-row ya-bad';
      r1.innerHTML = '✗ <span class="lbl">Ditt svar: </span>';
      r1.appendChild(document.createTextNode(selectedText));
      if (eq) addEasyLine(r1, mapOpt('sv_enkel', q, selectedText));
      div.appendChild(r1);
      const r2 = document.createElement('div'); r2.className = 'fi-row ra';
      r2.innerHTML = '<span class="lbl">Rätt svar: </span>';
      r2.appendChild(document.createTextNode(correctText));
      if (eq) addEasyLine(r2, eq.a);
      div.appendChild(r2);
    }
    facitEl.appendChild(div);
  });
}

// ════════════════════════════════════════════════════════════
// RESTART
// ════════════════════════════════════════════════════════════
function restartQuiz() {
  stopTimer();
  show('screen-start');
}

// Synka knappens visuella tillstånd med sessionStorage vid sidladdning
document.getElementById('easy-btn').setAttribute('aria-pressed', String(easyMode));
</script>
