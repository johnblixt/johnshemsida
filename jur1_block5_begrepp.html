<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Begrepp – Block 5 Juridik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: 'EB Garamond', serif; background: #f8fafc; }
  .concept-badge { background: #ccfbf1; color: #0d9488; }
  .flip-card { perspective: 1000px; height: 350px; width: 100%; max-width: 400px; cursor: pointer; }
  .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
  .flip-card-inner.flipped { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
  .flip-card-back { transform: rotateY(180deg); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const PRIMARY = "#0d9488";
const PRIMARY_LIGHT = "#ccfbf1";
const PRIMARY_TEXT = "#134e4a";

const concepts = [
  { term: "Skadestånd", definition: "Ersättning för en skada." },
  { term: "Skadeståndslagen", definition: "Den lag som reglerar skadestånd i alla situationer utom i avtalsförhållanden." },
  { term: "Skadestånd i avtalsförhållande", definition: "Skadestånd som ska regleras till följd av ett avtal mellan två parter." },
  { term: "Personskada", definition: "Fysisk eller psykisk skada på en person." },
  { term: "Sakskada", definition: "Skada på fast eller lös egendom." },
  { term: "Ren förmögenhetsskada", definition: "Ekonomisk skada som inte hänger ihop med en person- eller sakskada." },
  { term: "Kränkning", definition: "Känslor av rädsla, obehag, förnedring och liknande." },
  { term: "Skadeståndsansvar", definition: "Har den som orsakat en skada avsiktligt eller genom vårdslöshet." },
  { term: "Ersättning för kränkning", definition: "Kränkning ersätts normalt med ett belopp som beror på allvaret i kränkningen. Det finns ett schablonbelopp för många kränkningar." },
  { term: "Adekvat kausalitet", definition: "Det direkta och relevanta sambandet som krävs mellan en handling och en skada för att skadeståndsansvar ska uppstå." },
  { term: "Jämkning av skadestånd", definition: "Innebär en sänkning av skadeståndet i vissa situationer." },
  { term: "Minderårigas skadeståndsansvar", definition: "Ansvar för skador som de orsakar med hänsyn till ålder och utveckling, handlingen, ansvarsförsäkringar och övriga omständigheter." },
  { term: "Vårdnadshavarens ansvar", definition: "Gäller för de skador som barn orsakar, men med högst en femtedels prisbasbelopp per skada." },
  { term: "Principalansvar", definition: "Arbetsgivarens ansvar för skador som anställda orsakar i tjänsten." },
  { term: "Strikt ansvar", definition: "Ansvar för skador även om de inte uppstått till följd av vårdslöshet." },
  { term: "Lagen om tillsyn över hundar och katter", definition: "Reglerar hund- respektive kattägares ansvar." },
  { term: "Ägofredslagen", definition: "Regler bland annat om ansvar för lantbrukets djur." },
  { term: "Ersättning för personskada", definition: "Kan exempelvis vara skadestånd för sjukvårds-, medicin- och reskostnader samt för inkomstbortfall. Även bestående skador kan ersättas." },
  { term: "Ersättning för sakskador", definition: "Sakskador ersätts med värdet eller kostnaden för reparation." },
  { term: "Dagsvärdet", definition: "Vad en sak är värd, exempelvis på begagnatmarknaden, vid tidpunkten för skadan." },
  { term: "Schablon", definition: "Ett belopp ur en lista med tumregler för hur en skada ska ersättas." },
  { term: "Brottsoffermyndigheten", definition: "En statlig myndighet som främjar brottsoffers rättigheter." },
  { term: "Skadeståndsprocessen", definition: "Skadestånd kan antingen rättsligt behandlas genom en civilprocess/dom i ett tvistemål efter stämning eller beslutas vid en brottmålsrättegång." },
  { term: "Försäkringsavtalslagen", definition: "En skyddslagstiftning som reglerar person- och sakförsäkringar. Reglerna är tvingande till försäkringstagarens fördel." },
  { term: "Hemförsäkring", definition: "En paketförsäkring för olika situationer som finns i hemmet." },
  { term: "Ansvarsskydd", definition: "Täcker skadeståndskrav som riktas mot alla som ingår i försäkringen, både vuxna och barn. Tar även över föräldrarnas ansvar för skadeståndsskyldighet i samband med skador som orsakats av barn." },
  { term: "Trafikförsäkring", definition: "Nödvändig försäkring för motorfordon." },
  { term: "Hel- och halvförsäkring", definition: "Frivilliga försäkringar för motorfordon som täcker olika typer av skador. Helförsäkringen täcker även skador på den egna bilen om föraren orsakat en krock, vilket inte halvförsäkringen gör." },
  { term: "Skadereglering", definition: "Försäkringsbolagets bedömning av rätt till ersättning för en skada." },
  { term: "Självrisk", definition: "Det belopp som inte ersätts av försäkringsbolaget." },
];

const lucktextSentences = [
  "Efter att grannens fönster krossats av en fotboll fick den skyldige betala ___ för reparationen.",
  "När skadan inte uppstått i något avtalsförhållande är det ___ som avgör vem som ska betala.",
  "När en hantverkare orsakar en skada under ett uppdrag hen avtalat om med kunden regleras ersättningen som ___.",
  "Efter bilolyckan fick föraren brutna revben och konstaterades ha lidit en ___.",
  "Bilens lackering repades i kollisionen, vilket räknas som en ___.",
  "Revisorn gav ett felaktigt råd som ledde till att företaget förlorade pengar, utan att någon person eller sak skadades fysiskt — det kallas en ___.",
  "Att bli utsatt för ett brott kan orsaka rädsla och förnedring, vilket i lagens mening räknas som en ___.",
  "Den som med flit eller genom vårdslöshet orsakat en skada bär normalt ___.",
  "Domstolen dömde ut ett schablonbelopp till brottsoffret som ___.",
  "För att skadestånd ska kunna krävas måste det finnas ett tillräckligt direkt samband mellan handlingen och skadan, vilket kallas ___.",
  "I vissa fall kan domstolen sänka det belopp som ska betalas i skadestånd, en så kallad ___.",
  "När en tolvåring råkar krossa en ruta bedöms ansvaret utifrån barnets ålder och utveckling, enligt reglerna om ___.",
  "Föräldrarna till barnet som orsakade skadan fick betala, men aldrig mer än en femtedels prisbasbelopp, enligt ___.",
  "När en anställd på lagret av misstag skadar en kollega under arbetstid är det arbetsgivaren som får bära ansvaret, enligt ___.",
  "Ägaren till kraftledningen fick betala skadestånd trots att ingen vårdslöshet kunde bevisas, eftersom verksamheten omfattas av ___.",
  "När grannens hund sprang lös och bet en förbipasserande blev det tydligt vems ansvar det var enligt ___.",
  "När kon rymde från betesmarken och orsakade skada på grannens gröda reglerades ansvaret enligt ___.",
  "Efter olyckan fick den skadade pengar för sjukvårdskostnader, förlorad inkomst och ett bestående men, det vill säga ___.",
  "Den krossade rutan ersattes med kostnaden för en ny, enligt reglerna om ___.",
  "Den stulna cykeln ersattes med vad en likadan, begagnad cykel skulle kosta att köpa just nu, det vill säga ___.",
  "Istället för att räkna ut exakt belopp använde försäkringsbolaget en färdig tumregel ur en lista, en så kallad ___.",
  "Den som utsatts för ett brott kan vända sig till ___ för att få hjälp att driva sin rätt till ersättning.",
  "Skadeståndet kan antingen krävas i en civilrättslig tvist efter stämning eller i samband med en brottmålsrättegång, det kallas ___.",
  "Reglerna som skyddar den som tecknat en försäkring och som inte går att avtala bort till kundens nackdel finns i ___.",
  "Familjen tecknade en paketförsäkring som täcker det mesta som kan hända i bostaden, en så kallad ___.",
  "När barnet av misstag orsakade en skada täcktes föräldrarnas skadeståndsansvar av familjens ___ i hemförsäkringen.",
  "Alla motorfordon måste enligt lag ha en ___ för att få köras på vägarna.",
  "Bilägaren som själv orsakat krocken fick ändå ersättning för skadorna på sin egen bil eftersom hen valt den dyrare av de två frivilliga försäkringarna, ___.",
  "Försäkringsbolaget gick igenom underlaget och bedömde hur mycket kunden hade rätt till, en process som kallas ___.",
  "Av totalkostnaden på 10 000 kronor fick bilägaren själv betala de första 2 000 kronorna, den så kallade ___.",
];

const lucktextAnswerOverrides = {};

const lucktextItems = concepts.map((c, i) => ({
  term: c.term,
  sentence: lucktextSentences[i],
  explanation: c.definition,
  answers: lucktextAnswerOverrides[c.term] || [c.term],
}));

function normalizeAnswer(str) {
  return str.trim().toLowerCase().replace(/\s+/g, " ");
}

function isCorrectAnswer(input, item) {
  const norm = normalizeAnswer(input);
  return item.answers.some((a) => normalizeAnswer(a) === norm);
}

function goBack() {
  const ref = document.referrer;
  if (ref && ref.indexOf(window.location.host) !== -1) {
    history.back();
  } else {
    window.location.href = "index.html";
  }
}

function Header() {
  return (
    <div className="flex items-center justify-between max-w-3xl mx-auto px-4 pt-6 pb-2">
      <a
        href="index.html"
        onClick={(e) => { e.preventDefault(); goBack(); }}
        className="text-sm font-medium text-slate-500 hover:text-[#0d9488] transition-colors"
      >
        ← Tillbaka till startsidan
      </a>
      <h1 className="text-2xl font-bold italic text-center text-slate-800 tracking-wide">
        Block 5 — Juridik
      </h1>
      <div className="w-32"></div>
    </div>
  );
}

function ViewToggle({ view, setView }) {
  const views = ["Lista", "Flashcards", "Lucktext", "Scenario", "Icke-ex."];
  const enabled = ["Lista", "Flashcards", "Lucktext"];
  return (
    <div className="flex justify-center flex-wrap gap-1 max-w-3xl mx-auto px-4 mt-4 mb-8">
      <div className="bg-white rounded-full p-1 shadow-sm border border-slate-200 flex flex-wrap gap-1">
        {views.map((v) => (
          <button
            key={v}
            disabled={!enabled.includes(v)}
            onClick={() => enabled.includes(v) && setView(v)}
            className={
              "px-4 py-2 rounded-full text-sm font-semibold transition-colors " +
              (v === view
                ? "text-white"
                : enabled.includes(v)
                ? "text-slate-500 hover:text-slate-700"
                : "text-slate-400 cursor-not-allowed")
            }
            style={v === view ? { background: PRIMARY } : {}}
          >
            {v}
          </button>
        ))}
      </div>
    </div>
  );
}

function ListView() {
  return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col gap-3">
      {concepts.map((c, i) => (
        <div
          key={c.term}
          className="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow p-5 flex gap-4 items-start"
          style={{ borderLeft: `8px solid ${PRIMARY}` }}
        >
          <span className="concept-badge flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">
            {i + 1}
          </span>
          <div>
            <p className="font-bold text-slate-800 text-lg">{c.term}</p>
            <p className="text-slate-500 mt-1 leading-snug">{c.definition}</p>
          </div>
        </div>
      ))}
    </div>
  );
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function FlashcardView() {
  const total = concepts.length;
  const [deck, setDeck] = useState(() => shuffleArray([...concepts]));
  const [deckIdx, setDeckIdx] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

  const restartAll = () => {
    setDeck(shuffleArray([...concepts]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray([...kudeInte]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col items-center gap-6">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>Börja om med alla</button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col items-center gap-6">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back" style={{ border: `2px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function LucktextView() {
  const [answers, setAnswers] = useState(() =>
    lucktextItems.map(() => ({ value: "", status: "unanswered", attempts: 0 }))
  );

  const correctCount = answers.filter((a) => a.status === "correct").length;
  const doneCount = answers.filter((a) => a.status === "correct" || a.status === "revealed").length;
  const allDone = doneCount === lucktextItems.length;

  const updateAnswer = (idx, patch) => {
    setAnswers((prev) => {
      const next = [...prev];
      next[idx] = { ...next[idx], ...patch };
      return next;
    });
  };

  const checkAnswer = (idx) => {
    const item = lucktextItems[idx];
    const state = answers[idx];
    if (state.status === "correct" || state.status === "revealed") return;
    if (isCorrectAnswer(state.value, item)) {
      updateAnswer(idx, { status: "correct" });
    } else {
      const attempts = state.attempts + 1;
      updateAnswer(idx, { attempts, status: attempts >= 2 ? "wrong" : "warn" });
    }
  };

  const rattaAlla = () => {
    setAnswers((prev) =>
      prev.map((a, i) =>
        a.status === "correct" ? a : { ...a, status: "revealed", value: lucktextItems[i].term }
      )
    );
  };

  const restart = () => {
    setAnswers(lucktextItems.map(() => ({ value: "", status: "unanswered", attempts: 0 })));
  };

  const gradeFeedback = (score, total) => {
    const pct = score / total;
    if (pct >= 0.9) return "Utmärkt! Du är redo för provet! 🎉";
    if (pct >= 0.7) return "Bra jobbat! Nästan i mål.";
    if (pct >= 0.5) return "Godkänt, men öva gärna lite till.";
    return "Öva lite till på begreppen innan provet.";
  };

  return (
    <div className="max-w-3xl mx-auto px-4 pb-16">
      <p className="text-sm text-slate-500 mb-4 text-center">
        Fyll i rätt begrepp i luckan och tryck Enter för att kolla ditt svar. Begrepp du klarat stryks över nedan.
      </p>

      <div className="bg-white rounded-2xl shadow-sm p-4 mb-8 border border-slate-200">
        <p className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {lucktextItems.map((item, i) => {
            const st = answers[i].status;
            const done = st === "correct" || st === "revealed";
            return (
              <span
                key={item.term}
                className={
                  "px-3 py-1 rounded-full text-xs font-semibold border " +
                  (done
                    ? st === "correct"
                      ? "line-through text-green-600 bg-green-50 border-green-200"
                      : "line-through text-slate-400 bg-slate-100 border-slate-200"
                    : "text-slate-600 bg-slate-50 border-slate-200")
                }
              >
                {item.term}
              </span>
            );
          })}
        </div>
      </div>

      {allDone && (
        <div className="bg-white border-2 rounded-3xl p-8 text-center mb-8 shadow-sm" style={{ borderColor: PRIMARY }}>
          <p className="text-2xl font-bold text-slate-800 mb-2">
            {correctCount} / {lucktextItems.length} rätt
          </p>
          <p className="text-slate-500 mb-6">{gradeFeedback(correctCount, lucktextItems.length)}</p>
          <button
            onClick={restart}
            className="text-white px-8 py-3 rounded-2xl font-bold transition-colors"
            style={{ background: PRIMARY }}
          >
            Börja om
          </button>
        </div>
      )}

      {!allDone && (
        <div className="flex justify-end mb-4">
          <button onClick={rattaAlla} className="text-sm font-semibold text-slate-500 hover:text-slate-700 underline">
            Rätta alla
          </button>
        </div>
      )}

      <div className="flex flex-col gap-4">
        {lucktextItems.map((item, i) => {
          const state = answers[i];
          const [before, after] = item.sentence.split("___");
          const locked = state.status === "correct" || state.status === "revealed";
          const borderColor =
            state.status === "correct"
              ? "#16a34a"
              : state.status === "revealed" || state.status === "wrong"
              ? "#dc2626"
              : "#e2e8f0";
          const bg =
            state.status === "correct"
              ? "#dcfce7"
              : state.status === "revealed" || state.status === "wrong"
              ? "#fee2e2"
              : "#ffffff";

          return (
            <div
              key={item.term}
              className="rounded-2xl p-5 shadow-sm border-2 transition-colors"
              style={{ borderColor, background: bg }}
            >
              <p className="text-slate-800 leading-relaxed mb-2">
                <span className="text-xs text-slate-400 font-bold mr-2">{i + 1}.</span>
                {before}
                <input
                  type="text"
                  value={state.value}
                  disabled={locked}
                  onChange={(e) => updateAnswer(i, { value: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && checkAnswer(i)}
                  className="inline-block mx-1 px-2 py-1 border-b-2 border-slate-300 focus:outline-none focus:border-slate-600 bg-transparent font-semibold text-slate-800 disabled:text-slate-600"
                  style={{ borderColor: locked ? borderColor : undefined, minWidth: "140px" }}
                  placeholder="skriv begrepp..."
                />
                {after}
              </p>

              {state.status === "warn" && (
                <p className="text-orange-500 text-sm font-semibold mt-1">Är du säker att du stavat rätt? Försök igen.</p>
              )}
              {state.status === "wrong" && (
                <p className="text-red-600 text-sm font-semibold mt-1">
                  Fel svar. Försök igen eller tryck på "Rätta alla".
                </p>
              )}
              {locked && (
                <div className="mt-2 text-sm">
                  <p className={state.status === "correct" ? "text-green-700 font-bold" : "text-red-700 font-bold"}>
                    {state.status === "correct" ? "Rätt: " : "Rätt svar: "}
                    {item.term}
                  </p>
                  <p className="text-slate-600 mt-1">{item.explanation}</p>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Footer() {
  return (
    <footer className="text-center text-slate-400 text-sm italic pb-10">
      Källa: Juridik nivå 1, begreppslista
    </footer>
  );
}

function App() {
  const [view, setView] = useState("Lista");
  return (
    <div>
      <Header />
      <ViewToggle view={view} setView={setView} />
      {view === "Lista" && <ListView />}
      {view === "Flashcards" && <FlashcardView />}
      {view === "Lucktext" && <LucktextView />}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
