<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mänskliga rättigheter och migration — Begrepp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { font-family: 'EB Garamond', serif; background: #f8fafc; }
  .font-fredoka { font-family: 'Fredoka', sans-serif; }

  .flip-card { perspective: 1000px; height: 350px; width: 100%; max-width: 400px; cursor: pointer; }
  .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
  .flipped-classes { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
  .flip-card-back { transform: rotateY(180deg); }
</style>
</head>
<body>
<div id="root"></div>

<script>
function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function smartBack(fallbackUrl) {
    try {
        if (document.referrer && new URL(document.referrer).hostname === window.location.hostname) {
            history.back();
            return;
        }
    } catch (e) {}
    window.location.href = fallbackUrl;
}
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const PRIMARY = '#0d9488';
const LIGHT = '#ccfbf1';
const TEXT_ON = '#134e4a';

const concepts = [
  { term: "Folkvandringar", definition: "Stora grupper av människor som av olika anledningar förflyttar sig från ett geografiskt område." },
  { term: "FN:s deklaration om de mänskliga rättigheterna (UDHR)", definition: "Innehåller 30 artiklar med formuleringar om mänskliga rättigheter, exempelvis att alla människor är födda fria och lika i värde och rättigheter." },
  { term: "FN:s flyktingkonvention", definition: "Reglerar vem som är flykting och vilka rättigheter denna har." },
  { term: "Internationell sedvanerätt", definition: "Bindande för alla stater, oavsett om de ratificerat en viss konvention eller inte." },
  { term: "UNHCR:s två uppgifter", definition: "Att skydda flyktingar och att söka varaktiga lösningar på deras problem." },
  { term: "Kvotflyktingar", definition: "Är särskilt skyddsbehövande." },
  { term: "Vidarebosättning", definition: "Kallas den fördelning av kvotflyktingar som administreras av UNHCR." },
  { term: "Irreguljär migration", definition: "Personer som rest in i ett land utan tillstånd (så kallade \"papperslösa\") eller personer som tidigare fått tillstånd men sedan förlorat det." },
  { term: "Reguljära migrationsvägar", definition: "Ordnade och trygga vägar för människor på flykt." },
  { term: "FN:s barnkonvention", definition: "Är ett bindande avtal som slår fast att barn är individer med egna rättigheter." },
  { term: "Migration", definition: "Kallas förflyttningen av människor mellan olika platser." },
  { term: "Invandrare", definition: "En person som får tillstånd att stanna i ett land, antingen tillfälligt eller permanent." },
  { term: "Emigrera", definition: "Att utvandra till ett annat land." },
  { term: "Uppehållstillstånd", definition: "Är det tillstånd som krävs för att en utlänning ska få vistas i landet." },
  { term: "Anknytning", definition: "En orsak till migration som innebär att ett uppehållstillstånd beviljas när en svensk man eller kvinna finner en partner i ett annat land, och denna sedan vill flytta med tillbaka till Sverige." },
  { term: "Asyl", definition: "Är uppehållstillstånd som beviljas för flyktingar som flyr från förtryck eller krig." },
  { term: "De vanligaste orsakerna till att personer ansöker om uppehållstillstånd", definition: "Anknytning, arbetstagare, asyl, studier, EU/EES och kvotflykting." },
  { term: "Visum", definition: "En tillåtelse att resa in i ett land. Det finns olika typer av visum, exempelvis turistvisum, och dessa gäller under en begränsad tid." },
  { term: "Permanent uppehållstillstånd", definition: "Har ingen tidsbegränsning och gäller så länge som personen bor i Sverige." },
  { term: "Tillfälligt uppehållstillstånd", definition: "Är tidsbegränsat och ger personen rätt att vistas i Sverige under en begränsad tid. Kan förlängas om kraven för att bo i Sverige är uppfyllda." },
  { term: "Uppehållsrätt", definition: "Innebär att en EU-medborgare åtnjuter samma rättigheter som medborgarna i det EU-land denne befinner sig i." },
  { term: "Dublinförordningen", definition: "Innehåller regler om asyl, bland annat att det endast är ett land som ansvarar för prövningen av en persons asylansökan." },
  { term: "Transitländer", definition: "Kallas de länder som flyktingar reser igenom på vägen till Europa." },
  { term: "Arbetstillstånd", definition: "Krävs för att få stanna och arbeta i Sverige. Ett krav för att beviljas ett sådant tillstånd är exempelvis att personen som ansöker har ett giltigt pass." },
  { term: "EU-blåkort", definition: "Är en variant av arbetstillstånd inom EU som vänder sig till högskoleutbildade arbetskraftsinvandrare." },
  { term: "Anhöriginvandring", definition: "När någon flyttar till Sverige för att bo tillsammans med en anhörig." },
  { term: "Medborgarskap", definition: "Medför ett starkare rättsförhållande till den svenska staten än den som bara har uppehållstillstånd åtnjuter." },
  { term: "Karenstid", definition: "Den tid som en person som tidigare är straffad behöver vänta efter det att brottet sonats innan den kan ansöka om medborgarskap." },
  { term: "Migrationsverket", definition: "Är den myndighet som tillämpar utlänningslagen och som hanterar ansökningar om uppehållstillstånd och medborgarskap." },
  { term: "Migrationsöverdomstolen", definition: "De beslut som fattas där blir vägledande för kommande beslut hos Migrationsverket och Migrationsdomstolen." },
];

function Header({ view, setView }) {
  const tabs = [
    { key: 'lista', label: 'Lista', active: true },
    { key: 'flashcards', label: 'Flashcards', active: true },
    { key: 'lucktext', label: 'Lucktext', active: false },
    { key: 'scenario', label: 'Scenario', active: false },
    { key: 'ickeex', label: 'Icke-ex.', active: false },
  ];
  return (
    <div className="max-w-3xl mx-auto px-4 pt-6">
      <div className="flex items-center justify-between mb-4">
        <a
          href="index.html"
          onClick={(e) => { e.preventDefault(); smartBack('index.html'); }}
          className="text-sm font-semibold transition-colors"
          style={{ color: PRIMARY }}
        >
          ← Tillbaka till startsidan
        </a>
        <div className="w-32"></div>
      </div>
      <h1 className="text-3xl md:text-4xl font-bold italic text-center uppercase tracking-wide mb-6" style={{ color: TEXT_ON }}>
        Mänskliga rättigheter &amp; migration
      </h1>
      <div className="flex flex-wrap justify-center gap-1 bg-white rounded-full p-1 shadow-sm border border-slate-200 mb-8 font-fredoka text-sm max-w-full">
        {tabs.map(t => (
          <button
            key={t.key}
            disabled={!t.active}
            onClick={() => t.active && setView(t.key)}
            className={
              "px-4 py-2 rounded-full font-bold transition-colors " +
              (!t.active
                ? "text-slate-300 cursor-not-allowed"
                : view === t.key
                  ? "text-white"
                  : "text-slate-500 hover:text-slate-700")
            }
            style={view === t.key && t.active ? { background: PRIMARY } : {}}
            title={!t.active ? "Kommer snart" : undefined}
          >
            {t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function ListView() {
  const [query, setQuery] = useState('');
  const filtered = concepts.filter(c =>
    c.term.toLowerCase().includes(query.toLowerCase()) ||
    c.definition.toLowerCase().includes(query.toLowerCase())
  );

  return (
    <div className="max-w-3xl mx-auto px-4 pb-16">
      <input
        type="text"
        value={query}
        onChange={e => setQuery(e.target.value)}
        placeholder="🔍 Sök begrepp eller definition..."
        className="w-full mb-6 px-5 py-3 rounded-2xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 text-lg"
        style={{ '--tw-ring-color': PRIMARY }}
      />
      <div className="flex flex-col gap-3">
        {filtered.map((c, i) => {
          const originalIndex = concepts.indexOf(c);
          return (
            <div
              key={c.term}
              className="bg-white rounded-2xl shadow-sm p-5 border-l-8 hover:shadow-md transition-shadow"
              style={{ borderColor: PRIMARY }}
            >
              <div className="flex items-start gap-3">
                <span
                  className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold font-fredoka"
                  style={{ background: LIGHT, color: TEXT_ON }}
                >
                  {originalIndex + 1}
                </span>
                <div>
                  <p className="font-bold text-lg text-slate-800">{c.term}</p>
                  <p className="text-slate-500 mt-1">{c.definition}</p>
                </div>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && (
          <p className="text-center text-slate-400 mt-8">Inga begrepp matchade sökningen.</p>
        )}
      </div>
    </div>
  );
}

function FlashcardView() {
  const total = concepts.length;
  const [deck, setDeck] = useState(() => shuffleArray(concepts));
  const [deckIdx, setDeckIdx] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing');

  const restartAll = () => {
    setDeck(shuffleArray(concepts));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde = pile === 'kunde' ? [...kunde, card] : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray(kudeInte));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col items-center gap-6">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
          Börja om med alla
        </button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col items-center gap-6">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold font-fredoka hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold font-fredoka">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold font-fredoka">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold font-fredoka">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-2xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70 font-fredoka">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back border-2" style={{ borderColor: PRIMARY }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold font-fredoka">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold font-fredoka py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold font-fredoka py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs font-fredoka">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline font-fredoka">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('lista');
  return (
    <div className="min-h-screen">
      <Header view={view} setView={setView} />
      {view === 'lista' && <ListView />}
      {view === 'flashcards' && <FlashcardView key="flashcards" />}
      <footer className="text-center text-slate-400 italic text-sm pb-8">
        Källa: Mänskliga rättigheter och migration begreppslista
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
