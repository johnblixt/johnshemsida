        { q:"Šta se dešava kada bijeli led zamijeni tamna morska voda?", a:"Tamna voda apsorbuje više Sunčeve topline.", i:["Okean počinje reflektovati više svjetlosti u svemir.","Zemlja se hladi zbog više otvorene vode.","Okean postaje manje slan što utiče na zdravlje riba."] },
        { q:"Kakve su posljedice za priobalne gradove kada se polarne ledene kape tope?", a:"Razina mora raste i uzrokuje poplave.", i:["Razina mora opada jer je led zauzimao više mjesta.","Nastaju nova kopnena područja blizu ekvatora.","Voda postaje pitka za sve na obali."] },
        { q:"Šta znači pojam 'Održivi razvoj'?", a:"Živjeti dobro danas bez uništavanja budućnosti.", i:["Povećati ekonomski rast po svaku cijenu.","Potpuno prestati koristiti sve prirodne resurse.","Sačuvati prirodu točno onakvu kakva je bila u prošlosti."] },
        { q:"Koja dimenzija održivosti se fokusira na zdravlje ekosistema?", a:"Ekološka održivost.", i:["Socijalna održivost.","Ekonomska održivost.","Kulturna održivost."] },
        { q:"Koji dio održivog razvoja se bavi ljudskim pravima?", a:"Socijalna održivost.", i:["Ekološka održivost.","Tehnička održivost.","Finansijska održivost."] },
        { q:"Šta karakterizuje 'Ekonomsku održivost'?", a:"Dugoročno upravljanje resursima koje ne šteti okolini.", i:["Maksimalna kratkoročna dobit za sva preduzeća.","Potpuna zabrana trgovine i korišćenja novca.","Kupovanje samo najjeftinijih proizvoda na tržištu."] },
        { q:"Šta mjeri 'Ekološki otisak'?", a:"Količinu prirodnih resursa koje osoba troši.", i:["Koliko brzo osoba može hodati kroz šumu.","Broj vrsta životinja u određenom području.","Koliko ugljičnog dioksida tvornica emituje godišnje."] },
        { q:"Kako se nazivaju resursi poput sunca i vjetra?", a:"Obnovljivi prirodni resursi.", i:["Ograničeni prirodni resursi.","Fosilni energetski izvori.","Sintetički resursi."] },
        { q:"Šta je primjer neobnovljivog resursa?", a:"Prirodni gas i metali.", i:["Energija vjetra i sunčeva svjetlost.","Drvo i biomasa.","Hidroenergija i valovi."] },
        { q:"Šta znači pojam 'Biološka raznolikost'?", a:"Bogatstvo raznolikosti među vrstama i ekosistemima.", i:["Da postoji mnogo jedinki jedne jedine vrste.","Da sadimo iste vrste drveća u cijeloj šumi.","Da ograničavamo prirodu na zaštićena područja."] },
        { q:"Šta su 'Usluge ekosistema'?", a:"Dobrobiti koje nam priroda pruža, poput pročišćavanja vode.", i:["Rad koji obavljaju radnici u parkovima u gradovima.","Proizvodi koje kupujemo u organskim prodavnicama hrane.","Mašine koje pročišćavaju zrak u velikim industrijama."] },
        { q:"Šta je jedna od najvećih prijetnji biološkoj raznolikosti?", a:"Gubitak staništa kroz eksploataciju.", i:["Da sadimo previše cvijeća u vrtovima.","Da Sunčevo zračenje raste tokom ljeta.","Da postoji previše oprašivačkih insekata."] },
        { q:"Šta se ispituje u 'Analizi životnog ciklusa' (LCA)?", a:"Utjecaj na okoliš od vađenja do zbrinjavanja.", i:["Koliko dugo divlja životinja živi u svom prirodnom okruženju.","Koliko potrošača kupuje određeni proizvod.","Koje boje bi trebao biti proizvod da se bolje prodaje."] },
        { q:"Šta znači pojam 'Kružna ekonomija'?", a:"Sistem gdje se materijali ponovo koriste i štede.", i:["Da novac brzo cirkuliše između različitih banaka.","Da se sve prodavnice postavljaju u krug radi praktičnosti.","Da kupujemo nove stvari i odmah bacamo stare."] },
        { q:"Na šta se fokusira 'Klimatska pravda'?", a:"Raspodjela odgovornosti između bogatih i siromašnih zemalja.", i:["Da svi ljudi trebaju plaćati isti iznos poreza.","Da zakoni trebaju određivati koliko je toplo vani dozvoljeno.","Da sve zemlje potpuno prestanu trgovati međusobno."] },
        { q:"Koji je primarni cilj Pariškog sporazuma?", a:"Ograničiti globalno zagrijavanje na ispod 2°C.", i:["Da Paris postane ekološki najprihvatljiviji grad na svijetu.","Da sve zemlje pređu na istu valutu do 2030. godine.","Zabraniti sve letove unutar cijele Evrope."] },
        { q:"Šta su 'Globalni ciljevi' (Agenda 2030)?", a:"Ciljevi za socijalno, ekonomsko i ekološko zdravlje.", i:["Lista najuspješnijih kompanija na svijetu.","Takmičenje između zemalja ko je bolji.","Pravila za izgradnju sigurnih nuklearnih elektrana."] }
      ],
      tr: [
        { q:"İnsanın çevreyi nasıl etkilediğini açıklayan zincirin ilk adımı genellikle nedir?", a:"İnsanın mal ve hizmet tüketimi.", i:["Dünya atmosferindeki doğal değişimler.","Okyanusun büyük akıntılarındaki değişimler.","Güneşin elektromanyetik radyasyonundaki artış."] },
        { q:"Fabrikalar bir şeyler ürettiğinde genellikle kömür, petrol ve gaz kullanılır. Bunlara topluca ne denir?", a:"Fosil yakıtlar.", i:["Yenilenebilir enerji kaynakları.","Doğal sera gazları.","Sürdürülebilir ham maddeler."] },
        { q:"Fosil yakıtların yakılması sırasında havaya ne salınır?", a:"Karbondioksit gibi sera gazları.", i:["Yalnızca zararsız su buharı.","Atmosferi soğutan ozon.","Bitkilere yararlı olan saf oksijen."] },
        { q:"Atmosferdeki karbondioksit neden iklim için bir sorun oluşturur?", a:"Dünya'dan ısı yayılımını engeller.", i:["Güneş ışınlarının yüzeye ulaşmasını engeller.","Ozon tabakasını tahrip eder ve UV ışınları artar.","Tüm dünyada daha az yağış olmasına neden olur."] },
        { q:"Sera etkisi yoğunlaştığında Dünya'nın sıcaklığına ne olur?", a:"Küresel ortalama sıcaklık yavaş yavaş yükselir.", i:["Kutuplarda sıcaklık dramatik biçimde düşer.","İklimde ölçülebilir bir fark oluşmaz.","Yalnızca yılın yaz yarısında ısınma gerçekleşir."] },
        { q:"Artan sıcaklık orman yangınlarının artmasına nasıl yol açabilir?", a:"Sıcaklık, toprak katmanını ve bitki örtüsünü kurutur.", i:["Sıcaklık daha sık yıldırım düşmesine neden olur.","Sıcaklık ağaç kabuğunun kendiliğinden tutuşmasına yol açar.","Sıcaklık hayvanların kurak bölgelerde daha fazla hareket etmesine neden olur."] },
        { q:"Orman yangınları neden daha fazla ısınmaya yol açar (kısır döngü)?", a:"Ateş, ağaçlarda depolanan karbondioksiti serbest bırakır.", i:["Duman güneş ışığını engeller ve Dünya ısınır.","Kül, toprağın daha fazla soğuk emmesine neden olur.","Ateş, havayı soğutmak için gereken oksijeni tüketir."] },
        { q:"Sıcaklık yükseldiğinde kutuplardaki buzullara ne olur?", a:"Buz erir ve sıvı forma geçer.", i:["Buz daha yoğun hale gelir ve daha fazla ışık yansıtır.","Buz ekvatora doğru sürüklenir ve okyanusları soğutur.","Buz, artan yağış nedeniyle genişler."] },
        { q:"Beyaz buz, koyu renkli deniz suyuyla yer değiştirdiğinde ne olur?", a:"Koyu renkli su, güneşin ısısını daha fazla emer.", i:["Okyanus uzaya daha fazla ışık yansıtmaya başlar.","Daha fazla açık su nedeniyle Dünya soğur.","Okyanus daha az tuzlu hale gelir ve balık sağlığını etkiler."] },
        { q:"Kutup buzulları eridiğinde kıyı şehirleri için sonuç ne olur?", a:"Deniz seviyeleri yükselir ve sel baskınlarına neden olur.", i:["Deniz seviyesi düşer çünkü buz daha fazla yer kaplıyordu.","Ekvator yakınında yeni kara alanları oluşur.","Su sahilde herkes için içilebilir hale gelir."] },
        { q:"'Sürdürülebilir kalkınma' kavramı ne anlama gelir?", a:"Geleceği mahvetmeden bugün iyi yaşamak.", i:["Ekonomik büyümeyi her ne pahasına olursa olsun artırmak.","Tüm doğal kaynakların kullanımını tamamen durdurmak.","Doğayı geçmişte olduğu gibi tam olarak korumak."] },
        { q:"Sürdürülebilirliğin hangi boyutu ekosistem sağlığına odaklanır?", a:"Ekolojik sürdürülebilirlik.", i:["Sosyal sürdürülebilirlik.","Ekonomik sürdürülebilirlik.","Kültürel sürdürülebilirlik."] },
        { q:"Sürdürülebilir kalkınmanın hangi kısmı insan haklarıyla ilgilidir?", a:"Sosyal sürdürülebilirlik.", i:["Çevresel sürdürülebilirlik.","Teknik sürdürülebilirlik.","Mali sürdürülebilirlik."] },
        { q:"'Ekonomik sürdürülebilirlik' ile ne kastedilir?", a:"Çevreye zarar vermeyen uzun vadeli kaynak yönetimi.", i:["Tüm şirketler için kısa vadede maksimum kâr.","Ticaret ve para kullanımını tamamen yasaklamak.","Piyasadaki yalnızca en ucuz ürünleri satın almak."] },
        { q:"'Ekolojik ayak izi' neyi ölçer?", a:"Bir insanın tükettiği doğal kaynak miktarını.", i:["Bir kişinin ormandan ne kadar hızlı geçebildiğini.","Belirli bir alanda bulunan hayvan türü sayısını.","Bir fabrikanın yılda ne kadar karbondioksit saldığını."] },
        { q:"Güneş ve rüzgar gibi kaynaklar ne olarak adlandırılır?", a:"Yenilenebilir doğal kaynaklar.", i:["Tükenebilir doğal kaynaklar.","Fosil enerji kaynakları.","Sentetik kaynaklar."] },
        { q:"Yenilenemez kaynak örneği nedir?", a:"Doğal gaz ve metaller.", i:["Rüzgar enerjisi ve güneş ışığı.","Ahşap ve biyokütle.","Hidroenerji ve dalgalar."] },
        { q:"'Biyolojik çeşitlilik' kavramı ne anlama gelir?", a:"Türler ve ekosistemler arasındaki çeşitlilik zenginliği.", i:["Tek bir türden çok sayıda bireyin bulunması.","Ormanın tamamına aynı tür ağaç dikmemiz.","Doğayı korunan alanlarla sınırlamamız."] },
        { q:"'Ekosistem hizmetleri' nedir?", a:"Doğanın bize sağladığı su arıtma gibi faydalar.", i:["Şehirlerdeki park işçilerinin yaptığı işler.","Organik gıda mağazalarında satın aldığımız ürünler.","Büyük sanayi kuruluşlarında havayı temizleyen makineler."] },
        { q:"Biyolojik çeşitlilik için en büyük tehditlerden biri nedir?", a:"Sömürü yoluyla yaşam alanlarının yitirilmesi.", i:["Bahçelere çok fazla çiçek dikmemiz.","Yaz mevsiminde güneş radyasyonunun artması.","Çok fazla tozlayıcı böcek bulunması."] },
        { q:"'Yaşam Döngüsü Analizi' (LCA) neyi inceler?", a:"Çıkarmadan bertarata kadar çevresel etki.", i:["Vahşi bir hayvanın doğal ortamında ne kadar yaşadığı.","Belirli bir ürünü kaç tüketicinin satın aldığı.","Daha iyi satmak için ürünün hangi renkte olması gerektiği."] },
        { q:"'Döngüsel ekonomi' kavramı ne anlama gelir?", a:"Malzemelerin yeniden kullanıldığı ve korunduğu bir sistem.", i:["Paranın farklı bankalar arasında hızla dolaşması.","Tüm mağazaların kolaylık için bir daire içine yerleştirilmesi.","Yeni şeyler alıp eskileri hemen atmak."] },
        { q:"'İklim adaleti' neye odaklanır?", a:"Zengin ve fakir ülkeler arasında sorumluluk paylaşımı.", i:["Tüm insanların aynı miktarda vergi ödemesi gerektiği.","Yasaların dışarıda ne kadar sıcak olmasına izin verileceğini belirlemesi gerektiği.","Tüm ülkelerin birbirleriyle ticareti tamamen durdurması."] },
        { q:"Paris Anlaşması'nın temel amacı nedir?", a:"Küresel ısınmayı 2°C'nin altında tutmak.", i:["Paris'i dünyanın en çevre dostu şehri haline getirmek.","Tüm ülkelerin 2030'a kadar aynı para birimine geçmesi.","Avrupa genelinde tüm uçuşları yasaklamak."] },
        { q:"'Küresel Hedefler' (Gündem 2030) nedir?", a:"Sosyal, ekonomik ve çevresel sağlık hedefleri.", i:["Dünyanın en başarılı şirketlerinin listesi.","Ülkeler arasında kimin en iyi olduğuna dair bir yarışma.","Güvenli nükleer güç santralleri inşa etme kuralları."] }
      ],
      so: [
        { q:"Maxaa inta badan tallaabada ugu horeysa ee silsilada sharxaysa sida aadamigu deegaanka u saamaynayo?", a:"Isticmaalka badeecadaha iyo adeegyada ee aadanaha.", i:["Isbedelada dabiiciga ah ee jawiga dhulka.","Isbedelada durdurrada weyn ee badaha.","Koritaanka hawlaha ifo-korantada ee qorraxda."] },
        { q:"Markay warshadu wax samaynayaan, qogoorida, saliidda iyo gaaska ayaa inta badan la isticmaalaa. Maxaa lagu magacaabaa kuwaas wadajir?", a:"Shidaalka fosil.", i:["Ilaha tamarta dib-u-soo-noolaanshaha.","Gaasyada xumaysta ee dabiiciga ah.","Kheyraadka caddaalad ee la xukumi karo."] },
        { q:"Maxaa hawada lagu sii deyraa markay shidaalka fosil gubtaan?", a:"Gaasyada xumaysta sida kaarboon dayoksayd.", i:["Uumi biyo oo kaliya oo aan waxyeello lahayn.","Ozone oo qaboojiya jawiga.","Oksijiinka nadiif ah oo faa'iido u leh dhirta."] },
        { q:"Maxay kaarboon dayoksaydku jawiga ku ahaataa dhibaato cimilada?", a:"Waxay xidaa kulaylka ka baxaya dhulka.", i:["Waxay gooyaa iftiinka qorraxda inuusan gaadhsiimin dusha dhulka.","Waxay baabi'isaa lakabka ozone sidaas darteedna shucaaca UV-ga waa kordha.","Waxay keentaa in roobkii dunida oo dhan yar yahay."] },
        { q:"Maxaa ku dhacaya heerkulka dhulka markay saameynta xumaysata adag noqoto?", a:"Heerkulka celceliska caalamiga ah ayaa si tartiib ah u kacaya.", i:["Heerkulka wuu si xun hoos ugu dhacaa qudbaha.","Ma jirto farqi la cabbiri karo cimilada.","Kulaylku wuxuu sii baxaa oo kaliya xilliga xagaaga."] },
        { q:"Sidee kulaylka koritaanku u kordhin karaa dab-deymaha kaynta?", a:"Kulaylku wuxuu engejiyaa koobka dhulka iyo dhirta.", i:["Kulaylku wuxuu keenaa biriqsi badan oo dhacaya.","Kulaylku wuxuu keenaa marinka geedaha inuu si iskiis ah u baxsado.","Kulaylku wuxuu keenaa xayawaanadu inay ka badan dhaqaaqdaan goobaha engegan."] },
        { q:"Maxay dab-deymaha kayntu u keentaa kulaylka kordhada (wareeg xun)?", a:"Dabku wuxuu sii deyraa kaarboon dayoksayd oo geedaha ku kaydsnaa.", i:["Qiiqu wuxuu xidaa iftiinka qorraxda si dhulku u kululo.","Cididu waxay keentaa dhulka inuu jiido qabow badan.","Dabku wuxuu cunaa oksijiinka loogu baahdo si hawada loo qaboojiyо."] },
        { q:"Maxaa ku dhacaya barafka ku taal qudbaha markay heerkulku kaco?", a:"Barafku wuu dhalaalaa oo u beddelaa xaalad biyo ah.", i:["Barafku wuu adag yahay oo iftiinka badan ka celiya.","Barafku wuxuu u socdaa xaaladda oo badaha qaboojiya.","Barafku wuxuu ballaadha sababtoo ah roobab badan."] },
        { q:"Maxaa dhacaya markii barafka caddaanka ah lagu beddelo biyaha madow ee badda?", a:"Biyaha madow waxay nuugaan kulaylka qorraxda aad u badan.", i:["Baddu waxay bilaabaysaa inay celiso iftiinka badan xiddigiska.","Dhulku wuu qaboobaa sababtoo ah biyo furan oo badan.","Baddu waxay noqotaa mid macaan oo saameeya caafimaadka kalluunka."] },
        { q:"Maxay ahaanaysaa cawaaqibka magaalooyinka xeebaha ee markay barafka qudbada dhalaalaan?", a:"Heerka badda wuu kacaa waxayna keentaa daad.", i:["Heerka badda wuu hoos u dhacaa sababtoo ah barafku wuu ka badan yahay booska.","Dhulal cusub ayaa u samaysmaa meesha dhexe ee adduunka.","Biyuhu waxay noqdaan la cabi karo oo dhammaan xeebta degan."] },
        { q:"Maxay tahay macnaha 'Horumarinta joogtada ah'?", a:"In maanta si fiican u noolaan adoon mustaqbalka baabbi'in.", i:["In koritaanka dhaqaalaha la kordho qiimo kasta oo la bixiyo.","In si buuxda loo joojiyo isticmaalka dhammaan kheyraadka dabiiciga ah.","In dabiiciga loo xafido sida hore ahayd."] },
        { q:"Xagee xoogga joogtada ah ee diiradda saara caafimaadka nidaamyada deegaanka?", a:"Joogtada deegaanka.", i:["Joogtada bulshada.","Joogtada dhaqaale.","Joogtada dhaqanka."] },
        { q:"Qeybta horumarinta joogtada ah ee ku saabsan xuquuqda aadanaha?", a:"Joogtada bulshada.", i:["Joogtada deegaanka.","Joogtada farsamada.","Joogtada maaliyadda."] },
        { q:"Maxay astaamaha 'Joogtada dhaqaale' ka dhigaan?", a:"Maaraynta kheyraadka muddo dheer oo aan waxyeello u geysan deegaanka.", i:["Faa'iidada ugu badan ee xilliga gaaban ee shirkadaha oo dhan.","In si buuxda loo mamnuuco ganacsiga iyo isticmaalka lacagta.","In kaliya la iibsado badeecadaha ugu jaban ee suuqa."] },
        { q:"Maxay 'Cagaha deegaanka' cabbiraan?", a:"Tirada kheyraadka dabiiciga ah ee aadane isticmaalo.", i:["Intee degdeg ah qofku uga gudbi karo kaynta.","Tirada noocyada xayawaanka ee meesha gaarka ah ku nool.","Intee kaarboon dayoksayd warshad sanadkiiba sii deyrtaa."] },
        { q:"Maxaa loo yaqaan kheyraadyada sida qorraxda iyo dabaylaha?", a:"Kheyraadka dabiiciga ah ee dib-u-cusboonaasiiya.", i:["Kheyraadka dabiiciga ah ee kooban.","Ilaha tamarta fosil.","Kheyraadyada macmalka ah."] },
        { q:"Maxaa tusaale u ah kheyraad aan dib-u-cusboonaasinayn?", a:"Gaaska dabiiciga ah iyo macdanta.", i:["Tamarta dabaylaha iyo iftiinka qorraxda.","Qoryo iyo biomass.","Tamarta biyaha iyo mowjadaha."] },
        { q:"Maxay tahay macnaha 'Kala-duwanaanshaha noolaha'?", a:"Hodanka kala-duwanaanshaha noocyada iyo nidaamyada deegaanka.", i:["In dad badan oo nooc keliya ah ay jiraan.","In aan beerno geed isku nooc ah kaynta oo dhan.","In dabiiciga u xadidno goobaha la difaacayo."] },
        { q:"Maxay yihiin 'Adeegyada nidaamka deegaanka'?", a:"Faa'iidooyinka dabiicigu noo siiyaan, sida nadiifinta biyaha.", i:["Shaqada ay qabtaan shaqaalaha beerta magaalooyinka.","Badeecadaha aan ka iibsano dukaamada cuntada dabiiciga ah.","Mishiinnada nadiifiya hawada warshadaha waaweyn."] },
        { q:"Maxay tahay mid ka mid ah hanjabadaha ugu weyn ee kala-duwanaanshaha noolaha?", a:"Luminta deegaannada noolaha iyada oo loo marayo dhaqaalaynta.", i:["In aan beerno ubax badan oo beerta dhul-guryaha.","In shucaaca qorraxdu kordhaa xilliga xagaaga.","In ay jiraan cayayaanka ki'iga ah oo aad u badan."] },
        { q:"Maxaa lagu baaraa 'Falanqaynta Wareegga Nolosha' (LCA)?", a:"Saameynta deegaanka laga bilaabo soo-saarka ilaa xalinta.", i:["Intee in le'eg xayawaan duurjoog ah ku noolaa deegaankiisa dabiiciga ah.","Intee macmiil iibsadaan badeecad gaar ah.","Midkee midab badeecaddu u baahan tahay si ugu fiican u iibsato."] },
        { q:"Maxay tahay macnaha 'Dhaqaalaha wareegga'?", a:"Nidaam agabku uu ku dib-u-isticmaalo oo loo kaydisto.", i:["In lacagtu si dhakhso ah ugu wareegto bangiyada kala duwan.","In dukaamada oo dhan lagu dhigo goobo wareeg ah si fududaanaanshaha.","In aan wax cusub iibsano oo hore si degdeg ah u tuuro."] },
        { q:"Maxay diiradda saartaa 'Cadaaladda cimilada'?", a:"Qeybinta mas'uuliyadda dhexmarta dalka hodan ah iyo kuwa faqiirka ah.", i:["In dadka oo dhan ay bixiyaan canshuur isku miqdaar ah.","In sharciyadu go'aamiyaan intee kulaylka dibadda la ogol yahay.","In dhamaan dalka si buuxda uga joogaan ganacsiga midba midka kale."] },
        { q:"Maxay tahay ujeeddada ugu muhiimsan heshiiska Paris?", a:"Xaddidaadda kulaylka caalamiga ah ka hoosaysa 2°C.", i:["In Paris noqoto magaalada ugu saaxiibtobadan deegaanka adduunka.","In dhamaan dalka ku bedelaan lacag isku mid ah sanadka 2030.","In la mamnuuco dulimaadka oo dhan Yurub oo dhan."] },
        { q:"Maxay yihiin 'Yoolalka Caalamiga ah' (Ajendada 2030)?", a:"Yoolallo bulshada, dhaqaalaha iyo deegaanka caafimaadkiisa.", i:["Liiska shirkadaha ugu guuleystay dunida.","Tartanka u dhexeeya dalka ee ku saabsan cidda ugu wanaagsan.","Xeerarka dhismaha santraadyada nukliyeerka ammaan ah."] }
      ],
      sv_enkel: [
        { q:"Vad är det allra första steget när vi pratar om hur vi påverkar naturen?", a:"Att vi köper och använder saker.", i:["Att luften runt jorden ändrar sig av sig själv.","Att stora vattenflöden i havet ändrar sig.","Att solen strålar mer."] },
        { q:"Kol, olja och gas används i fabriker. Vad kallas de ihop?", a:"Fossila bränslen.", i:["Förnybar energi.","Naturliga gaser.","Hållbara råvaror."] },
        { q:"Vad kommer ut i luften när vi bränner kol, olja och gas?", a:"Växthusgaser, till exempel koldioxid.", i:["Bara ofarlig ånga.","Ozon som kyler luften.","Rent syre som hjälper växter."] },
        { q:"Varför är koldioxid i luften dåligt för klimatet?", a:"Den håller kvar värmen på jorden.", i:["Den stoppar solljuset från att nå marken.","Den förstör ozonskiktet.","Den gör att det regnar mindre."] },
        { q:"Vad händer med temperaturen på hela jorden när koldioxiden ökar?", a:"Det blir långsamt varmare överallt.", i:["Det blir mycket kallare vid polerna.","Ingenting ändras i klimatet.","Det blir bara varmare på sommaren."] },
        { q:"Hur kan mer värme leda till fler skogsbränder?", a:"Värmen gör att marken och växterna torkar ut.", i:["Det slår ned mer blixt.","Träd börjar brinna av sig själva.","Djur rör sig mer på torra ställen."] },
        { q:"Varför gör skogsbränder att det blir ännu varmare? (En ond cirkel)", a:"Elden släpper ut koldioxid som fanns inne i träden.", i:["Röken stoppar solljuset och gör det varmare.","Askan gör att marken drar till sig kyla.","Elden tar upp syret som kyler luften."] },
        { q:"Vad händer med isen vid polerna när det blir varmare?", a:"Isen smälter och blir vatten.", i:["Isen packas ihop och reflekterar mer ljus.","Isen rör sig mot jordens mitt.","Isen växer av snö och regn."] },
        { q:"Vad händer när vit is ersätts av mörkt havsvatten?", a:"Det mörka vattnet tar upp mer värme från solen.", i:["Havet skickar mer ljus ut i rymden.","Mer öppet vatten kyler ned jorden.","Havet blir sötare och fiskar mår sämre."] },
        { q:"Vad händer med städer vid havet när isen vid polerna smälter?", a:"Havet stiger och städer kan svämmas över.", i:["Havet sjunker.","Nytt land dyker upp nära jordens mitt.","Havet blir drickbart för alla."] },
        { q:"Vad betyder 'hållbar utveckling'?", a:"Att leva bra nu utan att förstöra för dem som kommer efter oss.", i:["Att tjäna mer pengar, hur som helst.","Att sluta använda naturen helt.","Att hålla naturen precis som den var förr."] },
        { q:"Vilket område av hållbarhet handlar om naturens och djurens hälsa?", a:"Ekologisk hållbarhet.", i:["Social hållbarhet.","Ekonomisk hållbarhet.","Kulturell hållbarhet."] },
        { q:"Vilket område av hållbarhet handlar om att alla människor ska ha det bra?", a:"Social hållbarhet.", i:["Miljömässig hållbarhet.","Teknisk hållbarhet.","Finansiell hållbarhet."] },
        { q:"Vad menas med ekonomisk hållbarhet?", a:"Att sköta pengar och resurser på ett sätt som inte skadar naturen.", i:["Att tjäna så mycket pengar som möjligt nu.","Att förbjuda all handel och alla pengar.","Att alltid köpa det billigaste."] },
        { q:"Vad mäter ett ekologiskt fotavtryck?", a:"Hur mycket natur en person använder och förbrukar.", i:["Hur fort en person kan gå i skogen.","Hur många djurarter som finns på ett ställe.","Hur mycket koldioxid en fabrik släpper ut."] },
        { q:"Vad kallas resurser som aldrig tar slut, som sol och vind?", a:"Förnybara naturresurser.", i:["Ändliga naturresurser.","Fossila energikällor.","Konstgjorda resurser."] },
        { q:"Ge ett exempel på en resurs som kan ta slut.", a:"Naturgas och metaller.", i:["Vindkraft och solljus.","Trä och biomassa.","Vattenkraft och vågor."] },
        { q:"Vad betyder biologisk mångfald?", a:"Att det finns många olika slags djur, växter och naturmiljöer.", i:["Att det finns väldigt många av ett och samma djur.","Att vi planterar samma slags träd överallt.","Att vi håller naturen innanför skyddade områden."] },
        { q:"Vad är ekosystemtjänster?", a:"Saker naturen gör åt oss, till exempel renar vattnet och luften.", i:["Arbete som parkarbetare gör i städer.","Varor vi köper i ekologiska affärer.","Maskiner som renar luften i fabriker."] },
        { q:"Vad är ett av de största hoten mot biologisk mångfald?", a:"Att djur och växter förlorar sina hem när vi bygger och odlar.", i:["Att vi planterar för många blommor.","Att solen strålar mer på sommaren.","Att det finns för många pollinerande insekter."] },
        { q:"Vad tittar man på i en livscykelanalys (LCA)?", a:"Hur en produkt påverkar naturen, från att den görs till att den slängs.", i:["Hur länge ett vilt djur lever.","Hur många som köper en viss vara.","Vilken färg en produkt ska ha för att sälja bra."] },
        { q:"Vad betyder cirkulär ekonomi?", a:"Att vi återanvänder och tar hand om material istället för att kasta det.", i:["Att pengar rör sig snabbt mellan banker.","Att alla affärer ligger i en cirkel.","Att vi köper nytt och kastar det gamla direkt."] },
        { q:"Vad handlar klimaträttvisa om?", a:"Vem som bär störst ansvar för klimatproblemen – rika eller fattiga länder.", i:["Att alla ska betala lika mycket skatt.","Att lagar ska bestämma hur varmt det får vara.","Att länder ska sluta handla med varandra."] },
        { q:"Vad är det viktigaste målet med Parisavtalet?", a:"Att hålla uppvärmningen av jorden under 2 grader.", i:["Att göra Paris till världens grönaste stad.","Att alla länder ska använda samma valuta år 2030.","Att förbjuda flyg i hela Europa."] },
        { q:"Vad är de globala målen (Agenda 2030)?", a:"Mål för att världen ska bli mer rättvis, bättre och grönare.", i:["En lista på de rikaste företagen i världen.","En tävling om vilket land som är bäst.","Regler för hur man bygger säkra kärnkraftverk."] }
      ]
    };

    const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
    const formatTime = (seconds) => {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    };

    function getTQ(q, lang) {
      if (lang === 'sv' || !TRANS_Q[lang]) return null;
      const idx = ALL_QUESTIONS_STATIC.indexOf(q);
      return idx >= 0 ? TRANS_Q[lang][idx] : null;
    }

    function getOptTrans(tq, q, optStr) {
      if (!tq) return null;
      if (optStr === q.a) return tq.a;
      const iIdx = q.i.indexOf(optStr);
      return iIdx >= 0 ? tq.i[iIdx] : null;
    }

    const TransLine = ({ text, lang }) => {
      if (!text || lang === 'sv') return null;
      const isRTL = RTL.includes(lang);
      return (
        <div className="trans-line" style={isRTL ? {direction:'rtl',textAlign:'right'} : {}}>
          <span className="trans-badge">{LANG_FLAGS[lang]} {LANG_LABELS[lang]}</span>{text}
        </div>
      );
    };

    function App() {
      const [lang, setLang] = useState('sv');
      const [showLangMenu, setShowLangMenu] = useState(false);
      const [gameState, setGameState] = useState('start');
      const [allQuestions, setAllQuestions] = useState([]);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [optionsList, setOptionsList] = useState([]);
      const [timer, setTimer] = useState(0);
      const timerRef = useRef(null);

      const ui = (key) => (lang !== 'sv' && UI[lang]) ? (UI[lang][key] || UI.sv[key] || '') : (UI.sv[key] || '');

      useEffect(() => {
        if (gameState === 'play') {
          timerRef.current = setInterval(() => setTimer(prev => prev + 1), 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [gameState]);

      useEffect(() => {
        if (!showLangMenu) return;
        const close = () => setShowLangMenu(false);
        window.addEventListener('click', close);
        return () => window.removeEventListener('click', close);
      }, [showLangMenu]);

      const start = () => {
        const combined = [...chainQuestions, ...shuffle(conceptQuestions)];
        setAllQuestions(combined);
        setOptionsList(combined.map(qq => shuffle([qq.a, ...qq.i])));
        setAnswers(new Array(combined.length).fill(null));
        setCurrentIdx(0);
        setTimer(0);
        setGameState('play');
      };

      const handleAns = (ans) => {
        if (answers[currentIdx]) return;
        setAnswers(prev => { const copy = [...prev]; copy[currentIdx] = ans; return copy; });
      };

      const next = () => {
        const nextIdx = currentIdx + 1;
        if (nextIdx < allQuestions.length) setCurrentIdx(nextIdx);
        else setGameState('end');
      };

      const prev = () => { if (currentIdx > 0) setCurrentIdx(currentIdx - 1); };

      const LangSelector = () => (
        <div style={{position:'fixed',top:'1rem',right:'1rem',zIndex:9999}} onClick={e => e.stopPropagation()}>
          <button
            onClick={() => setShowLangMenu(prev => !prev)}
            style={{background:'rgba(255,255,255,0.95)',border:'1px solid #cbd5e1',borderRadius:'8px',fontSize:'13px',padding:'6px 12px',cursor:'pointer',color:'#1e293b',display:'flex',alignItems:'center',gap:'6px',fontFamily:'EB Garamond,serif',boxShadow:'0 1px 4px rgba(0,0,0,0.1)'}}
          >
            🌐 {lang === 'sv' ? ui('langBtn') : `${LANG_FLAGS[lang]} ${LANG_LABELS[lang]}`}
          </button>
          {showLangMenu && (
            <div style={{position:'absolute',right:0,top:'calc(100% + 4px)',background:'white',border:'1px solid #cbd5e1',borderRadius:'8px',boxShadow:'0 4px 12px rgba(0,0,0,0.15)',overflow:'hidden',minWidth:'160px'}}>
              <button className="lang-opt" onClick={() => {setLang('sv');setShowLangMenu(false);}}>🇸🇪 Svenska</button>
              <button className="lang-opt" onClick={() => {setLang('ar');setShowLangMenu(false);}}>🇸🇦 Arabiska</button>
              <button className="lang-opt" onClick={() => {setLang('fa');setShowLangMenu(false);}}>🇮🇷 Persiska</button>
              <button className="lang-opt" onClick={() => {setLang('en');setShowLangMenu(false);}}>🇬🇧 Engelska</button>
              <button className="lang-opt" onClick={() => {setLang('bs');setShowLangMenu(false);}}>🇧🇦 Bosniska</button>
              <button className="lang-opt" onClick={() => {setLang('tr');setShowLangMenu(false);}}>🇹🇷 Turkiska</button>
              <button className="lang-opt" onClick={() => {setLang('so');setShowLangMenu(false);}}>🇸🇴 Somaliska</button>
              <div style={{margin:'4px 8px',borderTop:'1px solid #e2e8f0'}}></div>
              <button className="lang-opt" style={{color:'#15803d',fontWeight:'600'}} onClick={() => {setLang('sv_enkel');setShowLangMenu(false);}}>📖 Enkel svenska</button>
            </div>
          )}
        </div>
      );

      if (gameState === 'start') return (
        <>
          <LangSelector />
          <div className="flex items-center justify-center min-h-screen p-4 text-center">
            <div className="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full border-t-8 border-green-500">
              <Leaf className="w-16 h-16 text-green-500 mx-auto mb-4" />
              <h1 className="text-2xl font-black mb-2 uppercase tracking-tight">{ui('badge')}</h1>
              <p className="text-slate-500 mb-6 font-medium">{ui('desc')}</p>
              <button onClick={start} className="w-full bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-600 transition-all active:scale-95">{ui('startBtn')}</button>
            </div>
          </div>
        </>
      );

      if (gameState === 'end') {
        const finalScore = answers.reduce((acc, ans, idx) => acc + (ans === allQuestions[idx].a ? 1 : 0), 0);
        return (
          <>
            <LangSelector />
            <div className="flex flex-col items-center min-h-screen p-4 py-8">
              <div className="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full border-t-8 border-green-500 text-center">
                <Trophy className="w-16 h-16 text-yellow-500 mx-auto mb-4" />
                <h2 className="text-2xl font-black mb-2 text-slate-800">{ui('wellDone')}</h2>
                <div className="space-y-1 mb-6">
                  <p className="text-4xl font-black text-green-500">{finalScore} / {allQuestions.length}</p>
                  <p className="text-slate-400 font-bold flex items-center justify-center gap-2">
                    <Clock className="w-4 h-4" /> {ui('timeLabel')}: {formatTime(timer)}
                  </p>
                </div>
                <button onClick={start} className="w-full bg-slate-800 text-white font-bold py-4 rounded-xl mb-3 shadow-md">{ui('playAgain')}</button>
              </div>

              <div className="w-full max-w-md mt-8 space-y-3">
                <h3 className="text-xs font-black text-slate-400 uppercase tracking-widest px-1">{ui('reviewTitle')}</h3>
                {allQuestions.map((question, idx) => {
                  const userAns = answers[idx];
                  const correct = userAns === question.a;
                  const tq = getTQ(question, lang);
                  const userAnsTrans = userAns ? getOptTrans(tq, question, userAns) : null;
                  const correctAnsTrans = getOptTrans(tq, question, question.a);
                  return (
                    <div key={idx} className={`bg-white p-4 rounded-2xl shadow-sm border-l-4 ${correct ? "border-green-500" : "border-red-500"}`}>
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">{ui('counter')} {idx + 1} · {question.step}</span>
                        <span className={`text-[10px] font-black uppercase tracking-widest ${correct ? "text-green-600" : "text-red-600"}`}>{correct ? ui('correctLabel') : ui('wrongLabel')}</span>
                      </div>
                      <p className="text-sm font-bold text-slate-800 mb-1 leading-snug">{question.q}</p>
                      {tq && <div className="trans-line" style={RTL.includes(lang)?{direction:'rtl',textAlign:'right'}:{}}><span className="trans-badge">{LANG_FLAGS[lang]} {LANG_LABELS[lang]}</span>{tq.q}</div>}
                      <p className={`text-sm font-bold mt-2 ${correct ? "text-green-700" : "text-red-700"}`}>
                        {ui('yourAnswer')}: {userAns ?? "—"}
                        {userAnsTrans && <TransLine text={userAnsTrans} lang={lang} />}
                      </p>
                      {!correct && (
                        <p className="text-sm font-bold text-green-700 mt-1">
                          {ui('correctAnswer')}: {question.a}
                          {correctAnsTrans && <TransLine text={correctAnsTrans} lang={lang} />}
                        </p>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        );
      }

      const q = allQuestions[currentIdx];
      const selected = answers[currentIdx];
      const shuffledOptions = optionsList[currentIdx];
      const tq = getTQ(q, lang);

      return (
        <>
          <LangSelector />
          <div className="flex flex-col items-center min-h-screen p-4 pt-8">
            <div className="w-full max-w-md">
              <div className="flex justify-between items-end text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">
                <div className="flex flex-col">
                  <span className="text-green-500">{q.step}</span>
                  <span>{ui('counter')} {currentIdx + 1} / {allQuestions.length}</span>
                </div>
                <div className="flex items-center gap-1 text-slate-500">
                  <Clock className="w-3 h-3" />
                  <span>{formatTime(timer)}</span>
                </div>
              </div>
              <div className="h-2 bg-slate-200 rounded-full mb-6 overflow-hidden">
                <div className="h-full bg-green-500 transition-all duration-500" style={{width:`${((currentIdx+1)/allQuestions.length)*100}%`}}></div>
              </div>
              <div className="bg-white p-6 rounded-2xl shadow-sm mb-6 border-b-4 border-slate-100">
                <h2 className="text-lg font-bold text-slate-800 leading-snug">{q.q}</h2>
                <TransLine text={tq ? tq.q : null} lang={lang} />
              </div>
              <div className="space-y-3">
                {shuffledOptions.map((opt, i) => {
                  const optTrans = getOptTrans(tq, q, opt);
                  return (
                    <button key={i} onClick={() => handleAns(opt)} disabled={!!selected} className={`w-full text-left p-4 rounded-xl font-bold border-2 transition-all ${
                      !selected ? "bg-white border-slate-100 hover:border-green-400 hover:shadow-sm" :
                      opt === q.a ? "bg-green-50 border-green-500 text-green-700" :
                      opt === selected ? "bg-red-50 border-red-500 text-red-700" : "bg-white border-slate-50 text-slate-300 opacity-60"
                    }`}>
                      {opt}
                      <TransLine text={optTrans} lang={lang} />
                    </button>
                  );
                })}
              </div>
              <div className="flex gap-3 mt-8">
                {currentIdx > 0 && (
                  <button onClick={prev} className="flex-1 bg-white text-slate-700 font-bold py-4 rounded-xl shadow-sm border-2 border-slate-100 hover:border-slate-300 transition-all active:scale-95">
                    {ui('backBtn')}
                  </button>
                )}
                {selected && (
                  <button onClick={next} className="flex-1 bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 animate-bounce-subtle">
                    {currentIdx + 1 === allQuestions.length ? ui('showResult') : ui('nextBtn')}
                  </button>
                )}
              </div>
            </div>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <style>
    @keyframes bounce-subtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce-subtle {
      animation: bounce-subtle 2s infinite ease-in-out;
    }
  </style>
</body>
</html>
