<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pluggmaterial – Familje- och arvsrätt | Juridik 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --p:  #0d9488;
    --pl: #f0fdfa;
    --pb: #ccfbf1;
    --pd: #134e4a;
    --p-deep: #0f766e;
    --line: #99f6e4;
  }
  * { box-sizing: border-box; }
  body { font-family: 'EB Garamond', serif; font-size: 1.1rem; background:#f8fafc; color:#1e293b; margin:0; }
  h1,h2,h3,h4,.fredoka { font-family: 'Fredoka', sans-serif; }

  .wrap { max-width: 74rem; margin: 0 auto; padding: 1.6rem 1.25rem 4rem; }

  /* ── Tillbaka ── */
  .back {
    display:inline-flex; align-items:center; gap:.35rem; font-family:'Fredoka',sans-serif;
    font-size:.88rem; color:#64748b; text-decoration:none; transition:color .15s;
  }
  .back:hover { color: var(--p-deep); }

  /* ── Header ── */
  .head { text-align:center; margin: 1.8rem 0 1.6rem; }
  .eyebrow {
    font-family:'Fredoka',sans-serif; font-size:.72rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.22em; color:var(--p-deep); margin:0 0 .5rem;
  }
  .head h1 {
    font-size: clamp(2rem, 6vw, 2.9rem); font-weight:700; font-style:italic;
    color:#0f172a; margin:0; line-height:1.1;
  }
  .rule { height:.25rem; width:5rem; border-radius:999px; background:var(--p); margin:.9rem auto 1.1rem; }
  .lead { font-size:1.02rem; color:#475569; max-width:36rem; margin:0 auto; line-height:1.7; }
  .lead strong { color:var(--p-deep); font-weight:700; }

  /* ── Lägesväxlare ── */
  .pill-toggle {
    display:flex; gap:.3rem; justify-content:center; background:#fff; border:1px solid #e2e8f0;
    border-radius:999px; padding:.3rem; width:fit-content; margin:0 auto .6rem;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .pill-toggle button {
    padding: .5rem 1.4rem; border-radius: 999px; font-family:'Fredoka',sans-serif;
    font-weight: 600; font-size: .95rem; transition: all .2s; border: none; cursor: pointer;
  }
  .pill-toggle button.active   { background: var(--p-deep); color: #fff; box-shadow:0 2px 8px rgba(13,148,136,.35); }
  .pill-toggle button.inactive { background: transparent; color: #64748b; }
  .pill-toggle button.inactive:hover { color: var(--p-deep); }
  .mode-note {
    text-align:center; font-family:'Fredoka',sans-serif; font-size:.85rem; color:#64748b;
    margin:0 0 1.6rem;
  }

  /* ── Layout: sticky innehållsförteckning + innehåll ── */
  .layout { display:grid; grid-template-columns: 16.5rem minmax(0,1fr); gap:2rem; align-items:start; }
  .toc {
    position:sticky; top:1rem; max-height:calc(100vh - 2rem); overflow-y:auto;
    background:#fff; border:1px solid #e2e8f0; border-radius:1.2rem;
    padding:.9rem .8rem; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .toc-h {
    font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; color:var(--p-deep); margin:.2rem .3rem .4rem;
  }
  .toc-del {
    font-family:'Fredoka',sans-serif; font-size:.74rem; font-weight:700; color:#475569;
    margin:.8rem .4rem .25rem; padding-top:.6rem; border-top:1px solid #f1f5f9;
  }
  .toc-del:first-of-type { border-top:none; padding-top:0; margin-top:.2rem; }
  .toc-btn { display:none; }
  .toc-list a {
    display:flex; align-items:center; gap:.55rem; padding:.42rem .5rem; border-radius:.75rem;
    color:#334155; text-decoration:none; transition:background .15s; line-height:1.3; font-size:.98rem;
  }
  .toc-list a:hover { background: var(--pl); }
  .toc-list a.active { background: var(--pl); color:var(--pd); font-weight:700; }
  .toc-n {
    flex:none; min-width:2.1rem; height:1.5rem; border-radius:.55rem; background:var(--pl); color:var(--pd);
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:.76rem;
    display:flex; align-items:center; justify-content:center; padding:0 .3rem;
  }
  .toc-list a.active .toc-n { background:var(--p); color:#fff; }
  .toc-t { flex:1; }

  /* ── Delrubriker ── */
  .del-head {
    margin: .4rem 0 1.4rem; padding: 1.2rem 1.3rem; border-radius: 1.4rem;
    background: var(--p-deep); color:#fff; scroll-margin-top:1rem;
  }
  .del-head .del-nr { font-family:'Fredoka',sans-serif; font-size:.74rem; font-weight:600; text-transform:uppercase;
                      letter-spacing:.2em; opacity:.85; margin:0 0 .2rem; }
  .del-head h2 { font-size:1.6rem; font-weight:700; font-style:italic; margin:0; font-family:'EB Garamond',serif; }
  .del-head p.del-lead { margin:.35rem 0 0; line-height:1.6; opacity:.95; }

  /* ── Avsnitt ── */
  .sec { margin-bottom: 2.6rem; scroll-margin-top: 1rem; }
  .sec-head {
    display:flex; align-items:center; gap:.9rem;
    background:#fff; border-left:8px solid var(--p);
    border-radius:1rem; padding:1.05rem 1.2rem; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .sec-emoji { flex:none; font-size:1.6rem; line-height:1; }
  .sec-title { font-size:1.45rem; font-weight:600; color:#0f172a; line-height:1.25; margin:0; }
  .sec-title .nr { color:var(--p-deep); margin-right:.35rem; }
  .ingress {
    margin:.9rem .3rem 0; padding:.75rem 1rem; background:#fff; border:1px solid var(--line);
    border-radius:.9rem; color:#334155; line-height:1.65; font-size:1.04rem;
  }
  .ingress b { font-family:'Fredoka',sans-serif; color:var(--p-deep); font-weight:600; font-size:.78rem;
               text-transform:uppercase; letter-spacing:.1em; display:block; margin-bottom:.15rem; }

  /* ── Brödtext ── */
  .block { padding: .2rem .3rem 0; }
  .block h3 { font-size:1.12rem; font-weight:600; color:var(--pd); margin:1.5rem 0 .15rem; }
  .block p { margin:.55rem 0; line-height:1.85; color:#1e293b; }
  .block .term { color:var(--p-deep); font-weight:700; }
  .block ul { list-style:none; padding:0; margin:.6rem 0; }
  .block ul li { position:relative; padding:.22rem 0 .22rem 1.5rem; color:#1e293b; line-height:1.7; }
  .block ul li::before { content:'→'; position:absolute; left:0; color:var(--p); font-weight:700; }

  /* ── Citat ur källan ── */
  .citat {
    margin:1.1rem 0; padding:1rem 1.2rem 1rem 3rem; background:#fff; border-radius:1rem;
    border:1px solid #e2e8f0; position:relative; color:#1e293b; font-style:italic; line-height:1.75;
  }
  .citat::before { content:'\201D'; position:absolute; left:.8rem; top:.2rem; font-size:3rem;
                   color:var(--p); font-family:Georgia,serif; font-style:normal; line-height:1; }
  .citat-k { display:block; margin-top:.4rem; font-style:normal; font-family:'Fredoka',sans-serif;
             font-size:.8rem; color:#64748b; }

  /* ── Fördjupningsruta ── */
  .ruta {
    background:#fff; border:2px dashed var(--p); border-radius:1rem;
    padding:.8rem 1.1rem; margin:1.2rem 0;
  }
  .ruta-h { font-family:'Fredoka',sans-serif; font-weight:700; color:var(--p-deep); font-size:.92rem; margin-bottom:.1rem; }

  /* ── Exempel / fall ── */
  .case {
    background:#fff; border:1px solid #e2e8f0; border-left:5px solid var(--p);
    border-radius:0 1rem 1rem 0; padding:.9rem 1.15rem .7rem; margin:1.6rem 0 0;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .case-h { font-family:'Fredoka',sans-serif; font-weight:700; color:var(--pd); font-size:1rem; margin-bottom:.15rem; }
  .case-tag { display:inline-block; font-family:'Fredoka',sans-serif; font-size:.68rem; font-weight:600;
              text-transform:uppercase; letter-spacing:.08em; color:#64748b; background:#f1f5f9;
              border-radius:999px; padding:.1rem .55rem; margin-left:.4rem; vertical-align:middle; }
  .case h3 { margin-top:1rem; font-size:1.02rem; }
  .case p, .case li { font-size:1.02rem; }

  /* ── Nyckelbegrepp ── */
  .nyckel {
    background:#fff; border:2px solid var(--line); border-radius:1.2rem;
    padding:1rem 1.25rem; margin:1.6rem 0 0;
  }
  .nyckel-h { font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:700; color:var(--pd); margin-bottom:.4rem; }
  .nyckel dl { margin:0; }
  .nb { padding:.45rem 0; border-top:1px solid #f1f5f9; line-height:1.6; }
  .nb:first-child { border-top:none; }
  .nb dt { font-weight:700; color:var(--p-deep); display:inline; }
  .nb dt::after { content:' – '; font-weight:400; color:#94a3b8; }
  .nb dd { display:inline; margin:0; color:#1e293b; }
  .nyckel-k { font-family:'Fredoka',sans-serif; font-size:.74rem; color:#64748b; margin-top:.4rem; }

  /* ── Kom ihåg ── */
  .komihag {
    background:var(--pl); border:2px solid var(--p); border-radius:1.2rem;
    padding:1.05rem 1.3rem; margin:1.2rem 0 .4rem;
  }
  .komihag-h { font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:700; color:var(--pd); margin-bottom:.45rem; }
  .komihag ul { list-style:none; padding:0; margin:0; }
  .komihag li { position:relative; padding:.26rem 0 .26rem 1.6rem; color:var(--pd); line-height:1.65; }
  .block .komihag li::before, .komihag li::before { content:'✓'; position:absolute; left:0; font-weight:700; color:var(--p-deep); }
  .komihag .term { font-weight:700; color:var(--p-deep); }

  /* ── Inbyggda diagram (SVG) ── */
  .diagram { margin:1.4rem 0; background:#fff; border:1px solid #e2e8f0; border-radius:1.2rem; padding:1rem 1rem .8rem; }
  .diagram svg { display:block; width:100%; height:auto; max-width:36rem; margin:0 auto; }
  .diagram svg text { font-family:'Fredoka',sans-serif; }
  .diagram figcaption { font-size:.95rem; color:#475569; line-height:1.6; margin-top:.6rem; text-align:center; }
  .diagram figcaption .term { font-family:'Fredoka',sans-serif; color:var(--pd); font-weight:600; }

  /* ── Tabell ── */
  .tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:.8rem 0; }
  .tbl { border-collapse:collapse; width:100%; font-size:.97rem; background:#fff; border:1px solid #e2e8f0; }
  .tbl th, .tbl td { padding:.5rem .7rem; text-align:left; border-bottom:1px solid #e2e8f0; vertical-align:top; line-height:1.45; }
  .tbl th { font-family:'Fredoka',sans-serif; font-size:.74rem; text-transform:uppercase;
            letter-spacing:.06em; color:var(--pd); background:var(--pl); }
  .tbl td.num, .tbl th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tbl tfoot td { font-weight:700; color:var(--pd); background:var(--pl); border-bottom:none; }

  .to-top { text-align:center; margin:1rem 0 .2rem; }
  .to-top a { font-family:'Fredoka',sans-serif; font-size:.8rem; color:#64748b; text-decoration:none; }
  .to-top a:hover { color:var(--p-deep); }

  /* ── Sammanfattning ── */
  .summary { background:#fff; border-top:8px solid var(--p); border-radius:1.5rem; padding:1.3rem 1.4rem 1.2rem;
             box-shadow:0 1px 3px rgba(0,0,0,.06); scroll-margin-top:1rem; }
  .summary h2 { font-size:1.4rem; font-weight:600; margin:0 0 .8rem; color:#0f172a; }
  .sum-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
  .sum-col { background:var(--pl); border-radius:1rem; padding:.9rem 1rem; }
  .sum-col h3 { font-size:.98rem; font-weight:700; color:var(--pd); margin:0 0 .4rem; }
  .sum-col ul { list-style:none; padding:0; margin:0; }
  .sum-col li { position:relative; padding:.22rem 0 .22rem 1.3rem; line-height:1.55; font-size:1rem; }
  .sum-col li::before { content:'✓'; position:absolute; left:0; color:var(--p-deep); font-weight:700; }
  .sum-col .term { color:var(--p-deep); font-weight:700; }

  /* ── Öva vidare ── */
  .next {
    background:#fff; border-top:8px solid var(--p); border-radius:1.5rem;
    padding:1.4rem 1.4rem 1.5rem; margin-top:2rem; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .next h2 { font-size:1.3rem; font-weight:600; margin:0 0 .3rem; color:#0f172a; }
  .next p { margin:0 0 1rem; color:#475569; line-height:1.6; }
  .next-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.7rem; }
  .next-btn {
    display:flex; align-items:center; gap:.6rem; padding:.85rem 1rem; border-radius:1rem;
    font-family:'Fredoka',sans-serif; font-weight:600; text-decoration:none; transition:transform .15s, background .15s;
  }
  .next-btn:hover { transform:translateY(-2px); }
  .next-btn.primary { background:var(--p-deep); color:#fff; }
  .next-btn.ghost { background:var(--pl); color:var(--pd); border:1px solid var(--line); }
  .next-btn.wide { grid-column:1 / -1; }

  /* ── Footer ── */
  .foot { text-align:center; margin-top:3rem; color:#64748b; font-size:.88rem; line-height:1.7; }
  .foot .by { font-style:italic; }

  /* ── Mobil ── */
  @media (max-width: 767px) {
    body { font-size: 1.04rem; }
    .wrap { padding: 1.2rem .9rem 3rem; }
    .layout { display:block; }
    .toc { position:sticky; top:0; z-index:30; max-height:none; overflow:visible;
           border-radius:0 0 1rem 1rem; margin:0 -.9rem 1.4rem; padding:.5rem .9rem;
           border-top:none; border-left:none; border-right:none; }
    .toc-h { display:none; }
    .toc-btn { display:flex; width:100%; align-items:center; justify-content:space-between; gap:.6rem;
               background:var(--pl); color:var(--pd); border:none; border-radius:.8rem; padding:.6rem .9rem;
               font-family:'Fredoka',sans-serif; font-weight:600; font-size:.95rem; cursor:pointer; text-align:left; }
    .toc-btn-t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .toc-list { display:none; max-height:60vh; overflow-y:auto; padding-top:.4rem; }
    .toc.open .toc-list { display:block; }
    .sec, .del-head, .summary { scroll-margin-top: 4.2rem; }
    .sec-title { font-size: 1.2rem; }
    .sec-head { padding: .85rem .9rem; gap:.65rem; border-left-width:6px; }
    .sec-emoji { font-size:1.35rem; }
    .del-head h2 { font-size:1.35rem; }
    .block { padding: .2rem 0 0; }
    .block h3 { font-size: 1.05rem; }
    .block p  { line-height: 1.75; }
    .pill-toggle button { padding:.45rem 1.05rem; font-size:.9rem; }
    .next-grid, .sum-grid { grid-template-columns:1fr; }
    .tbl { font-size:.9rem; }
    .tbl th, .tbl td { padding:.45rem .5rem; }
    .citat { padding:.9rem 1rem .9rem 2.4rem; }
    .citat::before { left:.5rem; font-size:2.4rem; }
    .diagram { padding:.7rem .35rem .6rem; }
    .case { padding:.8rem .9rem .6rem; }
    .nyckel, .komihag { padding:.9rem 1rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>

/* ---------- Textformatering: **term** -> markerad fackterm, *ord* -> kursiv ---------- */
function fmt(text) {
  const parts = String(text).split(/(\*\*.+?\*\*|\*[^*\s][^*]*?\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith('**') && part.endsWith('**') && part.length > 4)
      return <strong key={i} className="term">{part.slice(2, -2)}</strong>;
    if (part.startsWith('*') && part.endsWith('*') && part.length > 2)
      return <em key={i}>{part.slice(1, -1)}</em>;
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
}

const C = {
  p: '#0d9488', pl: '#f0fdfa', pb: '#ccfbf1', pd: '#134e4a', deep: '#0f766e',
  ax: '#334155', mute: '#64748b', line: '#cbd5e1', grey: '#f1f5f9', red: '#b91c1c', redl: '#fef2f2'
};

/* Flerradig text: varje rad blir en <tspan>. */
function Lines({ x, y, lines, size = 16, lh = 1.3, anchor = 'start', weight = 400, fill = C.ax }) {
  return (
    <text x={x} y={y} fontSize={size} textAnchor={anchor} fontWeight={weight} fill={fill}>
      {lines.map((l, i) => <tspan key={i} x={x} dy={i === 0 ? 0 : size * lh}>{l}</tspan>)}
    </text>
  );
}
/* Första baslinjen så att n rader hamnar vertikalt centrerade i en ruta. */
const midY = (top, h, n, size = 16, lh = 1.3) => top + h / 2 + size * 0.35 - (n - 1) * size * lh / 2;

function Marker({ id, color = C.ax }) {
  return (
    <defs>
      <marker id={id} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill={color} />
      </marker>
    </defs>
  );
}

function Tabell({ t }) {
  return (
    <div className="tbl-wrap">
      <table className="tbl">
        <thead><tr>{t.huvud.map((h, i) => <th key={i} className={i > 0 ? 'num' : ''}>{h}</th>)}</tr></thead>
        <tbody>
          {t.rader.map((r, i) => (
            <tr key={i}>{r.map((c, j) => <td key={j} className={j > 0 && /^[−\d]/.test(c) ? 'num' : ''}>{fmt(c)}</td>)}</tr>
          ))}
        </tbody>
        {t.summa && (
          <tfoot><tr>{t.summa.map((c, j) => <td key={j} className={j > 0 ? 'num' : ''}>{c}</td>)}</tr></tfoot>
        )}
      </table>
    </div>
  );
}

function Items({ list }) {
  return (list || []).map((it, i) => {
    if (typeof it === 'string') return <p key={i}>{fmt(it)}</p>;
    if (it.h) return <h3 key={i}>{it.h}</h3>;
    if (it.lista) return <ul key={i}>{it.lista.map((t, j) => <li key={j}>{fmt(t)}</li>)}</ul>;
    if (it.citat) return (
      <blockquote className="citat" key={i}>
        {fmt(it.citat)}
        {it.kalla && <span className="citat-k">— {it.kalla}</span>}
      </blockquote>
    );
    if (it.tabell) return <Tabell key={i} t={it.tabell} />;
    if (it.ruta) return (
      <div className="ruta" key={i}>
        <div className="ruta-h">🔎 {it.ruta.h}</div>
        <Items list={it.ruta.p} />
      </div>
    );
    return null;
  });
}

        ))}
      </dl>
      {egen && <div className="nyckel-k">Begreppet finns inte i begreppsövningen – förklaringen kommer från kurstexten.</div>}
    </div>
  );
}

function Section({ sec, mode }) {
  const text = mode === 'lattlast' ? sec.lattlast : sec.fordjupning;
  return (
    <section id={sec.id} className="sec">
      <div className="sec-head">
        <span className="sec-emoji" aria-hidden="true">{sec.emoji}</span>
        <h2 className="sec-title"><span className="nr">{sec.nr}</span>{sec.rubrik}</h2>
      </div>
      <p className="ingress"><b>🤔 Fundera först</b>{fmt(sec.hook)}</p>

      <div className="block">
        <Items list={text} />

        {(sec.diagram || []).map(id => <Diagram key={id} id={id} />)}

        {sec.fall && (
          <div className="case">
            <div className="case-h">📌 {sec.fall.titel}{sec.fall.tag && <span className="case-tag">{sec.fall.tag}</span>}</div>
            <Items list={sec.fall.text} />
          </div>
        )}

        <Nyckelbegrepp list={sec.begrepp} />

        <div className="komihag">
          <div className="komihag-h">💡 Kom ihåg</div>
          <ul>{sec.komihag.map((t, i) => <li key={i}>{fmt(t)}</li>)}</ul>
        </div>

        <div className="to-top">
          <a href="#toppen" onClick={(e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }}>↑ Till toppen</a>
        </div>
      </div>
    </section>
  );
}

/* ===================== APP ===================== */

function App() {
  /* Läget sparas bara i sessionStorage under egen nyckel. */
  const [mode, setMode] = useState(() => {
    try {
      const saved = sessionStorage.getItem(PAGE.storeKey);
      if (saved === 'lattlast' || saved === 'fordjupning') return saved;
    } catch (e) {}
    return 'lattlast';
  });
  const [active, setActive] = useState(SECTIONS[0].id);
  const [tocOpen, setTocOpen] = useState(false);

  useEffect(() => {
    try { sessionStorage.setItem(PAGE.storeKey, mode); } catch (e) {}
  }, [mode]);

  /* Markera aktuellt avsnitt i innehållsförteckningen. */
  useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(entries => {
      const vis = entries.filter(en => en.isIntersecting)
                         .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis.length) setActive(vis[0].target.id);
    }, { rootMargin: '-15% 0px -70% 0px' });
    [...SECTIONS.map(s => s.id), 'sammanfattning'].forEach(id => {
      const el = document.getElementById(id);
      if (el) io.observe(el);
    });
    return () => io.disconnect();
  }, []);

  /* Djuplänk: scrolla till avsnittet i URL:ens hash när sidan laddats. */
  useEffect(() => {
    const id = decodeURIComponent((window.location.hash || '').replace('#', ''));
    if (!id) return;
    window.setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ block: 'start' });
    }, 150);
  }, []);

  const goto = (e, id) => {
    e.preventDefault();
    setTocOpen(false);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { history.replaceState(null, '', '#' + id); } catch (err) {}
  };

  const activeSec = SECTIONS.find(s => s.id === active);
  const activeLabel = activeSec ? activeSec.nr + ' ' + activeSec.rubrik : 'Sammanfattning';

  return (
    <div className="wrap" id="toppen">

      <a href={PAGE.hub} className="back" onClick={(e) => jur1GoBack(e, PAGE.hub)}>
        ← Tillbaka till Familje- och arvsrätt
      </a>

      <header className="head">
        <p className="eyebrow">{PAGE.eyebrow}</p>
        <h1>{PAGE.titel}</h1>
        <div className="rule"></div>
        <p className="lead">
          Pluggmaterial i tre delar och {SECTIONS.length} avsnitt. Välj <strong>Lättläst</strong> för korta meningar
          och en tanke i taget, eller <strong>Fördjupning</strong> för resonemang, undantag och samband.
        </p>
      </header>

      <div className="pill-toggle" role="tablist" aria-label="Välj läge">
        <button role="tab" aria-selected={mode === 'lattlast'}
                className={mode === 'lattlast' ? 'active' : 'inactive'}
                onClick={() => setMode('lattlast')}>Lättläst</button>
        <button role="tab" aria-selected={mode === 'fordjupning'}
                className={mode === 'fordjupning' ? 'active' : 'inactive'}
                onClick={() => setMode('fordjupning')}>Fördjupning</button>
      </div>
      <p className="mode-note" aria-live="polite">
        {mode === 'lattlast'
          ? 'Lättläst: korta meningar och en tanke i taget. Fackorden förklaras första gången.'
          : 'Fördjupning: samma avsnitt och fackord, men med resonemang, undantag och kopplingar.'}
      </p>

      <div className="layout">
        <nav className={'toc' + (tocOpen ? ' open' : '')} aria-label="Innehåll">
          <button className="toc-btn" onClick={() => setTocOpen(o => !o)} aria-expanded={tocOpen}>
            <span className="toc-btn-t">☰ {activeLabel}</span>
            <span aria-hidden="true">{tocOpen ? '▲' : '▼'}</span>
          </button>
          <div className="toc-h">Innehåll</div>
          <div className="toc-list">
            {DELAR.map(d => (
              <React.Fragment key={d.id}>
                <div className="toc-del">{d.nr} · {d.titel}</div>
                {d.sections.map(s => (
                  <a href={'#' + s.id} key={s.id} onClick={(e) => goto(e, s.id)}
                     className={s.id === active ? 'active' : ''}>
                    <span className="toc-n">{s.nr}</span>
                    <span className="toc-t">{s.rubrik}</span>
                  </a>
                ))}
              </React.Fragment>
            ))}
            <div className="toc-del">Avslutning</div>
            <a href="#sammanfattning" onClick={(e) => goto(e, 'sammanfattning')}
               className={active === 'sammanfattning' ? 'active' : ''}>
              <span className="toc-n">★</span>
              <span className="toc-t">Sammanfattning</span>
            </a>
          </div>
        </nav>

        <main>
          {DELAR.map(d => (
            <React.Fragment key={d.id}>
              <div className="del-head" id={d.id}>
                <p className="del-nr">{d.nr}</p>
                <h2>{d.titel}</h2>
                <p className="del-lead">{d.lead}</p>
              </div>
              {d.sections.map(s => <Section key={s.id} sec={s} mode={mode} />)}
            </React.Fragment>
          ))}

          <section className="summary" id="sammanfattning" aria-label="Sammanfattning">
            <h2>📝 Sammanfattning</h2>
            <div className="sum-grid">
              {SAMMANFATTNING.map(col => (
                <div className="sum-col" key={col.h}>
                  <h3>{col.h}</h3>
                  <ul>{col.lista.map((t, i) => <li key={i}>{fmt(t)}</li>)}</ul>
                </div>
              ))}
            </div>
          </section>

          <section className="next" aria-label="Öva vidare">
            <h2>Öva vidare</h2>
            <p>Har du läst klart? Testa dig själv på områdets begrepp och quiz.</p>
            <div className="next-grid">
              <a className="next-btn ghost" href="jur1_block2_begrepp.html">📖 Öva på begrepp</a>
              <a className="next-btn primary" href="jur1_block2_quiz.html">🎯 Starta quizet</a>
              <a className="next-btn ghost wide" href={PAGE.hub}>📚 Till Familje- och arvsrätt</a>
            </div>
          </section>

          <footer className="foot">
            <p>Källa: {PAGE.kalla}</p>
            <p className="by">Designad av John</p>
          </footer>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
