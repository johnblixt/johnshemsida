    function isCorrectAnswer(val, term) {
      const v = val.trim().toLowerCase();
      const full = term.toLowerCase();
      const simplified = term.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
      const abbrevs = { 'konstitutionsutskottet (ku)': ['ku'], 'justitieombudsmannen (jo)': ['jo'], 'statens offentliga utredningar (sou)': ['sou'] };
      const extras = abbrevs[full] || [];
      return v === full || v === simplified || extras.includes(v);
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function ListaView() {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [countdown, setCountdown] = useState(4);
      const [done, setDone] = useState(false);

      useEffect(() => {
        if (!done && currentIdx < items.length) {
          const timer = setInterval(() => {
            setCountdown((c) => {
              if (c <= 1) {
                clearInterval(timer);
                return 0;
              }
              return c - 1;
            });
          }, 1000);
          return () => clearInterval(timer);
        }
      }, [currentIdx, done]);

      const handleNext = () => {
        if (currentIdx + 1 >= items.length) {
          const now = new Date().toLocaleDateString('sv-SE');
          const data = { completedDate: now, completedAt: new Date().toISOString() };
          localStorage.setItem('begrepp_demokrati_lista', JSON.stringify(data));
          setDone(true);
        } else {
          setCurrentIdx(currentIdx + 1);
          setCountdown(4);
        }
      };

      if (done) {
        return (
          <div className="flex flex-col items-center gap-6">
            <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
              <div className="text-5xl mb-4">✅</div>
              <p className="text-2xl font-bold text-green-700 mb-2">Klar!</p>
              <p className="text-slate-600">Du läste alla begrepp den {new Date().toLocaleDateString('sv-SE')}</p>
            </div>
          </div>
        );
      }

      const current = items[currentIdx];
      const isLastItem = currentIdx === items.length - 1;

      return (
        <div className="flex flex-col items-center gap-6">
          <div className="w-full max-w-lg">
            <div className="flex justify-between items-center mb-3">
              <p className="text-sm font-bold text-slate-700">{currentIdx + 1} / {items.length} begrepp</p>
            </div>
            <div className="w-full bg-slate-200 rounded-full h-2">
              <div
                className="h-2 rounded-full transition-all"
                style={{
                  width: `${((currentIdx + 1) / items.length) * 100}%`,
                  background: PRIMARY,
                }}
              />
            </div>
          </div>

          <div
            className="bg-white rounded-2xl shadow-sm px-6 py-6 w-full max-w-lg"
            style={{ borderLeft: '8px solid #fbbf24' }}
          >
            <div className="mb-4">
              <span
                className="font-bold text-xs px-2 py-1 rounded-full"
                style={{ background: '#fef9c3', color: '#78350f' }}
              >
                {currentIdx + 1}
              </span>
            </div>
            <p className="text-3xl font-bold text-slate-800 mb-4">{current.term}</p>
            <p className="text-slate-600 text-lg leading-relaxed">{current.definition}</p>
          </div>

          <button
            onClick={handleNext}
            disabled={countdown > 0}
            className="px-8 py-3 rounded-2xl font-bold text-white transition-all"
            style={{
              background: countdown > 0 ? '#cbd5e1' : PRIMARY,
              opacity: countdown > 0 ? 0.6 : 1,
              cursor: countdown > 0 ? 'not-allowed' : 'pointer',
            }}
          >
            {countdown > 0 ? `Nästa (${countdown})` : isLastItem ? 'Klar ✓' : 'Nästa →'}
          </button>
        </div>
      );
    }

    function LucktextView() {
      const [answers, setAnswers] = useState(items.map(() => ({ value: '', status: 'idle' })));
      const [done, setDone] = useState(false);

      const correctCount = answers.filter(a => a.status === 'correct').length;

      const update = (idx, changes) => setAnswers(prev => {
        const n = [...prev]; n[idx] = { ...n[idx], ...changes }; return n;
      });

      const handleSubmit = (idx) => {
        const { value, status } = answers[idx];
        if (status === 'correct' || status === 'corrected') return;
        if (!value.trim()) return;
        if (isCorrectAnswer(value, items[idx].term)) {
          update(idx, { value: items[idx].term, status: 'correct' });
        } else {
          update(idx, { status: status === 'idle' ? 'warn1' : 'warn2' });
        }
      };

      const ratteAlla = () => {
        setAnswers(prev => prev.map((a, i) =>
          a.status === 'correct' ? a : { value: items[i].term, status: 'corrected' }
        ));
        setDone(true);
      };

      const restart = () => {
        setAnswers(items.map(() => ({ value: '', status: 'idle' })));
        setDone(false);
      };

      const getFeedback = (score, total) => {
        const p = score / total;
        if (p === 1) return 'Perfekt! Alla rätt!';
        if (p >= 0.8) return 'Utmärkt! Du kan de flesta begreppen.';
        if (p >= 0.6) return 'Bra! Fortsätt öva på de du missade.';
        if (p >= 0.4) return 'Du är på rätt väg — repetera gärna listan.';
        return 'Öva på begreppslistan och försök igen!';
      };

      const borderColors = { idle: '#e2e8f0', warn1: '#fb923c', warn2: '#f87171', correct: '#4ade80', corrected: '#f87171' };
      const bgColors     = { idle: '#ffffff',  warn1: '#fff7ed',  warn2: '#fef2f2',  correct: '#f0fdf4',  corrected: '#fef2f2' };

      return (
        <div>
          {/* Concept bank */}
          <div className="bg-white rounded-2xl p-4 shadow-sm mb-5">
            <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3">Begreppsbank</p>
            <div className="flex flex-wrap gap-2">
              {items.map((item, i) => {
                const st = answers[i].status;
                const done_ = st === 'correct' || st === 'corrected';
                return (
                  <span key={i} className="text-xs font-medium px-3 py-1 rounded-full border transition-all"
                    style={done_
                      ? { textDecoration: 'line-through', color: st === 'correct' ? '#4ade80' : '#fca5a5', background: st === 'correct' ? '#f0fdf4' : '#fef2f2', borderColor: st === 'correct' ? '#bbf7d0' : '#fecaca' }
                      : { color: '#78350f', background: '#fef9c3', borderColor: '#fde68a' }
                    }
                  >{item.term}</span>
                );
              })}
            </div>
          </div>

          {/* Controls bar */}
          <div className="flex items-center justify-between mb-5">
            <p className="font-bold text-slate-700 text-sm">{correctCount} / {items.length} rätt</p>
            {!done
              ? <button onClick={ratteAlla} className="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-slate-800 transition-colors">Rätta alla</button>
              : <button onClick={restart} className="text-white px-4 py-2 rounded-xl text-sm font-bold transition-colors" style={{ background: PRIMARY }}>Börja om</button>
            }
          </div>

          {/* Score banner */}
          {done && (
            <div className="rounded-2xl p-4 mb-6 text-center border-2 font-bold"
              style={correctCount === items.length
                ? { background: '#f0fdf4', color: '#15803d', borderColor: '#4ade80' }
                : { background: '#fefce8', color: '#78350f', borderColor: PRIMARY }
              }
            >
              <p className="text-3xl mb-1">{correctCount} / {items.length}</p>
              <p className="text-base font-medium">{getFeedback(correctCount, items.length)}</p>
            </div>
          )}

          {/* Sentences */}
          <div className="flex flex-col gap-4">
            {items.map((item, idx) => {
              const ans = answers[idx];
              const parts = item.sentence.split('___');
              const isLocked = ans.status === 'correct' || ans.status === 'corrected';
              const inputBorder = { idle: '#cbd5e1', warn1: '#fb923c', warn2: '#f87171', correct: '#4ade80', corrected: '#f87171' }[ans.status];
              const inputBg    = { idle: '#ffffff',  warn1: '#fff7ed',  warn2: '#fef2f2',  correct: '#f0fdf4',  corrected: '#fef2f2' }[ans.status];
              const inputColor = { idle: '#1e293b',  warn1: '#1e293b',  warn2: '#1e293b',  correct: '#15803d',  corrected: '#b91c1c' }[ans.status];

              return (
                <div key={idx} className="rounded-2xl px-5 py-4 shadow-sm transition-colors"
                  style={{ borderLeft: `8px solid ${borderColors[ans.status]}`, background: bgColors[ans.status] }}
                >
                  <div className="flex flex-wrap items-baseline gap-x-1 gap-y-2 text-slate-700 leading-relaxed">
                    <span className="font-bold text-xs shrink-0 px-2 py-0.5 rounded-full" style={{ background: '#fef9c3', color: '#78350f' }}>{idx + 1}</span>
                    <span>{parts[0]}</span>
                    <input
                      type="text"
                      className="border-b-2 px-2 py-0.5 text-sm font-bold outline-none rounded transition-colors"
                      style={{ minWidth: '9rem', borderColor: inputBorder, background: inputBg, color: inputColor }}
                      value={ans.value}
                      placeholder="Skriv begreppet…"
                      disabled={isLocked}
                      onChange={e => !isLocked && update(idx, { value: e.target.value })}
                      onKeyDown={e => e.key === 'Enter' && !isLocked && handleSubmit(idx)}
                    />
                    {parts[1] && <span>{parts[1]}</span>}
                  </div>
                  {ans.status === 'warn1' && <p className="text-orange-600 text-sm mt-2 font-medium">Är du säker att du stavat rätt?</p>}
                  {ans.status === 'warn2' && <p className="text-red-600 text-sm mt-2 font-medium">Fel svar — försök igen eller tryck "Rätta alla".</p>}
                  {ans.status === 'correct' && <p className="text-green-700 text-sm mt-2">{item.definition}</p>}
                  {ans.status === 'corrected' && (
                    <div className="mt-2">
                      <p className="text-red-600 text-sm font-medium">Rätt svar: <span className="font-bold">{item.term}</span></p>
                      <p className="text-slate-500 text-sm">{item.definition}</p>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {done && (
            <div className="flex justify-center mt-8 mb-4">
              <button onClick={restart} className="text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>Börja om</button>
            </div>
          )}
        </div>
      );
    }

    function FlashcardView() {
      const total = items.length;
      const [deck, setDeck] = useState(() => shuffleArray([...items]));
      const [deckIdx, setDeckIdx] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [kudeInte, setKudeInte] = useState([]);
      const [kunde, setKunde] = useState([]);
      const [phase, setPhase] = useState('playing');

      const restartAll = () => {
        setDeck(shuffleArray([...items]));
        setDeckIdx(0);
        setIsFlipped(false);
        setKudeInte([]);
        setKunde([]);
        setPhase('playing');
      };

      const sort = (pile) => {
        const card = deck[deckIdx];
        const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
        const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
        const nextIdx = deckIdx + 1;
        setKudeInte(newKudeInte);
        setKunde(newKunde);
        setIsFlipped(false);
        if (nextIdx >= deck.length) {
          setDeckIdx(nextIdx);
          setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
        } else {
          setDeckIdx(nextIdx);
        }
      };

      const nextRound = () => {
        setDeck(shuffleArray([...kudeInte]));
        setDeckIdx(0);
        setIsFlipped(false);
        setKudeInte([]);
        setPhase('playing');
      };

      if (phase === 'allDone') return (
        <div className="flex flex-col items-center gap-6">
          <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
            <div className="text-5xl mb-4">🎉</div>
            <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
            <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
            <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>Börja om med alla</button>
          </div>
        </div>
      );

      if (phase === 'roundEnd') return (
        <div className="flex flex-col items-center gap-6">
          <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
            <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
            <div className="flex justify-center gap-8 mb-6">
              <div className="text-center">
                <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
              </div>
              <div className="text-center">
                <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
              </div>
            </div>
            <div className="flex flex-col gap-3">
              <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
                Öva på Kunde inte ({kudeInte.length} kort) →
              </button>
              <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
                Börja om med alla
              </button>
            </div>
          </div>
        </div>
      );

      const card = deck[deckIdx];
      const remaining = deck.length - deckIdx;

      return (
        <div className="flex flex-col items-center">

    function IckeExempelView() {
      const buildQuestions = () =>
        shuffleArray(items.map((item, i) => {
          const d = ickeExempelData[i];
          const aIsCorrect = Math.random() < 0.5;
          return {
            term: item.term,
            optionA: aIsCorrect ? d.correct : d.trap,
            optionB: aIsCorrect ? d.trap : d.correct,
            correct: aIsCorrect ? 'A' : 'B',
            explanation: d.explanation,
          };
        }));

      const [questions, setQuestions] = useState(buildQuestions);
      const [idx, setIdx] = useState(0);
      const [chosen, setChosen] = useState(null);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);

      const q = questions[idx];
      const isRight = chosen === q.correct;

      const pick = (choice) => {
        if (chosen) return;
        setChosen(choice);
        if (choice === q.correct) setScore(s => s + 1);
      };

      const next = () => {
        if (idx + 1 >= questions.length) {
          setDone(true);
        } else {
          setIdx(i => i + 1);
          setChosen(null);
        }
      };

      const restart = () => {
        setQuestions(buildQuestions());
        setIdx(0);
        setChosen(null);
        setScore(0);
        setDone(false);
      };

      const getFeedback = (s, t) => {
        const p = s / t;
        if (p === 1) return 'Perfekt! Alla rätt!';
        if (p >= 0.8) return 'Utmärkt! Du behärskar de flesta begreppen.';
        if (p >= 0.6) return 'Bra jobbat! Fortsätt öva.';
        if (p >= 0.4) return 'Du är på rätt väg — repetera gärna.';
        return 'Öva mer och försök igen!';
      };

      if (done) return (
        <div className="flex flex-col items-center gap-6">
          <div className="rounded-3xl p-8 text-center w-full max-w-sm border-2"
            style={score === questions.length
              ? { background: '#f0fdf4', borderColor: '#4ade80' }
              : { background: '#fefce8', borderColor: PRIMARY }
            }
          >
            <div className="text-5xl mb-3">{score === questions.length ? '🏆' : '📚'}</div>
            <p className="text-4xl font-bold mb-2" style={{ color: score === questions.length ? '#15803d' : '#78350f' }}>
              {score} / {questions.length}
            </p>
            <p className="text-base font-medium text-slate-600 mb-6">{getFeedback(score, questions.length)}</p>
            <button onClick={restart} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
              Börja om med ny blandning
            </button>
          </div>
        </div>
      );

      const optStyle = (opt) => {
        if (!chosen) return { background: '#ffffff', border: '2px solid #e2e8f0', color: '#1e293b' };
        if (opt === q.correct) return { background: '#f0fdf4', border: '2px solid #4ade80', color: '#15803d' };
        if (opt === chosen) return { background: '#fef2f2', border: '2px solid #f87171', color: '#b91c1c' };
        return { background: '#f8fafc', border: '2px solid #e2e8f0', color: '#94a3b8' };
      };

      return (
        <div className="flex flex-col items-center">
          <div className="w-full max-w-lg mb-3 flex items-center justify-between">
            <p className="text-sm font-medium text-slate-500">Fråga {idx + 1} av {questions.length}</p>
            <p className="text-sm font-bold" style={{ color: '#78350f' }}>{score} rätt</p>
          </div>
          <div className="w-full max-w-lg mb-6 bg-slate-200 rounded-full h-2">
            <div className="h-2 rounded-full transition-all" style={{ width: `${(idx / questions.length) * 100}%`, background: PRIMARY }} />
          </div>

          <div className="w-full max-w-lg bg-white rounded-3xl shadow-sm p-6 mb-5 text-center" style={{ borderTop: `4px solid ${PRIMARY}` }}>
            <p className="text-xs font-bold uppercase tracking-widest mb-2" style={{ color: '#d97706' }}>Välj rätt tillämpning av</p>
            <h2 className="text-2xl font-bold text-slate-800">{q.term}</h2>
          </div>

          <div className="w-full max-w-lg flex flex-col gap-3 mb-4">
            {['A', 'B'].map(opt => (
              <button
                key={opt}
                onClick={() => pick(opt)}
                disabled={!!chosen}
                className="w-full text-left p-4 rounded-2xl transition-all leading-relaxed"
                style={optStyle(opt)}
              >
                <span className="font-bold mr-2">{opt}.</span>
                {opt === 'A' ? q.optionA : q.optionB}
                {chosen && opt === q.correct && <span className="ml-2 font-bold text-green-600"> ✓</span>}
                {chosen && opt === chosen && opt !== q.correct && <span className="ml-2 font-bold text-red-600"> ✗</span>}
              </button>
            ))}
          </div>

          {chosen && (
            <div className="w-full max-w-lg rounded-2xl p-4 mb-5"
              style={isRight
                ? { background: '#f0fdf4', borderLeft: '8px solid #4ade80' }
                : { background: '#fef2f2', borderLeft: '8px solid #f87171' }
              }
            >
              <p className="font-bold mb-1" style={{ color: isRight ? '#15803d' : '#b91c1c' }}>
                {isRight ? 'Rätt!' : 'Fel!'}
              </p>
              <p className="text-slate-600 text-sm">{q.explanation}</p>
            </div>
          )}

          {chosen && (
            <button onClick={next} className="px-8 py-3 rounded-2xl font-bold text-white transition-colors" style={{ background: '#1e293b' }}>
              {idx + 1 >= questions.length ? 'Visa resultat →' : 'Nästa →'}
            </button>
          )}
        </div>
      );
    }

    function ScenarioView() {
      const buildQuestions = () =>
        shuffleArray(items.map((item, i) => {
          const d = scenarioData[i];
          const aIsCorrect = Math.random() < 0.5;
          return {
            term: item.term,
            optionA: aIsCorrect ? d.correct : d.trap,
            optionB: aIsCorrect ? d.trap : d.correct,
            correct: aIsCorrect ? 'A' : 'B',
            explanation: d.explanation,
          };
        }));

      const [questions, setQuestions] = useState(buildQuestions);
      const [idx, setIdx] = useState(0);
      const [chosen, setChosen] = useState(null);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);

      const q = questions[idx];
      const isRight = chosen === q.correct;

      const pick = (choice) => {
        if (chosen) return;
        setChosen(choice);
        if (choice === q.correct) setScore(s => s + 1);
      };

      const next = () => {
        if (idx + 1 >= questions.length) {
          setDone(true);
        } else {
          setIdx(i => i + 1);
          setChosen(null);
        }
      };

      const restart = () => {
        setQuestions(buildQuestions());
        setIdx(0);
        setChosen(null);
        setScore(0);
        setDone(false);
      };

      const getFeedback = (s, t) => {
        const p = s / t;
        if (p === 1) return 'Perfekt! Alla rätt!';
        if (p >= 0.8) return 'Utmärkt! Du behärskar de flesta begreppen.';
        if (p >= 0.6) return 'Bra jobbat! Fortsätt öva.';
        if (p >= 0.4) return 'Du är på rätt väg — repetera gärna.';
        return 'Öva mer och försök igen!';
      };

      if (done) return (
        <div className="flex flex-col items-center gap-6">
          <div className="rounded-3xl p-8 text-center w-full max-w-sm border-2"
            style={score === questions.length
              ? { background: '#f0fdf4', borderColor: '#4ade80' }
              : { background: '#fefce8', borderColor: PRIMARY }
            }
          >
            <div className="text-5xl mb-3">{score === questions.length ? '🏆' : '📚'}</div>
            <p className="text-4xl font-bold mb-2" style={{ color: score === questions.length ? '#15803d' : '#78350f' }}>
              {score} / {questions.length}
            </p>
            <p className="text-base font-medium text-slate-600 mb-6">{getFeedback(score, questions.length)}</p>
            <button onClick={restart} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
              Börja om med ny blandning
            </button>
          </div>
        </div>
      );

      const optStyle = (opt) => {
        if (!chosen) return { background: '#ffffff', border: '2px solid #e2e8f0', color: '#1e293b' };
        if (opt === q.correct) return { background: '#f0fdf4', border: '2px solid #4ade80', color: '#15803d' };
        if (opt === chosen) return { background: '#fef2f2', border: '2px solid #f87171', color: '#b91c1c' };
        return { background: '#f8fafc', border: '2px solid #e2e8f0', color: '#94a3b8' };
      };

      return (
        <div className="flex flex-col items-center">
          <div className="w-full max-w-lg mb-3 flex items-center justify-between">
            <p className="text-sm font-medium text-slate-500">Fråga {idx + 1} av {questions.length}</p>
            <p className="text-sm font-bold" style={{ color: '#78350f' }}>{score} rätt</p>
          </div>
          <div className="w-full max-w-lg mb-6 bg-slate-200 rounded-full h-2">
            <div className="h-2 rounded-full transition-all" style={{ width: `${(idx / questions.length) * 100}%`, background: PRIMARY }} />
          </div>

          <div className="w-full max-w-lg bg-white rounded-3xl shadow-sm p-6 mb-5 text-center" style={{ borderTop: `4px solid ${PRIMARY}` }}>
            <p className="text-xs font-bold uppercase tracking-widest mb-2" style={{ color: '#d97706' }}>Vilket scenario visar</p>
            <h2 className="text-2xl font-bold text-slate-800">{q.term}</h2>
          </div>

          <div className="w-full max-w-lg flex flex-col gap-3 mb-4">
            {['A', 'B'].map(opt => (
              <button
                key={opt}
                onClick={() => pick(opt)}
                disabled={!!chosen}
                className="w-full text-left p-4 rounded-2xl transition-all leading-relaxed"
                style={optStyle(opt)}
              >
                <span className="font-bold mr-2">{opt}.</span>
                {opt === 'A' ? q.optionA : q.optionB}
                {chosen && opt === q.correct && <span className="ml-2 font-bold text-green-600"> ✓</span>}
                {chosen && opt === chosen && opt !== q.correct && <span className="ml-2 font-bold text-red-600"> ✗</span>}
              </button>
            ))}
          </div>

          {chosen && (
            <div className="w-full max-w-lg rounded-2xl p-4 mb-5"
              style={isRight
                ? { background: '#f0fdf4', borderLeft: '8px solid #4ade80' }
                : { background: '#fef2f2', borderLeft: '8px solid #f87171' }
              }
            >
              <p className="font-bold mb-1" style={{ color: isRight ? '#15803d' : '#b91c1c' }}>
                {isRight ? 'Rätt!' : 'Fel!'}
              </p>
              <p className="text-slate-600 text-sm">{q.explanation}</p>
            </div>
          )}

          {chosen && (
            <button onClick={next} className="px-8 py-3 rounded-2xl font-bold text-white transition-colors" style={{ background: '#1e293b' }}>
              {idx + 1 >= questions.length ? 'Visa resultat →' : 'Nästa →'}
            </button>
          )}
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('lista');
      return (
        <div className="bg-amber-50 min-h-screen">
          <header className="bg-white shadow-sm sticky top-0 z-10">
            <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
              <a href="index.html" className="text-amber-600 hover:text-amber-800 transition-colors text-sm font-medium">
                ← Tillbaka till startsidan
              </a>
              <h1 className="text-xl font-bold text-amber-700 tracking-wide">Demokratiska statsskick</h1>
              <div className="w-36"></div>
            </div>
          </header>

          <div className="max-w-3xl mx-auto px-4 pt-6 pb-2 flex justify-center">
            <div className="bg-white rounded-full shadow-sm p-1 flex gap-1">
              <button
                onClick={() => setView('lista')}
                className="px-5 py-2 rounded-full text-sm font-bold transition-all"
                style={view === 'lista' ? { background: PRIMARY, color: '#78350f' } : { color: '#94a3b8' }}
              >
                Lista
              </button>
              <button
                onClick={() => setView('flashcards')}
                className="px-5 py-2 rounded-full text-sm font-bold transition-all"
                style={view === 'flashcards' ? { background: PRIMARY, color: '#78350f' } : { color: '#94a3b8' }}
              >
                Flashcards
              </button>
              <button
                onClick={() => setView('lucktext')}
                className="px-5 py-2 rounded-full text-sm font-bold transition-all"
                style={view === 'lucktext' ? { background: PRIMARY, color: '#78350f' } : { color: '#94a3b8' }}
              >
                Lucktext
              </button>
              <button
                onClick={() => setView('scenario')}
                className="px-5 py-2 rounded-full text-sm font-bold transition-all"
                style={view === 'scenario' ? { background: PRIMARY, color: '#78350f' } : { color: '#94a3b8' }}
              >
                Scenario
              </button>
              <button
                onClick={() => setView('ickeex')}
                className="px-5 py-2 rounded-full text-sm font-bold transition-all"
                style={view === 'ickeex' ? { background: PRIMARY, color: '#78350f' } : { color: '#94a3b8' }}
              >
                Icke-ex.
              </button>
            </div>
          </div>

          <main className="max-w-3xl mx-auto px-4 py-6">
            <p className="text-center text-amber-700 font-medium mb-6 text-sm">{items.length} begrepp</p>
            {view === 'lista' && <ListaView />}
            {view === 'flashcards' && <FlashcardView />}
            {view === 'lucktext' && <LucktextView />}
            {view === 'scenario' && <ScenarioView key="scenario" />}
            {view === 'ickeex' && <IckeExempelView key="ickeex" />}
          </main>

          <footer className="text-center text-slate-400 text-xs italic py-8">
            Källa: Samhällskunskap Sa1a1 begreppslista
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

    <script src="feedback-widget.js" defer></script>
</body>
</html>
