function normalizeAnswer(str) {
  return str.trim().toLowerCase().replace(/\s+/g, " ");
}

function isCorrectAnswer(input, item) {
  const norm = normalizeAnswer(input);
  return item.answers.some((a) => normalizeAnswer(a) === norm);
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function makeOptions(currentItem, allData) {
  const distractors = allData.filter((d) => d.id !== currentItem.id);
  shuffleArray(distractors);
  return shuffleArray([currentItem, ...distractors.slice(0, 3)]);
}

function goBack() {
  const ref = document.referrer;

    history.back();
  } else {
    window.location.href = "index.html";
  }
}

          <button
            key={v}
            disabled={!enabled.includes(v)}
            onClick={() => enabled.includes(v) && setView(v)}
            className={

function FlashcardView() {

  const [deckIdx, setDeckIdx] = useState(0);

  const restartAll = () => {
    setDeck(shuffleArray([...concepts]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray([...kudeInte]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);

        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function ScenarioView() {
  const total = scenarioData.length;
  const [items, setItems] = useState(() => shuffleArray([...scenarioData]));
  const [idx, setIdx] = useState(0);
  const [options, setOptions] = useState(() => makeOptions(items[0], scenarioData));
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [phase, setPhase] = useState('playing');

  const current = items[idx];
  const isAnswered = selected !== null;

  const handleSelect = (opt) => {
    if (isAnswered) return;
    setSelected(opt);
    if (opt.id === current.id) setScore((s) => s + 1);
  };

  const handleNext = () => {
    const nextIdx = idx + 1;
    if (nextIdx >= total) {
      setPhase('done');
    } else {
      setOptions(makeOptions(items[nextIdx], scenarioData));
      setIdx(nextIdx);
      setSelected(null);
    }
  };

  const restart = () => {
    const newItems = shuffleArray([...scenarioData]);
    setItems(newItems);
    setIdx(0);
    setOptions(makeOptions(newItems[0], scenarioData));
    setSelected(null);
    setScore(0);
    setPhase('playing');
  };

  if (phase === 'done') return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col items-center gap-6">
      <div className="rounded-3xl p-8 text-center w-full max-w-sm" style={{ background: PRIMARY_LIGHT, border: `2px solid ${PRIMARY}` }}>
        <div className="text-5xl mb-4">🎯</div>
        <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
        <p className="text-slate-500 text-sm mb-6">
          {score === total
            ? 'Perfekt! Du kopplar ihop alla situationer rätt.'
            : score >= Math.round(total * 0.8)
            ? 'Bra jobbat! Öva lite till på de du missat.'
            : 'Fortsätt öva – du lär dig!'}
        </p>
        <button onClick={restart} className="text-white font-bold px-8 py-3 rounded-2xl" style={{ background: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <span className="text-xs text-slate-400 font-medium">{idx + 1} av {total}</span>
        <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}>
          {score} rätt
        </span>
      </div>
      <div className="w-full bg-slate-200 rounded-full h-1.5 mb-1">
        <div className="h-1.5 rounded-full transition-all" style={{ width: `${(idx / total) * 100}%`, background: PRIMARY }} />
      </div>

      <div className="bg-white rounded-2xl shadow-sm p-5 border-l-4" style={{ borderLeftColor: PRIMARY }}>
        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Vilket begrepp beskrivs?</p>
        <p className="text-slate-800 text-base leading-relaxed">{current.scenario}</p>
      </div>

      <div className="flex flex-col gap-3">
        {options.map((opt) => {
          const isCorrect = opt.id === current.id;
          const isSelected = selected && selected.id === opt.id;
          let bg = '#ffffff', border = '#e2e8f0', textColor = '#1e293b';
          if (isAnswered) {
            if (isCorrect) { bg = '#dcfce7'; border = '#16a34a'; textColor = '#15803d'; }
            else if (isSelected) { bg = '#fee2e2'; border = '#dc2626'; textColor = '#dc2626'; }
          }
          return (
            <button
              key={opt.id}
              onClick={() => handleSelect(opt)}
              disabled={isAnswered}
              className="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm transition-all border-2"
              style={{ background: bg, borderColor: border, color: textColor }}
            >
              {opt.term}
            </button>
          );
        })}
      </div>

      {isAnswered && (
        <div
          className="rounded-xl p-4 text-sm leading-relaxed"
          style={
            selected.id === current.id
              ? { background: '#dcfce7', color: '#15803d' }
              : { background: '#fee2e2', color: '#dc2626' }
          }
        >
          {selected.id === current.id ? '✓ Rätt! ' : `✗ Rätt svar: ${current.term}. `}
          {current.definition}
        </div>
      )}

      {isAnswered && (
        <button
          onClick={handleNext}
          className="w-full text-white font-bold py-3 rounded-2xl text-sm"
          style={{ background: PRIMARY }}
        >
          {idx + 1 >= total ? 'Se resultat' : 'Nästa →'}
        </button>
      )}
    </div>
  );
}

function NonExampleView() {
  const total = nonExampleData.length;
  const [items, setItems] = useState(() => shuffleArray([...nonExampleData]));
  const [idx, setIdx] = useState(0);
  const [selectedSide, setSelectedSide] = useState(null);
  const [score, setScore] = useState(0);
  const [phase, setPhase] = useState("playing");

  const current = items[idx];
  const isAnswered = selectedSide !== null;

  const handleSelect = (side) => {
    if (isAnswered) return;
    setSelectedSide(side);
    if (side === current.correctSide) setScore((s) => s + 1);
  };

  const handleNext = () => {
    const nextIdx = idx + 1;
    if (nextIdx >= total) {
      setPhase("done");
    } else {
      setIdx(nextIdx);
      setSelectedSide(null);
    }
  };

  const restart = () => {
    setItems(shuffleArray([...nonExampleData]));
    setIdx(0);
    setSelectedSide(null);
    setScore(0);
    setPhase("playing");
  };

  if (phase === "done") return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col items-center gap-6">
      <div className="rounded-3xl p-8 text-center w-full max-w-sm" style={{ background: PRIMARY_LIGHT, border: `2px solid ${PRIMARY}` }}>
        <div className="text-5xl mb-4">🔍</div>
        <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
        <p className="text-slate-500 text-sm mb-6">
          {score === total
            ? "Perfekt! Du ser skillnaden mellan rätt tillämpning och fällan varje gång."
            : score >= Math.round(total * 0.8)
            ? "Bra jobbat! Öva lite till på de begrepp du blandade ihop."
            : "Fortsätt öva – vanliga missuppfattningar tar tid att lära sig se igenom."}
        </p>
        <button onClick={restart} className="text-white font-bold px-8 py-3 rounded-2xl" style={{ background: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  return (
    <div className="max-w-3xl mx-auto px-4 pb-16 flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <span className="text-xs text-slate-400 font-medium">{idx + 1} av {total}</span>
        <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}>
          {score} rätt
        </span>
      </div>
      <div className="w-full bg-slate-200 rounded-full h-1.5 mb-1">
        <div className="h-1.5 rounded-full transition-all" style={{ width: `${(idx / total) * 100}%`, background: PRIMARY }} />
      </div>

      <div className="bg-white rounded-2xl shadow-sm p-5 border-l-4" style={{ borderLeftColor: PRIMARY }}>
        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Vilket exempel visar rätt tillämpning av</p>
        <p className="text-slate-800 text-xl font-bold">{current.term}?</p>
      </div>

      <div className="flex flex-col gap-3">
        {["A", "B"].map((side) => {
          const text = side === "A" ? current.optionA : current.optionB;
          const isCorrect = side === current.correctSide;
          const isSelected = selectedSide === side;
          let bg = "#ffffff", border = "#e2e8f0", textColor = "#1e293b";
          if (isAnswered) {
            if (isCorrect) { bg = "#dcfce7"; border = "#16a34a"; textColor = "#15803d"; }
            else if (isSelected) { bg = "#fee2e2"; border = "#dc2626"; textColor = "#dc2626"; }
          }
          return (
            <button
              key={side}
              onClick={() => handleSelect(side)}
              disabled={isAnswered}
              className="w-full text-left px-4 py-3 rounded-xl font-medium text-sm transition-all border-2 flex gap-3"
              style={{ background: bg, borderColor: border, color: textColor }}
            >
              <span className="font-bold flex-shrink-0">{side}.</span>
              <span>{text}</span>
            </button>
          );
        })}
      </div>

      {isAnswered && (
        <div
          className="rounded-xl p-4 text-sm leading-relaxed"
          style={
            selectedSide === current.correctSide
              ? { background: "#dcfce7", color: "#15803d" }
              : { background: "#fee2e2", color: "#dc2626" }
          }
        >
          {selectedSide === current.correctSide ? "✓ Rätt! " : `✗ Fel — rätt svar var alternativ ${current.correctSide}. `}
          {current.explanation}
        </div>
      )}

      {isAnswered && (
        <button
          onClick={handleNext}
          className="w-full text-white font-bold py-3 rounded-2xl text-sm"
          style={{ background: PRIMARY }}
        >
          {idx + 1 >= total ? "Se resultat" : "Nästa →"}
        </button>
      )}
    </div>
  );
}

function LucktextView() {
  const [answers, setAnswers] = useState(() =>
    lucktextItems.map(() => ({ value: "", status: "unanswered", attempts: 0 }))
  );

  const correctCount = answers.filter((a) => a.status === "correct").length;
  const doneCount = answers.filter((a) => a.status === "correct" || a.status === "revealed").length;
  const allDone = doneCount === lucktextItems.length;

  const updateAnswer = (idx, patch) => {
    setAnswers((prev) => {
      const next = [...prev];
      next[idx] = { ...next[idx], ...patch };
      return next;
    });
  };

  const checkAnswer = (idx) => {
    const item = lucktextItems[idx];
    const state = answers[idx];
    if (state.status === "correct" || state.status === "revealed") return;
    if (isCorrectAnswer(state.value, item)) {
      updateAnswer(idx, { status: "correct" });
    } else {
      const attempts = state.attempts + 1;
      updateAnswer(idx, { attempts, status: attempts >= 2 ? "wrong" : "warn" });
    }
  };

  const rattaAlla = () => {
    setAnswers((prev) =>
      prev.map((a, i) =>
        a.status === "correct" ? a : { ...a, status: "revealed", value: lucktextItems[i].term }
      )
    );
  };

  const restart = () => {
    setAnswers(lucktextItems.map(() => ({ value: "", status: "unanswered", attempts: 0 })));
  };

  const gradeFeedback = (score, total) => {
    const pct = score / total;
    if (pct >= 0.9) return "Utmärkt! Du är redo för provet! 🎉";
    if (pct >= 0.7) return "Bra jobbat! Nästan i mål.";
    if (pct >= 0.5) return "Godkänt, men öva gärna lite till.";
    return "Öva lite till på begreppen innan provet.";
  };

  return (
    <div className="max-w-3xl mx-auto px-4 pb-16">
      <p className="text-sm text-slate-500 mb-4 text-center">
        Fyll i rätt begrepp i luckan och tryck Enter för att kolla ditt svar. Begrepp du klarat stryks över nedan.
      </p>

      <div className="bg-white rounded-2xl shadow-sm p-4 mb-8 border border-slate-200">
        <p className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {lucktextItems.map((item, i) => {
            const st = answers[i].status;
            const done = st === "correct" || st === "revealed";
            return (
              <span
                key={item.term}
                className={
                  "px-3 py-1 rounded-full text-xs font-semibold border " +
                  (done
                    ? st === "correct"
                      ? "line-through text-green-600 bg-green-50 border-green-200"
                      : "line-through text-slate-400 bg-slate-100 border-slate-200"
                    : "text-slate-600 bg-slate-50 border-slate-200")
                }
              >
                {item.term}
              </span>
            );
          })}
        </div>
      </div>

      {allDone && (
        <div className="bg-white border-2 rounded-3xl p-8 text-center mb-8 shadow-sm" style={{ borderColor: PRIMARY }}>
          <p className="text-2xl font-bold text-slate-800 mb-2">
            {correctCount} / {lucktextItems.length} rätt
          </p>
          <p className="text-slate-500 mb-6">{gradeFeedback(correctCount, lucktextItems.length)}</p>
          <button
            onClick={restart}
            className="text-white px-8 py-3 rounded-2xl font-bold transition-colors"
            style={{ background: PRIMARY }}
          >
            Börja om
          </button>
        </div>
      )}

      {!allDone && (
        <div className="flex justify-end mb-4">
          <button onClick={rattaAlla} className="text-sm font-semibold text-slate-500 hover:text-slate-700 underline">
            Rätta alla
          </button>
        </div>
      )}

      <div className="flex flex-col gap-4">
        {lucktextItems.map((item, i) => {
          const state = answers[i];
          const [before, after] = item.sentence.split("___");
          const locked = state.status === "correct" || state.status === "revealed";
          const borderColor =
            state.status === "correct"
              ? "#16a34a"
              : state.status === "revealed" || state.status === "wrong"
              ? "#dc2626"
              : "#e2e8f0";
          const bg =
            state.status === "correct"
              ? "#dcfce7"
              : state.status === "revealed" || state.status === "wrong"
              ? "#fee2e2"
              : "#ffffff";

          return (
            <div
              key={item.term}
              className="rounded-2xl p-5 shadow-sm border-2 transition-colors"
              style={{ borderColor, background: bg }}
            >
              <p className="text-slate-800 leading-relaxed mb-2">
                <span className="text-xs text-slate-400 font-bold mr-2">{i + 1}.</span>
                {before}
                <input
                  type="text"
                  value={state.value}
                  disabled={locked}
                  onChange={(e) => updateAnswer(i, { value: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && checkAnswer(i)}
                  className="inline-block mx-1 px-2 py-1 border-b-2 border-slate-300 focus:outline-none focus:border-slate-600 bg-transparent font-semibold text-slate-800 disabled:text-slate-600"
                  style={{ borderColor: locked ? borderColor : undefined, minWidth: "140px" }}
                  placeholder="skriv begrepp..."
                />
                {after}
              </p>

              {state.status === "warn" && (
                <p className="text-orange-500 text-sm font-semibold mt-1">Är du säker att du stavat rätt? Försök igen.</p>
              )}
              {state.status === "wrong" && (
                <p className="text-red-600 text-sm font-semibold mt-1">
                  Fel svar. Försök igen eller tryck på "Rätta alla".
                </p>
              )}
              {locked && (
                <div className="mt-2 text-sm">
                  <p className={state.status === "correct" ? "text-green-700 font-bold" : "text-red-700 font-bold"}>
                    {state.status === "correct" ? "Rätt: " : "Rätt svar: "}
                    {item.term}
                  </p>
                  <p className="text-slate-600 mt-1">{item.explanation}</p>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Footer() {
  return (
    <footer className="text-center text-slate-400 text-sm italic pb-10">
      Källa: Juridik nivå 1, begreppslista
    </footer>
  );
}

function App() {
  const [view, setView] = useState("Lista");
  return (
    <div>
      <Header />
      <ViewToggle view={view} setView={setView} />
      {view === "Lista" && <ListView />}
      {view === "Flashcards" && <FlashcardView />}
      {view === "Lucktext" && <LucktextView />}
      {view === "Scenario" && <ScenarioView />}
      {view === "Icke-ex." && <NonExampleView />}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
