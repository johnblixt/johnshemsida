<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy – Naturvetenskapligt arbetssätt | NK 1a1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;0,800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1120;
    --navy2:#111c33;
  }
  body{font-family:'EB Garamond',serif;}
  .num{font-family:'Fredoka',sans-serif;font-variant-numeric:tabular-nums;}

  /* ── Scenen ── */
  #jp-stage{
    background:var(--navy);
    border-radius:1.25rem;
    overflow:hidden;
    display:flex;flex-direction:column;
    height:min(78vh,660px);
  }
  #jp-stage.jp-fs{
    position:fixed;inset:0;z-index:400;
    height:100dvh;border-radius:0;
  }
  #jp-stage:fullscreen{height:100dvh;border-radius:0;}

  /* ── Rutnät ── */
  #jp-board{
    flex:1;min-height:0;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:auto repeat(5,1fr);
    gap:6px;padding:10px;
  }
  .jp-head{
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:'Fredoka',sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;line-height:1.1;
    font-size:clamp(.6rem,1.5vh,.95rem);
    color:#fff;padding:.5rem .35rem;border-radius:.6rem .6rem .2rem .2rem;
  }
  .jp-cell{
    display:flex;align-items:center;justify-content:center;
    border-radius:.6rem;cursor:pointer;
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(1.3rem,4.6vh,3.1rem);
    border:1px solid rgba(255,255,255,.07);
    transition:transform .12s ease,filter .12s ease,background .12s ease;
  }
  .jp-cell:hover:not(.jp-used){transform:translateY(-2px) scale(1.02);}
  .jp-cell:focus-visible{outline:3px solid #fff;outline-offset:2px;}
  .jp-used{
    background:rgba(255,255,255,.04)!important;color:rgba(255,255,255,.16)!important;
    cursor:default;transform:none;font-size:clamp(1rem,2.6vh,1.6rem);
  }

  /* ── Lagrad ── */
  #jp-teams{
    display:grid;gap:6px;padding:0 10px 10px;
    grid-template-columns:repeat(var(--tc,2),1fr);
  }
  .jp-team{
    background:var(--navy2);border-radius:.7rem;padding:.4rem .6rem;
    display:flex;align-items:center;gap:.6rem;border:1px solid rgba(255,255,255,.08);
  }
  .jp-team .nm{
    flex:1;min-width:0;color:#cbd5e1;font-weight:700;
    font-size:clamp(.7rem,1.6vh,.95rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .jp-team .sc{font-family:'Fredoka',sans-serif;font-size:clamp(1rem,2.6vh,1.6rem);font-weight:700;}
  .jp-step{
    background:rgba(255,255,255,.08);color:#e2e8f0;border:none;border-radius:.4rem;
    width:1.7rem;height:1.7rem;font-weight:700;cursor:pointer;font-family:'Fredoka',sans-serif;
  }
  .jp-step:hover{background:rgba(255,255,255,.2);}

  /* ── Modal ── */
  #jp-modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(4,8,18,.9);}
  #jp-modal.on{display:flex;}
  .jp-card{background:#fff;border-radius:1.1rem;width:100%;max-width:820px;max-height:94%;overflow-y:auto;padding:1.1rem 1.3rem 1rem;}
  .jp-opt{
    text-align:left;font-family:'EB Garamond',serif;border:2px solid #e2e8f0;background:#fff;
    border-radius:.7rem;padding:.6rem .8rem;font-size:clamp(.85rem,1.9vh,1.05rem);
    line-height:1.35;transition:all .12s ease;width:100%;
  }
  .jp-opt:hover:not(:disabled){background:#f8fafc;}
  .jp-opt:disabled{cursor:default;}
  .jp-picked{background:#fef3c7!important;border-color:#f59e0b!important;}
  .jp-wrong{background:#fee2e2!important;border-color:#dc2626!important;color:#991b1b;opacity:.65;}
  .jp-correct{background:#dcfce7!important;border-color:#16a34a!important;color:#166534;font-weight:700;}
  .jp-bar{transition:width 1s linear,background-color .3s;}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body class="bg-slate-50">

<a href="nk1a1_naturvetenskap.html" onclick="smartBack(event)" class="fixed top-4 left-4 z-50 text-sm font-medium text-slate-500 hover:text-cyan-700 bg-white/90 px-3 py-2 rounded-xl shadow-sm transition-colors">← Tillbaka till området</a>

<div class="max-w-5xl mx-auto px-5 py-8">

  <div class="border-l-4 pl-4 mb-8" style="border-color: #0891b2;">
    <p class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">Naturkunskap nivå 1a1 · Spel</p>
    <h1 class="text-3xl md:text-4xl font-bold italic text-slate-900">Jeopardy – Naturvetenskapligt arbetssätt</h1>
  </div>

  <!-- ══ SETUP ══ -->
  <div id="jp-setup" class="max-w-sm mx-auto bg-white border-2 border-slate-200 rounded-2xl p-6">
    <h2 class="font-bold text-xl mb-4 text-center">Vilka lag tävlar?</h2>
    <div id="jp-team-inputs" class="space-y-2 mb-3"></div>
    <div class="flex justify-center gap-5 mb-5 text-xs font-bold text-cyan-700">
      <button id="jp-add" onclick="jpChangeTeamCount(1)">+ Lägg till lag</button>
      <button id="jp-remove" onclick="jpChangeTeamCount(-1)">− Ta bort lag</button>
    </div>
    <button onclick="jpStartGame()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold uppercase tracking-wide text-sm hover:bg-slate-700">Starta spelet</button>
  </div>

  <!-- ══ SCEN ══ -->
  <div id="jp-stage" class="hidden">

    <div class="flex items-center gap-3 px-4 pt-3 pb-1">
      <p class="text-slate-400 text-[11px] uppercase tracking-[.2em] font-bold flex-1 truncate">Naturvetenskapligt arbetssätt</p>
      <button onclick="jpNewGame()" class="text-slate-400 hover:text-white text-xs font-bold">Nytt spel</button>
      <button id="jp-fsbtn" onclick="jpToggleFullscreen()" class="bg-white/10 hover:bg-white/20 text-white text-xs font-bold px-3 py-1.5 rounded-lg">⛶ Helskärm</button>
    </div>

    <div id="jp-board"></div>
    <div id="jp-teams"></div>

    <!-- Frågemodal -->
    <div id="jp-modal">
      <div class="jp-card" id="jp-card">
        <div class="flex items-center gap-3 mb-3">
          <span id="jp-cat" class="px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wide text-white"></span>
          <span id="jp-val" class="num font-bold text-slate-400"></span>
          <span class="flex-1"></span>
          <span id="jp-time" class="num text-sm font-bold text-slate-400">30</span>
        </div>
        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden mb-4">
          <div id="jp-bar" class="jp-bar h-full" style="width:100%"></div>
        </div>

        <div id="jp-banner" class="hidden mb-3 text-center">
          <p class="text-sm font-bold text-amber-800 bg-amber-50 border border-amber-300 rounded-lg py-2 px-3 inline-block"></p>
        </div>

        <p id="jp-q" class="font-bold text-slate-900 mb-4 leading-snug" style="font-size:clamp(1.05rem,2.7vh,1.6rem)"></p>
        <div id="jp-opts" class="grid gap-2 mb-3"></div>

        <div id="jp-judge" class="hidden grid grid-cols-2 gap-2 mb-3">
          <button onclick="jpJudge(true)" class="bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-bold text-sm">✓ Rätt</button>
          <button onclick="jpJudge(false)" class="bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl font-bold text-sm">✗ Fel</button>
        </div>

        <div id="jp-expl-wrap" class="hidden border-l-4 rounded-r-lg p-3 mb-3 text-sm text-slate-700">
          <p class="font-bold text-[11px] uppercase tracking-wide mb-1" id="jp-expl-label">Förklaring</p>
          <p id="jp-expl"></p>
        </div>

        <div id="jp-teamselect" class="hidden mb-2">
          <p class="text-sm font-bold text-slate-500 mb-2 text-center">Vilket lag får poängen?</p>
          <div id="jp-teamselect-grid" class="grid grid-cols-2 gap-2"></div>
        </div>

        <div id="jp-actions" class="flex justify-center gap-5 text-xs font-bold pt-2 border-t border-slate-100">
          <button onclick="jpRevealAnswer()" class="text-cyan-700">Visa svar</button>
          <button onclick="jpCloseModal(null)" class="text-slate-400">Ingen fick rätt / Stäng</button>
        </div>
      </div>
    </div>

    <!-- Slutresultat -->
    <div id="jp-end" class="hidden absolute inset-0 z-[60] items-center justify-center p-6" style="background:rgba(4,8,18,.94)">
      <div class="text-center">
        <p class="text-slate-400 text-xs uppercase tracking-[.25em] font-bold mb-4">Slutresultat</p>
        <div id="jp-end-list" class="space-y-2 mb-6"></div>
        <button onclick="jpNewGame()" class="bg-white text-slate-900 px-6 py-2.5 rounded-xl font-bold text-sm">Spela igen</button>
      </div>
    </div>

  </div>

  <footer class="mt-16 text-center border-t border-slate-200 pt-8">
    <p class="text-slate-400 text-xs uppercase tracking-[0.2em] font-black italic">Designad av John</p>
  </footer>
</div>

<script>
/* ════════ DATA ════════ */
const JP_CATEGORIES = [
  { name:'Vetenskaplig metod', color:'#06b6d4', rgb:'6,182,212', qs:[
    { v:100, q:'Vad är en frågeställning i en vetenskaplig undersökning?',
      opts:['En specifik och avgränsad fråga som preciserar syftet med undersökningen','En hypotes formulerad som ett påstående om vad man förväntar sig hitta','En sammanfattning av de resultat som uppnåtts efter att experimentet genomförts','En teori om hur världen fungerar som ska bevisas stämma med hjälp av data'],
      correct:0, expl:'En frågeställning är en specifik och avgränsad fråga – t.ex. "Vad beror det här på?" Det skiljer sig från hypotesen, som är ett möjligt svar formulerat som ett påstående.' },
    { v:200, q:'Vad är en hypotes?',
      opts:['Ett testbart påstående som ger ett möjligt svar på frågeställningen – vi vet inte om det är sant eller falskt','En bekräftad slutsats som dragits efter att ett experiment upprepats ett stort antal gånger','En fråga om vad som ska undersökas, formulerad på ett specifikt och avgränsat sätt','En observation som gjorts under ett experiment och som behöver förklaras av forskaren'],

    { v:400, q:'Vilka tre krav måste en vetenskaplig undersökning uppfylla?',
      opts:['Hypotesen ska vara testbar och falsifierbar, och experimentet ska vara repeterbart','Hypotesen ska baseras på befintlig teori, godkännas av en etikkommitté och ge signifikanta resultat','Hypotesen ska bevisas sann, formuleras av minst två oberoende forskare och publiceras i en tidskrift','Experimentet ska vara enkelt, billigt att genomföra och förståeligt för en bred allmänhet'],

      correct:0, expl:'Den hypotetisk-deduktiva metoden: 1) Frågeställning, 2) Hypotes, 3) Förutsägelse, 4) Undersökning (experiment), 5) Slutsats – stöds eller falsifieras hypotesen?' }
  ]},
  { name:'Teorier, etik & gränser', color:'#a855f7', rgb:'168,85,247', qs:[

    { v:200, q:'Vad är en vetenskaplig teori?',

    { v:300, q:'Vad innebär ett paradigmskifte?',

    { v:400, q:'Vad räknas som forskningsfusk?',

  { name:'Experiment & undersökning', color:'#f59e0b', rgb:'245,158,11', qs:[

    { v:400, q:'Vad är placeboeffekten?',

    { v:400, q:'Vad menas med faktaresistens?',
      opts:['Att en person håller fast vid sin övertygelse trots att det finns välgrundade fakta som talar emot den','Att en person konsekvent vägrar ta del av information från källor som inte godkänts av vetenskapssamhället','Att forskning om ett visst ämne är så tekniskt komplicerad att den inte är tillgänglig för gemene man','Att myndigheter och institutioner undanhåller fakta från allmänheten av politiska eller ekonomiska skäl'],
      correct:0, expl:'Faktaresistens innebär att man inte ändrar uppfattning trots motstående bevis. Det strider mot ett vetenskapligt förhållningssätt och kan förstärka felaktiga uppfattningar.' },
    { v:500, q:'Vad är pseudovetenskap?',
      opts:['Läror som påstår sig vara vetenskapliga men saknar vetenskapligt stöd och ofta inte kan falsifieras med experiment','Vetenskapliga teorier som ännu inte fått tillräcklig forskning bakom sig för att accepteras av forskarsamhället','Forskning som bedrivs utanför akademiska institutioner men som ändå kan ge tillförlitliga och reproducerbara resultat','Teorier som avvisats av majoriteten av forskare men som fortfarande kan bevisas med rätt experimentell uppställning'],
      correct:0, expl:'Pseudovetenskap ser ut som vetenskap men uppfyller inte kraven – t.ex. astrologi, vars förutsägelser är för vaga för att falsifieras. Faran är att folk väljer bort beprövad vård.' }
  ]}
];

/* ════════ SETUP ════════ */
let jpTeamCount = 2, jpTeams = [], jpUsed = 0;

function jpRenderTeamInputs(){
  const wrap = document.getElementById('jp-team-inputs');
  wrap.innerHTML = '';
  for(let i=0;i<jpTeamCount;i++){
    const inp = document.createElement('input');
    inp.type='text'; inp.id='jp-team-'+i; inp.placeholder='Lag '+(i+1);
    inp.className='w-full p-2.5 border-2 border-slate-200 rounded-lg text-sm outline-none focus:border-slate-900';
    wrap.appendChild(inp);
  }
  document.getElementById('jp-remove').style.visibility = jpTeamCount<=2?'hidden':'visible';
  document.getElementById('jp-add').style.visibility    = jpTeamCount>=4?'hidden':'visible';
}
function jpChangeTeamCount(d){ jpTeamCount=Math.min(4,Math.max(2,jpTeamCount+d)); jpRenderTeamInputs(); }

function jpStartGame(){
  jpTeams=[]; jpUsed=0;
  for(let i=0;i<jpTeamCount;i++){
    const v=document.getElementById('jp-team-'+i).value.trim();
    jpTeams.push({name:v||('Lag '+(i+1)),score:0});
  }
  document.getElementById('jp-setup').classList.add('hidden');
  document.getElementById('jp-stage').classList.remove('hidden');
  document.getElementById('jp-end').classList.add('hidden');
  document.getElementById('jp-end').style.display='none';
  document.getElementById('jp-teams').style.setProperty('--tc', jpTeams.length);
  jpRenderTeams(); jpBuildBoard();
}
function jpNewGame(){
  jpExitFullscreen();
  document.getElementById('jp-stage').classList.add('hidden');
  document.getElementById('jp-setup').classList.remove('hidden');
  document.getElementById('jp-end').style.display='none';
}

/* ════════ LAG ════════ */
function jpRenderTeams(){
  const p=document.getElementById('jp-teams'); p.innerHTML='';
  jpTeams.forEach((t,i)=>{
    const c=JP_CATEGORIES[i%4].color;
    const el=document.createElement('div');
    el.className='jp-team';
    el.innerHTML=`<span class="nm" style="border-left:3px solid ${c};padding-left:.5rem">${t.name}</span>
      <span class="sc" style="color:${c}">${t.score}</span>
      <button class="jp-step" onclick="jpAdjust(${i},-100)">−</button>
      <button class="jp-step" onclick="jpAdjust(${i},100)">+</button>`;
    p.appendChild(el);
  });
}
function jpAdjust(i,a){ jpTeams[i].score+=a; jpRenderTeams(); }

/* ════════ SPELPLAN ════════ */
function jpBuildBoard(){
  const b=document.getElementById('jp-board'); b.innerHTML='';
  JP_CATEGORIES.forEach(cat=>{
    const h=document.createElement('div');
    h.className='jp-head'; h.style.background=cat.color; h.textContent=cat.name;
    b.appendChild(h);
  });
  for(let row=4;row>=0;row--){
    JP_CATEGORIES.forEach((cat,ci)=>{
      const q=cat.qs[row];
      const cell=document.createElement('button');
      cell.className='jp-cell';
      cell.style.background=`rgba(${cat.rgb},.13)`;
      cell.style.color=cat.color;
      cell.textContent=q.v;
      cell.onmouseenter=()=>{ if(!cell.classList.contains('jp-used')){cell.style.background=cat.color;cell.style.color='#0b1120';} };
      cell.onmouseleave=()=>{ if(!cell.classList.contains('jp-used')){cell.style.background=`rgba(${cat.rgb},.13)`;cell.style.color=cat.color;} };
      cell.onclick=()=>jpOpenQuestion(ci,row,cell);
      b.appendChild(cell);
    });
  }
}

/* ════════ FRÅGA ════════ */
let jpCat=null,jpRow=null,jpCell=null,jpOpts=[],jpPicked=null,jpWrong=[],jpRevealed=false,jpTimer=null,jpTime=30;

function jpShuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function jpOpenQuestion(ci,row,cell){
  if(cell.classList.contains('jp-used')) return;
  jpCat=ci; jpRow=row; jpCell=cell;
  const cat=JP_CATEGORIES[ci], q=cat.qs[row];
  jpPicked=null; jpWrong=[]; jpRevealed=false;
  jpOpts=jpShuffle(q.opts.map((t,i)=>({text:t,isCorrect:i===q.correct})));

  const catEl=document.getElementById('jp-cat');
  catEl.textContent=cat.name; catEl.style.background=cat.color;
  document.getElementById('jp-val').textContent=q.v+' p';
  document.getElementById('jp-q').textContent=q.q;
  document.getElementById('jp-expl').textContent=q.expl;
  const ew=document.getElementById('jp-expl-wrap');
  ew.style.background=`rgba(${cat.rgb},.08)`; ew.style.borderColor=cat.color;
  document.getElementById('jp-expl-label').style.color=cat.color;
  document.getElementById('jp-bar').style.background=cat.color;
  ew.classList.add('hidden');
  document.getElementById('jp-teamselect').classList.add('hidden');
  document.getElementById('jp-judge').classList.add('hidden');
  document.getElementById('jp-banner').classList.add('hidden');
  document.getElementById('jp-actions').classList.remove('hidden');
  jpRenderOptions();
  document.getElementById('jp-modal').classList.add('on');
  jpStartTimer();
}

function jpRenderOptions(){
  const w=document.getElementById('jp-opts'); w.innerHTML='';
  jpOpts.forEach((o,idx)=>{
    const b=document.createElement('button');
    let cls='jp-opt', dis=false;
    if(jpWrong.includes(idx)){ cls+=' jp-wrong'; dis=true; }
    else if(jpRevealed){ cls+=o.isCorrect?' jp-correct':' opacity-40'; dis=true; }
    else if(jpPicked===idx){ cls+=' jp-picked'; dis=true; }
    else if(jpPicked!==null){ dis=true; }
    b.className=cls; b.disabled=dis;
    b.textContent=String.fromCharCode(97+idx)+') '+o.text;
    b.onclick=()=>jpPick(idx);
    w.appendChild(b);
  });
}

function jpPick(idx){
  if(jpPicked!==null||jpRevealed) return;
  jpPicked=idx; clearInterval(jpTimer);
  document.getElementById('jp-banner').classList.add('hidden');
  jpRenderOptions();
  document.getElementById('jp-judge').classList.remove('hidden');
}

function jpJudge(ok){
  document.getElementById('jp-judge').classList.add('hidden');
  if(ok){ clearInterval(jpTimer); jpShowTeamSelect(); }
  else{
    jpWrong.push(jpPicked); jpPicked=null; jpRenderOptions();
    if(jpWrong.length>=jpOpts.length){ jpRevealAnswer(); }
    else{ jpBanner('✗ Fel svar – övriga lag får chansen.'); jpStartTimer(); }
  }
}

function jpBanner(txt){
  const b=document.getElementById('jp-banner');
  b.querySelector('p').textContent=txt; b.classList.remove('hidden');
}

function jpRevealAnswer(){
  clearInterval(jpTimer); jpRevealed=true; jpRenderOptions();
  document.getElementById('jp-expl-wrap').classList.remove('hidden');
  document.getElementById('jp-judge').classList.add('hidden');
  document.getElementById('jp-banner').classList.add('hidden');
}

function jpShowTeamSelect(){
  document.getElementById('jp-teamselect').classList.remove('hidden');
  document.getElementById('jp-actions').classList.add('hidden');
  const g=document.getElementById('jp-teamselect-grid'); g.innerHTML='';
  jpTeams.forEach((t,i)=>{
    const c=JP_CATEGORIES[i%4].color;
    const b=document.createElement('button');
    b.className='p-2.5 rounded-lg font-bold text-sm border-2 truncate text-slate-700';
    b.style.borderColor=c;
    b.onmouseenter=()=>{b.style.background=c;b.style.color='#fff';};
    b.onmouseleave=()=>{b.style.background='';b.style.color='';};
    b.textContent=t.name;
    b.onclick=()=>jpCloseModal(i);
    g.appendChild(b);
  });
}

function jpCloseModal(winner){
  clearInterval(jpTimer);
  const q=JP_CATEGORIES[jpCat].qs[jpRow];
  if(winner!==null){ jpTeams[winner].score+=q.v; jpRenderTeams(); }
  jpCell.classList.add('jp-used'); jpCell.textContent='✓'; jpCell.onmouseenter=null; jpCell.onmouseleave=null;
  document.getElementById('jp-modal').classList.remove('on');
  document.getElementById('jp-teamselect').classList.add('hidden');
  document.getElementById('jp-actions').classList.remove('hidden');
  jpUsed++;
  if(jpUsed>=20) jpShowEnd();
}

function jpShowEnd(){
  const list=document.getElementById('jp-end-list'); list.innerHTML='';
  [...jpTeams].sort((a,b)=>b.score-a.score).forEach((t,i)=>{
    const c=JP_CATEGORIES[i%4].color;
    const row=document.createElement('div');
    row.className='flex items-center gap-4 justify-center';
    row.innerHTML=`<span class="text-slate-300 font-bold" style="font-size:clamp(1rem,3vh,1.6rem)">${i===0?'🏆':(i+1)+'.'} ${t.name}</span>
      <span class="num font-bold" style="color:${c};font-size:clamp(1.3rem,4vh,2.4rem)">${t.score}</span>`;
    list.appendChild(row);
  });
  const e=document.getElementById('jp-end');
  e.classList.remove('hidden'); e.style.display='flex';
}

/* ════════ TIMER ════════ */
function jpStartTimer(){
  clearInterval(jpTimer); jpTime=30;
  const bar=document.getElementById('jp-bar'), txt=document.getElementById('jp-time');
  const c=JP_CATEGORIES[jpCat].color;
  bar.style.width='100%'; bar.style.background=c;
  txt.textContent='30'; txt.className='num text-sm font-bold text-slate-400';
  jpTimer=setInterval(()=>{
    jpTime--; txt.textContent=jpTime; bar.style.width=(jpTime/30*100)+'%';
    if(jpTime<=10){ bar.style.background='#dc2626'; txt.className='num text-sm font-bold text-red-600'; }
    if(jpTime<=0){ clearInterval(jpTimer); jpBanner('⏰ Tiden är ute – övriga lag får chansen.'); }
  },1000);
}

/* ════════ HELSKÄRM ════════ */
function jpToggleFullscreen(){
  const s=document.getElementById('jp-stage');
  if(s.classList.contains('jp-fs')){ jpExitFullscreen(); return; }
  s.classList.add('jp-fs');
  document.getElementById('jp-fsbtn').textContent='⤫ Avsluta helskärm';
  if(s.requestFullscreen) s.requestFullscreen().catch(()=>{});
}
function jpExitFullscreen(){
  const s=document.getElementById('jp-stage');
  s.classList.remove('jp-fs');
  document.getElementById('jp-fsbtn').textContent='⛶ Helskärm';
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement) jpExitFullscreen();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('jp-modal').classList.contains('on')){ jpCloseModal(null); }
  else{ jpExitFullscreen(); }
});

jpRenderTeamInputs();
</script>
