<style>
  :root {
    --p:  #fb923c;
    --pl: #ffedd5;
    --pd: #7c2d12;
    --p-deep: #c2410c;
  }

  body { font-family: 'EB Garamond', serif; font-size: 1.08rem; background:#f8fafc; color:#1e293b; margin:0; }
  h1,h2,h3,h4,.fredoka { font-family: 'Fredoka', sans-serif; }

  .wrap { max-width: 52rem; margin: 0 auto; padding: 1.6rem 1.25rem 4rem; }

  /* ── Tillbaka ── */
  .back {
    display:inline-flex; align-items:center; gap:.35rem; font-family:'Fredoka',sans-serif;
    font-size:.88rem; color:#94a3b8; text-decoration:none; transition:color .15s;
  }
  .back:hover { color: var(--p-deep); }

  /* ── Header ── */
  .head { text-align:center; margin: 1.8rem 0 1.6rem; }
  .eyebrow {
    font-family:'Fredoka',sans-serif; font-size:.72rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.22em; color:var(--p-deep); margin:0 0 .5rem;
  }
  .head h1 {
    font-size: clamp(2rem, 6vw, 2.9rem); font-weight:700; font-style:italic;
    color:#0f172a; margin:0; line-height:1.1;
  }
  .rule { height:.25rem; width:5rem; border-radius:999px; background:var(--p); margin:.9rem auto 1.1rem; }
  .lead { font-size:1rem; color:#64748b; max-width:34rem; margin:0 auto; line-height:1.7; }
  .lead strong { color:var(--p-deep); font-weight:700; }

  /* ── Toggle ── */
  .pill-toggle {
    display:flex; gap:.3rem; justify-content:center; background:#fff; border:1px solid #e2e8f0;
    border-radius:999px; padding:.3rem; width:fit-content; margin:0 auto .6rem;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .pill-toggle button {
    padding: .5rem 1.4rem; border-radius: 999px; font-family:'Fredoka',sans-serif;
    font-weight: 600; font-size: .95rem; transition: all .2s; border: none; cursor: pointer;
  }
  .pill-toggle button.active   { background: var(--p); color: var(--pd); box-shadow:0 2px 8px rgba(251,146,60,.35); }
  .pill-toggle button.inactive { background: transparent; color: #94a3b8; }
  .mode-note {
    text-align:center; font-family:'Fredoka',sans-serif; font-size:.82rem; color:#94a3b8;
    margin:0 0 1.6rem;
  }

  /* ── Innehållsförteckning ── */
  .toc {
    background:#fff; border:1px solid #e2e8f0; border-radius:1.2rem;
    padding:.9rem 1rem; margin-bottom:1.6rem; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .toc-h {
    font-family:'Fredoka',sans-serif; font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; color:var(--p-deep); margin:.2rem .3rem .5rem;
  }
  .toc a {
    display:flex; align-items:center; gap:.7rem; padding:.55rem .8rem; border-radius:.75rem;
    color:#334155; text-decoration:none; transition:background .15s;
  }
  .toc a:hover { background: var(--pl); }
  .toc-n {
    flex:none; width:1.7rem; height:1.7rem; border-radius:50%; background:var(--pl); color:var(--pd);
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:.8rem;
    display:flex; align-items:center; justify-content:center;
  }
  .toc-t { flex:1; }

  .hint {
    text-align:center; font-size:.85rem; color:#94a3b8; margin:-.8rem 0 1.2rem;
    font-family:'Fredoka',sans-serif;
  }

  /* ── Avsnitt ── */
  .sec { margin-bottom: 1.4rem; scroll-margin-top: 1rem; }
  .sec-head {
    width:100%; display:flex; align-items:center; gap:.9rem; text-align:left;
    background:#fff; border:none; border-left:8px solid var(--p);
    border-radius:1rem; padding:1.1rem 1.2rem; cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .sec-emoji { flex:none; font-size:1.6rem; line-height:1; }
  .sec-titlewrap { flex:1; display:flex; flex-direction:column; gap:.15rem; }
  .sec-title { font-size:1.35rem; font-weight:600; color:#0f172a; line-height:1.25; font-family:'Fredoka',sans-serif; }
  .chev { flex:none; color:var(--p); font-size:1.1rem; transition:transform .25s; }
  .chev.open { transform: rotate(90deg); }

  /* ── Brödtext ── */
  .block { padding: .4rem .3rem 0; }
  .block h3 {
    font-size:1.12rem; font-weight:600; color:var(--pd);
    margin:1.6rem 0 .15rem;
  }
  .block p { margin:.5rem 0; line-height:1.85; color:#334155; }
  .block .term { color:var(--p-deep); font-weight:700; }
  .block ul { list-style:none; padding:0; margin:.6rem 0; }
  .block ul li { position:relative; padding:.22rem 0 .22rem 1.5rem; color:#334155; line-height:1.7; }
  .block ul li::before { content:'→'; position:absolute; left:0; color:var(--p); font-weight:700; }

  .ex {
    background:#fff; border:1px solid var(--pl); border-left:4px solid var(--p);
    border-radius:0 .8rem .8rem 0; padding:.7rem 1rem; margin:.8rem 0;
    font-size:.97rem; color:#7c2d12; line-height:1.7;
  }
  .ex .term { color:var(--p-deep); }

  .fundera {
    background:#fff; border:2px dashed var(--p); border-radius:1rem;
    padding:.8rem 1.1rem; margin:1.2rem 0; color:#334155; line-height:1.7;
  }
  .fundera-h { font-family:'Fredoka',sans-serif; font-weight:700; color:var(--p-deep); font-size:.9rem; margin-bottom:.2rem; }

  .komihag {
    background:var(--pl); border:2px solid var(--p); border-radius:1.2rem;
    padding:1.1rem 1.3rem; margin:1.8rem 0 .4rem;
  }
  .komihag-h {
    font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:700;
    color:var(--pd); margin-bottom:.5rem;
  }
  .komihag ul { list-style:none; padding:0; margin:0; }
  .komihag li { position:relative; padding:.28rem 0 .28rem 1.6rem; color:var(--pd); line-height:1.65; }
  .komihag li::before { content:'✓'; position:absolute; left:0; font-weight:700; color:var(--p-deep); }
  .komihag .term { font-weight:700; color:var(--p-deep); }

  /* ── Bildplats ── */
  .bildplats {
    border:2px dashed #cbd5e1; background:#f8fafc; border-radius:1.2rem;
    padding:1rem 1.2rem; margin:1.4rem 0; display:flex; gap:.8rem; align-items:flex-start;
  }
  .bildplats-i { flex:none; font-size:1.5rem; line-height:1; }
  .bildplats-t {
    font-family:'Fredoka',sans-serif; font-size:.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.12em; color:#64748b; margin-bottom:.25rem;
  }
  .bildplats-d { font-size:.92rem; color:#475569; line-height:1.6; }

  /* ── Tabell ── */
  .tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:.8rem 0; }
  .tbl { border-collapse:collapse; width:100%; font-size:.95rem; background:#fff; border-radius:.8rem; overflow:hidden; }
  .tbl th, .tbl td { padding:.55rem .7rem; text-align:left; border-bottom:1px solid #e2e8f0; vertical-align:top; line-height:1.5; }
  .tbl th { font-family:'Fredoka',sans-serif; font-size:.75rem; text-transform:uppercase;
            letter-spacing:.06em; color:var(--pd); background:var(--pl); }
  .tbl tr:last-child td { border-bottom:none; }

  .to-top { text-align:center; margin:1rem 0 .2rem; }
  .to-top a { font-family:'Fredoka',sans-serif; font-size:.8rem; color:#94a3b8; text-decoration:none; }
  .to-top a:hover { color:var(--p-deep); }

  /* ── Öva vidare ── */
  .next {
    background:#fff; border-top:8px solid var(--p); border-radius:1.5rem;
    padding:1.4rem 1.4rem 1.5rem; margin-top:2.4rem; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .next h2 { font-size:1.3rem; font-weight:600; margin:0 0 .3rem; color:#0f172a; }
  .next p { margin:0 0 1rem; color:#64748b; line-height:1.6; }
  .next-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.7rem; }
  .next-btn {
    display:flex; align-items:center; gap:.6rem; padding:.85rem 1rem; border-radius:1rem;
    font-family:'Fredoka',sans-serif; font-weight:600; text-decoration:none; transition:transform .15s, background .15s;
  }
  .next-btn:hover { transform:translateY(-2px); }
  .next-btn.primary { background:var(--p); color:var(--pd); }
  .next-btn.ghost { background:var(--pl); color:var(--pd); border:1px solid #fed7aa; }
  .next-btn.wide { grid-column:1 / -1; }

  /* ── Footer ── */
  .foot { text-align:center; margin-top:3rem; color:#94a3b8; font-size:.85rem; line-height:1.7; }
  .foot .by { font-style:italic; }

  /* ── Mobil ── */
  @media (max-width: 767px) {
    body { font-size: 1rem; }
    .wrap { padding: 1.2rem .9rem 3rem; }
    .sec-title { font-size: 1.15rem; }
    .sec-head { padding: .85rem .9rem; gap:.65rem; border-left-width:6px; }
    .sec-emoji { font-size:1.35rem; }
    .block h3 { font-size: 1.05rem; }
    .block p  { line-height: 1.75; }
    .pill-toggle button { padding:.45rem 1.05rem; font-size:.88rem; }
    .next-grid { grid-template-columns:1fr; }
    .bildplats { padding:.85rem .9rem; }
    .tbl { font-size:.88rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<script>
  /* Smart tillbaka-navigering: history.back() inom samma domän,
     annars fallback till områdessidan (aldrig hårdkodat index.html). */
  function smartBack(e) {
    if (e && e.preventDefault) e.preventDefault();
    try {
      if (document.referrer &&
          new URL(document.referrer).hostname === window.location.hostname) {
        history.back();
        return;
      }
    } catch (err) {}
    window.location.href = 'sh1a2_samhallsekonomi.html';
  }
</script>

<script type="text/babel">
const { useState, useEffect } = React;

/* ---------- Textformatering: **term** -> markerad fackterm, *ord* -> kursiv ---------- */
function fmt(text) {
  const parts = String(text).split(/(\*\*.+?\*\*|\*[^*\s][^*]*?\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith('**') && part.endsWith('**') && part.length > 4)
      return <strong key={i} className="term">{part.slice(2, -2)}</strong>;
    if (part.startsWith('*') && part.endsWith('*') && part.length > 2)
      return <em key={i}>{part.slice(1, -1)}</em>;
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
}

/* ===================== INNEHÅLLSKOMPONENTER ===================== */

/* Lättläst: en tanke per stycke – varje rad i p[] blir ett eget stycke. */
function Block({ b }) {
  return (
    <div>
      <h3>{b.h}</h3>
      {(b.p || []).map((t, i) => <p key={i}>{fmt(t)}</p>)}
      {b.lista && (
        <ul>
          {b.lista.map((t, i) => <li key={i}>{fmt(t)}</li>)}
        </ul>
      )}
      {b.tabell && (
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>{b.tabell.huvud.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
            <tbody>
              {b.tabell.rader.map((r, i) => (
                <tr key={i}>{r.map((c, j) => <td key={j}>{fmt(c)}</td>)}</tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {b.ex && <div className="ex">{fmt(b.ex)}</div>}
    </div>
  );
}

function Bildplats({ titel, text }) {
  return (
    <div className="bildplats" role="note">
      <span className="bildplats-i" aria-hidden="true">🖼️</span>
      <div>
        <div className="bildplats-t">[BILDPLATS] {titel}</div>
        <div className="bildplats-d">{text}</div>
      </div>
    </div>
  );
}

function KomIhag({ punkter }) {
  return (
    <div className="komihag">
      <div className="komihag-h">💡 Kom ihåg</div>
      <ul>
        {punkter.map((t, i) => <li key={i}>{fmt(t)}</li>)}
      </ul>
    </div>
  );
}

function Section({ sec, mode, open, toggle }) {
  const blocks = mode === 'lattlast' ? sec.lattlast : sec.fordjupning;
  return (
    <section id={sec.id} className="sec">
      <button className="sec-head" onClick={() => toggle(sec.id)}
              aria-expanded={open} aria-controls={sec.id + '-body'}>
        <span className="sec-emoji">{sec.emoji}</span>
        <span className="sec-titlewrap">
          <span className="sec-title">{sec.rubrik}</span>
        </span>
        <span className={'chev' + (open ? ' open' : '')}>▶</span>
      </button>

      {open && (
        <div className="block" id={sec.id + '-body'}>
          {blocks.map((b, i) => <Block b={b} key={i} />)}

          {(sec.bild || []).map((bp, i) => <Bildplats key={i} titel={bp.titel} text={bp.text} />)}

          {sec.fundera && (
            <div className="fundera">
              <div className="fundera-h">🤔 Fundera</div>
              {fmt(sec.fundera)}
            </div>
          )}

          <KomIhag punkter={sec.komihag} />

          <div className="to-top">
            <a href="#toppen" onClick={(e) => {
              e.preventDefault();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }}>↑ Till toppen</a>
          </div>
        </div>
      )}
    </section>
  );
}

/* ===================== APP ===================== */

function App() {
  const [mode, setMode] = useState(() => {
    try {
      const saved = sessionStorage.getItem(PAGE.storeKey);
      if (saved === 'lattlast' || saved === 'fordjupning') return saved;
    } catch (e) {}
    return 'lattlast';
  });

  const [isMobile, setIsMobile] = useState(
    () => typeof window !== 'undefined' && window.innerWidth < 768
  );
  const [open, setOpen] = useState(() => new Set(SECTIONS.map(s => s.id)));

  useEffect(() => {
    function onResize() {
      const m = window.innerWidth < 768;
      setIsMobile(prev => (prev === m ? prev : m));
    }
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  useEffect(() => {
    setOpen(isMobile ? new Set() : new Set(SECTIONS.map(s => s.id)));
  }, [isMobile]);

  useEffect(() => {
    try { sessionStorage.setItem(PAGE.storeKey, mode); } catch (e) {}
  }, [mode]);

  /* Djuplänk: öppnar och scrollar till avsnittet i URL:ens hash. */
  useEffect(() => {
    function openFromHash() {
      const id = decodeURIComponent((window.location.hash || '').replace('#', ''));
      if (!id || !SECTIONS.some(sec => sec.id === id)) return;
      setOpen(prev => {
        const next = new Set(prev);
        next.add(id);
        return next;
      });
      window.setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 120);
    }
    openFromHash();
    window.addEventListener('hashchange', openFromHash);
    return () => window.removeEventListener('hashchange', openFromHash);
  }, [isMobile]);

  const toggle = (id) => {
    setOpen(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const goto = (e, id) => {
    e.preventDefault();
    setOpen(prev => {
      const next = new Set(prev);
      next.add(id);
      return next;
    });
    window.setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
  };

  return (
    <div className="wrap" id="toppen">

      <a href="sh1a2_samhallsekonomi.html" className="back" onClick={smartBack}>
        ← Tillbaka till Samhällsekonomi
      </a>

      <header className="head">
        <p className="eyebrow">{PAGE.eyebrow}</p>
        <h1>{PAGE.titel}</h1>
        <div className="rule"></div>
        <p className="lead">
          Pluggmaterial i {SECTIONS.length} avsnitt. Välj <strong>Lättläst</strong> för korta, enkla förklaringar
          eller <strong>Fördjupning</strong> för resonemang, samband och orsak–verkan.
        </p>
      </header>

      <div className="pill-toggle" role="tablist" aria-label="Välj läge">
        <button role="tab" aria-selected={mode === 'lattlast'}
                className={mode === 'lattlast' ? 'active' : 'inactive'}
                onClick={() => setMode('lattlast')}>Lättläst</button>
        <button role="tab" aria-selected={mode === 'fordjupning'}
                className={mode === 'fordjupning' ? 'active' : 'inactive'}
                onClick={() => setMode('fordjupning')}>Fördjupning</button>
      </div>
      <p className="mode-note">
        {mode === 'lattlast'
          ? 'Lättläst: korta meningar och exempel från vardagen.'
          : 'Fördjupning: samma rubriker, men med fler samband och exempel.'}
      </p>

      <nav className="toc" aria-label="Innehåll">
        <div className="toc-h">Innehåll</div>
        {SECTIONS.map((s, i) => (
          <a href={'#' + s.id} key={s.id} onClick={(e) => goto(e, s.id)}>
            <span className="toc-n">{i + 1}</span>
            <span className="toc-t">{s.rubrik}</span>
          </a>
        ))}
      </nav>

      {isMobile && (
        <p className="hint">Tryck på en rubrik för att öppna avsnittet.</p>
      )}

      {SECTIONS.map(s => (
        <Section key={s.id} sec={s} mode={mode}
                 open={open.has(s.id)} toggle={toggle} />
      ))}

      <section className="next" aria-label="Öva vidare">
        <h2>Öva vidare</h2>
        <p>Har du läst klart? Testa dig själv på områdets begrepp och quiz.</p>
        <div className="next-grid">
          <a className="next-btn ghost" href="sh_ekonomibegrepp.html">📖 Öva på begrepp</a>
          <a className="next-btn primary" href="sh_ekonomi.html">🎯 Starta quizet</a>
          <a className="next-btn ghost wide" href={PAGE.andra.href}>📚 {PAGE.andra.label}</a>
        </div>
      </section>

      <footer className="foot">
        <p>Källa: {PAGE.kalla}</p>
        <p className="by">Designad av John</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script src="feedback-widget.js" defer></script>
<script data-goatcounter="https://johnblixt.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
