  fordjupning: [
    { h: null, p: [
      "Ekonomi kan vara komplicerat och sammanhangen svåra att överblicka. För att förstå hur allt hänger ihop kan det vara bra att börja med att förenkla till två aktörer:"
    ], lista: [
      "**Hushåll.** Alla medborgare tillhör ett hushåll. I Sverige finns nästan fem miljoner hushåll, och knappt hälften är ensamhushåll. Hushållen är samhällsekonomins motor eftersom de har behov som gör att de vill köpa saker, och det är från hushållen som företagen får sin arbetskraft. Inkomsterna – löner, räntor och bidrag – används till allt från mat och kläder till resor och digitala tjänster.",
      "**Företag.** Företagen är samhällsekonomins verkstad och producerar varor och tjänster. Intäkter och kostnader måste gå ihop, helst med vinst. Går ett företag med förlust under en längre tid måste det sannolikt läggas ned."

    { h: "Hushåll och företag möts på marknaden", p: [

      "För att samspelet ska fungera behöver hushåll och företag en mötesplats: **marknaden**. Här kommer hushåll (konsumenter) och företag (producenter) överens om köp och försäljning. Sambandet går åt båda håll: hushållen är både köpare av företagens produkter och företagens arbetskraft."
    ]},
    { h: "Produktion", p: [
      "Vill du ha drickbart vatten i kranen måste vattnet först ha renats och transporterats dit; vill du ha bröd till frukost måste någon ha bakat det. För att kunna nyttja resurserna måste vi alltså sätta i gång en produktion.",
      "De resurser som behövs kallas **produktionsfaktorer** (ibland produktionsmedel). Det finns tre typer:"
    ], lista: [
      "**Naturresurser** – *råvaror* som förädlas till färdiga produkter: jord, skog, mineraler och metaller, men också *energiresurser* som kol, olja och vattenkraft. Även **halvfabrikat** som stål och plast räknas hit.",
      "**Arbete** – människors kunskaper och färdigheter. Förr betydde kroppsstyrkan mycket, men med maskinkraftens intåg har ”hjärnkraften” fått allt större betydelse. Människors intellektuella och sociala förmågor räknas därför som en särskild ekonomisk tillgång, **humankapital**.",
      "**Realkapital** – maskiner och redskap, från stege och spade till industrirobotar och datorsystem, men också fabriksbyggnader och transportsystem."

    { h: "Resursanvändning", p: [
      "En potatisodlare har fått en årsskörd på 100 säckar. Hur mycket ska bli matpotatis, och hur mycket ska sättas tillbaka i jorden för att ge nya potatisar nästa år? Lägger odlaren undan 20 säckar som sättpotatis och använder 80 som matpotatis, investerar hen 20 säckar i framtida skörd.",
      "Det som produceras kan alltså användas på två sätt. **Konsumtion** är att omedelbart förbruka något. En **investering** är att avstå från konsumtion i dag för att säkra eller till och med öka konsumtionen i morgon. Avvägningen innebär att välja mellan att förbruka något nu eller i framtiden.",
      "I verkligheten handlar det om att prioritera vad vi ska producera: varor och tjänster som direkt uppfyller människors behov, som mat, kläder och bilar – eller underhåll och utbyggnad av själva produktionsapparaten, som fabriker, vägar och elnät. Det är en fördelning mellan *konsumtionsvaror* och *investeringsvaror*. Väl avvägda beslut ger balans mellan omedelbar nytta och framtida möjligheter, och det gäller att tänka långsiktigt för att uppnå hållbarhet.",
      "Följer man flödet av varor från företagen ser man att alla produkter inte hamnar hos hushållen – en del slutar som en maskin, en kontorsbyggnad eller ett järnvägsspår. Produktionen delar sig i två strömmar: konsumtionsvaror till hushållen och investeringsvaror som ersätter eller bygger ut produktionsapparaten."

    { h: "Cirkulär ekonomi", p: [
      "För att bli mer hållbar behöver samhällsekonomin organiseras så att resurser inte överutnyttjas och miljön inte förstörs. Resurserna bör ses som något värdefullt som kan användas om och om igen: biologiskt material ska kunna brytas ned naturligt, medan övriga produkter ska utformas för att kunna återanvändas.",
      "En samhällsekonomi byggd på återvinning och återbruk kallas **cirkulär ekonomi** eller **kretsloppsekonomi**. Den är raka motsatsen till den linjära ekonomin som dominerat sedan industrialiseringen: producera – konsumera – släng.",
      "Den växande second hand-marknaden är ett konkret exempel. När en produkt får en ny ägare förlängs dess livslängd, vilket sparar resurser och minskar avfallet. Produkter som inte längre går att använda kan återvinnas, så att komponenter eller kemiska beståndsdelar används i nya produkter.",

    { h: "Bruttonationalprodukten", p: [
      "Hur mycket produceras i ett land? Ökar eller minskar produktionen, och hur ligger landet till jämfört med andra? För att svara behövs ett mått: **bruttonationalprodukten (BNP)**, som anger värdet av alla färdiga varor och tjänster som produceras i ett land under ett år. Värdet är det pris som betalas när produkten säljs.",
      "En vara är lätt att värdera – priset står på prislappen. Offentliga tjänster som sjukvård och försvar går däremot inte att köpa i en butik. Där utgår man i stället från vad tjänsten kostar att framställa: löner, lokalhyror, datorer och annan utrustning.",

    { h: "Näringslivet", p: [
      "För inte så länge sedan dominerades näringslivet av naturbruk. Vid 1800-talets början fick nio av tio svenskar sin försörjning från jord- och skogsbruk, jakt och fiske. Med industrialiseringen flyttades tyngdpunkten till tillverkningsindustrin, där de nya arbetstillfällena fanns.",
      "**Näringslivet** är samhällsekonomins verkstad: alla företag som producerar varor och tjänster för landets invånare och för den globala marknaden – från små enskilda firmor till stora exportföretag. Dagens svenska näringsliv delas i tre delar:"
    ], lista: [
      "**Privat näringsliv** – företag som ägs av privatpersoner och drivs som aktiebolag, handelsbolag eller enskilda firmor. Härifrån kommer nästan all varuproduktion. Tjänsteproduktionen kommer till hälften från privata näringslivet (t.ex. taxibolag, restauranger, livsmedelsaffärer) och till hälften från den offentliga sektorn (vård, skola, omsorg). Sedan mitten av 1990-talet utförs dock många offentliga tjänster av privata företag finansierade av skattemedel, till exempel friskolor och vårdbolag.",
      "**Kooperation** – ekonomiska föreningar som ägs och drivs gemensamt av medlemmarna, antingen producenter (t.ex. LRF, Lantbrukarnas Riksförbund) eller konsumenter (t.ex. KF, Kooperativa Förbundet, som äger Coop).",
      "**Statliga och kommunala bolag** – bedriver affärsmässig verksamhet på en marknad. På 1990-talet tog ”bolagisering” och ”privatisering” fart: Posten blev aktiebolag (i dag PostNord AB) och stora delar av Televerket privatiserades (i dag Telia Company AB). Staten har behållit basnäringar som LKAB (gruvor) och Sveaskog (skog), och äger bolag man av olika skäl inte vill privatisera: Systembolaget, Vattenfall och Svenska Spel."

    { h: "Utrikeshandeln", p: [
      "Den som i dag utvecklar en app tänker inte i första hand på att sälja den i Sverige utan i så många länder som möjligt. Många svenska företag, som Ericsson, Electrolux, SKF och Atlas Copco, har sedan länge haft sina viktigaste marknader utanför Sverige.",
      "Att **exportera** är att sälja varor och tjänster till ett annat land. Sedan andra världskriget har Sveriges **export** ökat markant och utgör i dag över hälften av BNP. Sverige är en liten öppen ekonomi, beroende av export och internationella leverantörskedjor.",
      "Små länder är överlag mer beroende av *utrikeshandel* än stora. Med begränsade resurser och liten folkmängd måste Sverige exportera mycket för att ha råd med **import** – att köpa från utlandet. I stora länder som USA och Japan sker i stället det mesta av handeln inom landet. Den svenska ekonomin är nästan fem gånger mer beroende av utrikeshandel än USA:s. Handeln gör att svenska företag kan sälja på större marknader och att vi som kunder får mer att välja på och bättre priser.",
      "Tidigare exporterade Sverige främst råvaror som järn, stål och trä. I dag utgörs exporten till stor del av verkstadsprodukter – maskiner, fordon och elektronik – och produkterna blir allt mer avancerade. Råvaruexporten är fortfarande viktig, särskilt bearbetade råvaror som specialstål, trävaror och pappersprodukter; staten får till exempel stora inkomster från järnmalmsexporten genom LKAB.",

    { h: "Näringsliv i förändring", p: [
      "Trots att vi för länge sedan lämnat industrisamhället skapas fortfarande stora värden i den *traditionella industrin*. För att stå emot konkurrensen har företagen genomfört rationaliseringar: gamla metoder har ersatts med ny teknik och arbetsorganisationen har förändrats. Samtidigt pågår en omvandling av näringslivet där den *digitala revolutionen* – automatisering, *artificiell intelligens* och *dataanalys* – förändrar både produktion och arbetsliv, och där miljömedvetenhet och klimathotet driver på.",
      "**Plattformsekonomin** bygger på digitala plattformar och appar där individer kan hitta kortvariga, tillfälliga och ofta frilansbaserade uppdrag, som att transportera personer (Uber) eller leverera mat (Foodora). Detta kallas **gigekonomi** – ”gig” betyder engångsuppdrag. I **delningsekonomin** delar människor via plattformar med sig av sina tillgångar, till exempel boende (Airbnb) eller redskap och verktyg (Hygglo).",
      "Fördelarna är nya jobbmöjligheter, särskilt för dem som vill ha flexibla tider eller deltid, högre effektivitet när oanvända resurser kommer till nytta, och tillväxt genom nya marknader. Baksidorna är otrygga anställningsförhållanden, bristfälliga arbetsmiljöer och skattefusk – och traditionella företag som taxibolag och hotell riskerar att tappa marknadsandelar och tvingas minska personalen eller lägga ned. Samma förändring kan alltså skapa jobb på ett ställe och ta bort dem på ett annat.",
      "**Grön teknik:** många företag försöker bli mer *klimatneutrala* och *resurssnåla* – inte bara av omsorg om miljön, utan också för att möta konsumenternas förväntningar, behålla konkurrenskraften och stärka varumärket. IKEA investerar i möbler av återvunnet material och erbjuder solpaneler; Vattenfall arbetar med energilagring och el från sol och vind. Stålindustrin, en av de mest energikrävande industrierna, satsar på att byta kol mot vätgas – då bildas vatten i stället för koldioxid."
    ]},
    { h: "Från jordbruksekonomi till tjänstesamhälle", p: [

      "**God information.** Aktörerna ska ha god information om bland annat pris och kvalitet för att kunna fatta kloka beslut.",
      "**Laissez-faire** (”låt vara”). För mycket statlig inblandning rubbar marknadsmekanismen, så staten och politikerna bör så mycket som möjligt lämna marknaden i fred."
    ]},
    { h: "När priserna ökar – om inflation", p: [
      "”När jag var liten kostade en kola 5 öre” eller ”på 1800-talet kostade en middag på restaurang 1:50, dryck inräknad”. Sådana siffror kan vara kul men säger inget om vad pengar verkligen var värda. Intressanta blir de först när vi jämför dem med hur länge man behövde arbeta för att köpa något: om restaurangbesöket på 1:50 motsvarade en hel dagsinkomst för en vanlig arbetare i Stockholm på 1860-talet låter det inte så billigt längre."
    ], under: [
      { h: "Vad är inflation?", p: [
        "Med **inflation** menas en allmän prisökning i samhällsekonomin; ordet betyder egentligen ”blåsa upp”. Vanligast är att mäta förändringen i priserna på det vi köper: Statistiska centralbyrån (SCB) ”köper” varje månad en korg med varor och tjänster – bland annat livsmedel, hyror, kläder, bensin, taxiresor och restaurangbesök – och jämför priset med vad samma korg kostade vid samma tid året innan. Prisförändringen uttrycks i procent och kallas **konsumentprisindex (KPI)**."
      ]},
      { h: "Inflation och köpkraft", p: [
        "Att priser stiger är naturligt. Först när prisökningarna blir stora, över 5–6 procent om året, blir det mer problematiskt. Då stiger ofta lönerna också, vilket ökar företagens kostnader och tvingar dem att höja priserna, vilket i sin tur leder till krav på högre löner – och löneökningarna äts upp av prisökningarna.",
        "För att beskriva detta används begreppet **reallön**: skillnaden mellan den nominella lönen (lönen i kronor) och inflationen. Det är reallönen som avgör vår **köpkraft**, det vill säga hur mycket varor och tjänster vi kan köpa för pengarna.",
        "Minskar köpkraften kraftigt kan förtroendet för pengarna skadas, och många försöker byta dem mot något med fastare värde, som guld eller fastigheter. Försvinner förtroendet helt blir pengarna bara papperslappar eller elektroniska signaler – värdelösa. Prismekanismen slutar då fungera, vilket drabbar produktion och handel. Därför är hög inflation så skadlig."
      ]},
      { h: "Hyperinflation", p: [
        "1922 hamnade den tyska valutan i en vanvettig inflationskarusell, en så kallad **hyperinflation**. Regeringen hade betalat tillbaka sina krigsskulder genom att trycka fler sedlar, vilket gjorde att pengarnas värde minskade och inflationen nådde nya rekordnivåer. En måltid på en restaurang i Berlin kunde kosta en och en halv miljard mark plus 400 miljoner i dricks.",
        "Hyperinflationen blev ett skrämmande exempel på vad som kan hända när en ekonomi hamnar ur kontroll, och ledde till allvarliga ekonomiska och sociala spänningar med långvariga konsekvenser för landet."
      ]},
      { h: "Deflation", p: [
        "Om inflationen närmar sig noll eller priserna till och med börjar falla talar man om **deflation** – en allmän sänkning av priserna. När allt blir billigare i morgon väljer en del att spara i stället för att handla. Efterfrågan minskar, företagen drar ner på produktionen och arbetslösheten ökar, vilket minskar efterfrågan ytterligare.",
        "Det kan skapa en negativ spiral med minskad ekonomisk aktivitet, och det kan vara mycket svårt för ett land att ta sig ur ett läge med deflation. Detta har tidigare bland annat drabbat Japan och flera länder i Europa."
      ]}
    ]}
  ],
  extra: {
    "Utbuds- och efterfrågemodellen": {

    }
  },
  komihag: [
    "Pengar är **värdemätare**, **värdebevarare** och **betalningsmedel** – och fungerar bara så länge vi har förtroende för dem.",
    "**Prismekanismen**: där **efterfrågekurvan** (lutar nedåt) och **utbudskurvan** (lutar uppåt) möts finns **jämviktspriset**. För högt pris → överskott, för lågt → brist.",
    "**Inflation** = allmän prisökning, mäts med **KPI**. **Reallönen** avgör köpkraften. Både **hyperinflation** och **deflation** skadar ekonomin."

}

];

<script type="text/babel">
const { useState, useEffect } = React;

/* ---------- Textformatering: **term** -> markerad fackterm, *ord* -> kursiv ---------- */
function fmt(text) {
  const parts = String(text).split(/(\*\*.+?\*\*|\*[^*\s][^*]*?\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith('**') && part.endsWith('**') && part.length > 4)
      return <strong key={i} className="term">{part.slice(2, -2)}</strong>;
    if (part.startsWith('*') && part.endsWith('*') && part.length > 2)
      return <em key={i}>{part.slice(1, -1)}</em>;
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
}

/* ===================== INBYGGDA DIAGRAM (SVG) ===================== */

const C = { p: '#fb923c', pd: '#7c2d12', deep: '#c2410c', ax: '#334155', mute: '#94a3b8', blue: '#0369a1' };

function Arrowheads() {
  return (
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

      </marker>
      <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill={C.deep} />
      </marker>
      <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill={C.blue} />
      </marker>
    </defs>
  );
}

/* Konjunkturcykel: vågrörelse kring en stigande tillväxttrend. */
function KonjunkturSVG() {
  const x0 = 70, x1 = 580, yA = 250, yB = 95, amp = 40, cykler = 2.25;
  const trend = x => yA - (x - x0) * (yA - yB) / (x1 - x0);
  const fas = x => (x - x0) / (x1 - x0) * cykler * 2 * Math.PI;
  const pts = [];
  for (let x = x0; x <= x1; x += 4) pts.push([x, trend(x) - amp * Math.sin(fas(x))]);
  const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
  const xAt = k => x0 + k / (cykler * 2) * (x1 - x0);   // k i halvperioder
  const toppar = [0.5, 2.5].map(xAt), dalar = [1.5, 3.5].map(xAt);
  return (
    <svg viewBox="0 0 620 330" role="img" aria-labelledby="kj-t kj-d">
      <title id="kj-t">Konjunkturcykeln</title>
      <desc id="kj-d">BNP växer längs en stigande tillväxttrend. Den verkliga produktionen svänger i vågor runt trenden: topparna är högkonjunktur och dalarna lågkonjunktur.</desc>
      <Arrowheads />
      <line x1={x0} y1="290" x2={x0} y2="28" stroke={C.ax} strokeWidth="2" markerEnd="url(#ah)" />
      <line x1={x0} y1="290" x2="600" y2="290" stroke={C.ax} strokeWidth="2" markerEnd="url(#ah)" />
      <text x="22" y="160" fontSize="14" fill={C.ax} transform="rotate(-90 22 160)" textAnchor="middle">BNP (produktion)</text>
      <text x="596" y="314" fontSize="14" fill={C.ax} textAnchor="end">Tid</text>
      <line x1={x0} y1={yA} x2={x1} y2={yB} stroke={C.mute} strokeWidth="2.5" strokeDasharray="8 6" />
      <text x={x1 - 4} y={yB - 50} fontSize="14" fill="#475569" textAnchor="end">Tillväxttrend</text>
      <line x1={x1 - 40} y1={yB - 44} x2={x1 - 8} y2={trend(x1 - 8) - 4} stroke={C.mute} strokeWidth="1.2" />
      <path d={d} fill="none" stroke={C.p} strokeWidth="4" strokeLinecap="round" />
      {toppar.map((x, i) => (
        <g key={'t' + i}>
          <circle cx={x} cy={trend(x) - amp} r="5" fill={C.deep} />
          <text x={x} y={trend(x) - amp - 14} fontSize="14" fontWeight="600" fill={C.deep} textAnchor="middle">Högkonjunktur</text>
        </g>
      ))}
      {dalar.map((x, i) => (
        <g key={'d' + i}>
          <circle cx={x} cy={trend(x) + amp} r="5" fill={C.blue} />
          <text x={x} y={trend(x) + amp + 24} fontSize="14" fontWeight="600" fill={C.blue} textAnchor="middle">Lågkonjunktur</text>
        </g>
      ))}
    </svg>
  );
}

/* Utbud och efterfrågan: jordgubbsmarknaden med jämviktspris, överskott och brist. */
function UtbudSVG() {
  const O = [80, 320];                                   // origo
  const e = [[120, 60], [540, 290]], u = [[120, 290], [540, 60]];
  const xOn = (L, y) => L[0][0] + (y - L[0][1]) * (L[1][0] - L[0][0]) / (L[1][1] - L[0][1]);
  const J = [330, 175];                                  // skärningspunkt
  const yHog = 100, yLag = 250;
  return (
    <svg viewBox="0 0 620 370" role="img" aria-labelledby="ue-t ue-d">
      <title id="ue-t">Utbud och efterfrågan på jordgubbar</title>
      <desc id="ue-d">Efterfrågekurvan e lutar nedåt och utbudskurvan u lutar uppåt. Där de korsas finns jämviktspriset. Vid ett för högt pris blir det överskott, vid ett för lågt pris blir det brist.</desc>
      <Arrowheads />
      <line x1={O[0]} y1={O[1]} x2={O[0]} y2="28" stroke={C.ax} strokeWidth="2" markerEnd="url(#ah)" />

      <text x="596" y="350" fontSize="15" fontWeight="600" fill={C.ax} textAnchor="end">Mängd jordgubbar</text>

      {/* Överskott vid för högt pris */}
      <line x1={xOn(e, yHog)} y1={yHog} x2={xOn(u, yHog)} y2={yHog} stroke={C.deep} strokeWidth="2" strokeDasharray="5 4" />
      <text x={(xOn(e, yHog) + xOn(u, yHog)) / 2} y={yHog - 8} fontSize="13" fill={C.deep} textAnchor="middle">För högt pris → överskott</text>
      {/* Brist vid för lågt pris */}
      <line x1={xOn(u, yLag)} y1={yLag} x2={xOn(e, yLag)} y2={yLag} stroke={C.blue} strokeWidth="2" strokeDasharray="5 4" />
      <text x={(xOn(u, yLag) + xOn(e, yLag)) / 2} y={yLag + 20} fontSize="13" fill={C.blue} textAnchor="middle">För lågt pris → brist och köer</text>

      <line x1={u[0][0]} y1={u[0][1]} x2={u[1][0]} y2={u[1][1]} stroke={C.p} strokeWidth="4" strokeLinecap="round" />
      <text x={e[1][0] + 8} y={e[1][1] + 5} fontSize="18" fontWeight="700" fill={C.blue}>e</text>
      <text x={u[1][0] + 8} y={u[1][1] + 5} fontSize="18" fontWeight="700" fill={C.deep}>u</text>

      <line x1={O[0]} y1={J[1]} x2={J[0]} y2={J[1]} stroke={C.mute} strokeWidth="1.5" strokeDasharray="4 4" />
      <line x1={J[0]} y1={J[1]} x2={J[0]} y2={O[1]} stroke={C.mute} strokeWidth="1.5" strokeDasharray="4 4" />
      <circle cx={J[0]} cy={J[1]} r="7" fill="#fff" stroke={C.pd} strokeWidth="3" />
      <text x={J[0] + 14} y={J[1] + 5} fontSize="14" fontWeight="600" fill={C.pd}>Jämvikt</text>
      <text x={O[0] - 6} y={J[1] - 6} fontSize="12" fill={C.pd} textAnchor="end">Jämvikts-</text>
      <text x={O[0] - 6} y={J[1] + 9} fontSize="12" fill={C.pd} textAnchor="end">pris</text>
    </svg>
  );
}

/* Det ekonomiska kretsloppet: hushåll och företag möts på marknaden. */

const DIAGRAMS = {

/* ===================== INNEHÅLLSKOMPONENTER ===================== */

/* Citat (extra.citat) placeras direkt efter blockets första stycken, som i källan,
   så att texten som kommenterar citatet hamnar efter det. */
function Citat({ list }) {
  return (list || []).map((c, i) => (
    <blockquote className="citat" key={"c" + i}>
      {c.text}
      {c.kalla && <span className="citat-k">— {c.kalla}</span>}
    </blockquote>
  ));
}

function Block({ b, x, sub }) {
  return (
    <div>
      {b.h && (sub ? <h4>{b.h}</h4> : <h3>{b.h}</h3>)}
      {(b.p || []).map((t, i) => <p key={i}>{fmt(t)}</p>)}
      <Citat list={x && x.citat} />
      {(b.mellan || []).map((t, i) => <p key={"m" + i}>{fmt(t)}</p>)}
      {b.lista && (
        <ul>
          {b.lista.map((t, i) => <li key={i}>{fmt(t)}</li>)}
        </ul>
      )}
      {(b.p2 || []).map((t, i) => <p key={'p2' + i}>{fmt(t)}</p>)}
      {b.tabell && (
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr>{b.tabell.huvud.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
            <tbody>
              {b.tabell.rader.map((r, i) => (
                <tr key={i}>{r.map((c, j) => <td key={j}>{fmt(c)}</td>)}</tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {b.stat && (
        <div className="stat">
          <div className="stat-h">📊 {b.stat.h}</div>
          <ul>{b.stat.lista.map((t, i) => <li key={i}>{fmt(t)}</li>)}</ul>
        </div>
      )}
      {(b.p3 || []).map((t, i) => <p key={'p3' + i}>{fmt(t)}</p>)}
      {b.ex && <div className="ex">{fmt(b.ex)}</div>}
      {(b.under || []).map((u, i) => <Block key={'u' + i} b={u} sub />)}
    </div>
  );
}

function Extra({ x }) {
  if (!x) return null;
  return (
    <>
      {x.diagram && <Diagram id={x.diagram} />}
      {(x.bild || []).map((bp, i) => (
        <div className="bildplats" role="note" key={'b' + i}>
          <span className="bildplats-i" aria-hidden="true">🖼️</span>
          <div>
            <div className="bildplats-t">[BILDPLATS] {bp.titel}</div>
            <div className="bildplats-d">{bp.text}</div>
          </div>
        </div>
      ))}
      {(x.fundera || []).map((f, i) => (
        <div className="fundera" key={'f' + i}>
          <div className="fundera-h">🤔 Fundera</div>
          {f}
        </div>
      ))}
    </>
  );
}

function Section({ sec, mode, nr }) {
  const blocks = mode === 'lattlast' ? sec.lattlast : sec.fordjupning;
  const extra = sec.extra || {};
  return (
    <section id={sec.id} className="sec">
      <div className="sec-head">
        <span className="sec-emoji" aria-hidden="true">{sec.emoji}</span>
        <h2 className="sec-title">{nr}. {sec.rubrik}</h2>
      </div>
      <p className="ingress"><b>Efter det här avsnittet</b>{fmt(sec.ingress)}</p>

      <div className="block">
        {blocks.map((b, i) => (
          <React.Fragment key={i}>
            <Block b={b} x={extra[b.h || ""]} />
            <Extra x={extra[b.h || '']} />
          </React.Fragment>
        ))}

        <div className="komihag">
          <div className="komihag-h">💡 Kom ihåg</div>
          <ul>{sec.komihag.map((t, i) => <li key={i}>{fmt(t)}</li>)}</ul>
        </div>

        <div className="to-top">
          <a href="#toppen" onClick={(e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }}>↑ Till toppen</a>
        </div>
      </div>
    </section>
  );
}

/* ===================== APP ===================== */

function App() {
  /* Läget sparas bara i sessionStorage under egen nyckel – påverkar inget annat. */
  const [mode, setMode] = useState(() => {
    try {
      const saved = sessionStorage.getItem(PAGE.storeKey);
      if (saved === 'lattlast' || saved === 'fordjupning') return saved;
    } catch (e) {}
    return 'lattlast';
  });
  const [active, setActive] = useState(SECTIONS[0].id);
  const [tocOpen, setTocOpen] = useState(false);

  useEffect(() => {
    try { sessionStorage.setItem(PAGE.storeKey, mode); } catch (e) {}
  }, [mode]);

  /* Markera aktuellt avsnitt i innehållsförteckningen. */
  useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(entries => {
      const vis = entries.filter(en => en.isIntersecting)
                         .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis.length) setActive(vis[0].target.id);
    }, { rootMargin: '-15% 0px -70% 0px' });
    SECTIONS.forEach(s => { const el = document.getElementById(s.id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);

  /* Djuplänk: scrolla till avsnittet i URL:ens hash när sidan laddats. */
  useEffect(() => {
    const id = decodeURIComponent((window.location.hash || '').replace('#', ''));
    if (!id) return;
    window.setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ block: 'start' });
    }, 150);
  }, []);

  const goto = (e, id) => {
    e.preventDefault();
    setTocOpen(false);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    try { history.replaceState(null, '', '#' + id); } catch (err) {}
  };

  const activeIdx = Math.max(0, SECTIONS.findIndex(s => s.id === active));

  return (
    <div className="wrap" id="toppen">

      <a href="sh1a2_samhallsekonomi.html" className="back" onClick={smartBack}>
        ← Tillbaka till Samhällsekonomi
      </a>

      <header className="head">
        <p className="eyebrow">{PAGE.eyebrow}</p>
        <h1>{PAGE.titel}</h1>
        <div className="rule"></div>
        <p className="lead">
          Pluggmaterial i {SECTIONS.length} avsnitt. Välj <strong>Lättläst</strong> för korta meningar och exempel
          från vardagen, eller <strong>Fördjupning</strong> för resonemang, orsak–verkan och samband.
        </p>
      </header>

      <div className="pill-toggle" role="tablist" aria-label="Välj läge">
        <button role="tab" aria-selected={mode === 'lattlast'}
                className={mode === 'lattlast' ? 'active' : 'inactive'}
                onClick={() => setMode('lattlast')}>Lättläst</button>
        <button role="tab" aria-selected={mode === 'fordjupning'}
                className={mode === 'fordjupning' ? 'active' : 'inactive'}
                onClick={() => setMode('fordjupning')}>Fördjupning</button>
      </div>
      <p className="mode-note">
        {mode === 'lattlast'
          ? 'Lättläst: korta meningar, en tanke i taget och exempel från vardagen.'
          : 'Fördjupning: samma rubriker, men med resonemang, orsak–verkan och samband.'}
      </p>

      <div className="layout">
        <nav className={'toc' + (tocOpen ? ' open' : '')} aria-label="Innehåll">
          <button className="toc-btn" onClick={() => setTocOpen(o => !o)} aria-expanded={tocOpen}>
            <span className="toc-btn-t">☰ {activeIdx + 1}. {SECTIONS[activeIdx].rubrik}</span>
            <span aria-hidden="true">{tocOpen ? '▲' : '▼'}</span>
          </button>
          <div className="toc-h">Innehåll</div>
          <div className="toc-list">
            {SECTIONS.map((s, i) => (
              <a href={'#' + s.id} key={s.id} onClick={(e) => goto(e, s.id)}
                 className={s.id === active ? 'active' : ''}>
                <span className="toc-n">{i + 1}</span>
                <span className="toc-t">{s.rubrik}</span>
              </a>
            ))}
          </div>
        </nav>

        <main>
          {SECTIONS.map((s, i) => <Section key={s.id} sec={s} mode={mode} nr={i + 1} />)}

          <section className="next" aria-label="Öva vidare">
            <h2>Öva vidare</h2>
            <p>Har du läst klart? Testa dig själv på områdets begrepp och quiz.</p>
            <div className="next-grid">
              <a className="next-btn ghost" href="sh_ekonomibegrepp.html">📖 Öva på begrepp</a>
              <a className="next-btn primary" href="sh_ekonomi.html">🎯 Starta quizet</a>
              <a className="next-btn ghost wide" href={PAGE.andra.href}>📚 {PAGE.andra.label}</a>
            </div>
          </section>

          <footer className="foot">
            <p>Källa: {PAGE.kalla}</p>
            <p className="by">Designad av John</p>
          </footer>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script src="feedback-widget.js" defer></script>
<script data-goatcounter="https://johnblixt.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
