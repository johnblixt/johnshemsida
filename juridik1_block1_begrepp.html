function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

const lucktextData = [
  { id: 1,  term: 'Konstitutionell rätt',        sentence: 'Läraren förklarade att _____ handlar om hur grundlagarna skyddar medborgarnas fri- och rättigheter och reglerar den offentliga maktens kontroll.', definition: concepts[0].definition },

  { id: 6,  term: 'Rättssystem',                 sentence: 'Det svenska _____ reglerar allt från trafikregler till straffrättsliga påföljder.', definition: concepts[5].definition },
  { id: 7,  term: 'Rättsregler',                 sentence: 'Riksdagen stiftar _____ som är nedskrivna och gäller för alla som bor i Sverige.', definition: concepts[6].definition },
  { id: 8,  term: 'Sanktion',                    sentence: 'Domstolen dömde ut en _____ i form av böter eftersom föraren körde för fort.', definition: concepts[7].definition },
  { id: 9,  term: 'Rättsordning',                sentence: 'Det svenska _____ är en hierarki av grundlagar, lagar, förordningar och föreskrifter.', definition: concepts[8].definition },

  { id: 11, term: 'Grundlagar',                  sentence: 'Sveriges fyra _____ är svårare att ändra än vanliga lagar och bildar grunden för det politiska systemet.', definition: concepts[10].definition },

  { id: 21, term: 'Riksdagens talman',           sentence: '_____ är det högsta valbara ämbetet i Sverige och leder riksdagens dagliga arbete.', definition: concepts[20].definition },

function LucktextView() {
  const normalize = (s) => s.trim().toLowerCase();
  const initStates = () => lucktextData.map(() => ({ value: '', status: 'unanswered', attempts: 0 }));

  const [states, setStates] = React.useState(initStates);
  const [struckTerms, setStruckTerms] = React.useState(new Set());

  const finished = states.every(s => s.status === 'correct' || s.status === 'revealed');
  const correctCount = states.filter(s => s.status === 'correct').length;

  const handleInput = (idx, val) => {
    setStates(prev => {
      const next = [...prev];
      next[idx] = { ...next[idx], value: val };
      return next;
    });
  };

  const check = (idx) => {
    const item = lucktextData[idx];
    const state = states[idx];
    if (state.status === 'correct' || state.status === 'revealed') return;
    setStates(prev => {
      const next = [...prev];
      if (normalize(state.value) === normalize(item.term)) {
        next[idx] = { ...state, status: 'correct' };
        setStruckTerms(s => new Set([...s, item.term]));
      } else if (state.attempts === 0) {
        next[idx] = { ...state, status: 'warning', attempts: 1 };
      } else {
        next[idx] = { ...state, status: 'wrong', attempts: state.attempts + 1 };
      }
      return next;
    });
  };

  const correctAll = () => {
    setStates(prev => prev.map((state, idx) => {
      if (state.status === 'correct') return state;
      return { ...state, status: 'revealed', value: lucktextData[idx].term };
    }));
    setStruckTerms(new Set(lucktextData.map(d => d.term)));
  };

  const restart = () => {
    setStates(initStates());
    setStruckTerms(new Set());
  };

  const borderColor = (status) => {
    if (status === 'correct') return '#16a34a';
    if (status === 'revealed' || status === 'wrong') return '#dc2626';
    if (status === 'warning') return '#f97316';
    return '#e2e8f0';
  };

  return (
    <div>
      {/* Begreppsbank */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-sm">
        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {lucktextData.map(item => (
            <span
              key={item.id}
              className="px-2 py-1 rounded-lg text-sm font-medium transition-all"
              style={
                struckTerms.has(item.term)
                  ? { background: '#f0fdf4', color: '#86efac', textDecoration: 'line-through' }
                  : { background: PRIMARY_LIGHT, color: PRIMARY_TEXT }
              }
            >
              {item.term}
            </span>
          ))}
        </div>
      </div>

      {/* Sentences */}
      <div className="flex flex-col gap-4 mb-6">
        {lucktextData.map((item, idx) => {
          const state = states[idx];
          const parts = item.sentence.split('_____');
          const inputWidth = Math.max(item.term.length * 9, 130);

          return (
            <div
              key={item.id}
              className="bg-white rounded-xl shadow-sm p-4"
              style={{ border: `1.5px solid ${borderColor(state.status)}` }}
            >
              <p className="text-slate-700 text-sm leading-relaxed mb-2 flex flex-wrap items-baseline gap-x-1">
                <span>{parts[0]}</span>
                <input
                  type="text"
                  value={state.value}
                  onChange={e => handleInput(idx, e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && check(idx)}
                  disabled={state.status === 'correct' || state.status === 'revealed'}
                  placeholder="skriv begrepp…"
                  className="border-b-2 bg-transparent outline-none px-1 text-sm font-semibold"
                  style={{
                    width: inputWidth + 'px',
                    borderBottomColor: borderColor(state.status) === '#e2e8f0' ? PRIMARY : borderColor(state.status),
                    color: state.status === 'correct' ? '#16a34a' : state.status === 'revealed' ? '#dc2626' : '#1e293b',
                  }}
                />
                <span>{parts[1]}</span>
              </p>

              {state.status === 'warning' && (
                <p className="text-orange-500 text-xs font-medium mt-1">Är du säker att du stavat rätt?</p>
              )}
              {state.status === 'wrong' && (
                <p className="text-red-500 text-xs font-medium mt-1">Fel svar — prova igen eller tryck "Rätta alla".</p>
              )}
              {(state.status === 'correct' || state.status === 'revealed') && (
                <div
                  className="mt-2 text-xs rounded-lg p-2 leading-relaxed"
                  style={{
                    background: state.status === 'correct' ? '#dcfce7' : '#fee2e2',
                    color: state.status === 'correct' ? '#15803d' : '#dc2626',
                  }}
                >
                  {state.status === 'correct' ? '✓ Rätt! ' : `✗ Rätt svar: ${item.term}. `}
                  {item.definition}
                </div>
              )}

              {state.status !== 'correct' && state.status !== 'revealed' && (
                <button
                  onClick={() => check(idx)}
                  className="mt-2 text-xs font-bold px-3 py-1 rounded-lg text-white"
                  style={{ background: PRIMARY }}
                >
                  Kontrollera
                </button>
              )}
            </div>
          );
        })}
      </div>

      {/* Result */}
      {finished && (
        <div className="rounded-2xl p-6 text-center mb-4 border-2" style={{ background: '#f0fdfa', borderColor: PRIMARY }}>
          <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>
            {correctCount} / {lucktextData.length} rätt
          </p>
          <p className="text-slate-500 text-sm">
            {correctCount === lucktextData.length
              ? '🎉 Perfekt! Du kan alla begrepp!'
              : correctCount >= Math.round(lucktextData.length * 0.8)
              ? '👍 Bra jobbat! Öva lite till på de du missat.'
              : '📚 Fortsätt öva – du är på rätt spår!'}
          </p>
        </div>
      )}

      <div className="flex gap-3 mb-6">
        {!finished && (
          <button onClick={correctAll} className="flex-1 bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-sm hover:bg-slate-300 transition-colors">
            Rätta alla
          </button>
        )}
        <button
          onClick={restart}
          className="flex-1 text-white font-bold py-2 rounded-xl text-sm transition-colors"
          style={{ background: PRIMARY }}
        >
          Börja om
        </button>
      </div>
    </div>
  );
}

function FlashcardView() {
  const total = concepts.length;
  const [deck, setDeck] = React.useState(() => shuffleArray([...concepts]));
  const [deckIdx, setDeckIdx] = React.useState(0);
  const [isFlipped, setIsFlipped] = React.useState(false);
  const [kudeInte, setKudeInte] = React.useState([]);
  const [kunde, setKunde] = React.useState([]);
  const [phase, setPhase] = React.useState('playing');

  const restartAll = () => {
    setDeck(shuffleArray([...concepts]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray([...kudeInte]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>Börja om med alla</button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back bg-white" style={{ border: `2px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

const VIEWS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];

    <div className="flex flex-col gap-3">
      {concepts.map((c) => (
        <div
          key={c.id}
          className="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border-l-8 pl-4 pr-4 py-3"
          style={{ borderLeftColor: PRIMARY }}
        >
          <div className="flex items-start gap-3">
            <span
              className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold mt-0.5"
              style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
            >
              {c.id}
            </span>
            <div>
              <p className="font-bold text-slate-800 text-base leading-snug">{c.term}</p>
              <p className="text-slate-500 text-sm mt-1 leading-relaxed">{c.definition}</p>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [activeView, setActiveView] = React.useState('Lista');

  return (
    <div className="max-w-2xl mx-auto px-4 py-6">
      {/* Header */}
      <div className="flex items-center justify-between mb-6">
        <a
          href="index.html"
          className="text-sm font-medium transition-colors"
          style={{ color: '#64748b' }}
          onMouseEnter={e => e.currentTarget.style.color = PRIMARY}
          onMouseLeave={e => e.currentTarget.style.color = '#64748b'}
        >
          ← Tillbaka till startsidan
        </a>
        <h1 className="text-xl font-bold text-center" style={{ color: PRIMARY_TEXT }}>
          Juridik – Block 1
        </h1>
        <div className="w-32" />
      </div>

      {/* Toggle */}
      <div className="flex gap-1 bg-slate-100 rounded-2xl p-1 mb-6 overflow-x-auto">
        {VIEWS.map((view) => (
          <button
            key={view}
            onClick={() => setActiveView(view)}
            className="flex-1 min-w-0 px-2 py-2 rounded-xl text-sm font-semibold transition-all whitespace-nowrap"
            style={
              activeView === view
                ? { background: PRIMARY, color: '#fff' }
                : { color: '#94a3b8', background: 'transparent' }
            }
          >
            {view}
          </button>
        ))}
      </div>

      {/* Content */}
      {activeView === 'Lista' && <ListView />}
      {activeView === 'Flashcards' && <FlashcardView />}
      {activeView === 'Lucktext' && <LucktextView />}
      {activeView !== 'Lista' && activeView !== 'Flashcards' && activeView !== 'Lucktext' && (
        <div className="text-center text-slate-400 py-20 text-sm">
          Kommer snart…
        </div>
      )}

      {/* Footer */}
      <footer className="mt-10 text-center text-xs text-slate-400 italic">
        Källa: Juridik nivå 1 – begreppslista Block 1
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
