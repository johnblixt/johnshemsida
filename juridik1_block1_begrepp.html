function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function makeOptions(currentItem, allData) {
  const distractors = allData.filter(d => d.id !== currentItem.id);
  shuffleArray(distractors);
  return shuffleArray([currentItem, ...distractors.slice(0, 3)]);
}

const VIEWS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];
const SCORE_VIEWS = ['Lucktext', 'Scenario', 'Icke-ex.'];
const PROGRESS_KEY = 'jur1_block1_progress';
const RANK_SALT = 'jur1block1sakerhet';
const RANK_ORDER = { D: 1, C: 2, B: 3, A: 4, S: 5 };

function loadProgress() {
  try {
    const raw = sessionStorage.getItem(PROGRESS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { completed: {}, best: {} };
}

function saveProgress(progress) {
  try {
    sessionStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (e) {}
}

function computeRank(progress) {
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  if (completedCount === 0) return null;
  if (completedCount === 5) {
    const allPerfect = SCORE_VIEWS.every(v => (progress.best[v] || 0) >= 100);
    return allPerfect ? 'S' : 'A';
  }
  if (completedCount === 4) return 'A';
  if (completedCount === 3) return 'B';
  if (completedCount === 2) return 'C';
  return 'D';
}

function computeVerificationCode(progress, rank) {
  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const completedViews = VIEWS.filter(v => progress.completed[v]).sort().join(',');
  const input = dateStr + '|' + completedViews + '|' + (rank || '-') + '|' + RANK_SALT;
  let hash = 0;
  for (let i = 0; i < input.length; i++) {
    hash = (hash + input.charCodeAt(i) * (i + 1)) % 1679616; // 36^4
  }
  return 'JUR1-' + hash.toString(36).toUpperCase().padStart(4, '0');
}

function LucktextView({ onComplete }) {
  const normalize = (s) => s.trim().toLowerCase();
  const initStates = () => lucktextData.map(() => ({ value: '', status: 'unanswered', attempts: 0 }));

  const [states, setStates] = React.useState(initStates);
  const [struckTerms, setStruckTerms] = React.useState(new Set());

  const finished = states.every(s => s.status === 'correct' || s.status === 'revealed');
  const correctCount = states.filter(s => s.status === 'correct').length;

  React.useEffect(() => {
    if (finished) onComplete((correctCount / lucktextData.length) * 100);
  }, [finished, correctCount, onComplete]);

  const handleInput = (idx, val) => {
    setStates(prev => {
      const next = [...prev];
      next[idx] = { ...next[idx], value: val };
      return next;
    });
  };

  const check = (idx) => {
    const item = lucktextData[idx];
    const state = states[idx];
    if (state.status === 'correct' || state.status === 'revealed') return;
    setStates(prev => {
      const next = [...prev];
      if (normalize(state.value) === normalize(item.term)) {
        next[idx] = { ...state, status: 'correct' };
        setStruckTerms(s => new Set([...s, item.term]));
      } else if (state.attempts === 0) {
        next[idx] = { ...state, status: 'warning', attempts: 1 };
      } else {
        next[idx] = { ...state, status: 'wrong', attempts: state.attempts + 1 };
      }
      return next;
    });
  };

  const correctAll = () => {
    setStates(prev => prev.map((state, idx) => {
      if (state.status === 'correct') return state;
      return { ...state, status: 'revealed', value: lucktextData[idx].term };
    }));
    setStruckTerms(new Set(lucktextData.map(d => d.term)));
  };

  const restart = () => {
    setStates(initStates());
    setStruckTerms(new Set());
  };

  const borderColor = (status) => {
    if (status === 'correct') return '#16a34a';
    if (status === 'revealed' || status === 'wrong') return '#dc2626';
    if (status === 'warning') return '#f97316';
    return '#e2e8f0';
  };

  return (
    <div>
      {/* Begreppsbank */}
      <div className="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-sm">
        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {lucktextData.map(item => (
            <span
              key={item.id}
              className="px-2 py-1 rounded-lg text-sm font-medium transition-all"
              style={
                struckTerms.has(item.term)
                  ? { background: '#f0fdf4', color: '#86efac', textDecoration: 'line-through' }
                  : { background: PRIMARY_LIGHT, color: PRIMARY_TEXT }
              }
            >
              {item.term}
            </span>
          ))}
        </div>
      </div>

      {/* Sentences */}
      <div className="flex flex-col gap-4 mb-6">
        {lucktextData.map((item, idx) => {
          const state = states[idx];
          const parts = item.sentence.split('_____');
          const inputWidth = Math.max(item.term.length * 9, 130);

          return (
            <div
              key={item.id}
              className="bg-white rounded-xl shadow-sm p-4"
              style={{ border: `1.5px solid ${borderColor(state.status)}` }}
            >
              <p className="text-slate-700 text-sm leading-relaxed mb-2 flex flex-wrap items-baseline gap-x-1">
                <span>{parts[0]}</span>
                <input
                  type="text"
                  value={state.value}
                  onChange={e => handleInput(idx, e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && check(idx)}
                  disabled={state.status === 'correct' || state.status === 'revealed'}
                  placeholder="skriv begrepp…"
                  className="border-b-2 bg-transparent outline-none px-1 text-sm font-semibold"
                  style={{
                    width: inputWidth + 'px',
                    borderBottomColor: borderColor(state.status) === '#e2e8f0' ? PRIMARY : borderColor(state.status),
                    color: state.status === 'correct' ? '#16a34a' : state.status === 'revealed' ? '#dc2626' : '#1e293b',
                  }}
                />
                <span>{parts[1]}</span>
              </p>

              {state.status === 'warning' && (
                <p className="text-orange-500 text-xs font-medium mt-1">Är du säker att du stavat rätt?</p>
              )}
              {state.status === 'wrong' && (
                <p className="text-red-500 text-xs font-medium mt-1">Fel svar — prova igen eller tryck "Rätta alla".</p>
              )}
              {(state.status === 'correct' || state.status === 'revealed') && (
                <div
                  className="mt-2 text-xs rounded-lg p-2 leading-relaxed"
                  style={{
                    background: state.status === 'correct' ? '#dcfce7' : '#fee2e2',
                    color: state.status === 'correct' ? '#15803d' : '#dc2626',
                  }}
                >
                  {state.status === 'correct' ? '✓ Rätt! ' : `✗ Rätt svar: ${item.term}. `}
                  {item.definition}
                </div>
              )}

              {state.status !== 'correct' && state.status !== 'revealed' && (
                <button
                  onClick={() => check(idx)}
                  className="mt-2 text-xs font-bold px-3 py-1 rounded-lg text-white"
                  style={{ background: PRIMARY }}
                >
                  Kontrollera
                </button>
              )}
            </div>
          );
        })}
      </div>

      {/* Result */}
      {finished && (
        <div className="rounded-2xl p-6 text-center mb-4 border-2" style={{ background: '#f0fdfa', borderColor: PRIMARY }}>
          <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>
            {correctCount} / {lucktextData.length} rätt
          </p>
          <p className="text-slate-500 text-sm">
            {correctCount === lucktextData.length
              ? '🎉 Perfekt! Du kan alla begrepp!'
              : correctCount >= Math.round(lucktextData.length * 0.8)
              ? '👍 Bra jobbat! Öva lite till på de du missat.'

}

function FlashcardView({ onComplete }) {
  const total = concepts.length;
  const [deck, setDeck] = React.useState(() => shuffleArray([...concepts]));
  const [deckIdx, setDeckIdx] = React.useState(0);
  const [isFlipped, setIsFlipped] = React.useState(false);
  const [kudeInte, setKudeInte] = React.useState([]);
  const [kunde, setKunde] = React.useState([]);
  const [phase, setPhase] = React.useState('playing');

  const restartAll = () => {
    setDeck(shuffleArray([...concepts]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
      onComplete();
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray([...kudeInte]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>Börja om med alla</button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back bg-white" style={{ border: `2px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function ScenarioView({ onComplete }) {
  const total = scenarioData.length;
  const [items, setItems] = React.useState(() => shuffleArray([...scenarioData]));
  const [idx, setIdx] = React.useState(0);
  const [options, setOptions] = React.useState(() => makeOptions(items[0], scenarioData));
  const [selected, setSelected] = React.useState(null);
  const [score, setScore] = React.useState(0);
  const [phase, setPhase] = React.useState('playing');

  React.useEffect(() => {
    if (phase === 'done') onComplete((score / total) * 100);
  }, [phase]);

  const current = items[idx];
  const isAnswered = selected !== null;

  const handleSelect = (opt) => {
    if (isAnswered) return;
    setSelected(opt);
    if (opt.id === current.id) setScore(s => s + 1);
  };

  const handleNext = () => {
    const nextIdx = idx + 1;
    if (nextIdx >= total) {
      setPhase('done');
    } else {
      setOptions(makeOptions(items[nextIdx], scenarioData));
      setIdx(nextIdx);
      setSelected(null);
    }
  };

  const restart = () => {
    const newItems = shuffleArray([...scenarioData]);
    setItems(newItems);
    setIdx(0);
    setOptions(makeOptions(newItems[0], scenarioData));
    setSelected(null);
    setScore(0);
    setPhase('playing');
  };

  if (phase === 'done') return (
    <div className="flex flex-col items-center gap-6">
      <div className="rounded-3xl p-8 text-center w-full" style={{ background: PRIMARY_LIGHT, border: `2px solid ${PRIMARY}` }}>
        <div className="text-5xl mb-4">🎯</div>
        <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
        <p className="text-slate-500 text-sm mb-6">
          {score === total
            ? 'Perfekt! Du kopplar ihop alla situationer rätt.'
            : score >= Math.round(total * 0.8)
            ? 'Bra jobbat! Öva lite till på de du missat.'
            : 'Fortsätt öva – du lär dig!'}
        </p>
        <button onClick={restart} className="text-white font-bold px-8 py-3 rounded-2xl" style={{ background: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <span className="text-xs text-slate-400 font-medium">{idx + 1} av {total}</span>
        <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}>
          {score} rätt
        </span>
      </div>
      <div className="w-full bg-slate-200 rounded-full h-1.5 mb-1">
        <div className="h-1.5 rounded-full transition-all" style={{ width: `${(idx / total) * 100}%`, background: PRIMARY }} />
      </div>

      <div className="bg-white rounded-2xl shadow-sm p-5 border-l-4" style={{ borderLeftColor: PRIMARY }}>
        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Vilket begrepp beskrivs?</p>
        <p className="text-slate-800 text-base leading-relaxed">{current.scenario}</p>
      </div>

      <div className="flex flex-col gap-3">
        {options.map(opt => {
          const isCorrect = opt.id === current.id;
          const isSelected = selected && selected.id === opt.id;
          let bg = '#ffffff', border = '#e2e8f0', textColor = '#1e293b';
          if (isAnswered) {
            if (isCorrect) { bg = '#dcfce7'; border = '#16a34a'; textColor = '#15803d'; }
            else if (isSelected) { bg = '#fee2e2'; border = '#dc2626'; textColor = '#dc2626'; }
          }
          return (
            <button
              key={opt.id}
              onClick={() => handleSelect(opt)}
              disabled={isAnswered}
              className="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm transition-all border-2"
              style={{ background: bg, borderColor: border, color: textColor }}
            >
              {opt.term}
            </button>
          );
        })}
      </div>

      {isAnswered && (
        <div
          className="rounded-xl p-4 text-sm leading-relaxed"
          style={
            selected.id === current.id
              ? { background: '#dcfce7', color: '#15803d' }
              : { background: '#fee2e2', color: '#dc2626' }
          }
        >
          {selected.id === current.id ? '✓ Rätt! ' : `✗ Rätt svar: ${current.term}. `}
          {concepts.find(c => c.id === current.id).definition}
        </div>
      )}

      {isAnswered && (
        <button
          onClick={handleNext}
          className="w-full text-white font-bold py-3 rounded-2xl text-sm"
          style={{ background: PRIMARY }}
        >
          {idx + 1 < total ? 'Nästa scenario →' : 'Visa resultat'}
        </button>
      )}
    </div>
  );
}

    explanation: 'Successionsrätten innebär arvsrätt till tronen — monarken utses inte via riksdagsröstning utan positionen ärvs.' },
];

function IckeExView({ onComplete }) {
  const total = ickeExData.length;

  const makeQuestion = (item) => {
    const correctFirst = Math.random() < 0.5;
    return {
      item,
      optionA: correctFirst ? item.correct : item.trap,
      optionB: correctFirst ? item.trap : item.correct,
      correctIsA: correctFirst,
    };
  };

  const [questions, setQuestions] = React.useState(() =>
    shuffleArray([...ickeExData]).map(makeQuestion)
  );
  const [idx, setIdx] = React.useState(0);
  const [chosen, setChosen] = React.useState(null); // 'A' | 'B' | null
  const [score, setScore] = React.useState(0);
  const [phase, setPhase] = React.useState('playing'); // 'playing' | 'done'

  const current = questions[idx];
  const isAnswered = chosen !== null;

  React.useEffect(() => {
    if (phase === 'done') onComplete((score / total) * 100);
  }, [phase]);

  const choose = (option) => {
    if (isAnswered) return;
    setChosen(option);
    const isCorrect = (option === 'A') === current.correctIsA;
    if (isCorrect) setScore(s => s + 1);
  };

  const next = () => {
    if (idx + 1 >= total) {
      setPhase('done');
    } else {
      setIdx(idx + 1);
      setChosen(null);
    }
  };

  const restart = () => {
    setQuestions(shuffleArray([...ickeExData]).map(makeQuestion));
    setIdx(0);
    setChosen(null);
    setScore(0);
    setPhase('playing');
  };

  if (phase === 'done') return (
    <div className="flex flex-col items-center gap-6">
      <div className="rounded-3xl p-8 text-center w-full" style={{ background: PRIMARY_LIGHT, border: `2px solid ${PRIMARY}` }}>
        <div className="text-5xl mb-4">🎯</div>
        <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
        <p className="text-slate-500 text-sm mb-6">
          {score === total
            ? 'Perfekt! Du kan skilja rätt tillämpning från fällan!'
            : score >= Math.round(total * 0.8)
            ? 'Bra jobbat! Öva lite till på de du missat.'
            : 'Fortsätt öva — du är på rätt spår!'}
        </p>
        <button onClick={restart} className="text-white font-bold px-8 py-3 rounded-2xl" style={{ background: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  const chosenCorrect = chosen !== null && (chosen === 'A') === current.correctIsA;
  const aCorrect = current.correctIsA;
  const bCorrect = !current.correctIsA;

  const optionStyle = (option) => {
    if (!isAnswered) return { background: '#ffffff', borderColor: '#e2e8f0', color: '#1e293b' };
    const thisCorrect = (option === 'A') ? aCorrect : bCorrect;
    const thisChosen = chosen === option;
    if (thisCorrect) return { background: '#dcfce7', borderColor: '#16a34a', color: '#15803d' };
    if (thisChosen) return { background: '#fee2e2', borderColor: '#dc2626', color: '#dc2626' };
    return { background: '#f8fafc', borderColor: '#e2e8f0', color: '#94a3b8' };
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <span className="text-xs text-slate-400 font-medium">{idx + 1} av {total}</span>
        <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}>
          {score} rätt
        </span>
      </div>
      <div className="w-full bg-slate-200 rounded-full h-1.5 mb-1">
        <div className="h-1.5 rounded-full transition-all" style={{ width: `${(idx / total) * 100}%`, background: PRIMARY }} />
      </div>

      <div className="bg-white rounded-2xl shadow-sm p-5 border-l-4" style={{ borderLeftColor: PRIMARY }}>
        <p className="text-xs font-bold uppercase tracking-wide mb-1" style={{ color: PRIMARY }}>Begrepp</p>
        <p className="text-xl font-bold text-slate-800">{current.item.term}</p>
        <p className="text-slate-500 text-xs mt-1">Vilket alternativ beskriver en korrekt tillämpning?</p>
      </div>

      <div className="flex flex-col gap-3">
        {['A', 'B'].map(option => {
          const text = option === 'A' ? current.optionA : current.optionB;
          const s = optionStyle(option);
          return (
            <button
              key={option}
              onClick={() => choose(option)}
              disabled={isAnswered}
              className="w-full text-left px-4 py-4 rounded-xl text-sm border-2 transition-all leading-relaxed"
              style={{ background: s.background, borderColor: s.borderColor, color: s.color, fontWeight: isAnswered && (option === 'A' ? aCorrect : bCorrect) ? 700 : 500 }}
            >
              <span className="font-bold mr-2">{option}.</span>{text}
            </button>
          );
        })}
      </div>

      {isAnswered && (
        <>
          <div
            className="rounded-xl p-4 text-sm leading-relaxed"
            style={chosenCorrect
              ? { background: '#dcfce7', color: '#15803d' }
              : { background: '#fee2e2', color: '#dc2626' }}
          >
            {chosenCorrect ? '✓ Rätt! ' : '✗ Fel! '}
            {current.item.explanation}
          </div>
          <button
            onClick={next}
            className="w-full text-white font-bold py-3 rounded-2xl text-sm"
            style={{ background: PRIMARY }}
          >
            {idx + 1 < total ? 'Nästa begrepp →' : 'Visa resultat'}
          </button>
        </>
      )}
    </div>
  );
}

function ListView({ onComplete }) {
  const sentinelRef = React.useRef(null);

  React.useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) onComplete();
    }, { threshold: 1.0 });
    observer.observe(el);
    return () => observer.disconnect();
  }, [onComplete]);

  return (
    <div className="flex flex-col gap-3">
      {concepts.map((c) => (
        <div
          key={c.id}
          className="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border-l-8 pl-4 pr-4 py-3"
          style={{ borderLeftColor: PRIMARY }}
        >
          <div className="flex items-start gap-3">
            <span
              className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold mt-0.5"
              style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
            >
              {c.id}
            </span>
            <div>
              <p className="font-bold text-slate-800 text-base leading-snug">{c.term}</p>
              <p className="text-slate-500 text-sm mt-1 leading-relaxed">{c.definition}</p>
            </div>
          </div>
        </div>
      ))}
      <div ref={sentinelRef} style={{ height: 1 }} />
    </div>
  );
}

function App() {
  const [activeView, setActiveView] = React.useState('Lista');
  const [progress, setProgress] = React.useState(loadProgress);
  const [celebrateRank, setCelebrateRank] = React.useState(null);
  const prevRankRef = React.useRef(computeRank(loadProgress()));

  React.useEffect(() => {
    saveProgress(progress);
  }, [progress]);

  const markComplete = React.useCallback((view, pct) => {
    setProgress(prev => {
      const nextCompleted = { ...prev.completed };
      const nextBest = { ...prev.best };
      let changed = false;

      if (typeof pct === 'number' && !(nextBest[view] >= pct)) {
        nextBest[view] = pct;
        changed = true;
      }

      const thresholdMet = typeof pct === 'number' ? pct >= 80 : true;
      if (thresholdMet && !nextCompleted[view]) {
        nextCompleted[view] = true;
        changed = true;
      }

      return changed ? { completed: nextCompleted, best: nextBest } : prev;
    });
  }, []);

  const completeLista = React.useCallback(() => markComplete('Lista'), [markComplete]);
  const completeFlashcards = React.useCallback(() => markComplete('Flashcards'), [markComplete]);
  const completeLucktext = React.useCallback((pct) => markComplete('Lucktext', pct), [markComplete]);
  const completeScenario = React.useCallback((pct) => markComplete('Scenario', pct), [markComplete]);
  const completeIckeEx = React.useCallback((pct) => markComplete('Icke-ex.', pct), [markComplete]);

  const rank = computeRank(progress);
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  const code = computeVerificationCode(progress, rank);

  React.useEffect(() => {
    const prevOrder = prevRankRef.current ? RANK_ORDER[prevRankRef.current] : 0;
    const newOrder = rank ? RANK_ORDER[rank] : 0;
    if (newOrder > prevOrder) {
      setCelebrateRank(rank);
      const t = setTimeout(() => setCelebrateRank(null), 2500);
      prevRankRef.current = rank;
      return () => clearTimeout(t);
    }
    prevRankRef.current = rank;
  }, [rank]);

  return (
    <div className="max-w-2xl mx-auto px-4 py-6">
      {/* Header */}
      <div className="flex items-center justify-between mb-6">
        <a
          href="index.html"
          className="text-sm font-medium transition-colors"
          style={{ color: '#64748b' }}
          onMouseEnter={e => e.currentTarget.style.color = PRIMARY}
          onMouseLeave={e => e.currentTarget.style.color = '#64748b'}
        >
          ← Tillbaka till startsidan
        </a>
        <h1 className="text-xl font-bold text-center" style={{ color: PRIMARY_TEXT }}>
          Juridik – Block 1
        </h1>
        <div className="w-32" />
      </div>

      {/* Progress + rank */}
      <div className="mb-4">
        <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
          <span className="text-sm font-semibold text-slate-600">{completedCount}/5 avsnitt klara</span>
          {rank && (
            <span
              className="text-xs font-bold px-2.5 py-1 rounded-full"
              style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
            >
              Rank: {rank} · Kod: {code}
            </span>
          )}
        </div>
        <div className="w-full bg-slate-200 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all" style={{ width: `${(completedCount / 5) * 100}%`, background: PRIMARY }} />
        </div>
        {completedCount === 5 && rank !== 'S' && (
          <p className="text-xs text-slate-400 mt-1.5 italic">100% på alla poängvyer krävs för S-rank</p>
        )}
      </div>

      {/* Toggle */}
      <div className="flex gap-1 bg-slate-100 rounded-2xl p-1 mb-6 overflow-x-auto">
        {VIEWS.map((view) => (
          <button
            key={view}
            onClick={() => setActiveView(view)}
            className="flex-1 min-w-0 px-2 py-2 rounded-xl text-sm font-semibold transition-all whitespace-nowrap"
            style={
              activeView === view
                ? { background: PRIMARY, color: '#fff' }
                : { color: '#94a3b8', background: 'transparent' }
            }
          >
            {view}
            {progress.completed[view] && (
              <span className="ml-1" style={{ color: activeView === view ? '#fff' : '#16a34a' }}>✓</span>
            )}
          </button>
        ))}
      </div>

      {/* Content */}
      {activeView === 'Lista' && <ListView onComplete={completeLista} />}
      {activeView === 'Flashcards' && <FlashcardView onComplete={completeFlashcards} />}
      {activeView === 'Lucktext' && <LucktextView onComplete={completeLucktext} />}
      {activeView === 'Scenario' && <ScenarioView onComplete={completeScenario} />}
      {activeView === 'Icke-ex.' && <IckeExView onComplete={completeIckeEx} />}

      {/* Footer */}
      <footer className="mt-10 text-center text-xs text-slate-400 italic">
        Källa: Juridik nivå 1 – begreppslista Block 1
      </footer>

      {/* Rank celebration overlay */}
      {celebrateRank && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 px-4"
          style={{ background: 'rgba(15, 23, 42, 0.55)' }}
          onClick={() => setCelebrateRank(null)}
        >
          <div className="bg-white rounded-3xl px-10 py-8 text-center shadow-2xl">
            <div className="text-5xl mb-3">{celebrateRank === 'S' ? '🎉🏆🎉' : '🎉'}</div>
            <p className="text-3xl font-bold" style={{ color: PRIMARY_TEXT }}>{celebrateRank}-RANK!</p>
            <p className="text-slate-400 text-sm mt-2">Ny rank uppnådd</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
