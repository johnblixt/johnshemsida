<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samhällskunskap – Repetitionsquiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f13;
            --surface: #17171e;
            --surface2: #1e1e28;
            --border: #2a2a38;
            --accent: #e8c547;
            --accent2: #c4a030;
            --text: #e8e8f0;
            --muted: #7878a0;
            --correct: #3ecf8e;
            --wrong: #e55;
            --correct-bg: #0d2e1f;
            --wrong-bg: #2e0d0d;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .screen {
            width: 100%;
            max-width: 640px;
            animation: rise 0.4s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---- START SCREEN ---- */
        .start-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: var(--accent);
            color: #000;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            padding: .35rem .9rem;
            border-radius: 100px;
            margin-bottom: 1.5rem;
        }

        .start-card h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .start-card h1 em {
            font-style: italic;
            color: var(--accent);
        }

        .start-card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: .95rem;
            margin-bottom: 2.5rem;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .pill-row {
            display: flex;
            gap: .6rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .pill {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: .4rem 1rem;
            font-size: .8rem;
            color: var(--muted);
        }

        .btn-start {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            background: var(--accent);
            color: #000;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            padding: .9rem 2.2rem;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            transition: background .15s, transform .1s;
            width: 100%;
            justify-content: center;
        }

        .btn-start:hover { background: #f0d060; }
        .btn-start:active { transform: scale(.98); }

        /* ---- QUIZ SCREEN ---- */
        .quiz-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .q-counter {
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .q-counter span { color: var(--accent); }

        .timer {
            font-family: 'Fraunces', serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: .05em;
        }

        .progress-track {
            height: 3px;
            background: var(--border);
            border-radius: 99px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 99px;
            transition: width .5s cubic-bezier(.22,1,.36,1);
        }

        .question-text {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.15rem, 3.5vw, 1.45rem);
            font-weight: 700;
            line-height: 1.45;
            margin-bottom: 1.8rem;
            color: var(--text);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: .7rem;
            margin-bottom: 1.8rem;
        }

        .opt-btn {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: .93rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .9rem;
            transition: border-color .15s, background .15s;
            line-height: 1.4;
        }

        .opt-btn:not([disabled]):hover {
            border-color: var(--accent);
            background: var(--surface2);
        }

        .opt-btn .letter {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .75rem;
            font-weight: 700;
            color: var(--muted);
            transition: background .15s, border-color .15s, color .15s;
        }

        .opt-btn.correct {
            border-color: var(--correct);
            background: var(--correct-bg);
            color: var(--correct);
        }

        .opt-btn.correct .letter {
            background: var(--correct);
            border-color: var(--correct);
            color: #000;
        }

        .opt-btn.wrong {
            border-color: var(--wrong);
            background: var(--wrong-bg);
            color: var(--wrong);
        }

        .opt-btn.wrong .letter {
            background: var(--wrong);
            border-color: var(--wrong);
            color: #fff;
        }

        .opt-btn.dim { opacity: .3; }

        .quiz-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border);
        }

        .hint-toggle {
            background: none;
            border: none;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: .85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .4rem;
            padding: 0;
            transition: color .15s;
        }

        .hint-toggle:hover { color: var(--accent); }

        .btn-next {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 100px;
            padding: .65rem 1.6rem;
            font-family: 'DM Sans', sans-serif;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .5rem;
            transition: background .15s;
        }

        .btn-next:hover { background: #f0d060; }

        .hint-box {
            margin-top: 1rem;
            background: #1e1a08;
            border: 1px solid #3a3010;
            border-radius: 12px;
            padding: .9rem 1.1rem;
            font-size: .85rem;
            color: #c8a84a;
            line-height: 1.6;
            animation: rise .25s ease both;
        }

        .hint-box strong {
            display: block;
            font-size: .7rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #7a6020;
            margin-bottom: .35rem;
        }

        /* ---- END SCREEN ---- */
        .end-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
        }

        .score-big {
            font-family: 'Fraunces', serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            color: var(--accent);
            margin-bottom: .3rem;
        }

        .score-label {
            font-size: .8rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1.5rem;
        }

        .end-card h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: .6rem;
        }

        .end-card p {
            color: var(--muted);
            font-size: .95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem;
        }

        .stat-box .label {
            font-size: .7rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            display: block;
            margin-bottom: .4rem;
        }

        .stat-box .value {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text);
        }

        .btn-restart {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            background: var(--surface2);
            border: 1.5px solid var(--border);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            padding: .9rem 2rem;
            border-radius: 100px;
            cursor: pointer;
            width: 100%;
            justify-content: center;
            transition: border-color .15s, background .15s;
        }

        .btn-restart:hover {
            border-color: var(--accent);
            background: #1a1a10;
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
const QUESTIONS = [
    {
        q: "Grundlagarna finns till för att...",
        opts: [
            "...lista straff för alla sorters brott som finns i Sverige.",
            "...skydda demokratin och stå över alla övriga lagar.",
            "...tala om för kommunerna hur de ska sköta sin ekonomi.",
            "...förklara hur sjukhus och skolor ska organiseras."
        ],
        correct: 1,
        hint: "Grundlagarna sätter spelreglerna för demokratin – de gäller framför alla andra lagar."
    },
    {
        q: "Att ändra en grundlag kräver mer än att ändra en vanlig lag. Varför?",
        opts: [
            "Kungen och statsministern måste båda skriva under.",
            "EU behöver godkänna ändringen i förväg.",
            "Ingen tillfällig majoritet ska kunna rucka på demokratins grunder.",
            "Alla röstberättigade måste delta i en folkomröstning."
        ],
        correct: 2,
        hint: "Det är en inbyggd bromsmekanism mot att demokratin avskaffas bakvägen."
    },
    {
        q: "Vad innehåller Regeringsformen?",
        opts: [
            "Regler för hur mycket skatt vi ska betala.",
            "Direktiv om hur polisen får använda våld.",
            "Bestämmelsen att all offentlig makt kommer från folket.",
            "En lista på vilka partier som får ställa upp i val."
        ],
        correct: 2,
        hint: "Regeringsformen slår fast folksuveräniteten – makten utgår från medborgarna."
    },
    {
        q: "Tryckfrihetsförordningen och Yttrandefrihetsgrundlagen handlar båda om...",
        opts: [
            "...rätten att uttrycka sig fritt utan att staten censurerar i förväg.",
            "...krav på att journalister ska ha formell utbildning.",
            "...skyldigheten att skriva positivt om den sittande regeringen.",
            "...förbud mot att ifrågasätta redan fattade politiska beslut."
        ],
        correct: 0,
        hint: "Ingen myndighet får granska och stoppa ett innehåll innan det publiceras."
    },
    {
        q: "Successionsordningen reglerar...",
        opts: [
            "...hur statsministern utses efter ett val.",
            "...vem som tar över tronen och blir statschef.",
            "...hur man löser konflikter mellan olika vanliga lagar.",
            "...fördelningen av makt mellan stat och kommuner."
        ],
        correct: 1,
        hint: "Succession = tronföljd. Lagen bestämmer vem som ärver kungakronan."
    },
    {
        q: "Vilken av de fyra grundlagarna anses vara den mest centrala?",
        opts: [
            "Yttrandefrihetsgrundlagen – utan yttrandefrihet finns ingen demokrati.",
            "Regeringsformen – den lägger hela grunden för statsskicket.",
            "Successionsordningen – kungen är formellt sett landets chef.",
            "Tryckfrihetsförordningen – mediernas makt är avgörande idag."
        ],
        correct: 1,
        hint: "Regeringsformen är grunden i grunden – den styr hur Sverige styrs."
    },
    {
        q: "En ny vanlig lag visar sig strida mot en grundlag. Vad gäller?",
        opts: [
            "Den vanliga lagen gäller om tillräckligt många stödjer den.",
            "En domstol kastar tärning om vilken lag som ska användas.",
            "Frågan skickas till EU för avgörande.",
            "Den vanliga lagen gäller inte – grundlagen går alltid före."
        ],
        correct: 3,
        hint: "Grundlagar är överordnade. En lag som strider mot dem kan inte tillämpas."
    },
    {
        q: "En riksdagsledamot lämnar in ett eget lagförslag. Vad kallas det?",
        opts: [
            "Motion – ett sätt för enskilda ledamöter att driva frågor.",
            "Betänkande – en rapport från ett expertorgan i riksdagen.",
            "Proposition – ett förslag som alltid ska godkännas av regeringen.",
            "Remiss – ett dokument som skickas till polisen för synpunkter."
        ],
        correct: 0,
        hint: "Motioner är riksdagsledamöternas egna initiativ – inte regeringens."
    },
    {
        q: "Vad är en proposition?",
        opts: [
            "Ett förslag som folket röstar om direkt i en folkomröstning.",
            "En namninsamling mot ett lagförslag.",
            "Ett lagförslag som regeringen lämnar till riksdagen för beslut.",
            "Ett EU-krav som riksdagen måste hantera skyndsamt."
        ],
        correct: 2,
        hint: "Propositioner kommer från regeringen – det är deras sätt att föreslå ny lagstiftning."
    },
    {
        q: "Varför görs en statlig utredning innan en ny lag tas fram?",
        opts: [
            "För att räkna ut exakt vad lagen kommer kosta för företagen.",
            "För att fackmän och experter ska granska frågan ordentligt.",
            "För att domstolarna ska kunna bedöma förslaget i förväg.",
            "För att politikerna ska kunna förhandla utan insyn utifrån."
        ],
        correct: 1,
        hint: "Utredningen ser till att beslutet vilar på fakta, inte på magkänsla."
    },
    {
        q: "Varför skickar regeringen ett lagförslag på remiss?",
        opts: [
            "Så att kungen hinner läsa och föreslå ändringar.",
            "Så att medborgarna kan rösta om det digitalt.",
            "Så att det hinner översättas till engelska.",
            "Så att myndigheter och organisationer kan lämna synpunkter."
        ],
        correct: 3,
        hint: "Remissen är demokratins sätt att samla in kunniga röster innan beslut tas."
    },
    {
        q: "Vad gör riksdagens utskott med ett lagförslag?",
        opts: [
            "De fördjupar sig i förslaget och bereder riksdagens beslut.",
            "De ser till att lagen träder i kraft så fort som möjligt.",
            "De lägger ner förslaget direkt om de anser att regeringen gjort fel.",
            "De skriver om hela lagen utifrån sina egna politiska åsikter."
        ],
        correct: 0,
        hint: "Utskotten är riksdagens arbetsgrupper – de gör förarbetet innan hela kammaren röstar."
    },
    {
        q: "Vad är det absolut sista steget innan ett förslag blir lag?",
        opts: [
            "Statsministern fattar det slutliga beslutet på egen hand.",
            "Högsta domstolen godkänner eller avslår förslaget.",
            "Riksdagens 349 ledamöter röstar ja eller nej i kammaren.",
            "Folket röstar om förslaget i nästa riksdagsval."
        ],
        correct: 2,
        hint: "Omröstningen i riksdagens kammare är det sista och avgörande steget."
    },
    {
        q: "Riksdagen har röstat ja till en ny lag. Vad händer sedan?",
        opts: [
            "Ingenting i tre år – man inväntar statistik om huruvida det behövdes.",
            "Regeringen och myndigheterna ser till att lagen faktiskt börjar gälla.",
            "EU måste lämna ett slutgodkännande innan lagen kan tillämpas.",
            "Oppositionen får lämna in ett nytt förslag om de inte är nöjda."
        ],
        correct: 1,
        hint: "Att verkställa riksdagens beslut är regeringens och myndigheternas jobb."
    },
    {
        q: "Riksdagens allra viktigaste uppgift är att...",
        opts: [
            "...ingå avtal med andra länder och ha hand om försvaret.",
            "...gripa brottslingar och se till att de döms.",
            "...bestämma hur kommunernas skolor och sjukhus ska skötas.",
            "...stifta lagar och besluta hur statens pengar ska användas."
        ],
        correct: 3,
        hint: "Riksdagen har den lagstiftande makten och budgetmakten."
    },
    {
        q: "Vad är EU?",
        opts: [
            "En gemensam armé för Europas länder.",
            "Ett enat land styrt från Bryssel.",
            "Ett djupgående samarbete mellan självständiga europeiska länder.",
            "En biståndsorganisation för ekonomiskt svaga länder."
        ],
        correct: 2,
        hint: "Länderna behåller sin självständighet men samarbetar nära inom EU."
    },
    {
        q: "Vad innebär den fria rörligheten för EU-medborgare?",
        opts: [
            "Att kollektivtrafiken är gratis med EU-pass.",
            "Att man utan hinder kan resa, bo och arbeta i andra EU-länder.",
            "Att arbetsgivare kan tvinga personal att flytta utomlands.",
            "Att EU kan beordra dig att bosätta dig i ett annat land."
        ],
        correct: 1,
        hint: "Gränserna ska inte hindra dig från att söka jobb eller studera i ett annat EU-land."
    },
    {
        q: "Vad har EU:s inre marknad betytt för handeln i Europa?",
        opts: [
            "Det har blivit enklare och billigare – tullavgifterna mellan länderna är borta.",
            "Det har blivit svårare för små företag eftersom bara stora bolag tillåts sälja.",
            "Det har blivit dyrare för att företagen betalar extra skatt direkt till EU.",
            "Ingenting har förändrats – varje land behåller sina egna handelsregler."
        ],
        correct: 0,
        hint: "Inga tullar = lägre priser och enklare handel inom EU."
    },
    {
        q: "Vad brukar kritiker mena med att EU lider av ett 'demokratiskt underskott'?",
        opts: [
            "Att EU hindrar svenska partier från att delta i EU-parlamentsvalet.",
            "Att länderna inte tillåts ha synpunkter på EU:s ledarskap.",
            "Att EU saknar budget för att genomföra demokratiska val.",
            "Att beslut fattas långt bort i Bryssel och känns svåra att påverka som vanlig medborgare."
        ],
        correct: 3,
        hint: "Avståndet till makten gör att många medborgare känner att EU är svårt att påverka."
    },
    {
        q: "En EU-förordning strider mot en svensk lag. Vad gäller då?",
        opts: [
            "Varje land väljer fritt vilken regel de vill följa det aktuella året.",
            "Den svenska lagen gäller alltid, oavsett vad EU säger.",
            "EU-rätten har företräde, för att samarbetet ska fungera lika i alla länder.",
            "Det händer ingenting – EU ger bara råd, de stiftar inga egna lagar."
        ],
        correct: 2,
        hint: "EU-rättens företräde säkerställer att spelreglerna är desamma i hela unionen."
    }
];

let state = {
    phase: 'start', // start | quiz | end
    questions: [],
    idx: 0,
    score: 0,
    selected: null,
    locked: false,
    showHint: false,
    timer: 0,
    timerInterval: null
};

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function startGame() {
    clearInterval(state.timerInterval);
    state.questions = shuffle(QUESTIONS).map(q => ({
        ...q,
        shuffledOpts: shuffle(q.opts.map((text, i) => ({ text, origIdx: i })))
    }));
    state.idx = 0;
    state.score = 0;
    state.selected = null;
    state.locked = false;
    state.showHint = false;
    state.timer = 0;
    state.phase = 'quiz';
    state.timerInterval = setInterval(() => { state.timer++; renderTimer(); }, 1000);
    render();
}

function fmt(t) {
    return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
}

function renderTimer() {
    const el = document.getElementById('timer-display');
    if (el) el.textContent = fmt(state.timer);
}

function selectOpt(shuffledIdx) {
    if (state.locked) return;
    state.selected = shuffledIdx;
    state.locked = true;
    const q = state.questions[state.idx];
    if (q.shuffledOpts[shuffledIdx].origIdx === q.correct) state.score++;
    renderQuiz();
}

function nextQ() {
    state.idx++;
    state.selected = null;
    state.locked = false;
    state.showHint = false;
    if (state.idx >= state.questions.length) {
        clearInterval(state.timerInterval);
        state.phase = 'end';
        render();
    } else {
        renderQuiz();
    }
}

function toggleHint() {
    state.showHint = !state.showHint;
    renderQuiz();
}

const LETTERS = ['A','B','C','D'];

function render() {
    if (state.phase === 'start') renderStart();
    else if (state.phase === 'quiz') renderQuiz();
    else renderEnd();
}

function renderStart() {
    document.getElementById('app').innerHTML = `
        <div class="screen">
            <div class="start-card">
                <span class="badge">Samhällskunskap</span>
                <button class="btn-start" onclick="startGame()">
                    Kör igång
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>`;
}

function renderQuiz() {
    const q = state.questions[state.idx];
    const pct = ((state.idx + 1) / state.questions.length) * 100;

    const optsHTML = q.shuffledOpts.map((opt, i) => {
        const isCorrectOrig = opt.origIdx === q.correct;
        const isSelected = state.selected === i;
        let cls = 'opt-btn';
        if (state.locked) {
            if (isCorrectOrig) cls += ' correct';
            else if (isSelected) cls += ' wrong';
            else cls += ' dim';
        }
        return `<button class="${cls}" onclick="selectOpt(${i})" ${state.locked ? 'disabled' : ''}>
            <span class="letter">${LETTERS[i]}</span>
            ${opt.text}
        </button>`;
    }).join('');

    const hintHTML = state.showHint ? `
        <div class="hint-box">
            <strong>Tips</strong>
            ${q.hint}
        </div>` : '';

    document.getElementById('app').innerHTML = `
        <div class="screen">
            <div class="quiz-header">
                <span class="q-counter">Fråga <span>${state.idx + 1}</span> / ${state.questions.length}</span>
                <span class="timer" id="timer-display">${fmt(state.timer)}</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" style="width:${pct}%"></div>
            </div>
            <p class="question-text">${q.q}</p>
            <div class="options">${optsHTML}</div>
            <div class="quiz-footer">
                <button class="hint-toggle" onclick="toggleHint()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                    ${state.showHint ? 'Dölj tips' : 'Visa tips'}
                </button>
                ${state.locked ? `<button class="btn-next" onclick="nextQ()">
                    ${state.idx + 1 === state.questions.length ? 'Se resultat' : 'Nästa'}
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>` : ''}
            </div>
            ${hintHTML}
        </div>`;
}

function renderEnd() {
    const pct = Math.round((state.score / state.questions.length) * 100);
    const msg = pct >= 90 ? "Imponerande! Du är redo för provet." :
                pct >= 70 ? "Bra jobbat! Läs igenom det du missade en gång till." :
                "Fortsätt öva – varje runda gör dig skarpare.";

    document.getElementById('app').innerHTML = `
        <div class="screen">
            <div class="end-card">
                <div class="score-big">${state.score}<span style="font-size:2.5rem;color:var(--muted)">/${state.questions.length}</span></div>
                <div class="score-label">rätta svar</div>
                <h2>${pct >= 90 ? 'Strålande!' : pct >= 70 ? 'Bra kämpat!' : 'Fortsätt träna!'}</h2>
                <p>${msg}</p>
                <div class="stats-row">
                    <div class="stat-box">
                        <span class="label">Resultat</span>
                        <span class="value">${pct}%</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Tid</span>
                        <span class="value">${fmt(state.timer)}</span>
                    </div>
                </div>
                <button class="btn-restart" onclick="startGame()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-4.95"/></svg>
                    Kör igen med ny ordning
                </button>
            </div>
        </div>`;
}

render();
</script>
</body>
</html>
