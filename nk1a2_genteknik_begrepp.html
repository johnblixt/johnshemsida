// PROGRESS- OCH RANK-SYSTEM (sessionStorage, ingen backend)
// Interna nycklar 'Scenario'/'Icke-ex.' behålls — eleven ser VIEW_LABELS.
// ════════════════════════════════════════════════════════════
const VIEWS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];
const VIEW_LABELS = { 'Scenario': 'Test 1', 'Icke-ex.': 'Test 2' };
const ACTIVE_VIEWS = { 'Lista': true, 'Flashcards': true, 'Lucktext': true, 'Scenario': true, 'Icke-ex.': true };
const SCORE_VIEWS = ['Lucktext', 'Scenario', 'Icke-ex.'];
const PROGRESS_KEY = 'nk1a2_genteknik_begrepp_progress';
const EASY_KEY = 'nk1a2_genteknik_begrepp_easy';
const RANK_SALT = 'nk1a2gentekniksaltgron4ade';
const RANK_ORDER = { D: 1, C: 2, B: 3, A: 4, S: 5 };

function loadProgress() {
  try {
    const raw = sessionStorage.getItem(PROGRESS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { completed: {}, best: {} };
}

function saveProgress(progress) {
  try {
    sessionStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (e) {}
}

function loadEasy() {
  try { return sessionStorage.getItem(EASY_KEY) === '1'; } catch (e) { return false; }
}

function saveEasy(on) {
  try { sessionStorage.setItem(EASY_KEY, on ? '1' : '0'); } catch (e) {}
}

function computeRank(progress) {
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  if (completedCount === 0) return null;
  if (completedCount === 5) {
    const allPerfect = SCORE_VIEWS.every(v => (progress.best[v] || 0) >= 100);
    return allPerfect ? 'S' : 'A';
  }
  if (completedCount === 4) return 'A';
  if (completedCount === 3) return 'B';
  if (completedCount === 2) return 'C';
  return 'D';
}

function computeVerificationCode(progress, rank) {
  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const completedViews = VIEWS.filter(v => progress.completed[v]).sort().join(',');
  const input = dateStr + '|' + completedViews + '|' + (rank || '-') + '|' + RANK_SALT;
  let hash = 0;
  for (let i = 0; i < input.length; i++) {
    hash = (hash + input.charCodeAt(i) * (i + 1)) % 1679616; // 36^4
  }
  return 'NK2G-' + hash.toString(36).toUpperCase().padStart(4, '0');
}

// "Aldrig samma kort två gånger i rad" även mellan rundor
function shuffleDeck(cards, lastId) {
  const d = shuffleArray(cards);
  if (d.length > 1 && d[0].id === lastId) [d[0], d[1]] = [d[1], d[0]];
  return d;
}

function getFeedback(score, total) {
  const p = total ? score / total : 0;
  if (p >= 0.9) return 'Redo för provet! Fantastiskt bra!';
  if (p >= 0.7) return 'Bra jobbat! Öva lite till på de du missade.';
  if (p >= 0.5) return 'Halvvägs! Fortsätt träna.';
  return 'Öva lite till – du är på rätt väg!';
}

// Begrepp som överlappar (t.ex. är varje punktmutation också en mutation) får
// aldrig vara distraktorer för varandra — då skulle två alternativ vara rätt.
const OVERLAP = [
  [1, 3], [11, 12], [11, 13], [12, 13], [16, 17], [17, 18],
  [21, 22], [21, 24], [21, 25], [21, 26], [21, 27], [22, 25], [22, 26], [22, 27], [25, 26], [25, 27],
];
const overlaps = (a, b) => OVERLAP.some(([x, y]) => (x === a && y === b) || (x === b && y === a));

// Delad hjälpare för Test 1: tar det visade begreppet och den BLANDADE arrayen.
// Rätt svar först, tre distraktorer ur samma del (bland de fem som ligger närmast
// i längd, så alternativen blir ungefär lika långa), hela listan blandas sist.
function buildOptions(target, items) {
  const candidates = items.filter(c => c.id !== target.id && c.del === target.del && !overlaps(c.id, target.id));
  const byLength = shuffleArray(candidates).sort(
    (a, b) => Math.abs(a.term.length - target.term.length) - Math.abs(b.term.length - target.term.length)
  );
  const distractors = shuffleArray(byLength.slice(0, 5)).slice(0, 3);
  return shuffleArray([target, ...distractors]);
}

// Lucktext: exakt stavning (skiftläge och mellanslag spelar ingen roll).
// Några termer har en etikett inom parentes eller ett längre namn — kortformen godkänns också.
const ALT_ANSWERS = {
  26: ['herbicidtolerans', 'ht'],
  27: ['insektsresistens', 'ir'],
  29: ['crispr/cas9', 'gensaxen', 'crispr'],
};
const normalizeAnswer = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
const isAcceptedAnswer = (c, value) => {
  const v = normalizeAnswer(value);
  return v === normalizeAnswer(c.term) || (ALT_ANSWERS[c.id] || []).includes(v);
};

function ListView({ onComplete, easy }) {

  const [del, setDel] = useState('alla');
  const sentinelRef = useRef(null);

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) onComplete();
    }, { threshold: 1.0 });
    observer.observe(el);
    return () => observer.disconnect();
  }, [onComplete]);

  const q = query.trim().toLowerCase();
  const filtered = filterByDel(del).filter(c =>
    !q ||
    c.term.toLowerCase().includes(q) ||
    c.def.toLowerCase().includes(q) ||
    c.ex.toLowerCase().includes(q) ||

  );

  return (
    <div>

        value={query}
        onChange={e => setQuery(e.target.value)}

      <div className="flex flex-col gap-3">
        {filtered.map((c, i) => (
          <React.Fragment key={c.id}>
            {del === 'alla' && (i === 0 || filtered[i - 1].del !== c.del) && (
              <h2 className="font-fredoka font-bold text-sm uppercase tracking-wide mt-4 first:mt-0" style={{ color: PRIMARY_TEXT }}>
                Del {c.del} – {DELAR[c.del]}
              </h2>
            )}
            <div
              className="list-card bg-white rounded-2xl shadow-sm p-5 border-l-8 hover:shadow-md transition-shadow"
              style={{ borderColor: PRIMARY }}
            >
              <div className="flex items-start gap-3">
                <span
                  className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold font-fredoka mt-0.5"
                  style={{ background: '#dcfce7', color: PRIMARY_TEXT }}

                <div className="flex-1 min-w-0">
                  <div className="flex items-start justify-between gap-2">

  );
}

// Kort som sorterats minst en gång (oavsett filter) — Flashcards klar när alla 30 sorterats
const flashSorted = new Set();

function FlashcardView({ onComplete, easy }) {
  const [del, setDel] = useState('alla');
  const pool = filterByDel(del);
  const total = pool.length;
  const [deck, setDeck] = useState(() => shuffleDeck(concepts));
  const [deckIdx, setDeckIdx] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

  const resetWith = (cards) => {
    setDeck(shuffleDeck(cards));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const restartAll = () => resetWith(pool);

  const changeDel = (d) => {
    setDel(d);
    resetWith(filterByDel(d));
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    flashSorted.add(card.id);
    if (flashSorted.size >= concepts.length) onComplete();
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    const last = deck[deck.length - 1];
    setDeck(shuffleDeck(kudeInte, last && last.id));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  const header = (
    <div className="w-full">
      <DelFilter value={del} onChange={changeDel} />
      <DelCaption del={del} />
    </div>
  );

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6">
      {header}
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du kan <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp!</p>
        <button onClick={restartAll} className="w-full px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY, color: PRIMARY_TEXT }}>
          Börja om med alla
        </button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6">
      {header}
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold font-fredoka hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY, color: PRIMARY_TEXT }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center">
      {header}
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold font-fredoka">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold font-fredoka">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold font-fredoka">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <span className="absolute top-5 text-[10px] uppercase tracking-[0.2em] font-bold font-fredoka opacity-70" style={{ color: PRIMARY_TEXT }}>Del {card.del}</span>

        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold font-fredoka py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte

            ✓ Kunde

      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs font-fredoka">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline font-fredoka">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

    setChecked(false);
  };
  const changeDel = (d) => { setDel(d); resetWith(d); };

  const submit = (c) => {
    if (checked || statuses[c.id] === 'correct') return;
    const val = inputs[c.id] || '';
    if (!val.trim()) return;
    if (isAcceptedAnswer(c, val)) setStatuses(p => ({ ...p, [c.id]: 'correct' }));
    else setStatuses(p => ({ ...p, [c.id]: p[c.id] ? 'wrong2' : 'wrong1' }));
  };

  const rattaAlla = () => {
    setStatuses(p => {
      const next = {};
      items.forEach(c => {
        next[c.id] = p[c.id] === 'correct' || isAcceptedAnswer(c, inputs[c.id] || '') ? 'correct' : 'final';
      });
      return next;
    });
    setChecked(true);
  };

  const total = items.length;
  const score = items.filter(c => statuses[c.id] === 'correct').length;
  const finished = checked || score === total;
  const bank = [...items].sort((a, b) => a.term.localeCompare(b.term, 'sv'));

  useEffect(() => {
    if (finished && del === 'alla') onComplete(Math.round((score / total) * 100));
  }, [finished, del]);

  return (
    <div>
      <DelFilter value={del} onChange={changeDel} />
      <DelCaption del={del} />
      <CompletionHint del={del} />

      <div className="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-slate-200">
        <p className="text-xs uppercase tracking-wide text-slate-400 font-fredoka font-bold mb-2">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {bank.map(c => (
            <span
              key={c.id}
              className={'px-3 py-1 rounded-full text-sm border border-slate-200 bg-slate-50 ' + (statuses[c.id] === 'correct' ? 'line-through text-slate-300' : 'text-slate-600')}
            >
              {c.term}
            </span>
          ))}
        </div>
      </div>

      <div className="flex flex-col gap-3">
        {items.map((c, i) => {
          const [before, after] = c.lucktext.split('_____');
          const status = statuses[c.id];
          const locked = status === 'correct' || status === 'final';
          const boxStyle =
            status === 'correct' ? { background: '#dcfce7', borderColor: '#16a34a' }
            : status === 'wrong2' || status === 'final' ? { background: '#fee2e2', borderColor: '#dc2626' }
            : { borderColor: '#e2e8f0' };
          return (
            <div key={c.id} className="rounded-2xl p-4 border-2 bg-white transition-colors" style={boxStyle}>
              <p className="text-slate-700 leading-relaxed text-lg">
                <span className="font-bold font-fredoka text-slate-400 mr-1">{i + 1}.</span>
                {before}
                <input
                  type="text"
                  value={inputs[c.id] || ''}
                  disabled={locked}
                  autoComplete="off"
                  autoCapitalize="off"
                  spellCheck={false}
                  enterKeyHint="done"
                  onChange={e => { const v = e.target.value; setInputs(p => ({ ...p, [c.id]: v })); }}
                  onKeyDown={e => { if (e.key === 'Enter') submit(c); }}
                  className="inline-block mx-1 px-2 py-1 w-44 max-w-full rounded-lg border border-slate-300 focus:outline-none focus:ring-2 text-slate-800 disabled:bg-transparent disabled:border-transparent disabled:font-bold align-middle"
                  style={{ '--tw-ring-color': PRIMARY }}
                />
                {after}
              </p>
              {status === 'wrong1' && (
                <p className="text-orange-500 text-sm font-fredoka mt-1">Är du säker att du stavat rätt?</p>
              )}
              {status === 'wrong2' && (
                <p className="text-sm font-fredoka mt-1" style={{ color: '#dc2626' }}>Fel. Försök igen eller tryck ”Rätta alla”.</p>
              )}
              {status === 'correct' && (
                <p className="text-sm mt-1" style={{ color: '#16a34a' }}>✓ Rätt! {c.def}</p>
              )}
              {status === 'final' && (
                <p className="text-sm mt-1" style={{ color: '#dc2626' }}>Rätt svar: <span className="font-bold">{c.term}</span> — {c.def}</p>
              )}
            </div>
          );
        })}
      </div>

      <div className="flex flex-col items-center gap-4 mt-6">
        {!finished && (
          <button onClick={rattaAlla} className="bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold font-fredoka hover:bg-slate-800 transition-colors">
            Rätta alla
          </button>
        )}
        {finished && <ResultBox score={score} total={total} />}
        <button onClick={() => resetWith(del)} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline font-fredoka">↺ Börja om</button>
      </div>
    </div>
  );
}

// Test 1 (intern nyckel 'Scenario'). Enkel svenska påverkar scenariotexten, aldrig termerna.
function ScenarioView({ onComplete, easy }) {
  const [del, setDel] = useState('alla');
  const [items, setItems] = useState(() => shuffleArray(concepts));
  const [options, setOptions] = useState(() => buildOptions(items[0], items));
  const [current, setCurrent] = useState(0);
  const [selectedId, setSelectedId] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  const resetWith = (pool) => {
    const next = shuffleArray(pool);
    setItems(next);
    setOptions(buildOptions(next[0], next));
    setCurrent(0);
    setSelectedId(null);
    setScore(0);
    setDone(false);
  };
  const changeDel = (d) => { setDel(d); resetWith(filterByDel(d)); };

  const concept = items[current];
  const answered = selectedId !== null;

  const handleSelect = (id) => {
    if (answered) return;
    setSelectedId(id);
    if (id === concept.id) setScore(s => s + 1);
  };

  const next = () => {
    const n = current + 1;
    if (n >= items.length) { setDone(true); return; }
    setOptions(buildOptions(items[n], items));
    setCurrent(n);
    setSelectedId(null);
  };

  useEffect(() => {
    if (done && del === 'alla') onComplete(Math.round((score / items.length) * 100));
  }, [done]);

  const header = (
    <div className="w-full">
      <DelFilter value={del} onChange={changeDel} />
      <DelCaption del={del} />
      <CompletionHint del={del} />
    </div>
  );

  if (done) return (
    <div>
      {header}
      <ResultBox score={score} total={items.length} onRestart={() => resetWith(filterByDel(del))} />
    </div>
  );

  return (
    <div className="flex flex-col items-center">
      {header}
      <ProgressTop label="Fråga" current={current} total={items.length} score={score} />

      <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 w-full max-w-lg">
        <p className="text-slate-800 text-lg leading-relaxed">{concept.scenario}</p>
        {easy && <p className="text-slate-600 mt-2 font-fredoka leading-relaxed">📖 {concept.scenarioEnkel}</p>}
        <p className="text-xs uppercase tracking-wide text-slate-400 font-fredoka font-bold mt-5 mb-3">Vilket begrepp beskrivs?</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {options.map((opt) => {
            const isCorrect = opt.id === concept.id;
            let optStyle = { borderColor: '#e2e8f0' };
            if (answered && isCorrect) optStyle = { background: '#dcfce7', borderColor: '#16a34a', color: '#16a34a' };
            else if (answered && opt.id === selectedId) optStyle = { background: '#fee2e2', borderColor: '#dc2626', color: '#dc2626' };
            else if (answered) optStyle = { borderColor: '#e2e8f0', opacity: 0.5 };
            return (
              <button
                key={opt.id}
                onClick={() => handleSelect(opt.id)}
                disabled={answered}
                className="text-left px-4 py-3 rounded-2xl border-2 font-bold text-slate-700 transition-colors break-words"
                style={optStyle}
              >
                {opt.term}
              </button>
            );
          })}
        </div>
        {answered && (
          <div className="mt-5 p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <p className="text-sm text-slate-600 leading-relaxed">
              <span className="font-bold" style={{ color: PRIMARY_TEXT }}>{concept.term}:</span> {concept.def}
            </p>
            <Example c={concept} easy={easy} className="mt-2 text-sm" />
            <button onClick={next} className="w-full mt-4 px-6 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY, color: PRIMARY_TEXT }}>
              {current + 1 >= items.length ? 'Se resultat →' : 'Nästa →'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// Test 2 (intern nyckel 'Icke-ex.'): definitionen mot en trovärdig fälla — eleven pekar ut fällan.
function IckeExempelView({ onComplete, easy }) {
  const makeOpts = (c) => shuffleArray([
    { text: c.def, isTrap: false },
    { text: c.ickeExempel, isTrap: true },
  ]);
  const fresh = (pool) => {
    const items = shuffleArray(pool);
    return { items, cur: 0, opts: makeOpts(items[0]), selIdx: null, score: 0, done: false };
  };

  const [del, setDel] = useState('alla');
  const [s, setS] = useState(() => fresh(concepts));
  const changeDel = (d) => { setDel(d); setS(fresh(filterByDel(d))); };

  const total = s.items.length;
  const concept = s.items[s.cur];
  const answered = s.selIdx !== null;
  const gotIt = answered && s.opts[s.selIdx].isTrap;

  const handleSelect = (idx) => {
    if (answered) return;
    setS(p => ({ ...p, selIdx: idx, score: p.opts[idx].isTrap ? p.score + 1 : p.score }));
  };

  const next = () => setS(p => {
    const n = p.cur + 1;
    if (n >= p.items.length) return { ...p, done: true };
    return { ...p, cur: n, opts: makeOpts(p.items[n]), selIdx: null };
  });

  useEffect(() => {
    if (s.done && del === 'alla') onComplete(Math.round((s.score / total) * 100));
  }, [s.done]);

  const header = (
    <div className="w-full">
      <DelFilter value={del} onChange={changeDel} />
      <DelCaption del={del} />
      <CompletionHint del={del} />
    </div>
  );

  if (s.done) return (
    <div>
      {header}
      <ResultBox score={s.score} total={total} onRestart={() => setS(fresh(filterByDel(del)))} />
    </div>
  );

  return (
    <div className="flex flex-col items-center">
      {header}
      <ProgressTop label="Begrepp" current={s.cur} total={total} score={s.score} />

      <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 w-full max-w-lg">
        <p className="text-xs uppercase tracking-wide text-slate-400 font-fredoka font-bold mb-2">Vilken beskrivning stämmer INTE på</p>
        <p className="text-2xl font-bold mb-5 break-words" style={{ color: PRIMARY_TEXT }}>{concept.term}?</p>
        <div className="flex flex-col gap-3">
          {s.opts.map((opt, idx) => {
            let optStyle = { borderColor: '#e2e8f0' };
            if (answered && opt.isTrap) optStyle = { background: '#dcfce7', borderColor: '#16a34a' };
            else if (answered && idx === s.selIdx) optStyle = { background: '#fee2e2', borderColor: '#dc2626' };
            return (
              <button
                key={idx}
                onClick={() => handleSelect(idx)}
                disabled={answered}
                className="text-left px-4 py-3 rounded-2xl border-2 text-slate-700 leading-relaxed transition-colors"
                style={optStyle}
              >
                <span className="font-bold font-fredoka mr-2">{idx === 0 ? 'A' : 'B'}</span>{opt.text}
              </button>
            );
          })}
        </div>
        {answered && (
          <div className="mt-5 p-4 rounded-2xl bg-slate-50 border border-slate-200 text-sm text-slate-600 leading-relaxed">
            <p className="font-bold font-fredoka mb-1" style={{ color: gotIt ? '#16a34a' : '#dc2626' }}>
              {gotIt ? '✓ Rätt! Det där är inte ' + concept.term + '.' : '✗ Fel – det du valde är definitionen av ' + concept.term + '.'}
            </p>
            <p>Fällan: ”{concept.ickeExempel}” Det beskriver något annat.</p>
            <p className="mt-2"><span className="font-bold" style={{ color: PRIMARY_TEXT }}>{concept.term}:</span> {concept.def}</p>
            <Example c={concept} easy={easy} className="mt-2" />
            <button onClick={next} className="w-full mt-4 px-6 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY, color: PRIMARY_TEXT }}>
              {s.cur + 1 >= total ? 'Se resultat →' : 'Nästa →'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// HEADER + NAVIGERING
// ════════════════════════════════════════════════════════════
function Header({ activeView, setActiveView, progress, rank, completedCount, code, easy, toggleEasy }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-6 gap-2">
        <a
          href={BACK_FALLBACK}
          onClick={(e) => { e.preventDefault(); smartBack(BACK_FALLBACK); }}
          className="text-sm font-semibold transition-colors text-slate-500 hover:text-green-700"
        >
          ← Tillbaka till startsidan
        </a>
        <button
          onClick={toggleEasy}
          aria-pressed={easy}
          className={'text-sm font-bold font-fredoka px-3 py-1.5 rounded-full border-2 transition-colors whitespace-nowrap ' + (easy ? '' : 'bg-white text-slate-500 border-slate-200 hover:border-slate-300')}
          style={easy ? { background: PRIMARY, borderColor: PRIMARY, color: PRIMARY_TEXT } : {}}
          title="Visar exempel och scenarier med enklare ord. Begrepp, definitioner och lucktext ändras inte."
        >
          📖 Enkel svenska
        </button>
      </div>

      <h1 className="page-title text-3xl md:text-4xl font-bold italic text-center uppercase tracking-wide mb-1" style={{ color: PRIMARY_TEXT }}>
        Cellen, DNA och genteknik
      </h1>
      <p className="text-center text-slate-400 text-sm mb-6 font-fredoka">Naturkunskap 1a2 — Begrepp</p>

      {/* Progress + rank */}
      <div className="mb-4">
        <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
          <span className="text-sm font-semibold text-slate-600 font-fredoka">{completedCount}/5 avsnitt klara</span>
          {rank && (
            <span
              className="text-xs font-bold px-2.5 py-1 rounded-full font-fredoka"
              style={{ background: '#dcfce7', color: PRIMARY_TEXT }}
            >
              Rank: {rank} · Kod: {code}
            </span>
          )}
        </div>
        <div className="w-full bg-slate-200 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all" style={{ width: `${(completedCount / 5) * 100}%`, background: PRIMARY }} />
        </div>
      </div>

      {/* Toggle */}
      <div className="view-tabs flex flex-wrap justify-center gap-1 bg-white rounded-full p-1 shadow-sm border border-slate-200 mb-6 font-fredoka text-sm max-w-full">
        {VIEWS.map((view) => {
          const active = ACTIVE_VIEWS[view];
          return (
            <button
              key={view}
              disabled={!active}
              onClick={() => active && setActiveView(view)}
              title={!active ? 'Kommer snart' : undefined}
              className={
                'flex-shrink-0 px-4 py-2 rounded-full font-bold transition-colors whitespace-nowrap ' +
                (!active
                  ? 'text-slate-300 cursor-not-allowed'
                  : activeView === view
                    ? ''
                    : 'text-slate-500 hover:text-slate-700')
              }
              style={activeView === view && active ? { background: PRIMARY, color: PRIMARY_TEXT } : {}}
            >
              {VIEW_LABELS[view] || view}
              {progress.completed[view] && (
                <span className="ml-1" style={{ color: activeView === view ? PRIMARY_TEXT : '#16a34a' }}>✓</span>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════
function App() {
  const [activeView, setActiveView] = useState('Lista');
  const [progress, setProgress] = useState(loadProgress);
  const [easy, setEasy] = useState(loadEasy);
  const [celebrateRank, setCelebrateRank] = useState(null);
  const prevRankRef = useRef(computeRank(loadProgress()));

  useEffect(() => {
    saveProgress(progress);
  }, [progress]);

  const toggleEasy = () => setEasy(prev => { saveEasy(!prev); return !prev; });

  const markComplete = useCallback((view, pct) => {
    setProgress(prev => {
      const nextCompleted = { ...prev.completed };
      const nextBest = { ...prev.best };
      let changed = false;

      if (typeof pct === 'number' && !(nextBest[view] >= pct)) {
        nextBest[view] = pct;
        changed = true;
      }

      const thresholdMet = typeof pct === 'number' ? pct >= 80 : true;
      if (thresholdMet && !nextCompleted[view]) {
        nextCompleted[view] = true;
        changed = true;
      }

      return changed ? { completed: nextCompleted, best: nextBest } : prev;
    });
  }, []);

  const completeLista = useCallback(() => markComplete('Lista'), [markComplete]);
  const completeFlashcards = useCallback(() => markComplete('Flashcards'), [markComplete]);
  const completeLucktext = useCallback((pct) => markComplete('Lucktext', pct), [markComplete]);
  const completeScenario = useCallback((pct) => markComplete('Scenario', pct), [markComplete]);
  const completeIckeEx = useCallback((pct) => markComplete('Icke-ex.', pct), [markComplete]);

  const rank = computeRank(progress);
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  const code = computeVerificationCode(progress, rank);

  useEffect(() => {
    const prevOrder = prevRankRef.current ? RANK_ORDER[prevRankRef.current] : 0;
    const newOrder = rank ? RANK_ORDER[rank] : 0;
    if (newOrder > prevOrder) {
      setCelebrateRank(rank);
      const t = setTimeout(() => setCelebrateRank(null), 2500);
      prevRankRef.current = rank;
      return () => clearTimeout(t);
    }
    prevRankRef.current = rank;
  }, [rank]);

  return (
    <div className="max-w-2xl mx-auto px-4 py-6">
      <Header
        activeView={activeView}
        setActiveView={setActiveView}
        progress={progress}
        rank={rank}
        completedCount={completedCount}
        code={code}
        easy={easy}
        toggleEasy={toggleEasy}
      />

      <div className="pb-16">
        {activeView === 'Lista' && <ListView onComplete={completeLista} easy={easy} />}
        {activeView === 'Flashcards' && <FlashcardView key="flashcards" onComplete={completeFlashcards} easy={easy} />}
        {activeView === 'Lucktext' && <LucktextView onComplete={completeLucktext} />}
        {activeView === 'Scenario' && <ScenarioView onComplete={completeScenario} easy={easy} />}
        {activeView === 'Icke-ex.' && <IckeExempelView onComplete={completeIckeEx} easy={easy} />}
      </div>

      <footer className="text-center text-slate-400 italic text-sm pb-8">
        Källa: Naturkunskap 1a2 — Cellen, DNA och genteknik, begreppslista
        <br />Designad av John
      </footer>

      {/* Rank celebration overlay */}
      {celebrateRank && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 px-4"
          style={{ background: 'rgba(15, 23, 42, 0.55)' }}
          onClick={() => setCelebrateRank(null)}
        >
          <div className="bg-white rounded-3xl px-10 py-8 text-center shadow-2xl">
            <div className="text-5xl mb-3">{celebrateRank === 'S' ? '🎉🏆🎉' : '🎉'}</div>
            <p className="text-3xl font-bold" style={{ color: PRIMARY_TEXT }}>{celebrateRank}-RANK!</p>
            <p className="text-slate-400 text-sm mt-2">Ny rank uppnådd</p>
          </div>
        </div>
      )}
    </div>
  );
}
