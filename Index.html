<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johns Repetitionsportal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&display=swap');

        body {
            font-family: 'EB Garamond', serif;
            font-size: 1.1rem;
        }

        h1, h2, h3 { font-weight: 700; }

        /* ── Mobile navigator styles ── */
        .mob-step-panel {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            padding: 24px 16px 48px;
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ffffff;
        }
        .mob-subject-btn {
            width: 100%;
            padding: 22px 20px;
            margin-bottom: 14px;
            border: none;
            border-radius: 20px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            font-family: 'EB Garamond', serif;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .mob-subject-btn:active { transform: scale(0.97); }
        .mob-class-btn {
            padding: 18px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
            cursor: pointer;
            font-family: 'EB Garamond', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #334155;
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .mob-class-btn:active { transform: scale(0.97); }
        .mob-class-btn:hover { border-color: #94a3b8; }
        .mob-area-btn {
            width: 100%;
            padding: 18px 18px 18px 16px;
            margin-bottom: 10px;
            border: none;
            border-radius: 16px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
            font-family: 'EB Garamond', serif;
            transition: transform 0.15s ease;
        }
        .mob-area-btn:active { transform: scale(0.97); }
        .mob-action-link {
            display: block;
            width: 100%;
            padding: 20px 24px;
            margin-bottom: 14px;
            border-radius: 18px;
            text-align: center;
            text-decoration: none;
            font-family: 'EB Garamond', serif;
            font-weight: 700;
            font-size: 1.3rem;
            transition: transform 0.15s ease, filter 0.15s ease;
            box-sizing: border-box;
        }
        .mob-action-link:active { transform: scale(0.97); filter: brightness(0.93); }
        .mob-course-label {
            font-family: 'EB Garamond', serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #94a3b8;
            margin: 20px 4px 8px;
        }
        .mob-course-label:first-child { margin-top: 0; }


        /* ══════════════════════════════════════════════════
           DESKTOPVY (≥768 px) — egen CSS, oberoende av Tailwind.
           Allt innehåll renderas av JS från MOB_SUBJECTS.
           ══════════════════════════════════════════════════ */
        .desktop-wrapper {
            --dk-mix:        #ffffff;   /* bas för color-mix (ljust läge) */
            --dk-titlemix:   #241d3d;   /* blandas in i kurs-/klassrubriker */
            --dk-card:       #ffffff;
            --dk-ink:        #241d3d;
            --dk-ink-soft:   #6b6488;
            --dk-line:       rgba(168,85,247,0.22);
            --dk-shadow:     0 10px 30px -18px rgba(88,28,135,0.55);
            --dk-pink:   #ec4899;
            --dk-purple: #a855f7;
            --dk-blue:   #3b82f6;
            --dk-cyan:   #06b6d4;
            --dk-yellow: #facc15;
            --dk-orange: #fb923c;
            --dk-green:  #22c55e;
            max-width: 1180px;
            margin: 0 auto;
            padding: 44px 28px 0;
            color: var(--dk-ink);
            min-height: 100vh;
        }

        /* ── Gemensamma byggstenar ── */
        .desk-gradient-title {
            font-family: 'EB Garamond', serif;
            font-style: italic;
            font-weight: 700;
            line-height: 1.12;
            background: linear-gradient(100deg, var(--dk-pink) 0%, var(--dk-purple) 48%, var(--dk-blue) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .desk-hero    { text-align: center; margin-bottom: 46px; }
        .desk-hero h1 { font-size: clamp(2.4rem, 4.6vw, 3.6rem); margin: 22px 0 12px; }
        .desk-hero p  { font-size: 1.2rem; color: var(--dk-ink-soft); margin: 0; }
        .desk-avatar-ring {
            display: inline-block;
            padding: 5px;
            border-radius: 50%;
            background: conic-gradient(var(--dk-pink), var(--dk-orange), var(--dk-yellow), var(--dk-green), var(--dk-cyan), var(--dk-blue), var(--dk-purple), var(--dk-pink));
            box-shadow: 0 12px 30px -14px rgba(168,85,247,0.7);
        }
        .desk-avatar-ring img {
            display: block;
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--dk-card);
        }

        /* ── Vy 1: klassval ── */
        .desk-group      { margin-bottom: 34px; }
        .desk-group-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
        .desk-group-pill {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 999px;
            color: #ffffff;
            font-weight: 700;
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .desk-group-line { flex: 1; height: 4px; border-radius: 999px; min-width: 20px; }
        .desk-class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }
        .desk-class-btn {
            position: relative;
            overflow: hidden;
            text-align: left;
            padding: 20px 20px 18px;
            border-radius: 22px;
            border: 2px solid;
            cursor: pointer;
            font-family: 'EB Garamond', serif;
            box-shadow: var(--dk-shadow);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .desk-class-btn:hover  { transform: translateY(-4px) rotate(-1.1deg); box-shadow: 0 18px 34px -18px rgba(88,28,135,0.7); }
        .desk-class-btn:active { transform: translateY(-1px) rotate(0deg); }
        .desk-class-blob {
            position: absolute;
            top: -26px; right: -26px;
            width: 82px; height: 82px;
            border-radius: 50%;
            pointer-events: none;
        }
        .desk-class-code {
            position: relative;
            display: block;
            font-size: 2rem;
            font-weight: 700;
            font-style: italic;
            letter-spacing: 0.02em;
            line-height: 1.1;
            margin-bottom: 10px;
        }
        .desk-class-courses { position: relative; display: block; }
        .desk-class-courses .crs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.98rem;
            color: var(--dk-ink-soft);
            line-height: 1.5;
        }
        .desk-class-courses .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .desk-quiet-links { text-align: center; margin: 36px 0 0; }
        .desk-quiet {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            color: var(--dk-ink-soft);
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .desk-quiet:hover { color: var(--dk-purple); }
        .desk-quiet-links .sep { color: var(--dk-ink-soft); margin: 0 12px; opacity: 0.5; }

        /* ── Vy 2/3: header ── */
        .desk-head {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .desk-head img {
            width: 62px; height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--dk-card);
            box-shadow: 0 6px 16px -8px rgba(88,28,135,0.8);
            flex-shrink: 0;
        }
        .desk-head h1         { font-size: clamp(2rem, 3.4vw, 2.8rem); margin: 0; }
        .desk-head .spacer    { flex: 1; }
        .desk-class-tag {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--dk-purple) 16%, var(--dk-mix));
            border: 2px solid color-mix(in srgb, var(--dk-purple) 34%, var(--dk-mix));
            color: color-mix(in srgb, var(--dk-purple) 52%, var(--dk-titlemix));
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
        }
        .desk-btn-yellow {
            background: var(--dk-yellow);
            color: #4a2e05;
            border: none;
            border-radius: 14px;
            padding: 11px 22px;
            font-family: 'EB Garamond', serif;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #ca8a04;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .desk-btn-yellow:hover  { transform: translateY(-1px); box-shadow: 0 5px 0 #ca8a04; }
        .desk-btn-yellow:active { transform: translateY(3px); box-shadow: 0 1px 0 #ca8a04; }
        .desk-tip {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 18px 22px;
            border-radius: 20px;
            margin-bottom: 46px;
            background: linear-gradient(100deg,
                color-mix(in srgb, var(--dk-pink) 15%, var(--dk-mix)) 0%,
                color-mix(in srgb, var(--dk-blue) 15%, var(--dk-mix)) 100%);
            border: 1px solid var(--dk-line);
        }
        .desk-tip .ico { font-size: 1.6rem; line-height: 1.2; flex-shrink: 0; }
        .desk-tip p    { margin: 0; font-size: 1.1rem; font-style: italic; font-weight: 700; line-height: 1.55; }

        /* ── Kurssektion ── */
        .desk-course      { margin-bottom: 52px; }
        .desk-course-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .desk-course-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px; height: 52px;
            border-radius: 16px;
            border: 2px solid;
            transform: rotate(-7deg);
            flex-shrink: 0;
        }
        .desk-course-badge span { display: inline-block; font-size: 1.6rem; transform: rotate(7deg); }
        .desk-course-title {
            font-family: 'EB Garamond', serif;
            font-size: clamp(1.4rem, 2.3vw, 1.85rem);
            font-weight: 700;
            font-style: italic;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin: 0;
        }
        .desk-course-line { flex: 1; height: 4px; border-radius: 999px; min-width: 20px; }

        /* ── Områdeskort ── */
        .desk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .desk-card {
            display: flex;
            flex-direction: column;
            padding: 22px 20px;
            border-radius: 22px;
            border: 1px solid;
            box-shadow: var(--dk-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .desk-card:hover  { transform: translateY(-4px); box-shadow: 0 20px 36px -20px rgba(88,28,135,0.75); }
        .desk-card-emoji  { font-size: 1.9rem; line-height: 1.1; margin-bottom: 8px; }
        .desk-card-title {
            font-family: 'EB Garamond', serif;
            font-size: 1.28rem;
            font-weight: 700;
            line-height: 1.3;
            margin: 0 0 18px;
            color: var(--dk-ink);
        }
        .desk-card-btns { display: flex; flex-direction: column; gap: 9px; margin-top: auto; }
        .desk-btn {
            display: block;
            padding: 11px 14px;
            border-radius: 14px;
            text-align: center;
            text-decoration: none;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.3;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .desk-btn:hover   { transform: translateY(-2px); filter: brightness(1.06); }
        .desk-btn-primary { box-shadow: 0 6px 16px -10px rgba(0,0,0,0.9); }
        .desk-btn-ghost   { border: 1px solid; color: var(--dk-ink); }
        .desk-card-soon {
            margin: 0;
            padding: 10px 0 4px;
            text-align: center;
            font-style: italic;
            color: var(--dk-ink-soft);
            font-size: 0.98rem;
        }

        /* ── Gy11-fällan ── */
        .desk-gy11-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 24px;
            margin-bottom: 24px;
            border: 2px dashed color-mix(in srgb, var(--dk-purple) 34%, var(--dk-mix));
            border-radius: 18px;
            background: color-mix(in srgb, var(--dk-purple) 7%, var(--dk-mix));
            cursor: pointer;
            font-family: 'EB Garamond', serif;
            color: var(--dk-ink);
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .desk-gy11-toggle:hover { border-color: var(--dk-purple); }
        .desk-gy11-toggle .lbl {
            font-size: 1.3rem;
            font-weight: 700;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            flex: 1;
            text-align: left;
        }
        .desk-gy11-toggle .chev { font-size: 1.1rem; color: var(--dk-ink-soft); transition: transform 0.25s ease; }

        /* ── Footer ── */
        .desk-footer { margin-top: 64px; padding: 26px 0 40px; text-align: center; }
        .desk-rainbow {
            height: 5px;
            border-radius: 999px;
            margin-bottom: 22px;
            background: linear-gradient(90deg, var(--dk-pink), var(--dk-purple), var(--dk-blue), var(--dk-cyan), var(--dk-green), var(--dk-yellow), var(--dk-orange));
        }
        .desk-footer p {
            margin: 0 0 4px;
            font-size: 0.75rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--dk-ink-soft);
        }
        .desk-footer-links { margin-top: 16px; font-size: 1rem; }
        .desk-footer-links a {
            color: var(--dk-purple);
            text-decoration: none;
            border-bottom: 1px solid var(--dk-line);
        }
        .desk-footer-links a:hover { border-bottom-color: var(--dk-purple); }
        .desk-footer-links .sep    { color: var(--dk-ink-soft); margin: 0 12px; opacity: 0.5; }

        /* ── Tangentbordsfokus ── */
        .desktop-wrapper :focus-visible {
            outline: 3px solid var(--dk-purple);
            outline-offset: 3px;
            border-radius: 8px;
        }

        /* ── Färgglad bakgrund, endast desktop ── */
        @media (min-width: 768px) {
            body {
                background-color: #fdf7ff;
                background-image:
                    radial-gradient(52rem 30rem at 12% -6%, rgba(251,207,232,0.60), transparent 62%),
                    radial-gradient(46rem 28rem at 92% 4%,  rgba(221,214,254,0.62), transparent 62%),
                    radial-gradient(44rem 30rem at 78% 58%, rgba(191,219,254,0.52), transparent 62%),
                    radial-gradient(38rem 26rem at 6% 78%,  rgba(254,240,138,0.45), transparent 62%);
                background-attachment: fixed;
                background-repeat: no-repeat;
            }
        }

        /* ── Mörkt läge ── */
        @media (prefers-color-scheme: dark) and (min-width: 768px) {
            body {
                background-color: #120d1f;
                background-image:
                    radial-gradient(52rem 30rem at 12% -6%, rgba(131,24,67,0.42), transparent 62%),
                    radial-gradient(46rem 28rem at 92% 4%,  rgba(76,29,149,0.48), transparent 62%),
                    radial-gradient(44rem 30rem at 78% 58%, rgba(30,58,138,0.40), transparent 62%),
                    radial-gradient(38rem 26rem at 6% 78%,  rgba(113,90,17,0.32), transparent 62%);
            }
        }
        @media (prefers-color-scheme: dark) {
            .desktop-wrapper {
                --dk-mix:      #1b1430;
                --dk-titlemix: #ffffff;
                --dk-card:     #211936;
                --dk-ink:      #f2edff;
                --dk-ink-soft: #b3a9d1;
                --dk-line:     rgba(196,181,253,0.28);
                --dk-shadow:   0 10px 30px -18px rgba(0,0,0,0.9);
            }
            .desk-btn-yellow        { box-shadow: 0 4px 0 #a16207; }
            .desk-btn-yellow:hover  { box-shadow: 0 5px 0 #a16207; }
            .desk-btn-yellow:active { box-shadow: 0 1px 0 #a16207; }
        }

        /* ── Mindre rörelse ── */
        @media (prefers-reduced-motion: reduce) {
            .desktop-wrapper *,
            .desktop-wrapper *::before,
            .desktop-wrapper *::after {
                transition: none !important;
                animation: none !important;
            }
            .desk-class-btn:hover,
            .desk-card:hover,
            .desk-btn:hover,
            .desk-btn-yellow:hover { transform: none; }
        }

        /* Synlighetsstyrning: mobil vs desktop */
        #mobile-nav    { display: none; }
        .desktop-wrapper { display: flex; flex-direction: column; }
        @media (max-width: 767px) {
            #mobile-nav      { display: flex; flex-direction: column; min-height: 100dvh; }
            .desktop-wrapper { display: none; }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- ═══════════════════════════════════════════════════
         MOBILNAVIGERING — visas automatiskt under 768 px
         ═══════════════════════════════════════════════════ -->
    <div id="mobile-nav" class="bg-white">

        <!-- Sticky topplisten: tillbaka-pil + brödsmula -->
        <div style="position:sticky;top:0;z-index:20;background:#ffffff;border-bottom:2px solid #f1f5f9;padding:14px 16px;display:flex;align-items:center;gap:8px;min-height:60px;">
            <button id="mob-back-btn" onclick="mobileGoBack()" style="display:none;background:none;border:none;cursor:pointer;font-size:1.9rem;color:#475569;padding:2px 12px 2px 0;line-height:1;flex-shrink:0;touch-action:manipulation;">←</button>
            <div id="mob-breadcrumb" style="font-family:'EB Garamond',serif;font-size:1.1rem;color:#334155;font-weight:600;line-height:1.35;flex:1;"></div>
        </div>

        <!-- Steg-container med slide-animation -->
        <div style="flex:1;overflow:hidden;position:relative;">
            <div id="mob-step-1" class="mob-step-panel" style="transform:translateX(0);"></div>
            <div id="mob-step-2" class="mob-step-panel" style="transform:translateX(100%);"></div>
            <div id="mob-step-3" class="mob-step-panel" style="transform:translateX(100%);"></div>
        </div>

        <p id="mob-pageview-counter" class="pageview-counter text-slate-400 text-xs uppercase tracking-[0.2em] font-black italic" style="text-align:center;padding:10px 0 16px;margin:0;"></p>

    </div>

    <!-- ═══════════════════════════════════════════════════
         DESKTOPVERSION — visas från 768 px och uppåt
         ═══════════════════════════════════════════════════ -->
    <div class="desktop-wrapper">

        <!-- Allt innehåll renderas av renderDesktop() ur MOB_SUBJECTS / CLASS_COURSES / CLASS_GROUPS -->
        <main id="desk-root"></main>

        <footer class="desk-footer">
            <div class="desk-rainbow"></div>
            <p>Designad av John</p>
            <p id="pageview-counter" class="pageview-counter"></p>
            <nav class="desk-footer-links">
                <a href="kollegor.html">Kollegors kurser</a>
                <span class="sep">·</span>
                <a href="larare-guide.html">Är du lärare? Bygg din egen hemsida</a>
            </nav>
        </footer>
    </div>
    <!-- ═══════════════════════════════════════════════════
         MOBILNAVIGERING — JavaScript
         ═══════════════════════════════════════════════════ -->
    <script>
    var MOB_SUBJECTS = [
      {
        id: 'sh', name: 'Samhällskunskap', emoji: '🏛️', gy11: true,
        color: '#fbbf24', bgLight: '#fef9c3', textDark: '#78350f',
        areas: [
          { name: '1. Demokrati',          course: 'Sa1a1', color: '#fbbf24', bgLight: '#fef9c3', textDark: '#78350f', quizLabel: 'Starta Quiz',   quiz: 'sh_demokrati.html',      material: 'sh_demokrati_material.html',    begrepp: 'sh_demokratibegrepp.html' },
          { name: '2. Så styrs Sverige',   course: 'Sa1a1', color: '#fbbf24', bgLight: '#fef9c3', textDark: '#78350f', quizLabel: 'Starta Quiz',   quiz: 'sh_styrning_val.html',    material: 'sh_styrning_material.html',     begrepp: 'sh_styrningbegrepp.html' },
          { name: '3. Privatekonomi',      course: 'Sa1a1', color: '#fbbf24', bgLight: '#fef9c3', textDark: '#78350f', quizLabel: 'Starta Quiz',   quiz: 'sh_privatekonomi.html',   material: 'sh_privatekonomi_material.html', begrepp: 'sh_privatekonomibegrepp.html' },
          { name: '4. Arbetsmarknad',      course: 'Sa1a1', color: '#fbbf24', bgLight: '#fef9c3', textDark: '#78350f', quizLabel: 'Starta Quiz',   quiz: 'sh_arbetsmarknad.html',   material: 'sh_arbetsmarknad_material.html', begrepp: 'sh_arbetsmarknadbegrepp.html' }
        ]
      },
      {
        id: 'sh_1a2', name: 'Samhällskunskap Sa1a2', emoji: '🏛️',

    // ── Klass → kurser. Mappa via kurs-id i MOB_SUBJECTS, aldrig via rubriktext.
    //    Redigera hela klass/kurs-kopplingen här. ──
    var CLASS_COURSES = {
      'BF25': ['sh_ny', 'nk_ny', 'jur'],
      'FS25': ['sh_ny', 'nk_ny', 'jur'],
      'VF25': ['sh_ny', 'nk_ny'],
      'VO25': ['sh_ny', 'nk_ny'],
      'IN25': ['sh_ny', 'nk_ny'],
      'BF24': ['sh_1a2', 'nk_1a2', 'ratt'],
      'FS24': ['ratt'],
      'VO24': ['sh_1a2']
    };

    var CLASS_GROUPS = [
      { label: 'Årskurs 2', classes: ['BF25', 'FS25', 'VF25', 'VO25', 'IN25'] },
      { label: 'Årskurs 3', classes: ['BF24', 'FS24', 'VO24'] }
    ];

    var CLASS_STORAGE_KEY = 'johnshemsida_klass';

    var mobCurrentStep = 1;
    var mobSelectedSubjectIdx = null;
    var mobSelectedAreaIdx = null;
    var mobSelectedClass = null;
    var mobShowAllOverride = false;

    try {
      var savedClass = localStorage.getItem(CLASS_STORAGE_KEY);
      if (savedClass && CLASS_COURSES.hasOwnProperty(savedClass)) {
        mobSelectedClass = savedClass;
      } else if (savedClass) {
        localStorage.removeItem(CLASS_STORAGE_KEY);
      }
    } catch (e) {}

    function mobUpdateHeader() {
      var bc = document.getElementById('mob-breadcrumb');
      var backBtn = document.getElementById('mob-back-btn');
      if (mobCurrentStep === 1) {
        bc.textContent = mobSelectedClass ? 'Dina kurser' : 'Vilken klass går du i?';
        backBtn.style.display = 'none';
      } else if (mobCurrentStep === 2) {
        var s = MOB_SUBJECTS[mobSelectedSubjectIdx];
        bc.innerHTML = '<span style="color:' + s.color + ';font-weight:800;">' + s.name + '</span>';
        backBtn.style.display = 'block';
      } else {
        var s2 = MOB_SUBJECTS[mobSelectedSubjectIdx];
        var a = s2.areas[mobSelectedAreaIdx];
        bc.innerHTML = '<span style="color:' + s2.color + ';font-weight:800;">' + s2.name + '</span>'
          + ' <span style="color:#cbd5e1;margin:0 4px;">›</span> '
          + '<span style="color:#334155;">' + a.name + '</span>';
        backBtn.style.display = 'block';
      }
    }

    function mobSlide(fromStep, toStep) {
      var direction = toStep > fromStep ? 1 : -1;
      var fromEl = document.getElementById('mob-step-' + fromStep);
      var toEl   = document.getElementById('mob-step-' + toStep);

      toEl.style.transition = 'none';
      toEl.style.transform  = 'translateX(' + (direction * 100) + '%)';
      toEl.offsetHeight; // force reflow

      fromEl.style.transition = 'transform 0.32s cubic-bezier(0.4,0,0.2,1)';
      toEl.style.transition   = 'transform 0.32s cubic-bezier(0.4,0,0.2,1)';
      fromEl.style.transform  = 'translateX(' + (direction * -100) + '%)';
      toEl.style.transform    = 'translateX(0)';
      toEl.scrollTop = 0;

      mobCurrentStep = toStep;
      mobUpdateHeader();
    }

    function mobileGoBack() {
      if (mobCurrentStep === 2) {
        mobSlide(2, 1);
        mobSelectedSubjectIdx = null;
      } else if (mobCurrentStep === 3) {
        mobSlide(3, 2);
        mobSelectedAreaIdx = null;
      }
    }

    function mobileSelectClass(cls) {
      if (!CLASS_COURSES.hasOwnProperty(cls)) return;
      mobSelectedClass = cls;
      mobShowAllOverride = false;
      try { localStorage.setItem(CLASS_STORAGE_KEY, cls); } catch (e) {}
      renderMobStep1();
      mobUpdateHeader();
    }

    function mobileChangeClass() {
      mobSelectedClass = null;
      mobShowAllOverride = false;
      try { localStorage.removeItem(CLASS_STORAGE_KEY); } catch (e) {}
      renderMobStep1();
      mobUpdateHeader();
    }

    function mobileShowAllCourses() {
      mobShowAllOverride = true;
      renderMobStep1();
    }

    function mobileBackToMyCourses() {
      mobShowAllOverride = false;
      renderMobStep1();
    }

    function mobileSelectSubject(idx) {
      mobSelectedSubjectIdx = idx;
      renderMobStep2();
      mobSlide(1, 2);
    }

    function mobileSelectArea(idx) {
      mobSelectedAreaIdx = idx;
      renderMobStep3();
      mobSlide(2, 3);
    }

    var mobGy11Open = false;
    function toggleMobGy11() {
      mobGy11Open = !mobGy11Open;
      var sec  = document.getElementById('mob-gy11-body');
      var chev = document.getElementById('mob-gy11-chev');
      if (sec)  sec.style.display = mobGy11Open ? 'block' : 'none';
      if (chev) chev.style.transform = mobGy11Open ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    function mobSubjectBtnHtml(i, s) {
      return '<button class="mob-subject-btn" onclick="mobileSelectSubject(' + i + ')" style="background:' + s.bgLight + ';">'
        + '<span style="font-size:2.2rem;flex-shrink:0;">' + s.emoji + '</span>'
        + '<span style="font-size:1.45rem;font-weight:700;color:' + s.textDark + ';flex:1;font-family:\'EB Garamond\',serif;">' + s.name + '</span>'
        + '<span style="font-size:1.5rem;color:' + s.color + ';flex-shrink:0;">›</span>'
        + '</button>';
    }

    function renderMobStep1() {
      var el = document.getElementById('mob-step-1');
      if (!mobSelectedClass) {
        el.innerHTML = buildClassPickerHtml();
      } else if (mobShowAllOverride) {
        el.innerHTML = buildAllCoursesHtml();
      } else {
        el.innerHTML = buildMyCoursesHtml();
      }
    }

    // Steg 1: klassval – visas när ingen klass är sparad
    function buildClassPickerHtml() {
      var html = '<div style="text-align:center;margin-bottom:20px;">'
        + '<img src="portalbild.png" alt="Portalbild" style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #ffffff;box-shadow:0 4px 16px rgba(0,0,0,0.12);display:inline-block;">'
        + '</div>'
        + '<h2 style="font-family:\'EB Garamond\',serif;font-size:1.7rem;font-weight:700;color:#0f172a;text-align:center;margin-bottom:6px;">Vilken klass går du i?</h2>'
        + '<p style="color:#64748b;font-family:\'EB Garamond\',serif;font-size:1.05rem;text-align:center;margin-bottom:24px;">Då visar vi bara dina kurser.</p>';

      for (var g = 0; g < CLASS_GROUPS.length; g++) {
        var grp = CLASS_GROUPS[g];
        html += '<div class="mob-course-label">' + grp.label + '</div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;">';
        for (var c = 0; c < grp.classes.length; c++) {
          var cls = grp.classes[c];
          html += '<button class="mob-class-btn" onclick="mobileSelectClass(\'' + cls + '\')">' + cls + '</button>';
        }
        html += '</div>';
      }
      return html;
    }

    function buildClassHeaderHtml() {
      return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px;">'
        + '<div>'
        + '<div style="font-family:\'EB Garamond\',serif;font-size:1.6rem;font-weight:700;color:#0f172a;line-height:1.2;">Dina kurser</div>'
        + '<div style="font-family:\'EB Garamond\',serif;font-size:1.05rem;color:#64748b;margin-top:2px;">' + mobSelectedClass + '</div>'
        + '</div>'
        + '<button onclick="mobileChangeClass()" style="flex-shrink:0;background:#f1f5f9;border:2px solid #e2e8f0;border-radius:12px;padding:8px 14px;font-family:\'EB Garamond\',serif;font-size:0.95rem;font-weight:700;color:#475569;cursor:pointer;">Byt klass</button>'
        + '</div>';
    }

    // Steg 2: kurslistan – bara klassens kurser, i MOB_SUBJECTS-ordning
    function buildMyCoursesHtml() {
      var allowed = CLASS_COURSES[mobSelectedClass] || [];
      var html = buildClassHeaderHtml();
      for (var i = 0; i < MOB_SUBJECTS.length; i++) {
        if (allowed.indexOf(MOB_SUBJECTS[i].id) === -1) continue;
        html += mobSubjectBtnHtml(i, MOB_SUBJECTS[i]);
      }
      html += '<button onclick="mobileShowAllCourses()" style="display:block;width:100%;margin-top:16px;background:none;border:none;cursor:pointer;color:#94a3b8;font-family:\'EB Garamond\',serif;font-size:0.98rem;text-decoration:underline;">Läser du något annat? Visa alla kurser</button>';
      return html;
    }

    // "Visa alla kurser" – hela listan, utan att radera det sparade valet
    function buildAllCoursesHtml() {
      mobGy11Open = false;
      var html = '<button onclick="mobileBackToMyCourses()" style="background:none;border:none;cursor:pointer;color:#64748b;font-family:\'EB Garamond\',serif;font-size:1rem;padding:0;margin-bottom:14px;">← Dina kurser</button>'
        + '<h2 style="font-family:\'EB Garamond\',serif;font-size:1.6rem;font-weight:700;color:#0f172a;margin-bottom:16px;">Alla kurser</h2>';

      for (var i = 0; i < MOB_SUBJECTS.length; i++) {
        if (MOB_SUBJECTS[i].gy11) continue;
        html += mobSubjectBtnHtml(i, MOB_SUBJECTS[i]);
      }

      html += '<button onclick="toggleMobGy11()" style="width:100%;padding:18px 20px;margin-bottom:10px;border:2px dashed #cbd5e1;border-radius:16px;background:#f8fafc;cursor:pointer;display:flex;align-items:center;gap:16px;font-family:\'EB Garamond\',serif;">'
        + '<span style="font-size:2.2rem;flex-shrink:0;">🎒</span>'
        + '<span style="font-size:1.45rem;font-weight:700;color:#475569;flex:1;text-align:left;">Gy11-kurser</span>'
        + '<span id="mob-gy11-chev" style="font-size:1.2rem;color:#94a3b8;flex-shrink:0;display:inline-block;transition:transform 0.25s;">▼</span>'
        + '</button>'
        + '<div id="mob-gy11-body" style="display:none;">';

      for (var j = 0; j < MOB_SUBJECTS.length; j++) {
        if (!MOB_SUBJECTS[j].gy11) continue;
        html += mobSubjectBtnHtml(j, MOB_SUBJECTS[j]);
      }

      html += '</div>';
      return html;
    }

    function renderMobStep2() {
      var s = MOB_SUBJECTS[mobSelectedSubjectIdx];
      var el = document.getElementById('mob-step-2');

      var courses = [];
      for (var i = 0; i < s.areas.length; i++) {
        var c = s.areas[i].course;
        if (courses.indexOf(c) === -1) courses.push(c);
      }

      var html = '<h2 style="font-family:\'EB Garamond\',serif;font-size:1.6rem;font-weight:700;color:#0f172a;margin-bottom:4px;">Välj arbetsområde</h2>'
        + '<p style="color:#64748b;font-family:\'EB Garamond\',serif;font-size:1rem;margin-bottom:16px;">Vad vill du öva på?</p>';

      for (var ci = 0; ci < courses.length; ci++) {
        var course = courses[ci];
        if (courses.length > 1) {
          html += '<div class="mob-course-label">' + course + '</div>';
        }
        for (var ai = 0; ai < s.areas.length; ai++) {
          var area = s.areas[ai];
          if (area.course !== course) continue;
          if (area.dold) continue;
          html += '<button class="mob-area-btn" onclick="mobileSelectArea(' + ai + ')" style="background:' + area.bgLight + ';border-left:5px solid ' + area.color + ';">'
            + '<span style="font-size:1.15rem;font-weight:700;color:' + area.textDark + ';flex:1;text-align:left;font-family:\'EB Garamond\',serif;">' + area.name + '</span>'
            + '<span style="font-size:1.4rem;color:' + area.color + ';margin-left:12px;flex-shrink:0;">›</span>'
            + '</button>';
        }
      }
      el.innerHTML = html;
    }

    function renderMobStep3() {
      var s = MOB_SUBJECTS[mobSelectedSubjectIdx];
      var a = s.areas[mobSelectedAreaIdx];
      var el = document.getElementById('mob-step-3');

      var lightColors = ['#fbbf24', '#4ade80'];
      var quizTextColor = lightColors.indexOf(a.color) !== -1 ? a.textDark : '#ffffff';

      var html = '<div style="background:' + a.bgLight + ';border-radius:16px;padding:20px 18px;margin-bottom:28px;border-left:5px solid ' + a.color + ';">'
        + '<div style="font-family:\'EB Garamond\',serif;font-size:0.8rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:' + a.color + ';margin-bottom:6px;">' + a.course + '</div>'
        + '<div style="font-family:\'EB Garamond\',serif;font-size:1.65rem;font-weight:800;color:' + a.textDark + ';line-height:1.2;">' + a.name + '</div>'
        + '</div>'
        + '<p style="color:#64748b;font-family:\'EB Garamond\',serif;font-size:1.05rem;margin-bottom:20px;">Vad vill du göra?</p>';

      if (a.quiz) {
        html += '<a href="' + a.quiz + '" class="mob-action-link" style="background:' + a.color + ';color:' + quizTextColor + ';">🎯 ' + a.quizLabel + '</a>';
      }
      if (a.tasks) {
        html += '<a href="' + a.tasks + '" class="mob-action-link" style="background:' + a.color + ';color:#ffffff;">✏️ Uppgifter</a>';
      }
      if (a.material) {
        html += '<a href="' + a.material + '" class="mob-action-link" style="background:#f1f5f9;color:#475569;border:2px solid #e2e8f0;">' + (a.materialLabel || '📚 Pluggmaterial') + '</a>';
      }
      if (a.begrepp) {
        html += '<a href="' + a.begrepp + '" class="mob-action-link" style="background:#f1f5f9;color:#475569;border:2px solid #e2e8f0;">📖 Öva på begrepp</a>';
      }
      if (a.jeopardy) {
        html += '<a href="' + a.jeopardy + '" class="mob-action-link" style="background:' + a.color + ';color:#ffffff;">🏆 Jeopardy</a>';
      }

      if (!a.quiz && !a.tasks && !a.material && !a.begrepp && !a.jeopardy) {
        html += '<div style="text-align:center;padding:30px 0;color:#94a3b8;font-family:\'EB Garamond\',serif;">'
          + '<p style="font-size:2.5rem;margin-bottom:12px;">🔜</p>'
          + '<p style="font-size:1.15rem;font-weight:700;font-style:italic;color:#64748b;">Materialet förbereds</p>'
          + '<p style="font-size:0.95rem;margin-top:8px;line-height:1.6;">Begrepp, quiz och pluggmaterial<br>läggs till när kursen startar.</p>'
          + '</div>';
      }

      el.innerHTML = html;
    }

    renderMobStep1();
    mobUpdateHeader();

    /* ═══════════════════════════════════════════════════
       DESKTOPVY (≥768 px) — renderas helt från MOB_SUBJECTS,
       CLASS_COURSES och CLASS_GROUPS. Ingen hårdkodad kort-HTML.
       Delar klassval med mobilen via mobSelectedClass + localStorage.
       ═══════════════════════════════════════════════════ */

    var DESK_CLASS_COLORS = ['#ec4899', '#a855f7', '#3b82f6', '#06b6d4', '#facc15', '#fb923c', '#22c55e', '#f43f5e'];
    var DESK_GROUP_GRADIENTS = [
      'linear-gradient(90deg,#ec4899,#a855f7)',   // Årskurs 2: rosa → lila
      'linear-gradient(90deg,#3b82f6,#06b6d4)'    // Årskurs 3: blå → turkos
    ];
    var DESK_LIGHT_COLORS = ['#fbbf24', '#4ade80'];

    var deskShowAll  = false;
    var deskGy11Open = false;

    // color-mix mot --dk-mix, som byter värde i mörkt läge
    function deskTint(color, pct) {
      return 'color-mix(in srgb, ' + color + ' ' + pct + '%, var(--dk-mix))';
    }
    // Läsbar version av en kurskulör: mörknas i ljust läge, ljusnas i mörkt
    function deskInkify(color) {
      return 'color-mix(in srgb, ' + color + ' 50%, var(--dk-titlemix))';
    }

    // "🔬 Naturvetenskapligt arbetssätt" → { emoji:'🔬', rest:'Naturvetenskapligt arbetssätt' }
    var DESK_EMOJI_RE = /^(\p{Extended_Pictographic}(?:\u200D\p{Extended_Pictographic}|[\uFE0F\u20E3])*)\s+(.+)$/u;
    function deskSplitEmoji(name) {
      var m = null;
      try { m = name.match(DESK_EMOJI_RE); } catch (e) {}
      return m ? { emoji: m[1], rest: m[2] } : { emoji: null, rest: name };
    }

    function deskSubjectById(id) {
      for (var i = 0; i < MOB_SUBJECTS.length; i++) {
        if (MOB_SUBJECTS[i].id === id) return MOB_SUBJECTS[i];
      }
      return null;
    }

    /* ── Områdeskort ── */
    function deskAreaCardHtml(area) {
      var c = area.color;
      var onColor = DESK_LIGHT_COLORS.indexOf(c) !== -1 ? area.textDark : '#ffffff';

      function primary(href, label) {
        return '<a class="desk-btn desk-btn-primary" href="' + href + '" style="background:' + c + ';color:' + onColor + ';">' + label + '</a>';
      }
      function ghost(href, label) {
        return '<a class="desk-btn desk-btn-ghost" href="' + href + '" style="background:' + deskTint(c, 11) + ';border-color:' + deskTint(c, 32) + ';">' + label + '</a>';
      }

      var btns = '';
      if (area.materialLabel) {
        // Valkörkortet m.fl.: quizet är del 1, materialet del 2
        if (area.quiz)     btns += primary(area.quiz, '🎯 ' + area.quizLabel);
        if (area.material) btns += ghost(area.material, area.materialLabel);
        if (area.begrepp)  btns += ghost(area.begrepp, '📖 Öva på begrepp');
      } else {
        if (area.begrepp)  btns += ghost(area.begrepp, '📖 Öva på begrepp');
        if (area.material) btns += ghost(area.material, '📚 Pluggmaterial');
        if (area.quiz)     btns += primary(area.quiz, '🎯 ' + area.quizLabel);
      }
      if (area.tasks)    btns += primary(area.tasks, '✏️ Uppgifter');
      if (area.jeopardy) btns += primary(area.jeopardy, '🏆 Jeopardy');
      if (!btns)         btns = '<p class="desk-card-soon">🔜 Materialet förbereds</p>';

      var split = deskSplitEmoji(area.name);
      var head = (split.emoji ? '<div class="desk-card-emoji">' + split.emoji + '</div>' : '')
        + '<h3 class="desk-card-title">' + split.rest + '</h3>';

      return '<div class="desk-card" style="background:linear-gradient(180deg,' + deskTint(c, 14) + ' 0%, var(--dk-card) 58%);border-color:' + deskTint(c, 30) + ';">'
        + head
        + '<div class="desk-card-btns">' + btns + '</div>'
        + '</div>';
    }

    /* ── En kurssektion: rubrik + områdeskort ── */
    function deskCourseSectionHtml(s) {
      var cards = '';
      for (var i = 0; i < s.areas.length; i++) {
        if (s.areas[i].dold) continue;
        cards += deskAreaCardHtml(s.areas[i]);
      }
      return '<section class="desk-course">'
        + '<div class="desk-course-head">'
        + '<span class="desk-course-badge" style="background:' + deskTint(s.color, 18) + ';border-color:' + deskTint(s.color, 42) + ';"><span>' + s.emoji + '</span></span>'
        + '<h2 class="desk-course-title" style="color:' + deskInkify(s.color) + ';">' + s.name + '</h2>'
        + '<span class="desk-course-line" style="background:linear-gradient(90deg,' + s.color + ', transparent);"></span>'
        + '</div>'
        + '<div class="desk-grid">' + cards + '</div>'
        + '</section>';
    }

    /* ── Vy 1: klassval ── */
    function deskClassPickerHtml() {
      var html = '<div class="desk-hero">'
        + '<span class="desk-avatar-ring"><img src="portalbild.png" alt="Portalbild"></span>'
        + '<h1 class="desk-gradient-title">Välkommen till Johns hemsida!</h1>'
        + '<p>Välj din klass, så visar vi bara de kurser du läser.</p>'
        + '</div>';

      var colorIdx = 0;
      for (var g = 0; g < CLASS_GROUPS.length; g++) {
        var grp = CLASS_GROUPS[g];
        var grad = DESK_GROUP_GRADIENTS[g % DESK_GROUP_GRADIENTS.length];
        html += '<div class="desk-group">'
          + '<div class="desk-group-head">'
          + '<span class="desk-group-pill" style="background:' + grad + ';">' + grp.label + '</span>'
          + '<span class="desk-group-line" style="background:' + grad + ';opacity:0.3;"></span>'
          + '</div>'
          + '<div class="desk-class-grid">';

        for (var c = 0; c < grp.classes.length; c++) {
          var cls = grp.classes[c];
          var col = DESK_CLASS_COLORS[colorIdx % DESK_CLASS_COLORS.length];
          colorIdx++;

          var courses = CLASS_COURSES[cls] || [];
          var items = '';
          for (var k = 0; k < MOB_SUBJECTS.length; k++) {
            if (courses.indexOf(MOB_SUBJECTS[k].id) === -1) continue;
            items += '<span class="crs"><span class="dot" style="background:' + MOB_SUBJECTS[k].color + ';"></span>' + MOB_SUBJECTS[k].name + '</span>';
          }

          html += '<button class="desk-class-btn" onclick="deskSelectClass(\'' + cls + '\')" style="background:' + deskTint(col, 13) + ';border-color:' + deskTint(col, 38) + ';">'
            + '<span class="desk-class-blob" style="background:' + deskTint(col, 30) + ';"></span>'
            + '<span class="desk-class-code" style="color:' + deskInkify(col) + ';">' + cls + '</span>'
            + '<span class="desk-class-courses">' + items + '</span>'
            + '</button>';
        }
        html += '</div></div>';
      }

      html += '<div class="desk-quiet-links">'
        + '<button class="desk-quiet" onclick="deskShowAllCourses()">Hittar du inte din klass? Visa alla kurser</button>'
        + '<span class="sep">·</span>'
        + '<a class="desk-quiet" href="kollegor.html">Kollegors kurser</a>'
        + '</div>';
      return html;
    }

    /* ── Vy 2: dina kurser ── */
    function deskMyCoursesHtml() {
      var allowed = CLASS_COURSES[mobSelectedClass] || [];
      var html = '<div class="desk-head">'
        + '<img src="portalbild.png" alt="Portalbild">'
        + '<h1 class="desk-gradient-title">Dina kurser</h1>'
        + '<span class="desk-class-tag">' + mobSelectedClass + '</span>'
        + '<span class="spacer"></span>'
        + '<button class="desk-btn-yellow" onclick="deskChangeClass()">Byt klass</button>'
        + '</div>'
        + '<div class="desk-tip"><span class="ico">💡</span><p>Öva på att hämta svar ur minnet i stället för att bara läsa. 15 minuter om dagen räcker långt – och börja med begreppen innan du gör quizet.</p></div>';

      for (var i = 0; i < MOB_SUBJECTS.length; i++) {
        if (allowed.indexOf(MOB_SUBJECTS[i].id) === -1) continue;
        html += deskCourseSectionHtml(MOB_SUBJECTS[i]);
      }

      html += '<div class="desk-quiet-links">'
        + '<button class="desk-quiet" onclick="deskShowAllCourses()">Läser du något annat? Visa alla kurser</button>'
        + '</div>';
      return html;
    }

    /* ── Vy 3: alla kurser (raderar aldrig det sparade klassvalet) ── */
    function deskAllCoursesHtml() {
      var backLabel = mobSelectedClass ? '← Tillbaka till dina kurser' : '← Välj klass';
      var html = '<div class="desk-head">'
        + '<h1 class="desk-gradient-title">Alla kurser</h1>'
        + '<span class="spacer"></span>'
        + '<button class="desk-btn-yellow" onclick="deskBackFromAll()">' + backLabel + '</button>'
        + '</div>';

      for (var i = 0; i < MOB_SUBJECTS.length; i++) {
        if (MOB_SUBJECTS[i].gy11) continue;
        html += deskCourseSectionHtml(MOB_SUBJECTS[i]);
      }

      html += '<button class="desk-gy11-toggle" onclick="deskToggleGy11()" aria-expanded="' + (deskGy11Open ? 'true' : 'false') + '" aria-controls="desk-gy11-body">'
        + '<span style="font-size:1.8rem;">🎒</span>'
        + '<span class="lbl">Gy11-kurser</span>'
        + '<span class="chev" id="desk-gy11-chev" style="transform:rotate(' + (deskGy11Open ? '180deg' : '0deg') + ');">▼</span>'
        + '</button>'
        + '<div id="desk-gy11-body" style="display:' + (deskGy11Open ? 'block' : 'none') + ';">';

      for (var j = 0; j < MOB_SUBJECTS.length; j++) {
        if (!MOB_SUBJECTS[j].gy11) continue;
        html += deskCourseSectionHtml(MOB_SUBJECTS[j]);
      }
      html += '</div>';
      return html;
    }

    function renderDesktop() {
      var root = document.getElementById('desk-root');
      if (!root) return;
      if (deskShowAll)            root.innerHTML = deskAllCoursesHtml();
      else if (!mobSelectedClass) root.innerHTML = deskClassPickerHtml();
      else                        root.innerHTML = deskMyCoursesHtml();
    }

    /* ── Desktopens händelser. Klassvalet speglas till mobilvyn. ── */
    function deskSelectClass(cls) {
      if (!CLASS_COURSES.hasOwnProperty(cls)) return;
      mobSelectedClass = cls;
      mobShowAllOverride = false;
      deskShowAll = false;
      try { localStorage.setItem(CLASS_STORAGE_KEY, cls); } catch (e) {}
      renderDesktop();
      renderMobStep1();
      mobUpdateHeader();
      window.scrollTo(0, 0);
    }

    function deskChangeClass() {
      mobSelectedClass = null;
      mobShowAllOverride = false;
      deskShowAll = false;
      try { localStorage.removeItem(CLASS_STORAGE_KEY); } catch (e) {}
      renderDesktop();
      renderMobStep1();
      mobUpdateHeader();
      window.scrollTo(0, 0);
    }

    function deskShowAllCourses() {
      deskShowAll = true;
      deskGy11Open = false;
      renderDesktop();
      window.scrollTo(0, 0);
    }

    function deskBackFromAll() {
      deskShowAll = false;
      renderDesktop();
      window.scrollTo(0, 0);
    }

    function deskToggleGy11() {
      deskGy11Open = !deskGy11Open;
      var body = document.getElementById('desk-gy11-body');
      var chev = document.getElementById('desk-gy11-chev');
      if (body) body.style.display = deskGy11Open ? 'block' : 'none';
      if (chev) chev.style.transform = deskGy11Open ? 'rotate(180deg)' : 'rotate(0deg)';
      var btn = document.querySelector('.desk-gy11-toggle');
      if (btn) btn.setAttribute('aria-expanded', deskGy11Open ? 'true' : 'false');
    }

    renderDesktop();


    fetch('https://johnblixt.goatcounter.com/counter/TOTAL.json')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var count = data.count.replace(/,/g, ' ');
        var els = document.querySelectorAll('.pageview-counter');
        for (var i = 0; i < els.length; i++) { els[i].textContent = count + ' sidvisningar'; }
      })
      .catch(function() {});
    </script>

    <script src="feedback-widget.js" defer></script>
    <script data-goatcounter="https://johnblixt.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
