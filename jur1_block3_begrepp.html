function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function makeOptions(currentItem, allData) {
  const distractors = allData.filter(d => d.id !== currentItem.id);
  shuffleArray(distractors);
  return shuffleArray([currentItem, ...distractors.slice(0, 3)]);
}

function NonExampleView() {
  const total = nonExampleData.length;
  const [items, setItems] = useState(() => shuffleArray([...nonExampleData]));
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [phase, setPhase] = useState('playing');

  const current = items[idx];
  const isAnswered = selected !== null;

  const handleSelect = (letter) => {
    if (isAnswered) return;
    setSelected(letter);
    if (letter === current.correct) setScore(s => s + 1);
  };

  const handleNext = () => {
    const nextIdx = idx + 1;
    if (nextIdx >= total) {
      setPhase('done');
    } else {
      setIdx(nextIdx);
      setSelected(null);
    }
  };

  const restart = () => {
    setItems(shuffleArray([...nonExampleData]));
    setIdx(0);
    setSelected(null);
    setScore(0);
    setPhase('playing');
  };

  if (phase === 'done') return (
    <div className="flex flex-col items-center gap-6">
      <div className="rounded-3xl p-8 text-center w-full max-w-sm" style={{ background: PRIMARY_LIGHT, border: `2px solid ${PRIMARY}` }}>
        <div className="text-5xl mb-4">🧠</div>
        <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
        <p className="text-slate-500 text-sm mb-6">
          {score === total
            ? 'Perfekt! Du ser skillnaden på riktiga tillämpningar och fällor.'
            : score >= Math.round(total * 0.8)
            ? 'Bra jobbat! Öva lite till på de du missat.'
            : 'Fortsätt öva – du lär dig!'}
        </p>
        <button onClick={restart} className="text-white font-bold px-8 py-3 rounded-2xl" style={{ background: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  return (
    <div className="flex flex-col gap-4 max-w-2xl mx-auto">
      <div className="flex items-center justify-between">
        <span className="text-xs text-slate-400 font-medium">{idx + 1} av {total}</span>
        <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}>
          {score} rätt
        </span>
      </div>
      <div className="w-full bg-slate-200 rounded-full h-1.5 mb-1">
        <div className="h-1.5 rounded-full transition-all" style={{ width: `${(idx / total) * 100}%`, background: PRIMARY }} />
      </div>

      <div className="bg-white rounded-2xl shadow-sm p-5 border-l-4" style={{ borderLeftColor: PRIMARY }}>
        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Vilket exempel visar begreppet rätt?</p>
        <p className="text-lg font-bold" style={{ color: PRIMARY_TEXT }}>{current.term}</p>
      </div>

      <div className="flex flex-col gap-3">
        {['A', 'B'].map(letter => {
          const text = letter === 'A' ? current.optionA : current.optionB;
          const isCorrect = letter === current.correct;
          const isSelected = selected === letter;
          let bg = '#ffffff', border = '#e2e8f0', textColor = '#1e293b';
          if (isAnswered) {
            if (isCorrect) { bg = '#dcfce7'; border = '#16a34a'; textColor = '#15803d'; }
            else if (isSelected) { bg = '#fee2e2'; border = '#dc2626'; textColor = '#dc2626'; }
          }
          return (
            <button
              key={letter}
              onClick={() => handleSelect(letter)}
              disabled={isAnswered}
              className="w-full text-left px-4 py-3 rounded-xl font-medium text-sm transition-all border-2 flex gap-3 items-start"
              style={{ background: bg, borderColor: border, color: textColor }}
            >
              <span className="font-bold flex-shrink-0">{letter}</span>
              <span>{text}</span>
            </button>
          );
        })}
      </div>

      {isAnswered && (
        <div
          className="rounded-xl p-4 text-sm leading-relaxed"
          style={
            selected === current.correct
              ? { background: '#dcfce7', color: '#15803d' }
              : { background: '#fee2e2', color: '#dc2626' }
          }
        >
          {selected === current.correct ? '✓ Rätt! ' : `✗ Rätt svar: Alternativ ${current.correct}. `}
          {current.explanation}
        </div>
      )}

      {isAnswered && (
        <button
          onClick={handleNext}
          className="w-full text-white font-bold py-3 rounded-2xl text-sm"
          style={{ background: PRIMARY }}
        >
          {idx + 1 >= total ? 'Se resultat' : 'Nästa →'}
        </button>
      )}
    </div>
  );
}

function ScenarioView() {
  const total = scenarioData.length;
  const [items, setItems] = useState(() => shuffleArray([...scenarioData]));
  const [idx, setIdx] = useState(0);
  const [options, setOptions] = useState(() => makeOptions(items[0], scenarioData));
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [phase, setPhase] = useState('playing');

  const current = items[idx];
  const isAnswered = selected !== null;

  const handleSelect = (opt) => {
    if (isAnswered) return;
    setSelected(opt);
    if (opt.id === current.id) setScore(s => s + 1);
  };

  const handleNext = () => {
    const nextIdx = idx + 1;
    if (nextIdx >= total) {
      setPhase('done');
    } else {
      setOptions(makeOptions(items[nextIdx], scenarioData));
      setIdx(nextIdx);
      setSelected(null);
    }
  };

  const restart = () => {
    const newItems = shuffleArray([...scenarioData]);
    setItems(newItems);
    setIdx(0);
    setOptions(makeOptions(newItems[0], scenarioData));
    setSelected(null);
    setScore(0);
    setPhase('playing');
  };

  if (phase === 'done') return (
    <div className="flex flex-col items-center gap-6">
      <div className="rounded-3xl p-8 text-center w-full max-w-sm" style={{ background: PRIMARY_LIGHT, border: `2px solid ${PRIMARY}` }}>
        <div className="text-5xl mb-4">🎯</div>
        <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
        <p className="text-slate-500 text-sm mb-6">
          {score === total
            ? 'Perfekt! Du kopplar ihop alla situationer rätt.'
            : score >= Math.round(total * 0.8)
            ? 'Bra jobbat! Öva lite till på de du missat.'
            : 'Fortsätt öva – du lär dig!'}
        </p>
        <button onClick={restart} className="text-white font-bold px-8 py-3 rounded-2xl" style={{ background: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  return (
    <div className="flex flex-col gap-4 max-w-2xl mx-auto">
      <div className="flex items-center justify-between">
        <span className="text-xs text-slate-400 font-medium">{idx + 1} av {total}</span>
        <span className="text-xs font-bold px-3 py-1 rounded-full" style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}>
          {score} rätt
        </span>
      </div>
      <div className="w-full bg-slate-200 rounded-full h-1.5 mb-1">
        <div className="h-1.5 rounded-full transition-all" style={{ width: `${(idx / total) * 100}%`, background: PRIMARY }} />
      </div>

      <div className="bg-white rounded-2xl shadow-sm p-5 border-l-4" style={{ borderLeftColor: PRIMARY }}>
        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">Vilket begrepp beskrivs?</p>
        <p className="text-slate-800 text-base leading-relaxed">{current.scenario}</p>
      </div>

      <div className="flex flex-col gap-3">
        {options.map(opt => {
          const isCorrect = opt.id === current.id;
          const isSelected = selected && selected.id === opt.id;
          let bg = '#ffffff', border = '#e2e8f0', textColor = '#1e293b';
          if (isAnswered) {
            if (isCorrect) { bg = '#dcfce7'; border = '#16a34a'; textColor = '#15803d'; }
            else if (isSelected) { bg = '#fee2e2'; border = '#dc2626'; textColor = '#dc2626'; }
          }
          return (
            <button
              key={opt.id}
              onClick={() => handleSelect(opt)}
              disabled={isAnswered}
              className="w-full text-left px-4 py-3 rounded-xl font-semibold text-sm transition-all border-2"
              style={{ background: bg, borderColor: border, color: textColor }}
            >
              {opt.term}
            </button>
          );
        })}
      </div>

      {isAnswered && (
        <div
          className="rounded-xl p-4 text-sm leading-relaxed"
          style={
            selected.id === current.id
              ? { background: '#dcfce7', color: '#15803d' }
              : { background: '#fee2e2', color: '#dc2626' }

          {selected.id === current.id ? '✓ Rätt! ' : `✗ Rätt svar: ${current.term}. `}
          {current.definition}
        </div>
      )}

      {isAnswered && (
        <button
          onClick={handleNext}
          className="w-full text-white font-bold py-3 rounded-2xl text-sm"
          style={{ background: PRIMARY }}
        >
          {idx + 1 >= total ? 'Se resultat' : 'Nästa →'}
        </button>
      )}
    </div>
  );
}

function LucktextView() {
  const normalize = (s) => s.trim().toLowerCase();
  const initStates = () => lucktextData.map(() => ({ value: '', status: 'unanswered', attempts: 0 }));

  const [states, setStates] = useState(initStates);
  const [struckTerms, setStruckTerms] = useState(new Set());

  const finished = states.every(s => s.status === 'correct' || s.status === 'revealed');
  const correctCount = states.filter(s => s.status === 'correct').length;

  const handleInput = (idx, val) => {
    setStates(prev => {
      const next = [...prev];
      next[idx] = { ...next[idx], value: val };
      return next;
    });
  };

  const check = (idx) => {
    const item = lucktextData[idx];
    const state = states[idx];
    if (state.status === 'correct' || state.status === 'revealed') return;
    setStates(prev => {
      const next = [...prev];
      if (normalize(state.value) === normalize(item.term)) {
        next[idx] = { ...state, status: 'correct' };
        setStruckTerms(s => new Set([...s, item.term]));
      } else if (state.attempts === 0) {
        next[idx] = { ...state, status: 'warning', attempts: 1 };
      } else {
        next[idx] = { ...state, status: 'wrong', attempts: state.attempts + 1 };
      }
      return next;
    });
  };

  const correctAll = () => {
    setStates(prev => prev.map((state, idx) => {
      if (state.status === 'correct') return state;
      return { ...state, status: 'revealed', value: lucktextData[idx].term };
    }));
    setStruckTerms(new Set(lucktextData.map(d => d.term)));
  };

  const restart = () => {
    setStates(initStates());
    setStruckTerms(new Set());
  };

  const borderColor = (status) => {
    if (status === 'correct') return '#16a34a';
    if (status === 'revealed' || status === 'wrong') return '#dc2626';
    if (status === 'warning') return '#f97316';
    return '#e2e8f0';
  };

  return (
    <div className="max-w-2xl mx-auto">
      <div className="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-sm">
        <p className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-3">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {lucktextData.map(item => (
            <span
              key={item.id}
              className="px-2 py-1 rounded-lg text-sm font-medium transition-all"
              style={
                struckTerms.has(item.term)
                  ? { background: '#f0fdf4', color: '#86efac', textDecoration: 'line-through' }
                  : { background: '#f0fdfa', color: '#0d9488' }
              }
            >
              {item.term}
            </span>
          ))}
        </div>
      </div>

      <div className="flex flex-col gap-4 mb-6">
        {lucktextData.map((item, idx) => {
          const state = states[idx];
          const parts = item.sentence.split('_____');
          const inputWidth = Math.max(item.term.length * 9, 130);

          return (
            <div
              key={item.id}
              className="bg-white rounded-xl shadow-sm p-4"
              style={{ border: `1.5px solid ${borderColor(state.status)}` }}
            >
              <p className="text-slate-700 text-sm leading-relaxed mb-2 flex flex-wrap items-baseline gap-x-1">
                <span>{parts[0]}</span>
                <input
                  type="text"
                  value={state.value}
                  onChange={e => handleInput(idx, e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && check(idx)}
                  disabled={state.status === 'correct' || state.status === 'revealed'}
                  placeholder="skriv begrepp…"
                  className="border-b-2 bg-transparent outline-none px-1 text-sm font-semibold"
                  style={{
                    width: inputWidth + 'px',
                    maxWidth: '100%',
                    borderBottomColor: borderColor(state.status) === '#e2e8f0' ? PRIMARY : borderColor(state.status),
                    color: state.status === 'correct' ? '#16a34a' : state.status === 'revealed' ? '#dc2626' : '#1e293b',
                  }}
                />
                <span>{parts[1]}</span>
              </p>

              {state.status === 'warning' && (
                <p className="text-orange-500 text-xs font-medium mt-1">Är du säker att du stavat rätt?</p>
              )}
              {state.status === 'wrong' && (
                <p className="text-red-500 text-xs font-medium mt-1">Fel svar — prova igen eller tryck "Rätta alla".</p>
              )}
              {(state.status === 'correct' || state.status === 'revealed') && (
                <div
                  className="mt-2 text-xs rounded-lg p-2 leading-relaxed"
                  style={{
                    background: state.status === 'correct' ? '#dcfce7' : '#fee2e2',
                    color: state.status === 'correct' ? '#15803d' : '#dc2626',
                  }}
                >
                  {state.status === 'correct' ? '✓ Rätt! ' : `✗ Rätt svar: ${item.term}. `}
                  {item.definition}
                </div>
              )}

              {state.status !== 'correct' && state.status !== 'revealed' && (
                <button
                  onClick={() => check(idx)}
                  className="mt-2 text-xs font-bold px-3 py-1 rounded-lg text-white"
                  style={{ background: PRIMARY }}
                >
                  Kontrollera
                </button>
              )}
            </div>
          );
        })}
      </div>

      {finished && (
        <div className="rounded-2xl p-6 text-center mb-4 border-2" style={{ background: '#f0fdfa', borderColor: PRIMARY }}>
          <p className="text-2xl font-bold mb-1" style={{ color: '#0d9488' }}>
            {correctCount} / {lucktextData.length} rätt
          </p>
          <p className="text-slate-500 text-sm">
            {correctCount === lucktextData.length
              ? '🎉 Perfekt! Du kan alla begrepp!'
              : correctCount >= Math.round(lucktextData.length * 0.8)
              ? '👍 Bra jobbat! Öva lite till på de du missat.'
              : '📚 Fortsätt öva – du är på rätt spår!'}
          </p>
        </div>
      )}

      <div className="flex gap-3 mb-6">
        {!finished && (
          <button onClick={correctAll} className="flex-1 bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-sm hover:bg-slate-300 transition-colors">
            Rätta alla
          </button>
        )}
        <button
          onClick={restart}
          className="flex-1 text-white font-bold py-2 rounded-xl text-sm transition-colors"
          style={{ background: PRIMARY }}
        >
          Börja om
        </button>
      </div>
    </div>
  );
}

function BackButton() {
  const goBack = () => {
    const ref = document.referrer;
    if (ref && ref.indexOf(window.location.host) !== -1) {
      history.back();
    } else {
      window.location.href = "index.html";
    }
  };
  return (
    <button
      onClick={goBack}
      className="text-slate-500 hover:text-teal-600 transition-colors text-sm font-medium"
    >
      ← Tillbaka till startsidan
    </button>
  );
}

function ToggleRow({ active, onChange }) {
  const views = ["Lista", "Flashcards", "Lucktext", "Scenario", "Icke-ex."];
  const enabled = ["Lista", "Flashcards", "Lucktext", "Scenario", "Icke-ex."];
  return (
    <div className="flex justify-center mb-8">
      <div className="bg-white rounded-full shadow-sm border border-slate-200 p-1 inline-flex flex-wrap justify-center gap-1">
        {views.map((v) => {
          const isEnabled = enabled.includes(v);
          const isActive = v === active;
          return (
            <button
              key={v}
              disabled={!isEnabled}
              onClick={() => isEnabled && onChange(v)}
              className={
                isActive
                  ? "px-4 py-2 rounded-full font-semibold text-white text-sm"
                  : isEnabled
                  ? "px-4 py-2 rounded-full font-semibold text-slate-500 text-sm hover:text-slate-700"
                  : "px-4 py-2 rounded-full font-semibold text-slate-400 text-sm cursor-default"
              }
              style={isActive ? { background: PRIMARY } : {}}
            >
              {v}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ListView() {
  return (
    <div className="flex flex-col gap-4 max-w-2xl mx-auto">
      {concepts.map((c, i) => (
        <div
          key={c.term}
          className="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow p-5 border-l-8"
          style={{ borderLeftColor: "#0d9488" }}
        >
          <div className="flex items-start gap-4">
            <span
              className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm"
              style={{ background: "#f0fdfa", color: "#0d9488" }}
            >
              {i + 1}
            </span>
            <div>
              <p className="font-bold text-slate-800 text-lg">{c.term}</p>
              <p className="text-slate-500 mt-1">{c.definition}</p>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function FlashcardView() {
  const total = concepts.length;
  const [deck, setDeck] = useState(() => shuffleArray([...concepts]));
  const [deckIdx, setDeckIdx] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

  const restartAll = () => {
    setDeck(shuffleArray([...concepts]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray([...kudeInte]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>Börja om med alla</button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back" style={{ border: `2px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("Lista");
  return (
    <div className="max-w-4xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between mb-6">
        <BackButton />
        <h1 className="text-2xl font-bold italic text-slate-800 text-center flex-1 -ml-[140px] tracking-wide">
          BLOCK 3 · JURIDIK NIVÅ 1 · BEGREPP
        </h1>
        <div style={{ width: "140px" }}></div>
      </div>

      <ToggleRow active={view} onChange={setView} />

      {view === "Lista" && <ListView />}
      {view === "Flashcards" && <FlashcardView />}
      {view === "Lucktext" && <LucktextView />}
      {view === "Scenario" && <ScenarioView />}
      {view === "Icke-ex." && <NonExampleView />}

      <footer className="text-center mt-12 mb-4">
        <p className="italic text-slate-400 text-sm">Källa: Juridik nivå 1 begreppslista – Block 3</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
