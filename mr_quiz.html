<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mänskliga rättigheter – Quiz | Samhällskunskap nivå 1a1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:       #d97706;
      --primary-light: #fef9c3;
      --primary-dark:  #b45309;
      --correct-bg:    #dcfce7;
      --correct-border:#16a34a;
      --correct-text:  #16a34a;
      --wrong-bg:      #fee2e2;
      --wrong-border:  #dc2626;
      --wrong-text:    #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'EB Garamond', Georgia, serif; background: #fffbeb; min-height: 100vh; color: #1e293b; }

    a.back-btn {
      display: inline-block; padding: 8px 16px; color: var(--primary);
      text-decoration: none; font-size: 0.95rem; position: fixed;
      top: 14px; left: 14px; z-index: 200; border-radius: 8px; transition: background 0.2s;
    }
    a.back-btn:hover { background: var(--primary-light); }

    /* Språkväljare: Svenska / 📖 Enkel svenska / العربية – samma stil som tidigare Enkel svenska-toggle */
    .lang-switch {
      position: fixed; top: 14px; right: 14px; z-index: 200;
      display: flex; gap: 2px; background: white; border: 2px solid #16a34a;
      border-radius: 999px; padding: 2px; direction: ltr;
    }
    .easy-toggle {
      background: transparent; border: none; color: #16a34a;
      padding: 5px 14px; border-radius: 999px; font-family: inherit;
      font-size: 0.88rem; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .easy-toggle:hover { background: #dcfce7; }
    .easy-toggle[aria-pressed="true"] { background: #16a34a; color: white; }
    .easy-toggle[aria-pressed="true"]:hover { background: #15803d; }
    .easy-toggle[lang="ar"] { font-size: 0.95rem; line-height: 1.3; }

    /* ── Arabiska (RTL) ── */
    [lang="ar"] {
      font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', 'Segoe UI', Tahoma, 'Arial', serif;
      line-height: 1.85;
    }
    bdi[lang="sv"] { font-family: 'EB Garamond', Georgia, serif; unicode-bidi: isolate; }
    .q-text[lang="ar"]     { font-size: 1.22rem; line-height: 1.95; }
    .opt-btn[lang="ar"]    { line-height: 1.8; }
    .modal-expl[lang="ar"] { line-height: 2; }
    .sv-peek-wrap { margin: -12px 0 18px; }
    .sv-peek {
      background: white; border: 1px solid #cbd5e1; border-radius: 999px;
      padding: 3px 12px; font-family: 'EB Garamond', Georgia, serif; font-size: 0.85rem;
      color: #475569; cursor: pointer;
    }
    .sv-peek:hover { border-color: #16a34a; color: #16a34a; }
    .sv-orig {
      margin-top: 8px; background: #f8fafc; border-left: 3px solid #16a34a;
      border-radius: 6px; padding: 8px 12px; font-size: 1rem; color: #334155; line-height: 1.5;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Start screen ── */
    #screen-start { max-width: 560px; margin: 0 auto; padding: 90px 24px 40px; text-align: center; }
    .badge {
      display: inline-block; background: var(--primary-light); color: var(--primary);
      padding: 4px 14px; border-radius: 20px; font-size: 0.82rem;
      letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 20px;
    }
    #screen-start h1 {
      font-size: 2.4rem; font-weight: 600; font-style: italic;
      color: #0f172a; margin-bottom: 8px;
    }
    #screen-start .subtitle { font-size: 1.05rem; color: #64748b; margin-bottom: 32px; }
    .info-cards { display: flex; gap: 12px; justify-content: center; margin-bottom: 36px; flex-wrap: wrap; }
    .info-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 16px 20px; text-align: center; flex: 1; min-width: 100px; max-width: 140px;
    }
    .info-card .num { font-size: 1.7rem; font-weight: 600; color: var(--primary); }
    .info-card .lbl { font-size: 0.78rem; color: #94a3b8; margin-top: 2px; }

    /* ── Quiz screen ── */
    #screen-quiz { max-width: 700px; margin: 0 auto; padding: 70px 20px 60px; }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .timer {
      background: white; border: 1px solid #e2e8f0; border-radius: 20px;
      padding: 5px 14px; font-size: 0.92rem; color: #475569; font-variant-numeric: tabular-nums;
    }
    .score-pill {
      background: var(--primary-light); color: var(--primary-dark);
      border-radius: 20px; padding: 5px 14px; font-size: 0.92rem; font-weight: 600;
    }
    .progress-wrap { background: #e2e8f0; border-radius: 4px; height: 6px; overflow: hidden; margin-bottom: 6px; }
    .progress-bar { background: var(--primary); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .q-counter { font-size: 0.82rem; color: #94a3b8; text-align: right; margin-bottom: 22px; }
    .q-text { font-size: 1.25rem; font-weight: 600; line-height: 1.55; color: #0f172a; margin-bottom: 22px; }
    .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .opt-btn {
      background: white; border: 2px solid #e2e8f0; border-radius: 12px;
      padding: 13px 18px; text-align: start; font-size: 1rem; font-family: inherit;
      cursor: pointer; transition: border-color 0.15s, background 0.15s; line-height: 1.45;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); font-weight: 600; }
    .opt-btn.wrong   { background: var(--wrong-bg);   border-color: var(--wrong-border);   color: var(--wrong-text); }
    .opt-btn.dimmed  { opacity: 0.4; }
    .nav-row { display: flex; gap: 12px; align-items: center; }
    .btn-back {
      background: white; border: 2px solid #e2e8f0; border-radius: 10px;
      padding: 10px 20px; font-family: inherit; font-size: 0.9rem; color: #64748b; cursor: pointer;
    }
    .btn-back:hover { border-color: #94a3b8; }
    .btn-next {
      background: var(--primary); border: none; border-radius: 10px;
      padding: 10px 28px; font-family: inherit; font-size: 0.9rem; font-weight: 600;
      color: white; cursor: pointer; margin-inline-start: auto; transition: background 0.15s;
    }
    .btn-next:hover { background: var(--primary-dark); }

    /* ── Modal ── */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; padding: 20px;
    }
    #modal-overlay.hidden { display: none; }
    .modal-box {
      background: white; border-radius: 20px; padding: 32px;
      max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-icon  { font-size: 2.6rem; margin-bottom: 10px; }
    .modal-verdict { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; }
    .modal-verdict.c { color: var(--correct-text); }
    .modal-verdict.w { color: var(--wrong-text); }
    .modal-expl { font-size: 0.98rem; color: #475569; line-height: 1.7; margin-bottom: 24px; }

    /* ── Result screen ── */
    #screen-result { max-width: 700px; margin: 0 auto; padding: 80px 20px 80px; }
    .res-header { text-align: center; margin-bottom: 30px; }
    .score-ring {
      width: 120px; height: 120px; border-radius: 50%;
      border: 5px solid var(--primary); display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin: 0 auto 18px;
    }
    .score-ring .rnum { font-size: 2rem; font-weight: 600; color: var(--primary); line-height: 1; }
    .score-ring .rlbl { font-size: 0.72rem; color: #94a3b8; }
    .res-title  { font-size: 1.8rem; font-weight: 600; font-style: italic; margin-bottom: 6px; }
    .res-msg    { font-size: 1rem; color: #64748b; margin-bottom: 4px; }
    .res-time   { font-size: 0.85rem; color: #94a3b8; margin-bottom: 28px; }
    .stats-row  { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-box {
      flex: 1; min-width: 80px; background: white; border: 1px solid #e2e8f0;
      border-radius: 12px; padding: 14px; text-align: center;
    }
    .stat-box .snum { font-size: 1.6rem; font-weight: 600; }
    .stat-box .slbl { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
    .stat-box.cs .snum { color: var(--correct-text); }
    .stat-box.ws .snum { color: var(--wrong-text); }
    .section-hd {
      font-size: 1.05rem; font-weight: 600; color: #0f172a;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0;
    }
    .missed-section { margin-bottom: 32px; }
    .missed-item {
      background: var(--wrong-bg); border-inline-start: 4px solid var(--wrong-border);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.92rem;
    }
    .facit-item {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .facit-item.fc { border-inline-start: 4px solid var(--correct-border); }
    .facit-item.fw { border-inline-start: 4px solid var(--wrong-border); }
    .fi-num { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .fi-q   { font-size: 0.93rem; font-weight: 600; color: #0f172a; margin-bottom: 8px; line-height: 1.4; }
    .fi-row { font-size: 0.88rem; padding: 2px 0; }
    .fi-row .lbl { color: #94a3b8; }
    .fi-row.ya-ok  { color: var(--correct-text); }
    .fi-row.ya-bad { color: var(--wrong-text); }
    .fi-row.ra     { color: var(--correct-text); font-weight: 600; margin-top: 2px; }

    .btn-primary {
      display: inline-block; background: var(--primary); color: white; border: none;
      border-radius: 12px; padding: 13px 36px; font-size: 1.05rem; font-family: inherit;
      font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: none; }

    @media (max-width: 768px) {
      a.back-btn { top: 10px; left: 8px; padding: 6px 10px; font-size: 0.88rem; }
      .lang-switch { top: 10px; right: 8px; }
      .easy-toggle { padding: 5px 10px; font-size: 0.8rem; }
      #screen-quiz, #screen-result { padding-left: 16px; padding-right: 16px; }
      .modal-box { padding: 24px 20px; max-height: 90vh; overflow-y: auto; }
    }
    /* Smal skärm: språkväljaren flyttas till en egen rad under tillbaka-länken */
    @media (max-width: 640px) {
      .lang-switch { top: 46px; left: 50%; right: auto; transform: translateX(-50%); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
      #screen-start  { padding-top: 110px; }
      #screen-quiz   { padding-top: 100px; }
      #screen-result { padding-top: 110px; }
    }
    @media (max-width: 500px) {
      #screen-start h1 { font-size: 1.85rem; }
      .q-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<a href="politik.html" class="back-btn" id="back-link">← Tillbaka</a>
<div class="lang-switch" role="group" aria-label="Språk">
  <button class="easy-toggle" type="button" data-mode="sv"   aria-pressed="true"  onclick="setMode('sv')">Svenska</button>
  <button class="easy-toggle" type="button" data-mode="easy" aria-pressed="false" onclick="setMode('easy')" id="btn-easy">📖 Enkel svenska</button>
  <button class="easy-toggle" type="button" data-mode="ar"   aria-pressed="false" onclick="setMode('ar')" lang="ar" dir="rtl">العربية</button>
</div>

<!-- ═══════════ START ═══════════ -->
<div id="screen-start" class="screen active">
  <div class="badge" id="start-badge">Samhällskunskap nivå 1a1 · Politik</div>
  <h1 id="start-title">⚖️ Mänskliga rättigheter</h1>
  <p class="subtitle" id="start-sub">30 frågor om rättigheters historia, FN, Europarådet och kränkningar</p>
  <div class="info-cards">
    <div class="info-card"><div class="num">30</div><div class="lbl" id="lbl-questions">Frågor</div></div>
    <div class="info-card"><div class="num">4</div><div class="lbl" id="lbl-options">Alternativ</div></div>
    <div class="info-card"><div class="num">⏱</div><div class="lbl" id="lbl-timer">Timer</div></div>
  </div>
  <button class="btn-primary" id="btn-start" onclick="startQuiz()">Starta Quiz →</button>
</div>

<!-- ═══════════ QUIZ ═══════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <div class="timer" id="timer">⏱ 0:00</div>
    <div class="score-pill" id="score-pill">Poäng: 0</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
  <div class="q-counter" id="q-counter">Fråga 1 av 30</div>
  <div class="q-text" id="q-text"></div>
  <div class="sv-peek-wrap" id="sv-peek-wrap" style="display:none">
    <button class="sv-peek" id="sv-peek" type="button" lang="sv" aria-expanded="false" aria-controls="sv-orig" onclick="toggleSvPeek()">Visa svenska ▾</button>
    <div class="sv-orig" id="sv-orig" lang="sv" dir="ltr" hidden></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="nav-row">
    <button class="btn-back" id="btn-back" onclick="goBack()" style="display:none">← Bakåt</button>
    <button class="btn-next" id="btn-next" onclick="goNext()" style="display:none">Nästa →</button>
  </div>
</div>

<!-- ═══════════ MODAL ═══════════ -->
<div id="modal-overlay" class="hidden">
  <div class="modal-box" id="modal-box">
    <div class="modal-icon"    id="modal-icon"></div>
    <div class="modal-verdict" id="modal-verdict"></div>
    <div class="modal-expl"    id="modal-expl"></div>
    <button class="btn-primary" id="modal-next" onclick="closeModal()">Nästa fråga →</button>
  </div>
</div>

<!-- ═══════════ RESULT ═══════════ -->
<div id="screen-result" class="screen">
  <div class="res-header">
    <div class="score-ring">
      <div class="rnum" id="r-score"></div>
      <div class="rlbl" id="r-ringlbl">poäng</div>
    </div>
    <div class="res-title" id="r-title"></div>
    <div class="res-msg"   id="r-msg"></div>
    <div class="res-time"  id="r-time"></div>
  </div>
  <div class="stats-row">
    <div class="stat-box cs"><div class="snum" id="s-correct">0</div><div class="slbl" id="l-correct">Rätt</div></div>
    <div class="stat-box ws"><div class="snum" id="s-wrong">0</div><div class="slbl" id="l-wrong">Fel</div></div>
    <div class="stat-box"><div class="snum" id="s-pct">0%</div><div class="slbl" id="l-pct">Andel rätt</div></div>
  </div>
  <div class="missed-section" id="missed-section"></div>
  <div class="section-hd" id="facit-hd">Fullständigt facit</div>
  <div id="facit-list"></div>
  <div style="text-align:center;margin-top:32px">
    <button class="btn-primary" id="btn-restart" onclick="restartQuiz()">↺ Gör om quizet</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    q: 'Vad menas med att mänskliga rättigheter är universella?',
    opts: [
      'De gäller alla människor, överallt och i alla tider, oavsett kultur, religion eller landets lagar',
      'De gäller bara medborgare i demokratiska stater',
      'De gäller bara FN:s 193 medlemsländer',
      'De gäller bara vuxna personer som är myndiga'
    ],
    correct: 'De gäller alla människor, överallt och i alla tider, oavsett kultur, religion eller landets lagar',
    expl: 'Universalitet är en grundprincip för mänskliga rättigheter – de gäller alla människor bara för att de är människor, oavsett nationalitet, religion, kön eller politisk åsikt.',
    qEnkel: 'Mänskliga rättigheter är universella. Vad betyder det?',
    optsEnkel: [
      'De gäller alla människor, i alla länder och i alla tider',
      'De gäller bara de som är medborgare i en demokrati',
      'De gäller bara i de 193 länder som är med i FN',
      'De gäller bara vuxna, alltså de som är myndiga'
    ],
    expEnkel: 'Universell betyder att något gäller alla. Mänskliga rättigheter gäller alla människor. Det spelar ingen roll vilket land du kommer från. Det spelar heller ingen roll vilken religion, vilket kön eller vilka åsikter du har.',
    qAr: 'حقوق الإنسان (mänskliga rättigheter) عالمية (universella). ماذا يعني ذلك؟',
    optsAr: [
      'تنطبق على جميع البشر، في كل البلدان وفي كل العصور',
      'تنطبق فقط على من هم مواطنون في دولة ديمقراطية',
      'تنطبق فقط في الدول الأعضاء في الأمم المتحدة وعددها 193',
      'تنطبق فقط على البالغين، أي من بلغوا سن الرشد'
    ],
    expAr: 'كلمة «عالمي» (universell) تعني أن الشيء ينطبق على الجميع. حقوق الإنسان (mänskliga rättigheter) تنطبق على جميع البشر. لا يهم من أي بلد أتيت. ولا يهم أيضاً ما هو دينك أو جنسك أو آراؤك.'
  },
  {
    q: 'I vilka tre huvudkategorier brukar mänskliga rättigheter delas in?',
    opts: [
      'Personliga, politiska samt ekonomiska, sociala och kulturella rättigheter',
      'Civila, militära och religiösa rättigheter',
      'Nationella, regionala och lokala rättigheter',
      'Barnens, kvinnornas och äldres rättigheter'
    ],
    correct: 'Personliga, politiska samt ekonomiska, sociala och kulturella rättigheter',
    expl: 'Mänskliga rättigheter brukar delas in i tre kategorier: personliga rättigheter (t.ex. rätt till liv), politiska rättigheter (t.ex. rösträtt) samt ekonomiska, sociala och kulturella rättigheter (t.ex. rätt till utbildning och arbete).',
    qEnkel: 'Mänskliga rättigheter delas ofta in i tre grupper. Vilka är de?',
    optsEnkel: [
      'Personliga, politiska samt ekonomiska, sociala och kulturella rättigheter',
      'Civila, militära och religiösa rättigheter för alla människor',
      'Nationella, regionala och lokala rättigheter i varje land',
      'Barnens rättigheter, kvinnornas rättigheter och de äldres rättigheter'
    ],
    expEnkel: 'Det finns tre grupper. Personliga rättigheter, till exempel rätten att leva. Politiska rättigheter, till exempel rätten att rösta. Ekonomiska, sociala och kulturella rättigheter, till exempel rätten att gå i skolan och att arbeta.',
    qAr: 'تُقسَّم حقوق الإنسان (mänskliga rättigheter) غالباً إلى ثلاث مجموعات. ما هي؟',
    optsAr: [
      'الحقوق الشخصية والسياسية، والحقوق الاقتصادية والاجتماعية والثقافية',
      'الحقوق المدنية والحقوق العسكرية والحقوق الدينية لجميع البشر',
      'الحقوق الوطنية والحقوق الإقليمية والحقوق المحلية في كل بلد',
      'حقوق الأطفال وحقوق النساء وحقوق كبار السن في المجتمع'
    ],
    expAr: 'هناك ثلاث مجموعات. الحقوق الشخصية (personliga rättigheter)، مثل الحق في الحياة. الحقوق السياسية (politiska rättigheter)، مثل الحق في التصويت. الحقوق الاقتصادية والاجتماعية والثقافية (ekonomiska, sociala och kulturella rättigheter)، مثل الحق في الذهاب إلى المدرسة والحق في العمل.'
  },
  {
    q: 'Vilken 1600-talsfilosof formulerade idén om att alla människor föds med naturliga rättigheter till liv, frihet och egendom?',
    opts: [
      'John Locke',
      'Thomas Hobbes',
      'Jean-Jacques Rousseau',
      'Immanuel Kant'
    ],
    correct: 'John Locke',
    expl: 'John Locke var en brittisk filosof som hävdade att alla människor föds med naturliga rättigheter: rätt till liv, frihet och egendom. Hans idéer lade grunden för moderna mänskliga rättigheter och påverkade bland annat den amerikanska självständighetsförklaringen.',
    qEnkel: 'En filosof på 1600-talet sa att alla föds med naturliga rättigheter: rätt till liv, frihet och egendom. Vem var det?',
    optsEnkel: [
      'John Locke',
      'Thomas Hobbes',
      'Jean-Jacques Rousseau',
      'Immanuel Kant'
    ],
    expEnkel: 'John Locke var en filosof från England. Han sa att alla människor föds med rätt till liv, frihet och egendom (saker man äger). Hans idéer blev en grund för dagens mänskliga rättigheter. De påverkade också USA:s självständighetsförklaring.',
    qAr: 'قال فيلسوف في القرن السابع عشر إن كل البشر يولدون ولهم حقوق طبيعية (naturliga rättigheter): الحق في الحياة والحرية والملكية. من هو؟',
    optsAr: [
      'جون لوك (John Locke)',

// Blandning sker på INDEX: order[] = visad plats → index i q.opts/q.optsEnkel/q.optsAr.
// chosen/correct är index i q.opts, så rättningen är oberoende av språkläge.

// ── Språkläge – lagring och texthjälpare ───────────────────
const MODES    = ['sv', 'easy', 'ar'];
const LANG_KEY = 'mr_quiz_sprak';
const OLD_EASY_KEY = 'mr_quiz_enkelsvenska'; // tidigare nyckel för Enkel svenska
let mode = 'sv';
try {
  const saved = sessionStorage.getItem(LANG_KEY);
  if (MODES.includes(saved)) mode = saved;
  else if (sessionStorage.getItem(OLD_EASY_KEY) === '1') mode = 'easy';
} catch (e) {}
const isAr = () => mode === 'ar';

const warned = new Set();
function warnMissing(q, field) {
  const key = QUESTIONS.indexOf(q) + ':' + field;
  if (warned.has(key)) return;
  warned.add(key);
  console.warn('Översättning saknas (' + field + ') för fråga: ' + q.q + ' – visar svenska.');
}
function ui(key, vars) {
  let s = UI[mode][key];
  if (s === undefined) { console.warn('UI-text saknas (' + mode + '): ' + key); s = UI.sv[key]; }
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{' + k + '}', vars[k]); });
  return s;
}

// Textväljare returnerar { text, ar } – ar=true betyder att texten är arabisk.
// Saknas arabiska visas Enkel svenska (eller originalet), med konsolvarning.
function qText(q) {
  if (mode === 'ar') { if (q.qAr) return { text: q.qAr, ar: true }; warnMissing(q, 'qAr'); }
  if (mode !== 'sv') { if (q.qEnkel) return { text: q.qEnkel, ar: false }; warnMissing(q, 'qEnkel'); }
  return { text: q.q, ar: false };
}
function optText(q, i) {
  if (mode === 'ar') {
    if (q.optsAr && q.optsAr.length === q.opts.length && q.optsAr[i]) return { text: q.optsAr[i], ar: true };
    warnMissing(q, 'optsAr');
  }
  if (mode !== 'sv') {
    if (q.optsEnkel && q.optsEnkel.length === q.opts.length && q.optsEnkel[i]) return { text: q.optsEnkel[i], ar: false };
    warnMissing(q, 'optsEnkel');
  }
  return { text: q.opts[i], ar: false };
}
function explText(q) {
  if (mode === 'ar') { if (q.expAr) return { text: q.expAr, ar: true }; warnMissing(q, 'expAr'); }
  if (mode !== 'sv') { if (q.expEnkel) return { text: q.expEnkel, ar: false }; warnMissing(q, 'expEnkel'); }
  return { text: q.expl, ar: false };
}

// Riktning: arabisk text får dir=rtl/lang=ar. Svensk reservtext i arabiskt läge
// får uttryckligen ltr/sv så att den inte ärver rtl från omgivande behållare.
function setDir(el, ar) {
  if (ar)               { el.setAttribute('dir', 'rtl'); el.setAttribute('lang', 'ar'); }
  else if (mode === 'ar') { el.setAttribute('dir', 'ltr'); el.setAttribute('lang', 'sv'); }
  else                  { el.removeAttribute('dir'); el.removeAttribute('lang'); }
}
// Latinska ord i arabisk text (svenska termer, namn) isoleras med <bdi> så att
// parenteser och skiljetecken hamnar rätt.
const LATIN_RUN = /[A-Za-zÀ-ÖØ-öø-ÿ](?:[A-Za-zÀ-ÖØ-öø-ÿ0-9 .,:'’\-]*[A-Za-zÀ-ÖØ-öø-ÿ0-9])?/g;
function appendText(el, text, ar) {
  if (!ar) { el.appendChild(document.createTextNode(text)); return; }
  let last = 0;
  text.replace(LATIN_RUN, (m, off) => {
    if (off > last) el.appendChild(document.createTextNode(text.slice(last, off)));
    const b = document.createElement('bdi');
    b.lang = 'sv'; b.dir = 'ltr'; b.textContent = m;
    el.appendChild(b);
    last = off + m.length;
    return m;
  });
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}
function setText(el, text, ar) {
  el.textContent = '';
  setDir(el, ar);
  appendText(el, text, ar);
}
function setUi(el, key, vars) { setText(el, ui(key, vars), isAr()); }
const $ = id => document.getElementById(id);

function updateModeButtons() {
  document.querySelectorAll('.lang-switch [data-mode]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false'));
}

}

// Byter bara texten – poäng, timer, aktuell fråga, svar och blandning rörs inte.
function setMode(m) {
  if (!MODES.includes(m) || m === mode) return;
  mode = m;
  try { sessionStorage.setItem(LANG_KEY, mode); } catch (e) {}
  updateModeButtons();

function toggleSvPeek() {

function renderSvPeek() {
  const wrap = $('sv-peek-wrap');
  if (!isAr() || !shuffled.length) { wrap.style.display = 'none'; return; }
  const q = shuffled[cur];
  wrap.style.display = 'block';
  const btn = $('sv-peek');
  btn.textContent = svPeekOpen ? 'Dölj svenska ▴' : 'Visa svenska ▾';
  btn.setAttribute('aria-expanded', svPeekOpen ? 'true' : 'false');
  $('sv-orig').textContent = q.qEnkel || q.q;
  $('sv-orig').hidden = !svPeekOpen;
}

// ── Helpers ────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

// ── Start ──────────────────────────────────────────────────
function startQuiz() {
  shuffled = shuffle(QUESTIONS);
  states   = shuffled.map(q => ({
    order:    shuffle(q.opts.map((_, i) => i)),
    chosen:   null,
    correct:  q.opts.indexOf(q.correct),
    answered: false
  }));
  cur   = 0;
  score = 0;
  modalOpen = false;
  svPeekOpen = false;
  clearInterval(timerInterval);
  startTime = Date.now();
  $('timer').textContent = '⏱ 0:00';
  timerInterval = setInterval(() => {
    $('timer').textContent = '⏱ ' + fmtTime(Date.now() - startTime);
  }, 500);
  show('screen-quiz');
  renderQuestion();
}

// ── Render question ────────────────────────────────────────
function renderQuestion() {
  const q  = shuffled[cur];
  const st = states[cur];
  const n  = shuffled.length;

  setUi($('q-counter'), 'counter', { i: cur + 1, n: n });
  const qt = qText(q);
  setText($('q-text'), qt.text, qt.ar);
  $('progress-bar').style.width = ((cur / n) * 100) + '%';
  setUi($('score-pill'), 'score', { s: score });
  renderSvPeek();

  const container = $('opts');
  container.innerHTML = '';
  st.order.forEach(origIdx => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    const ot = optText(q, origIdx);
    setText(btn, ot.text, ot.ar);
    if (st.answered) {
      btn.disabled = true;
      if (origIdx === st.correct) {
        btn.classList.add('correct');
      } else if (origIdx === st.chosen) {
        btn.classList.add('wrong');
      } else {
        btn.classList.add('dimmed');
      }
    } else {
      btn.onclick = () => answerQuestion(origIdx);
    }
    container.appendChild(btn);
  });

  // Navigeringsraden vänds i arabiskt läge: Bakåt till höger, Nästa till vänster.
  const navRow = document.querySelector('.nav-row');
  if (isAr()) navRow.setAttribute('dir', 'rtl'); else navRow.removeAttribute('dir');
  const back = $('btn-back');
  const next = $('btn-next');
  setUi(back, 'backBtn');
  setUi(next, 'nextBtn');
  back.style.display = cur > 0 ? 'block' : 'none';
  next.style.display = st.answered ? 'block' : 'none';
}

// ── Answer ─────────────────────────────────────────────────
function answerQuestion(chosenIdx) {
  const st = states[cur];
  if (st.answered) return;

  const isCorrect = chosenIdx === st.correct;
  st.chosen   = chosenIdx;
  st.answered = true;
  if (isCorrect) score++;

  renderQuestion();

  const answeredAt = cur;
  setTimeout(() => {
    if (cur !== answeredAt || !$('screen-quiz').classList.contains('active')) return;
    modalOpen = true;
    renderModal();
    $('modal-overlay').classList.remove('hidden');
  }, 600);
}

function renderModal() {
  const st = states[cur];
  const isCorrect = st.chosen === st.correct;
  const verdict = $('modal-verdict');
  $('modal-icon').textContent = isCorrect ? '✅' : '❌';
  setUi(verdict, isCorrect ? 'verdictOk' : 'verdictBad');
  verdict.className = 'modal-verdict ' + (isCorrect ? 'c' : 'w');
  const et = explText(shuffled[cur]);
  setText($('modal-expl'), et.text, et.ar);
  setUi($('modal-next'), 'modalNextBtn');
}

// ── Modal close → next ─────────────────────────────────────
function closeModal() {
  $('modal-overlay').classList.add('hidden');
  modalOpen = false;
  goNext();
}

// ── Navigation ─────────────────────────────────────────────
function goNext() {
  $('modal-overlay').classList.add('hidden');
  modalOpen = false;
  if (cur < shuffled.length - 1) {
    cur++;
    renderQuestion();
  } else {
    endQuiz();
  }
}

function goBack() {
  if (cur > 0) {
    cur--;
    renderQuestion();
  }
}

// ── End quiz ───────────────────────────────────────────────
function endQuiz() {
  clearInterval(timerInterval);
  elapsedMs = Date.now() - startTime;
  show('screen-result');
  renderResult();
}

function renderResult() {
  const elapsed = fmtTime(elapsedMs);
  const n       = shuffled.length;
  const pct     = Math.round((score / n) * 100);

  $('r-score').textContent   = score + '/' + n;
  $('s-correct').textContent = score;
  $('s-wrong').textContent   = n - score;
  $('s-pct').textContent     = pct + '%';
  setUi($('r-time'), 'time', { t: elapsed });
  $('progress-bar').style.width = '100%';

  const grade = pct >= 90 ? 'res90' : pct >= 75 ? 'res75' : pct >= 60 ? 'res60' : 'resLow';
  const [title, msg] = ui(grade);
  setText($('r-title'), title, isAr());
  setText($('r-msg'),   msg,   isAr());

  // Missed questions
  const missedEl = $('missed-section');
  missedEl.innerHTML = '';
  const missedIdx = states.map((st, i) => i).filter(i => states[i].chosen !== states[i].correct);
  if (missedIdx.length > 0) {
    const hd = document.createElement('div');
    hd.className = 'section-hd';
    setText(hd, ui('missedHd') + ' (' + missedIdx.length + ')', isAr());
    missedEl.appendChild(hd);
    missedIdx.forEach(idx => {
      const item = document.createElement('div');
      item.className = 'missed-item';
      const qt = qText(shuffled[idx]);
      setDir(item, qt.ar);
      // Frågenumret isoleras så att "3." inte vänds i höger-till-vänster-text.
      const num = document.createElement('bdi');
      num.dir = 'ltr';
      num.textContent = (idx + 1) + '.';
      item.appendChild(num);
      item.appendChild(document.createTextNode(' '));
      appendText(item, qt.text, qt.ar);
      missedEl.appendChild(item);
    });
  }

  // Full facit
  setUi($('facit-hd'), 'facitHd');
  setUi($('btn-restart'), 'restartBtn');
  const facitEl = $('facit-list');
  facitEl.innerHTML = '';
  states.forEach((st, i) => {
    const q      = shuffled[i];
    const ok     = st.chosen === st.correct;
    const item   = document.createElement('div');
    item.className = 'facit-item ' + (ok ? 'fc' : 'fw');

    const num = document.createElement('div');
    num.className = 'fi-num';
    setUi(num, 'facitNum', { i: i + 1 });

    const qEl = document.createElement('div');
    qEl.className = 'fi-q';
    const qt = qText(q);
    setText(qEl, qt.text, qt.ar);

    const ya = document.createElement('div');
    ya.className = 'fi-row ' + (ok ? 'ya-ok' : 'ya-bad');
    const yaLbl = document.createElement('span');
    yaLbl.className = 'lbl';
    setUi(yaLbl, 'yourAnswerLbl');
    ya.appendChild(yaLbl);
    const yaTxt = document.createElement('span');
    if (st.chosen === null) setUi(yaTxt, 'notAnswered');
    else { const ot = optText(q, st.chosen); setText(yaTxt, ot.text, ot.ar); }
    ya.appendChild(yaTxt);
    ya.appendChild(document.createTextNode(ok ? ' ✓' : ' ✗'));

    item.appendChild(num);
    item.appendChild(qEl);
    item.appendChild(ya);

    if (!ok) {
      const ra = document.createElement('div');
      ra.className = 'fi-row ra';
      const raLbl = document.createElement('span');
      raLbl.className = 'lbl';
      setUi(raLbl, 'correctAnswerLbl');
      ra.appendChild(raLbl);
      const raTxt = document.createElement('span');
      const ct = optText(q, st.correct);
      setText(raTxt, ct.text, ct.ar);
      ra.appendChild(raTxt);
      item.appendChild(ra);
    }

    facitEl.appendChild(item);
  });
}

// ── Restart ────────────────────────────────────────────────
// Språkläget ligger kvar (sessionStorage), allt annat nollställs vid start.
function restartQuiz() {
  clearInterval(timerInterval);
  show('screen-start');
}
</script>
