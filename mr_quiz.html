<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mänskliga rättigheter – Quiz | Samhällskunskap nivå 1a1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:       #d97706;
      --primary-light: #fef9c3;
      --primary-dark:  #b45309;
      --correct-bg:    #dcfce7;
      --correct-border:#16a34a;
      --correct-text:  #16a34a;
      --wrong-bg:      #fee2e2;
      --wrong-border:  #dc2626;
      --wrong-text:    #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'EB Garamond', Georgia, serif; background: #fffbeb; min-height: 100vh; color: #1e293b; }

    a.back-btn {
      display: inline-block; padding: 8px 16px; color: var(--primary);
      text-decoration: none; font-size: 0.95rem; position: fixed;
      top: 14px; left: 14px; z-index: 200; border-radius: 8px; transition: background 0.2s;
    }
    a.back-btn:hover { background: var(--primary-light); }

    .easy-toggle {
      position: fixed; top: 14px; right: 14px; z-index: 200;
      background: white; border: 2px solid #16a34a; color: #16a34a;
      padding: 7px 16px; border-radius: 999px; font-family: inherit;
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .easy-toggle:hover { background: #dcfce7; }
    .easy-toggle[aria-pressed="true"] { background: #16a34a; color: white; }
    .easy-toggle[aria-pressed="true"]:hover { background: #15803d; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* ── Start screen ── */
    #screen-start { max-width: 560px; margin: 0 auto; padding: 90px 24px 40px; text-align: center; }
    .badge {
      display: inline-block; background: var(--primary-light); color: var(--primary);
      padding: 4px 14px; border-radius: 20px; font-size: 0.82rem;
      letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 20px;
    }
    #screen-start h1 {
      font-size: 2.4rem; font-weight: 600; font-style: italic;
      color: #0f172a; margin-bottom: 8px;
    }
    #screen-start .subtitle { font-size: 1.05rem; color: #64748b; margin-bottom: 32px; }
    .info-cards { display: flex; gap: 12px; justify-content: center; margin-bottom: 36px; flex-wrap: wrap; }
    .info-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 16px 20px; text-align: center; flex: 1; min-width: 100px; max-width: 140px;
    }
    .info-card .num { font-size: 1.7rem; font-weight: 600; color: var(--primary); }
    .info-card .lbl { font-size: 0.78rem; color: #94a3b8; margin-top: 2px; }

    /* ── Quiz screen ── */
    #screen-quiz { max-width: 700px; margin: 0 auto; padding: 70px 20px 60px; }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .timer {
      background: white; border: 1px solid #e2e8f0; border-radius: 20px;
      padding: 5px 14px; font-size: 0.92rem; color: #475569; font-variant-numeric: tabular-nums;
    }
    .score-pill {
      background: var(--primary-light); color: var(--primary-dark);
      border-radius: 20px; padding: 5px 14px; font-size: 0.92rem; font-weight: 600;
    }
    .progress-wrap { background: #e2e8f0; border-radius: 4px; height: 6px; overflow: hidden; margin-bottom: 6px; }
    .progress-bar { background: var(--primary); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .q-counter { font-size: 0.82rem; color: #94a3b8; text-align: right; margin-bottom: 22px; }
    .q-text { font-size: 1.25rem; font-weight: 600; line-height: 1.55; color: #0f172a; margin-bottom: 22px; }
    .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .opt-btn {
      background: white; border: 2px solid #e2e8f0; border-radius: 12px;
      padding: 13px 18px; text-align: left; font-size: 1rem; font-family: inherit;
      cursor: pointer; transition: border-color 0.15s, background 0.15s; line-height: 1.45;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
    .opt-btn:disabled { cursor: default; }
    .opt-btn.correct { background: var(--correct-bg); border-color: var(--correct-border); color: var(--correct-text); font-weight: 600; }
    .opt-btn.wrong   { background: var(--wrong-bg);   border-color: var(--wrong-border);   color: var(--wrong-text); }
    .opt-btn.dimmed  { opacity: 0.4; }
    .nav-row { display: flex; gap: 12px; align-items: center; }
    .btn-back {
      background: white; border: 2px solid #e2e8f0; border-radius: 10px;
      padding: 10px 20px; font-family: inherit; font-size: 0.9rem; color: #64748b; cursor: pointer;
    }
    .btn-back:hover { border-color: #94a3b8; }
    .btn-next {
      background: var(--primary); border: none; border-radius: 10px;
      padding: 10px 28px; font-family: inherit; font-size: 0.9rem; font-weight: 600;
      color: white; cursor: pointer; margin-left: auto; transition: background 0.15s;
    }
    .btn-next:hover { background: var(--primary-dark); }

    /* ── Modal ── */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; padding: 20px;
    }
    #modal-overlay.hidden { display: none; }
    .modal-box {
      background: white; border-radius: 20px; padding: 32px;
      max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal-icon  { font-size: 2.6rem; margin-bottom: 10px; }
    .modal-verdict { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; }
    .modal-verdict.c { color: var(--correct-text); }
    .modal-verdict.w { color: var(--wrong-text); }
    .modal-expl { font-size: 0.98rem; color: #475569; line-height: 1.7; margin-bottom: 24px; }

    /* ── Result screen ── */
    #screen-result { max-width: 700px; margin: 0 auto; padding: 80px 20px 80px; }
    .res-header { text-align: center; margin-bottom: 30px; }
    .score-ring {
      width: 120px; height: 120px; border-radius: 50%;
      border: 5px solid var(--primary); display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin: 0 auto 18px;
    }
    .score-ring .rnum { font-size: 2rem; font-weight: 600; color: var(--primary); line-height: 1; }
    .score-ring .rlbl { font-size: 0.72rem; color: #94a3b8; }
    .res-title  { font-size: 1.8rem; font-weight: 600; font-style: italic; margin-bottom: 6px; }
    .res-msg    { font-size: 1rem; color: #64748b; margin-bottom: 4px; }
    .res-time   { font-size: 0.85rem; color: #94a3b8; margin-bottom: 28px; }
    .stats-row  { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-box {
      flex: 1; min-width: 80px; background: white; border: 1px solid #e2e8f0;
      border-radius: 12px; padding: 14px; text-align: center;
    }
    .stat-box .snum { font-size: 1.6rem; font-weight: 600; }
    .stat-box .slbl { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
    .stat-box.cs .snum { color: var(--correct-text); }
    .stat-box.ws .snum { color: var(--wrong-text); }
    .section-hd {
      font-size: 1.05rem; font-weight: 600; color: #0f172a;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0;
    }
    .missed-section { margin-bottom: 32px; }
    .missed-item {
      background: var(--wrong-bg); border-left: 4px solid var(--wrong-border);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.92rem;
    }
    .facit-item {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .facit-item.fc { border-left: 4px solid var(--correct-border); }
    .facit-item.fw { border-left: 4px solid var(--wrong-border); }
    .fi-num { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .fi-q   { font-size: 0.93rem; font-weight: 600; color: #0f172a; margin-bottom: 8px; line-height: 1.4; }
    .fi-row { font-size: 0.88rem; padding: 2px 0; }
    .fi-row .lbl { color: #94a3b8; }
    .fi-row.ya-ok  { color: var(--correct-text); }
    .fi-row.ya-bad { color: var(--wrong-text); }
    .fi-row.ra     { color: var(--correct-text); font-weight: 600; margin-top: 2px; }

    .btn-primary {
      display: inline-block; background: var(--primary); color: white; border: none;
      border-radius: 12px; padding: 13px 36px; font-size: 1.05rem; font-family: inherit;
      font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: none; }

    @media (max-width: 768px) {
      a.back-btn { top: 10px; left: 8px; padding: 6px 10px; font-size: 0.88rem; }
      .easy-toggle { top: 10px; right: 8px; padding: 6px 12px; font-size: 0.8rem; }
      #screen-quiz, #screen-result { padding-left: 16px; padding-right: 16px; }
      .modal-box { padding: 24px 20px; max-height: 90vh; overflow-y: auto; }
    }
    @media (max-width: 500px) {
      #screen-start h1 { font-size: 1.85rem; }
      .q-text { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<a href="politik.html" class="back-btn">← Tillbaka</a>
<button class="easy-toggle" id="btn-easy" type="button" aria-pressed="false" onclick="toggleEasy()">📖 Enkel svenska</button>

<!-- ═══════════ START ═══════════ -->
<div id="screen-start" class="screen active">
  <div class="badge">Samhällskunskap nivå 1a1 · Politik</div>
  <h1>⚖️ Mänskliga rättigheter</h1>
  <p class="subtitle">30 frågor om rättigheters historia, FN, Europarådet och kränkningar</p>
  <div class="info-cards">
    <div class="info-card"><div class="num">30</div><div class="lbl">Frågor</div></div>
    <div class="info-card"><div class="num">4</div><div class="lbl">Alternativ</div></div>
    <div class="info-card"><div class="num">⏱</div><div class="lbl">Timer</div></div>
  </div>
  <button class="btn-primary" onclick="startQuiz()">Starta Quiz →</button>
</div>

<!-- ═══════════ QUIZ ═══════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <div class="timer" id="timer">⏱ 0:00</div>
    <div class="score-pill" id="score-pill">Poäng: 0</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
  <div class="q-counter" id="q-counter">Fråga 1 av 30</div>
  <div class="q-text" id="q-text"></div>
  <div class="opts" id="opts"></div>
  <div class="nav-row">
    <button class="btn-back" id="btn-back" onclick="goBack()" style="display:none">← Bakåt</button>
    <button class="btn-next" id="btn-next" onclick="goNext()" style="display:none">Nästa →</button>
  </div>
</div>

<!-- ═══════════ MODAL ═══════════ -->
<div id="modal-overlay" class="hidden">
  <div class="modal-box">
    <div class="modal-icon"    id="modal-icon"></div>
    <div class="modal-verdict" id="modal-verdict"></div>
    <div class="modal-expl"    id="modal-expl"></div>
    <button class="btn-primary" id="modal-next" onclick="closeModal()">Nästa fråga →</button>
  </div>
</div>

<!-- ═══════════ RESULT ═══════════ -->
<div id="screen-result" class="screen">
  <div class="res-header">
    <div class="score-ring">
      <div class="rnum" id="r-score"></div>
      <div class="rlbl">poäng</div>
    </div>
    <div class="res-title" id="r-title"></div>
    <div class="res-msg"   id="r-msg"></div>
    <div class="res-time"  id="r-time"></div>
  </div>
  <div class="stats-row">
    <div class="stat-box cs"><div class="snum" id="s-correct">0</div><div class="slbl">Rätt</div></div>
    <div class="stat-box ws"><div class="snum" id="s-wrong">0</div><div class="slbl">Fel</div></div>
    <div class="stat-box"><div class="snum" id="s-pct">0%</div><div class="slbl">Andel rätt</div></div>
  </div>
  <div class="missed-section" id="missed-section"></div>
  <div class="section-hd" id="facit-hd">Fullständigt facit</div>
  <div id="facit-list"></div>
  <div style="text-align:center;margin-top:32px">
    <button class="btn-primary" id="btn-restart" onclick="restartQuiz()">↺ Gör om quizet</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    q: 'Vad menas med att mänskliga rättigheter är universella?',
    opts: [
      'De gäller alla människor, överallt och i alla tider, oavsett kultur, religion eller landets lagar',
      'De gäller bara medborgare i demokratiska stater',
      'De gäller bara FN:s 193 medlemsländer',
      'De gäller bara vuxna personer som är myndiga'
    ],
    correct: 'De gäller alla människor, överallt och i alla tider, oavsett kultur, religion eller landets lagar',
    expl: 'Universalitet är en grundprincip för mänskliga rättigheter – de gäller alla människor bara för att de är människor, oavsett nationalitet, religion, kön eller politisk åsikt.',
    qEnkel: 'Mänskliga rättigheter är universella. Vad betyder det?',
    optsEnkel: [
      'De gäller alla människor, i alla länder och i alla tider',
      'De gäller bara de som är medborgare i en demokrati',
      'De gäller bara i de 193 länder som är med i FN',
      'De gäller bara vuxna, alltså de som är myndiga'
    ],
    expEnkel: 'Universell betyder att något gäller alla. Mänskliga rättigheter gäller alla människor. Det spelar ingen roll vilket land du kommer från. Det spelar heller ingen roll vilken religion, vilket kön eller vilka åsikter du har.'
  },
  {
    q: 'I vilka tre huvudkategorier brukar mänskliga rättigheter delas in?',
    opts: [
      'Personliga, politiska samt ekonomiska, sociala och kulturella rättigheter',
      'Civila, militära och religiösa rättigheter',
      'Nationella, regionala och lokala rättigheter',
      'Barnens, kvinnornas och äldres rättigheter'
    ],
    correct: 'Personliga, politiska samt ekonomiska, sociala och kulturella rättigheter',
    expl: 'Mänskliga rättigheter brukar delas in i tre kategorier: personliga rättigheter (t.ex. rätt till liv), politiska rättigheter (t.ex. rösträtt) samt ekonomiska, sociala och kulturella rättigheter (t.ex. rätt till utbildning och arbete).',
    qEnkel: 'Mänskliga rättigheter delas ofta in i tre grupper. Vilka är de?',
    optsEnkel: [
      'Personliga, politiska samt ekonomiska, sociala och kulturella rättigheter',
      'Civila, militära och religiösa rättigheter för alla människor',
      'Nationella, regionala och lokala rättigheter i varje land',
      'Barnens rättigheter, kvinnornas rättigheter och de äldres rättigheter'
    ],
    expEnkel: 'Det finns tre grupper. Personliga rättigheter, till exempel rätten att leva. Politiska rättigheter, till exempel rätten att rösta. Ekonomiska, sociala och kulturella rättigheter, till exempel rätten att gå i skolan och att arbeta.'
  },
  {
    q: 'Vilken 1600-talsfilosof formulerade idén om att alla människor föds med naturliga rättigheter till liv, frihet och egendom?',
    opts: [
      'John Locke',
      'Thomas Hobbes',
      'Jean-Jacques Rousseau',
      'Immanuel Kant'
    ],
    correct: 'John Locke',
    expl: 'John Locke var en brittisk filosof som hävdade att alla människor föds med naturliga rättigheter: rätt till liv, frihet och egendom. Hans idéer lade grunden för moderna mänskliga rättigheter och påverkade bland annat den amerikanska självständighetsförklaringen.',
    qEnkel: 'En filosof på 1600-talet sa att alla föds med naturliga rättigheter: rätt till liv, frihet och egendom. Vem var det?',
    optsEnkel: [
      'John Locke',
      'Thomas Hobbes',
      'Jean-Jacques Rousseau',
      'Immanuel Kant'
    ],
    expEnkel: 'John Locke var en filosof från England. Han sa att alla människor föds med rätt till liv, frihet och egendom (saker man äger). Hans idéer blev en grund för dagens mänskliga rättigheter. De påverkade också USA:s självständighetsförklaring.'
  },
  {
    q: 'Vad var Kyroskylindren, skapad ca 539 f.v.t.?',
    opts: [
      'En rättighetsförklaring som bl.a. befriade slavar och garanterade religionsfrihet',
      'Det första moderna passet för internationella resor',
      'En militärlag som tillät erövring av grannländer',
      'Det äldsta kända handelsdokumentet från Persien'
    ],
    correct: 'En rättighetsförklaring som bl.a. befriade slavar och garanterade religionsfrihet',
    expl: 'Kyroskylindren skapades av perserkungen Kyros den store och anses av många vara världens första rättighetsförklaring. Den befriade slavar och garanterade religionsfrihet för dem som levde i imperiet.',
    qEnkel: 'Kyroskylindren gjordes ungefär år 539 f.v.t. (före vår tideräkning). Vad var den?',
    optsEnkel: [
      'En text om rättigheter som bland annat gjorde slavar fria och gav religionsfrihet',
      'Det första moderna passet, som man använde för att resa mellan olika länder',
      'En lag för armén som sa att man fick ta över länderna runt omkring',
      'Den äldsta text vi känner till om handel, och den kommer från Persien'
    ],
    expEnkel: 'Kyroskylindren gjordes av Kyros den store. Han var kung i Persien. Många ser den som världens första rättighetsförklaring. Den gjorde slavar fria. Den gav också alla i riket rätt att ha sin egen religion.'
  },
  {
    q: 'Vilket år grundades Förenta nationerna (FN)?',
    opts: ['1945', '1919', '1948', '1939'],
    correct: '1945',
    expl: 'FN grundades 1945 efter andra världskriget, för att förhindra framtida krig och kränkningar av mänskliga rättigheter. San Francisco-stadgan undertecknades av de 51 ursprungsländerna.',
    qEnkel: 'Vilket år bildades Förenta nationerna (FN)?',
    optsEnkel: [
      '1945',
      '1919',
      '1948',
      '1939'
    ],
    expEnkel: 'FN bildades 1945, direkt efter andra världskriget. Målet var att stoppa nya krig och skydda människors rättigheter. 51 länder skrev under FN-stadgan i San Francisco.'
  },
  {
    q: 'Hur många länder grundade FN år 1945?',
    opts: ['51 länder', '16 länder', '100 länder', '193 länder'],
    correct: '51 länder',
    expl: 'FN grundades 1945 av 51 länder. Idag har organisationen 193 medlemsstater och arbetar med fred, säkerhet, humanitärt bistånd och mänskliga rättigheter.',
    qEnkel: 'Hur många länder var med och bildade FN år 1945?',
    optsEnkel: [
      '51 länder',
      '16 länder',
      '100 länder',
      '193 länder'
    ],
    expEnkel: 'FN bildades 1945 av 51 länder. I dag är 193 länder med i FN. FN arbetar för fred och säkerhet. FN hjälper människor i nöd och arbetar för mänskliga rättigheter.'
  },
  {
    q: 'Hur många artiklar innehåller FN:s allmänna förklaring om de mänskliga rättigheterna, antagen 1948?',
    opts: ['30 artiklar', '50 artiklar', '10 artiklar', '100 artiklar'],
    correct: '30 artiklar',
    expl: 'FN:s allmänna förklaring om de mänskliga rättigheterna antogs den 10 december 1948 och innehåller 30 artiklar som täcker allt från rätten till liv och frihet till rätten till utbildning och arbete.',
    qEnkel: 'FN:s allmänna förklaring om de mänskliga rättigheterna kom 1948. Hur många artiklar (delar) har den?',
    optsEnkel: [
      '30 artiklar',
      '50 artiklar',
      '10 artiklar',
      '100 artiklar'
    ],
    expEnkel: 'FN:s allmänna förklaring om de mänskliga rättigheterna antogs den 10 december 1948. Den har 30 artiklar. De handlar till exempel om rätten att leva och vara fri, och om rätten till skola och arbete.'
  },
  {
    q: 'Är FN:s allmänna förklaring om de mänskliga rättigheterna från 1948 juridiskt bindande för länder?',
    opts: [
      'Nej, den är inte juridiskt bindande',
      'Ja, alla länder måste följa den eller riskerar sanktioner',
      'Ja, men bara för FN:s permanenta säkerhetsrådsmedlemmar',
      'Ja, men bara för EU-länder'
    ],
    correct: 'Nej, den är inte juridiskt bindande',
    expl: 'FN:s allmänna förklaring är en deklaration, inte ett bindande avtal. Den är ett politiskt och moraliskt dokument. Konventionerna däremot är juridiskt bindande för de länder som ratificerar dem.',
    qEnkel: 'FN:s allmänna förklaring om de mänskliga rättigheterna kom 1948. Är den juridiskt bindande (måste länderna följa den enligt lag)?',
    optsEnkel: [
      'Nej, den är inte juridiskt bindande för något land',
      'Ja, alla länder måste följa den, annars får de straff',
      'Ja, men bara för de fasta medlemmarna i FN:s säkerhetsråd',
      'Ja, men bara för de länder som är medlemmar i EU'
    ],
    expEnkel: 'FN:s allmänna förklaring är en deklaration. En deklaration är inte ett bindande avtal. Den visar vad som är rätt och viktigt, men ingen lag tvingar länderna att följa den. Konventioner är annorlunda. De är juridiskt bindande för de länder som har ratificerat dem (godkänt dem).'
  },
  {
    q: 'Vad är skillnaden mellan en deklaration och en konvention inom mänskliga rättigheter?',
    opts: [
      'Konventioner är juridiskt bindande för stater som skriver under; deklarationen är det inte',

  },
  {
    q: 'Vad menas med naturrätt i sammanhanget mänskliga rättigheter?',
    opts: [
      'Att människan har rättigheter som inte ens demokratiskt valda politiker får kränka',
      'En lag om rätten att använda naturen och naturtillgångar fritt',
      'Regler om djurens rättigheter i naturen',
      'En princip om att stater äger alla naturresurser inom sina gränser'
    ],
    correct: 'Att människan har rättigheter som inte ens demokratiskt valda politiker får kränka',
    expl: 'Naturrätten är en filosofisk teori om att det finns rättigheter inbyggda i den mänskliga naturen – de existerar oberoende av vad lagar säger. Mänskliga rättigheter bygger delvis på naturrätten: ingen stat, inte ens en demokrati, kan legitimt kränka dem.',
    qEnkel: 'Vad betyder naturrätt när man pratar om mänskliga rättigheter?',
    optsEnkel: [
      'Att människan har rättigheter som inte ens politiker valda av folket får kränka',
      'En lag som säger att alla får använda naturen och det som finns i den fritt',
      'Regler som bestämmer vilka rättigheter de vilda djuren har ute i naturen',
      'En regel som säger att staten äger allt i naturen inom landets gränser'
    ],
    expEnkel: 'Naturrätten är en idé inom filosofin. Den säger att människan har rättigheter bara för att hon är människa. Rättigheterna finns även om ingen lag skriver om dem. Därför får ingen stat kränka dem. Inte ens en demokrati får det.'
  }
];

// ── Enkel svenska – UI-texter ──────────────────────────────
const UI_ENKEL = {
  missedHd:         'Frågor du svarade fel på',
  facitHd:          'Alla frågor och svar',
  yourAnswerLbl:    'Du svarade: ',
  correctAnswerLbl: 'Rätt svar: ',
  notAnswered:      '– (du svarade inte)',
  backBtn:          '← Tillbaka',
  nextBtn:          'Nästa →',
  modalNextBtn:     'Nästa fråga →',
  restartBtn:       '↺ Gör om'
};
const UI_ORIG = {
  missedHd:         'Frågor du missade',
  facitHd:          'Fullständigt facit',
  yourAnswerLbl:    'Ditt svar: ',
  correctAnswerLbl: 'Rätt svar: ',
  notAnswered:      '–',
  backBtn:          '← Bakåt',
  nextBtn:          'Nästa →',
  modalNextBtn:     'Nästa fråga →',
  restartBtn:       '↺ Gör om quizet'
};

// ── State ──────────────────────────────────────────────────
// Blandning sker på INDEX: order[] = visad plats → index i q.opts/q.optsEnkel.
// chosen/correct är index i q.opts, så rättningen är oberoende av språkläge.
let shuffled = [];
let states   = []; // { order:number[], chosen:number|null, correct:number, answered:bool }
let cur      = 0;
let score    = 0;
let timerInterval = null;
let startTime = 0;
let elapsedMs = 0;
let modalOpen = false;

// ── Enkel svenska – läge, lagring och texthjälpare ─────────
const EASY_KEY = 'mr_quiz_enkelsvenska';
let easyMode = false;
try { easyMode = sessionStorage.getItem(EASY_KEY) === '1'; } catch (e) {}

const warned = new Set();
function warnMissing(q, field) {
  const key = QUESTIONS.indexOf(q) + ':' + field;
  if (warned.has(key)) return;
  warned.add(key);
  console.warn('Enkel svenska saknas (' + field + ') för fråga: ' + q.q + ' – visar originalet.');
}
function ui(key) { return (easyMode ? UI_ENKEL : UI_ORIG)[key]; }
function qText(q) {
  if (!easyMode) return q.q;
  if (q.qEnkel) return q.qEnkel;
  warnMissing(q, 'qEnkel'); return q.q;
}
function optText(q, i) {
  if (!easyMode) return q.opts[i];
  if (q.optsEnkel && q.optsEnkel.length === q.opts.length && q.optsEnkel[i]) return q.optsEnkel[i];
  warnMissing(q, 'optsEnkel'); return q.opts[i];
}
function explText(q) {
  if (!easyMode) return q.expl;
  if (q.expEnkel) return q.expEnkel;
  warnMissing(q, 'expEnkel'); return q.expl;
}

function updateEasyButton() {
  document.getElementById('btn-easy').setAttribute('aria-pressed', easyMode ? 'true' : 'false');
}
updateEasyButton();

// Byter bara texten – poäng, timer, aktuell fråga, svar och blandning rörs inte.
function toggleEasy() {
  easyMode = !easyMode;
  try { sessionStorage.setItem(EASY_KEY, easyMode ? '1' : '0'); } catch (e) {}
  updateEasyButton();
  if (document.getElementById('screen-quiz').classList.contains('active')) {
    renderQuestion();
    if (modalOpen) renderModal();
  }
  if (document.getElementById('screen-result').classList.contains('active')) renderResult();
}

// ── Helpers ────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Start ──────────────────────────────────────────────────
function startQuiz() {
  shuffled = shuffle(QUESTIONS);
  states   = shuffled.map(q => ({
    order:    shuffle(q.opts.map((_, i) => i)),
    chosen:   null,
    correct:  q.opts.indexOf(q.correct),
    answered: false
  }));
  cur   = 0;
  score = 0;
  modalOpen = false;
  clearInterval(timerInterval);
  startTime = Date.now();
  document.getElementById('timer').textContent = '⏱ 0:00';
  timerInterval = setInterval(() => {
    document.getElementById('timer').textContent = '⏱ ' + fmtTime(Date.now() - startTime);
  }, 500);
  show('screen-quiz');
  renderQuestion();
}

// ── Render question ────────────────────────────────────────
function renderQuestion() {
  const q  = shuffled[cur];
  const st = states[cur];
  const n  = shuffled.length;

  document.getElementById('q-counter').textContent = 'Fråga ' + (cur + 1) + ' av ' + n;
  document.getElementById('q-text').textContent    = qText(q);
  document.getElementById('progress-bar').style.width = ((cur / n) * 100) + '%';
  document.getElementById('score-pill').textContent   = 'Poäng: ' + score;

  const container = document.getElementById('opts');
  container.innerHTML = '';
  st.order.forEach(origIdx => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = optText(q, origIdx);
    if (st.answered) {
      btn.disabled = true;
      if (origIdx === st.correct) {
        btn.classList.add('correct');
      } else if (origIdx === st.chosen) {
        btn.classList.add('wrong');
      } else {
        btn.classList.add('dimmed');
      }
    } else {
      btn.onclick = () => answerQuestion(origIdx);
    }
    container.appendChild(btn);
  });

  const back = document.getElementById('btn-back');
  const next = document.getElementById('btn-next');
  back.textContent = ui('backBtn');
  next.textContent = ui('nextBtn');
  back.style.display = cur > 0 ? 'block' : 'none';
  next.style.display = st.answered ? 'block' : 'none';
}

// ── Answer ─────────────────────────────────────────────────
function answerQuestion(chosenIdx) {
  const st = states[cur];
  if (st.answered) return;

  const isCorrect = chosenIdx === st.correct;
  st.chosen   = chosenIdx;
  st.answered = true;
  if (isCorrect) score++;

  renderQuestion();

  const answeredAt = cur;
  setTimeout(() => {
    if (cur !== answeredAt || !document.getElementById('screen-quiz').classList.contains('active')) return;
    modalOpen = true;
    renderModal();
    document.getElementById('modal-overlay').classList.remove('hidden');
  }, 600);
}

function renderModal() {
  const st = states[cur];
  const isCorrect = st.chosen === st.correct;
  const icon    = document.getElementById('modal-icon');
  const verdict = document.getElementById('modal-verdict');
  icon.textContent    = isCorrect ? '✅' : '❌';
  verdict.textContent = isCorrect ? 'Rätt!' : 'Fel!';
  verdict.className   = 'modal-verdict ' + (isCorrect ? 'c' : 'w');
  document.getElementById('modal-expl').textContent = explText(shuffled[cur]);
  document.getElementById('modal-next').textContent = ui('modalNextBtn');
}

// ── Modal close → next ─────────────────────────────────────
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  modalOpen = false;
  goNext();
}

// ── Navigation ─────────────────────────────────────────────
function goNext() {
  document.getElementById('modal-overlay').classList.add('hidden');
  modalOpen = false;
  if (cur < shuffled.length - 1) {
    cur++;
    renderQuestion();
  } else {
    endQuiz();
  }
}

function goBack() {
  if (cur > 0) {
    cur--;
    renderQuestion();
  }
}

// ── End quiz ───────────────────────────────────────────────
function endQuiz() {
  clearInterval(timerInterval);
  elapsedMs = Date.now() - startTime;
  show('screen-result');
  renderResult();
}

function renderResult() {
  const elapsed = fmtTime(elapsedMs);
  const n       = shuffled.length;
  const pct     = Math.round((score / n) * 100);

  document.getElementById('r-score').textContent   = score + '/' + n;
  document.getElementById('s-correct').textContent = score;
  document.getElementById('s-wrong').textContent   = n - score;
  document.getElementById('s-pct').textContent     = pct + '%';
  document.getElementById('r-time').textContent    = 'Tid: ' + elapsed;
  document.getElementById('progress-bar').style.width = '100%';

  let title, msg;
  if      (pct >= 90) { title = '🏆 Strålande!';   msg = 'Imponerande! Du behärskar mänskliga rättigheter.'; }
  else if (pct >= 75) { title = '👍 Bra jobbat!';  msg = 'Bra resultat! Läs igenom det du missade en gång till.'; }
  else if (pct >= 60) { title = '✓ Godkänt!';      msg = 'Du klarar provet! Repetera de svåra delarna.'; }
  else                { title = '💪 Öva mer!';      msg = 'Läs pluggmaterialet och försök igen.'; }
  document.getElementById('r-title').textContent = title;
  document.getElementById('r-msg').textContent   = msg;

  // Missed questions
  const missedEl = document.getElementById('missed-section');
  missedEl.innerHTML = '';
  const missedIdx = states.map((st, i) => i).filter(i => states[i].chosen !== states[i].correct);
  if (missedIdx.length > 0) {
    const hd = document.createElement('div');
    hd.className = 'section-hd';
    hd.textContent = ui('missedHd') + ' (' + missedIdx.length + ')';
    missedEl.appendChild(hd);
    missedIdx.forEach(idx => {
      const item = document.createElement('div');
      item.className = 'missed-item';
      item.textContent = (idx + 1) + '. ' + qText(shuffled[idx]);
      missedEl.appendChild(item);
    });
  }

  // Full facit
  document.getElementById('facit-hd').textContent    = ui('facitHd');
  document.getElementById('btn-restart').textContent = ui('restartBtn');
  const facitEl = document.getElementById('facit-list');
  facitEl.innerHTML = '';
  states.forEach((st, i) => {
    const q      = shuffled[i];
    const ok     = st.chosen === st.correct;
    const item   = document.createElement('div');
    item.className = 'facit-item ' + (ok ? 'fc' : 'fw');

    const num = document.createElement('div');
    num.className = 'fi-num';
    num.textContent = 'Fråga ' + (i + 1);

    const qEl = document.createElement('div');
    qEl.className = 'fi-q';
    qEl.textContent = qText(q);

    const ya = document.createElement('div');
    ya.className = 'fi-row ' + (ok ? 'ya-ok' : 'ya-bad');
    const yaLbl = document.createElement('span');
    yaLbl.className = 'lbl';
    yaLbl.textContent = ui('yourAnswerLbl');
    ya.appendChild(yaLbl);
    ya.appendChild(document.createTextNode(
      (st.chosen === null ? ui('notAnswered') : optText(q, st.chosen)) + (ok ? ' ✓' : ' ✗')));

    item.appendChild(num);
    item.appendChild(qEl);
    item.appendChild(ya);

    if (!ok) {
      const ra = document.createElement('div');
      ra.className = 'fi-row ra';
      const raLbl = document.createElement('span');
      raLbl.className = 'lbl';
      raLbl.textContent = ui('correctAnswerLbl');
      ra.appendChild(raLbl);
      ra.appendChild(document.createTextNode(optText(q, st.correct)));
      item.appendChild(ra);
    }

    facitEl.appendChild(item);
  });
}

// ── Restart ────────────────────────────────────────────────
// Enkel svenska-läget ligger kvar (sessionStorage), allt annat nollställs vid start.
function restartQuiz() {
  clearInterval(timerInterval);
  show('screen-start');
}
</script>
