<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Begrepp – Brott och straff</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'EB Garamond', serif; }
    .flip-card { perspective: 1000px; height: 350px; width: 100%; max-width: 400px; cursor: pointer; }
    .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .flipped-classes { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .flip-card-front { background-color: #0d9488; border: 6px solid white; }
    .flip-card-back { background-color: white; border: 6px solid #0d9488; transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>
  <script>
    function smartBack(e) {
      if (e) e.preventDefault();
      var ref = document.referrer;
      if (ref) {
        try {
          if (new URL(ref).origin === window.location.origin) {
            history.back();
            return;
          }
        } catch (err) {}
      }
      window.location.href = 'index.html';
    }
  </script>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const concepts = [
      { term: "Brott", definition: "Är en handling som är beskriven i en författning och som det finns ett straff föreskrivet för." },
      { term: "Brottsbalken (BrB)", definition: "Är den centrala författningen för brott och brottspåföljder." },
      { term: "Adekvat kausalitet", definition: "Ett tydligt orsakssamband mellan en gärning och dess verkan." },
      { term: "Uppsåt", definition: "Innebär att handlingen är medveten. På latin heter detta \"dolus\"." },
      { term: "Direkt uppsåt", definition: "Är den högsta graden av uppsåt. Kallas även för \"avsiktsuppsåt\". Gärningspersonen har som direkt syfte att åstadkomma effekten av handlingen." },
      { term: "Insiktsuppsåt", definition: "Är den lägre graden av uppsåt. Gärningspersonen var praktiskt taget säker på att handlingen skulle leda till en viss följd, även om det inte var själva syftet." },
      { term: "Likgiltighetsuppsåt", definition: "Är den lägsta graden av uppsåt. Gärningspersonen insåg risken för följden men var likgiltig inför om den skulle inträffa eller inte." },
      { term: "Vårdslöshet", definition: "En annan benämning för oaktsamhet. På latin heter detta \"culpa\"." },
      { term: "Objektiva rekvisit", definition: "Är den specifika handling som utförs." },
      { term: "Subjektiva rekvisit", definition: "Är gärningspersonens avsikt." },
      { term: "Kumulativa rekvisit", definition: "Både de objektiva och subjektiva rekvisiten måste vara uppfyllda för att gärningen ska betraktas som ett brott." },
      { term: "Alternativa rekvisit", definition: "Innebär att något av rekvisiten måste vara uppfyllt för att handlingen ska anses vara brottslig." },
      { term: "Legalitetsprincipen", definition: "Innebär att en domstol inte får döma för en handling som inte motsvaras av något brott i lag." },
      { term: "Retroaktivitetsförbudet", definition: "Föreskrifter om vad som är brottsligt får inte införas i efterhand." },
      { term: "Analogiförbudet", definition: "Föreskrifter om vad som är brottsligt får inte utsträckas utöver vad själva ordalydelsen tillåter." },
      { term: "Obestämdhetsförbudet", definition: "Föreskrifter om vad som är brottsligt måste vara bestämda till sin utformning." },
      { term: "Allmänprevention", definition: "Syftet med straffet är att förebygga brott genom avskräckning. Allmänprevention är en del av den relativa straffteorin." },
      { term: "Individualprevention", definition: "Straffen ska vara tillräckligt avskräckande för att en person inte ska begå eller upprepa brottslighet." },
      { term: "Talionprincipen", definition: "Innebär att gärningspersonen ska utsättas för samma skada/lidande som brottsoffret lidit. Talionprincipen är en del av den absoluta straffteorin." },
      { term: "Nationella trygghetsundersökningen (NTU)", definition: "En omfattande enkätundersökning från Brå som undersöker medborgarnas oro för att bli utsatta för brott och om de faktiskt blivit utsatta för brott." },
      { term: "Annan rättsverkan", definition: "De ytterligare respektive minimala åtgärder som följer på ett brott, exempelvis skadestånd, utvisning, körkortsindragning eller förverkande av egendom." },
      { term: "Straffskalan", definition: "Anger det lägsta och högsta straff som kan dömas ut för ett visst brott." },
      { term: "Straffvärde", definition: "Anger hur allvarligt ett brott är i relation till andra brott." },
      { term: "Villkorlig dom", definition: "Utdöms när det anses att den dömde kan klara att avhålla sig från fortsatt brottslig verksamhet utan övervakning." },
      { term: "Ungdomsvård", definition: "Kan vara sluten och tiden varierar, från två veckor till flera år." },
      { term: "Villkorlig frigivning", definition: "Innebär att den dömde frisläpps på prov." },
      { term: "Livstid", definition: "Är ett straff som inte är tidsbestämt." },
      { term: "Förebyggande arbete", definition: "Samarbete mellan polisen, kommunerna, socialtjänsten och kriminalvården för att sysselsätta ungdomar och minska brottsligheten, särskilt i utsatta områden." },
      { term: "Brottsförebyggande rådet (Brå)", definition: "Är en myndighet som har som uppgift att verka för att brottsligheten minskar i Sverige och att tryggheten ökar i samhället." },
      { term: "Mörkertal", definition: "Är det antal brott som aldrig anmäls. Inom sexualbrott är mörkertalet sannolikt stort." }
    ];

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const P = '#0d9488';
    const PLIGHT = '#ccfbf1';
    const PDARK = '#134e4a';

    function ListView() {
      const [query, setQuery] = useState('');
      const q = query.trim().toLowerCase();
      const filtered = concepts
        .map((c, i) => ({ ...c, index: i }))
        .filter(c => !q || c.term.toLowerCase().includes(q) || c.definition.toLowerCase().includes(q));

      return (
        <div>
          <input
            type="text"
            value={query}
            onChange={e => setQuery(e.target.value)}
            placeholder="Sök begrepp eller definition..."
            className="w-full mb-6 border-2 border-slate-200 rounded-2xl px-5 py-3 text-lg focus:outline-none focus:border-teal-600"
          />
          <div className="grid gap-4">
            {filtered.map(item => (
              <div key={item.index} className="bg-white p-5 rounded-2xl border-l-8 shadow-sm hover:shadow-md transition-shadow" style={{ borderColor: P }}>
                <div className="flex items-center gap-3 mb-1">
                  <span className="text-xs font-bold px-2 py-1 rounded-lg" style={{ background: PLIGHT, color: PDARK }}>{item.index + 1}</span>
                  <h3 className="text-lg font-bold">{item.term}</h3>
                </div>
                <p className="text-slate-600 leading-relaxed ml-10">{item.definition}</p>
              </div>
            ))}
            {filtered.length === 0 && (
              <p className="text-center text-slate-400 py-8">Inga begrepp matchar sökningen.</p>
            )}
          </div>
        </div>
      );
    }

    function FlashcardView() {
      const total = concepts.length;
      const [deck, setDeck] = useState(() => shuffleArray([...concepts]));
      const [deckIdx, setDeckIdx] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [kudeInte, setKudeInte] = useState([]);
      const [kunde, setKunde] = useState([]);
      const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

      const restartAll = () => {
        setDeck(shuffleArray([...concepts]));
        setDeckIdx(0);
        setIsFlipped(false);
        setKudeInte([]);
        setKunde([]);
        setPhase('playing');
      };

      const sort = (pile) => {
        const card = deck[deckIdx];
        const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
        const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
        const nextIdx = deckIdx + 1;
        setKudeInte(newKudeInte);
        setKunde(newKunde);
        setIsFlipped(false);
        if (nextIdx >= deck.length) {
          setDeckIdx(nextIdx);
          setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
        } else {
          setDeckIdx(nextIdx);
        }
      };

      const nextRound = () => {
        setDeck(shuffleArray([...kudeInte]));
        setDeckIdx(0);
        setIsFlipped(false);
        setKudeInte([]);
        setPhase('playing');
      };

      if (phase === 'allDone') return (
        <div className="flex flex-col items-center gap-6">
          <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
            <div className="text-5xl mb-4">🎉</div>
            <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
            <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
            <button onClick={restartAll} style={{ background: P }} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors">Börja om med alla</button>
          </div>
        </div>
      );

      if (phase === 'roundEnd') return (
        <div className="flex flex-col items-center gap-6">
          <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
            <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
            <div className="flex justify-center gap-8 mb-6">
              <div className="text-center">
                <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
              </div>
              <div className="text-center">
                <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
                <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
              </div>
            </div>
            <div className="flex flex-col gap-3">
              <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
                Öva på Kunde inte ({kudeInte.length} kort) →
              </button>
              <button onClick={restartAll} style={{ background: P }} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors">
                Börja om med alla
              </button>
            </div>
          </div>
        </div>
      );

      const card = deck[deckIdx];
      const remaining = deck.length - deckIdx;

      return (
        <div className="flex flex-col items-center">
          <div className="flex gap-3 mb-5 w-full max-w-sm">
            <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
              <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
            </div>
            <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-slate-400">{remaining}</p>
              <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
            </div>
            <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
              <p className="text-xl font-bold text-green-500">{kunde.length}</p>
              <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
            </div>
          </div>
          <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
            <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
              <div className="flip-card-front">
                <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
                <div className="absolute bottom-6 animate-pulse">
                  <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
                </div>
              </div>
              <div className="flip-card-back">
                <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
                <div className="absolute bottom-6">
                  <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
                </div>
              </div>
            </div>
          </div>
          {isFlipped && (
            <div className="flex gap-3 w-full max-w-sm mb-4">
              <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
                ✗ Kunde inte
              </button>
              <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
                ✓ Kunde
              </button>
            </div>
          )}
          <div className="flex flex-col items-center gap-2 mt-1">
            <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
            <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
          </div>
        </div>
      );
    }

    const lucktextData = [
      { pre: "Att medvetet spraymåla klotter på någon annans husvägg räknas som ett ", post: " eftersom handlingen är beskriven i lag och har ett straff kopplat till sig.", answers: ["brott"] },
      { pre: "De flesta brott och deras påföljder regleras i den centrala lag som förkortas ", post: ".", answers: ["brb", "brottsbalken"] },
      { pre: "Att någon knuffar en person som faller och slår i huvudet är ett tydligt exempel på ", post: " mellan handlingen och skadan.", answers: ["adekvat kausalitet"] },
      { pre: "När en gärningsperson medvetet och avsiktligt utför en brottslig handling talar man om ", post: ", vilket på latin kallas dolus.", answers: ["uppsåt"] },
      { pre: "Om en person skjuter mot en annan med det uttalade syftet att döda denne är det fråga om ", post: ", den högsta graden av uppsåt.", answers: ["direkt uppsåt"] },
      { pre: "En person som är praktiskt taget säker på att en handling kommer leda till en viss följd, trots att det inte var själva målet, agerar med ", post: ".", answers: ["insiktsuppsåt"] },
      { pre: "Att köra vårdslöst och strunta i om någon skadas, utan att det direkt var avsikten, kan bedömas som ", post: ", den lägsta graden av uppsåt.", answers: ["likgiltighetsuppsåt"] },
      { pre: "Att av misstag glömma en tänd spis och orsaka en brand är ett exempel på ", post: ", vilket på latin kallas culpa.", answers: ["vårdslöshet", "oaktsamhet"] },
      { pre: "Den konkreta handling som en gärningsperson faktiskt utför, till exempel att ta något som tillhör någon annan, kallas de ", post: ".", answers: ["objektiva rekvisiten", "objektiva rekvisit"] },
      { pre: "Gärningspersonens avsikt eller sinnestillstånd vid brottstillfället beskrivs som de ", post: ".", answers: ["subjektiva rekvisiten", "subjektiva rekvisit"] },
      { pre: "När både handlingen och avsikten måste vara uppfyllda samtidigt för att brott ska föreligga talar man om ", post: ".", answers: ["kumulativa rekvisit"] },
      { pre: "När det räcker att endast ett av flera villkor är uppfyllt för att handlingen ska anses brottslig rör det sig om ", post: ".", answers: ["alternativa rekvisit"] },
      { pre: "Att en domstol aldrig får döma någon för en handling som inte finns beskriven som brott i lag följer av ", post: ".", answers: ["legalitetsprincipen"] },
      { pre: "Att en ny lag inte får tillämpas på handlingar som begicks innan lagen trädde i kraft kallas ", post: ".", answers: ["retroaktivitetsförbudet"] },
      { pre: "Att en domstol inte får tänja på en lags ordalydelse för att få den att omfatta ett fall den egentligen inte täcker följer av ", post: ".", answers: ["analogiförbudet"] },
      { pre: "Kravet på att brottsbeskrivningar i lag måste vara tydliga och precisa, och inte vaga, kallas ", post: ".", answers: ["obestämdhetsförbudet"] },
      { pre: "Tanken att strängare straff avskräcker allmänheten i stort från att begå brott kallas ", post: ".", answers: ["allmänprevention"] },
      { pre: "När straffet syftar till att avskräcka just den dömda personen från att begå nya brott handlar det om ", post: ".", answers: ["individualprevention"] },
      { pre: "Tanken om att gärningspersonen ska drabbas av samma lidande som brottsoffret utsattes för kallas ", post: ".", answers: ["talionprincipen"] },
      { pre: "Brås årliga enkätundersökning om medborgarnas oro för brott och utsatthet förkortas ", post: ".", answers: ["ntu", "nationella trygghetsundersökningen"] },
      { pre: "Att en dömd person förlorar körkortet eller döms till skadestånd utöver själva straffet kallas ", post: ".", answers: ["annan rättsverkan"] },
      { pre: "Det spann mellan lägsta och högsta straff som lagen tillåter för ett visst brott kallas ", post: ".", answers: ["straffskalan", "straffskala"] },
      { pre: "Hur allvarligt ett brott anses vara i jämförelse med andra brott beskrivs genom brottets ", post: ".", answers: ["straffvärde"] },
      { pre: "När domstolen bedömer att den dömde klarar sig utan övervakning och därför slipper fängelse döms personen till ", post: ".", answers: ["villkorlig dom"] },
      { pre: "En påföljd för unga lagöverträdare som kan vara sluten och pågå från några veckor till flera år kallas ", post: ".", answers: ["ungdomsvård"] },
      { pre: "Att en intagen släpps ut från anstalten innan strafftiden är helt avtjänad, men på prov, kallas ", post: ".", answers: ["villkorlig frigivning"] },
      { pre: "Det enda straffet i svensk rätt som inte har något bestämt slutdatum kallas ", post: ".", answers: ["livstid", "livstids fängelse"] },
      { pre: "När polis, kommun, socialtjänst och kriminalvård samarbetar för att sysselsätta ungdomar och minska brottsligheten i utsatta områden kallas det ", post: ".", answers: ["förebyggande arbete"] },
      { pre: "Myndigheten som arbetar för att minska brottsligheten och öka tryggheten i Sverige förkortas ", post: ".", answers: ["brå", "brottsförebyggande rådet"] },
      { pre: "De brott som aldrig anmäls till polisen, och som är särskilt vanliga inom sexualbrott, utgör brottslighetens ", post: ".", answers: ["mörkertal"] }
    ];

    const scenarioData = [
      { scenario: "Elin sprejmålar olovligen på en husvägg. Handlingen finns beskriven i lag och kan leda till böter.", distractors: ["Annan rättsverkan", "Straffvärde", "Mörkertal"] },
      { scenario: "En jurist slår upp vilket straff som gäller för misshandel i den lag där de flesta brott och påföljder finns samlade.", distractors: ["Legalitetsprincipen", "Straffskalan", "Annan rättsverkan"] },
      { scenario: "En man knuffar en annan person i en trappa, som faller och bryter benet. Sambandet mellan knuffen och skadan är uppenbart.", distractors: ["Objektiva rekvisit", "Straffvärde", "Vårdslöshet"] },
      { scenario: "En person planerar och genomför medvetet en stöld, fullt medveten om vad hen gör.", distractors: ["Vårdslöshet", "Adekvat kausalitet", "Subjektiva rekvisit"] },
      { scenario: "En person köper en kniv i det uttalade syftet att döda sin granne, och gör sedan precis det.", distractors: ["Insiktsuppsåt", "Likgiltighetsuppsåt", "Vårdslöshet"] },
      { scenario: "En person tänder eld på en bil, fullt medveten om att en granne troligen sover i baksätet, trots att syftet bara var att förstöra bilen.", distractors: ["Direkt uppsåt", "Likgiltighetsuppsåt", "Vårdslöshet"] },
      { scenario: "En förare kör om i en skarp kurva trots att hen inser risken för en kollision, men struntar i om det händer eller inte.", distractors: ["Direkt uppsåt", "Insiktsuppsåt", "Vårdslöshet"] },
      { scenario: "En person glömmer en tänd spisplatta och lämnar lägenheten, vilket oavsiktligt orsakar en brand.", distractors: ["Likgiltighetsuppsåt", "Uppsåt", "Adekvat kausalitet"] },
      { scenario: "Åklagaren beskriver exakt vad den tilltalade fysiskt gjorde: tog en väska som tillhörde en annan person.", distractors: ["Subjektiva rekvisit", "Kumulativa rekvisit", "Alternativa rekvisit"] },
      { scenario: "Domstolen bedömer vad den tilltalade visste och avsåg när hen utförde handlingen.", distractors: ["Objektiva rekvisit", "Uppsåt", "Adekvat kausalitet"] },
      { scenario: "För att dömas krävs att åklagaren bevisar både att personen utförde handlingen och att personen hade avsikt att göra det – båda delarna måste vara uppfyllda.", distractors: ["Alternativa rekvisit", "Objektiva rekvisit", "Subjektiva rekvisit"] },
      { scenario: "Lagtexten anger att brottet är fullbordat om gärningspersonen antingen stal eller skadade egendomen – det räcker att ett av villkoren stämmer.", distractors: ["Kumulativa rekvisit", "Objektiva rekvisit", "Subjektiva rekvisit"] },
      { scenario: "En domare vägrar döma en person för en handling som inte finns beskriven som brottslig i någon lag.", distractors: ["Retroaktivitetsförbudet", "Analogiförbudet", "Obestämdhetsförbudet"] },
      { scenario: "Riksdagen inför en ny lag mot en handling, men domstolen får inte tillämpa lagen på något som skedde innan lagen trädde i kraft.", distractors: ["Legalitetsprincipen", "Analogiförbudet", "Obestämdhetsförbudet"] },

      return 'Öva mer på begreppen innan provet.';
    }

    function LucktextView() {
      const initial = () => concepts.map(() => ({ value: '', status: 'idle', attempts: 0 }));
      const [items, setItems] = useState(initial);

      const setValue = (i, value) => {
        setItems(prev => {
          const next = [...prev];
          next[i] = { ...next[i], value };
          return next;
        });
      };

      const submit = (i) => {
        setItems(prev => {
          const item = prev[i];
          if (item.status === 'correct' || item.status === 'revealed') return prev;
          const norm = item.value.trim().toLowerCase();
          const ok = lucktextData[i].answers.includes(norm);
          const next = [...prev];
          if (ok) {
            next[i] = { ...item, status: 'correct' };
          } else {
            const attempts = item.attempts + 1;
            next[i] = { ...item, attempts, status: attempts >= 2 ? 'wrong2' : 'wrong1' };
          }
          return next;
        });
      };

      const correctAll = () => {
        setItems(prev => prev.map(item => item.status === 'correct' ? item : { ...item, status: 'revealed' }));
      };

      const restart = () => setItems(initial());

      const score = items.filter(it => it.status === 'correct').length;
      const total = concepts.length;
      const allDone = items.every(it => it.status === 'correct' || it.status === 'revealed');

      return (
        <div>
          <div className="bg-white rounded-2xl border-2 border-slate-200 p-4 mb-6">
            <p className="text-sm font-bold text-slate-500 uppercase tracking-wide mb-3">Begreppsbank</p>
            <div className="flex flex-wrap gap-2">
              {concepts.map((c, i) => {
                const done = items[i].status === 'correct' || items[i].status === 'revealed';
                return (
                  <span key={i} className={`text-xs px-3 py-1 rounded-full border ${done ? 'line-through text-slate-300 border-slate-200 bg-slate-50' : 'text-slate-700 border-slate-300 bg-white'}`}>
                    {c.term}
                  </span>
                );
              })}
            </div>
          </div>

          <div className="flex items-center justify-between mb-4">
            <p className="text-sm font-bold text-slate-500">{score} / {total} rätt</p>
            <div className="flex gap-2">
              <button onClick={correctAll} className="text-xs font-bold px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition-colors">Rätta alla</button>
              <button onClick={restart} className="text-xs font-bold px-4 py-2 rounded-xl border-2 border-slate-300 text-slate-600 hover:bg-slate-100 transition-colors">Börja om</button>
            </div>
          </div>

          {allDone && (
            <div className="bg-white border-2 rounded-3xl p-6 text-center mb-6" style={{ borderColor: P }}>
              <p className="text-2xl font-bold mb-1" style={{ color: PDARK }}>{score} / {total} rätt</p>
              <p className="text-slate-600">{gradeText((score / total) * 100)}</p>
            </div>
          )}

          <div className="grid gap-4">
            {lucktextData.map((data, i) => {
              const item = items[i];
              const locked = item.status === 'correct' || item.status === 'revealed';
              const borderClass =
                item.status === 'correct' ? 'border-green-500' :
                item.status === 'revealed' ? 'border-red-400' :
                item.status === 'wrong2' ? 'border-red-300' :
                item.status === 'wrong1' ? 'border-orange-300' :
                'border-slate-200';
              return (
                <div key={i} className={`bg-white p-5 rounded-2xl border-2 ${borderClass}`}>
                  <p className="leading-relaxed">
                    <span className="text-slate-400 font-bold mr-1">{i + 1}.</span>
                    {data.pre}
                    <input
                      type="text"
                      value={item.value}
                      disabled={locked}
                      onChange={e => setValue(i, e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') submit(i); }}
                      className={`inline-block mx-1 px-2 py-1 border-b-2 focus:outline-none w-40 text-center ${locked ? 'bg-slate-50' : 'bg-white'}`}
                      style={{ borderColor: item.status === 'correct' ? '#16a34a' : item.status === 'revealed' ? '#dc2626' : P }}
                    />
                    {data.post}
                  </p>
                  {item.status === 'wrong1' && <p className="text-orange-500 text-sm font-bold mt-2">Är du säker att du stavat rätt?</p>}
                  {item.status === 'wrong2' && <p className="text-red-600 text-sm font-bold mt-2">Fel. Kontrollera stavningen och försök igen.</p>}
                  {item.status === 'correct' && <p className="text-green-700 text-sm mt-2">✓ Rätt! {concepts[i].definition}</p>}
                  {item.status === 'revealed' && <p className="text-red-600 text-sm mt-2">Rätt svar: <strong>{concepts[i].term}</strong>. {concepts[i].definition}</p>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function ScenarioView() {
      const total = scenarioData.length;
      const buildOrder = () => shuffleArray(scenarioData.map((_, i) => i));
      const [order, setOrder] = useState(buildOrder);
      const [qIdx, setQIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [phase, setPhase] = useState('playing');

      const dataIdx = order[qIdx];
      const q = scenarioData[dataIdx];
      const concept = concepts[dataIdx];
      const options = useMemo(() => shuffleArray([concept.term, ...q.distractors]), [dataIdx]);

      const choose = (opt) => {
        if (selected !== null) return;
        setSelected(opt);
        if (opt === concept.term) setScore(s => s + 1);
      };

      const next = () => {
        if (qIdx + 1 >= total) {
          setPhase('done');
        } else {
          setQIdx(qIdx + 1);
          setSelected(null);
        }
      };

      const restart = () => {
        setOrder(buildOrder());
        setQIdx(0);
        setSelected(null);
        setScore(0);
        setPhase('playing');
      };

      if (phase === 'done') {
        const pct = (score / total) * 100;
        return (
          <div className="bg-white border-2 rounded-3xl p-8 text-center" style={{ borderColor: P }}>
            <p className="text-3xl font-bold mb-2" style={{ color: PDARK }}>{score} / {total} rätt</p>
            <p className="text-slate-600 mb-6">{gradeText(pct)}</p>
            <button onClick={restart} style={{ background: P }} className="text-white px-8 py-3 rounded-2xl font-bold">Gör om</button>
          </div>
        );
      }

      return (
        <div>
          <div className="flex items-center justify-between mb-2">
            <p className="text-sm font-bold text-slate-500">Fråga {qIdx + 1} av {total}</p>
            <p className="text-sm font-bold text-slate-500">Poäng: {score}</p>
          </div>
          <div className="w-full bg-slate-200 rounded-full h-2 mb-6">
            <div className="h-2 rounded-full transition-all" style={{ width: `${(qIdx / total) * 100}%`, background: P }}></div>
          </div>

          <div className="bg-white p-6 rounded-2xl border-2 border-slate-200 mb-5">
            <p className="text-lg leading-relaxed">{q.scenario}</p>
          </div>

          <div className="grid gap-3">
            {options.map((opt, i) => {
              const isCorrect = opt === concept.term;
              const isSelected = selected === opt;
              let cls = 'bg-white border-2 border-slate-200 hover:border-slate-300';
              if (selected !== null) {
                if (isCorrect) cls = 'bg-green-50 border-2 border-green-500 text-green-800';
                else if (isSelected) cls = 'bg-red-50 border-2 border-red-500 text-red-800';
                else cls = 'bg-white border-2 border-slate-100 text-slate-400';
              }
              return (
                <button key={i} onClick={() => choose(opt)} disabled={selected !== null} className={`text-left px-5 py-3 rounded-2xl font-medium transition-colors ${cls}`}>
                  {opt}
                </button>
              );
            })}
          </div>

          {selected !== null && (
            <div className="mt-5 bg-slate-50 border-2 border-slate-200 rounded-2xl p-4">
              <p className="text-slate-700">{concept.definition}</p>
              <button onClick={next} style={{ background: P }} className="mt-4 text-white px-6 py-2 rounded-xl font-bold">
                {qIdx + 1 >= total ? 'Se resultat' : 'Nästa →'}
              </button>
            </div>
          )}
        </div>
      );
    }

      const [order, setOrder] = useState(buildOrder);
      const [qIdx, setQIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [phase, setPhase] = useState('playing');

      const dataIdx = order[qIdx];
      const q = ickeData[dataIdx];
      const concept = concepts[dataIdx];

      const choose = (letter) => {
        if (selected !== null) return;
        setSelected(letter);
        if (letter === q.correct) setScore(s => s + 1);
      };

      const next = () => {
        if (qIdx + 1 >= total) {
          setPhase('done');
        } else {
          setQIdx(qIdx + 1);
          setSelected(null);
        }
      };

      const restart = () => {
        setOrder(buildOrder());
        setQIdx(0);
        setSelected(null);
        setScore(0);
        setPhase('playing');
      };

      if (phase === 'done') {
        const pct = (score / total) * 100;
        return (
          <div className="bg-white border-2 rounded-3xl p-8 text-center" style={{ borderColor: P }}>
            <p className="text-3xl font-bold mb-2" style={{ color: PDARK }}>{score} / {total} rätt</p>
            <p className="text-slate-600 mb-6">{gradeText(pct)}</p>
            <button onClick={restart} style={{ background: P }} className="text-white px-8 py-3 rounded-2xl font-bold">Börja om</button>
          </div>
        );
      }

      const options = [
        { letter: 'A', text: q.optionA },
        { letter: 'B', text: q.optionB }
      ];

      return (
        <div>
          <div className="flex items-center justify-between mb-2">
            <p className="text-sm font-bold text-slate-500">Fråga {qIdx + 1} av {total}</p>
            <p className="text-sm font-bold text-slate-500">Poäng: {score}</p>
          </div>
          <div className="w-full bg-slate-200 rounded-full h-2 mb-6">
            <div className="h-2 rounded-full transition-all" style={{ width: `${(qIdx / total) * 100}%`, background: P }}></div>
          </div>

          <div className="bg-white p-5 rounded-2xl border-l-8 mb-5 shadow-sm" style={{ borderColor: P }}>
            <p className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">Begrepp</p>
            <h3 className="text-xl font-bold">{concept.term}</h3>
          </div>

          <p className="text-sm text-slate-500 mb-3 font-medium">Vilket alternativ är ett korrekt exempel på begreppet?</p>

          <div className="grid gap-3">
            {options.map(opt => {
              const isCorrect = opt.letter === q.correct;
              const isSelected = selected === opt.letter;
              let cls = 'bg-white border-2 border-slate-200 hover:border-slate-300';
              if (selected !== null) {
                if (isCorrect) cls = 'bg-green-50 border-2 border-green-500 text-green-800';
                else if (isSelected) cls = 'bg-red-50 border-2 border-red-500 text-red-800';
                else cls = 'bg-white border-2 border-slate-100 text-slate-400';
              }
              return (
                <button key={opt.letter} onClick={() => choose(opt.letter)} disabled={selected !== null} className={`text-left px-5 py-4 rounded-2xl font-medium transition-colors ${cls}`}>
                  <span className="font-bold mr-2">{opt.letter}.</span>{opt.text}
                </button>
              );
            })}
          </div>

          {selected !== null && (
            <div className="mt-5 bg-slate-50 border-2 border-slate-200 rounded-2xl p-4">
              <p className="text-slate-700">{q.explanation}</p>
              <button onClick={next} style={{ background: P }} className="mt-4 text-white px-6 py-2 rounded-xl font-bold">
                {qIdx + 1 >= total ? 'Se resultat' : 'Nästa →'}
              </button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('list');

      const activeTab = 'text-white font-bold shadow-sm';
      const inactiveTab = 'text-slate-500';
      const disabledTab = 'text-slate-300 cursor-not-allowed';

      const tabs = [
        ['list', 'Lista', true],
        ['flashcards', 'Flashcards', true],
        ['lucktext', 'Lucktext', true],
        ['scenario', 'Scenario', true],
        ['icke', 'Icke-ex.', true]
      ];

      return (
        <div className="min-h-screen p-4 md:p-8">
          <header className="max-w-2xl mx-auto mb-8 flex items-center justify-between">
            <a href="index.html" onClick={smartBack} className="text-slate-500 hover:text-teal-600 transition-colors flex items-center gap-2 font-medium text-sm">← Tillbaka till startsidan</a>
            <h1 className="text-2xl md:text-3xl font-bold text-center">Brott och straff</h1>
            <div className="w-36"></div>
          </header>

          <div className="max-w-2xl mx-auto mb-10 flex bg-white p-1 rounded-full shadow-md border border-slate-200 overflow-x-auto">
            {tabs.map(([v, label, enabled]) => (
              <button
                key={v}
                onClick={() => enabled && setView(v)}
                disabled={!enabled}
                title={enabled ? '' : 'Kommer snart'}
                className={`flex-1 py-2 rounded-full transition-all duration-300 text-sm whitespace-nowrap ${
                  !enabled ? disabledTab : view === v ? activeTab : inactiveTab
                }`}
                style={enabled && view === v ? { background: P } : {}}
              >
                {label}
              </button>
            ))}
          </div>

          <main className="max-w-2xl mx-auto">
            {view === 'list' && <ListView />}
            {view === 'flashcards' && <FlashcardView />}
            {view === 'lucktext' && <LucktextView />}
            {view === 'scenario' && <ScenarioView />}
            {view === 'icke' && <IckeExView />}
          </main>

          <footer className="mt-12 text-center text-slate-400 text-sm italic pb-8">Källa: Brott och straff – begreppslista</footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
    <script src="feedback-widget.js" defer></script>
    <script data-goatcounter="https://johnblixt.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
