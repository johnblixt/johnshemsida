function normalizeAnswer(s) {
  return (s || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');
}

function gradeFeedback(pct) {
  if (pct >= 90) return { emoji: '🏆', text: 'Utmärkt! Redo för provet!' };
  if (pct >= 80) return { emoji: '🎉', text: 'Bra jobbat! Nästan i mål.' };
  if (pct >= 50) return { emoji: '💪', text: 'På god väg – öva lite till.' };
  return { emoji: '📚', text: 'Öva mer på begreppen.' };
}

// PROGRESS- OCH RANK-SYSTEM (sessionStorage, ingen backend)
// ════════════════════════════════════════════════════════════
const VIEWS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];
const ACTIVE_VIEWS = { 'Lista': true, 'Flashcards': true, 'Lucktext': true, 'Scenario': true, 'Icke-ex.': true };
const SCORE_VIEWS = ['Lucktext', 'Scenario', 'Icke-ex.'];
const PROGRESS_KEY = 'sh1a1_privatekonomi_progress';
const RANK_SALT = 'sh1a1privatekonomisakerhet';
const RANK_ORDER = { D: 1, C: 2, B: 3, A: 4, S: 5 };

function loadProgress() {
  try {
    const raw = sessionStorage.getItem(PROGRESS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { completed: {}, best: {} };
}

function saveProgress(progress) {
  try {
    sessionStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (e) {}
}

function computeRank(progress) {
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  if (completedCount === 0) return null;
  if (completedCount === 5) {
    const allPerfect = SCORE_VIEWS.every(v => (progress.best[v] || 0) >= 100);
    return allPerfect ? 'S' : 'A';
  }
  if (completedCount === 4) return 'A';
  if (completedCount === 3) return 'B';
  if (completedCount === 2) return 'C';
  return 'D';
}

function computeVerificationCode(progress, rank) {
  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const completedViews = VIEWS.filter(v => progress.completed[v]).sort().join(',');
  const input = dateStr + '|' + completedViews + '|' + (rank || '-') + '|' + RANK_SALT;
  let hash = 0;
  for (let i = 0; i < input.length; i++) {
    hash = (hash + input.charCodeAt(i) * (i + 1)) % 1679616; // 36^4
  }
  return 'SH1A1PEK-' + hash.toString(36).toUpperCase().padStart(4, '0');
}

function ListView({ onComplete }) {
  const [query, setQuery] = useState('');
  const sentinelRef = useRef(null);

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) onComplete();
    }, { threshold: 1.0 });
    observer.observe(el);
    return () => observer.disconnect();
  }, [onComplete]);

  const filtered = concepts.filter(c =>
    c.term.toLowerCase().includes(query.toLowerCase()) ||
    c.definition.toLowerCase().includes(query.toLowerCase())
  );

  return (
    <div>
      <input
        type="text"
        value={query}
        onChange={e => setQuery(e.target.value)}
        placeholder="🔍 Sök begrepp eller definition..."
        className="w-full mb-6 px-5 py-3 rounded-2xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 text-lg"
        style={{ '--tw-ring-color': PRIMARY }}
      />
      <div className="flex flex-col gap-3">
        {filtered.map((c) => (
          <div
            key={c.id}
            className="bg-white rounded-2xl shadow-sm p-5 border-l-8 hover:shadow-md transition-shadow"
            style={{ borderColor: PRIMARY }}
          >
            <div className="flex items-start gap-3">
              <span
                className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold font-fredoka mt-0.5"
                style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
              >
                {c.id}
              </span>
              <div>
                <p className="font-bold text-lg text-slate-800">{c.term}</p>
                <p className="text-slate-500 mt-1 leading-relaxed">{c.definition}</p>
              </div>
            </div>
          </div>
        ))}
        {filtered.length === 0 && (
          <p className="text-center text-slate-400 mt-8">Inga begrepp matchade sökningen.</p>
        )}
      </div>
      <div ref={sentinelRef} style={{ height: 1 }} />
    </div>
  );
}

  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

  const restartAll = () => {
    setDeck(shuffleArray(concepts));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
      onComplete();
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray(kudeInte));
    setDeckIdx(0);

    </div>

      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>

          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde</p>
          </div>

          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>

        </div>

          <p className="text-xl font-bold text-slate-400">{remaining}</p>

function LucktextView({ onComplete }) {
  const makeInitialState = () => {
    const s = {};
    LUCKTEXT_ITEMS.forEach(it => { s[it.id] = { value: '', status: 'unanswered' }; });
    return s;
  };

  const [order, setOrder] = useState(() => shuffleArray(LUCKTEXT_ITEMS));
  const [state, setState] = useState(makeInitialState);
  const [finished, setFinished] = useState(false);

  const correctCount = order.filter(it => state[it.id].status === 'correct').length;
  const resolvedCount = order.filter(it => state[it.id].status === 'correct' || state[it.id].status === 'revealed').length;
  const allResolved = resolvedCount === order.length;

  useEffect(() => {
    if (allResolved && !finished) {
      setFinished(true);
      onComplete(Math.round((correctCount / order.length) * 100));
    }
  }, [allResolved]);

  const handleChange = (id, value) => {
    setState(prev => ({ ...prev, [id]: { ...prev[id], value } }));
  };

  const handleSubmit = (id) => {
    const item = LUCKTEXT_ITEMS.find(o => o.id === id);
    setState(prev => {
      const cur = prev[id];
      if (cur.status === 'correct' || cur.status === 'revealed') return prev;
      const norm = normalizeAnswer(cur.value);
      const isCorrect = item.answers.some(a => normalizeAnswer(a) === norm);
      if (isCorrect) {
        return { ...prev, [id]: { ...cur, status: 'correct' } };
      }
      return { ...prev, [id]: { ...cur, status: cur.status === 'wrong1' || cur.status === 'wrong2' ? 'wrong2' : 'wrong1' } };
    });
  };

  const revealAll = () => {
    setState(prev => {
      const next = { ...prev };
      order.forEach(it => {
        if (next[it.id].status !== 'correct') {
          next[it.id] = { ...next[it.id], status: 'revealed' };
        }
      });
      return next;
    });
  };

  const restart = () => {
    setOrder(shuffleArray(LUCKTEXT_ITEMS));
    setState(makeInitialState());
    setFinished(false);
  };

  if (finished) {
    return <ResultCard correct={correctCount} total={order.length} onRestart={restart} />;
  }

  return (
    <div>
      <div className="bg-white rounded-2xl shadow-sm p-4 mb-6 border" style={{ borderColor: PRIMARY_LIGHT }}>
        <p className="text-xs uppercase tracking-wide text-slate-400 font-fredoka font-bold mb-2">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {concepts.map(c => {
            const st = state[c.id];
            const done = st.status === 'correct';
            const revealed = st.status === 'revealed';
            return (
              <span
                key={c.id}
                className={
                  'text-xs px-2.5 py-1 rounded-full font-fredoka border ' +
                  (done
                    ? 'line-through text-green-600 border-green-300 bg-green-50'
                    : revealed
                      ? 'line-through text-slate-400 border-slate-200 bg-slate-50'
                      : 'text-slate-600 border-slate-200')
                }
              >
                {c.term}
              </span>
            );
          })}
        </div>
      </div>

      <div className="flex items-center justify-between mb-4 flex-wrap gap-2 sticky top-0 bg-green-50 py-2 z-10">
        <span className="text-sm font-semibold text-slate-600 font-fredoka">{correctCount} / {order.length} rätta hittills</span>
        <button onClick={revealAll} className="text-sm font-bold font-fredoka px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition-colors">
          Rätta alla
        </button>
      </div>

      <div className="flex flex-col gap-3">
        {order.map(item => {
          const st = state[item.id];
          const locked = st.status === 'correct' || st.status === 'revealed';
          const [before, after] = item.sentence.split('___');
          const boxClass =
            st.status === 'correct' ? 'border-green-400 bg-green-50' :
            st.status === 'revealed' ? 'border-red-300 bg-red-50' :
            st.status === 'wrong2' ? 'border-red-200' :
            st.status === 'wrong1' ? 'border-amber-300' : 'border-slate-100';
          return (
            <div key={item.id} className={'bg-white rounded-2xl shadow-sm p-4 border-2 transition-colors ' + boxClass}>
              <p className="text-slate-700 leading-relaxed">
                {before}
                <input
                  type="text"
                  value={st.value}
                  disabled={locked}
                  onChange={e => handleChange(item.id, e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') handleSubmit(item.id); }}
                  placeholder="skriv begrepp..."
                  className={
                    'inline-block mx-1 px-2 py-1 rounded-lg border-b-2 text-center font-semibold focus:outline-none bg-transparent ' +
                    (locked ? 'border-slate-300' : 'border-slate-300 focus:border-green-400')
                  }
                  style={{ minWidth: '160px' }}
                />
                {after}
              </p>
              {st.status === 'wrong1' && (
                <p className="text-amber-600 text-sm font-semibold font-fredoka mt-1">Är du säker att du stavat rätt? Försök igen.</p>
              )}
              {st.status === 'wrong2' && (
                <p className="text-red-500 text-sm font-semibold font-fredoka mt-1">Fel svar. Försök igen eller tryck "Rätta alla".</p>
              )}
              {st.status === 'correct' && (
                <div className="mt-1">
                  <p className="text-green-700 font-bold font-fredoka text-sm">✓ {item.term}</p>
                  <p className="text-slate-500 text-sm mt-0.5">{item.explanation}</p>
                </div>
              )}
              {st.status === 'revealed' && (
                <div className="mt-1">
                  <p className="text-red-600 font-bold font-fredoka text-sm">Rätt svar: {item.term}</p>
                  <p className="text-slate-500 text-sm mt-0.5">{item.explanation}</p>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ScenarioView({ onComplete }) {
  const buildItems = () => shuffleArray(SCENARIO_ITEMS).map(it => ({ ...it, options: shuffleArray(it.options) }));

  const [items, setItems] = useState(buildItems);
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [finished, setFinished] = useState(false);

  const total = items.length;
  const item = items[idx];

  const choose = (opt) => {
    if (selected) return;
    setSelected(opt);
    if (opt === item.correct) setScore(s => s + 1);
  };

  const next = () => {
    if (idx + 1 >= total) {
      setFinished(true);
      onComplete(Math.round((score / total) * 100));
    } else {
      setIdx(i => i + 1);
      setSelected(null);
    }
  };

  const restart = () => {
    setItems(buildItems());
    setIdx(0);
    setSelected(null);
    setScore(0);
    setFinished(false);
  };

  if (finished) {
    return <ResultCard correct={score} total={total} onRestart={restart} />;
  }

  return (
    <div className="flex flex-col items-center">
      <div className="w-full max-w-lg mb-4">
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-sm font-semibold text-slate-600 font-fredoka">Fråga {idx + 1} av {total}</span>
          <span className="text-sm font-semibold text-slate-400 font-fredoka">{score} rätt hittills</span>
        </div>
        <div className="w-full bg-slate-200 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all" style={{ width: `${(idx / total) * 100}%`, background: PRIMARY }} />
        </div>
      </div>

      <div className="bg-white rounded-3xl shadow-sm p-6 w-full max-w-lg border" style={{ borderColor: PRIMARY_LIGHT }}>
        <p className="text-lg text-slate-800 leading-relaxed mb-5">{item.scenario}</p>
        <div className="flex flex-col gap-3">
          {item.options.map(opt => {
            let cls = 'border-slate-200 hover:border-slate-300 text-slate-700';
            if (selected) {
              if (opt === item.correct) cls = 'border-green-400 bg-green-50 text-green-700';
              else if (opt === selected) cls = 'border-red-400 bg-red-50 text-red-600';
              else cls = 'border-slate-100 text-slate-400';
            }
            return (
              <button
                key={opt}
                disabled={!!selected}
                onClick={() => choose(opt)}
                className={'text-left px-4 py-3 rounded-2xl border-2 font-medium font-fredoka transition-colors ' + cls}
              >
                {opt}
              </button>
            );
          })}
        </div>
        {selected && (
          <div className="mt-5 p-4 rounded-2xl bg-slate-50">
            <p className="text-slate-600 text-sm leading-relaxed">{item.explanation}</p>
          </div>
        )}
      </div>

      {selected && (
        <button onClick={next} className="mt-5 text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
          {idx + 1 >= total ? 'Se resultat' : 'Nästa fråga →'}
        </button>
      )}
    </div>
  );
}

      </div>

      <div className="bg-white rounded-3xl shadow-sm p-6 w-full max-w-lg border" style={{ borderColor: PRIMARY_LIGHT }}>
        <p className="text-xs uppercase tracking-wide text-slate-400 font-fredoka font-bold mb-1">Vilket exempel stämmer på begreppet?</p>
        <p className="text-xl font-bold mb-5" style={{ color: PRIMARY_TEXT }}>{item.term}</p>
        <div className="flex flex-col gap-3">
          <button disabled={!!selected} onClick={() => choose('A')} className={'text-left px-4 py-3 rounded-2xl border-2 font-medium transition-colors ' + optionClass('A')}>
            <span className="font-fredoka font-bold mr-2">A</span>{item.optionA}
          </button>
          <button disabled={!!selected} onClick={() => choose('B')} className={'text-left px-4 py-3 rounded-2xl border-2 font-medium transition-colors ' + optionClass('B')}>
            <span className="font-fredoka font-bold mr-2">B</span>{item.optionB}
          </button>
        </div>
        {selected && (
          <div className="mt-5 p-4 rounded-2xl bg-slate-50">
            <p className={'font-bold font-fredoka text-sm mb-1 ' + (selected === item.correctLetter ? 'text-green-700' : 'text-red-600')}>
              {selected === item.correctLetter ? '✓ Rätt!' : `✗ Fel — rätt svar är ${item.correctLetter}`}
            </p>
            <p className="text-slate-600 text-sm leading-relaxed">{item.explanation}</p>
          </div>
        )}
      </div>

      {selected && (
        <button onClick={next} className="mt-5 text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
          {idx + 1 >= total ? 'Se resultat' : 'Nästa fråga →'}
        </button>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// HEADER + NAVIGERING
// ════════════════════════════════════════════════════════════
function Header({ activeView, setActiveView, progress, rank, completedCount, code }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-6 flex-wrap gap-2">
        <a
          href="index.html"
          onClick={(e) => { e.preventDefault(); smartBack('index.html'); }}
          className="text-sm font-semibold transition-colors"
          style={{ color: PRIMARY_TEXT }}
        >
          ← Tillbaka till startsidan
        </a>
        <div className="w-32 hidden sm:block"></div>
      </div>

      <h1 className="text-3xl md:text-4xl font-bold italic text-center uppercase tracking-wide mb-1" style={{ color: PRIMARY_TEXT }}>
        Privatekonomi
      </h1>
      <p className="text-center text-slate-400 text-sm mb-6 font-fredoka">Samhällskunskap 1a1 — Begrepp</p>

      {/* Progress + rank */}
      <div className="mb-4">
        <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
          <span className="text-sm font-semibold text-slate-600 font-fredoka">{completedCount}/5 avsnitt klara</span>
          {rank && (
            <span
              className="text-xs font-bold px-2.5 py-1 rounded-full font-fredoka"
              style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
            >
              Rank: {rank} · Kod: {code}
            </span>
          )}
        </div>
        <div className="w-full bg-slate-200 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all" style={{ width: `${(completedCount / 5) * 100}%`, background: PRIMARY }} />
        </div>
      </div>

      {/* Toggle */}
      <div className="view-tabs flex flex-wrap justify-center gap-1 bg-white rounded-full p-1 shadow-sm border border-slate-200 mb-8 font-fredoka text-sm max-w-full overflow-x-auto">
        {VIEWS.map((view) => {
          const active = ACTIVE_VIEWS[view];
          return (
            <button
              key={view}
              disabled={!active}
              onClick={() => active && setActiveView(view)}
              title={!active ? 'Kommer snart' : undefined}
              className={
                'px-4 py-2 rounded-full font-bold transition-colors whitespace-nowrap ' +
                (!active
                  ? 'text-slate-300 cursor-not-allowed'
                  : activeView === view
                    ? 'text-white'
                    : 'text-slate-500 hover:text-slate-700')
              }
              style={activeView === view && active ? { background: PRIMARY } : {}}
            >
              {view}
              {progress.completed[view] && (
                <span className="ml-1" style={{ color: activeView === view ? '#fff' : '#16a34a' }}>✓</span>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════
function App() {
  const [activeView, setActiveView] = useState('Lista');
  const [progress, setProgress] = useState(loadProgress);
  const [celebrateRank, setCelebrateRank] = useState(null);
  const prevRankRef = useRef(computeRank(loadProgress()));

  useEffect(() => {
    saveProgress(progress);
  }, [progress]);

  const markComplete = useCallback((view, pct) => {
    setProgress(prev => {
      const nextCompleted = { ...prev.completed };
      const nextBest = { ...prev.best };
      let changed = false;

      if (typeof pct === 'number' && !(nextBest[view] >= pct)) {
        nextBest[view] = pct;
        changed = true;
      }

      const thresholdMet = typeof pct === 'number' ? pct >= 80 : true;
      if (thresholdMet && !nextCompleted[view]) {
        nextCompleted[view] = true;
        changed = true;
      }

      return changed ? { completed: nextCompleted, best: nextBest } : prev;
    });
  }, []);

  const completeLista = useCallback(() => markComplete('Lista'), [markComplete]);
  const completeFlashcards = useCallback(() => markComplete('Flashcards'), [markComplete]);
  const completeLucktext = useCallback((pct) => markComplete('Lucktext', pct), [markComplete]);
  const completeScenario = useCallback((pct) => markComplete('Scenario', pct), [markComplete]);
  const completeIckeEx = useCallback((pct) => markComplete('Icke-ex.', pct), [markComplete]);

  const rank = computeRank(progress);
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  const code = computeVerificationCode(progress, rank);

  useEffect(() => {
    const prevOrder = prevRankRef.current ? RANK_ORDER[prevRankRef.current] : 0;
    const newOrder = rank ? RANK_ORDER[rank] : 0;
    if (newOrder > prevOrder) {
      setCelebrateRank(rank);
      const t = setTimeout(() => setCelebrateRank(null), 2500);
      prevRankRef.current = rank;
      return () => clearTimeout(t);
    }
    prevRankRef.current = rank;
  }, [rank]);

  return (
    <div className="max-w-2xl mx-auto px-4 py-6">
      <Header
        activeView={activeView}
        setActiveView={setActiveView}
        progress={progress}
        rank={rank}
        completedCount={completedCount}
        code={code}
      />

      <div className="pb-16">
        {activeView === 'Lista' && <ListView onComplete={completeLista} />}
        {activeView === 'Flashcards' && <FlashcardView key="flashcards" onComplete={completeFlashcards} />}
        {activeView === 'Lucktext' && <LucktextView key="lucktext" onComplete={completeLucktext} />}
        {activeView === 'Scenario' && <ScenarioView key="scenario" onComplete={completeScenario} />}
        {activeView === 'Icke-ex.' && <IckeExView key="ickeex" onComplete={completeIckeEx} />}
      </div>

      <footer className="text-center text-slate-400 italic text-sm pb-8">
        Källa: Samhällskunskap 1a1 — Privatekonomi, begreppslista
      </footer>

      {/* Rank celebration overlay */}
      {celebrateRank && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 px-4"
          style={{ background: 'rgba(15, 23, 42, 0.55)' }}
          onClick={() => setCelebrateRank(null)}
        >
          <div className="bg-white rounded-3xl px-10 py-8 text-center shadow-2xl">
            <div className="text-5xl mb-3">{celebrateRank === 'S' ? '🎉🏆🎉' : '🎉'}</div>
            <p className="text-3xl font-bold" style={{ color: PRIMARY_TEXT }}>{celebrateRank}-RANK!</p>
            <p className="text-slate-400 text-sm mt-2">Ny rank uppnådd</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
