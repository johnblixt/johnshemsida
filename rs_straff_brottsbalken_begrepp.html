<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brottsbalken och specialstrafflagarna – Begrepp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --primary: #0d9488; --primary-light: #ccfbf1; --primary-text: #134e4a; }
  * { font-family: 'EB Garamond', serif; }
  body { background: #f8fafc; }

  .flip-card { perspective: 1000px; height: 350px; width: 100%; max-width: 400px; cursor: pointer; }
  .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
  .flipped-classes { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
  .flip-card-back { transform: rotateY(180deg); }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const PRIMARY = "#0d9488";
const PRIMARY_LIGHT = "#ccfbf1";
const PRIMARY_TEXT = "#134e4a";

function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function smartBack() {
  try {
    if (document.referrer && new URL(document.referrer).hostname === window.location.hostname) {
      history.back();
      return;
    }
  } catch (e) {}
  window.location.href = "index.html";
}

const concepts = [
  { term: "Brottsbalken (BrB)", definition: "Består av författningar där de flesta brotten beskrivs." },
  { term: "Specialstraffrätten", definition: "Flera specialstrafflagar som reglerar övriga straffbelagda brott, som inte står angivna i brottsbalken." },
  { term: "Mord", definition: "Sker när en person avsiktligt dödat en annan människa." },
  { term: "Dråp", definition: "Avsiktligt dödat en annan människa, men brottet är mindre grovt." },
  { term: "Misshandel", definition: "Att tillfoga en annan person kroppsskada eller smärta. Både psykisk och fysisk." },
  { term: "Vållande till annans död", definition: "Den som av oaktsamhet gör sig skyldig till en annan människas död." },
  { term: "Olaga hot", definition: "När någon hotar en person med våld, med eller utan vapen, för att inge fruktan." },
  { term: "Hemfridsbrott och olaga intrång", definition: "Att ta sig in i någon annans bostad utan lov, eller vägra att lämna bostaden efter att ha blivit uppmanad att gå." },
  { term: "Olaga förföljelse (\"stalkning\")", definition: "Innebär att någon begår upprepade brottsliga handlingar mot en annan person." },
  { term: "Äktenskapstvång", definition: "Att tvinga ett barn att gifta sig mot sin vilja." },
  { term: "Människorov", definition: "Att föra bort någon mot dennes vilja." },
  { term: "Olaga tvång", definition: "När någon tvingas, med våld eller hot om våld, att göra något som den inte vill göra." },
  { term: "Stöld", definition: "Sker när någon tar något från någon annan med avsikten att behålla det." },
  { term: "Rån", definition: "Att hota med, eller bruka, våld för att få den andres egendom." },
  { term: "Tillgrepp av fortskaffningsmedel", definition: "Är när någon tar en bil för att köra med den, men inte har för avsikt att behålla den." },
  { term: "Självtäkt", definition: "Att ta tillbaka sin egendom på egen hand som någon annan bestulit en på, exempelvis en cykel." },
  { term: "Bedrägeri", definition: "Är att lura till sig pengar eller vinning för gärningspersonen, medan den vilseledde förlorar på det." },
  { term: "Häleri", definition: "När någon hanterar någon annans stöldgods, exempelvis genom att sälja det vidare." },
  { term: "Förskingring", definition: "När en gärningsperson utnyttjar sin förtroendeställning för egen vinning." },
  { term: "Tagande av muta", definition: "Att ta mutor av leverantörer eller andra inför kommande beslut eller affärsuppgörelser." },
  { term: "Givande av muta (\"bestickning\")", definition: "Att muta någon genom pengar eller gåvor av ett visst värde." },
  { term: "Våldtäkt", definition: "Samlag eller en annan sexuell handling som sker utan samtycke." },
  { term: "Sexuellt övergrepp", definition: "Är andra sexuella handlingar än samlag som sker utan samtycke." },
  { term: "Förtal", definition: "Är att utsätta en annan person för missaktning." },
  { term: "Förolämpning", definition: "Är ett kränkande tillmäle eller beskyllning som i sammanhanget bedöms som milt." },
  { term: "Urkundsförfalskning", definition: "Är att förfalska en legitimation eller utge sig för att vara en annan person genom att förfalska dennes namnteckning." },
  { term: "Mordbrand", definition: "Sker när någon anlägger en brand som innebär fara för annans liv eller hälsa, eller fara för omfattande förstörelse av annans egendom." },
  { term: "Upplopp", definition: "Sker om exempelvis deltagarna i en demonstration hindrar polisen eller begår brott tillsammans, som att forcera en avspärrning." },
  { term: "Nödvärnsrätten", definition: "Rätten att använda våld i en nödsituation om våldet inte är uppenbart oförsvarligt." },
  { term: "Nödvärnsexcess", definition: "Innebär att en person som blir utsatt för exempelvis våld brukar mer våld mot gärningspersonen än vad situationen kräver." },
];

function Header() {
  return (
    <div className="flex items-center justify-between max-w-4xl mx-auto px-4 pt-6 pb-2">
      <button
        onClick={smartBack}
        className="text-sm font-medium transition-colors"
        style={{ color: PRIMARY_TEXT }}
        onMouseOver={e => e.currentTarget.style.color = PRIMARY}
        onMouseOut={e => e.currentTarget.style.color = PRIMARY_TEXT}
      >
        ← Tillbaka till startsidan
      </button>
      <h1 className="text-xl sm:text-2xl font-bold italic text-center flex-1" style={{ color: PRIMARY_TEXT }}>
        Brottsbalken &amp; Specialstrafflagarna
      </h1>
      <div className="w-32"></div>
    </div>
  );
}

function ToggleRow({ view, setView }) {
  const tabs = [
    { key: "lista", label: "Lista", disabled: false },
    { key: "flashcards", label: "Flashcards", disabled: false },
    { key: "lucktext", label: "Lucktext", disabled: true },
    { key: "scenario", label: "Scenario", disabled: true },
    { key: "ickeex", label: "Icke-ex.", disabled: true },
  ];
  return (
    <div className="flex justify-center px-4 mb-8">
      <div className="inline-flex flex-wrap justify-center gap-1 bg-white rounded-full p-1 shadow-sm border border-slate-200">
        {tabs.map(tab => (
          <button
            key={tab.key}
            disabled={tab.disabled}
            onClick={() => !tab.disabled && setView(tab.key)}
            title={tab.disabled ? "Kommer snart" : ""}
            className={
              "px-4 py-2 rounded-full text-sm font-semibold transition-all " +
              (tab.disabled
                ? "text-slate-300 cursor-not-allowed"
                : view === tab.key
                  ? "text-white shadow"
                  : "text-slate-500 hover:text-slate-700")
            }
            style={view === tab.key && !tab.disabled ? { background: PRIMARY } : {}}
          >
            {tab.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function ListView() {
  const [query, setQuery] = useState("");

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return concepts;
    return concepts.filter(c =>
      c.term.toLowerCase().includes(q) || c.definition.toLowerCase().includes(q)
    );
  }, [query]);

  return (
    <div className="max-w-2xl mx-auto px-4 pb-16">
      <input
        type="text"
        value={query}
        onChange={e => setQuery(e.target.value)}
        placeholder="🔍 Sök begrepp eller definition..."
        className="w-full mb-6 px-5 py-3 rounded-2xl border border-slate-200 shadow-sm text-lg focus:outline-none focus:ring-2"
        style={{ '--tw-ring-color': PRIMARY }}
      />
      <div className="flex flex-col gap-3">
        {filtered.map((c, i) => {
          const idx = concepts.indexOf(c) + 1;
          return (
            <div
              key={c.term}
              className="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow p-5 pl-6"
              style={{ borderLeft: `8px solid ${PRIMARY}` }}
            >
              <div className="flex items-start gap-3">
                <span
                  className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold"
                  style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
                >
                  {idx}
                </span>
                <div>
                  <p className="font-bold text-lg" style={{ color: PRIMARY_TEXT }}>{c.term}</p>
                  <p className="text-slate-600 mt-1">{c.definition}</p>
                </div>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && (
          <p className="text-center text-slate-400 mt-10">Inga begrepp matchade din sökning.</p>
        )}
      </div>
    </div>
  );
}

function FlashcardView() {
  const total = concepts.length;
  const [deck, setDeck] = useState(() => shuffleArray([...concepts]));
  const [deckIdx, setDeckIdx] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

  const restartAll = () => {
    setDeck(shuffleArray([...concepts]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray([...kudeInte]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6 px-4 pb-16">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>Börja om med alla</button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6 px-4 pb-16">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center px-4 pb-16">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back" style={{ border: `2px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("lista");

  return (
    <div className="min-h-screen pb-10">
      <Header />
      <ToggleRow view={view} setView={setView} />
      {view === "lista" && <ListView />}
      {view === "flashcards" && <FlashcardView key="flashcards" />}
      <footer className="text-center text-slate-400 italic text-sm mt-10">
        Källa: Brottsbalken och specialstrafflagarna begreppslista
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
