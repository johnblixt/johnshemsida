function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function gradeText(pct) {
  if (pct >= 90) return 'Utmärkt! Redo för provet!';
  if (pct >= 70) return 'Bra jobbat! Nästan redo.';
  if (pct >= 50) return 'På god väg, men öva lite till.';
  return 'Öva mer på begreppen innan provet.';
}

    return concepts.filter(c =>
      c.term.toLowerCase().includes(q) || c.definition.toLowerCase().includes(q)
    );
  }, [query]);

  return (
    <div className="max-w-2xl mx-auto px-4 pb-16">
      <input
        type="text"
        value={query}
        onChange={e => setQuery(e.target.value)}
        placeholder="🔍 Sök begrepp eller definition..."

        style={{ '--tw-ring-color': PRIMARY }}

        {filtered.map((c, i) => {
          const idx = concepts.indexOf(c) + 1;
          return (
            <div

              style={{ borderLeft: `8px solid ${PRIMARY}` }}

function FlashcardView() {
  const total = concepts.length;
  const [deck, setDeck] = useState(() => shuffleArray([...concepts]));
  const [deckIdx, setDeckIdx] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

  const restartAll = () => {
    setDeck(shuffleArray([...concepts]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray([...kudeInte]));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6 px-4 pb-16">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>Börja om med alla</button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6 px-4 pb-16">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center px-4 pb-16">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-3xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back" style={{ border: `2px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function LucktextView() {
  const initial = () => concepts.map(() => ({ value: '', status: 'idle', attempts: 0 }));
  const [items, setItems] = useState(initial);

  const setValue = (i, value) => {
    setItems(prev => {
      const next = [...prev];
      next[i] = { ...next[i], value };
      return next;
    });
  };

  const submit = (i) => {
    setItems(prev => {
      const item = prev[i];
      if (item.status === 'correct' || item.status === 'revealed') return prev;
      const norm = item.value.trim().toLowerCase();
      const ok = lucktextData[i].answers.includes(norm);
      const next = [...prev];
      if (ok) {
        next[i] = { ...item, status: 'correct' };
      } else {
        const attempts = item.attempts + 1;
        next[i] = { ...item, attempts, status: attempts >= 2 ? 'wrong2' : 'wrong1' };
      }
      return next;
    });
  };

  const correctAll = () => {
    setItems(prev => prev.map(item => item.status === 'correct' ? item : { ...item, status: 'revealed' }));
  };

  const restart = () => setItems(initial());

  const score = items.filter(it => it.status === 'correct').length;
  const total = concepts.length;
  const allDone = items.every(it => it.status === 'correct' || it.status === 'revealed');

  return (
    <div className="max-w-2xl mx-auto px-4 pb-16">
      <div className="bg-white rounded-2xl border-2 border-slate-200 p-4 mb-6">
        <p className="text-sm font-bold text-slate-500 uppercase tracking-wide mb-3">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {concepts.map((c, i) => {
            const done = items[i].status === 'correct' || items[i].status === 'revealed';
            return (
              <span key={i} className={`text-xs px-3 py-1 rounded-full border ${done ? 'line-through text-slate-300 border-slate-200 bg-slate-50' : 'text-slate-700 border-slate-300 bg-white'}`}>
                {c.term}
              </span>
            );
          })}
        </div>
      </div>

      <div className="flex items-center justify-between mb-4">
        <p className="text-sm font-bold text-slate-500">{score} / {total} rätt</p>
        <div className="flex gap-2">
          <button onClick={correctAll} className="text-xs font-bold px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition-colors">Rätta alla</button>
          <button onClick={restart} className="text-xs font-bold px-4 py-2 rounded-xl border-2 border-slate-300 text-slate-600 hover:bg-slate-100 transition-colors">Börja om</button>
        </div>
      </div>

      {allDone && (
        <div className="bg-white border-2 rounded-3xl p-6 text-center mb-6" style={{ borderColor: PRIMARY }}>
          <p className="text-2xl font-bold mb-1" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
          <p className="text-slate-600">{gradeText((score / total) * 100)}</p>
        </div>
      )}

      <div className="grid gap-4">
        {lucktextData.map((data, i) => {
          const item = items[i];
          const locked = item.status === 'correct' || item.status === 'revealed';
          const borderClass =
            item.status === 'correct' ? 'border-green-500' :
            item.status === 'revealed' ? 'border-red-400' :
            item.status === 'wrong2' ? 'border-red-300' :
            item.status === 'wrong1' ? 'border-orange-300' :
            'border-slate-200';
          return (
            <div key={i} className={`bg-white p-5 rounded-2xl border-2 ${borderClass}`}>
              <p className="leading-relaxed">
                <span className="text-slate-400 font-bold mr-1">{i + 1}.</span>
                {data.pre}
                <input
                  type="text"
                  value={item.value}
                  disabled={locked}
                  onChange={e => setValue(i, e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') submit(i); }}
                  className={`inline-block mx-1 px-2 py-1 border-b-2 focus:outline-none w-40 text-center ${locked ? 'bg-slate-50' : 'bg-white'}`}
                  style={{ borderColor: item.status === 'correct' ? '#16a34a' : item.status === 'revealed' ? '#dc2626' : PRIMARY }}
                />
                {data.post}
              </p>
              {item.status === 'wrong1' && <p className="text-orange-500 text-sm font-bold mt-2">Är du säker att du stavat rätt?</p>}
              {item.status === 'wrong2' && <p className="text-red-600 text-sm font-bold mt-2">Fel. Kontrollera stavningen och försök igen.</p>}
              {item.status === 'correct' && <p className="text-green-700 text-sm mt-2">✓ Rätt! {concepts[i].definition}</p>}
              {item.status === 'revealed' && <p className="text-red-600 text-sm mt-2">Rätt svar: <strong>{concepts[i].term}</strong>. {concepts[i].definition}</p>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ScenarioView() {
  const total = scenarioData.length;
  const buildOrder = () => shuffleArray(scenarioData.map((_, i) => i));
  const [order, setOrder] = useState(buildOrder);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [phase, setPhase] = useState('playing');

  const dataIdx = order[qIdx];
  const q = scenarioData[dataIdx];
  const concept = concepts[dataIdx];
  const options = useMemo(() => shuffleArray([concept.term, ...q.distractors]), [dataIdx]);

  const choose = (opt) => {
    if (selected !== null) return;
    setSelected(opt);
    if (opt === concept.term) setScore(s => s + 1);
  };

  const next = () => {
    if (qIdx + 1 >= total) {
      setPhase('done');
    } else {
      setQIdx(qIdx + 1);
      setSelected(null);
    }
  };

  const restart = () => {
    setOrder(buildOrder());
    setQIdx(0);
    setSelected(null);
    setScore(0);
    setPhase('playing');
  };

  if (phase === 'done') {
    const pct = (score / total) * 100;
    return (
      <div className="max-w-2xl mx-auto px-4 pb-16">
        <div className="bg-white border-2 rounded-3xl p-8 text-center" style={{ borderColor: PRIMARY }}>
          <p className="text-3xl font-bold mb-2" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
          <p className="text-slate-600 mb-6">{gradeText(pct)}</p>
          <button onClick={restart} style={{ background: PRIMARY }} className="text-white px-8 py-3 rounded-2xl font-bold">Gör om</button>
        </div>
      </div>
    );
  }

  return (
    <div className="max-w-2xl mx-auto px-4 pb-16">
      <div className="flex items-center justify-between mb-2">
        <p className="text-sm font-bold text-slate-500">Fråga {qIdx + 1} av {total}</p>
        <p className="text-sm font-bold text-slate-500">Poäng: {score}</p>
      </div>
      <div className="w-full bg-slate-200 rounded-full h-2 mb-6">
        <div className="h-2 rounded-full transition-all" style={{ width: `${(qIdx / total) * 100}%`, background: PRIMARY }}></div>
      </div>

      <div className="bg-white p-6 rounded-2xl border-2 border-slate-200 mb-5">
        <p className="text-lg leading-relaxed">{q.scenario}</p>
      </div>

      <div className="grid gap-3">
        {options.map((opt, i) => {
          const isCorrect = opt === concept.term;
          const isSelected = selected === opt;
          let cls = 'bg-white border-2 border-slate-200 hover:border-slate-300';
          if (selected !== null) {
            if (isCorrect) cls = 'bg-green-50 border-2 border-green-500 text-green-800';
            else if (isSelected) cls = 'bg-red-50 border-2 border-red-500 text-red-800';
            else cls = 'bg-white border-2 border-slate-100 text-slate-400';
          }
          return (
            <button key={i} onClick={() => choose(opt)} disabled={selected !== null} className={`text-left px-5 py-3 rounded-2xl font-medium transition-colors ${cls}`}>
              {opt}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <div className="mt-5 bg-slate-50 border-2 border-slate-200 rounded-2xl p-4">
          <p className="text-slate-700">{concept.definition}</p>
          <button onClick={next} style={{ background: PRIMARY }} className="mt-4 text-white px-6 py-2 rounded-xl font-bold">
            {qIdx + 1 >= total ? 'Se resultat' : 'Nästa →'}
          </button>
        </div>
      )}
    </div>
  );
}

function IckeExView() {
  const total = ickeData.length;
  const buildOrder = () => shuffleArray(ickeData.map((_, i) => i));
  const [order, setOrder] = useState(buildOrder);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [phase, setPhase] = useState('playing');

  const dataIdx = order[qIdx];
  const q = ickeData[dataIdx];
  const concept = concepts[dataIdx];

  const choose = (letter) => {
    if (selected !== null) return;
    setSelected(letter);
    if (letter === q.correct) setScore(s => s + 1);
  };

  const next = () => {
    if (qIdx + 1 >= total) {
      setPhase('done');
    } else {
      setQIdx(qIdx + 1);
      setSelected(null);
    }
  };

  const restart = () => {
    setOrder(buildOrder());
    setQIdx(0);
    setSelected(null);
    setScore(0);
    setPhase('playing');
  };

  if (phase === 'done') {
    const pct = (score / total) * 100;
    return (
      <div className="max-w-2xl mx-auto px-4 pb-16">
        <div className="bg-white border-2 rounded-3xl p-8 text-center" style={{ borderColor: PRIMARY }}>
          <p className="text-3xl font-bold mb-2" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
          <p className="text-slate-600 mb-6">{gradeText(pct)}</p>
          <button onClick={restart} style={{ background: PRIMARY }} className="text-white px-8 py-3 rounded-2xl font-bold">Börja om</button>
        </div>
      </div>
    );
  }

  const options = [
    { letter: 'A', text: q.optionA },
    { letter: 'B', text: q.optionB }
  ];

  return (
    <div className="max-w-2xl mx-auto px-4 pb-16">
      <div className="flex items-center justify-between mb-2">
        <p className="text-sm font-bold text-slate-500">Fråga {qIdx + 1} av {total}</p>
        <p className="text-sm font-bold text-slate-500">Poäng: {score}</p>
      </div>
      <div className="w-full bg-slate-200 rounded-full h-2 mb-6">
        <div className="h-2 rounded-full transition-all" style={{ width: `${(qIdx / total) * 100}%`, background: PRIMARY }}></div>
      </div>

      <div className="bg-white p-5 rounded-2xl border-l-8 mb-5 shadow-sm" style={{ borderColor: PRIMARY }}>
        <p className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">Begrepp</p>
        <h3 className="text-xl font-bold">{concept.term}</h3>
      </div>

      <p className="text-sm text-slate-500 mb-3 font-medium">Vilket alternativ är ett korrekt exempel på begreppet?</p>

      <div className="grid gap-3">
        {options.map(opt => {
          const isCorrect = opt.letter === q.correct;
          const isSelected = selected === opt.letter;
          let cls = 'bg-white border-2 border-slate-200 hover:border-slate-300';
          if (selected !== null) {
            if (isCorrect) cls = 'bg-green-50 border-2 border-green-500 text-green-800';
            else if (isSelected) cls = 'bg-red-50 border-2 border-red-500 text-red-800';
            else cls = 'bg-white border-2 border-slate-100 text-slate-400';
          }
          return (
            <button key={opt.letter} onClick={() => choose(opt.letter)} disabled={selected !== null} className={`text-left px-5 py-4 rounded-2xl font-medium transition-colors ${cls}`}>
              <span className="font-bold mr-2">{opt.letter}.</span>{opt.text}
            </button>
          );
        })}
      </div>

      {selected !== null && (
        <div className="mt-5 bg-slate-50 border-2 border-slate-200 rounded-2xl p-4">
          <p className="text-slate-700">{q.explanation}</p>
          <button onClick={next} style={{ background: PRIMARY }} className="mt-4 text-white px-6 py-2 rounded-xl font-bold">
            {qIdx + 1 >= total ? 'Se resultat' : 'Nästa →'}
          </button>
        </div>
      )}
    </div>
  );
}

function App() {
  const [view, setView] = useState("lista");

  return (
    <div className="min-h-screen pb-10">
      <Header />
      <ToggleRow view={view} setView={setView} />
      {view === "lista" && <ListView />}
      {view === "flashcards" && <FlashcardView key="flashcards" />}
      {view === "lucktext" && <LucktextView />}
      {view === "scenario" && <ScenarioView key="scenario" />}
      {view === "ickeex" && <IckeExView key="ickeex" />}
      <footer className="text-center text-slate-400 italic text-sm mt-10">
        Källa: Brottsbalken och specialstrafflagarna begreppslista
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
