      for (let i = shuffled.length - 1; i > 0; i--) {

        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

    function computeKryssRank(bestPct) {

      return 'C';

        hash = (hash + input.charCodeAt(i) * (i + 1)) % 1679616; // 36^4
      }
      return 'KRYSS-' + hash.toString(36).toUpperCase().padStart(4, '0');

            <div className="mb-6">
              <div className="flex justify-between items-end text-xs font-black uppercase tracking-widest text-slate-400 mb-2 px-1">
                <div className="flex flex-col gap-1">
                  <span>Fråga {currentIndex + 1} / {total}</span>
                  <div className="flex items-center gap-1 text-slate-600">
                    <Clock className="w-3 h-3" />
                    <span>{formatTime(timer)}</span>
                  </div>
                </div>
                <span>{t.scoreLabel}{scoreSoFar}</span>
              </div>
              <div className="h-2 w-full bg-slate-200 rounded-full overflow-hidden">
                <div className="h-full bg-orange-400 transition-all duration-300" style={{ width: `${((currentIndex + 1) / total) * 100}%` }}></div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-8 mb-6 border-b-4 border-slate-100">
              <h2 className="text-xl font-bold text-slate-800 leading-snug">
                {easyMode ? currentQ._easy.question : currentQ.question}
              </h2>
            </div>

            <div className="space-y-3">
              {currentQ.options.map((option, index) => {
                const displayText = easyMode ? mapOpt('easy', currentQ, option) : option;
                let btnClasses = "w-full text-left p-5 rounded-xl border-2 transition-all font-bold flex items-center justify-between gap-3 shadow-sm ";
                if (!currentQ.answered) {
                  btnClasses += "border-slate-100 bg-white text-slate-600 hover:border-orange-400 hover:shadow-md active:scale-95";
                } else {
                  if (option === currentQ.correct) {
                    btnClasses += "border-green-500 bg-green-50 text-green-800";
                  } else if (option === currentQ.selected) {
                    btnClasses += "border-red-500 bg-red-50 text-red-800";
                  } else {
                    btnClasses += "border-slate-50 bg-slate-50 text-slate-300 opacity-60";
                  }
                }
                return (
                  <button key={index} onClick={() => handleOptionClick(option)} disabled={currentQ.answered} className={btnClasses}>
                    <span className="text-sm md:text-base">{displayText}</span>
                    {currentQ.answered && option === currentQ.correct && <CheckCircle2 className="w-6 h-6 text-green-500 shrink-0" />}
                    {currentQ.answered && option === currentQ.selected && option !== currentQ.correct && <XCircle className="w-6 h-6 text-red-500 shrink-0" />}
                  </button>
                );
              })}
            </div>

            <div className="mt-8 flex gap-3">
              {currentIndex > 0 && (
                <button onClick={goBack} className="bg-white border-2 border-slate-200 text-slate-600 font-bold py-4 px-5 rounded-xl shadow-sm flex items-center justify-center gap-1 transition-all active:scale-95">
                  <ChevronLeft className="w-5 h-5" /> {t.backBtn}
                </button>
              )}
              {currentQ.answered && (
                <button onClick={goNext} className="flex-1 bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95">
                  {isLast ? t.resultBtn : t.nextBtn}
                  <ChevronRight className="w-5 h-5" />
                </button>
              )}
            </div>
          </div>

          {modal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
                <div className="text-5xl mb-3">{modal.isCorrect ? '✅' : '❌'}</div>
                <h3 className={`text-xl font-black mb-3 ${modal.isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                  {modal.isCorrect ? t.modalCorrectTitle : t.modalWrongTitle}
                </h3>
                <p className="text-slate-600 leading-relaxed mb-6">
                  {easyMode ? modal.question._easy.expl : modal.question.expl}
                </p>
                <button onClick={goNext} className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg transition-all active:scale-95">
                  {isLast ? t.modalResultBtn : t.modalNextBtn}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- YTTRE APP: växlar mellan Övningsquiz och Kryssprov ---
    function App() {
      const [view, setView] = useState('ovning');
      const [subActive, setSubActive] = useState(false);
      const [easyMode, setEasyMode] = useState(() => {
        try { return sessionStorage.getItem(EASY_KEY) === '1'; } catch (e) { return false; }
      });

      useEffect(() => {
        const el = document.getElementById('btn-easy');
        if (el) el.setAttribute('aria-pressed', easyMode ? 'true' : 'false');
      }, [easyMode]);

      useEffect(() => {
        const btn = document.getElementById('btn-easy');
        if (!btn) return;
        const handler = () => {
          setEasyMode(prev => {
            const next = !prev;
            try { sessionStorage.setItem(EASY_KEY, next ? '1' : '0'); } catch (e) {}
            return next;
          });
        };
        btn.addEventListener('click', handler);
        return () => btn.removeEventListener('click', handler);
      }, []);

      useEffect(() => {
        const link = document.getElementById('back-link');
        if (!link) return;
        const handler = (e) => {
          e.preventDefault();
          const ref = document.referrer;
          if (ref && ref.indexOf(location.hostname) !== -1) {
            history.back();
          } else {
            window.location.href = 'index.html';
          }
        };
        link.addEventListener('click', handler);
        return () => link.removeEventListener('click', handler);
      }, []);

      return (
        <div>
          {!subActive && (
            <div className="pt-16 pb-2 flex justify-center px-4">
              <div className="inline-flex bg-white rounded-full p-1 shadow-sm border border-slate-200">
                {Object.keys(VIEW_LABELS).map(key => (
                  <button
                    key={key}
                    onClick={() => { setSubActive(false); setView(key); }}
                    className={"px-5 py-2 rounded-full text-sm font-bold transition-colors " + (view === key ? "text-white" : "text-slate-500 hover:text-slate-700")}
                    style={view === key ? { background: '#fb923c' } : {}}
                  >
                    {VIEW_LABELS[key]}
                  </button>
                ))}
              </div>
            </div>
          )}
          {view === 'ovning'
            ? <OvningsQuiz easyMode={easyMode} onActiveChange={setSubActive} />
            : <KryssprovQuiz easyMode={easyMode} onActiveChange={setSubActive} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
    <script src="feedback-widget.js" defer></script>
    <script data-goatcounter="https://johnblixt.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
