    const shuffleArray = (array) => {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    };

    const formatTime = (seconds) => {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    };

    function mapOpt(variant, q, optStr) {
      if (variant !== 'easy' || !q._easy) return optStr;
      if (optStr === q.correct) return q._easy.correct;
      const idx = q.incorrect.indexOf(optStr);
      if (idx === -1) return optStr;
      return q._easy.incorrect[idx] || optStr;
    }

      const [timer, setTimer] = useState(0);
      const [easyMode, setEasyMode] = useState(() => sessionStorage.getItem(EASY_KEY) === '1');
      const [modal, setModal] = useState(null); // { isCorrect, question }

      const timerRef = useRef(null);
      const t = easyMode ? UI.easy : UI.sv;

      useEffect(() => {
        if (gameState === 'playing') {
          timerRef.current = setInterval(() => setTimer(prev => prev + 1), 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [gameState]);

      useEffect(() => {
        const btn = document.getElementById('btn-easy');
        btn.setAttribute('aria-pressed', easyMode ? 'true' : 'false');
        const handler = () => {
          setEasyMode(prev => {
            const next = !prev;
            sessionStorage.setItem(EASY_KEY, next ? '1' : '0');
            return next;
          });
        };
        btn.addEventListener('click', handler);
        return () => btn.removeEventListener('click', handler);
      }, []);

      useEffect(() => {
        const link = document.getElementById('back-link');
        const handler = (e) => {
          e.preventDefault();
          const ref = document.referrer;
          if (ref && ref.indexOf(location.hostname) !== -1) {
            history.back();
          } else {
            window.location.href = 'index.html';
          }
        };
        link.addEventListener('click', handler);
        return () => link.removeEventListener('click', handler);
      }, []);

      const startGame = () => {
        const shuffledData = shuffleArray(allQuestionsData).map((q, i) => {
          const origIdx = allQuestionsData.indexOf(q);
          return {
            ...q,
            _easy: EASY_Q[origIdx],
            options: shuffleArray([q.correct, ...q.incorrect]),
            selected: null,
            answered: false
          };
        });
        setQuizQuestions(shuffledData);
        setTimer(0);
        setCurrentIndex(0);
        setModal(null);
        setGameState('playing');
      };

      const handleOptionClick = (option) => {
        const q = quizQuestions[currentIndex];
        if (q.answered) return;
        const isCorrect = option === q.correct;
        const updated = [...quizQuestions];
        updated[currentIndex] = { ...q, selected: option, answered: true };
        setQuizQuestions(updated);
        setTimeout(() => setModal({ isCorrect, question: updated[currentIndex] }), 600);
      };

      const closeModalAndAdvance = () => {
        setModal(null);
        goNext();
      };

      const goNext = () => {
        if (currentIndex + 1 < quizQuestions.length) {
          setCurrentIndex(currentIndex + 1);
        } else {
          setGameState('result');
        }
      };

      const goBack = () => {
        if (currentIndex > 0) {
          setModal(null);
          setCurrentIndex(currentIndex - 1);
        }
      };

      const restart = () => startGame();

      if (gameState === 'start') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden border-t-8 border-yellow-400">
              <div className="p-8 text-center">
                <div className="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
                  <Landmark className="w-10 h-10 text-yellow-600" />
                </div>
                <h1 className="text-3xl font-black text-slate-900 mb-2">{t.startTitle}</h1>
                <p className="text-slate-500 mb-8">{t.startSubtitle}</p>
                <button onClick={startGame} className="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
                  {t.startBtn}
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (gameState === 'result') {
        const total = quizQuestions.length;
        const score = quizQuestions.filter(q => q.selected === q.correct).length;
        const wrong = total - score;
        const pct = Math.round((score / total) * 100);
        const missed = quizQuestions.filter(q => q.selected !== q.correct);

        let resultMsg;
        if (pct >= 90) resultMsg = '🏆 Utmärkt! Du behärskar ideologierna, partierna och metoden.';
        else if (pct >= 75) resultMsg = '✅ Redo för provet! Bra resultat.';
        else if (pct >= 55) resultMsg = '📖 Öva lite till, du är på rätt spår.';
        else resultMsg = '💡 Fortsätt repetera pluggmaterialet.';

        return (
          <div className="min-h-screen flex flex-col items-center py-8 p-4">
            <div className="w-full max-w-lg">
              <div className="bg-white rounded-2xl shadow-xl p-8 text-center border-t-8 border-green-400 mb-6">
                <Trophy className="w-20 h-20 mx-auto mb-4 text-yellow-500" />
                <h2 className="text-3xl font-black text-slate-800 mb-2">{t.resultTitle}</h2>
                <div className="mb-4">
                  <p className="text-5xl font-black text-slate-900">{score} / {total}</p>
                  <p className="text-slate-500 font-medium mt-1">{t.timeLbl}{formatTime(timer)}</p>
                </div>
                <p className="text-slate-600 font-medium mb-6">{resultMsg}</p>
                <div className="flex justify-center gap-8 mb-2">
                  <div className="text-center">
                    <p className="text-2xl font-black text-green-600">{score}</p>
                    <p className="text-xs text-slate-400 uppercase tracking-wide">Rätt</p>
                  </div>
                  <div className="text-center">
                    <p className="text-2xl font-black text-red-500">{wrong}</p>
                    <p className="text-xs text-slate-400 uppercase tracking-wide">Fel</p>
                  </div>
                  <div className="text-center">
                    <p className="text-2xl font-black text-slate-700">{pct}%</p>
                    <p className="text-xs text-slate-400 uppercase tracking-wide">Andel rätt</p>
                  </div>
                </div>
              </div>

              {missed.length > 0 && (
                <div className="bg-white rounded-2xl shadow p-6 mb-6">
                  <h3 className="text-lg font-black text-slate-800 mb-3 pb-2 border-b-2 border-slate-100">
                    {t.missedHd} ({missed.length})
                  </h3>
                  <ul className="space-y-2">
                    {missed.map((q, i) => (
                      <li key={i} className="bg-red-50 border-l-4 border-red-400 rounded-lg px-4 py-2 text-sm text-slate-700">
                        {easyMode ? q._easy.question : q.question}
                      </li>
                    ))}
                  </ul>
                </div>
              )}

              <div className="bg-white rounded-2xl shadow p-6 mb-6">
                <h3 className="text-lg font-black text-slate-800 mb-3 pb-2 border-b-2 border-slate-100">{t.facitHd}</h3>
                <div className="space-y-3">
                  {quizQuestions.map((q, i) => {
                    const isCorrect = q.selected === q.correct;
                    const qText = easyMode ? q._easy.question : q.question;
                    const yourText = easyMode ? mapOpt('easy', q, q.selected) : q.selected;
                    const correctText = easyMode ? q._easy.correct : q.correct;
                    return (
                      <div key={i} className={`rounded-xl border-2 p-4 ${isCorrect ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'}`}>
                        <p className="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1">Fråga {i + 1}</p>
                        <p className="font-bold text-slate-800 mb-2">{qText}</p>
                        <p className={`text-sm flex items-center gap-1 ${isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                          {isCorrect ? <CheckCircle2 className="w-4 h-4 shrink-0" /> : <XCircle className="w-4 h-4 shrink-0" />}
                          <span className="font-semibold">{t.yourAnswerLbl}</span>{yourText}
                        </p>
                        {!isCorrect && (
                          <p className="text-sm text-green-700 font-semibold mt-1">{t.correctAnswerLbl}{correctText}</p>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              <button onClick={restart} className="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95">
                <RefreshCw className="w-5 h-5" /> {t.restartBtn}
              </button>
            </div>
          </div>
        );
      }

      const currentQ = quizQuestions[currentIndex];
      const total = quizQuestions.length;
      const scoreSoFar = quizQuestions.filter(q => q.selected === q.correct).length;
      const isLast = currentIndex === total - 1;

      return (
        <div className="min-h-screen flex flex-col items-center py-8 p-4">
          <div className="w-full max-w-md">
            <div className="mb-6">
              <div className="flex justify-between items-end text-xs font-black uppercase tracking-widest text-slate-400 mb-2 px-1">
                <div className="flex flex-col gap-1">
                  <span>Fråga {currentIndex + 1} / {total}</span>
                  <div className="flex items-center gap-1 text-slate-600">
                    <Clock className="w-3 h-3" />
                    <span>{formatTime(timer)}</span>
                  </div>
                </div>
                <span>{t.scoreLabel}{scoreSoFar}</span>
              </div>
              <div className="h-2 w-full bg-slate-200 rounded-full overflow-hidden">
                <div
                  className="h-full bg-yellow-400 transition-all duration-300"
                  style={{ width: `${((currentIndex + 1) / total) * 100}%` }}
                ></div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-8 mb-6 border-b-4 border-slate-100">
              <h2 className="text-xl font-bold text-slate-800 leading-snug">
                {easyMode ? currentQ._easy.question : currentQ.question}
              </h2>
            </div>

            <div className="space-y-3">
              {currentQ.options.map((option, index) => {
                const displayText = easyMode ? mapOpt('easy', currentQ, option) : option;
                let btnClasses = "w-full text-left p-5 rounded-xl border-2 transition-all font-bold flex items-center justify-between gap-3 shadow-sm ";
                if (!currentQ.answered) {
                  btnClasses += "border-slate-100 bg-white text-slate-600 hover:border-yellow-400 hover:shadow-md active:scale-95";
                } else {
                  if (option === currentQ.correct) {
                    btnClasses += "border-green-500 bg-green-50 text-green-800";
                  } else if (option === currentQ.selected) {
                    btnClasses += "border-red-500 bg-red-50 text-red-800";
                  } else {
                    btnClasses += "border-slate-50 bg-slate-50 text-slate-300 opacity-60";
                  }
                }
                return (
                  <button key={index} onClick={() => handleOptionClick(option)} disabled={currentQ.answered} className={btnClasses}>
                    <span className="text-sm md:text-base">{displayText}</span>
                    {currentQ.answered && option === currentQ.correct && <CheckCircle2 className="w-6 h-6 text-green-500 shrink-0" />}
                    {currentQ.answered && option === currentQ.selected && option !== currentQ.correct && <XCircle className="w-6 h-6 text-red-500 shrink-0" />}
                  </button>
                );
              })}
            </div>

            <div className="mt-8 flex gap-3">
              {currentIndex > 0 && (
                <button onClick={goBack} className="bg-white border-2 border-slate-200 text-slate-600 font-bold py-4 px-5 rounded-xl shadow-sm flex items-center justify-center gap-1 transition-all active:scale-95">
                  <ChevronLeft className="w-5 h-5" /> {t.backBtn}
                </button>
              )}
              {currentQ.answered && (
                <button onClick={goNext} className="flex-1 bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95">
                  {isLast ? t.resultBtn : t.nextBtn}
                  <ChevronRight className="w-5 h-5" />
                </button>
              )}
            </div>
          </div>

          {modal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
                <div className="text-5xl mb-3">{modal.isCorrect ? '✅' : '❌'}</div>
                <h3 className={`text-xl font-black mb-3 ${modal.isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                  {modal.isCorrect ? t.modalCorrectTitle : t.modalWrongTitle}
                </h3>
                <p className="text-slate-600 leading-relaxed mb-6">
                  {easyMode ? modal.question._easy.expl : modal.question.expl}
                </p>
                <button onClick={closeModalAndAdvance} className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg transition-all active:scale-95">
                  {isLast ? t.modalResultBtn : t.modalNextBtn}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
    <script src="feedback-widget.js" defer></script>
    <script data-goatcounter="https://johnblixt.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
