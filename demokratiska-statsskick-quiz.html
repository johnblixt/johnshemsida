<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Demokratiska statsskick – Sverige ett exempel</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'EB Garamond', serif; }
        .accent-color { color: #fb923c; }
        .accent-bg { background-color: #fb923c; }
        .quiz-btn { transition: all 0.2s ease; border: 2px solid #e2e8f0; }
        .quiz-btn:hover:not(:disabled) { border-color: #fb923c; background-color: #fef9c3; }
        .quiz-btn.selected { border-color: #fb923c; background-color: #fb923c; color: white; }
        .quiz-btn.correct { border-color: #16a34a; background-color: #dcfce7; color: #16a34a; }
        .quiz-btn.incorrect { border-color: #dc2626; background-color: #fee2e2; color: #dc2626; }
        .progress-fill { transition: width 0.3s ease; background-color: #fb923c; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-backdrop { animation: fadeIn 0.3s ease; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div class="max-w-2xl mx-auto px-6 pt-6">
        <a href="index.html" class="inline-flex items-center text-sm text-slate-600 hover:accent-color transition-colors">
            <span class="mr-1">←</span> Tillbaka till startsidan
        </a>
    </div>

    <div class="max-w-2xl mx-auto px-6 py-8">
        <div id="screen-start" class="text-center">
            <h1 class="text-5xl font-bold accent-color mb-4 italic">Demokratiska statsskick</h1>
            <p class="text-xl text-slate-600 mb-8">Sverige ett exempel</p>
            <div class="bg-yellow-50 border-l-8 border-yellow-400 p-6 rounded mb-8">
                <p class="text-slate-700 mb-2"><strong>30 frågor</strong> om den svenska demokratin</p>
                <p class="text-slate-600 text-sm">Lycka till! 🎯</p>
            </div>
            <button onclick="startQuiz()" class="accent-bg text-white px-8 py-4 rounded-xl font-bold text-lg hover:brightness-110">Starta Quiz</button>
        </div>

        <div id="screen-quiz" class="hidden">
            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <div><p class="text-sm text-slate-500 uppercase font-bold">Fråga <span id="q-current">1</span>/30</p></div>
                    <div><p class="text-sm text-slate-500 uppercase font-bold">Poäng: <span id="score">0</span>/30</p></div>
                    <div><p class="text-sm text-slate-500 uppercase font-bold">Tid: <span id="timer">00:00</span></p></div>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3">
                    <div id="progress-bar" class="progress-fill h-3 rounded-full" style="width: 0%"></div>
                </div>
            </div>
            <div class="bg-white rounded-xl p-8 mb-6 border-t-4 border-yellow-400 shadow-sm">
                <h2 id="question-text" class="text-2xl font-bold text-slate-900">Fråga</h2>
            </div>
            <div id="answers-container" class="space-y-3 mb-6"></div>
            <button id="btn-next" onclick="nextQuestion()" class="hidden w-full accent-bg text-white py-3 rounded-xl font-bold hover:brightness-110">Nästa fråga →</button>
        </div>

        <div id="screen-results" class="hidden text-center">
            <div class="text-6xl mb-4"><span id="result-emoji">🎉</span></div>
            <h1 class="text-4xl font-bold accent-color mb-8 italic">Quiz färdigt!</h1>
            <div class="bg-yellow-50 border-l-8 border-yellow-400 p-8 rounded-xl mb-8">
                <p class="text-5xl font-bold accent-color mb-4"><span id="final-score">0</span>/30</p>
                <p id="result-feedback" class="text-lg text-slate-700 mb-2">Feedback</p>
                <p class="text-sm text-slate-600">Tid: <span id="final-time">00:00</span></p>
            </div>
            <div id="missed-section" class="mb-8 hidden">
                <h2 class="text-2xl font-bold text-slate-900 mb-4">Frågor du missade</h2>
                <div id="missed-list" class="space-y-2"></div>
            </div>
            <button onclick="resetQuiz()" class="w-full accent-bg text-white py-3 rounded-xl font-bold hover:brightness-110">Gör om Quiz</button>
        </div>
    </div>

    <div id="modal-backdrop" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-3xl p-8">
            <div class="flex items-center gap-3 mb-4">
                <span id="modal-icon" class="text-3xl">✓</span>
                <p id="modal-label" class="font-bold text-lg">Rätt!</p>
            </div>
            <p id="modal-explanation" class="text-slate-700 leading-relaxed mb-6"></p>
            <button onclick="closeModal()" class="w-full accent-bg text-white py-3 rounded-xl font-bold hover:brightness-110">Förstått</button>
        </div>
    </div>

    <script>
const questions = [
    { q: "Vad betyder ordet demokrati?", opts: ["Folkstyre", "Maktkoncentration hos en person", "Styre av militären", "Religiös statsskick"], ans: 0, exp: "Ordet demokrati kommer från grekiskan och betyder folkstyre. I en demokrati är folket källan till makten." },
    { q: "Vilken är den viktigaste skillnaden mellan direktdemokrati och representativ demokrati?", opts: ["I direktdemokrati fattar folket själva beslut direkt, i representativ demokrati väljer folket politiker som fattar beslut åt dem", "Direktdemokrati är bättre än representativ demokrati", "De är helt olika politiska ideologier", "Direktdemokrati existerar inte längre"], ans: 0, exp: "I direktdemokrati deltar medborgarna själva direkt i beslutsfattandet, ofta genom folkomröstningar. I representativ demokrati, som Sverige har, väljer folket representanter." },
    { q: "Vilka är de fyra statsorganen i Sverige?", opts: ["Statschef, Parlament, Regering och Domstolar", "Riksdagen, Regeringen, Justitiekanslern och Försäkringskassan", "Koronen, Senaten, Kongressen och Högsta domstolen", "Folkpartiet, Moderaterna, Socialdemokraterna och Centerpartiet"], ans: 0, exp: "De fyra statsorganen är: Statschef (Kung Carl XVI Gustaf), Parlament (Riksdagen), Regering och Domstolar." },
    { q: "Hur många grundlagar ingår i den svenska konstitutionen?", opts: ["Fyra: Regeringsformen, Successionsordningen, Tryckfrihetsförordningen och Yttrandefrihetsgrundlagen", "En huvudlag som reglerar allt", "Två: En om regeringen och en om medborgarnas rättigheter", "Tio olika grundlagar"], ans: 0, exp: "Den svenska konstitutionen består av fyra grundlagar som tillsammans reglerar hur Sverige styrs och vilka fri- och rättigheter vi har." },
    { q: "Vad är en konstitutionell monarki?", opts: ["En stat där monarken är statschef men makten begränsas av konstitutionen", "En monark med obegränsad makt", "En president som väljs av folket", "En republik utan någon statschef"], ans: 0, exp: "I en konstitutionell monarki är monarken statschef men makten begränsas starkt av konstitutionen. Sverige är en konstitutionell monarki." },
    { q: "Hur många ledamöter finns det i Sveriges riksdag?", opts: ["349", "365", "300", "250"], ans: 0, exp: "Riksdagen har 349 ledamöter som fördelar sig mellan 29 valkretsar baserat på befolkningsmängden." },
    { q: "Vad innebär ett proportionellt valsystem?", opts: ["Ett parti får ungefär lika många mandat som andelen röster de får", "Det största partiet får alla mandaten", "Enbart män får rösta", "Varje valkrets ger sitt enda mandat till vinnaren"], ans: 0, exp: "I ett proportionellt valsystem får varje parti mandat motsvarande sin andel av rösterna. Sverige använder denna system." },
    { q: "Vad är en fyraprocentsspärr?", opts: ["En regel som säger att ett parti behöver minst 4% av landsrösterna för att få mandat i riksdagen", "En lag som förbjuder fler än 4% av riksdagen att sitta tillsammans", "En militär gräns mellan Sverige och Norge", "En regel för hur många kommuner ett parti måste ha stöd i"], ans: 0, exp: "Fyraprocentsspärren förhindrar alltför små partier från att komma in i riksdagen. Ett parti behöver minst 4% av landsrösterna." },
    { q: "Vad innebär parlamentarism?", opts: ["Regeringen måste ha stöd av en majoritet i parlamentet för att styra; annars måste den avgå", "Ett land styrs enbart av ett parlament utan regering", "Bara aristokrater får rösta", "En statsskick där presidenten har all makt"], ans: 0, exp: "Parlamentarism innebär att regeringen måste ha stöd av en majoritet av ledamöterna i riksdagen. Sverige är en parlamentarisk demokrati." },
    { q: "Vem eller vilka är statschef i Sverige?", opts: ["Kung Carl XVI Gustaf", "Statsministern", "Talmannen i riksdagen", "Riksrevisionens ordförande"], ans: 0, exp: "Kung Carl XVI Gustaf är statschef i Sverige. Han är huvudsakligen en symbol för Sverige, medan statsministern styr landet." },
    { q: "Vad regleras i Regeringsformen?", opts: ["Reglerna för hur Sverige ska styrs, hur politiker väljs, och de friheter och rättigheter medborgarna har", "Endast vilken mat regeringen får äta", "Bara reglerna för militären", "Endast hur pengar ska användas"], ans: 0, exp: "Regeringsformen är en grundlag som reglerar hur Sverige styrs, vilka politiker väljs, hur beslut fattas, och medborgares friheter och rättigheter." },
    { q: "Vad är en republik?", opts: ["Ett statsskick där statschefen väljs, oftast genom val, inte genom arv", "En sammanslagning av flera länder", "En diktatur utan parlament", "En monarkisk statsskick"], ans: 0, exp: "I en republik är statschefen vald, oftast genom direkta val av folket eller indirekt via ett parlament." },
    { q: "Vad är en valkrets?", opts: ["Ett geografiskt område som har ett bestämt antal platser (mandat) i riksdagen", "En grupp väljare som röstar på samma person", "En politisk organisation", "En institution som granskar valen"], ans: 0, exp: "En valkrets är ett geografiskt område som får ett bestämt antal mandat i riksdagen. Sverige är indelat i 29 valkretsar." },
    { q: "Hur många län finns det i Sverige?", opts: ["21", "19", "25", "30"], ans: 0, exp: "Sverige är indelat i 21 län. Varje län styrs av en länsstyrelse med en landshövding som chef." },
    { q: "Vad är ett mandat?", opts: ["En plats i folkförsamlingen, t.ex. riksdagen, som representerar väljare", "En order från kung", "En rättning eller korrektion", "En militär befälhavare"], ans: 0, exp: "Ett mandat är en plats i en folkförsamling som riksdagen. Mandaten fördelas mellan partierna enligt valresultatet." },
    { q: "Vad innebär en misstroendeförklaring?", opts: ["Riksdagen kan uttala sitt misstroende för en minister eller hela regeringen; då måste de avgå", "En valkampanj mot ett parti", "En rättegång mot en politiker", "En statistik om förtroendet för politiker"], ans: 0, exp: "En misstroendeförklaring innebär att riksdagen genom omröstning kan förklara sitt misstroende för en statsråd eller helt regeringen." },
    { q: "Hur många regioner finns det i Sverige?", opts: ["21", "19", "25", "29"], ans: 0, exp: "Det finns 21 regioner i Sverige (tidigare kallade landsting) som framför allt sköter hälso- och sjukvård." },
    { q: "Vad innebär offentlighetsprincipen?", opts: ["Huvudregeln är att myndigheters information ska vara öppen och tillgänglig för allmänheten", "Alla möten måste hållas offentligt på torget", "Alla människor måste rösta offentligt", "Regeringen måste berätta sina hemliga planer"], ans: 0, exp: "Offentlighetsprincipen säger att huvudregeln är att myndigheters information ska vara öppen för allmänheten." },
    { q: "Vad är en statsråd?", opts: ["En minister – medlem av regeringen med ett speciellt ansvarsområde", "En dommare i högsta domstolen", "En ledamot i riksdagen", "En tjänsteman på något departement"], ans: 0, exp: "Statsråd är en annan benämning för minister – medlem av regeringen. Regeringen består av 20-25 statsråd." },
    { q: "Vilken är talmannens viktigaste uppgift?", opts: ["Att föreslå en ny statsminister och leda riksdagens arbete", "Att döma i brottmål", "Att styra hela regeringen", "Att skriva alla lagar"], ans: 0, exp: "Talmannen föreslår ny statsminister efter val och leder riksdagens arbete tillsammans med vice talmän." },
    { q: "Vad är en länsstyrelse?", opts: ["Den högsta statliga myndigheten inom ett län, ledd av en landshövding", "En domstol för brott", "En kommunal organisation", "En militär enhet"], ans: 0, exp: "En länsstyrelse är statens regionala organisation inom ett län, ledd av en landshövding." },
    { q: "Vad är kommunfullmäktige?", opts: ["Kommunens högsta beslutande organ – kommunens motsvarighet till riksdagen", "En polisstation i kommunen", "Arbetarnas fackklubb", "En privatägd företagsbyrå"], ans: 0, exp: "Kommunfullmäktige är kommunens högsta beslutande organ, motsvarande riksdagen på kommunal nivå." },
    { q: "Vilka är de två viktigaste rättsprinciperna?", opts: ["Legalitetsprincipen (ingen får straffas för något som inte var förbjudet) och Likabehandlingsprincipen (alla är lika inför lagen)", "Demokratiprincipen och Toleransprincipen", "Värnplikt och Skatteplikten", "Rösträttsprincipen och Valsekretessen"], ans: 0, exp: "Två viktiga rättsprinciper för rättssäkerhet är legalitetsprincipen och likabehandlingsprincipen." },
    { q: "Vad är skillnaden mellan partival och personval?", opts: ["I partival röstar man på ett parti; i personval röstar man på en enskild kandidat", "Partival är helt förbjudet i Sverige", "De är samma sak", "Personval tillåts bara för presidenter"], ans: 0, exp: "Vi röstar främst på partier (partival), men kan också göra personval genom att kryssa för en kandidat." },
    { q: "Vilka är riksdagens tre huvuduppgifter?", opts: ["Lagstiftningsmakt, Finansmakt och Kontrollmakt", "Militär ledning, Poliskontroll och Skatteinsamling", "Utbildning, Sjukvård och Vägunderhåll", "Krig, Fred och Diplomati"], ans: 0, exp: "Riksdagens tre huvuduppgifter är att stifta lagar, besluta om budgeten och kontrollera regeringen." },
    { q: "Vad är en proposition?", opts: ["Ett förslag till riksdagen som kommer från regeringen", "Ett äktenskapsförslag", "En förslag från ett politiskt parti", "En matematisk ekvation"], ans: 0, exp: "En proposition är ett förslag till riksdagen som kommer från regeringen." },
    { q: "Vad är en motion?", opts: ["Ett förslag till riksdagen som kommer från en eller flera riksdagsledamöter", "En rörelse eller dans", "Ett förslag från regeringen", "En folkomröstning"], ans: 0, exp: "En motion är ett förslag till riksdagen från en eller flera riksdagsledamöter." },
    { q: "Vad är ett utskott i riksdagen?", opts: ["Arbetsgrupper inom riksdagen som bereder olika ärenden före riksdagen fattar beslut", "En grupp som granskar domstolarna", "En militär organisation", "En privat företagsklubb"], ans: 0, exp: "Ett utskott är en arbetsgrupp inom riksdagen som bereder ärenden innan riksdagen fattar beslut." },
    { q: "Vilka två typer av val kan förekomma?", opts: ["Proportionella val (där partier får mandat enligt röstandel) och Majoritetsval (där största vinnaren tar mandatet)", "Privata val och Offentliga val", "Hemliga val och Öppna val", "Direkta val och Indirekta val"], ans: 0, exp: "Det finns proportionella val (Sverige) och majoritetsval (USA, Storbritannien). Proportionella ger bättre spegelbild av opinionen." },
    { q: "Hur ändras en grundlag i Sverige?", opts: ["Fler än hälften av riksdagen måste rösta för det, sedan bordläggs ärendet till efter nästa val, och sedan måste nyvalda riksdagen fatta samma beslut igen", "En enskild politiker kan ändra grundlagen", "Grundlagar kan aldrig ändras", "Endast regeringen kan ändra grundlagar"], ans: 0, exp: "Grundlagsändringar är avsiktligt komplicerade för att skydda demokratin. Det krävs två beslut med val emellan." },
    { q: "Vilka folkförsamlingar väljer vi i Sverige?", opts: ["Riksdagen, Regionfullmäktige, Kommunfullmäktige och Europaparlamentet", "Bara Riksdagen", "Endast kommune- och regionfullmäktige", "Bara Europaparlamentet och Riksdagen"], ans: 0, exp: "Vi väljer till fyra folkförsamlingar: Riksdagen (349 ledamöter, 4 år), Regionfullmäktige (4 år), Kommunfullmäktige (4 år) och Europaparlamentet (5 år)." }
];

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let idx = 0, score = 0, shuffled = [], answers = [], start = 0, timer = null;

function startQuiz() {
    shuffled = shuffle(questions);
    answers = new Array(30).fill(null);
    idx = 0;
    score = 0;
    start = Date.now();
    timer = setInterval(() => {
        const s = Math.floor((Date.now() - start) / 1000);
        document.getElementById('timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 1000);
    document.getElementById('screen-start').classList.add('hidden');
    document.getElementById('screen-quiz').classList.remove('hidden');
    showQuestion();
}

function showQuestion() {
    const q = shuffled[idx];
    document.getElementById('q-current').textContent = idx + 1;
    document.getElementById('question-text').textContent = q.q;
    document.getElementById('score').textContent = score;
    document.getElementById('progress-bar').style.width = (idx / 30) * 100 + '%';
    const opts = shuffle([...q.opts]);
    const container = document.getElementById('answers-container');
    container.innerHTML = '';
    opts.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn w-full text-left p-4 rounded-xl font-semibold text-lg';
        btn.textContent = opt;
        btn.onclick = () => selectAnswer(opt === q.opts[q.ans], q.exp);
        container.appendChild(btn);
    });
}

function selectAnswer(isCorrect, exp) {
    if (isCorrect) score++;
    document.getElementById('modal-icon').textContent = isCorrect ? '✓' : '✗';
    document.getElementById('modal-icon').className = isCorrect ? 'text-3xl text-green-600' : 'text-3xl text-red-600';
    document.getElementById('modal-label').textContent = isCorrect ? 'Rätt!' : 'Fel!';
    document.getElementById('modal-explanation').textContent = exp;
    document.getElementById('modal-backdrop').classList.remove('hidden');
    document.getElementById('btn-next').classList.remove('hidden');
}

function closeModal() { document.getElementById('modal-backdrop').classList.add('hidden'); }

function nextQuestion() {
    idx++;
    if (idx < 30) showQuestion();
    else endQuiz();
}

function endQuiz() {
    clearInterval(timer);
    const t = Math.floor((Date.now() - start) / 1000);
    const timeStr = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
    document.getElementById('screen-quiz').classList.add('hidden');
    document.getElementById('screen-results').classList.remove('hidden');
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-time').textContent = timeStr;
    const p = (score / 30) * 100;
    if (p >= 90) { document.getElementById('result-emoji').textContent = '🏆'; document.getElementById('result-feedback').textContent = 'Utmärkt! Du behärskar demokrati perfekt!'; }
    else if (p >= 75) { document.getElementById('result-emoji').textContent = '👍'; document.getElementById('result-feedback').textContent = 'Bra jobbat! Du förstår väl hur demokratin fungerar.'; }
    else if (p >= 60) { document.getElementById('result-emoji').textContent = '✓'; document.getElementById('result-feedback').textContent = 'Godkänt. Repetera de svåra områdena!'; }
    else { document.getElementById('result-emoji').textContent = '💪'; document.getElementById('result-feedback').textContent = 'Öva mer! Läs pluggmaterialet och försök igen.'; }
}

function resetQuiz() {
    document.getElementById('screen-results').classList.add('hidden');
    document.getElementById('screen-start').classList.remove('hidden');
}
    </script>
</body>
</html>
