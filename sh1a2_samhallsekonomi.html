<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samhällskunskap Sa1a2 – Samhällsekonomi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'EB Garamond', serif; }
    .area-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .area-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(251,146,60,0.18); }
    .part-tag { background:#fb923c; color:#7c2d12; }
    .part-btn { background:#fb923c; color:#7c2d12; }
    .part-btn:hover { background:#f97316; }
    @media (prefers-reduced-motion: reduce) {
      .area-card { transition: none; }
      .area-card:hover { transform: none; }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <a href="index.html" id="backLink" class="fixed top-4 left-4 z-50 text-sm font-medium text-slate-500 hover:text-orange-700 bg-white/90 px-3 py-2 rounded-xl shadow-sm transition-colors">← Tillbaka till startsidan</a>

  <div class="max-w-xl mx-auto px-6 py-20">

    <!-- Header -->
    <div class="text-center mb-14">
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-orange-600 mb-3">Samhällskunskap Sa1a2</p>
      <h1 class="text-5xl md:text-6xl font-black italic text-slate-900 mb-5">💰 Samhällsekonomi</h1>
      <div class="h-1 w-20 rounded-full mx-auto" style="background:#fb923c;"></div>
    </div>

    <div id="groups" class="flex flex-col gap-5"></div>
  </div>

  <script>
    /* Hubbens kort – tre grupper i ordningen begrepp → pluggmaterial → quiz
       (samma upplägg som Sa1a1:s ekonomihubb). Lägg till/ändra delar här.
       item: { tag, title, text?, href, btn } */
    var HUB_GROUPS = [
      { emoji: '📖', title: 'Öva på centrala begrepp',
        intro: 'Flashcards, lucktext och begreppsövningar.',
        items: [
          { tag: 'Del 1', title: 'Samhällsekonomins grunder', href: 'sh1a2_samhallsekonomi_grunder_begrepp.html', btn: 'Öppna begrepp' },
          { tag: 'Del 2', title: 'Ekonomisk politik', href: 'sh1a2_samhallsekonomi_ekonomiskpolitik_begrepp.html', btn: 'Öppna begrepp' }
        ] },
      { emoji: '📚', title: 'Pluggmaterial',
        intro: 'Sammanfattningar och fördjupningsmaterial inför provet.',
        items: [
          { tag: 'Del 1', title: 'Samhällsekonomins grunder', href: 'sh1a2_samhallsekonomi_grunder_plugg.html', btn: 'Öppna materialet' },
          { tag: 'Del 2', title: 'Ekonomisk politik', href: 'sh1a2_samhallsekonomi_ekonomiskpolitik_plugg.html', btn: 'Öppna materialet' },
          { tag: '🎬 Video', title: 'Samhällsekonomi på film',
            text: 'Kretsloppet, utbud och efterfrågan, konjunkturen, finans- och penningpolitik, styrräntan och inflationen.',
            href: 'sh_ekonomi_material.html', btn: 'Se videorna' }
        ] },
      { emoji: '🎯', title: 'Quiz',
        intro: null,
        items: [
          { tag: 'Del 1', title: 'Samhällsekonomins grunder', href: 'sh1a2_samhallsekonomi_grunder_quiz.html', btn: 'Starta quizet' },
          { tag: 'Del 2', title: 'Ekonomisk politik', href: 'sh1a2_samhallsekonomi_ekonomiskpolitik_quiz.html', btn: 'Starta quizet' }
        ] }
    ];

    (function () {
      function itemHtml(it) {
        return '<div class="area-card bg-orange-50 rounded-2xl p-5 border border-orange-100">' +
                 '<div class="flex items-center gap-3 mb-3">' +
                   '<span class="part-tag text-xs font-black px-2 py-1 rounded-lg uppercase tracking-wide">' + it.tag + '</span>' +
                   '<h3 class="text-lg font-bold">' + it.title + '</h3>' +
                 '</div>' +
                 (it.text ? '<p class="text-slate-500 text-sm leading-relaxed mb-3">' + it.text + '</p>' : '') +
                 '<a href="' + it.href + '" class="part-btn block w-full py-3 rounded-xl font-bold text-center text-sm uppercase tracking-wide transition-colors">' + it.btn + ' →</a>' +
               '</div>';
      }
      document.getElementById('groups').innerHTML = HUB_GROUPS.map(function (g) {
        return '<div class="bg-white rounded-3xl shadow-sm border-t-8 p-7" style="border-color:#fb923c;">' +
                 '<div class="flex items-center gap-4 mb-6">' +
                   '<span class="text-4xl">' + g.emoji + '</span>' +
                   '<h2 class="text-2xl font-bold">' + g.title + '</h2>' +
                 '</div>' +
                 (g.intro ? '<p class="text-slate-500 leading-relaxed mb-6">' + g.intro + '</p>' : '') +
                 '<div class="flex flex-col gap-4">' + g.items.map(itemHtml).join('') + '</div>' +
               '</div>';
      }).join('');
    })();

    /* Smart tillbaka-navigering: history.back() inom samma domän,
       annars fallback till startsidan (områdessidans egen förälder). */
    (function () {
      var backLink = document.getElementById('backLink');
      if (!backLink) return;
      backLink.addEventListener('click', function (e) {
        e.preventDefault();
        try {
          if (document.referrer &&
              new URL(document.referrer).hostname === window.location.hostname) {
            history.back();
            return;
          }
        } catch (err) {}
        window.location.href = 'index.html';
      });
    })();
  </script>

  <script src="feedback-widget.js" defer></script>
  <script data-goatcounter="https://johnblixt.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
