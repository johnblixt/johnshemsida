function shuffleArray(array) {
  const arr = [...array];

    const j = Math.floor(Math.random() * (i + 1));

  }
  return arr;
}

function getFeedback(score, total) {
  const p = score / total;
  if (p >= 0.9) return 'Redo för provet! Fantastiskt bra!';
  if (p >= 0.7) return 'Bra jobbat! Öva lite till på de du missade.';
  if (p >= 0.5) return 'Halvvägs! Fortsätt träna.';
  return 'Öva lite till – du är på rätt väg!';
}

const VIEWS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];
const ACTIVE_VIEWS = { 'Lista': true, 'Flashcards': true, 'Lucktext': true, 'Scenario': true, 'Icke-ex.': true };
const SCORE_VIEWS = ['Lucktext', 'Scenario', 'Icke-ex.'];
const PROGRESS_KEY = 'sh1a1_ekonomisk_politik_progress';
const RANK_SALT = 'sh1a1ekonomiskpolitiksakerhet';
const RANK_ORDER = { D: 1, C: 2, B: 3, A: 4, S: 5 };

function loadProgress() {
  try {
    const raw = sessionStorage.getItem(PROGRESS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { completed: {}, best: {} };
}

function saveProgress(progress) {
  try {
    sessionStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (e) {}
}

function computeRank(progress) {
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  if (completedCount === 0) return null;
  if (completedCount === 5) {
    const allPerfect = SCORE_VIEWS.every(v => (progress.best[v] || 0) >= 100);
    return allPerfect ? 'S' : 'A';
  }
  if (completedCount === 4) return 'A';
  if (completedCount === 3) return 'B';
  if (completedCount === 2) return 'C';
  return 'D';
}

function computeVerificationCode(progress, rank) {
  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const completedViews = VIEWS.filter(v => progress.completed[v]).sort().join(',');
  const input = dateStr + '|' + completedViews + '|' + (rank || '-') + '|' + RANK_SALT;
  let hash = 0;
  for (let i = 0; i < input.length; i++) {
    hash = (hash + input.charCodeAt(i) * (i + 1)) % 1679616; // 36^4
  }
  return 'SH1A1EKP-' + hash.toString(36).toUpperCase().padStart(4, '0');
}

function ListView({ onComplete }) {
  const [query, setQuery] = useState('');
  const sentinelRef = useRef(null);

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) onComplete();
    }, { threshold: 1.0 });
    observer.observe(el);
    return () => observer.disconnect();
  }, [onComplete]);

  const filtered = concepts.filter(c =>
    c.term.toLowerCase().includes(query.toLowerCase()) ||
    c.definition.toLowerCase().includes(query.toLowerCase())
  );

  return (
    <div>
      <input
        type="text"
        value={query}
        onChange={e => setQuery(e.target.value)}
        placeholder="🔍 Sök begrepp eller definition..."
        className="w-full mb-6 px-5 py-3 rounded-2xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 text-lg"
        style={{ '--tw-ring-color': PRIMARY }}
      />
      <div className="flex flex-col gap-3">
        {filtered.map((c) => (
          <div
            key={c.id}
            className="bg-white rounded-2xl shadow-sm p-5 border-l-8 hover:shadow-md transition-shadow"
            style={{ borderColor: PRIMARY }}
          >
            <div className="flex items-start gap-3">
              <span
                className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold font-fredoka mt-0.5"
                style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
              >
                {c.id}
              </span>
              <div>
                <p className="font-bold text-lg text-slate-800">{c.term}</p>
                <p className="text-slate-500 mt-1 leading-relaxed">{c.definition}</p>
              </div>
            </div>
          </div>
        ))}
        {filtered.length === 0 && (
          <p className="text-center text-slate-400 mt-8">Inga begrepp matchade sökningen.</p>
        )}
      </div>
      <div ref={sentinelRef} style={{ height: 1 }} />
    </div>
  );
}

function FlashcardView({ onComplete }) {
  const total = concepts.length;
  const [deck, setDeck] = useState(() => shuffleArray(concepts));
  const [deckIdx, setDeckIdx] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

  const restartAll = () => {
    setDeck(shuffleArray(concepts));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
      onComplete();
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray(kudeInte));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
          Börja om med alla
        </button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold font-fredoka hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold font-fredoka">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold font-fredoka">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold font-fredoka">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-2xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70 font-fredoka">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back bg-white" style={{ border: `2px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold font-fredoka">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold font-fredoka py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold font-fredoka py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs font-fredoka">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline font-fredoka">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

function LucktextView({ onComplete }) {
  const total = concepts.length;
  const [inputs, setInputs] = useState(() => concepts.map(() => ''));
  const [attempts, setAttempts] = useState(() => concepts.map(() => 0));
  const [statuses, setStatuses] = useState(() => concepts.map(() => null));
  const normalize = s => s.trim().toLowerCase();

  const submit = (i) => {
    if (statuses[i] === 'correct' || statuses[i] === 'wrong-final') return;
    const val = normalize(inputs[i]);
    if (!val) return;
    if (concepts[i].answers.includes(val)) {
      const next = [...statuses]; next[i] = 'correct'; setStatuses(next);
    } else {
      const a = [...attempts]; a[i] += 1; setAttempts(a);
      const next = [...statuses]; next[i] = a[i] >= 2 ? 'wrong-final' : 'wrong-once'; setStatuses(next);
    }
  };

  const rattaAlla = () => {
    setStatuses(prev => prev.map(s => (s === 'correct' ? 'correct' : 'wrong-final')));
  };

  const borjaOm = () => {
    setInputs(concepts.map(() => ''));
    setAttempts(concepts.map(() => 0));
    setStatuses(concepts.map(() => null));
  };

  const correctCount = statuses.filter(s => s === 'correct').length;
  const allDone = statuses.every(s => s === 'correct' || s === 'wrong-final');

  useEffect(() => {
    if (allDone) onComplete(Math.round((correctCount / total) * 100));
  }, [allDone]);

  return (
    <div>
      <div className="bg-white rounded-2xl shadow-sm p-4 mb-6 border border-slate-200">
        <p className="text-xs uppercase tracking-wide text-slate-400 font-fredoka font-bold mb-2">Begreppsbank</p>
        <div className="flex flex-wrap gap-2">
          {concepts.map((c, i) => (
            <span
              key={c.id}
              className={`px-3 py-1 rounded-full text-sm border border-slate-200 bg-slate-50 ${statuses[i] === 'correct' ? 'line-through text-slate-300' : 'text-slate-600'}`}
            >
              {c.term}
            </span>
          ))}
        </div>
      </div>

      <div className="flex flex-col gap-3">
        {concepts.map((c, i) => {
          const [before, after] = c.sentence.split('_____');
          const status = statuses[i];
          const boxStyle =
            status === 'correct'
              ? { background: '#dcfce7', borderColor: '#16a34a' }
              : status === 'wrong-final'
                ? { background: '#fee2e2', borderColor: '#dc2626' }
                : { borderColor: '#e2e8f0' };
          return (
            <div key={c.id} className="rounded-2xl p-4 border-2 bg-white transition-colors" style={boxStyle}>
              <p className="text-slate-700 leading-relaxed mb-1">
                <span className="font-bold font-fredoka text-slate-400 mr-1">{i + 1}.</span>
                {before}
                <input
                  type="text"
                  value={inputs[i]}
                  disabled={status === 'correct' || status === 'wrong-final'}
                  onChange={e => {
                    const val = e.target.value;
                    const next = [...inputs]; next[i] = val; setInputs(next);
                  }}
                  onKeyDown={e => { if (e.key === 'Enter') submit(i); }}
                  className="inline-block mx-1 px-2 py-1 w-40 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 text-slate-800 disabled:bg-transparent disabled:border-transparent align-middle"
                  style={{ '--tw-ring-color': PRIMARY }}
                />
                {after}
              </p>
              {status === 'wrong-once' && (
                <p className="text-orange-500 text-sm font-fredoka">Är du säker att du stavat rätt?</p>
              )}
              {status === 'correct' && (
                <p className="text-sm mt-1" style={{ color: '#16a34a' }}>✓ Rätt! {c.definition}</p>
              )}
              {status === 'wrong-final' && (
                <p className="text-sm mt-1" style={{ color: '#dc2626' }}>Rätt svar: <span className="font-bold">{c.term}</span> — {c.definition}</p>
              )}
            </div>
          );
        })}
      </div>

      <div className="flex flex-col items-center gap-4 mt-6">
        {!allDone && (
          <button onClick={rattaAlla} className="bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold font-fredoka hover:bg-slate-800 transition-colors">
            Rätta alla
          </button>
        )}
        {allDone && (
          <div className="bg-white border-2 rounded-3xl p-6 text-center w-full max-w-sm shadow-sm" style={{ borderColor: PRIMARY }}>
            <p className="text-2xl font-bold" style={{ color: PRIMARY_TEXT }}>{correctCount} / {total} rätt</p>
            <p className="text-slate-500 mt-2 font-fredoka">{getFeedback(correctCount, total)}</p>
          </div>
        )}
        <button onClick={borjaOm} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline font-fredoka">↺ Börja om</button>
      </div>
    </div>
  );
}

function ScenarioView({ onComplete }) {
  const total = concepts.length;

  const buildOptions = (correctIdx) => {
    const others = concepts.map((_, i) => i).filter(i => i !== correctIdx);
    const distractors = shuffleArray(others).slice(0, 3);
    return shuffleArray([correctIdx, ...distractors]);
  };

  const makeRound = () => {
    const order = shuffleArray(concepts.map((_, i) => i));
    return { order, options: buildOptions(order[0]) };
  };

  const [round, setRound] = useState(makeRound);
  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);

  const conceptIdx = round.order[current];
  const concept = concepts[conceptIdx];

  const handleSelect = (optIdx) => {
    if (answered) return;
    setSelected(optIdx);
    setAnswered(true);
    if (optIdx === conceptIdx) setScore(sc => sc + 1);
  };

  const next = () => {
    const nextI = current + 1;
    if (nextI >= round.order.length) {
      setDone(true);
      return;
    }
    setRound(prev => ({ ...prev, options: buildOptions(prev.order[nextI]) }));
    setCurrent(nextI);
    setSelected(null);
    setAnswered(false);
  };

  const restart = () => {
    setRound(makeRound());
    setCurrent(0);
    setSelected(null);
    setAnswered(false);
    setScore(0);
    setDone(false);
  };

  useEffect(() => {
    if (done) onComplete(Math.round((score / total) * 100));
  }, [done]);

  if (done) return (
    <div className="flex flex-col items-center gap-4">
      <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{ borderColor: PRIMARY }}>
        <p className="text-2xl font-bold" style={{ color: PRIMARY_TEXT }}>{score} / {total} rätt</p>
        <p className="text-slate-500 mt-2 font-fredoka">{getFeedback(score, total)}</p>
        <button onClick={restart} className="w-full mt-6 text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  return (
    <div className="flex flex-col items-center">
      <div className="w-full max-w-lg mb-4">
        <div className="flex justify-between text-xs text-slate-400 font-fredoka mb-1">
          <span>Fråga {current + 1} av {total}</span>
          <span>Poäng: {score}</span>
        </div>
        <div className="w-full bg-slate-200 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all" style={{ width: `${(current / total) * 100}%`, background: PRIMARY }} />
        </div>
      </div>

      <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 w-full max-w-lg">
        <p className="text-slate-800 text-lg leading-relaxed mb-5">{concept.scenario}</p>
        <p className="text-xs uppercase tracking-wide text-slate-400 font-fredoka font-bold mb-3">Vilket begrepp beskrivs?</p>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {round.options.map((optIdx) => {
            const isCorrect = optIdx === conceptIdx;
            const isSelected = optIdx === selected;
            let optStyle = { borderColor: '#e2e8f0' };
            if (answered && isCorrect) optStyle = { background: '#dcfce7', borderColor: '#16a34a' };
            else if (answered && isSelected && !isCorrect) optStyle = { background: '#fee2e2', borderColor: '#dc2626' };
            return (
              <button
                key={optIdx}
                onClick={() => handleSelect(optIdx)}
                disabled={answered}
                className="text-left px-4 py-3 rounded-2xl border-2 font-medium text-slate-700 transition-colors"
                style={optStyle}
              >
                {concepts[optIdx].term}
              </button>
            );
          })}
        </div>
        {answered && (
          <div className="mt-5 p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <p className="text-sm text-slate-600 leading-relaxed">
              <span className="font-bold" style={{ color: PRIMARY_TEXT }}>{concept.term}:</span> {concept.definition}
            </p>
            <button onClick={next} className="w-full mt-4 text-white px-6 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
              Nästa →
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function IckeExempelView({ onComplete }) {
  const total = concepts.length;

  const makeOpts = (c) => {
    const flip = Math.random() > 0.5;
    return flip
      ? [{ text: c.ickeExempel.korrekt, isCorrect: true }, { text: c.ickeExempel.icke, isCorrect: false }]
      : [{ text: c.ickeExempel.icke, isCorrect: false }, { text: c.ickeExempel.korrekt, isCorrect: true }];
  };

  const freshState = () => {
    const order = shuffleArray(concepts.map((_, i) => i));
    return { order, cur: 0, opts: makeOpts(concepts[order[0]]), answered: false, selIdx: null, score: 0, done: false };
  };

  const [s, setS] = useState(freshState);

  const handleSelect = (idx) => {
    if (s.answered) return;
    const correct = s.opts[idx].isCorrect;
    setS(prev => ({ ...prev, answered: true, selIdx: idx, score: correct ? prev.score + 1 : prev.score }));
  };

  const next = () => {
    setS(prev => {
      const nextCur = prev.cur + 1;
      if (nextCur >= prev.order.length) return { ...prev, done: true };
      return { ...prev, cur: nextCur, opts: makeOpts(concepts[prev.order[nextCur]]), answered: false, selIdx: null };
    });
  };

  const restart = () => setS(freshState());

  useEffect(() => {
    if (s.done) onComplete(Math.round((s.score / total) * 100));
  }, [s.done]);

  if (s.done) return (
    <div className="flex flex-col items-center gap-4">
      <div className="bg-white border-2 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm" style={{ borderColor: PRIMARY }}>
        <p className="text-2xl font-bold" style={{ color: PRIMARY_TEXT }}>{s.score} / {total} rätt</p>
        <p className="text-slate-500 mt-2 font-fredoka">{getFeedback(s.score, total)}</p>
        <button onClick={restart} className="w-full mt-6 text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
          Börja om
        </button>
      </div>
    </div>
  );

  const concept = concepts[s.order[s.cur]];

  return (
    <div className="flex flex-col items-center">
      <div className="w-full max-w-lg mb-4">
        <div className="flex justify-between text-xs text-slate-400 font-fredoka mb-1">
          <span>Begrepp {s.cur + 1} av {total}</span>
          <span>Poäng: {s.score}</span>
        </div>
        <div className="w-full bg-slate-200 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all" style={{ width: `${(s.cur / total) * 100}%`, background: PRIMARY }} />
        </div>
      </div>

      <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 w-full max-w-lg">
        <p className="text-xs uppercase tracking-wide text-slate-400 font-fredoka font-bold mb-2">Vilket exempel stämmer på begreppet?</p>
        <p className="text-2xl font-bold mb-5" style={{ color: PRIMARY_TEXT }}>{concept.term}</p>
        <div className="flex flex-col gap-3">
          {s.opts.map((opt, idx) => {
            let optStyle = { borderColor: '#e2e8f0' };
            if (s.answered && opt.isCorrect) optStyle = { background: '#dcfce7', borderColor: '#16a34a' };
            else if (s.answered && idx === s.selIdx && !opt.isCorrect) optStyle = { background: '#fee2e2', borderColor: '#dc2626' };
            return (
              <button
                key={idx}
                onClick={() => handleSelect(idx)}
                disabled={s.answered}
                className="text-left px-4 py-3 rounded-2xl border-2 text-slate-700 leading-relaxed transition-colors"
                style={optStyle}
              >
                <span className="font-bold font-fredoka mr-2">{idx === 0 ? 'A' : 'B'}</span>{opt.text}
              </button>
            );
          })}
        </div>
        {s.answered && (
          <div className="mt-5 p-4 rounded-2xl bg-slate-50 border border-slate-200">
            <p className="text-sm text-slate-600 leading-relaxed">{concept.ickeExempel.forklaring}</p>
            <button onClick={next} className="w-full mt-4 text-white px-6 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
              Nästa →
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// HEADER + NAVIGERING
// ════════════════════════════════════════════════════════════
function Header({ activeView, setActiveView, progress, rank, completedCount, code }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-6 flex-wrap gap-2">
        <a
          href="index.html"
          onClick={(e) => { e.preventDefault(); smartBack('index.html'); }}
          className="text-sm font-semibold transition-colors"
          style={{ color: PRIMARY_TEXT }}
        >
          ← Tillbaka till startsidan
        </a>
        <div className="w-32 hidden sm:block"></div>
      </div>

      <h1 className="text-3xl md:text-4xl font-bold italic text-center uppercase tracking-wide mb-1" style={{ color: PRIMARY_TEXT }}>
        Ekonomisk politik
      </h1>
      <p className="text-center text-slate-400 text-sm mb-6 font-fredoka">Samhällskunskap 1a1 — Begrepp</p>

      {/* Progress + rank */}
      <div className="mb-4">
        <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
          <span className="text-sm font-semibold text-slate-600 font-fredoka">{completedCount}/5 avsnitt klara</span>
          {rank && (
            <span
              className="text-xs font-bold px-2.5 py-1 rounded-full font-fredoka"
              style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
            >
              Rank: {rank} · Kod: {code}
            </span>
          )}
        </div>
        <div className="w-full bg-slate-200 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all" style={{ width: `${(completedCount / 5) * 100}%`, background: PRIMARY }} />
        </div>
      </div>

      {/* Toggle */}
      <div className="view-tabs flex flex-wrap justify-center gap-1 bg-white rounded-full p-1 shadow-sm border border-slate-200 mb-8 font-fredoka text-sm max-w-full overflow-x-auto">
        {VIEWS.map((view) => {
          const active = ACTIVE_VIEWS[view];
          return (
            <button
              key={view}
              disabled={!active}
              onClick={() => active && setActiveView(view)}
              title={!active ? 'Kommer snart' : undefined}
              className={
                'px-4 py-2 rounded-full font-bold transition-colors whitespace-nowrap ' +
                (!active
                  ? 'text-slate-300 cursor-not-allowed'
                  : activeView === view
                    ? 'text-white'
                    : 'text-slate-500 hover:text-slate-700')
              }
              style={activeView === view && active ? { background: PRIMARY } : {}}
            >
              {view}
              {progress.completed[view] && (
                <span className="ml-1" style={{ color: activeView === view ? '#fff' : '#16a34a' }}>✓</span>
              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════
function App() {
  const [activeView, setActiveView] = useState('Lista');
  const [progress, setProgress] = useState(loadProgress);
  const [celebrateRank, setCelebrateRank] = useState(null);
  const prevRankRef = useRef(computeRank(loadProgress()));

  useEffect(() => {
    saveProgress(progress);
  }, [progress]);

  const markComplete = useCallback((view, pct) => {
    setProgress(prev => {
      const nextCompleted = { ...prev.completed };
      const nextBest = { ...prev.best };
      let changed = false;

      if (typeof pct === 'number' && !(nextBest[view] >= pct)) {
        nextBest[view] = pct;
        changed = true;
      }

      const thresholdMet = typeof pct === 'number' ? pct >= 80 : true;
      if (thresholdMet && !nextCompleted[view]) {
        nextCompleted[view] = true;
        changed = true;
      }

      return changed ? { completed: nextCompleted, best: nextBest } : prev;
    });
  }, []);

  const completeLista = useCallback(() => markComplete('Lista'), [markComplete]);
  const completeFlashcards = useCallback(() => markComplete('Flashcards'), [markComplete]);
  const completeLucktext = useCallback((pct) => markComplete('Lucktext', pct), [markComplete]);
  const completeScenario = useCallback((pct) => markComplete('Scenario', pct), [markComplete]);
  const completeIckeEx = useCallback((pct) => markComplete('Icke-ex.', pct), [markComplete]);

  const rank = computeRank(progress);
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  const code = computeVerificationCode(progress, rank);

  useEffect(() => {
    const prevOrder = prevRankRef.current ? RANK_ORDER[prevRankRef.current] : 0;
    const newOrder = rank ? RANK_ORDER[rank] : 0;
    if (newOrder > prevOrder) {
      setCelebrateRank(rank);
      const t = setTimeout(() => setCelebrateRank(null), 2500);
      prevRankRef.current = rank;
      return () => clearTimeout(t);
    }
    prevRankRef.current = rank;
  }, [rank]);

  return (
    <div className="max-w-2xl mx-auto px-4 py-6">
      <Header
        activeView={activeView}
        setActiveView={setActiveView}
        progress={progress}
        rank={rank}
        completedCount={completedCount}
        code={code}
      />

      <div className="pb-16">
        {activeView === 'Lista' && <ListView onComplete={completeLista} />}
        {activeView === 'Flashcards' && <FlashcardView key="flashcards" onComplete={completeFlashcards} />}
        {activeView === 'Lucktext' && <LucktextView onComplete={completeLucktext} />}
        {activeView === 'Scenario' && <ScenarioView onComplete={completeScenario} />}
        {activeView === 'Icke-ex.' && <IckeExempelView onComplete={completeIckeEx} />}
      </div>

      <footer className="text-center text-slate-400 italic text-sm pb-8">
        Källa: Samhällskunskap 1a1 — Ekonomisk politik, begreppslista
      </footer>

      {/* Rank celebration overlay */}
      {celebrateRank && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 px-4"
          style={{ background: 'rgba(15, 23, 42, 0.55)' }}
          onClick={() => setCelebrateRank(null)}
        >
          <div className="bg-white rounded-3xl px-10 py-8 text-center shadow-2xl">
            <div className="text-5xl mb-3">{celebrateRank === 'S' ? '🎉🏆🎉' : '🎉'}</div>
            <p className="text-3xl font-bold" style={{ color: PRIMARY_TEXT }}>{celebrateRank}-RANK!</p>
            <p className="text-slate-400 text-sm mt-2">Ny rank uppnådd</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
    <script src="feedback-widget.js" defer></script>
</body>
