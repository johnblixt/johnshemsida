<script>
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function smartBack(fallbackUrl) {
  try {
    if (document.referrer && new URL(document.referrer).hostname === window.location.hostname) {
      history.back();
      return;
    }
  } catch (e) {}
  window.location.href = fallbackUrl;
}
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const PRIMARY = '#22c55e';
const PRIMARY_LIGHT = '#dcfce7';
const PRIMARY_TEXT = '#14532d';

// ════════════════════════════════════════════════════════════
// BEGREPP — hämtade ordagrant från Ekonomisk_politik_begrepp.md
// (Samhällskunskap 1a1, Ekonomisk politik)
// I denna omgång byggs endast Lista och Flashcards, så fälten
// nedan innehåller bara id/term/definition. Fält för Lucktext,
// Scenario och Icke-ex. (sentence/scenario/ickeExempel/answers)
// läggs till nästa gång dessa vyer byggs ut.
// ════════════════════════════════════════════════════════════
const concepts = [
  { id: 1, term: 'Ekonomisk tillväxt', definition: 'En ökning av värdet på de varor och tjänster som produceras i ett land under en viss tidsperiod. Mäts som ökningen av BNP i procent.' },
  { id: 2, term: 'Konjunktur', definition: 'Beskriver hur ekonomin i ett land varierar mellan perioder av högre tillväxt (högkonjunktur) och med lägre tillväxt eller nedgång (lågkonjunktur).' },
  { id: 3, term: 'Produktivitet', definition: 'Ett mått på hur effektivt man använder resurser för att producera varor eller tjänster, det vill säga hur mycket som produceras per insats, till exempel arbetstimmar.' },
  { id: 4, term: 'Hållbar utveckling (hållbarhet)', definition: 'Handlar om att balansera ekonomiska, sociala och miljömässiga intressen för att skapa en långsiktigt hållbar framtid.' },
  { id: 5, term: 'Offentliga sektorn', definition: 'Den del av samhällsekonomin som sköter de gemensamma uppgifterna, t.ex. skola, sjukvård och polis, och finansieras av skatter. Består av staten, regionerna och kommunerna.' },
  { id: 6, term: 'Skatter och avgifter', definition: 'Pengar som betalas in till offentliga sektorn för att finansiera dess verksamhet. Medan skatterna ramlar rakt ner i offentliga sektorns kassakista, är avgifter det vi betalar för att utnyttja offentliga tjänster, exempelvis åka buss eller besöka en läkare.' },
  { id: 7, term: 'Skattekvot (skattetryck)', definition: 'Andelen av ett lands totala inkomster som betalas i skatt, uttryckt som en procentandel av landets BNP.' },
  { id: 8, term: 'Budgetproposition', definition: 'Regeringens förslag till riksdagen om hur statens inkomster och utgifter (statsbudgeten) förväntas bli under nästkommande år.' },
  { id: 9, term: 'Statsskulden', definition: 'Den skuld staten har genom de lån som tagits för att täcka underskott i statsbudgeten.' },
  { id: 10, term: 'Riksgälden', definition: 'Den myndighet som sköter statens upplåning och förvaltar statsskulden.' },
  { id: 11, term: 'Finanssektorn', definition: 'Den del av samhällsekonomin som tillhandahåller pengar.' },
  { id: 12, term: 'Kreditmarknaden', definition: 'Den del av samhällsekonomin som samlar in samhällets kapitalöverskott (sparmedel) och sedan lånar ut dessa pengar i form av krediter (lån).' },
  { id: 13, term: 'Ränta', definition: 'Priset på pengar. Inlåningsränta är den ersättning sparare får och utlåningsränta är det pris som låntagarna betalar.' },
  { id: 14, term: 'Riksbanken (Sveriges riksbank)', definition: 'Sveriges centralbank, ger ut pengar och ser till att betalningssystemet fungerar. Riksbanken ansvarar också för penningpolitiken. Riksbanken agerar självständigt, men lyder formellt under riksdagen.' },
  { id: 15, term: 'Samhällsekonomiska mål', definition: 'De tre övergripande målen: hållbar tillväxt, samhällsekonomisk balans och rättvis inkomstfördelning.' },
  { id: 16, term: 'Ekonomisk politik', definition: 'De insatser som staten gör för att få samhällsekonomin att fungera väl. Består av tre delar: tillväxtpolitik, stabiliseringspolitik och fördelningspolitik.' },
  { id: 17, term: 'Stabiliseringspolitik', definition: 'De insatser staten gör för att dämpa konjunktursvängningar och därmed stabilisera samhällsekonomin. Stabiliseringspolitiken försöker vara kontracyklisk, det vill säga gå emot (kontra) konjunktursvängningarna. Målet är prisstabilitet (låg inflation) och hög sysselsättning (låg arbetslöshet).' },
  { id: 18, term: 'Penningpolitik (räntepolitik)', definition: 'Är den politik som påverkar räntenivån, tillgången på pengar och inflationstakten i samhällsekonomin. Det är Riksbanken som ansvarar för penningpolitiken.' },
  { id: 19, term: 'Finanspolitik (budgetpolitik)', definition: 'Är den politik som använder statens finanser (statsbudgeten) för att stabilisera ekonomin. Det är regeringen (främst finansministern) som sköter finanspolitiken.' },
  { id: 20, term: 'Inflationsmål', definition: 'Det mål en centralbank sätter för hur hög inflationen bör vara för att hålla ekonomin stabil. Genom att ändra sin styrränta kan centralbanken påverka inflationstakten i ekonomin.' },
];

function getFeedback(score, total) {
  const p = score / total;
  if (p >= 0.9) return 'Redo för provet! Fantastiskt bra!';
  if (p >= 0.7) return 'Bra jobbat! Öva lite till på de du missade.';
  if (p >= 0.5) return 'Halvvägs! Fortsätt träna.';
  return 'Öva lite till – du är på rätt väg!';
}

// ════════════════════════════════════════════════════════════
// PROGRESS- OCH RANK-SYSTEM (sessionStorage, ingen backend)
// ════════════════════════════════════════════════════════════
const VIEWS = ['Lista', 'Flashcards', 'Lucktext', 'Scenario', 'Icke-ex.'];
const ACTIVE_VIEWS = { 'Lista': true, 'Flashcards': true, 'Lucktext': false, 'Scenario': false, 'Icke-ex.': false };
const SCORE_VIEWS = ['Lucktext', 'Scenario', 'Icke-ex.'];
const PROGRESS_KEY = 'sh1a1_ekonomisk_politik_progress';
const RANK_SALT = 'sh1a1ekonomiskpolitiksakerhet';
const RANK_ORDER = { D: 1, C: 2, B: 3, A: 4, S: 5 };

function loadProgress() {
  try {
    const raw = sessionStorage.getItem(PROGRESS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { completed: {}, best: {} };
}

function saveProgress(progress) {
  try {
    sessionStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  } catch (e) {}
}

function computeRank(progress) {
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  if (completedCount === 0) return null;
  if (completedCount === 5) {
    const allPerfect = SCORE_VIEWS.every(v => (progress.best[v] || 0) >= 100);
    return allPerfect ? 'S' : 'A';
  }
  if (completedCount === 4) return 'A';
  if (completedCount === 3) return 'B';
  if (completedCount === 2) return 'C';
  return 'D';
}

function computeVerificationCode(progress, rank) {
  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const completedViews = VIEWS.filter(v => progress.completed[v]).sort().join(',');
  const input = dateStr + '|' + completedViews + '|' + (rank || '-') + '|' + RANK_SALT;
  let hash = 0;
  for (let i = 0; i < input.length; i++) {
    hash = (hash + input.charCodeAt(i) * (i + 1)) % 1679616; // 36^4
  }
  return 'SH1A1EKP-' + hash.toString(36).toUpperCase().padStart(4, '0');
}

function ListView({ onComplete }) {
  const [query, setQuery] = useState('');
  const sentinelRef = useRef(null);

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) onComplete();
    }, { threshold: 1.0 });
    observer.observe(el);
    return () => observer.disconnect();
  }, [onComplete]);

  const filtered = concepts.filter(c =>
    c.term.toLowerCase().includes(query.toLowerCase()) ||
    c.definition.toLowerCase().includes(query.toLowerCase())
  );

  return (
    <div>
      <input
        type="text"
        value={query}
        onChange={e => setQuery(e.target.value)}
        placeholder="🔍 Sök begrepp eller definition..."
        className="w-full mb-6 px-5 py-3 rounded-2xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 text-lg"
        style={{ '--tw-ring-color': PRIMARY }}
      />
      <div className="flex flex-col gap-3">
        {filtered.map((c) => (
          <div
            key={c.id}
            className="bg-white rounded-2xl shadow-sm p-5 border-l-8 hover:shadow-md transition-shadow"
            style={{ borderColor: PRIMARY }}
          >
            <div className="flex items-start gap-3">
              <span
                className="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold font-fredoka mt-0.5"
                style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}
              >
                {c.id}
              </span>
              <div>
                <p className="font-bold text-lg text-slate-800">{c.term}</p>
                <p className="text-slate-500 mt-1 leading-relaxed">{c.definition}</p>
              </div>
            </div>
          </div>
        ))}
        {filtered.length === 0 && (
          <p className="text-center text-slate-400 mt-8">Inga begrepp matchade sökningen.</p>
        )}
      </div>
      <div ref={sentinelRef} style={{ height: 1 }} />
    </div>
  );
}

function FlashcardView({ onComplete }) {
  const total = concepts.length;
  const [deck, setDeck] = useState(() => shuffleArray(concepts));
  const [deckIdx, setDeckIdx] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [kudeInte, setKudeInte] = useState([]);
  const [kunde, setKunde] = useState([]);
  const [phase, setPhase] = useState('playing'); // 'playing' | 'roundEnd' | 'allDone'

  const restartAll = () => {
    setDeck(shuffleArray(concepts));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setKunde([]);
    setPhase('playing');
  };

  const sort = (pile) => {
    const card = deck[deckIdx];
    const newKudeInte = pile === 'kudeInte' ? [...kudeInte, card] : kudeInte;
    const newKunde    = pile === 'kunde'    ? [...kunde, card]    : kunde;
    const nextIdx = deckIdx + 1;
    setKudeInte(newKudeInte);
    setKunde(newKunde);
    setIsFlipped(false);
    if (nextIdx >= deck.length) {
      setDeckIdx(nextIdx);
      setPhase(newKudeInte.length === 0 ? 'allDone' : 'roundEnd');
      onComplete();
    } else {
      setDeckIdx(nextIdx);
    }
  };

  const nextRound = () => {
    setDeck(shuffleArray(kudeInte));
    setDeckIdx(0);
    setIsFlipped(false);
    setKudeInte([]);
    setPhase('playing');
  };

  if (phase === 'allDone') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-green-50 border-2 border-green-400 rounded-3xl p-8 text-center w-full max-w-sm">
        <div className="text-5xl mb-4">🎉</div>
        <p className="text-2xl font-bold text-green-700 mb-2">Alla kort klarade!</p>
        <p className="text-slate-600 mb-6">Du behärskar <span className="font-bold text-green-700">{kunde.length} av {total}</span> begrepp.</p>
        <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
          Börja om med alla
        </button>
      </div>
    </div>
  );

  if (phase === 'roundEnd') return (
    <div className="flex flex-col items-center gap-6">
      <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 text-center w-full max-w-sm shadow-sm">
        <p className="text-lg font-bold text-slate-700 mb-4">Runda klar!</p>
        <div className="flex justify-center gap-8 mb-6">
          <div className="text-center">
            <p className="text-3xl font-bold text-green-600">{kunde.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde</p>
          </div>
          <div className="text-center">
            <p className="text-3xl font-bold text-red-500">{kudeInte.length}</p>
            <p className="text-xs text-slate-400 uppercase tracking-wide mt-1 font-fredoka">Kunde inte</p>
          </div>
        </div>
        <div className="flex flex-col gap-3">
          <button onClick={nextRound} className="w-full bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold font-fredoka hover:bg-slate-800 transition-colors">
            Öva på Kunde inte ({kudeInte.length} kort) →
          </button>
          <button onClick={restartAll} className="w-full text-white px-8 py-3 rounded-2xl font-bold font-fredoka transition-colors" style={{ background: PRIMARY }}>
            Börja om med alla
          </button>
        </div>
      </div>
    </div>
  );

  const card = deck[deckIdx];
  const remaining = deck.length - deckIdx;

  return (
    <div className="flex flex-col items-center">
      <div className="flex gap-3 mb-5 w-full max-w-sm">
        <div className="flex-1 bg-red-50 border border-red-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-red-500">{kudeInte.length}</p>
          <p className="text-[10px] text-red-400 uppercase tracking-wide font-bold font-fredoka">Kunde inte</p>
        </div>
        <div className="flex-1 bg-slate-100 border border-slate-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-slate-400">{remaining}</p>
          <p className="text-[10px] text-slate-400 uppercase tracking-wide font-bold font-fredoka">Kvar</p>
        </div>
        <div className="flex-1 bg-green-50 border border-green-200 rounded-xl p-2 text-center">
          <p className="text-xl font-bold text-green-500">{kunde.length}</p>
          <p className="text-[10px] text-green-400 uppercase tracking-wide font-bold font-fredoka">Kunde</p>
        </div>
      </div>
      <div className="flip-card mb-5" onClick={() => setIsFlipped(!isFlipped)}>
        <div className={`flip-card-inner ${isFlipped ? 'flipped-classes' : ''}`}>
          <div className="flip-card-front" style={{ background: PRIMARY }}>
            <h2 className="text-2xl font-bold text-white text-center px-4">{card.term}</h2>
            <div className="absolute bottom-6 animate-pulse">
              <span className="text-[10px] uppercase tracking-[0.2em] text-white font-bold opacity-70 font-fredoka">Klicka för svar</span>
            </div>
          </div>
          <div className="flip-card-back bg-white" style={{ border: `2px solid ${PRIMARY}` }}>
            <p className="text-xl leading-relaxed text-slate-800 font-medium px-4">{card.definition}</p>
            <div className="absolute bottom-6">
              <span className="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold font-fredoka">Klicka för att vända</span>
            </div>
          </div>
        </div>
      </div>
      {isFlipped && (
        <div className="flex gap-3 w-full max-w-sm mb-4">
          <button onClick={() => sort('kudeInte')} className="flex-1 bg-red-100 text-red-700 border-2 border-red-300 font-bold font-fredoka py-3 rounded-2xl hover:bg-red-200 active:scale-95 transition-all">
            ✗ Kunde inte
          </button>
          <button onClick={() => sort('kunde')} className="flex-1 bg-green-100 text-green-700 border-2 border-green-300 font-bold font-fredoka py-3 rounded-2xl hover:bg-green-200 active:scale-95 transition-all">
            ✓ Kunde
          </button>
        </div>
      )}
      <div className="flex flex-col items-center gap-2 mt-1">
        <p className="text-slate-500 font-medium bg-slate-200 px-4 py-1 rounded-full text-xs font-fredoka">{deckIdx + 1} av {deck.length}</p>
        <button onClick={restartAll} className="text-slate-400 text-xs hover:text-slate-600 transition-colors underline font-fredoka">↺ Börja om med alla</button>
      </div>
    </div>
  );
}

      <p className="text-center text-slate-400 text-sm mb-6 font-fredoka">Samhällskunskap 1a1 — Begrepp</p>

      {/* Progress + rank */}
      <div className="mb-4">
        <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
          <span className="text-sm font-semibold text-slate-600 font-fredoka">{completedCount}/5 avsnitt klara</span>
          {rank && (
            <span

              style={{ background: PRIMARY_LIGHT, color: PRIMARY_TEXT }}

            </span>
          )}
        </div>
        <div className="w-full bg-slate-200 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all" style={{ width: `${(completedCount / 5) * 100}%`, background: PRIMARY }} />
        </div>
      </div>

      {/* Toggle */}
      <div className="view-tabs flex flex-wrap justify-center gap-1 bg-white rounded-full p-1 shadow-sm border border-slate-200 mb-8 font-fredoka text-sm max-w-full overflow-x-auto">
        {VIEWS.map((view) => {
          const active = ACTIVE_VIEWS[view];
          return (
            <button
              key={view}
              disabled={!active}
              onClick={() => active && setActiveView(view)}
              title={!active ? 'Kommer snart' : undefined}
              className={
                'px-4 py-2 rounded-full font-bold transition-colors whitespace-nowrap ' +
                (!active
                  ? 'text-slate-300 cursor-not-allowed'

              )}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// APP
// ════════════════════════════════════════════════════════════
function App() {
  const [activeView, setActiveView] = useState('Lista');
  const [progress, setProgress] = useState(loadProgress);
  const [celebrateRank, setCelebrateRank] = useState(null);
  const prevRankRef = useRef(computeRank(loadProgress()));

  useEffect(() => {
    saveProgress(progress);
  }, [progress]);

  const markComplete = useCallback((view, pct) => {
    setProgress(prev => {
      const nextCompleted = { ...prev.completed };
      const nextBest = { ...prev.best };
      let changed = false;

      if (typeof pct === 'number' && !(nextBest[view] >= pct)) {
        nextBest[view] = pct;
        changed = true;
      }

      const thresholdMet = typeof pct === 'number' ? pct >= 80 : true;
      if (thresholdMet && !nextCompleted[view]) {
        nextCompleted[view] = true;
        changed = true;
      }

      return changed ? { completed: nextCompleted, best: nextBest } : prev;
    });
  }, []);

  const completeLista = useCallback(() => markComplete('Lista'), [markComplete]);
  const completeFlashcards = useCallback(() => markComplete('Flashcards'), [markComplete]);
  const completeLucktext = useCallback((pct) => markComplete('Lucktext', pct), [markComplete]);
  const completeScenario = useCallback((pct) => markComplete('Scenario', pct), [markComplete]);
  const completeIckeEx = useCallback((pct) => markComplete('Icke-ex.', pct), [markComplete]);

  const rank = computeRank(progress);
  const completedCount = VIEWS.filter(v => progress.completed[v]).length;
  const code = computeVerificationCode(progress, rank);

  useEffect(() => {
    const prevOrder = prevRankRef.current ? RANK_ORDER[prevRankRef.current] : 0;
    const newOrder = rank ? RANK_ORDER[rank] : 0;
    if (newOrder > prevOrder) {
      setCelebrateRank(rank);
      const t = setTimeout(() => setCelebrateRank(null), 2500);
      prevRankRef.current = rank;
      return () => clearTimeout(t);
    }
    prevRankRef.current = rank;
  }, [rank]);

  return (
    <div className="max-w-2xl mx-auto px-4 py-6">
      <Header
        activeView={activeView}
        setActiveView={setActiveView}
        progress={progress}
        rank={rank}
        completedCount={completedCount}
        code={code}
      />

      <div className="pb-16">
        {activeView === 'Lista' && <ListView onComplete={completeLista} />}
        {activeView === 'Flashcards' && <FlashcardView key="flashcards" onComplete={completeFlashcards} />}
        {activeView === 'Lucktext' && <LucktextView onComplete={completeLucktext} />}
        {activeView === 'Scenario' && <ScenarioView onComplete={completeScenario} />}
        {activeView === 'Icke-ex.' && <IckeExempelView onComplete={completeIckeEx} />}
      </div>

      <footer className="text-center text-slate-400 italic text-sm pb-8">
        Källa: Samhällskunskap 1a1 — Ekonomisk politik, begreppslista
      </footer>

      {/* Rank celebration overlay */}
      {celebrateRank && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 px-4"
          style={{ background: 'rgba(15, 23, 42, 0.55)' }}
          onClick={() => setCelebrateRank(null)}
        >
          <div className="bg-white rounded-3xl px-10 py-8 text-center shadow-2xl">
            <div className="text-5xl mb-3">{celebrateRank === 'S' ? '🎉🏆🎉' : '🎉'}</div>
            <p className="text-3xl font-bold" style={{ color: PRIMARY_TEXT }}>{celebrateRank}-RANK!</p>
            <p className="text-slate-400 text-sm mt-2">Ny rank uppnådd</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
